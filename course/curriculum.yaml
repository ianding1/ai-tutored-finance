# Course outline. Single source of truth for lesson order, titles, slugs and publication status.
# Order in this file = teaching order. Concept-order checks use it.
#
# Lesson fields:
#   id:          lesson number, e.g. "0.3" (comprehensive quizzes use "T1", "T2", "T3"; each covers several stages)
#   slug:        URL slug under /lessons/ (same in every language)
#   title:       { zh, en }
#   summary:     { zh, en } one sentence, used in link previews and prompts (required when published)
#   published:   true when the lesson page exists in every language
#   introduces:  concept ids defined in this lesson (see concepts.yaml) — published lessons only
#   uses:        concept ids from earlier lessons that this lesson relies on — published lessons only

stages:
  - id: "0"
    title: { zh-cn: "第 0 阶段：数学与统计工具", en: "Stage 0: Math and Statistics Tools" }
    lessons:
      - id: "0.1"
        slug: "0-1-time-value-of-money"
        title: { zh-cn: "复利与货币时间价值", en: "Compounding and the Time Value of Money" }
        summary:
          zh-cn: "把不同时间的现金流折算到同一时点：终值与现值、APR 与 EAR、年金、永续年金、房贷，以及简单收益率与对数收益率。"
          en: "Move cash flows at different times to the same date: future and present value, APR and EAR, annuities, perpetuities, mortgages, and simple and log returns."
        published: true
        introduces: [time-value-of-money, compound-interest, future-value, present-value, discount-factor, apr, ear, continuous-compounding, annuity, perpetuity, annuity-due, growing-perpetuity, simple-return, log-return]
        uses: [logarithm, geometric-series, derivative]
      - id: "0.2"
        slug: "0-2-optimization"
        title: { zh-cn: "优化", en: "Optimization" }
        summary:
          zh-cn: "用导数求最优：一阶与二阶条件、利润最大化与固定成本、偏导数，以及带预算约束的拉格朗日乘数法与角点解。"
          en: "Find optima with derivatives: first- and second-order conditions, profit maximization and fixed cost, partial derivatives, and the Lagrange multiplier method with a budget constraint, including corner solutions."
        published: true
        introduces: [objective-function, first-order-condition, second-order-condition, fixed-cost, variable-cost, marginal-revenue, marginal-cost, profit-maximization, sunk-cost, partial-derivative, budget-constraint, lagrange-multiplier, shadow-price, corner-solution]
        uses: [derivative]
      - id: "0.3"
        slug: "0-3-probability"
        title: { zh-cn: "概率：期望、方差、协方差与组合方差", en: "Probability: Expectation, Variance, Covariance and Portfolio Variance" }
        summary:
          zh-cn: "用情景表描述投资收益，计算期望、方差、协方差，推导两资产组合的方差公式，并解释分散化的来源。"
          en: "Describe investment returns with a scenario table, compute expectation, variance and covariance, derive the variance of a two-asset portfolio, and explain where diversification comes from."
        published: true
        introduces: [random-variable, expected-value, variance, standard-deviation, covariance, correlation, portfolio-variance, diversification]
        uses: [summation]
      - id: "0.4"
        slug: "0-4-distributions-inference"
        title: { zh-cn: "分布与统计推断", en: "Distributions and Statistical Inference" }
        summary:
          zh-cn: "正态分布与肥尾，连乘财富的均值与中位数，以及从数据估计：样本标准差、标准误、置信区间与假设检验。"
          en: "The normal distribution and fat tails, the mean and median of compounding wealth, and estimating from data: sample standard deviation, standard error, confidence intervals and hypothesis tests."
        published: true
        introduces: [probability-density, normal-distribution, z-score, fat-tails, median, right-skew, lognormal-distribution, parameter-estimation, sample-mean, sample-standard-deviation, degrees-of-freedom, standard-error, central-limit-theorem, confidence-interval, t-distribution, hypothesis-test, t-statistic, statistical-significance, multiple-testing]
        uses: [random-variable, expected-value, variance, standard-deviation, covariance, portfolio-variance, log-return]
      - id: "0.5"
        slug: "0-5-regression"
        title: { zh-cn: "回归", en: "Regression" }
        summary:
          zh-cn: "用一条直线描述两个变量的关系：普通最小二乘法、系数的含义、R²、系数的标准误，以及遗漏变量偏差和相关与因果。"
          en: "Describe the relation between two variables with a line: ordinary least squares, what the coefficients mean, R², the standard error of a coefficient, omitted variable bias, and correlation and causation."
        published: true
        introduces: [regression, ols, residual, regression-coefficient, r-squared, omitted-variable-bias, correlation-vs-causation]
        uses: [covariance, correlation, variance, first-order-condition, partial-derivative, standard-error, t-statistic, confidence-interval, degrees-of-freedom, multiple-testing]

  - id: "1"
    title: { zh-cn: "第 1 阶段：微观经济学", en: "Stage 1: Microeconomics" }
    lessons:
      - id: "1.1"
        slug: "1-1-supply-demand"
        title: { zh-cn: "供给与需求", en: "Supply and Demand" }
        summary:
          zh-cn: "需求与供给、市场均衡、用比较静态分析条件变化的影响，以及价格弹性、收入弹性和交叉价格弹性。"
          en: "Demand and supply, market equilibrium, comparative statics for the effects of changing conditions, and the price, income and cross-price elasticities."
        published: true
        introduces: [demand, supply, market-equilibrium, comparative-statics, price-elasticity, income-elasticity, cross-price-elasticity]
        uses: [derivative, first-order-condition, marginal-revenue, marginal-cost]
      - id: "1.2"
        slug: "1-2-consumer-theory"
        title: { zh-cn: "消费者理论", en: "Consumer Theory" }
        summary:
          zh-cn: "偏好与效用函数、无差异曲线与边际替代率、预算约束下的最优选择，以及价格变化的替代效应与收入效应（Slutsky 分解）。"
          en: "Preferences and utility functions, indifference curves and the marginal rate of substitution, the best choice under a budget constraint, and the substitution and income effects of a price change (the Slutsky decomposition)."
        published: true
        introduces: [preferences, utility-function, marginal-utility, indifference-curve, marginal-rate-of-substitution, substitution-effect, income-effect, slutsky-equation, giffen-good]
        uses: [demand, income-elasticity, budget-constraint, corner-solution, partial-derivative, lagrange-multiplier, first-order-condition, derivative]
      - id: "1.3"
        slug: "1-3-intertemporal-choice"
        title: { zh-cn: "跨期选择", en: "Intertemporal Choice" }
        summary:
          zh-cn: "两期消费模型（Fisher 模型）：跨期预算约束、时间偏好、Euler 方程与消费平滑，利率变化对储蓄的替代效应与收入效应，以及名义利率与实际利率。"
          en: "The two-period consumption model (the Fisher model): the intertemporal budget constraint, time preference, the Euler equation and consumption smoothing, the substitution and income effects of interest rates on saving, and nominal and real interest rates."
        published: true
        introduces: [intertemporal-budget-constraint, time-preference, euler-equation, consumption-smoothing, inflation, nominal-interest-rate, real-interest-rate, fisher-equation]
        uses: [present-value, compound-interest, apr, marginal-rate-of-substitution, indifference-curve, substitution-effect, income-effect, budget-constraint, first-order-condition, logarithm, derivative]
      - id: "1.4"
        slug: "1-4-choice-under-uncertainty"
        title: { zh-cn: "不确定性下的选择", en: "Choice Under Uncertainty" }
        summary:
          zh-cn: "期望效用、风险厌恶、确定性等价与风险溢价、保险的经济学，以及金融学中最常用的 CRRA 效用函数。"
          en: "Expected utility, risk aversion, the certainty equivalent and the risk premium, the economics of insurance, and CRRA utility, the most common utility function in finance."
        published: true
        introduces: [expected-utility, risk-aversion, absolute-risk-aversion, relative-risk-aversion, certainty-equivalent, risk-premium, crra-utility]
        uses: [expected-value, variance, random-variable, utility-function, standard-error, median, logarithm, derivative, first-order-condition]
      - id: "1.5"
        slug: "1-5-producer-theory"
        title: { zh-cn: "生产者理论", en: "Producer Theory" }
        summary:
          zh-cn: "生产函数、边际产量与规模报酬，短期成本曲线，完全竞争厂商的产量与停产决策，以及长期均衡与经济利润。"
          en: "Production functions, marginal products and returns to scale, short-run cost curves, the output and shutdown decisions of a competitive firm, and long-run equilibrium and economic profit."
        published: true
        introduces: [production-function, short-run, long-run, marginal-product, returns-to-scale, average-cost, perfect-competition, shutdown-point, economic-profit]
        uses: [fixed-cost, variable-cost, marginal-cost, marginal-revenue, profit-maximization, sunk-cost, partial-derivative, first-order-condition, second-order-condition, supply, demand, market-equilibrium]
      - id: "1.6"
        slug: "1-6-market-structure"
        title: { zh-cn: "市场结构", en: "Market Structure" }
        summary:
          zh-cn: "垄断与定价能力、价格歧视、寡头竞争（古诺与伯特兰）、垄断竞争，以及进入壁垒与护城河对长期利润的意义。"
          en: "Monopoly and market power, price discrimination, oligopoly (Cournot and Bertrand), monopolistic competition, and what barriers to entry and moats mean for long-run profit."
        published: true
        introduces: [monopoly, lerner-index, price-discrimination, oligopoly, cournot-model, bertrand-model, monopolistic-competition, barriers-to-entry, natural-monopoly, economic-moat]
        uses: [marginal-revenue, marginal-cost, profit-maximization, price-elasticity, demand, perfect-competition, economic-profit, long-run, returns-to-scale, average-cost, fixed-cost, first-order-condition]
      - id: "1.7"
        slug: "1-7-game-theory"
        title: { zh-cn: "博弈论基础", en: "Basic Game Theory" }
        summary:
          zh-cn: "收益相互依赖时怎样分析决策：收益矩阵、占优策略与囚徒困境、纳什均衡、先后行动与倒推法，以及重复博弈中的合作。"
          en: "How to analyze decisions when payoffs depend on each other: payoff matrices, dominant strategies and the prisoner's dilemma, Nash equilibrium, sequential moves and backward induction, and cooperation in repeated games."
        published: true
        introduces: [game, dominant-strategy, prisoners-dilemma, nash-equilibrium, backward-induction, repeated-game]
        uses: [oligopoly, cournot-model, barriers-to-entry, discount-factor, perpetuity, perfect-competition]
      - id: "1.8"
        slug: "1-8-welfare-market-failure"
        title: { zh-cn: "福利与市场失灵", en: "Welfare and Market Failure" }
        summary:
          zh-cn: "用消费者剩余和生产者剩余度量市场带来的好处；无谓损失、税收归宿，以及外部性和公共品为什么会使市场的结果偏离最优。"
          en: "Measuring the gains from a market with consumer and producer surplus; deadweight loss, tax incidence, and why externalities and public goods make market outcomes fall short of the best."
        published: true
        introduces: [consumer-surplus, producer-surplus, deadweight-loss, tax-incidence, externality, pigouvian-tax, public-good]
        uses: [demand, supply, market-equilibrium, marginal-cost, perfect-competition, monopoly, price-elasticity, nash-equilibrium, prisoners-dilemma, dominant-strategy]
      - id: "1.9"
        slug: "1-9-information-economics"
        title: { zh-cn: "信息经济学", en: "Information Economics" }
        summary:
          zh-cn: "一方知道得比另一方多时，市场会怎样：逆向选择与柠檬市场、信号传递与筛选、道德风险，以及公司治理和资产管理中的委托–代理问题。"
          en: "What happens when one side knows more than the other: adverse selection and the market for lemons, signaling and screening, moral hazard, and the principal-agent problem in corporate governance and asset management."
        published: true
        introduces: [asymmetric-information, adverse-selection, signaling, screening, moral-hazard, principal-agent-problem]
        uses: [expected-value, consumer-surplus, externality, risk-aversion, future-value, first-order-condition]

  - id: "2"
    title: { zh-cn: "第 2 阶段：宏观经济学", en: "Stage 2: Macroeconomics" }
    lessons:
      - id: "2.1"
        slug: "2-1-macro-data"
        title: { zh-cn: "宏观数据", en: "Macroeconomic Data" }
        summary:
          zh-cn: "怎样度量一个经济的总产出、物价和就业：GDP 的含义与支出法、名义与实际 GDP、CPI 与 PCE、失业率与劳动参与率，以及怎样读数据发布。"
          en: "How to measure an economy's output, prices and employment: what GDP is and the expenditure approach, nominal and real GDP, CPI and PCE, unemployment and labor force participation, and how to read data releases."
        published: true
        introduces: [gdp, real-gdp, gdp-deflator, cpi, pce-price-index, core-inflation, unemployment-rate, labor-force-participation-rate]
        uses: [compound-interest, inflation, substitution-effect, utility-function]
      - id: "2.2"
        slug: "2-2-long-run-growth"
        title: { zh-cn: "长期增长", en: "Long-Run Growth" }
        summary:
          zh-cn: "长期中什么决定一个经济的人均产出：总量生产函数、全要素生产率、增长核算、Solow 模型与稳态，以及经济增长与长期股票收益的关系。"
          en: "What determines an economy's output per worker in the long run: the aggregate production function, total factor productivity, growth accounting, the Solow model and the steady state, and how economic growth relates to long-run stock returns."
        published: true
        introduces: [total-factor-productivity, growth-accounting, solow-model, steady-state]
        uses: [compound-interest, returns-to-scale, marginal-product, real-gdp, growing-perpetuity, first-order-condition, production-function]
      - id: "2.3"
        slug: "2-3-money-banking"
        title: { zh-cn: "货币与银行", en: "Money and Banking" }
        summary:
          zh-cn: "货币是什么、怎样度量；银行怎样创造货币，货币乘数和它在今天的局限；银行挤兑与存款保险；货币数量论；通胀的成本。"
          en: "What money is and how it is measured; how banks create money, the money multiplier and its limits today; bank runs and deposit insurance; the quantity theory of money; the costs of inflation."
        published: true
        introduces: [money-supply, monetary-base, fractional-reserve-banking, money-multiplier, bank-run, deposit-insurance, quantity-theory-of-money]
        uses: [inflation, fisher-equation, nominal-interest-rate, real-interest-rate, present-value, moral-hazard, prisoners-dilemma, real-gdp, growth-accounting]
      - id: "2.4"
        slug: "2-4-short-run-fluctuations"
        title: { zh-cn: "短期波动", en: "Short-Run Fluctuations" }
        summary:
          zh-cn: "短期中产出为什么会偏离潜在水平：价格粘性与产出缺口、IS 曲线与利率、总需求与总供给、需求冲击与供给冲击、Phillips 曲线与通胀预期。"
          en: "Why output deviates from its potential in the short run: sticky prices and the output gap, the IS curve and interest rates, aggregate demand and aggregate supply, demand and supply shocks, the Phillips curve and inflation expectations."
        published: true
        introduces: [potential-output, output-gap, is-curve, aggregate-demand, aggregate-supply, natural-rate-of-unemployment, phillips-curve]
        uses: [present-value, real-interest-rate, inflation, unemployment-rate, gdp, real-gdp, demand, supply, market-equilibrium, total-factor-productivity]
      - id: "2.5"
        slug: "2-5-monetary-policy"
        title: { zh-cn: "货币政策", en: "Monetary Policy" }
        summary:
          zh-cn: "美联储的目标和工具：联邦基金利率与准备金充裕框架、量化宽松与前瞻指引、Taylor 规则、货币政策的传导，以及市场怎样对央行作出反应。"
          en: "The Fed's goals and tools: the federal funds rate and the ample-reserves framework, quantitative easing and forward guidance, the Taylor rule, how monetary policy is transmitted, and how markets react to the central bank."
        published: true
        introduces: [federal-funds-rate, zero-lower-bound, quantitative-easing, forward-guidance, taylor-rule, neutral-interest-rate]
        uses: [present-value, annuity, growing-perpetuity, fisher-equation, real-interest-rate, inflation, pce-price-index, output-gap, aggregate-demand, phillips-curve, natural-rate-of-unemployment, unemployment-rate]
      - id: "2.6"
        slug: "2-6-fiscal-policy"
        title: { zh-cn: "财政政策", en: "Fiscal Policy" }
        summary:
          zh-cn: "政府的收支、赤字和债务；财政乘数与自动稳定器；挤出效应；债务的可持续性；Ricardo 等价。"
          en: "Government revenue, spending, deficits and debt; fiscal multipliers and automatic stabilizers; crowding out; debt sustainability; Ricardian equivalence."
        published: true
        introduces: [budget-deficit, primary-deficit, fiscal-multiplier, automatic-stabilizer, crowding-out, ricardian-equivalence]
        uses: [present-value, deadweight-loss, gdp, inflation, is-curve, aggregate-demand, potential-output, zero-lower-bound, solow-model, steady-state]
      - id: "2.7"
        slug: "2-7-open-economy"
        title: { zh-cn: "开放经济", en: "The Open Economy" }
        summary:
          zh-cn: "国际收支与经常账户、储蓄和投资的关系；名义与实际汇率；购买力平价；抛补与非抛补利率平价；投资外国资产的汇率风险与对冲。"
          en: "The balance of payments and the current account, and how they relate to saving and investment; nominal and real exchange rates; purchasing power parity; covered and uncovered interest parity; currency risk and hedging in foreign investments."
        published: true
        introduces: [current-account, nominal-exchange-rate, real-exchange-rate, purchasing-power-parity, covered-interest-parity, uncovered-interest-parity, currency-hedging]
        uses: [variance, standard-deviation, correlation, fisher-equation, inflation, gdp, budget-deficit, federal-funds-rate]
      - id: "2.8"
        slug: "2-8-business-cycle-asset-prices"
        title: { zh-cn: "经济周期与资产价格", en: "Business Cycles and Asset Prices" }
        summary:
          zh-cn: "经济周期与衰退的认定；领先、同步和滞后指标；收益率曲线倒挂；资产在周期中的表现；股债相关性为什么取决于通胀。"
          en: "Business cycles and how recessions are dated; leading, coincident and lagging indicators; yield curve inversion; how assets behave over the cycle; why the stock–bond correlation depends on inflation."
        published: true
        introduces: [business-cycle, recession, leading-indicator, yield-curve, stock-bond-correlation]
        uses: [present-value, correlation, portfolio-variance, diversification, unemployment-rate, potential-output, aggregate-demand, aggregate-supply, forward-guidance, taylor-rule, inflation]
      - id: "T1"
        slug: "t1-quiz"
        exam: true
        title: { zh-cn: "综合测验一：数学、微观与宏观基础", en: "Comprehensive Quiz 1: Foundations in Math, Micro and Macro" }
        summary:
          zh-cn: "第 0–2 阶段的综合测验：在具体情境中认出适用的概念，建立简单的模型并得出结论。建议用时 150 分钟。"
          en: "The comprehensive quiz for Stages 0–2: recognize the concepts that apply in a situation, build a simple model and draw the conclusion. About 150 minutes."
        published: true
        introduces: []
        uses: [nominal-interest-rate, real-interest-rate, fisher-equation, inflation, risk-aversion, portfolio-variance, covariance, risk-premium, regression-coefficient, correlation-vs-causation, real-gdp, business-cycle, log-return, sample-mean, standard-error, variance, automatic-stabilizer, expected-utility, primary-deficit, budget-deficit, present-value, annuity, bank-run, deposit-insurance, nash-equilibrium, adverse-selection, asymmetric-information, fiscal-multiplier, consumption-smoothing, ricardian-equivalence, principal-agent-problem, moral-hazard, crra-utility, certainty-equivalent, phillips-curve, natural-rate-of-unemployment, tax-incidence, perfect-competition, short-run, long-run, economic-profit]

  - id: "3"
    title: { zh-cn: "第 3 阶段：金融市场与证券估值", en: "Stage 3: Financial Markets and Security Valuation" }
    lessons:
      - id: "3.1"
        slug: "3-1-financial-system"
        title: { zh-cn: "金融体系概览", en: "Overview of the Financial System" }
        summary:
          zh-cn: "金融体系做什么：金融中介、货币市场与资本市场、一级市场与二级市场、交易所与做市商、买卖价差，以及市价单、限价单和止损单。"
          en: "What the financial system does: financial intermediaries, money and capital markets, primary and secondary markets, exchanges and market makers, the bid-ask spread, and market, limit and stop orders."
        published: true
        introduces: [financial-intermediary, money-market, capital-market, primary-market, secondary-market, market-maker, bid-ask-spread, short-selling, limit-order]
        uses: [time-value-of-money, diversification, variance, standard-deviation, expected-value, adverse-selection, moral-hazard, bank-run]
      - id: "3.2"
        slug: "3-2-npv-irr"
        title: { zh-cn: "NPV、IRR 与资本预算", en: "NPV, IRR and Capital Budgeting" }
        summary:
          zh-cn: "怎样决定一个投资项目是否值得做：净现值与资本的机会成本、哪些现金流应该计入、内部收益率及其陷阱、回收期与盈利指数。"
          en: "How to decide whether an investment project is worth doing: net present value and the opportunity cost of capital, which cash flows to include, the internal rate of return and its pitfalls, payback and the profitability index."
        published: true
        introduces: [net-present-value, cost-of-capital, internal-rate-of-return, payback-period, profitability-index]
        uses: [present-value, annuity, sunk-cost, fisher-equation, real-interest-rate, first-order-condition, expected-value]
      - id: "3.3"
        slug: "3-3-bond-pricing"
        title: { zh-cn: "债券定价", en: "Bond Pricing" }
        summary:
          zh-cn: "债券的现金流与价格；到期收益率与价格的反向关系；溢价、折价与价格随时间的变化；零息债与即期利率；远期利率；票息效应。"
          en: "Bond cash flows and prices; the inverse relation between yield to maturity and price; premium, discount and how prices change over time; zero-coupon bonds and spot rates; forward rates; the coupon effect."
        published: true
        introduces: [coupon-rate, yield-to-maturity, zero-coupon-bond, spot-rate, forward-rate]
        uses: [present-value, annuity, ear, future-value, internal-rate-of-return, net-present-value]
      - id: "3.4"
        slug: "3-4-interest-rate-risk"
        title: { zh-cn: "利率风险", en: "Interest Rate Risk" }
        summary:
          zh-cn: "债券的价格风险与再投资风险；Macaulay 久期与修正久期；凸性；用久期匹配实现免疫。"
          en: "Price risk and reinvestment risk in bonds; Macaulay and modified duration; convexity; immunization by matching durations."
        published: true
        introduces: [macaulay-duration, modified-duration, convexity, immunization]
        uses: [present-value, perpetuity, derivative, yield-to-maturity, zero-coupon-bond, coupon-rate, bank-run]
      - id: "3.5"
        slug: "3-5-term-structure"
        title: { zh-cn: "利率期限结构", en: "The Term Structure of Interest Rates" }
        summary:
          zh-cn: "利率期限结构与收益率曲线的形状；预期假说：长期利率与预期的未来短期利率；期限溢价与流动性溢价理论；优先偏好理论；收益率曲线的斜率包含哪些信息。"
          en: "The term structure of interest rates and the shapes of the yield curve; the expectations hypothesis: long rates and expected future short rates; the term premium and the liquidity premium theory; the preferred habitat theory; what the slope of the yield curve tells us."
        published: true
        introduces: [term-structure, expectations-hypothesis, term-premium, preferred-habitat]
        uses: [yield-curve, spot-rate, forward-rate, zero-coupon-bond, yield-to-maturity, modified-duration, macaulay-duration, immunization, quantitative-easing, forward-guidance, expected-value]
      - id: "3.6"
        slug: "3-6-credit-risk"
        title: { zh-cn: "信用风险", en: "Credit Risk" }
        summary:
          zh-cn: "违约风险、回收率与信用利差；承诺收益与预期收益；信用评级及其局限；国债、公司债与市政债，含税等价收益率；通胀保值国债（TIPS）与盈亏平衡通胀率；债券基金与单只债券。"
          en: "Default risk, recovery rates and credit spreads; promised versus expected returns; credit ratings and their limits; Treasuries, corporate bonds and municipal bonds, including the tax-equivalent yield; Treasury Inflation-Protected Securities (TIPS) and breakeven inflation; bond funds versus individual bonds."
        published: true
        introduces: [default-risk, recovery-rate, credit-spread, credit-rating, municipal-bond, tax-equivalent-yield, tips, breakeven-inflation]
        uses: [yield-to-maturity, zero-coupon-bond, present-value, expected-value, correlation, principal-agent-problem, adverse-selection, cpi, inflation, real-interest-rate, modified-duration, immunization, recession, stock-bond-correlation, term-premium]
      - id: "3.7"
        slug: "3-7-financial-statements"
        title: { zh-cn: "财务报表分析", en: "Financial Statement Analysis" }
        summary:
          zh-cn: "资产负债表、利润表和现金流量表；权责发生制与折旧；三张报表之间的联系；营运资本与利润和现金流的差别；盈余质量与常见的会计美化。"
          en: "The balance sheet, the income statement and the cash flow statement; accrual accounting and depreciation; how the three statements link together; working capital and the gap between profit and cash flow; earnings quality and common ways of dressing up earnings."
        published: true
        introduces: [balance-sheet, income-statement, cash-flow-statement, accrual-accounting, depreciation, working-capital, earnings-quality]
        uses: [economic-profit, principal-agent-problem, present-value, cost-of-capital]
      - id: "3.8"
        slug: "3-8-financial-ratios"
        title: { zh-cn: "财务比率", en: "Financial Ratios" }
        summary:
          zh-cn: "利润率、资产收益率与净资产收益率；DuPont 分解；财务杠杆怎样放大收益和损失；周转率、现金转换周期与投入资本回报率；杠杆、利息保障倍数与流动性比率；使用比率的注意事项。"
          en: "Profit margins, return on assets and return on equity; the DuPont decomposition; how financial leverage magnifies gains and losses; turnover ratios, the cash conversion cycle and return on invested capital; leverage, interest coverage and liquidity ratios; cautions in using ratios."
        published: true
        introduces: [return-on-assets, return-on-equity, dupont-analysis, financial-leverage, return-on-invested-capital, interest-coverage, current-ratio]
        uses: [income-statement, balance-sheet, working-capital, earnings-quality, cost-of-capital, economic-profit, depreciation, net-present-value]
      - id: "3.9"
        slug: "3-9-equity-valuation-ddm"
        title: { zh-cn: "股票估值 I：股利贴现模型", en: "Equity Valuation I: Dividend Discount Models" }
        summary:
          zh-cn: "股票的内在价值是未来股息的现值；股权成本；Gordon 增长模型及其对增长率和折现率的敏感性；派息率、可持续增长率与增长机会的现值；多阶段模型；不派息的公司与回购。"
          en: "A stock's intrinsic value as the present value of future dividends; the cost of equity; the Gordon growth model and its sensitivity to growth and discount rates; the payout ratio, the sustainable growth rate and the present value of growth opportunities; multistage models; companies that pay no dividends, and buybacks."
        published: true
        introduces: [dividend-discount-model, cost-of-equity, gordon-growth-model, payout-ratio, sustainable-growth-rate, pvgo]
        uses: [present-value, growing-perpetuity, geometric-series, return-on-equity, cost-of-capital, net-present-value, return-on-invested-capital, balance-sheet]
      - id: "3.10"
        slug: "3-10-equity-valuation-dcf"
        title: { zh-cn: "股票估值 II：自由现金流贴现", en: "Equity Valuation II: Discounted Free Cash Flow" }
        summary:
          zh-cn: "公司自由现金流与股权自由现金流；加权平均资本成本（WACC）与利息的税盾；DCF 估值的步骤：预测期、终值、企业价值与股权价值；增长、ROIC 与价值的关系；常见错误。"
          en: "Free cash flow to the firm and free cash flow to equity; the weighted average cost of capital (WACC) and the interest tax shield; the steps of a DCF valuation: forecast period, terminal value, enterprise value and equity value; how growth, ROIC and value are related; common mistakes."
        published: true
        introduces: [fcff, fcfe, wacc, interest-tax-shield, terminal-value, enterprise-value]
        uses: [present-value, growing-perpetuity, net-present-value, cost-of-capital, cost-of-equity, income-statement, cash-flow-statement, depreciation, working-capital, return-on-invested-capital, financial-leverage, gordon-growth-model, dividend-discount-model, pvgo, real-interest-rate]
      - id: "3.11"
        slug: "3-11-relative-valuation"
        title: { zh-cn: "股票估值 III：相对估值", en: "Equity Valuation III: Relative Valuation" }
        summary:
          zh-cn: "用可比公司的倍数估值；市盈率与增长、ROE 和股权成本的关系；EV/EBITDA、市净率和市销率，以及分子分母要一致；周期性公司的市盈率；CAPE 与市场整体的估值。"
          en: "Valuation with multiples of comparable companies; how the P/E ratio relates to growth, ROE and the cost of equity; EV/EBITDA, price-to-book and price-to-sales, and keeping numerator and denominator consistent; the P/E of cyclical companies; CAPE and the valuation of the whole market."
        published: true
        introduces: [price-earnings-ratio, ev-ebitda, price-to-book, price-to-sales, cape]
        uses: [gordon-growth-model, payout-ratio, sustainable-growth-rate, return-on-equity, cost-of-equity, enterprise-value, financial-leverage, earnings-quality, dividend-discount-model, business-cycle, real-interest-rate, fcff]

  - id: "4"
    title: { zh-cn: "第 4 阶段：投资理论与组合建模", en: "Stage 4: Investment Theory and Portfolio Modeling" }
    lessons:
      - id: "4.1"
        slug: "4-1-risk-return-measures"
        title: { zh-cn: "收益与风险的度量", en: "Measuring Return and Risk" }
        summary:
          zh-cn: "算术平均收益与几何平均收益；波动拖累与杠杆；年化波动率；最大回撤；夏普比率；美国股票、债券和国库券的历史收益，以及估计的不确定性。"
          en: "Arithmetic and geometric mean returns; volatility drag and leverage; annualized volatility; maximum drawdown; the Sharpe ratio; historical returns on US stocks, bonds and Treasury bills, and the uncertainty of the estimates."
        published: true
        introduces: [arithmetic-mean-return, geometric-mean-return, volatility-drag, annualized-volatility, maximum-drawdown, sharpe-ratio, equity-premium]
        uses: [simple-return, log-return, expected-value, variance, standard-deviation, median, lognormal-distribution, fat-tails, standard-error, confidence-interval, correlation]
      - id: "4.2"
        slug: "4-2-markowitz"
        title: { zh-cn: "均值–方差组合理论", en: "Mean–Variance Portfolio Theory" }
        summary:
          zh-cn: "两种风险资产的组合与相关系数；最小方差组合；最小方差前沿与有效前沿；用拉格朗日乘数法做均值–方差优化；卖空限制与角点解；分散化的作用与方法的局限。"
          en: "Portfolios of two risky assets and the role of correlation; the minimum-variance portfolio; the minimum-variance frontier and the efficient frontier; mean–variance optimization with Lagrange multipliers; short-sale constraints and corner solutions; what diversification does and the limits of the method."
        published: true
        introduces: [minimum-variance-portfolio, minimum-variance-frontier, efficient-frontier, mean-variance-optimization, short-sale-constraint]
        uses: [portfolio-variance, covariance, correlation, diversification, expected-value, standard-deviation, lagrange-multiplier, partial-derivative, second-order-condition, short-selling, volatility-drag, standard-error]
      - id: "4.3"
        slug: "4-3-capital-allocation"
        title: { zh-cn: "资本配置线与资本市场线", en: "The Capital Allocation Line and the Capital Market Line" }
        summary:
          zh-cn: "无风险资产与资本配置线；最优风险组合（切点组合）与分离定理；均值–方差效用与最优的风险资产比例；借贷利率不同时的配置；市场组合与资本市场线。"
          en: "The risk-free asset and the capital allocation line; the optimal risky portfolio (the tangency portfolio) and the separation theorem; mean–variance utility and the optimal share in risky assets; allocation when borrowing and lending rates differ; the market portfolio and the capital market line."
        published: true
        introduces: [capital-allocation-line, tangency-portfolio, separation-theorem, mean-variance-utility, market-portfolio, capital-market-line]
        uses: [efficient-frontier, minimum-variance-frontier, sharpe-ratio, risk-aversion, crra-utility, certainty-equivalent, risk-premium, expected-utility, volatility-drag, second-order-condition, short-selling, diversification]
      - id: "4.4"
        slug: "4-4-capm"
        title: { zh-cn: "资本资产定价模型（CAPM）", en: "The Capital Asset Pricing Model (CAPM)" }
        summary:
          zh-cn: "资本资产定价模型（CAPM）的推导思路；beta；证券市场线与 alpha；为什么只有与市场相关的风险得到补偿；CAPM 的假设、实证证据与用途。"
          en: "The idea behind the capital asset pricing model (CAPM); beta; the security market line and alpha; why only risk related to the market is rewarded; the assumptions, empirical evidence and uses of the CAPM."
        published: true
        introduces: [capm, beta, security-market-line, alpha]
        uses: [market-portfolio, capital-market-line, tangency-portfolio, sharpe-ratio, covariance, correlation, equity-premium, cost-of-equity, wacc, cost-of-capital, net-present-value, diversification, financial-leverage, regression-coefficient]
      - { id: "4.5", slug: "4-5-single-index-model", title: { zh-cn: "单指数模型与 beta 估计", en: "The Single-Index Model and Estimating Beta" } }
      - { id: "4.6", slug: "4-6-multifactor-models", title: { zh-cn: "多因子模型", en: "Multifactor Models" } }
      - { id: "4.7", slug: "4-7-market-efficiency", title: { zh-cn: "有效市场假说", en: "The Efficient Market Hypothesis" } }
      - { id: "4.8", slug: "4-8-behavioral-finance", title: { zh-cn: "行为金融", en: "Behavioral Finance" } }
      - { id: "4.9", slug: "4-9-performance-evaluation", title: { zh-cn: "业绩评估", en: "Performance Evaluation" } }
      - { id: "4.10", slug: "4-10-estimation-error", title: { zh-cn: "估计误差与稳健优化", en: "Estimation Error and Robust Optimization" } }
      - { id: "4.11", slug: "4-11-capital-market-assumptions", title: { zh-cn: "资本市场假设", en: "Capital Market Assumptions" } }
      - { id: "4.12", slug: "4-12-lifecycle-allocation", title: { zh-cn: "生命周期资产配置理论", en: "Life-Cycle Asset Allocation Theory" } }
      - { id: "4.13", slug: "4-13-simulation-backtesting", title: { zh-cn: "模拟与回测方法", en: "Simulation and Backtesting Methods" } }
