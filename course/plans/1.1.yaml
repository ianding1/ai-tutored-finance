# Lesson plan for the AI tutor: the structure and content of the lesson, not a script. The tutor writes
# its own explanations from it (served as /ai/<lang>/lessons/1.1.md by src/lib/tutor.ts).
# Numbers in "examples" are fixed: check questions, exercises and later lessons use them.

lesson: "1.1"

goals:
  zh-cn:
    - 区分需求（需求曲线）和需求量、供给和供给量，分清沿着曲线移动与整条曲线移动。
    - 由需求和供给求市场均衡，并解释价格偏离均衡时过剩和短缺怎样把价格推回均衡。
    - 用比较静态分析一个外部变化对均衡价格和数量的影响。
    - 计算并解释需求的价格弹性、收入弹性和交叉价格弹性，说出决定价格弹性大小的因素。
  en:
    - Distinguish demand (the demand curve) from quantity demanded, and supply from quantity supplied; tell a movement along a curve from a shift of the whole curve.
    - Find the market equilibrium from demand and supply, and explain how surpluses and shortages push the price back to equilibrium.
    - Use comparative statics to analyze how an outside change affects the equilibrium price and quantity.
    - Compute and interpret the price elasticity, income elasticity and cross-price elasticity of demand, and name what makes price elasticity large or small.

prerequisites: [derivative, marginal-cost]

sections:
  - id: demand
    title: { zh-cn: "需求", en: "Demand" }
    concepts: [demand]
    points:
      zh-cn:
        - 需求量：在某个价格下，买方愿意并且有能力购买的数量。需求：其他条件不变时，价格与需求量之间的关系。
        - 需求定律：其他条件不变时，价格越高，需求量越小，需求曲线向下倾斜。原因（替代效应与收入效应）留到[[1.2]]，这里只提一句。
        - 经济学的习惯：价格画在纵轴，数量画在横轴。
        - “其他条件”包括收入、替代品和互补品的价格、偏好、对未来价格的预期、买方人数。
        - 价格变化引起需求量变化，是沿着同一条需求曲线移动；其他条件变化引起需求变化，是整条曲线移动（例如收入上升，需求曲线右移）。
      en:
        - Quantity demanded is the amount buyers are willing and able to buy at a given price. Demand is the relation between price and quantity demanded, other things equal.
        - 'The law of demand: other things equal, a higher price means a lower quantity demanded; the demand curve slopes down. The reasons (substitution and income effects) come in [[1.2]]; mention them only briefly here.'
        - By convention, price is on the vertical axis and quantity on the horizontal axis.
        - The "other things" include income, the prices of substitutes and complements, tastes, expectations of future prices and the number of buyers.
        - 'A change in price changes the quantity demanded: a movement along the same demand curve. A change in another factor changes demand: a shift of the whole curve (for example, higher income shifts the demand curve right).'
    examples:
      zh-cn:
        - 某城市每周对咖啡豆的需求 $Q_d = 100 - 2P$，$P$ 为每袋价格（美元），$Q_d$ 为需求量（千袋）。价格 10、20、30、40 时，需求量分别为 80、60、40、20。
      en:
        - Weekly demand for coffee beans in a city is $Q_d = 100 - 2P$, where $P$ is the price per bag (dollars) and $Q_d$ the quantity demanded (thousand bags). At prices 10, 20, 30 and 40, the quantity demanded is 80, 60, 40 and 20.
    approach:
      zh-cn: 先让学习者自己用需求函数算出几个价格下的需求量，再讲需求曲线。用一个生活中的例子让学习者判断是“沿着曲线移动”还是“曲线移动”。
      en: Let the learner compute the quantity demanded at a few prices from the demand function before introducing the demand curve. Use an everyday example and ask whether it is a movement along the curve or a shift of the curve.
    pitfalls:
      zh-cn:
        - 把“需求减少”和“需求量减少”混为一谈：价格上升只减少需求量，不移动需求曲线。
      en:
        - 'Confusing "demand falls" with "quantity demanded falls": a higher price lowers the quantity demanded but does not shift the demand curve.'

  - id: supply
    title: { zh-cn: "供给", en: "Supply" }
    concepts: [supply]
    points:
      zh-cn:
        - 供给量：在某个价格下，卖方愿意并且有能力出售的数量。供给：其他条件不变时，价格与供给量之间的关系。
        - 供给曲线向上倾斜。联系[[0.2]]：按市场价格出售的厂商把产量定在价格等于边际成本处；边际成本随产量上升，所以价格越高，愿意生产的越多。从成本曲线推出供给曲线留到[[1.5]]。
        - 影响供给的其他条件：投入价格（原材料、工资）、技术、卖方人数、对未来价格的预期。
        - 与需求一样：价格变化是沿着供给曲线移动，其他条件变化是整条曲线移动。
      en:
        - Quantity supplied is the amount sellers are willing and able to sell at a given price. Supply is the relation between price and quantity supplied, other things equal.
        - 'The supply curve slopes up. Link to [[0.2]]: a firm selling at the market price produces where price equals marginal cost; marginal cost rises with output, so a higher price makes firms willing to produce more. Deriving the supply curve from cost curves is left to [[1.5]].'
        - 'Other factors that affect supply: input prices (materials, wages), technology, the number of sellers, expectations of future prices.'
        - 'As with demand: a change in price is a movement along the supply curve; a change in another factor shifts the whole curve.'
    examples:
      zh-cn:
        - 咖啡豆的供给 $Q_s = -20 + 4P$。价格低于 5 美元时没有卖方愿意出售，这个式子只在 $P \ge 5$ 时适用。
      en:
        - The supply of coffee beans is $Q_s = -20 + 4P$. Below 5 dollars no seller is willing to sell, so the formula applies only for $P \ge 5$.
    approach:
      zh-cn: 先问学习者：根据[[0.2]]的利润最大化，价格上升时厂商为什么愿意多生产？让他自己说出“价格等于边际成本”。
      en: First ask the learner why, by the profit maximization of [[0.2]], firms want to produce more when the price rises; let them state "price equals marginal cost" themselves.
    pitfalls:
      zh-cn:
        - 忘记供给函数的适用范围（$P \ge 5$），在低价格处得到负的供给量。
      en:
        - Forgetting the range in which the supply function applies ($P \ge 5$) and getting a negative quantity supplied at low prices.

  - id: equilibrium
    title: { zh-cn: "市场均衡", en: "Market equilibrium" }
    concepts: [market-equilibrium]
    points:
      zh-cn:
        - 市场均衡：需求量等于供给量时的价格和数量。
        - 价格高于均衡时供给量大于需求量，出现过剩（surplus），卖方降价；低于均衡时出现短缺（shortage），买方愿意出更高的价格，价格上升。只有在均衡价格下没有人想改变价格。
      en:
        - 'Market equilibrium: the price and quantity at which quantity demanded equals quantity supplied.'
        - 'Above the equilibrium price, quantity supplied exceeds quantity demanded: a surplus, and sellers cut prices. Below it there is a shortage, buyers are willing to pay more and the price rises. Only at the equilibrium price does no one want to change the price.'
    examples:
      zh-cn:
        - 咖啡豆市场：$100 - 2P = -20 + 4P$，均衡价格 $P^* = 20$ 美元，均衡数量 $Q^* = 60$ 千袋。
        - 价格为 25 时，需求量 50、供给量 80，过剩 30 千袋；价格为 15 时，需求量 70、供给量 40，短缺 30 千袋。
      en:
        - 'Coffee-bean market: $100 - 2P = -20 + 4P$, equilibrium price $P^* = 20$ dollars, equilibrium quantity $Q^* = 60$ thousand bags.'
        - 'At a price of 25, quantity demanded is 50 and quantity supplied 80: a surplus of 30 thousand bags. At 15, quantity demanded is 70 and quantity supplied 40: a shortage of 30 thousand bags.'
    approach:
      zh-cn: 让学习者自己解出均衡；再让他算价格为 25 和 15 时的需求量和供给量，说出会发生什么。
      en: Let the learner solve for the equilibrium; then have them compute quantities at 25 and at 15 and say what happens.
    checks: [C1]

  - id: comparative-statics
    title: { zh-cn: "比较静态", en: "Comparative statics" }
    concepts: [comparative-statics]
    points:
      zh-cn:
        - 比较静态：比较外部条件改变前后的两个均衡，不研究从一个均衡调整到另一个均衡的过程。
        - 三个步骤：变化影响需求、供给还是两者；曲线向哪个方向移动；新的均衡价格和数量各比原来高还是低。
        - 需求曲线右移时，供给量增加是沿着供给曲线移动（因为价格上升），供给曲线本身没有移动。
      en:
        - Comparative statics compares the equilibria before and after a change in outside conditions, without studying how the market moves from one to the other.
        - 'Three steps: does the change affect demand, supply or both; which way does the curve shift; are the new equilibrium price and quantity higher or lower than before.'
        - When demand shifts right, the increase in quantity supplied is a movement along the supply curve (because the price rises); the supply curve itself does not shift.
    examples:
      zh-cn:
        - 收入上升，每个价格下需求量都增加 30 千袋：$Q_d = 130 - 2P$。新的均衡 $P^* = 25$，$Q^* = 80$：价格上升 5 美元，数量增加 2 万袋。
      en:
        - 'Income rises and quantity demanded increases by 30 thousand bags at every price: $Q_d = 130 - 2P$. New equilibrium $P^* = 25$, $Q^* = 80$: the price rises by 5 dollars and quantity by 20 thousand bags.'
    approach:
      zh-cn: 先让学习者预测价格和数量变化的方向，再计算新的均衡。
      en: Have the learner predict the direction of the price and quantity changes before computing the new equilibrium.
    pitfalls:
      zh-cn:
        - 以为需求增加后价格上升，会使需求再下降，于是“需求曲线又移回来”；混淆曲线移动和沿着曲线移动。
      en:
        - Thinking that after demand rises, the higher price lowers demand again so the curve "shifts back"; confusing a shift with a movement along the curve.
    leave:
      zh-cn: 只讲一条曲线移动的情形；需求和供给同时移动时价格和数量怎样变化，留给[[check:Q3]]，不要讲。
      en: Teach only cases in which one curve shifts; what happens to price and quantity when demand and supply shift together is left to [[check:Q3]]; do not teach it.
    figures:
      - id: "4-1"
        observe:
          zh-cn: 分别移动需求曲线和供给曲线，比较均衡价格和数量的变化方向。
          en: Shift the demand curve and the supply curve in turn, and compare the directions in which the equilibrium price and quantity move.
    checks: [C2]

  - id: price-elasticity
    title: { zh-cn: "需求的价格弹性", en: "Price elasticity of demand" }
    concepts: [price-elasticity]
    points:
      zh-cn:
        - 斜率取决于单位（美元换成美分，斜率变为百分之一），所以用百分比衡量反应的大小。
        - 需求的价格弹性 $\varepsilon = \frac{\%\Delta Q}{\%\Delta P} = \frac{dQ}{dP} \cdot \frac{P}{Q}$，为负数，按绝对值分类：$\lvert\varepsilon\rvert > 1$ 富有弹性（elastic），$\lvert\varepsilon\rvert < 1$ 缺乏弹性（inelastic），$\lvert\varepsilon\rvert = 1$ 单位弹性（unit elastic）。
        - 只有两组观测时用中点法（arc elasticity）：$\varepsilon \approx \frac{(Q_2 - Q_1)/\bar Q}{(P_2 - P_1)/\bar P}$，基数是两点的平均值。
        - 决定弹性大小的因素：相近替代品的多少；占支出的比例；必需品还是可有可无；时间长短（时间越长越富有弹性）。
      en:
        - A slope depends on units (switching from dollars to cents divides it by 100), so responses are measured in percentages.
        - 'The price elasticity of demand is $\varepsilon = \frac{\%\Delta Q}{\%\Delta P} = \frac{dQ}{dP} \cdot \frac{P}{Q}$; it is negative and classified by its absolute value: $\lvert\varepsilon\rvert > 1$ elastic, $\lvert\varepsilon\rvert < 1$ inelastic, $\lvert\varepsilon\rvert = 1$ unit elastic.'
        - 'With only two observations, use the midpoint method (arc elasticity): $\varepsilon \approx \frac{(Q_2 - Q_1)/\bar Q}{(P_2 - P_1)/\bar P}$, with the averages of the two points as the base.'
        - 'What makes elasticity large or small: how many close substitutes exist; the share of spending; necessity or something one can do without; the time horizon (more elastic over longer periods).'
    examples:
      zh-cn:
        - 在咖啡豆市场的均衡点 $P = 20$、$Q = 60$，$\frac{dQ}{dP} = -2$，$\varepsilon = -2 \times \frac{20}{60} \approx -0.67$：价格上升 1%，需求量约减少 0.67%，这一点需求缺乏弹性。
      en:
        - 'At the equilibrium of the coffee-bean market, $P = 20$, $Q = 60$, $\frac{dQ}{dP} = -2$ and $\varepsilon = -2 \times \frac{20}{60} \approx -0.67$: a 1% higher price lowers quantity demanded by about 0.67%; demand is inelastic at this point.'
    approach:
      zh-cn: 先用“换单位后斜率变了”引出为什么要用百分比；让学习者自己算均衡点的弹性。
      en: Start from "the slope changes when units change" to motivate percentages; let the learner compute the elasticity at the equilibrium.
    leave:
      zh-cn: 不要说出沿着直线需求曲线弹性是否处处相同（[[check:Q1]]），也不要推导提价时总收入怎样随弹性变化（[[check:Q2]]）；不要解释为什么要用中点法、起点和终点作基数会有什么不同（[[check:Q5]]）；不要讨论歉收时整个行业的收入怎样变化（[[check:Q4]]）。可以把这些问题提出来，告诉学习者会在练习题中回答。
      en: Do not say whether elasticity is the same everywhere along a straight-line demand curve ([[check:Q1]]), do not derive how total revenue changes with a price increase depending on elasticity ([[check:Q2]]), do not explain why the midpoint method is used or what happens with the start or end point as the base ([[check:Q5]]), and do not discuss how a bad harvest changes the revenue of a whole industry ([[check:Q4]]). You may raise these questions and say the exercises will answer them.
    pitfalls:
      zh-cn:
        - 把斜率当作弹性；或者以为直线需求曲线的弹性处处相同。
        - 忘记弹性是负数，按带符号的数值比较大小。
      en:
        - Taking the slope for the elasticity, or thinking a straight-line demand curve has the same elasticity everywhere.
        - Forgetting that the elasticity is negative and comparing signed values.
    checks: [C3]

  - id: other-elasticities
    title: { zh-cn: "收入弹性与交叉价格弹性", en: "Income elasticity and cross-price elasticity" }
    concepts: [income-elasticity, cross-price-elasticity]
    points:
      zh-cn:
        - 收入弹性 $\varepsilon_I = \frac{\%\Delta Q}{\%\Delta I}$：$\varepsilon_I > 0$ 为正常品（normal good），其中 $\varepsilon_I > 1$ 为奢侈品（luxury），$0 < \varepsilon_I < 1$ 为必需品（necessity）；$\varepsilon_I < 0$ 为劣等品（inferior good）。
        - 交叉价格弹性 $\varepsilon_{xy} = \frac{\%\Delta Q_x}{\%\Delta P_y}$：大于 0 为替代品（substitutes），小于 0 为互补品（complements）。
        - 与投资的联系：需求缺乏弹性、收入弹性低的公司（日用消费品），收入受衰退影响小；收入弹性高的公司（奢侈品）随经济周期大起大落（[[2.8]]）。提价后客户流失少说明需求缺乏弹性，是定价能力（pricing power）的来源之一（[[1.6]]）。
      en:
        - 'Income elasticity $\varepsilon_I = \frac{\%\Delta Q}{\%\Delta I}$: $\varepsilon_I > 0$ means a normal good, with $\varepsilon_I > 1$ a luxury and $0 < \varepsilon_I < 1$ a necessity; $\varepsilon_I < 0$ means an inferior good.'
        - 'Cross-price elasticity $\varepsilon_{xy} = \frac{\%\Delta Q_x}{\%\Delta P_y}$: positive for substitutes, negative for complements.'
        - 'Link to investing: companies facing inelastic demand and low income elasticity (consumer staples) see their revenue hit less by recessions; companies with high income elasticity (luxury goods) swing with the business cycle ([[2.8]]). Losing few customers after a price increase means inelastic demand, one source of pricing power ([[1.6]]).'
    examples:
      zh-cn:
        - 劣等品：收入上升后人们少乘长途大巴、多坐飞机。
        - 替代品：两家流媒体平台，一家涨价，另一家用户增加。互补品：打印机和墨盒，墨盒涨价，打印机卖得更少。
      en:
        - 'Inferior good: as incomes rise, people take long-distance buses less and fly more.'
        - 'Substitutes: two streaming platforms; when one raises its price, the other gains users. Complements: printers and ink cartridges; when cartridges get dearer, fewer printers are sold.'
    leave:
      zh-cn: 不要讨论竞争对手同时涨价时提价效果怎样变化（[[check:Q6]]）。
      en: Do not discuss how a price increase works out when competitors raise their prices at the same time ([[check:Q6]]).
    approach:
      zh-cn: 让学习者自己举出一个劣等品和一对互补品的例子，并判断弹性的符号。
      en: Ask the learner to give their own example of an inferior good and of a pair of complements, and to say the sign of each elasticity.
    pitfalls:
      zh-cn:
        - 以为劣等品就是质量差的商品；劣等品只由收入弹性为负来定义。
      en:
        - Thinking an inferior good is a low-quality good; it is defined only by a negative income elasticity.
    checks: [C4]
