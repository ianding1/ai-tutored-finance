# Concept registry. Every concept that a lesson introduces, uses, or links to must be listed here.
#
#   defined_in: lesson id where the concept is taught, or "prerequisite" for assumed background knowledge
#   zh / en:    canonical term in each language. Translations must use this exact term.
#   short:      { zh, en } one-sentence definition, shown in link previews (optional)

summation:
  defined_in: prerequisite
  zh-cn: 求和符号
  en: summation notation

logarithm:
  defined_in: prerequisite
  zh-cn: 对数
  en: logarithm

geometric-series:
  defined_in: prerequisite
  zh-cn: 等比数列求和
  en: geometric series

derivative:
  defined_in: prerequisite
  zh-cn: 导数
  en: derivative

# ---------- 0.1 ----------

time-value-of-money:
  defined_in: "0.1"
  zh-cn: 货币时间价值
  en: time value of money
  short:
    zh-cn: 同样数额的钱，越早拿到越值钱；不同时间的钱要折算到同一时点才能比较或相加。
    en: The same amount of money is worth more the earlier you receive it, so amounts at different times must be moved to the same date before they are compared or added.

compound-interest:
  defined_in: "0.1"
  zh-cn: 复利
  en: compound interest
  short:
    zh-cn: 利息也计入本金、继续产生利息的计息方式。
    en: Interest that is added to the principal and earns interest itself.

future-value:
  defined_in: "0.1"
  zh-cn: 终值
  en: future value
  short:
    zh-cn: 今天的一笔钱按复利增长到未来某一时点的金额。
    en: The amount that a sum today grows to at a future date with compound interest.

present-value:
  defined_in: "0.1"
  zh-cn: 现值
  en: present value
  short:
    zh-cn: 未来的一笔钱折算到今天的价值。
    en: The value today of an amount received in the future.

discount-factor:
  defined_in: "0.1"
  zh-cn: 折现因子
  en: discount factor
  short:
    zh-cn: 把未来一笔钱折算成现值时乘的系数 1/(1+r)ⁿ。
    en: "The number that a future amount is multiplied by to get its present value: 1/(1+r)ⁿ."

apr:
  defined_in: "0.1"
  zh-cn: 名义年利率
  en: annual percentage rate
  short:
    zh-cn: 按年报出的利率（APR），等于每期利率乘以一年的期数，不考虑期内复利。
    en: The quoted yearly rate (APR), equal to the rate per period times the number of periods in a year, without compounding within the year.

ear:
  defined_in: "0.1"
  zh-cn: 有效年利率
  en: effective annual rate
  short:
    zh-cn: 考虑一年内复利之后实际得到的年利率（EAR）。
    en: The yearly rate actually earned once compounding within the year is taken into account (EAR).

continuous-compounding:
  defined_in: "0.1"
  zh-cn: 连续复利
  en: continuous compounding
  short:
    zh-cn: 复利频率趋于无穷时的极限，此时 FV = PV·e^(rT)。
    en: The limit when compounding becomes infinitely frequent. Then FV = PV·e^(rT).

annuity:
  defined_in: "0.1"
  zh-cn: 年金
  en: annuity
  short:
    zh-cn: 一串金额相同、间隔相同、期数有限的付款。
    en: A finite series of equal payments at equal intervals.

perpetuity:
  defined_in: "0.1"
  zh-cn: 永续年金
  en: perpetuity
  short:
    zh-cn: 金额相同、间隔相同、永远持续的付款，现值为 C/r。
    en: Equal payments at equal intervals that continue forever. Its present value is C/r.

annuity-due:
  defined_in: "0.1"
  zh-cn: 期初年金
  en: annuity due
  short:
    zh-cn: 每期期初付款的年金。
    en: An annuity whose payments are made at the start of each period.

growing-perpetuity:
  defined_in: "0.1"
  zh-cn: 增长永续年金
  en: growing perpetuity
  short:
    zh-cn: 每期按固定比例增长、永远持续的付款。
    en: Payments that grow at a constant rate each period and continue forever.

simple-return:
  defined_in: "0.1"
  zh-cn: 简单收益率
  en: simple return
  short:
    zh-cn: 价格变化的比例 P₁/P₀ − 1；多期合成时要连乘。
    en: The proportional price change P₁/P₀ − 1. Over several periods, simple returns compound by multiplication.

log-return:
  defined_in: "0.1"
  zh-cn: 对数收益率
  en: log return
  short:
    zh-cn: 价格比的自然对数 ln(P₁/P₀)；多期可以直接相加。
    en: The natural logarithm of the price ratio, ln(P₁/P₀). Over several periods, log returns add.

# ---------- 0.2 ----------

objective-function:
  defined_in: "0.2"
  zh-cn: 目标函数
  en: objective function
  short:
    zh-cn: 优化问题中要最大化或最小化的量。
    en: The quantity that an optimization problem maximizes or minimizes.

first-order-condition:
  defined_in: "0.2"
  zh-cn: 一阶条件
  en: first-order condition
  short:
    zh-cn: 内部最优点处导数（或所有偏导数）为 0。
    en: At an interior optimum, the derivative (or every partial derivative) is 0.

second-order-condition:
  defined_in: "0.2"
  zh-cn: 二阶条件
  en: second-order condition
  short:
    zh-cn: 用二阶导数的符号区分最大值和最小值。
    en: The sign of the second derivative tells a maximum from a minimum.

fixed-cost:
  defined_in: "0.2"
  zh-cn: 固定成本
  en: fixed cost
  short:
    zh-cn: 总成本中不随产量变化的部分。
    en: The part of total cost that does not change with output.

variable-cost:
  defined_in: "0.2"
  zh-cn: 可变成本
  en: variable cost
  short:
    zh-cn: 总成本中随产量变化的部分。
    en: The part of total cost that changes with output.

marginal-revenue:
  defined_in: "0.2"
  zh-cn: 边际收入
  en: marginal revenue
  short:
    zh-cn: 多卖一单位带来的收入增加，即收入对产量的导数。
    en: The extra revenue from selling one more unit, that is, the derivative of revenue with respect to output.

marginal-cost:
  defined_in: "0.2"
  zh-cn: 边际成本
  en: marginal cost
  short:
    zh-cn: 多生产一单位带来的成本增加，即成本对产量的导数。
    en: The extra cost of producing one more unit, that is, the derivative of cost with respect to output.

profit-maximization:
  defined_in: "0.2"
  zh-cn: 利润最大化
  en: profit maximization
  short:
    zh-cn: 选择产量使利润最大；内部最优点满足边际收入等于边际成本。
    en: Choosing output to make profit as large as possible. At an interior optimum, marginal revenue equals marginal cost.

sunk-cost:
  defined_in: "0.2"
  zh-cn: 沉没成本
  en: sunk cost
  short:
    zh-cn: 已经付出、无论之后怎样决策都收不回的成本。
    en: A cost that has already been paid and cannot be recovered whatever you decide next.

partial-derivative:
  defined_in: "0.2"
  zh-cn: 偏导数
  en: partial derivative
  short:
    zh-cn: 其他变量不变、只改变一个变量时函数的变化率。
    en: The rate of change of a function when one variable changes and the others stay fixed.

budget-constraint:
  defined_in: "0.2"
  zh-cn: 预算约束
  en: budget constraint
  short:
    zh-cn: 各项支出之和不能超过可用的钱，例如两种商品时 px·x + py·y = M。
    en: Total spending cannot exceed the money available, for example px·x + py·y = M with two goods.

lagrange-multiplier:
  defined_in: "0.2"
  zh-cn: 拉格朗日乘数
  en: Lagrange multiplier
  short:
    zh-cn: 求解有等式约束的优化问题时引入的变量 λ。
    en: The variable λ introduced to solve an optimization problem with an equality constraint.

shadow-price:
  defined_in: "0.2"
  zh-cn: 影子价格
  en: shadow price
  short:
    zh-cn: 约束放松一个单位时最优目标值的近似增量。
    en: The approximate increase in the optimal value of the objective when the constraint is relaxed by one unit.

corner-solution:
  defined_in: "0.2"
  zh-cn: 角点解
  en: corner solution
  short:
    zh-cn: 某个选择变量取边界值（如 0）的最优解。
    en: An optimum at which a choice variable is at its boundary (for example, 0).

# ---------- 0.3 ----------

random-variable:
  defined_in: "0.3"
  zh-cn: 随机变量
  en: random variable
  short:
    zh-cn: 取值不确定、但知道各取值概率的量。
    en: A quantity whose value is uncertain but whose possible values and their probabilities are known.

expected-value:
  defined_in: "0.3"
  zh-cn: 期望
  en: expected value
  short:
    zh-cn: 按概率加权的平均结果，即同样的情况重复很多次后的平均值。
    en: The probability-weighted average outcome, that is, the average over many repetitions of the same situation.

variance:
  defined_in: "0.3"
  zh-cn: 方差
  en: variance
  short:
    zh-cn: 偏离期望的平方的加权平均，单位是原单位的平方（如 %²）。
    en: The probability-weighted average of squared deviations from the expected value. Its unit is the square of the original unit (for example, %²).

standard-deviation:
  defined_in: "0.3"
  zh-cn: 标准差
  en: standard deviation
  short:
    zh-cn: 方差的平方根，单位与原变量相同；在金融中也叫波动率。
    en: The square root of the variance, in the same unit as the variable. In finance it is also called volatility.

covariance:
  defined_in: "0.3"
  zh-cn: 协方差
  en: covariance
  short:
    zh-cn: 两个变量相对各自期望的偏差之积的加权平均；同向为正，反向为负。
    en: The probability-weighted average of the product of two variables' deviations from their expected values. It is positive when they move in the same direction and negative when they move in opposite directions.

correlation:
  defined_in: "0.3"
  zh-cn: 相关系数
  en: correlation coefficient
  short:
    zh-cn: 协方差除以两个标准差的积，取值在 −1 到 1 之间，没有单位。
    en: The covariance divided by the product of the two standard deviations. It has no unit and lies between −1 and 1.

portfolio-variance:
  defined_in: "0.3"
  zh-cn: 组合方差
  en: portfolio variance
  short:
    zh-cn: 两资产组合的方差等于各自方差按权重平方加权，再加上协方差项。
    en: The variance of a two-asset portfolio is the sum of each variance times its squared weight, plus a covariance term.

diversification:
  defined_in: "0.3"
  zh-cn: 分散化
  en: diversification
  short:
    zh-cn: 组合的标准差低于各资产标准差的加权平均时，组合得到的好处。
    en: The benefit a portfolio gets when its standard deviation is lower than the weighted average of the assets' standard deviations.

# Concepts taught in later lessons. Listed so that forward references can link to them.

# ---------- 0.4 ----------

probability-density:
  defined_in: "0.4"
  zh-cn: 概率密度
  en: probability density
  short:
    zh-cn: 描述连续随机变量的曲线；曲线下某一段的面积等于取值落在这一段的概率。
    en: A curve for a continuous random variable; the area under the curve over an interval is the probability of a value in that interval.

normal-distribution:
  defined_in: "0.4"
  zh-cn: 正态分布
  en: normal distribution
  short:
    zh-cn: 钟形、左右对称的分布，由期望 μ 和标准差 σ 完全确定，记作 N(μ, σ²)。
    en: A bell-shaped, symmetric distribution that is fully determined by its mean μ and standard deviation σ, written N(μ, σ²).

z-score:
  defined_in: "0.4"
  zh-cn: 标准分数
  en: z-score
  short:
    zh-cn: 一个值离期望有几个标准差：z = (x − μ)/σ。
    en: "How many standard deviations a value is from the mean: z = (x − μ)/σ."

fat-tails:
  defined_in: "0.4"
  zh-cn: 肥尾
  en: fat tails
  short:
    zh-cn: 极端值出现得比同样标准差的正态分布更频繁。
    en: Extreme values occur more often than in a normal distribution with the same standard deviation.

median:
  defined_in: "0.4"
  zh-cn: 中位数
  en: median
  short:
    zh-cn: 把所有可能结果从小到大排列时排在正中间的值；一半的结果低于它，一半高于它。
    en: The middle value when all outcomes are sorted; half of the outcomes are below it and half above.

right-skew:
  defined_in: "0.4"
  zh-cn: 右偏
  en: right skew
  short:
    zh-cn: 分布的右侧拖出长尾，期望大于中位数。
    en: A distribution with a long tail on the right, so the mean is above the median.

lognormal-distribution:
  defined_in: "0.4"
  zh-cn: 对数正态分布
  en: lognormal distribution
  short:
    zh-cn: 取对数后服从正态分布的分布；长期连乘的财富近似服从它。
    en: A distribution whose logarithm is normal; wealth that compounds over many periods is approximately lognormal.

parameter-estimation:
  defined_in: "0.4"
  zh-cn: 参数估计
  en: parameter estimation
  short:
    zh-cn: 用样本数据推断总体参数（例如真实的期望和标准差）。
    en: Using sample data to infer population parameters, such as the true mean and standard deviation.

sample-mean:
  defined_in: "0.4"
  zh-cn: 样本均值
  en: sample mean
  short:
    zh-cn: 样本中各观测值的算术平均，用来估计真实的期望。
    en: The average of the observations in a sample, used to estimate the true mean.

sample-standard-deviation:
  defined_in: "0.4"
  zh-cn: 样本标准差
  en: sample standard deviation
  short:
    zh-cn: 偏差平方和除以 n − 1 再开平方，用来估计真实的标准差。
    en: The square root of the sum of squared deviations divided by n − 1, used to estimate the true standard deviation.

degrees-of-freedom:
  defined_in: "0.4"
  zh-cn: 自由度
  en: degrees of freedom
  short:
    zh-cn: 在计算一个统计量时可以自由变化的数据个数。
    en: The number of values that are free to vary when a statistic is computed.

standard-error:
  defined_in: "0.4"
  zh-cn: 标准误
  en: standard error
  short:
    zh-cn: 估计值（例如样本均值）在不同样本之间的标准差，衡量估计的精度。
    en: The standard deviation of an estimate, such as the sample mean, across different samples; it measures how precise the estimate is.

central-limit-theorem:
  defined_in: "0.4"
  zh-cn: 中心极限定理
  en: central limit theorem
  short:
    zh-cn: 很多独立随机变量的平均值近似服从正态分布。
    en: The average of many independent random variables is approximately normally distributed.

confidence-interval:
  defined_in: "0.4"
  zh-cn: 置信区间
  en: confidence interval
  short:
    zh-cn: 按某种方法从样本构造的区间；用这种方法构造的区间中，有约定比例（如 95%）会包含真实参数。
    en: An interval built from a sample by a method such that a stated share (for example 95%) of the intervals built this way contain the true parameter.

t-distribution:
  defined_in: "0.4"
  zh-cn: t 分布
  en: t distribution
  short:
    zh-cn: 用样本标准差代替真实标准差时所用的分布，比正态分布尾部更厚；样本越大越接近正态分布。
    en: The distribution used when the sample standard deviation replaces the true one; it has thicker tails than the normal distribution and approaches it as the sample grows.

hypothesis-test:
  defined_in: "0.4"
  zh-cn: 假设检验
  en: hypothesis test
  short:
    zh-cn: 判断数据是否与某个假设（如真实期望为 0）明显不符的方法。
    en: A method for deciding whether the data clearly contradict a hypothesis, such as a true mean of 0.

t-statistic:
  defined_in: "0.4"
  zh-cn: t 值
  en: t-statistic
  short:
    zh-cn: 估计值除以它的标准误：估计值离 0 有几个标准误。
    en: "An estimate divided by its standard error: how many standard errors the estimate is from 0."

statistical-significance:
  defined_in: "0.4"
  zh-cn: 统计显著性
  en: statistical significance
  short:
    zh-cn: 如果原假设成立，得到这样极端的结果的概率低于约定的水平（如 5%）。
    en: If the null hypothesis were true, a result this extreme would occur with a probability below a chosen level, such as 5%.

multiple-testing:
  defined_in: "0.4"
  zh-cn: 多重检验
  en: multiple testing
  short:
    zh-cn: 同时检验很多个假设时，碰巧出现显著结果的问题。
    en: The problem of results that are significant by chance when many hypotheses are tested.

# ---------- 0.5 ----------

regression:
  defined_in: "0.5"
  zh-cn: 回归
  en: regression
  short:
    zh-cn: 用一条直线（或其他函数）描述一个变量的平均值怎样随另一个变量变化。
    en: Describing how the average of one variable changes with another variable, with a line or another function.

ols:
  defined_in: "0.5"
  zh-cn: 普通最小二乘法
  en: ordinary least squares
  short:
    zh-cn: 选择截距和斜率，使残差平方和最小的估计方法（OLS）。
    en: The estimation method that chooses the intercept and slope to minimize the sum of squared residuals (OLS).

residual:
  defined_in: "0.5"
  zh-cn: 残差
  en: residual
  short:
    zh-cn: 实际值减去回归直线给出的拟合值。
    en: The actual value minus the fitted value given by the regression line.

regression-coefficient:
  defined_in: "0.5"
  zh-cn: 回归系数
  en: regression coefficient
  short:
    zh-cn: 回归方程中自变量前的系数；斜率表示自变量增加一个单位时，因变量平均变化多少。
    en: The number in front of an explanatory variable in a regression; the slope is the average change in the dependent variable per unit increase in the explanatory variable.

r-squared:
  defined_in: "0.5"
  zh-cn: 决定系数
  en: R-squared
  short:
    zh-cn: 因变量的方差中被回归解释的比例（R²），在 0 和 1 之间。
    en: The share of the variance of the dependent variable that the regression explains (R²), between 0 and 1.

omitted-variable-bias:
  defined_in: "0.5"
  zh-cn: 遗漏变量偏差
  en: omitted variable bias
  short:
    zh-cn: 回归中漏掉了一个既影响因变量、又与自变量相关的变量，使系数的估计出现偏差。
    en: Bias in a coefficient estimate caused by leaving out a variable that affects the dependent variable and is correlated with an explanatory variable.

correlation-vs-causation:
  defined_in: "0.5"
  zh-cn: 相关与因果
  en: correlation and causation
  short:
    zh-cn: 两个变量相关，不代表一个是另一个的原因。
    en: Two variables being correlated does not mean that one causes the other.

# ---------- 1.1 ----------

demand:
  defined_in: "1.1"
  zh-cn: 需求
  en: demand
  short:
    zh-cn: 在其他条件不变时，一种商品的价格与买方愿意并且能够购买的数量之间的关系。
    en: The relation between the price of a good and the quantity that buyers are willing and able to buy, other things being equal.

supply:
  defined_in: "1.1"
  zh-cn: 供给
  en: supply
  short:
    zh-cn: 在其他条件不变时，一种商品的价格与卖方愿意并且能够出售的数量之间的关系。
    en: The relation between the price of a good and the quantity that sellers are willing and able to sell, other things being equal.

market-equilibrium:
  defined_in: "1.1"
  zh-cn: 市场均衡
  en: market equilibrium
  short:
    zh-cn: 需求量等于供给量时的价格和数量。
    en: The price and quantity at which the quantity demanded equals the quantity supplied.

comparative-statics:
  defined_in: "1.1"
  zh-cn: 比较静态
  en: comparative statics
  short:
    zh-cn: 比较某个外部条件改变前后的两个均衡，而不研究调整的过程。
    en: Comparing the equilibria before and after a change in an outside condition, without studying the path of adjustment.

price-elasticity:
  defined_in: "1.1"
  zh-cn: 需求的价格弹性
  en: price elasticity of demand
  short:
    zh-cn: 价格变化 1% 时，需求量变化的百分比。
    en: The percentage change in the quantity demanded when the price changes by 1%.

income-elasticity:
  defined_in: "1.1"
  zh-cn: 收入弹性
  en: income elasticity
  short:
    zh-cn: 收入变化 1% 时，需求量变化的百分比。
    en: The percentage change in the quantity demanded when income changes by 1%.

cross-price-elasticity:
  defined_in: "1.1"
  zh-cn: 交叉价格弹性
  en: cross-price elasticity
  short:
    zh-cn: 另一种商品的价格变化 1% 时，这种商品的需求量变化的百分比。
    en: The percentage change in the quantity demanded of a good when the price of another good changes by 1%.

# ---------- 1.2 ----------

preferences:
  defined_in: "1.2"
  zh-cn: 偏好
  en: preferences
  short:
    zh-cn: 消费者对不同商品组合的排序。
    en: A consumer's ranking of different bundles of goods.

utility-function:
  defined_in: "1.2"
  zh-cn: 效用函数
  en: utility function
  short:
    zh-cn: 给每个商品组合打分、分数越高越受偏好的函数；只用来排序。
    en: A function that scores each bundle so that preferred bundles get higher scores; it is used only for ranking.

marginal-utility:
  defined_in: "1.2"
  zh-cn: 边际效用
  en: marginal utility
  short:
    zh-cn: 其他商品不变时，多消费一单位某种商品带来的效用增加。
    en: The increase in utility from consuming one more unit of a good, other goods unchanged.

indifference-curve:
  defined_in: "1.2"
  zh-cn: 无差异曲线
  en: indifference curve
  short:
    zh-cn: 效用相同的所有商品组合连成的曲线。
    en: The curve of all bundles that give the same utility.

marginal-rate-of-substitution:
  defined_in: "1.2"
  zh-cn: 边际替代率
  en: marginal rate of substitution
  short:
    zh-cn: 为了多得到一单位 x，消费者愿意放弃的 y 的数量，等于 MUx/MUy。
    en: The quantity of y a consumer is willing to give up for one more unit of x; it equals MUx/MUy.

substitution-effect:
  defined_in: "1.2"
  zh-cn: 替代效应
  en: substitution effect
  short:
    zh-cn: 价格变化时，只因相对价格改变（购买力不变）而引起的需求量变化。
    en: The change in quantity demanded caused only by the change in relative prices, with purchasing power held constant.

income-effect:
  defined_in: "1.2"
  zh-cn: 收入效应
  en: income effect
  short:
    zh-cn: 价格变化时，因实际购买力改变而引起的需求量变化。
    en: The change in quantity demanded caused by the change in real purchasing power when a price changes.

slutsky-equation:
  defined_in: "1.2"
  zh-cn: Slutsky 方程
  en: Slutsky equation
  short:
    zh-cn: 把价格变化对需求的影响分解为替代效应和收入效应的方程。
    en: The equation that splits the effect of a price change on demand into a substitution effect and an income effect.

giffen-good:
  defined_in: "1.2"
  zh-cn: 吉芬商品
  en: Giffen good
  short:
    zh-cn: 收入效应超过替代效应、价格上升时需求量反而增加的劣等品。
    en: An inferior good whose income effect outweighs the substitution effect, so that the quantity demanded rises when its price rises.

# ---------- 1.3 ----------

intertemporal-budget-constraint:
  defined_in: "1.3"
  zh-cn: 跨期预算约束
  en: intertemporal budget constraint
  short:
    zh-cn: 各期消费的现值等于各期收入的现值。
    en: "The present value of consumption over time equals the present value of income."

time-preference:
  defined_in: "1.3"
  zh-cn: 时间偏好
  en: time preference
  short:
    zh-cn: 对现在的消费比对未来的消费看得更重。
    en: "Valuing consumption now more than the same consumption in the future."

euler-equation:
  defined_in: "1.3"
  zh-cn: Euler 方程
  en: Euler equation
  short:
    zh-cn: 跨期最优消费的条件 u′(c₁) = β(1 + r)u′(c₂)。
    en: "The condition for the best consumption over time, u′(c₁) = β(1 + r)u′(c₂)."

consumption-smoothing:
  defined_in: "1.3"
  zh-cn: 消费平滑
  en: consumption smoothing
  short:
    zh-cn: 通过储蓄和借款，使各期消费比收入更平稳。
    en: "Using saving and borrowing to keep consumption steadier over time than income."

inflation:
  defined_in: "1.3"
  zh-cn: 通货膨胀率
  en: inflation rate
  short:
    zh-cn: 物价总水平的年增长率。
    en: "The yearly growth rate of the general price level."

nominal-interest-rate:
  defined_in: "1.3"
  zh-cn: 名义利率
  en: nominal interest rate
  short:
    zh-cn: 用货币衡量的回报率。
    en: "The rate of return measured in money."

real-interest-rate:
  defined_in: "1.3"
  zh-cn: 实际利率
  en: real interest rate
  short:
    zh-cn: 用购买力衡量的回报率，约等于名义利率减通胀率。
    en: "The rate of return measured in purchasing power, about the nominal rate minus inflation."

fisher-equation:
  defined_in: "1.3"
  zh-cn: Fisher 方程
  en: Fisher equation
  short:
    zh-cn: 1 + 实际利率 = (1 + 名义利率) / (1 + 通胀率)。
    en: "1 + real rate = (1 + nominal rate) / (1 + inflation)."

# ---------- 1.4 ----------

expected-utility:
  defined_in: "1.4"
  zh-cn: 期望效用
  en: expected utility
  short:
    zh-cn: "各种结果的效用按概率加权的平均值。"
    en: "The probability-weighted average of the utility of each outcome."

risk-aversion:
  defined_in: "1.4"
  zh-cn: 风险厌恶
  en: risk aversion
  short:
    zh-cn: "宁愿确定地得到赌局的期望值，也不参加赌局；等价于效用函数是凹函数。"
    en: "Preferring the expected value of a gamble for sure to the gamble itself; equivalent to a concave utility function."

absolute-risk-aversion:
  defined_in: "1.4"
  zh-cn: 绝对风险厌恶系数
  en: coefficient of absolute risk aversion
  short:
    zh-cn: "A(W) = −u″(W)/u′(W)，衡量对固定金额赌局的厌恶程度。"
    en: "A(W) = −u″(W)/u′(W), which measures aversion to gambles of fixed dollar size."

relative-risk-aversion:
  defined_in: "1.4"
  zh-cn: 相对风险厌恶系数
  en: coefficient of relative risk aversion
  short:
    zh-cn: "R(W) = −W u″(W)/u′(W)，衡量对按财富比例的赌局的厌恶程度。"
    en: "R(W) = −W u″(W)/u′(W), which measures aversion to gambles proportional to wealth."

certainty-equivalent:
  defined_in: "1.4"
  zh-cn: 确定性等价
  en: certainty equivalent
  short:
    zh-cn: "与赌局的期望效用相同的确定金额。"
    en: "The sure amount that gives the same utility as the expected utility of a gamble."

risk-premium:
  defined_in: "1.4"
  zh-cn: 风险溢价
  en: risk premium
  short:
    zh-cn: "期望值减去确定性等价：为消除风险愿意放弃的期望财富。"
    en: "The expected value minus the certainty equivalent: the expected wealth one is willing to give up to remove the risk."

crra-utility:
  defined_in: "1.4"
  zh-cn: CRRA 效用
  en: CRRA utility
  short:
    zh-cn: "相对风险厌恶系数为常数 γ 的效用函数 W^(1−γ)/(1−γ)，γ = 1 时为 ln W。"
    en: "The utility function W^(1−γ)/(1−γ) with constant relative risk aversion γ; ln W when γ = 1."

# ---------- 1.5 ----------
production-function:
  defined_in: "1.5"
  zh-cn: 生产函数
  en: production function
  short:
    zh-cn: "投入（资本 K、劳动 L）与最大产量之间的关系 Q = f(K, L)。"
    en: "The relation Q = f(K, L) between inputs (capital K, labor L) and the maximum output."

short-run:
  defined_in: "1.5"
  zh-cn: 短期
  en: short run
  short:
    zh-cn: "至少有一种投入（通常是资本）来不及调整的时期。"
    en: "A period in which at least one input (usually capital) cannot be adjusted."

long-run:
  defined_in: "1.5"
  zh-cn: 长期
  en: long run
  short:
    zh-cn: "所有投入都可以调整、厂商可以进入或退出行业的时期。"
    en: "A period in which all inputs can be adjusted and firms can enter or exit the industry."

marginal-product:
  defined_in: "1.5"
  zh-cn: 边际产量
  en: marginal product
  short:
    zh-cn: "其他投入不变时，多投入一单位某种投入带来的产量增加，如 MP_L = ∂Q/∂L。"
    en: "The extra output from one more unit of an input with the other inputs fixed, such as MP_L = ∂Q/∂L."

returns-to-scale:
  defined_in: "1.5"
  zh-cn: 规模报酬
  en: returns to scale
  short:
    zh-cn: "所有投入同比例增加 t 倍时，产量增加多于、等于或少于 t 倍（递增、不变、递减）。"
    en: "Whether output rises by more than, exactly or less than t times when all inputs rise t times (increasing, constant, decreasing)."

average-cost:
  defined_in: "1.5"
  zh-cn: 平均成本
  en: average cost
  short:
    zh-cn: "成本除以产量：平均可变成本 AVC = VC/q，平均总成本 ATC = C/q。"
    en: "Cost divided by output: average variable cost AVC = VC/q and average total cost ATC = C/q."

perfect-competition:
  defined_in: "1.5"
  zh-cn: 完全竞争
  en: perfect competition
  short:
    zh-cn: "厂商众多、产品相同、可以自由进出，每个厂商都只能接受市场价格的市场。"
    en: "A market with many firms, identical products and free entry and exit, where every firm takes the market price as given."

shutdown-point:
  defined_in: "1.5"
  zh-cn: 停产点
  en: shutdown point
  short:
    zh-cn: "AVC 的最低点；价格低于它时，厂商短期内停产比生产好。"
    en: "The minimum of AVC; below this price a firm does better by shutting down in the short run."

economic-profit:
  defined_in: "1.5"
  zh-cn: 经济利润
  en: economic profit
  short:
    zh-cn: "收入减去包括机会成本在内的全部成本；为 0 时投入获得正常回报。"
    en: "Revenue minus all costs including opportunity costs; when it is 0 the inputs earn a normal return."

# ---------- 1.6 ----------
monopoly:
  defined_in: "1.6"
  zh-cn: 垄断
  en: monopoly
  short:
    zh-cn: "市场中只有一个卖者、产品没有相近替代品的市场结构；按 MR = MC 定产量，价格由需求曲线决定。"
    en: "A market with a single seller of a product without close substitutes; it sets output where MR = MC and reads the price from the demand curve."

lerner-index:
  defined_in: "1.6"
  zh-cn: 勒纳指数
  en: Lerner index
  short:
    zh-cn: "(P − MC)/P，价格高出边际成本的比例；利润最大时等于 1/|ε|，衡量定价能力。"
    en: "(P − MC)/P, the share of the price above marginal cost; at the profit maximum it equals 1/|ε| and measures market power."

price-discrimination:
  defined_in: "1.6"
  zh-cn: 价格歧视
  en: price discrimination
  short:
    zh-cn: "对不同买者收取与成本差别无关的不同价格；分一、二、三级。"
    en: "Charging different buyers different prices that do not reflect cost differences; first, second or third degree."

oligopoly:
  defined_in: "1.6"
  zh-cn: 寡头
  en: oligopoly
  short:
    zh-cn: "只有少数几个厂商、彼此的决策相互影响的市场。"
    en: "A market with only a few firms whose decisions affect each other."

cournot-model:
  defined_in: "1.6"
  zh-cn: 古诺模型
  en: Cournot model
  short:
    zh-cn: "厂商同时选择产量的寡头模型；均衡产量介于垄断和完全竞争之间。"
    en: "An oligopoly model in which firms choose quantities simultaneously; equilibrium output lies between monopoly and perfect competition."

bertrand-model:
  defined_in: "1.6"
  zh-cn: 伯特兰模型
  en: Bertrand model
  short:
    zh-cn: "厂商同时选择价格的寡头模型；产品和成本相同时，两个厂商就使价格等于边际成本。"
    en: "An oligopoly model in which firms choose prices simultaneously; with identical products and costs, two firms already drive the price to marginal cost."

monopolistic-competition:
  defined_in: "1.6"
  zh-cn: 垄断竞争
  en: monopolistic competition
  short:
    zh-cn: "厂商很多、产品有差别、可以自由进入的市场；长期经济利润为 0。"
    en: "A market with many firms, differentiated products and free entry; economic profit is 0 in the long run."

barriers-to-entry:
  defined_in: "1.6"
  zh-cn: 进入壁垒
  en: barriers to entry
  short:
    zh-cn: "阻止新厂商进入或模仿的因素：规模经济、网络效应、转换成本、无形资产、成本优势。"
    en: "Factors that keep new firms from entering or imitating: economies of scale, network effects, switching costs, intangible assets, cost advantages."

natural-monopoly:
  defined_in: "1.6"
  zh-cn: 自然垄断
  en: natural monopoly
  short:
    zh-cn: "在整个市场需求范围内平均成本都在下降，由一家厂商生产成本最低的行业。"
    en: "An industry in which average cost falls over the whole range of market demand, so one firm can produce at the lowest cost."

economic-moat:
  defined_in: "1.6"
  zh-cn: 护城河
  en: economic moat
  short:
    zh-cn: "使企业的经济利润能长期保持为正的持久竞争优势。"
    en: "A durable competitive advantage that keeps a firm's economic profit positive for a long time."

game:
  defined_in: "1.7"
  zh-cn: 博弈
  en: game
  short:
    zh-cn: "几个决策者的收益相互依赖的情形，由参与者、策略和收益组成。"
    en: "A situation in which the payoffs of several decision makers depend on each other's choices; it consists of players, strategies and payoffs."

dominant-strategy:
  defined_in: "1.7"
  zh-cn: 占优策略
  en: dominant strategy
  short:
    zh-cn: "无论对手选什么，都比自己的其他策略更好的策略。"
    en: "A strategy that is better than the player's other strategies whatever the others choose."

prisoners-dilemma:
  defined_in: "1.7"
  zh-cn: 囚徒困境
  en: prisoner's dilemma
  short:
    zh-cn: "每个参与者都选自己的占优策略，结果却比另一种结果对所有人都差的博弈。"
    en: "A game in which each player's dominant strategy leads to an outcome that is worse for everyone than another outcome."

nash-equilibrium:
  defined_in: "1.7"
  zh-cn: 纳什均衡
  en: Nash equilibrium
  short:
    zh-cn: "每个参与者的策略都是对其他人策略的最优反应、谁也不想单方面改变的策略组合。"
    en: "A combination of strategies in which each player's strategy is a best response to the others', so no one wants to change alone."

backward-induction:
  defined_in: "1.7"
  zh-cn: 倒推法
  en: backward induction
  short:
    zh-cn: "求解先后行动的博弈：从最后一个决策开始找出最优选择，再依次往前推。"
    en: "Solving a sequential game by finding the best choice at the last decision first and then working back step by step."

repeated-game:
  defined_in: "1.7"
  zh-cn: 重复博弈
  en: repeated game
  short:
    zh-cn: "同一个博弈一期又一期地重复进行；今天的选择会影响对手以后的选择，合作因此可能维持。"
    en: "The same game played period after period; today's choice affects the other side's later choices, so cooperation may be sustained."

consumer-surplus:
  defined_in: "1.8"
  zh-cn: 消费者剩余
  en: consumer surplus
  short:
    zh-cn: "买者的支付意愿减去实际支付的价格的总和，即需求曲线以下、价格以上的面积。"
    en: "The sum of buyers' willingness to pay minus the price they actually pay: the area below the demand curve and above the price."

producer-surplus:
  defined_in: "1.8"
  zh-cn: 生产者剩余
  en: producer surplus
  short:
    zh-cn: "卖方得到的价格减去边际成本的总和，即价格以下、供给曲线以上的面积，等于收入减去可变成本。"
    en: "The sum of the price sellers receive minus marginal cost: the area below the price and above the supply curve, equal to revenue minus variable cost."

deadweight-loss:
  defined_in: "1.8"
  zh-cn: 无谓损失
  en: deadweight loss
  short:
    zh-cn: "成交量偏离有效率的数量时，总剩余中没有被任何人得到的部分。"
    en: "The part of total surplus that no one gets when the quantity traded differs from the efficient quantity."

tax-incidence:
  defined_in: "1.8"
  zh-cn: 税收归宿
  en: tax incidence
  short:
    zh-cn: "税的负担实际由买方和卖方各承担多少。"
    en: "How the burden of a tax is actually split between buyers and sellers."

externality:
  defined_in: "1.8"
  zh-cn: 外部性
  en: externality
  short:
    zh-cn: "一方的决策影响了别人，而这种影响没有反映在价格中。"
    en: "An effect of one party's decision on others that is not reflected in prices."

pigouvian-tax:
  defined_in: "1.8"
  zh-cn: 庇古税
  en: Pigouvian tax
  short:
    zh-cn: "对每单位产量征收、等于其外部成本的税，使决策者面对全部社会成本。"
    en: "A tax per unit equal to its external cost, which makes the decision maker face the full social cost."

public-good:
  defined_in: "1.8"
  zh-cn: 公共品
  en: public good
  short:
    zh-cn: "既没有竞争性、也没有排他性的物品；有搭便车问题，市场提供得太少。"
    en: "A good that is neither rival nor excludable; it has a free-rider problem, and markets provide too little of it."

asymmetric-information:
  defined_in: "1.9"
  zh-cn: 信息不对称
  en: asymmetric information
  short:
    zh-cn: "交易的一方掌握另一方不知道的信息。"
    en: "One side of a transaction knows something the other side does not."

adverse-selection:
  defined_in: "1.9"
  zh-cn: 逆向选择
  en: adverse selection
  short:
    zh-cn: "交易前的信息不对称使知道得少的一方面对最不利的交易对象，好的类型退出市场。"
    en: "Hidden information before a transaction leaves the less-informed side facing the worst counterparties, as the good types leave the market."

signaling:
  defined_in: "1.9"
  zh-cn: 信号传递
  en: signaling
  short:
    zh-cn: "知道得多的一方用对好类型便宜、对差类型昂贵的行动表明自己的类型。"
    en: "The better-informed side reveals its type through an action that is cheap for good types and expensive for bad types."

screening:
  defined_in: "1.9"
  zh-cn: 筛选
  en: screening
  short:
    zh-cn: "知道得少的一方设计几种选择，让对方通过自己的选择暴露类型。"
    en: "The less-informed side designs a set of choices so that the other side reveals its type by what it chooses."

moral-hazard:
  defined_in: "1.9"
  zh-cn: 道德风险
  en: moral hazard
  short:
    zh-cn: "合同使一方不再承担自己行为的全部后果，从而改变了他看不见的行为。"
    en: "A contract that relieves one side of the full consequences of its actions changes those actions, which the other side cannot see."

principal-agent-problem:
  defined_in: "1.9"
  zh-cn: 委托–代理问题
  en: principal-agent problem
  short:
    zh-cn: "代理人替委托人做事，但两者利益不一致，委托人又不能完全观察代理人的行动。"
    en: "An agent acts for a principal, but their interests differ and the principal cannot fully observe the agent's actions."

gdp:
  defined_in: "2.1"
  zh-cn: 国内生产总值
  en: gross domestic product
  short:
    zh-cn: "一个国家在一段时间内、在境内生产的所有最终产品和服务的市场价值。"
    en: "The market value of all final goods and services produced within a country in a period."

real-gdp:
  defined_in: "2.1"
  zh-cn: 实际 GDP
  en: real GDP
  short:
    zh-cn: "按固定基年价格计算的 GDP，只反映产量的变化。"
    en: "GDP valued at the prices of a fixed base year, so that it reflects only changes in output."

gdp-deflator:
  defined_in: "2.1"
  zh-cn: GDP 平减指数
  en: GDP deflator
  short:
    zh-cn: "名义 GDP 与实际 GDP 之比乘以 100，衡量所有国内生产的产品和服务的价格水平。"
    en: "Nominal GDP divided by real GDP, times 100; a measure of the price level of all goods and services produced at home."

cpi:
  defined_in: "2.1"
  zh-cn: 消费者价格指数
  en: consumer price index
  short:
    zh-cn: "按固定的一篮子消费品和服务计算的价格水平，由美国劳工统计局每月公布。"
    en: "The price level of a fixed basket of consumer goods and services, published monthly by the US Bureau of Labor Statistics."

pce-price-index:
  defined_in: "2.1"
  zh-cn: PCE 价格指数
  en: PCE price index
  short:
    zh-cn: "个人消费支出价格指数：覆盖范围比 CPI 广、权重每期更新的价格指数；美联储的通胀目标按它定义。"
    en: "The personal consumption expenditures price index: broader than the CPI, with weights updated each period; the Fed defines its inflation target with it."

core-inflation:
  defined_in: "2.1"
  zh-cn: 核心通胀
  en: core inflation
  short:
    zh-cn: "去掉波动很大的食品和能源价格之后的通胀率。"
    en: "Inflation excluding the volatile prices of food and energy."

unemployment-rate:
  defined_in: "2.1"
  zh-cn: 失业率
  en: unemployment rate
  short:
    zh-cn: "失业人数占劳动力的比例；失业者是没有工作、可以工作并在找工作的人。"
    en: "The unemployed as a share of the labor force; the unemployed are people without a job who are available and looking for work."

labor-force-participation-rate:
  defined_in: "2.1"
  zh-cn: 劳动参与率
  en: labor force participation rate
  short:
    zh-cn: "劳动力（就业者加失业者）占 16 岁及以上人口的比例。"
    en: "The labor force (employed plus unemployed) as a share of the population aged 16 and over."

total-factor-productivity:
  defined_in: "2.2"
  zh-cn: 全要素生产率
  en: total factor productivity
  short:
    zh-cn: "生产函数中的 $A$：同样的资本和劳动能生产多少，包括技术、组织效率和制度。"
    en: "The $A$ in the production function: how much the same capital and labor can produce, including technology, organization and institutions."

growth-accounting:
  defined_in: "2.2"
  zh-cn: 增长核算
  en: growth accounting
  short:
    zh-cn: "把产出增长分解为资本、劳动和全要素生产率的贡献：$g_Y = g_A + \\alpha g_K + (1 - \\alpha) g_L$。"
    en: "Splitting output growth into the contributions of capital, labor and TFP: $g_Y = g_A + \\alpha g_K + (1 - \\alpha) g_L$."

solow-model:
  defined_in: "2.2"
  zh-cn: Solow 模型
  en: Solow model
  short:
    zh-cn: "描述资本积累的增长模型：人均资本的变化等于人均投资减去维持人均资本所需的投资。"
    en: "A growth model of capital accumulation: the change in capital per worker is investment per worker minus the investment needed to keep capital per worker constant."

steady-state:
  defined_in: "2.2"
  zh-cn: 稳态
  en: steady state
  short:
    zh-cn: "投资恰好等于维持所需、人均资本不再变化的状态。"
    en: "The state in which investment just equals what is needed, so capital per worker no longer changes."

money-supply:
  defined_in: "2.3"
  zh-cn: 货币供给
  en: money supply
  short:
    zh-cn: "经济中的货币总量，包括现金和银行存款，常用 M2 衡量。"
    en: "The total amount of money in the economy, including currency and bank deposits, often measured by M2."

monetary-base:
  defined_in: "2.3"
  zh-cn: 基础货币
  en: monetary base
  short:
    zh-cn: "流通中的现金加上商业银行在央行的准备金，由央行直接控制。"
    en: "Currency in circulation plus banks' reserves at the central bank; directly controlled by the central bank."

fractional-reserve-banking:
  defined_in: "2.3"
  zh-cn: 部分准备金制度
  en: fractional reserve banking
  short:
    zh-cn: "银行只把存款的一部分留作准备金，其余贷出；贷款因此创造新的存款。"
    en: "Banks keep only part of their deposits as reserves and lend the rest, so loans create new deposits."

money-multiplier:
  defined_in: "2.3"
  zh-cn: 货币乘数
  en: money multiplier
  short:
    zh-cn: "货币供给与基础货币之比，$m = \\frac{1 + c}{c + r}$。"
    en: "The ratio of the money supply to the monetary base, $m = \\frac{1 + c}{c + r}$."

bank-run:
  defined_in: "2.3"
  zh-cn: 银行挤兑
  en: bank run
  short:
    zh-cn: "存款人担心银行倒闭而争相取款；它会自我实现。"
    en: "Depositors rushing to withdraw because they fear the bank will fail; it can be self-fulfilling."

deposit-insurance:
  defined_in: "2.3"
  zh-cn: 存款保险
  en: deposit insurance
  short:
    zh-cn: "银行倒闭时，政府保证存款人在一定金额内的存款；能防止挤兑，但带来道德风险。"
    en: "A government guarantee of deposits up to a limit if a bank fails; it prevents runs but brings moral hazard."

quantity-theory-of-money:
  defined_in: "2.3"
  zh-cn: 货币数量论
  en: quantity theory of money
  short:
    zh-cn: "由 $MV = PY$ 并假设流通速度稳定、产出与货币无关，得出长期中货币增长主要带来通胀。"
    en: "From $MV = PY$, assuming stable velocity and output independent of money, the theory that in the long run money growth mainly brings inflation."

potential-output:
  defined_in: "2.4"
  zh-cn: 潜在产出
  en: potential output
  short:
    zh-cn: "所有资源都被正常使用时的产出，由资本、劳动和全要素生产率决定。"
    en: "The output produced when all resources are used at normal rates, determined by capital, labor and TFP."

output-gap:
  defined_in: "2.4"
  zh-cn: 产出缺口
  en: output gap
  short:
    zh-cn: "实际产出与潜在产出之差占潜在产出的比例，$\\frac{Y - Y^*}{Y^*}$。"
    en: "Actual minus potential output as a share of potential output, $\\frac{Y - Y^*}{Y^*}$."

is-curve:
  defined_in: "2.4"
  zh-cn: IS 曲线
  en: IS curve
  short:
    zh-cn: "实际利率与使产出等于计划支出的产出之间的关系；利率越高，投资越少，产出越低。"
    en: "The relation between the real interest rate and the output at which output equals planned spending; a higher rate means less investment and lower output."

aggregate-demand:
  defined_in: "2.4"
  zh-cn: 总需求
  en: aggregate demand
  short:
    zh-cn: "在每个价格水平上经济中对产出的总需求量；AD 曲线向下倾斜。"
    en: "The total quantity of output demanded in the economy at each price level; the AD curve slopes down."

aggregate-supply:
  defined_in: "2.4"
  zh-cn: 总供给
  en: aggregate supply
  short:
    zh-cn: "在每个价格水平上企业愿意生产的产出；短期向上倾斜，长期是潜在产出处的竖线。"
    en: "The output firms are willing to produce at each price level; upward-sloping in the short run, vertical at potential output in the long run."

natural-rate-of-unemployment:
  defined_in: "2.4"
  zh-cn: 自然失业率
  en: natural rate of unemployment
  short:
    zh-cn: "经济不衰退也不过热时的正常失业率。"
    en: "The normal unemployment rate when the economy is neither in recession nor overheating."

phillips-curve:
  defined_in: "2.4"
  zh-cn: Phillips 曲线
  en: Phillips curve
  short:
    zh-cn: "通胀与失业的关系：$\\pi = \\pi^e - \\beta(u - u^*)$。"
    en: "The relation between inflation and unemployment: $\\pi = \\pi^e - \\beta(u - u^*)$."

federal-funds-rate:
  defined_in: "2.5"
  zh-cn: 联邦基金利率
  en: federal funds rate
  short:
    zh-cn: "美国银行之间隔夜借贷准备金的利率；FOMC 为它设定目标区间。"
    en: "The rate at which US banks lend reserves to each other overnight; the FOMC sets a target range for it."

zero-lower-bound:
  defined_in: "2.5"
  zh-cn: 零下限
  en: zero lower bound
  short:
    zh-cn: "名义利率不能远低于零，因为人们可以改为持有现金。"
    en: "Nominal interest rates cannot go far below zero, because people can hold cash instead."

quantitative-easing:
  defined_in: "2.5"
  zh-cn: 量化宽松
  en: quantitative easing
  short:
    zh-cn: "央行大量购买长期债券，直接压低长期利率。"
    en: "Large central bank purchases of long-term bonds to push long-term rates down directly."

forward-guidance:
  defined_in: "2.5"
  zh-cn: 前瞻指引
  en: forward guidance
  short:
    zh-cn: "央行说明未来利率的走向，通过改变对未来短期利率的预期影响长期利率。"
    en: "Central bank statements about the future path of rates, which affect long rates by changing expected future short rates."

taylor-rule:
  defined_in: "2.5"
  zh-cn: Taylor 规则
  en: Taylor rule
  short:
    zh-cn: "按通胀和产出缺口设定政策利率的参照规则：$i = r^* + \\pi + 0.5(\\pi - \\pi^T) + 0.5\\,\\text{gap}$。"
    en: "A reference rule setting the policy rate from inflation and the output gap: $i = r^* + \\pi + 0.5(\\pi - \\pi^T) + 0.5\\,\\text{gap}$."

neutral-interest-rate:
  defined_in: "2.5"
  zh-cn: 中性利率
  en: neutral interest rate
  short:
    zh-cn: "既不刺激也不抑制经济的实际利率 $r^*$，只能估计。"
    en: "The real interest rate $r^*$ that neither stimulates nor restrains the economy; it can only be estimated."

budget-deficit:
  defined_in: "2.6"
  zh-cn: 财政赤字
  en: budget deficit
  short:
    zh-cn: "政府支出大于收入的部分，靠发债弥补。"
    en: "The amount by which government spending exceeds revenue, financed by borrowing."

primary-deficit:
  defined_in: "2.6"
  zh-cn: 基本赤字
  en: primary deficit
  short:
    zh-cn: "不含利息支出的财政赤字。"
    en: "The budget deficit excluding interest payments."

fiscal-multiplier:
  defined_in: "2.6"
  zh-cn: 财政乘数
  en: fiscal multiplier
  short:
    zh-cn: "产出的变化与政府支出或税收的变化之比。"
    en: "The change in output divided by the change in government spending or taxes."

automatic-stabilizer:
  defined_in: "2.6"
  zh-cn: 自动稳定器
  en: automatic stabilizer
  short:
    zh-cn: "随经济波动自动反向调整的税收和支出，例如所得税和失业救济。"
    en: "Taxes and spending that move against the cycle automatically, such as income taxes and unemployment benefits."

crowding-out:
  defined_in: "2.6"
  zh-cn: 挤出效应
  en: crowding out
  short:
    zh-cn: "政府借款增加支出使利率上升、私人投资减少。"
    en: "Government borrowing for spending that raises interest rates and reduces private investment."

ricardian-equivalence:
  defined_in: "2.6"
  zh-cn: Ricardo 等价
  en: Ricardian equivalence
  short:
    zh-cn: "给定政府支出，用税收还是发债融资结果相同，因为理性的家庭会把减税存起来准备将来交税。"
    en: "Given government spending, financing by taxes or by debt has the same effect, because rational households save a tax cut to pay future taxes."

current-account:
  defined_in: "2.7"
  zh-cn: 经常账户
  en: current account
  short:
    zh-cn: "净出口加从外国得到的净投资收入和净转移；赤字对应等额的资本净流入。"
    en: "Net exports plus net investment income and net transfers from abroad; a deficit matches an equal net capital inflow."

nominal-exchange-rate:
  defined_in: "2.7"
  zh-cn: 名义汇率
  en: nominal exchange rate
  short:
    zh-cn: "两种货币的兑换比率；本课程记为每单位外币的本币价格。"
    en: "The rate at which two currencies exchange; in this course, the home-currency price of one unit of foreign currency."

real-exchange-rate:
  defined_in: "2.7"
  zh-cn: 实际汇率
  en: real exchange rate
  short:
    zh-cn: "按物价水平调整后的汇率 $\\varepsilon = \\frac{EP^*}{P}$，比较两国产品的相对价格。"
    en: "The exchange rate adjusted for price levels, $\\varepsilon = \\frac{EP^*}{P}$, comparing the relative prices of two countries' goods."

purchasing-power-parity:
  defined_in: "2.7"
  zh-cn: 购买力平价
  en: purchasing power parity
  short:
    zh-cn: "汇率使两国货币的购买力相等；相对形式为 $\\frac{\\Delta E}{E} \\approx \\pi - \\pi^*$。"
    en: "Exchange rates that equalize the purchasing power of two currencies; in relative form, $\\frac{\\Delta E}{E} \\approx \\pi - \\pi^*$."

covered-interest-parity:
  defined_in: "2.7"
  zh-cn: 抛补利率平价
  en: covered interest parity
  short:
    zh-cn: "$\\frac{F}{E} = \\frac{1 + i}{1 + i^*}$：用远期合约对冲后，外国投资的收益等于本国利率。"
    en: "$\\frac{F}{E} = \\frac{1 + i}{1 + i^*}$: after hedging with a forward contract, a foreign investment earns the home interest rate."

uncovered-interest-parity:
  defined_in: "2.7"
  zh-cn: 非抛补利率平价
  en: uncovered interest parity
  short:
    zh-cn: "高利率货币的预期贬值约等于利差；短期中常常不成立。"
    en: "The expected depreciation of a high-rate currency is about the interest differential; it often fails in the short run."

currency-hedging:
  defined_in: "2.7"
  zh-cn: 汇率对冲
  en: currency hedging
  short:
    zh-cn: "用远期合约等工具消除外国投资的汇率风险；成本约为两国利差。"
    en: "Removing the currency risk of a foreign investment with forward contracts or similar tools; it costs about the interest differential."

business-cycle:
  defined_in: "2.8"
  zh-cn: 经济周期
  en: business cycle
  short:
    zh-cn: "产出围绕潜在水平的扩张与收缩，长度不固定。"
    en: "The expansions and contractions of output around its potential, with no fixed length."

recession:
  defined_in: "2.8"
  zh-cn: 衰退
  en: recession
  short:
    zh-cn: "经济活动显著、广泛、持续数月以上的下降；美国由 NBER 认定。"
    en: "A significant, widespread decline in economic activity lasting more than a few months; dated in the US by the NBER."

leading-indicator:
  defined_in: "2.8"
  zh-cn: 领先指标
  en: leading indicator
  short:
    zh-cn: "通常在经济转折之前变化的指标，例如住房许可、失业救济申请和股价。"
    en: "An indicator that usually changes before turning points in the economy, such as housing permits, jobless claims and stock prices."

yield-curve:
  defined_in: "2.8"
  zh-cn: 收益率曲线
  en: yield curve
  short:
    zh-cn: "不同期限国债收益率连成的曲线；长期利率低于短期利率时叫倒挂。"
    en: "The curve of government bond yields across maturities; when long rates are below short rates it is inverted."

stock-bond-correlation:
  defined_in: "2.8"
  zh-cn: 股债相关性
  en: stock-bond correlation
  short:
    zh-cn: "股票收益与债券收益的相关系数；需求冲击为主时为负，通胀冲击为主时为正。"
    en: "The correlation between stock and bond returns; negative when demand shocks dominate, positive when inflation shocks dominate."

financial-intermediary:
  defined_in: "3.1"
  zh-cn: 金融中介
  en: financial intermediary
  short:
    zh-cn: "在储蓄者和借款者之间转移资金的机构，例如银行、保险公司和基金。"
    en: "An institution that channels funds from savers to borrowers, such as a bank, an insurer or a fund."

money-market:
  defined_in: "3.1"
  zh-cn: 货币市场
  en: money market
  short:
    zh-cn: "交易一年以内短期债务工具的市场，例如短期国债、商业票据和回购。"
    en: "The market for short-term debt of up to a year, such as Treasury bills, commercial paper and repos."

capital-market:
  defined_in: "3.1"
  zh-cn: 资本市场
  en: capital market
  short:
    zh-cn: "交易期限超过一年的债务工具和股票的市场。"
    en: "The market for debt with maturities over a year and for stocks."

primary-market:
  defined_in: "3.1"
  zh-cn: 一级市场
  en: primary market
  short:
    zh-cn: "证券第一次发行、资金从投资者流向发行者的市场。"
    en: "The market where securities are first issued and money flows from investors to the issuer."

secondary-market:
  defined_in: "3.1"
  zh-cn: 二级市场
  en: secondary market
  short:
    zh-cn: "投资者之间买卖已发行证券的市场，提供流动性和价格。"
    en: "The market where investors trade securities already issued; it provides liquidity and prices."

market-maker:
  defined_in: "3.1"
  zh-cn: 做市商
  en: market maker
  short:
    zh-cn: "持续报出买价和卖价、随时与投资者交易的机构。"
    en: "A firm that continuously quotes bid and ask prices and stands ready to trade."

bid-ask-spread:
  defined_in: "3.1"
  zh-cn: 买卖价差
  en: bid-ask spread
  short:
    zh-cn: "卖价与买价之差，是立即交易的成本。"
    en: "The ask price minus the bid price; the cost of trading immediately."

short-selling:
  defined_in: "3.1"
  zh-cn: 卖空
  en: short selling
  short:
    zh-cn: "借入股票卖出、以后买回归还；价格下跌时获利，潜在损失无上限。"
    en: "Selling borrowed shares and buying them back later; it gains when the price falls and has unlimited potential loss."

limit-order:
  defined_in: "3.1"
  zh-cn: 限价单
  en: limit order
  short:
    zh-cn: "只在指定价格或更好价格成交的订单；价格有保证，成交没有保证。"
    en: "An order that trades only at a stated price or better; the price is guaranteed, execution is not."

net-present-value:
  defined_in: "3.2"
  zh-cn: 净现值
  en: net present value
  short:
    zh-cn: "项目所有现金流按资本成本折现后的总和；为正则项目增加股东财富。"
    en: "The sum of all of a project's cash flows discounted at the cost of capital; if positive, the project adds to shareholder wealth."

cost-of-capital:
  defined_in: "3.2"
  zh-cn: 资本成本
  en: cost of capital
  short:
    zh-cn: "风险相同的投资的预期收益，是项目折现率所用的机会成本。"
    en: "The expected return on investments of the same risk; the opportunity cost used as a project's discount rate."

internal-rate-of-return:
  defined_in: "3.2"
  zh-cn: 内部收益率
  en: internal rate of return
  short:
    zh-cn: "使项目 NPV 等于零的折现率。"
    en: "The discount rate at which a project's NPV is zero."

payback-period:
  defined_in: "3.2"
  zh-cn: 回收期
  en: payback period
  short:
    zh-cn: "累计现金流收回初始投资所需的时间；忽略时间价值和之后的现金流。"
    en: "The time for cumulative cash flows to recover the initial investment; it ignores time value and later cash flows."

profitability-index:
  defined_in: "3.2"
  zh-cn: 盈利指数
  en: profitability index
  short:
    zh-cn: "NPV 除以初始投资，资本配给时用于排序。"
    en: "NPV divided by the initial investment, used to rank projects under capital rationing."

coupon-rate:
  defined_in: "3.3"
  zh-cn: 票面利率
  en: coupon rate
  short:
    zh-cn: "每年的票息除以面值。"
    en: "The yearly coupon divided by the face value."

yield-to-maturity:
  defined_in: "3.3"
  zh-cn: 到期收益率
  en: yield to maturity
  short:
    zh-cn: "使债券现金流的现值等于市场价格的折现率，即按市场价格买入的内部收益率。"
    en: "The discount rate that makes the present value of a bond's cash flows equal its market price: the IRR of buying at that price."

zero-coupon-bond:
  defined_in: "3.3"
  zh-cn: 零息债
  en: zero-coupon bond
  short:
    zh-cn: "只在到期时支付面值、中间没有票息的债券。"
    en: "A bond that pays only its face value at maturity, with no coupons."

spot-rate:
  defined_in: "3.3"
  zh-cn: 即期利率
  en: spot rate
  short:
    zh-cn: "t 年期零息债的到期收益率；每笔现金流应按它自己期限的即期利率折现。"
    en: "The yield on a t-year zero-coupon bond; each cash flow should be discounted at the spot rate for its own maturity."

forward-rate:
  defined_in: "3.3"
  zh-cn: 远期利率
  en: forward rate
  short:
    zh-cn: "由即期利率隐含、今天可以锁定的未来一段时间的利率：$(1 + s_2)^2 = (1 + s_1)(1 + f_{1,2})$。"
    en: "The rate for a future period implied by spot rates and lockable today: $(1 + s_2)^2 = (1 + s_1)(1 + f_{1,2})$."

macaulay-duration:
  defined_in: "3.4"
  zh-cn: Macaulay 久期
  en: Macaulay duration
  short:
    zh-cn: "以现金流现值为权重的平均回收时间 $D = \\sum_t t\\,w_t$；零息债的久期等于期限。"
    en: "The average time to receive cash, weighted by present value, $D = \\sum_t t\\,w_t$; a zero's duration equals its maturity."

modified-duration:
  defined_in: "3.4"
  zh-cn: 修正久期
  en: modified duration
  short:
    zh-cn: "$D^* = \\frac{D}{1 + y}$；收益率变化 1 个百分点，价格约反向变化 $D^*$ 个百分点。"
    en: "$D^* = \\frac{D}{1 + y}$; a 1-point change in yield moves the price about $D^*$ percent in the opposite direction."

convexity:
  defined_in: "3.4"
  zh-cn: 凸性
  en: convexity
  short:
    zh-cn: "价格–收益率曲线的弯曲程度，用来修正久期估计：$\\frac{\\Delta P}{P} \\approx -D^* \\Delta y + \\frac{1}{2} C (\\Delta y)^2$。"
    en: "The curvature of the price–yield curve, correcting the duration estimate: $\\frac{\\Delta P}{P} \\approx -D^* \\Delta y + \\frac{1}{2} C (\\Delta y)^2$."

immunization:
  defined_in: "3.4"
  zh-cn: 免疫
  en: immunization
  short:
    zh-cn: "使资产与负债的现值和久期相等，让一次利率变化的价格影响和再投资影响相互抵消。"
    en: "Matching the present values and durations of assets and liabilities so that the price and reinvestment effects of a rate change offset."

term-structure:
  defined_in: "3.5"
  zh-cn: 利率期限结构
  en: term structure of interest rates
  short:
    zh-cn: "同一发行人的利率与期限之间的关系，用收益率曲线表示。"
    en: "The relation between interest rates and maturity for one issuer, shown by the yield curve."

expectations-hypothesis:
  defined_in: "3.5"
  zh-cn: 预期假说
  en: expectations hypothesis
  short:
    zh-cn: "长期利率是预期的未来短期利率的几何平均；远期利率等于预期的未来短期利率。"
    en: "Long rates are the geometric average of expected future short rates; forward rates equal expected future short rates."

term-premium:
  defined_in: "3.5"
  zh-cn: 期限溢价
  en: term premium
  short:
    zh-cn: "远期利率（或长期利率）超过预期的未来短期利率的部分，补偿持有长期债券的风险，可正可负。"
    en: "The amount by which forward rates (or long rates) exceed expected future short rates, compensating for the risk of long bonds; it can be positive or negative."

preferred-habitat:
  defined_in: "3.5"
  zh-cn: 优先偏好理论
  en: preferred habitat theory
  short:
    zh-cn: "投资者偏好与自己需要相符的期限，各期限的供求影响期限溢价。"
    en: "Investors prefer maturities that fit their needs, so supply and demand at each maturity affect the term premium."

default-risk:
  defined_in: "3.6"
  zh-cn: 违约风险
  en: default risk
  short:
    zh-cn: "借款人不能按约定支付利息或本金的风险。"
    en: "The risk that a borrower fails to pay interest or principal as promised."

recovery-rate:
  defined_in: "3.6"
  zh-cn: 回收率
  en: recovery rate
  short:
    zh-cn: "违约后债权人最终收回的金额占面值的比例。"
    en: "The share of face value that creditors finally recover after a default."

credit-spread:
  defined_in: "3.6"
  zh-cn: 信用利差
  en: credit spread
  short:
    zh-cn: "有违约风险的债券的收益率超过同期限国债收益率的部分。"
    en: "The amount by which the yield of a bond with default risk exceeds the yield of a Treasury of the same maturity."

credit-rating:
  defined_in: "3.6"
  zh-cn: 信用评级
  en: credit rating
  short:
    zh-cn: "评级机构对发行人或债券违约风险的等级评价；BBB−（Baa3）及以上为投资级。"
    en: "A rating agency's grade of the default risk of an issuer or a bond; BBB− (Baa3) and above is investment grade."

municipal-bond:
  defined_in: "3.6"
  zh-cn: 市政债
  en: municipal bond
  short:
    zh-cn: "美国州和地方政府发行的债券，利息通常免联邦所得税。"
    en: "A bond issued by a US state or local government; its interest is usually exempt from federal income tax."

tax-equivalent-yield:
  defined_in: "3.6"
  zh-cn: 含税等价收益率
  en: tax-equivalent yield
  short:
    zh-cn: "应税债券要达到与免税债券相同的税后收益所需的收益率：免税收益率除以 1 减边际税率。"
    en: "The yield a taxable bond needs to match a tax-exempt bond after tax: the tax-exempt yield divided by one minus the marginal tax rate."

tips:
  defined_in: "3.6"
  zh-cn: 通胀保值国债
  en: TIPS
  short:
    zh-cn: "本金按 CPI 调整的美国国债，收益率是实际收益率。"
    en: "US Treasury securities whose principal is adjusted by the CPI; their yield is a real yield."

breakeven-inflation:
  defined_in: "3.6"
  zh-cn: 盈亏平衡通胀率
  en: breakeven inflation
  short:
    zh-cn: "使名义国债与同期限 TIPS 收益相同的通胀率，约等于两者收益率之差。"
    en: "The inflation rate at which a nominal Treasury and a TIPS of the same maturity give the same return, roughly the difference in their yields."

balance-sheet:
  defined_in: "3.7"
  zh-cn: 资产负债表
  en: balance sheet
  short:
    zh-cn: "某一时点公司的资产、负债和股东权益，资产 = 负债 + 股东权益。"
    en: "A company's assets, liabilities and shareholders' equity at a point in time; assets = liabilities + equity."

income-statement:
  defined_in: "3.7"
  zh-cn: 利润表
  en: income statement
  short:
    zh-cn: "一段时期的收入、费用和净利润。"
    en: "Revenue, expenses and net income over a period."

cash-flow-statement:
  defined_in: "3.7"
  zh-cn: 现金流量表
  en: cash flow statement
  short:
    zh-cn: "一段时期的现金收支，分为经营、投资和筹资活动。"
    en: "Cash received and paid over a period, split into operating, investing and financing activities."

accrual-accounting:
  defined_in: "3.7"
  zh-cn: 权责发生制
  en: accrual accounting
  short:
    zh-cn: "收入在提供商品或服务时确认，费用与相关收入在同一时期确认，而不看现金何时收付。"
    en: "Revenue is recognized when goods or services are delivered and expenses in the period of the related revenue, regardless of when cash moves."

depreciation:
  defined_in: "3.7"
  zh-cn: 折旧
  en: depreciation
  short:
    zh-cn: "把长期资产的成本在使用年限内分摊为各期费用；它不是当期的现金支出。"
    en: "Spreading the cost of a long-lived asset over its useful life as an expense in each period; it is not a cash payment in that period."

working-capital:
  defined_in: "3.7"
  zh-cn: 营运资本
  en: working capital
  short:
    zh-cn: "日常经营占用的资金，主要是应收账款加存货减应付账款。"
    en: "Money tied up in daily operations, mainly receivables plus inventory minus payables."

earnings-quality:
  defined_in: "3.7"
  zh-cn: 盈余质量
  en: earnings quality
  short:
    zh-cn: "报告的利润在多大程度上反映可持续的、能变成现金的经营成果。"
    en: "How far reported earnings reflect lasting results of the business that turn into cash."

return-on-assets:
  defined_in: "3.8"
  zh-cn: 资产收益率
  en: return on assets
  short:
    zh-cn: "利润除以总资产，衡量资产创造利润的能力；ROA。"
    en: "Profit divided by total assets, measuring how much profit the assets earn; ROA."

return-on-equity:
  defined_in: "3.8"
  zh-cn: 净资产收益率
  en: return on equity
  short:
    zh-cn: "净利润除以股东权益，股东投入的账面资本得到的回报；ROE。"
    en: "Net income divided by shareholders' equity, the return on shareholders' book capital; ROE."

dupont-analysis:
  defined_in: "3.8"
  zh-cn: DuPont 分解
  en: DuPont analysis
  short:
    zh-cn: "把 ROE 分解为净利润率 × 资产周转率 × 权益乘数。"
    en: "Splitting ROE into net margin × asset turnover × equity multiplier."

financial-leverage:
  defined_in: "3.8"
  zh-cn: 财务杠杆
  en: financial leverage
  short:
    zh-cn: "用负债为资产融资；资产收益率高于借款利率时提高 ROE，低于时降低 ROE，并使 ROE 波动更大。"
    en: "Financing assets with debt; it raises ROE when the return on assets exceeds the interest rate, lowers it otherwise, and makes ROE more volatile."

return-on-invested-capital:
  defined_in: "3.8"
  zh-cn: 投入资本回报率
  en: return on invested capital
  short:
    zh-cn: "税后营业利润除以投入资本（股东权益加有息负债），与融资方式无关；ROIC。"
    en: "After-tax operating profit divided by invested capital (equity plus interest-bearing debt), independent of financing; ROIC."

interest-coverage:
  defined_in: "3.8"
  zh-cn: 利息保障倍数
  en: interest coverage
  short:
    zh-cn: "营业利润（EBIT）除以利息费用。"
    en: "Operating income (EBIT) divided by interest expense."

current-ratio:
  defined_in: "3.8"
  zh-cn: 流动比率
  en: current ratio
  short:
    zh-cn: "流动资产除以流动负债，衡量短期偿债能力。"
    en: "Current assets divided by current liabilities, a measure of the ability to pay short-term obligations."

dividend-discount-model:
  defined_in: "3.9"
  zh-cn: 股利贴现模型
  en: dividend discount model
  short:
    zh-cn: "股票的内在价值等于预期未来股息按股权成本折现的现值；DDM。"
    en: "A stock's intrinsic value equals the present value of expected future dividends, discounted at the cost of equity; DDM."

cost-of-equity:
  defined_in: "3.9"
  zh-cn: 股权成本
  en: cost of equity
  short:
    zh-cn: "股东根据股票的风险要求的预期收益率，用来折现股东得到的现金流。"
    en: "The expected return shareholders require given the stock's risk, used to discount cash flows to shareholders."

gordon-growth-model:
  defined_in: "3.9"
  zh-cn: Gordon 增长模型
  en: Gordon growth model
  short:
    zh-cn: "股息永远以不变的 g 增长时，股价 P0 = D1 / (r − g)，要求 g < r。"
    en: "If dividends grow forever at a constant g, the price is P0 = D1 / (r − g), which requires g < r."

payout-ratio:
  defined_in: "3.9"
  zh-cn: 派息率
  en: payout ratio
  short:
    zh-cn: "股息占净利润的比例；1 减派息率是留存比率。"
    en: "Dividends as a share of net income; one minus the payout ratio is the retention ratio."

sustainable-growth-rate:
  defined_in: "3.9"
  zh-cn: 可持续增长率
  en: sustainable growth rate
  short:
    zh-cn: "不增加杠杆、不发新股时，靠留存利润能达到的增长率：g = 留存比率 × ROE。"
    en: "The growth rate reachable by retaining profit without more leverage or new shares: g = retention ratio × ROE."

pvgo:
  defined_in: "3.9"
  zh-cn: 增长机会的现值
  en: present value of growth opportunities
  short:
    zh-cn: "股价中超过“不增长时价值” E1 / r 的部分；PVGO。"
    en: "The part of the price above the no-growth value E1 / r; PVGO."

fcff:
  defined_in: "3.10"
  zh-cn: 公司自由现金流
  en: free cash flow to the firm
  short:
    zh-cn: "公司在必要的投资之后，可以分给所有投资者（股东和债权人）的现金：EBIT(1 − t) + 折旧 − 资本支出 − 营运资本的增加；FCFF。"
    en: "Cash available to all investors (shareholders and creditors) after necessary investment: EBIT(1 − t) + depreciation − capital spending − increase in working capital; FCFF."

fcfe:
  defined_in: "3.10"
  zh-cn: 股权自由现金流
  en: free cash flow to equity
  short:
    zh-cn: "支付税后利息并考虑净借款之后，可以分给股东的现金；FCFE。"
    en: "Cash available to shareholders after after-tax interest and net borrowing; FCFE."

wacc:
  defined_in: "3.10"
  zh-cn: 加权平均资本成本
  en: weighted average cost of capital
  short:
    zh-cn: "按市场价值加权的股权成本和税后债务成本，用来折现 FCFF；WACC。"
    en: "The cost of equity and the after-tax cost of debt weighted by market values, used to discount FCFF; WACC."

interest-tax-shield:
  defined_in: "3.10"
  zh-cn: 利息税盾
  en: interest tax shield
  short:
    zh-cn: "利息可以在税前扣除，使公司少交的税；每年约为利息乘以税率。"
    en: "The tax saved because interest is deductible; roughly interest times the tax rate each year."

terminal-value:
  defined_in: "3.10"
  zh-cn: 终值
  en: terminal value
  short:
    zh-cn: "预测期末以后全部现金流在预测期末的价值，常用增长永续年金计算。"
    en: "The value at the end of the forecast period of all later cash flows, often computed as a growing perpetuity."

enterprise-value:
  defined_in: "3.10"
  zh-cn: 企业价值
  en: enterprise value
  short:
    zh-cn: "公司经营业务对所有投资者的价值；股权价值 = 企业价值 − 净债务。"
    en: "The value of the operating business to all investors; equity value = enterprise value − net debt."

price-earnings-ratio:
  defined_in: "3.11"
  zh-cn: 市盈率
  en: price-earnings ratio
  short:
    zh-cn: "股价除以每股利润（P/E）；按过去 12 个月的利润计算叫静态，按预测利润计算叫动态。"
    en: "Price divided by earnings per share (P/E); trailing if based on the last 12 months of earnings, forward if based on forecast earnings."

ev-ebitda:
  defined_in: "3.11"
  zh-cn: EV/EBITDA
  en: EV/EBITDA
  short:
    zh-cn: "企业价值除以 EBITDA，不受资本结构和折旧政策的影响。"
    en: "Enterprise value divided by EBITDA, unaffected by capital structure and depreciation policy."

price-to-book:
  defined_in: "3.11"
  zh-cn: 市净率
  en: price-to-book ratio
  short:
    zh-cn: "股价除以每股账面股东权益（P/B）。"
    en: "Price divided by book equity per share (P/B)."

price-to-sales:
  defined_in: "3.11"
  zh-cn: 市销率
  en: price-to-sales ratio
  short:
    zh-cn: "股权市值除以收入（P/S），适用于利润为负或不稳定的公司，但要结合利润率。"
    en: "Market value of equity divided by revenue (P/S), usable for companies with negative or unstable profit, but only together with margins."

cape:
  defined_in: "3.11"
  zh-cn: 周期调整市盈率
  en: cyclically adjusted P/E
  short:
    zh-cn: "价格除以过去 10 年经通胀调整的平均利润；CAPE，又称 Shiller 市盈率。"
    en: "Price divided by average inflation-adjusted earnings of the past 10 years; CAPE, also called the Shiller P/E."

arithmetic-mean-return:
  defined_in: "4.1"
  zh-cn: 算术平均收益
  en: arithmetic mean return
  short:
    zh-cn: "各期收益的简单平均，是下一期收益的期望的估计。"
    en: "The simple average of period returns, an estimate of the expected return for the next period."

geometric-mean-return:
  defined_in: "4.1"
  zh-cn: 几何平均收益
  en: geometric mean return
  short:
    zh-cn: "使财富以同样速度复利增长、得到同样终值的每期收益率，即复合年增长率。"
    en: "The per-period rate that, compounded, gives the same final wealth: the compound annual growth rate."

volatility-drag:
  defined_in: "4.1"
  zh-cn: 波动拖累
  en: volatility drag
  short:
    zh-cn: "波动使几何平均收益低于算术平均收益，差额约为方差的一半：G ≈ μ − σ²/2。"
    en: "Volatility makes the geometric mean return lower than the arithmetic mean, by about half the variance: G ≈ μ − σ²/2."

annualized-volatility:
  defined_in: "4.1"
  zh-cn: 年化波动率
  en: annualized volatility
  short:
    zh-cn: "换算成一年的收益标准差；各期收益独立时，等于每期标准差乘以每年期数的平方根。"
    en: "The standard deviation of returns scaled to one year; with independent periods, the per-period standard deviation times the square root of periods per year."

maximum-drawdown:
  defined_in: "4.1"
  zh-cn: 最大回撤
  en: maximum drawdown
  short:
    zh-cn: "一段时期内，财富从前期最高点到随后最低点的最大跌幅。"
    en: "The largest fall in wealth from a previous peak to a later trough over a period."

sharpe-ratio:
  defined_in: "4.1"
  zh-cn: 夏普比率
  en: Sharpe ratio
  short:
    zh-cn: "超额收益（收益减无风险利率）除以收益的标准差，每承担一单位波动得到的超额收益。"
    en: "Excess return (return minus the risk-free rate) divided by the standard deviation of returns: excess return per unit of volatility."

equity-premium:
  defined_in: "4.1"
  zh-cn: 股权溢价
  en: equity premium
  short:
    zh-cn: "股票的预期收益超过无风险资产收益的部分。"
    en: "The amount by which the expected return on stocks exceeds the return on a riskless asset."

minimum-variance-portfolio:
  defined_in: "4.2"
  zh-cn: 最小方差组合
  en: minimum-variance portfolio
  short:
    zh-cn: "在所有可能的组合中方差最小的那一个。"
    en: "The portfolio with the lowest variance among all possible portfolios."

minimum-variance-frontier:
  defined_in: "4.2"
  zh-cn: 最小方差前沿
  en: minimum-variance frontier
  short:
    zh-cn: "对每一个目标预期收益，方差最小的组合连成的曲线。"
    en: "The curve of portfolios with the lowest variance for each target expected return."

efficient-frontier:
  defined_in: "4.2"
  zh-cn: 有效前沿
  en: efficient frontier
  short:
    zh-cn: "最小方差前沿在最小方差组合以上的部分：同样风险下预期收益最高的组合。"
    en: "The part of the minimum-variance frontier above the minimum-variance portfolio: the portfolios with the highest expected return for their risk."

mean-variance-optimization:
  defined_in: "4.2"
  zh-cn: 均值–方差优化
  en: mean–variance optimization
  short:
    zh-cn: "在给定预期收益下使组合方差最小（或在给定方差下使预期收益最大）的权重选择方法，由 Markowitz 提出。"
    en: "Choosing weights to minimize portfolio variance for a given expected return (or maximize expected return for a given variance), proposed by Markowitz."

short-sale-constraint:
  defined_in: "4.2"
  zh-cn: 卖空限制
  en: short-sale constraint
  short:
    zh-cn: "要求每项资产的权重不小于 0 的约束；它可能使最优解落在边界上。"
    en: "The constraint that every weight be at least 0; it can put the optimum on the boundary."

capital-allocation-line:
  defined_in: "4.3"
  zh-cn: 资本配置线
  en: capital allocation line
  short:
    zh-cn: "一个风险组合与无风险资产按不同比例组合得到的直线，斜率是这个风险组合的夏普比率；CAL。"
    en: "The straight line of combinations of a risky portfolio with the risk-free asset; its slope is the risky portfolio's Sharpe ratio; CAL."

tangency-portfolio:
  defined_in: "4.3"
  zh-cn: 切点组合
  en: tangency portfolio
  short:
    zh-cn: "资本配置线与有效前沿相切处的风险组合，夏普比率最高的风险组合，也叫最优风险组合。"
    en: "The risky portfolio where the capital allocation line touches the efficient frontier: the risky portfolio with the highest Sharpe ratio, also called the optimal risky portfolio."

separation-theorem:
  defined_in: "4.3"
  zh-cn: 分离定理
  en: separation theorem
  short:
    zh-cn: "选择风险组合与决定风险资产比例可以分开：所有投资者持有同一个切点组合，只按风险厌恶决定投入多少。"
    en: "Choosing the risky portfolio and deciding how much to put in it are separate: every investor holds the same tangency portfolio and uses risk aversion only to decide how much."

mean-variance-utility:
  defined_in: "4.3"
  zh-cn: 均值–方差效用
  en: mean–variance utility
  short:
    zh-cn: "U = E[r] − ½γσ²，用预期收益减去风险的代价来评价组合，γ 是风险厌恶系数。"
    en: "U = E[r] − ½γσ², valuing a portfolio by its expected return minus a cost for risk; γ is the risk-aversion coefficient."

market-portfolio:
  defined_in: "4.3"
  zh-cn: 市场组合
  en: market portfolio
  short:
    zh-cn: "所有风险资产按市值加权的组合。"
    en: "The portfolio of all risky assets weighted by market value."

capital-market-line:
  defined_in: "4.3"
  zh-cn: 资本市场线
  en: capital market line
  short:
    zh-cn: "以市场组合为风险组合的资本配置线；CML。"
    en: "The capital allocation line whose risky portfolio is the market portfolio; CML."

capm:
  defined_in: "4.4"
  zh-cn: 资本资产定价模型
  en: capital asset pricing model
  short:
    zh-cn: "均衡中资产的预期超额收益与它的 beta 成正比：E[R_i] − r_f = β_i(E[R_M] − r_f)；CAPM。"
    en: "In equilibrium, an asset's expected excess return is proportional to its beta: E[R_i] − r_f = β_i(E[R_M] − r_f); CAPM."

beta:
  defined_in: "4.4"
  zh-cn: beta 系数
  en: beta
  short:
    zh-cn: "资产收益与市场收益的协方差除以市场收益的方差，衡量资产对市场波动的敏感度。"
    en: "The covariance of an asset's return with the market return divided by the market return's variance: how sensitive the asset is to market moves."

security-market-line:
  defined_in: "4.4"
  zh-cn: 证券市场线
  en: security market line
  short:
    zh-cn: "以 beta 为横轴、预期收益为纵轴，CAPM 给出的直线；SML。"
    en: "The straight line the CAPM gives with beta on the horizontal axis and expected return on the vertical axis; SML."

alpha:
  defined_in: "4.4"
  zh-cn: alpha
  en: alpha
  short:
    zh-cn: "资产的预期（或实际）收益超过证券市场线所要求的收益的部分。"
    en: "The amount by which an asset's expected (or realized) return exceeds the return the security market line requires."

single-index-model:
  defined_in: "4.5"
  zh-cn: 单指数模型
  en: single-index model
  short:
    zh-cn: "假设股票收益之间唯一的联系是共同的市场指数：R_i − r_f = α_i + β_i(R_M − r_f) + e_i，各公司的残差两两不相关。"
    en: "Assumes that the only link between stock returns is a common market index: R_i − r_f = α_i + β_i(R_M − r_f) + e_i, with residuals uncorrelated across companies."

systematic-risk:
  defined_in: "4.5"
  zh-cn: 系统性风险
  en: systematic risk
  short:
    zh-cn: "随市场一起波动、无法通过分散化消除的风险；在单指数模型中为 β_i²σ_M²。"
    en: "Risk that moves with the market and cannot be removed by diversification; β_i²σ_M² in the single-index model."

firm-specific-risk:
  defined_in: "4.5"
  zh-cn: 特质风险
  en: firm-specific risk
  short:
    zh-cn: "只与公司自身有关、与市场无关的风险，可以通过分散化消除；在单指数模型中为 σ²(e_i)。"
    en: "Risk that concerns only the company itself and is unrelated to the market; it can be diversified away; σ²(e_i) in the single-index model."

adjusted-beta:
  defined_in: "4.5"
  zh-cn: 调整 beta
  en: adjusted beta
  short:
    zh-cn: "把回归估计的 beta 向 1（或其他参照值）收缩后的值，常用 (2/3)β̂ + 1/3，用来减少估计误差。"
    en: "A regression beta shrunk toward 1 (or another reference value), commonly (2/3)β̂ + 1/3, to reduce estimation error."

multifactor-model:
  defined_in: "4.6"
  zh-cn: 多因子模型
  en: multifactor model
  short:
    zh-cn: "用几个共同因子描述资产收益的模型：R_i − r_f = α_i + Σ β_ik F_k + e_i。"
    en: "A model that describes asset returns with several common factors: R_i − r_f = α_i + Σ β_ik F_k + e_i."

factor-loading:
  defined_in: "4.6"
  zh-cn: 因子暴露
  en: factor loading
  short:
    zh-cn: "资产收益对某个因子的敏感度，即多因子模型中该因子的系数；也叫因子 beta。"
    en: "How sensitive an asset's return is to a factor: the factor's coefficient in a multifactor model; also called a factor beta."

arbitrage:
  defined_in: "4.6"
  zh-cn: 套利
  en: arbitrage
  short:
    zh-cn: "不花钱、没有风险却有正收益的交易。"
    en: "A trade that costs nothing, has no risk and has a positive return."

arbitrage-pricing-theory:
  defined_in: "4.6"
  zh-cn: 套利定价理论
  en: arbitrage pricing theory
  short:
    zh-cn: "在多因子模型和无套利的假设下，预期超额收益等于各因子暴露乘以因子风险溢价之和；APT。"
    en: "Under a multifactor model and no arbitrage, the expected excess return equals the sum of the factor loadings times the factor risk premia; APT."

factor-risk-premium:
  defined_in: "4.6"
  zh-cn: 因子风险溢价
  en: factor risk premium
  short:
    zh-cn: "对某个因子暴露为 1、对其他因子暴露为 0 的组合的预期超额收益。"
    en: "The expected excess return of a portfolio with a loading of 1 on one factor and 0 on the others."

fama-french-model:
  defined_in: "4.6"
  zh-cn: Fama–French 三因子模型
  en: Fama–French three-factor model
  short:
    zh-cn: "用市场、规模（SMB）和价值（HML）三个因子描述股票收益的模型；五因子模型再加盈利能力和投资因子。"
    en: "A model that describes stock returns with three factors: the market, size (SMB) and value (HML); the five-factor model adds profitability and investment factors."

momentum:
  defined_in: "4.6"
  zh-cn: 动量
  en: momentum
  short:
    zh-cn: "过去 3 到 12 个月涨得多的股票接下来几个月平均继续跑赢跌得多的股票的现象。"
    en: "The tendency of stocks that rose most over the past 3 to 12 months to keep beating those that fell most over the next few months."

smart-beta:
  defined_in: "4.6"
  zh-cn: smart beta
  en: smart beta
  short:
    zh-cn: "按规则构建、偏向某些因子（价值、小盘、动量等）的指数基金；也叫因子投资。"
    en: "Rule-based index funds tilted toward some factors (value, small size, momentum and so on); also called factor investing."

efficient-market-hypothesis:
  defined_in: "4.7"
  zh-cn: 有效市场假说
  en: efficient market hypothesis
  short:
    zh-cn: "价格充分反映了可以得到的信息，因此除了风险要求的平均收益之外，价格变化无法预测；EMH。"
    en: "Prices fully reflect available information, so apart from the average return risk requires, price changes cannot be predicted; EMH."

random-walk:
  defined_in: "4.7"
  zh-cn: 随机游走
  en: random walk
  short:
    zh-cn: "价格的变化不可预测，过去的变化不能预测未来的变化。"
    en: "Price changes are unpredictable; past changes do not predict future ones."

weak-form-efficiency:
  defined_in: "4.7"
  zh-cn: 弱式有效
  en: weak-form efficiency
  short:
    zh-cn: "价格反映了过去的价格和成交量，技术分析不能获得超额收益。"
    en: "Prices reflect past prices and trading volume, so technical analysis cannot earn excess returns."

semi-strong-form-efficiency:
  defined_in: "4.7"
  zh-cn: 半强式有效
  en: semi-strong-form efficiency
  short:
    zh-cn: "价格反映了所有公开信息，分析公开信息不能获得超额收益。"
    en: "Prices reflect all public information, so analyzing public information cannot earn excess returns."

strong-form-efficiency:
  defined_in: "4.7"
  zh-cn: 强式有效
  en: strong-form efficiency
  short:
    zh-cn: "价格反映了所有信息，包括未公开的内部信息。"
    en: "Prices reflect all information, including nonpublic inside information."

joint-hypothesis-problem:
  defined_in: "4.7"
  zh-cn: 联合假设问题
  en: joint hypothesis problem
  short:
    zh-cn: "检验市场有效性必须同时假设一个预期收益模型，所以跑赢模型可能是市场无效，也可能是模型错了。"
    en: "Testing market efficiency requires assuming a model of expected returns as well, so beating the model may mean either inefficiency or a wrong model."

event-study:
  defined_in: "4.7"
  zh-cn: 事件研究
  en: event study
  short:
    zh-cn: "用事件前后的超常收益和累计超常收益，检验价格对某类消息的反应的方法。"
    en: "A method that uses abnormal and cumulative abnormal returns around events to test how prices react to a kind of news."

abnormal-return:
  defined_in: "4.7"
  zh-cn: 超常收益
  en: abnormal return
  short:
    zh-cn: "实际收益减去按模型（如单指数模型）计算的正常收益。"
    en: "The actual return minus the normal return given by a model such as the single-index model."

market-anomaly:
  defined_in: "4.7"
  zh-cn: 市场异象
  en: market anomaly
  short:
    zh-cn: "可以用公开信息预测、与资产定价模型不符的收益规律。"
    en: "A pattern in returns that can be predicted from public information and does not fit the asset pricing model."

prospect-theory:
  defined_in: "4.8"
  zh-cn: 前景理论
  en: prospect theory
  short:
    zh-cn: "描述人们实际怎样在风险中选择的理论：相对参照点评价得失、损失厌恶、敏感度递减、高估小概率。"
    en: "A theory of how people actually choose under risk: gains and losses judged relative to a reference point, loss aversion, diminishing sensitivity and overweighting of small probabilities."

loss-aversion:
  defined_in: "4.8"
  zh-cn: 损失厌恶
  en: loss aversion
  short:
    zh-cn: "同样大小的损失带来的痛苦大于收益带来的快乐，约为两倍多。"
    en: "A loss hurts more than a gain of the same size pleases, by a factor of a little more than two."

overconfidence:
  defined_in: "4.8"
  zh-cn: 过度自信
  en: overconfidence
  short:
    zh-cn: "高估自己的知识和判断的准确性，常导致交易过多。"
    en: "Overrating the accuracy of one's own knowledge and judgment, which often leads to trading too much."

disposition-effect:
  defined_in: "4.8"
  zh-cn: 处置效应
  en: disposition effect
  short:
    zh-cn: "倾向于过早卖出盈利的股票、长期持有亏损的股票。"
    en: "A tendency to sell winning stocks too early and hold losing stocks too long."

mental-accounting:
  defined_in: "4.8"
  zh-cn: 心理账户
  en: mental accounting
  short:
    zh-cn: "把钱分到不同的“账户”中分别看待，忽略钱可以互换。"
    en: "Putting money into separate \"accounts\" and treating each on its own, ignoring that money is interchangeable."

herding:
  defined_in: "4.8"
  zh-cn: 羊群效应
  en: herding
  short:
    zh-cn: "跟随别人的行为，而不是根据自己的信息判断。"
    en: "Following what others do instead of judging from one's own information."

limits-to-arbitrage:
  defined_in: "4.8"
  zh-cn: 套利的限制
  en: limits to arbitrage
  short:
    zh-cn: "基本面风险、噪声交易者风险、实施成本和资金来源使套利有风险和成本，错误定价可以长期存在。"
    en: "Fundamental risk, noise trader risk, implementation costs and funding make arbitrage risky and costly, so mispricing can persist."

noise-trader-risk:
  defined_in: "4.8"
  zh-cn: 噪声交易者风险
  en: noise trader risk
  short:
    zh-cn: "使价格偏离的投资者短期内可能更加偏执，偏差先扩大再缩小的风险。"
    en: "The risk that the investors pushing prices away from value become more extreme in the short run, so the gap widens before it narrows."

treynor-ratio:
  defined_in: "4.9"
  zh-cn: Treynor 比率
  en: Treynor ratio
  short:
    zh-cn: "超额收益除以 beta，每单位系统性风险的超额收益。"
    en: "Excess return divided by beta: the excess return per unit of systematic risk."

jensens-alpha:
  defined_in: "4.9"
  zh-cn: Jensen alpha
  en: Jensen's alpha
  short:
    zh-cn: "实际平均收益超出证券市场线所要求的收益的部分，通常用回归截距估计。"
    en: "The amount by which the actual average return exceeds the return the security market line requires, usually estimated by a regression intercept."

information-ratio:
  defined_in: "4.9"
  zh-cn: 信息比率
  en: information ratio
  short:
    zh-cn: "alpha 除以残差的标准差（或相对基准的平均超额收益除以跟踪误差）。"
    en: "Alpha divided by the residual standard deviation (or the average return over a benchmark divided by the tracking error)."

tracking-error:
  defined_in: "4.9"
  zh-cn: 跟踪误差
  en: tracking error
  short:
    zh-cn: "组合收益与基准收益之差的标准差。"
    en: "The standard deviation of the difference between a portfolio's return and its benchmark's."

survivorship-bias:
  defined_in: "4.9"
  zh-cn: 幸存者偏差
  en: survivorship bias
  short:
    zh-cn: "只用存续下来的基金（或公司）计算历史业绩，忽略被清盘或合并的，从而高估业绩。"
    en: "Overstating performance by computing it only from funds (or companies) that survived, ignoring those that were closed or merged."

error-maximization:
  defined_in: "4.10"
  zh-cn: 误差最大化
  en: error maximization
  short:
    zh-cn: "均值–方差优化器偏向估计误差有利的资产，从而放大估计误差的现象。"
    en: "The tendency of a mean–variance optimizer to favor assets with favorable estimation errors, magnifying those errors."

out-of-sample:
  defined_in: "4.10"
  zh-cn: 样本外
  en: out of sample
  short:
    zh-cn: "用估计或选择模型时没有用过的数据检验结果。"
    en: "Testing results on data that were not used to estimate or choose the model."

shrinkage-estimator:
  defined_in: "4.10"
  zh-cn: 收缩估计
  en: shrinkage estimator
  short:
    zh-cn: "把各项估计值向一个共同的参照值拉近，用一部分偏差换取更小的误差波动。"
    en: "An estimator that pulls individual estimates toward a common reference value, accepting some bias for less variable errors."

resampling:
  defined_in: "4.10"
  zh-cn: 重抽样
  en: resampling
  short:
    zh-cn: "按估计误差随机生成很多组输入，分别优化后取平均权重的方法。"
    en: "A method that generates many sets of inputs according to the estimation errors, optimizes each and averages the weights."

capital-market-assumptions:
  defined_in: "4.11"
  zh-cn: 资本市场假设
  en: capital market assumptions
  short:
    zh-cn: "对各类资产未来预期收益、波动率和相关性的一组假设，用于资产配置和规划。"
    en: "A set of assumptions about asset classes' future expected returns, volatilities and correlations, used for asset allocation and planning."

building-block-approach:
  defined_in: "4.11"
  zh-cn: 积木法
  en: building-block approach
  short:
    zh-cn: "把股票预期收益拆成股东收益率、实际盈利增长、通胀和估值变化来估计；债券用起始收益率。"
    en: "Estimating expected stock returns as shareholder yield plus real earnings growth plus inflation plus valuation change; bonds by their starting yield."

reverse-optimization:
  defined_in: "4.11"
  zh-cn: 反向优化
  en: reverse optimization
  short:
    zh-cn: "假设市场组合最优，从市值权重和协方差反推隐含预期收益：Π = δΣw。"
    en: "Assuming the market portfolio is optimal, working back from market weights and covariances to implied expected returns: Π = δΣw."

black-litterman:
  defined_in: "4.11"
  zh-cn: Black–Litterman 模型
  en: Black–Litterman model
  short:
    zh-cn: "以反向优化的均衡收益为起点，按信心加入投资者观点，得到加权平均的预期收益。"
    en: "A model that starts from equilibrium returns from reverse optimization and adds investor views according to confidence, giving weighted-average expected returns."

merton-share:
  defined_in: "4.12"
  zh-cn: Merton 比例
  en: Merton share
  short:
    zh-cn: "CRRA 投资者在投资机会不变时的最优风险资产比例 (μ − r_f)/(γσ²)，不随财富和期限变化。"
    en: "The optimal risky share of a CRRA investor with constant investment opportunities, (μ − r_f)/(γσ²), independent of wealth and horizon."

human-capital:
  defined_in: "4.12"
  zh-cn: 人力资本
  en: human capital
  short:
    zh-cn: "未来劳动收入的现值；稳定的收入像债券，与股市相关的收入像股票。"
    en: "The present value of future labor income; stable income is bond-like, income tied to the stock market is stock-like."

target-date-fund:
  defined_in: "4.12"
  zh-cn: 目标日期基金
  en: target-date fund
  short:
    zh-cn: "按预定退休年份自动降低股票比例的基金。"
    en: "A fund that lowers its stock share automatically toward a planned retirement year."

glide-path:
  defined_in: "4.12"
  zh-cn: 下滑路径
  en: glide path
  short:
    zh-cn: "股票比例随年龄（或离退休的年数）变化的曲线。"
    en: "The curve of the stock share against age (or years to retirement)."

monte-carlo-simulation:
  defined_in: "4.13"
  zh-cn: 蒙特卡洛模拟
  en: Monte Carlo simulation
  short:
    zh-cn: "按假设的分布随机生成很多条路径，统计结果的分布的方法。"
    en: "A method that generates many random paths from an assumed distribution and tallies the distribution of outcomes."

bootstrap:
  defined_in: "4.13"
  zh-cn: 自助法
  en: bootstrap
  short:
    zh-cn: "从历史数据中有放回地随机抽样来模拟，保留历史分布的形状（如肥尾）。"
    en: "Simulating by drawing at random with replacement from historical data, keeping the shape of the historical distribution (such as fat tails)."

backtest:
  defined_in: "4.13"
  zh-cn: 回测
  en: backtest
  short:
    zh-cn: "假设过去按某个策略的规则交易，用历史数据计算它的结果。"
    en: "Computing, on historical data, what a strategy's rules would have produced if followed in the past."

look-ahead-bias:
  defined_in: "4.13"
  zh-cn: 前视偏差
  en: look-ahead bias
  short:
    zh-cn: "回测中使用了当时还无法得到的信息而产生的偏差。"
    en: "Bias from using, in a backtest, information that was not available at the time."

overfitting:
  defined_in: "4.13"
  zh-cn: 过度拟合
  en: overfitting
  short:
    zh-cn: "在同一段数据上尝试很多规则或参数并挑出最好的，使结果适应了数据中的噪声。"
    en: "Trying many rules or parameters on the same data and picking the best, so the result fits the noise in the data."

forward-contract:
  defined_in: "5.1"
  zh-cn: 远期合约
  en: forward contract
  short:
    zh-cn: "双方今天约定在未来某个日期按今天确定的价格买卖某项资产的合约。"
    en: "A contract in which two parties agree today to trade an asset at a future date at a price fixed today."

derivative-security:
  defined_in: "5.1"
  zh-cn: 衍生品
  en: derivative
  short:
    zh-cn: "价值取决于另一项资产（标的资产）价格的金融合约，例如远期、期货、期权和互换。"
    en: "A financial contract whose value depends on the price of another asset (the underlying), such as forwards, futures, options and swaps."

cost-of-carry:
  defined_in: "5.1"
  zh-cn: 持有成本模型
  en: cost-of-carry model
  short:
    zh-cn: "无套利时远期价格等于现货价格加上持有到期的净成本：F = S₀e^{(r − q)T}。"
    en: "Without arbitrage, the forward price equals the spot price plus the net cost of holding the asset to maturity: F = S₀e^{(r − q)T}."

contango:
  defined_in: "5.1"
  zh-cn: 正向市场
  en: contango
  short:
    zh-cn: "远期或期货价格高于现货价格的市场；低于现货价格时叫反向市场（backwardation）。"
    en: "A market in which forward or futures prices are above the spot price; below the spot price is called backwardation."

futures-contract:
  defined_in: "5.1"
  zh-cn: 期货
  en: futures contract
  short:
    zh-cn: "在交易所交易、由清算所担保、每天按市价结算的标准化远期合约。"
    en: "A standardized forward contract traded on an exchange, guaranteed by a clearinghouse and settled daily at market prices."

margin:
  defined_in: "5.1"
  zh-cn: 保证金
  en: margin
  short:
    zh-cn: "交易期货（或借钱买证券）时存入的担保资金；低于维持保证金时必须补足。"
    en: "Collateral deposited to trade futures (or to buy securities on credit); it must be topped up when it falls below the maintenance level."

mark-to-market:
  defined_in: "5.1"
  zh-cn: 逐日盯市
  en: mark-to-market
  short:
    zh-cn: "每天按市价结算盈亏，盈亏立即计入保证金账户。"
    en: "Settling gains and losses at market prices every day, crediting them to the margin account at once."

hedging:
  defined_in: "5.1"
  zh-cn: 套期保值
  en: hedging
  short:
    zh-cn: "用衍生品等抵消已有的风险，以降低结果的不确定性。"
    en: "Using derivatives or other positions to offset an existing risk, reducing the uncertainty of outcomes."

basis:
  defined_in: "5.1"
  zh-cn: 基差
  en: basis
  short:
    zh-cn: "现货价格与期货价格之差；基差的变化使套期保值不完美（基差风险）。"
    en: "The spot price minus the futures price; changes in the basis make hedges imperfect (basis risk)."

call-option:
  defined_in: "5.2"
  zh-cn: 看涨期权
  en: call option
  short:
    zh-cn: "在到期日（或之前）按执行价买入标的资产的权利；到期收益 max(S_T − K, 0)。"
    en: "The right to buy the underlying at the strike price on (or before) expiry; payoff max(S_T − K, 0)."

put-option:
  defined_in: "5.2"
  zh-cn: 看跌期权
  en: put option
  short:
    zh-cn: "在到期日（或之前）按执行价卖出标的资产的权利；到期收益 max(K − S_T, 0)。"
    en: "The right to sell the underlying at the strike price on (or before) expiry; payoff max(K − S_T, 0)."

strike-price:
  defined_in: "5.2"
  zh-cn: 执行价
  en: strike price
  short:
    zh-cn: "期权约定的买入或卖出标的资产的价格。"
    en: "The price at which an option lets its holder buy or sell the underlying."

option-premium:
  defined_in: "5.2"
  zh-cn: 期权费
  en: option premium
  short:
    zh-cn: "期权买方为获得期权付给卖方的价格。"
    en: "The price the option buyer pays the writer for the option."

intrinsic-value:
  defined_in: "5.2"
  zh-cn: 内在价值
  en: intrinsic value
  short:
    zh-cn: "期权立即行权能得到的价值，看涨期权为 max(S − K, 0)。"
    en: "What an option would bring if exercised immediately; max(S − K, 0) for a call."

time-value:
  defined_in: "5.2"
  zh-cn: 时间价值
  en: time value
  short:
    zh-cn: "期权价格超出内在价值的部分，来自到期前收益的不对称。"
    en: "The part of an option's price above its intrinsic value, coming from the asymmetry of payoffs before expiry."

protective-put:
  defined_in: "5.2"
  zh-cn: 保护性看跌
  en: protective put
  short:
    zh-cn: "持有股票并买入看跌期权，限定最坏的结果。"
    en: "Holding a stock and buying a put on it, capping the worst outcome."

covered-call:
  defined_in: "5.2"
  zh-cn: 备兑看涨
  en: covered call
  short:
    zh-cn: "持有股票并卖出看涨期权，收取期权费、放弃执行价以上的上涨。"
    en: "Holding a stock and selling a call on it, collecting the premium and giving up gains above the strike."

employee-stock-option:
  defined_in: "5.2"
  zh-cn: 员工股票期权
  en: employee stock option
  short:
    zh-cn: "公司授予员工的长期看涨期权，需要归属，不能出售或对冲。"
    en: "A long-dated call granted by a company to an employee; it must vest and cannot be sold or hedged."

put-call-parity:
  defined_in: "5.3"
  zh-cn: 看涨–看跌平价
  en: put–call parity
  short:
    zh-cn: "欧式看涨与看跌期权价格之间的无套利关系 C − P = S − Ke^{−rT}。"
    en: "The no-arbitrage relation between European call and put prices, C − P = S − Ke^{−rT}."

replicating-portfolio:
  defined_in: "5.3"
  zh-cn: 复制组合
  en: replicating portfolio
  short:
    zh-cn: "由标的资产和借贷构成、收益与某项衍生品完全相同的组合。"
    en: "A portfolio of the underlying and borrowing whose payoff equals a derivative's in every state."

binomial-model:
  defined_in: "5.3"
  zh-cn: 二叉树模型
  en: binomial model
  short:
    zh-cn: "假设每期股价只能上涨或下跌两种结果，逐期复制期权来定价的模型。"
    en: "A model that lets the price move only up or down each period and prices an option by replicating it step by step."

risk-neutral-pricing:
  defined_in: "5.3"
  zh-cn: 风险中性定价
  en: risk-neutral pricing
  short:
    zh-cn: "用使标的资产预期收益率等于无风险利率的概率求期望，再按无风险利率折现的定价方法。"
    en: "Pricing by taking expectations with the probabilities that make the underlying earn the risk-free rate, then discounting at that rate."

black-scholes-model:
  defined_in: "5.3"
  zh-cn: Black–Scholes 模型
  en: Black–Scholes model
  short:
    zh-cn: "假设股价服从对数正态分布、波动率不变时欧式期权的定价公式。"
    en: "The pricing formula for European options when the stock price is lognormal with constant volatility."

option-delta:
  defined_in: "5.3"
  zh-cn: delta
  en: delta
  short:
    zh-cn: "期权价格对标的价格的敏感度，也是复制或对冲所需的标的数量。"
    en: "The sensitivity of an option's price to the underlying price; also the amount of the underlying needed to replicate or hedge it."

vega:
  defined_in: "5.3"
  zh-cn: vega
  en: vega
  short:
    zh-cn: "期权价格对波动率的敏感度。"
    en: "The sensitivity of an option's price to volatility."

implied-volatility:
  defined_in: "5.3"
  zh-cn: 隐含波动率
  en: implied volatility
  short:
    zh-cn: "使期权定价模型的结果等于市场价格的波动率。"
    en: "The volatility that makes an option pricing model match the market price."

volatility-skew:
  defined_in: "5.3"
  zh-cn: 波动率偏斜
  en: volatility skew
  short:
    zh-cn: "同一到期日的期权隐含波动率随执行价变化的形态；股指期权执行价越低隐含波动率越高。"
    en: "The pattern of implied volatility across strikes for one expiry; for index options it rises as the strike falls."

interest-rate-swap:
  defined_in: "5.4"
  zh-cn: 利率互换
  en: interest rate swap
  short:
    zh-cn: "双方按名义本金交换固定利息与浮动利息的合约，只交换差额。"
    en: "A contract in which two parties exchange fixed and floating interest on a notional principal, paying only the difference."

notional-principal:
  defined_in: "5.4"
  zh-cn: 名义本金
  en: notional principal
  short:
    zh-cn: "计算互换利息所依据的金额，在利率互换中不交换。"
    en: "The amount on which swap interest is computed; not exchanged in an interest rate swap."

swap-rate:
  defined_in: "5.4"
  zh-cn: 互换利率
  en: swap rate
  short:
    zh-cn: "使互换在签约时价值为 0 的固定利率，等于按面值发行的债券的票面利率。"
    en: "The fixed rate that makes a swap worth 0 at the start; equal to the coupon rate of a par bond."

counterparty-risk:
  defined_in: "5.4"
  zh-cn: 交易对手风险
  en: counterparty risk
  short:
    zh-cn: "合约的另一方违约、无法履行支付义务的风险。"
    en: "The risk that the other party to a contract defaults and cannot make its payments."

currency-swap:
  defined_in: "5.4"
  zh-cn: 货币互换
  en: currency swap
  short:
    zh-cn: "交换两种货币的本金和利息的合约，开始和到期时交换本金。"
    en: "A contract exchanging principal and interest in two currencies, with principal exchanged at the start and at maturity."

credit-default-swap:
  defined_in: "5.4"
  zh-cn: 信用违约互换
  en: credit default swap
  short:
    zh-cn: "保护买方每年付利差，参考实体违约时卖方赔付损失的合约。"
    en: "A contract in which the protection buyer pays a yearly spread and the seller pays the loss if the reference entity defaults."

reit:
  defined_in: "5.5"
  zh-cn: 房地产投资信托
  en: real estate investment trust
  short:
    zh-cn: "持有并经营房地产、把大部分收入作为股息分配的公司（REIT）。"
    en: "A company that owns and runs real estate and pays out most of its income as dividends (REIT)."

hedge-fund:
  defined_in: "5.5"
  zh-cn: 对冲基金
  en: hedge fund
  short:
    zh-cn: "只向富裕投资者和机构募集、可卖空和使用杠杆、收取管理费和业绩报酬的基金。"
    en: "A fund for wealthy investors and institutions that may sell short and use leverage, charging management and incentive fees."

incentive-fee:
  defined_in: "5.5"
  zh-cn: 业绩报酬
  en: incentive fee
  short:
    zh-cn: "按基金收益的一定比例收取的费用，常设高水位线。"
    en: "A fee equal to a share of a fund's returns, usually with a high-water mark."

private-equity:
  defined_in: "5.5"
  zh-cn: 私募股权
  en: private equity
  short:
    zh-cn: "投资非上市公司股权的长期基金，流动性差，按评估估值。"
    en: "Long-lived funds investing in unlisted companies; illiquid and valued by appraisal."

illiquidity-premium:
  defined_in: "5.5"
  zh-cn: 流动性溢价
  en: illiquidity premium
  short:
    zh-cn: "投资者因资产难以随时卖出而要求的额外收益。"
    en: "The extra return investors require for holding an asset that cannot easily be sold."

crypto-asset:
  defined_in: "5.5"
  zh-cn: 加密资产
  en: crypto asset
  short:
    zh-cn: "记录在区块链上的数字资产，例如比特币；价格波动很大。"
    en: "A digital asset recorded on a blockchain, such as bitcoin; its price is very volatile."

mutual-fund:
  defined_in: "6.1"
  zh-cn: 共同基金
  en: mutual fund
  short:
    zh-cn: "集合投资者资金、由经理按约定策略投资的基金；开放式基金按净值申购赎回。"
    en: "A fund pooling investors' money, invested by a manager under a stated strategy; open-end funds are bought and redeemed at NAV."

net-asset-value:
  defined_in: "6.1"
  zh-cn: 基金净值
  en: net asset value
  short:
    zh-cn: "基金资产减负债后除以份额数，美国共同基金每天收盘后计算一次。"
    en: "A fund's assets minus liabilities divided by shares; US mutual funds compute it once a day after the close."

exchange-traded-fund:
  defined_in: "6.1"
  zh-cn: 交易所交易基金
  en: exchange-traded fund
  short:
    zh-cn: "份额在交易所按市价交易的基金（ETF），通过授权参与者申购赎回。"
    en: "A fund whose shares trade on an exchange at market prices (ETF), created and redeemed through authorized participants."

creation-redemption:
  defined_in: "6.1"
  zh-cn: 申购赎回机制
  en: creation and redemption
  short:
    zh-cn: "授权参与者以一篮子证券与 ETF 交换份额的机制，使价格接近净值。"
    en: "The mechanism by which authorized participants exchange baskets of securities for ETF shares, keeping the price near NAV."

capital-gains-distribution:
  defined_in: "6.1"
  zh-cn: 资本利得分配
  en: capital gains distribution
  short:
    zh-cn: "基金把实现的资本利得分配给持有人，持有人当年须为此交税。"
    en: "A fund's payout of realized capital gains, taxable to holders that year."

index-fund:
  defined_in: "6.1"
  zh-cn: 指数基金
  en: index fund
  short:
    zh-cn: "按规则持有指数成分股、追求与指数相同收益的基金。"
    en: "A fund that holds an index's members by rule, aiming to match the index's return."

closed-end-fund:
  defined_in: "6.1"
  zh-cn: 封闭式基金
  en: closed-end fund
  short:
    zh-cn: "份额数量固定、只在交易所买卖、不申购赎回的基金。"
    en: "A fund with a fixed number of shares that trade on an exchange, with no creation or redemption."

expense-ratio:
  defined_in: "6.2"
  zh-cn: 费用率
  en: expense ratio
  short:
    zh-cn: "基金每年运营费用占平均资产的比例，每天从资产中扣除。"
    en: "A fund's yearly operating expenses as a share of average assets, deducted daily from assets."

twelve-b-1-fee:
  defined_in: "6.2"
  zh-cn: 12b-1 费
  en: 12b-1 fee
  short:
    zh-cn: "从基金资产中每年收取的营销和服务费用，含在费用率中，最多 1%。"
    en: "A yearly marketing and service fee taken from fund assets, included in the expense ratio, at most 1%."

turnover-ratio:
  defined_in: "6.2"
  zh-cn: 换手率
  en: turnover ratio
  short:
    zh-cn: "一年中买入或卖出（取较小者）的金额占平均资产的比例。"
    en: "The smaller of a year's purchases or sales as a share of average assets."

tracking-difference:
  defined_in: "6.2"
  zh-cn: 跟踪差异
  en: tracking difference
  short:
    zh-cn: "指数基金收益减指数收益的平均值，衡量平均落后指数多少。"
    en: "The average of an index fund's return minus the index return; how much it lags on average."

passive-investing:
  defined_in: "6.3"
  zh-cn: 被动投资
  en: passive investing
  short:
    zh-cn: "按市值加权持有整个市场，不试图选股或择时。"
    en: "Holding the whole market weighted by market capitalization, without trying to pick stocks or time the market."

active-management:
  defined_in: "6.3"
  zh-cn: 主动管理
  en: active management
  short:
    zh-cn: "通过选股或择时，试图获得高于市场的收益。"
    en: "Trying to earn more than the market by picking stocks or timing the market."

active-share:
  defined_in: "6.3"
  zh-cn: 主动份额
  en: active share
  short:
    zh-cn: "基金与基准持仓权重之差的绝对值之和的一半，衡量持仓与基准的差别。"
    en: "Half the sum of absolute differences between fund and benchmark weights; how different the holdings are from the benchmark."

due-diligence:
  defined_in: "6.4"
  zh-cn: 尽职调查
  en: due diligence
  short:
    zh-cn: "投资前和持有期间对基金的策略、人员、业绩、成本和风险的系统检查。"
    en: "A systematic check of a fund's strategy, people, performance, costs and risks, before and while investing."

performance-attribution:
  defined_in: "6.4"
  zh-cn: 业绩归因
  en: performance attribution
  short:
    zh-cn: "把相对基准的超额收益分解为配置效应、选择效应等来源。"
    en: "Splitting excess return over a benchmark into sources such as allocation and selection effects."

liquidity-mismatch:
  defined_in: "6.4"
  zh-cn: 流动性错配
  en: liquidity mismatch
  short:
    zh-cn: "基金允许频繁赎回，却持有难以按合理价格迅速出售的资产。"
    en: "A fund allowing frequent redemptions while holding assets that cannot be sold quickly at reasonable prices."

long-term-capital-gain:
  defined_in: "6.5"
  zh-cn: 长期资本利得
  en: long-term capital gain
  short:
    zh-cn: "持有超过一年的资产卖出时的利得，适用 0%/15%/20% 的较低税率。"
    en: "A gain on an asset held more than one year, taxed at the lower 0%/15%/20% rates."

qualified-dividend:
  defined_in: "6.5"
  zh-cn: 合格股利
  en: qualified dividend
  short:
    zh-cn: "满足持有期要求的美国公司股利，按长期资本利得税率交税。"
    en: "A dividend from a US company meeting holding-period rules, taxed at long-term capital gains rates."

traditional-account:
  defined_in: "6.5"
  zh-cn: 传统账户
  en: traditional account
  short:
    zh-cn: "存入免税、增长不交税、取出时按普通所得税率交税的退休账户。"
    en: "A retirement account with tax-free contributions and growth, taxed at ordinary rates on withdrawal."

roth-account:
  defined_in: "6.5"
  zh-cn: Roth 账户
  en: Roth account
  short:
    zh-cn: "存入已税的钱、增长和合格取款都免税的退休账户。"
    en: "A retirement account funded with taxed money, with tax-free growth and qualified withdrawals."

health-savings-account:
  defined_in: "6.5"
  zh-cn: 健康储蓄账户
  en: health savings account
  short:
    zh-cn: "配合高免赔额医疗保险的账户（HSA），存入、增长和医疗取款都免税。"
    en: "An account paired with a high-deductible health plan (HSA); contributions, growth and medical withdrawals are tax-free."

plan-529:
  defined_in: "6.5"
  zh-cn: 529 计划
  en: 529 plan
  short:
    zh-cn: "州设立的教育储蓄账户，增长和合格教育取款免税。"
    en: "A state education savings account with tax-free growth and qualified education withdrawals."

backdoor-roth:
  defined_in: "6.5"
  zh-cn: 后门 Roth
  en: backdoor Roth
  short:
    zh-cn: "向传统 IRA 存入不可抵扣的钱再转换为 Roth IRA，绕过收入限制。"
    en: "Putting nondeductible money into a traditional IRA and converting it to a Roth IRA, getting around income limits."

restricted-stock-unit:
  defined_in: "6.5"
  zh-cn: 限制性股票单位
  en: restricted stock unit
  short:
    zh-cn: "归属时公司给员工股票（RSU），归属日市值按工资交税。"
    en: "A grant of shares delivered at vesting (RSU), whose value then is taxed as wages."

employee-stock-purchase-plan:
  defined_in: "6.5"
  zh-cn: 员工购股计划
  en: employee stock purchase plan
  short:
    zh-cn: "员工通过工资扣款以折扣价购买公司股票的计划（ESPP）。"
    en: "A plan letting employees buy company stock at a discount through payroll deductions (ESPP)."

alternative-minimum-tax:
  defined_in: "6.5"
  zh-cn: 替代性最低税
  en: alternative minimum tax
  short:
    zh-cn: "扣除项较少的另一套所得税计算（AMT），税额较高时须按它交税；ISO 行权价差计入。"
    en: "A parallel income tax calculation with fewer deductions (AMT), due when higher; includes the ISO exercise spread."

asset-location:
  defined_in: "6.5"
  zh-cn: 资产位置
  en: asset location
  short:
    zh-cn: "决定把各类资产放在哪种税务待遇的账户中。"
    en: "Deciding which accounts, by tax treatment, hold which assets."

tax-loss-harvesting:
  defined_in: "6.5"
  zh-cn: 税损收割
  en: tax-loss harvesting
  short:
    zh-cn: "卖出亏损证券实现资本损失以抵税，并买入相似资产保持敞口。"
    en: "Selling losing securities to realize capital losses for tax, while buying similar assets to keep exposure."

wash-sale-rule:
  defined_in: "6.5"
  zh-cn: 洗售规则
  en: wash sale rule
  short:
    zh-cn: "卖出前后 30 天内买入实质上相同的证券时，损失不能当年扣除。"
    en: "A loss cannot be deducted that year if substantially identical securities are bought within 30 days before or after the sale."

household-balance-sheet:
  defined_in: "6.6"
  zh-cn: 家庭资产负债表
  en: household balance sheet
  short:
    zh-cn: "列出家庭的金融资产、实物资产、人力资本和负债的表。"
    en: "A list of a household's financial assets, real assets, human capital and liabilities."

emergency-fund:
  defined_in: "6.6"
  zh-cn: 应急基金
  en: emergency fund
  short:
    zh-cn: "为失业、生病和意外支出准备的、随时可用且价值稳定的资金。"
    en: "Money kept stable and available for job loss, illness and unexpected costs."

term-life-insurance:
  defined_in: "6.6"
  zh-cn: 定期寿险
  en: term life insurance
  short:
    zh-cn: "在约定期限内被保险人去世时支付保额的人寿保险。"
    en: "Life insurance paying the face amount if the insured dies within the agreed term."

disability-insurance:
  defined_in: "6.6"
  zh-cn: 伤残险
  en: disability insurance
  short:
    zh-cn: "因伤病不能工作时按月支付部分收入的保险。"
    en: "Insurance paying part of income monthly when illness or injury prevents work."

beneficiary-designation:
  defined_in: "6.6"
  zh-cn: 受益人指定
  en: beneficiary designation
  short:
    zh-cn: "直接指定退休账户或保险在所有人去世后的受益人，不经过遗嘱。"
    en: "Naming who receives a retirement account or insurance on the owner's death, outside the will."

strategic-asset-allocation:
  defined_in: "6.7"
  zh-cn: 战略资产配置
  en: strategic asset allocation
  short:
    zh-cn: "根据目标、风险承受能力与意愿和资本市场假设确定的长期目标比例。"
    en: "The long-term target mix set by goals, risk capacity and tolerance, and capital market assumptions."

tactical-asset-allocation:
  defined_in: "6.7"
  zh-cn: 战术资产配置
  en: tactical asset allocation
  short:
    zh-cn: "基于短期市场判断对战略比例的暂时偏离，实际上是择时。"
    en: "A temporary departure from the strategic mix on a short-term market view; in effect market timing."

home-bias:
  defined_in: "6.7"
  zh-cn: 本土偏好
  en: home bias
  short:
    zh-cn: "投资者持有的本国资产比例远高于本国在全球市场中的比例。"
    en: "Investors holding far more domestic assets than the home market's share of the global market."

rebalancing:
  defined_in: "6.7"
  zh-cn: 再平衡
  en: rebalancing
  short:
    zh-cn: "卖出比例过高、买入比例过低的资产，使组合回到目标比例。"
    en: "Selling overweight and buying underweight assets to bring the portfolio back to target."

form-10-k:
  defined_in: "6.8"
  zh-cn: 10-K 年报
  en: Form 10-K
  short:
    zh-cn: "美国上市公司向 SEC 提交的经审计的年度报告。"
    en: "The audited annual report US listed companies file with the SEC."

five-forces:
  defined_in: "6.8"
  zh-cn: 五力模型
  en: five forces
  short:
    zh-cn: "Porter 分析行业利润的框架：现有竞争、新进入者、替代品、供应商和买方的力量。"
    en: "Porter's framework for industry profits: rivalry, new entrants, substitutes, supplier power and buyer power."

reverse-dcf:
  defined_in: "6.8"
  zh-cn: 反向 DCF
  en: reverse DCF
  short:
    zh-cn: "从现在的股价反推市场隐含的未来增长率。"
    en: "Working back from today's price to the future growth the market implies."

investment-thesis:
  defined_in: "6.8"
  zh-cn: 投资逻辑
  en: investment thesis
  short:
    zh-cn: "说明价格为何低于价值、与市场的分歧以及判断错误的证据的书面论证。"
    en: "A written case for why price is below value, how one differs from the market, and what would prove one wrong."

replacement-ratio:
  defined_in: "6.9"
  zh-cn: 替代率
  en: replacement ratio
  short:
    zh-cn: "退休后支出（或收入）占退休前收入的比例。"
    en: "Retirement spending (or income) as a share of pre-retirement income."

safe-withdrawal-rate:
  defined_in: "6.9"
  zh-cn: 安全提款率
  en: safe withdrawal rate
  short:
    zh-cn: "第一年从组合中取出、以后按通胀调整，在设定期限内大概率不会用完的比例。"
    en: "The first-year withdrawal share, raised with inflation after, that very likely lasts the planned horizon."

sequence-of-returns-risk:
  defined_in: "6.9"
  zh-cn: 收益顺序风险
  en: sequence-of-returns risk
  short:
    zh-cn: "提款期间，同样的收益因顺序不同而使结果差别很大的风险。"
    en: "The risk that, during withdrawals, the same returns in a different order give very different outcomes."

full-retirement-age:
  defined_in: "6.9"
  zh-cn: 完全退休年龄
  en: full retirement age
  short:
    zh-cn: "领取全额社会保障金的年龄，1960 年及以后出生者为 67 岁。"
    en: "The age at which full Social Security benefits are paid; 67 for those born 1960 or later."

longevity-risk:
  defined_in: "6.9"
  zh-cn: 长寿风险
  en: longevity risk
  short:
    zh-cn: "活得比预期长、钱不够用的风险。"
    en: "The risk of living longer than planned and running out of money."

time-weighted-return:
  defined_in: "6.10"
  zh-cn: 时间加权收益
  en: time-weighted return
  short:
    zh-cn: "假设期初投入一笔钱并持有，各期收益的几何平均；基金公布的收益。"
    en: "The geometric average of period returns for a lump sum held throughout; what funds report."

dollar-weighted-return:
  defined_in: "6.10"
  zh-cn: 资金加权收益
  en: dollar-weighted return
  short:
    zh-cn: "考虑每次投入和取出的时间与金额的收益率，即现金流的内部收益率。"
    en: "The return that accounts for the timing and size of each purchase and withdrawal; the IRR of the cash flows."

investment-policy-statement:
  defined_in: "6.10"
  zh-cn: 投资政策说明书
  en: investment policy statement
  short:
    zh-cn: "写明家庭的目标、期限、风险承受能力、配置和规则的文件（IPS）。"
    en: "A document stating a household's goals, horizon, risk capacity, allocation and rules (IPS)."

money-illusion:
  defined_in: "6.11"
  zh-cn: 货币幻觉
  en: money illusion
  short:
    zh-cn: "用名义金额而不是实际购买力思考的倾向。"
    en: "The tendency to think in nominal amounts rather than real purchasing power."

i-bond:
  defined_in: "6.11"
  zh-cn: I 债券
  en: I bond
  short:
    zh-cn: "美国财政部的储蓄债券，利率由固定利率和按 CPI 调整的通胀利率组成，名义价值不降。"
    en: "A US Treasury savings bond whose rate combines a fixed rate and a CPI-based inflation rate; its nominal value never falls."

goals-based-investing:
  defined_in: "6.12"
  zh-cn: 目标导向投资
  en: goals-based investing
  short:
    zh-cn: "把每个家庭目标看作有金额、时间和重要程度的负债，并分别匹配资产。"
    en: "Treating each household goal as a liability with an amount, date and importance, and matching assets to each."

funded-ratio:
  defined_in: "6.12"
  zh-cn: 资金充足率
  en: funded ratio
  short:
    zh-cn: "为目标准备的资产与目标按无风险利率折现的现值之比。"
    en: "Assets set aside for a goal divided by the goal's present value at the riskless rate."

annual-review:
  defined_in: "6.13"
  zh-cn: 年度复盘
  en: annual review
  short:
    zh-cn: "每年按固定清单检查家庭的资产负债、目标、配置、成本、税务、保障和 IPS。"
    en: "A yearly check, against a fixed list, of the household's balance sheet, goals, allocation, costs, taxes, protection and IPS."

decision-journal:
  defined_in: "6.13"
  zh-cn: 决策记录
  en: decision journal
  short:
    zh-cn: "做重要决定时写下信息、理由、预期和退出条件，用来评价推理而不只是结果。"
    en: "A written record, at each important decision, of information, reasoning, expectations and exit conditions, for judging reasoning rather than outcomes."
