# Answer key for lesson 0.3. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.4]] (lesson), [[0.3#covariance]] (section), [[concept:covariance]], [[check:Q4]].
# expected: values are recomputed by course/verify/0.3.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "0.3"

context:
  - zh-cn: |-
      本课所有计算以百分点为单位，方差的单位为 %²。学习者已经学过求和符号，以及[[0.2]]的最优化；还没有学用历史数据估计参数（[[0.4]]）、回归（[[0.5]]）和组合理论（[[4.2]]）。
    en: |-
      All calculations in this lesson use percentage points, and variance is in %². The learner has studied summation notation and the optimization in [[0.2]]. The learner has not yet studied estimating parameters from historical data ([[0.4]]), regression ([[0.5]]) or portfolio theory ([[4.2]]).
  - questions: [C1, C2, C3, C4]
    zh-cn: |-
      讲义中的例子（情景表）：繁荣 / 正常 / 衰退的概率为 0.25 / 0.5 / 0.25；股票 A 的收益为 30 / 10 / −10，债券基金 B 的收益为 1 / 5 / 3（%）。由此 $E[R_A] = 10$，$E[R_B] = 3.5$，$\text{Var}_A = 200$，$\text{Var}_B = 2.75$，$\text{Cov} = -10$，$\rho \approx -0.43$。
    en: |-
      Example from the lesson (scenario table): boom / normal / recession with probabilities 0.25 / 0.5 / 0.25; stock A returns 30 / 10 / −10 and bond fund B returns 1 / 5 / 3 (%). So $E[R_A] = 10$, $E[R_B] = 3.5$, $\text{Var}_A = 200$, $\text{Var}_B = 2.75$, $\text{Cov} = -10$, $\rho \approx -0.43$.
  - questions: [C5]
    zh-cn: |-
      [[fig:6-1]] 是一张交互图：$\sigma_A = 20\%$，$\sigma_B = 10\%$，学习者可以用滑块调整相关系数 $\rho$ 和 A 的权重 $w$，图中显示组合标准差曲线、加权平均线和波动最小点。
    en: |-
      [[fig:6-1]] is an interactive figure with $\sigma_A = 20\%$ and $\sigma_B = 10\%$. The learner can move sliders for the correlation $\rho$ and the weight in A, $w$. It shows the portfolio standard deviation curve, the weighted-average line and the minimum-volatility point.
  - concepts: [expected-value, variance, standard-deviation]
    zh-cn: |-
      期望 $E[R] = \sum_i p_i R_i$；方差 $\text{Var}(R) = \sum_i p_i (R_i - E[R])^2$；标准差是方差的平方根，单位为 %，也叫波动率。
    en: |-
      Expected value $E[R] = \sum_i p_i R_i$. Variance $\text{Var}(R) = \sum_i p_i (R_i - E[R])^2$. The standard deviation is the square root of the variance, in %, and is also called volatility.
  - concepts: [covariance, correlation]
    zh-cn: |-
      协方差 $\text{Cov}(R_A, R_B) = \sum_i p_i (R_{A,i} - E[R_A])(R_{B,i} - E[R_B])$，看的是相对各自期望的偏差是否同向，不是收益的正负。相关系数 $\rho = \text{Cov} / (\sigma_A \sigma_B)$，在 $[-1, 1]$ 之间。
    en: |-
      Covariance $\text{Cov}(R_A, R_B) = \sum_i p_i (R_{A,i} - E[R_A])(R_{B,i} - E[R_B])$ measures whether the deviations from each expected value have the same sign, not whether the returns are positive. Correlation $\rho = \text{Cov} / (\sigma_A \sigma_B)$ lies in $[-1, 1]$.
  - concepts: [portfolio-variance]
    zh-cn: |-
      组合 $R_P = wR_A + (1-w)R_B$：期望是线性的；方差 $w^2\sigma_A^2 + (1-w)^2\sigma_B^2 + 2w(1-w)\text{Cov}$ 不是线性的。
    en: |-
      Portfolio $R_P = wR_A + (1-w)R_B$: the expected value is linear; the variance $w^2\sigma_A^2 + (1-w)^2\sigma_B^2 + 2w(1-w)\text{Cov}$ is not.
  - concepts: [diversification]
    zh-cn: |-
      分散化：只要 $\rho < 1$，组合标准差就小于加权平均。$\rho = 0$ 时好处来自“方差相加、标准差不相加”（$\sqrt{a^2+b^2} < a+b$），不来自协方差项。分散化不需要负相关。
    en: |-
      Diversification: as long as $\rho < 1$, the portfolio standard deviation is less than the weighted average. When $\rho = 0$, the benefit comes from "variances add, standard deviations do not" ($\sqrt{a^2+b^2} < a+b$), not from the covariance term. Diversification does not require negative correlation.

common_errors:
  - questions: [Q1, C5]
    zh-cn: |-
      $\rho = 0$ 时用“受协方差影响”解释分散化：结论对，但理由不成立。此时协方差项为 0，好处来自方差相加、标准差不相加。
    en: |-
      Explaining diversification at $\rho = 0$ by "the effect of covariance": the conclusion is right but the reason is wrong. The covariance term is 0 in this case; the benefit comes from the fact that variances add but standard deviations do not.
  - questions: [Q2]
    zh-cn: |-
      认为“两只基金都涨了，所以正相关”：相关看的是相对各自期望的偏差方向，不是收益的正负；而且一次观测说明不了概率关系。
    en: |-
      Saying "both funds went up, so they are positively correlated": correlation is about the direction of deviations from each expected value, not about whether returns are positive. Also, one observation says nothing about a probabilistic relationship.
  - questions: [Q3]
    zh-cn: |-
      只看一项资产自己的期望和波动来判断是否值得持有，忽略它与组合中其他资产的相关性。与组合负相关的资产，即使期望收益较低，也可能大幅降低组合的风险。
    en: |-
      Judging whether an asset is worth holding only by its own expected return and volatility, ignoring its correlation with the rest of the portfolio. An asset negatively correlated with the portfolio can greatly lower its risk even if its expected return is lower.
  - questions: [Q5]
    zh-cn: |-
      展开 $(aX + bY - E[aX + bY])^2$ 时漏掉交叉项或它的系数 2，或者以为 $E[XY] = E[X]E[Y]$ 总是成立。
    en: |-
      Leaving out the cross term or its factor 2 when expanding $(aX + bY - E[aX + bY])^2$, or assuming $E[XY] = E[X]E[Y]$ always holds.
  - questions: [Q6]
    zh-cn: |-
      以为 $\rho = -1$ 时各持有一半就能消除风险。使方差为 0 的权重取决于两项资产的标准差：波动大的资产权重要小。
    en: |-
      Thinking that with $\rho = -1$ holding half of each removes the risk. The weight that makes the variance 0 depends on the two standard deviations: the more volatile asset gets the smaller weight.
  - questions: [Q7]
    zh-cn: |-
      以为持有足够多的股票就能消除全部风险。股票之间的协方差为正时，组合方差趋于协方差 $c$，这部分风险分散不掉。
    en: |-
      Thinking that holding enough stocks removes all risk. When stocks have positive covariances, the portfolio variance approaches the covariance $c$, and that risk cannot be diversified away.
  - questions: [C2, C4, Q3]
    zh-cn: |-
      把方差的单位写成 %，或者直接比较方差和期望收益的大小。
    en: |-
      Writing the unit of variance as % instead of %², or comparing a variance directly with an expected return.

questions:
  # ---------- Check questions (随堂题, scored) ----------
  - id: C1
    kind: check
    section: expected-value
    concepts: [expected-value]
    question:
      zh-cn: |-
        一项投资的期望收益，就是最可能出现的收益。
      en: |-
        The expected return of an investment is the return most likely to occur.
    correct: false
    hint:
      zh-cn: 期望是怎样算出来的？想一个收益只有两种可能的例子，例如一半概率得 0、一半概率得 20%。
      en: How is the expected value computed? Think of an example with only two possible returns, such as 0 or 20% with equal probability.
    answer:
      zh-cn: |-
        错。期望是按概率加权的平均，表示同样的情况重复很多次时平均的结果，不一定是概率最大的结果，甚至可能根本不会出现。例如一半概率得 0、一半概率得 20%，期望是 10%，但每次的结果只能是 0 或 20%。
      en: |-
        False. The expected value is a probability-weighted average: the average result if the same situation were repeated many times. It need not be the most likely result and may never occur at all. With a 50% chance of 0 and a 50% chance of 20%, the expected return is 10%, but each outcome is either 0 or 20%.

  - id: C2
    kind: check
    section: variance
    concepts: [expected-value, variance, standard-deviation]
    question:
      zh-cn: |-
        如果股票 A 在每种情景下的收益都增加 5 个百分点，它的期望和标准差会怎样变化？
      en: |-
        If stock A's return rises by 5 percentage points in every scenario, how do its expected value and standard deviation change?
    choices:
      - zh-cn: 期望增加 5 个百分点，标准差不变
        en: The expected value rises by 5 percentage points, and the standard deviation does not change
      - zh-cn: 期望和标准差都增加 5 个百分点
        en: Both rise by 5 percentage points
        why:
          zh-cn: 标准差衡量的是结果偏离期望有多远。每种情景下的偏差 $R_i - E[R]$ 变了吗？
          en: The standard deviation measures how far results are from the expected value. Do the deviations $R_i - E[R]$ change?
      - zh-cn: 期望增加 5 个百分点，标准差变大，因为收益的数值更大了
        en: The expected value rises by 5 percentage points, and the standard deviation grows because the returns are larger numbers
        why:
          zh-cn: 方差计算的是收益本身的平方，还是收益与期望之差的平方？
          en: Does the variance square the returns themselves, or their differences from the expected value?
      - zh-cn: 两者都不变
        en: Neither changes
        why:
          zh-cn: 每种情景的收益都变高了，按概率加权的平均会不变吗？
          en: Every scenario's return is higher. Can the probability-weighted average stay the same?
    correct: A
    answer:
      zh-cn: |-
        (A)。期望是加权平均，每个结果加 5，期望也加 5，变为 15%。每种情景的偏差 $R_i - E[R]$ 都不变，所以方差和标准差不变。把整个分布平移，不改变它的分散程度。
      en: |-
        (A). The expected value is a weighted average: adding 5 to every result adds 5 to it, giving 15%. Each deviation $R_i - E[R]$ is unchanged, so the variance and standard deviation do not change. Shifting the whole distribution does not change how spread out it is.

  - id: C3
    kind: check
    section: covariance
    concepts: [covariance]
    question:
      zh-cn: |-
        在讲义的情景表中，把债券 B 在衰退时的收益从 3% 改为 8%，其他不变。A 与 B 的协方差会：
      en: |-
        In the lesson's scenario table, change bond fund B's return in a recession from 3% to 8%, with everything else unchanged. The covariance of A and B:
    choices:
      - zh-cn: 变得更负
        en: Becomes more negative
      - zh-cn: 变成正数
        en: Becomes positive
        why:
          zh-cn: 衰退时 A 远低于它的期望。B 改为 8% 以后，在衰退时它高于还是低于自己的期望？这一项乘积的符号是什么？
          en: In a recession A is far below its expected value. After the change, is B above or below its own expected value in a recession? What is the sign of that product?
      - zh-cn: 不变，因为只改了一种情景
        en: Does not change, because only one scenario changed
        why:
          zh-cn: 一种情景的变化会改变这一项的乘积，也会改变 B 的期望。协方差会不受影响吗？
          en: Changing one scenario changes that product and also B's expected value. Can the covariance stay the same?
      - zh-cn: 变得不那么负，因为 B 的收益提高了
        en: Becomes less negative, because B's return is higher
        why:
          zh-cn: 协方差看的不是收益的高低，而是两者相对各自期望的偏差是同向还是反向。
          en: Covariance is not about how high the returns are, but whether the two deviate from their own expected values in the same or opposite directions.
    correct: A
    answer:
      zh-cn: |-
        (A)。衰退时 A 远低于期望（偏差 −20）。B 改为 8% 后，它在衰退时高于自己的新期望 4.75%，两者反向，这一项的贡献由正变负。B 的偏差也重新分布：繁荣时为 −3.75。协方差从 −10 变为 −35。B 在 A 表现最差的时候表现好，对 A 的对冲作用更强了。
      en: |-
        (A). In a recession A is far below its expected value (deviation −20). After the change, B is above its new expected value of 4.75% in a recession, so the two move in opposite directions, and this term turns from positive to negative. B's other deviations also change: −3.75 in a boom. The covariance goes from −10 to −35. B does well exactly when A does worst, so it hedges A more strongly.

  - id: C4
    kind: check
    section: linear-combination
    concepts: [portfolio-variance]
    question:
      zh-cn: |-
        组合中 A 的权重从 50% 提高到 80%。组合的期望收益按权重线性变化，组合的标准差也按权重线性变化，等于两项资产标准差的加权平均。
      en: |-
        The weight of A in a portfolio rises from 50% to 80%. The portfolio's expected return changes linearly with the weight, and so does its standard deviation, which equals the weighted average of the two assets' standard deviations.
    correct: false
    hint:
      zh-cn: 组合方差的公式里，权重以什么形式出现？还有没有别的项？
      en: In the formula for portfolio variance, in what form do the weights appear? Is there another term?
    answer:
      zh-cn: |-
        错。前半句对：期望是线性的。后半句错：组合方差中权重以平方和乘积的形式出现，还有协方差项，所以标准差不是加权平均。只有相关系数为 1 时，组合标准差才等于加权平均；相关系数小于 1 时，它低于加权平均。
      en: |-
        False. The first half is right: the expected value is linear. The second half is wrong: in the portfolio variance the weights appear squared and multiplied together, and there is a covariance term, so the standard deviation is not a weighted average. Only with a correlation of 1 does the portfolio's standard deviation equal the weighted average; with a correlation below 1 it is lower.

  - id: C5
    kind: check
    section: diversification
    concepts: [diversification, portfolio-variance]
    widget: { id: diversification, set: { rho: 0 } }
    question:
      zh-cn: |-
        在 [[fig:6-1]] 中把 $\rho$ 调到 0（$\sigma_A = 20\%$，$\sigma_B = 10\%$）。组合标准差的最小值：
      en: |-
        In [[fig:6-1]], set $\rho$ to 0 ($\sigma_A = 20\%$, $\sigma_B = 10\%$). The smallest portfolio standard deviation:
    choices:
      - zh-cn: 比 B 自己的 10% 还小
        en: Is below B's own 10%
      - zh-cn: 等于 10%，在全部持有 B 时取得
        en: Equals 10%, reached by holding only B
        why:
          zh-cn: 看图中曲线在权重为 0 附近的走向：从全部持有 B 开始加入一点 A，组合标准差上升还是下降？
          en: 'Look at the curve near a weight of 0: starting from all B and adding a little A, does the portfolio''s standard deviation rise or fall?'
      - zh-cn: 等于两者标准差的加权平均
        en: Equals the weighted average of the two standard deviations
        why:
          zh-cn: 比较图中的曲线和表示加权平均的虚线，$\rho = 0$ 时它们重合吗？
          en: Compare the curve with the dashed line for the weighted average. Do they coincide when $\rho = 0$?
      - zh-cn: 只有 $\rho$ 为负时，才可能低于 10%
        en: Can fall below 10% only when $\rho$ is negative
        why:
          zh-cn: $\rho = 0$ 时协方差项为 0，但两项资产的方差是按权重的平方相加的。图中的曲线最低点在哪里？
          en: With $\rho = 0$ the covariance term is 0, but the two variances add with squared weights. Where is the lowest point of the curve?
    correct: A
    answer:
      zh-cn: |-
        (A)。$\rho = 0$ 时，在 A 的权重约为 20% 处，组合标准差约为 8.94%，低于 B 的 10%。不相关的资产也能分散风险：在低波动的 B 中加入一部分波动更高的 A，组合的总风险反而下降，因为方差按权重的平方相加，而标准差不这样相加。
      en: |-
        (A). With $\rho = 0$, at a weight of about 20% in A, the portfolio's standard deviation is about 8.94%, below B's 10%. Even uncorrelated assets diversify: adding some of the more volatile A to the less volatile B lowers total risk, because variances add with squared weights and standard deviations do not add that way.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [diversification, covariance]
    question:
      zh-cn: |-
        判断真假并说明理由：两项资产的相关系数为 0 时，组合标准差等于两者标准差的加权平均。
      en: |-
        Determine whether this statement is true or false, and explain: when the correlation between two assets is 0, the portfolio standard deviation equals the weighted average of their standard deviations.
    answer:
      zh-cn: |-
        假。$\rho = 0$ 时协方差项为 0，$\sigma_P = \sqrt{w^2\sigma_A^2 + (1-w)^2\sigma_B^2} < w\sigma_A + (1-w)\sigma_B$，因为对正数 $a, b$ 有 $\sqrt{a^2+b^2} < a+b$。
      en: |-
        False. When $\rho = 0$ the covariance term is 0, and $\sigma_P = \sqrt{w^2\sigma_A^2 + (1-w)^2\sigma_B^2} < w\sigma_A + (1-w)\sigma_B$, because $\sqrt{a^2+b^2} < a+b$ for positive $a, b$.
    rubric:
      zh-cn:
        - "结论为假。"
        - "理由必须指向“方差相加、标准差不相加”。用“受协方差影响”作理由在 $\\rho = 0$ 时不成立，需要订正。"
      en:
        - "States false."
        - "The reason must point to \"variances add, standard deviations do not\". A reason based on \"the effect of covariance\" does not hold at $\\rho = 0$ and needs to be revised."

  - id: Q2
    kind: exercise
    level: A
    concepts: [correlation, covariance]
    question:
      zh-cn: |-
        一位朋友说：“这两只基金去年都涨了，所以它们的相关系数一定是正的。”评估这个说法。
      en: |-
        A friend says: "Both of these funds went up last year, so their correlation must be positive." Evaluate this statement.
    answer:
      zh-cn: |-
        不对。(1) 相关系数看的是相对各自期望的偏差方向，不是收益是否同为正：两只基金期望都是 8%，一只涨 15%、一只涨 2%，这一年对协方差的贡献是负的。(2) 一年只是一个观测点，样本太小，说明不了概率关系（[[0.4]] 会讲怎样从数据估计）。
      en: |-
        No. (1) Correlation depends on the direction of deviations from each expected value, not on whether both returns are positive. If both funds have an expected return of 8% and one rises 15% while the other rises 2%, this year contributes a negative amount to the covariance. (2) One year is a single observation; the sample is too small to show a probabilistic relationship ([[0.4]] covers how to estimate from data).
    rubric:
      zh-cn:
        - "指出相关看偏差而不是收益的正负。"
        - "指出一次观测 / 样本太小。两点都要有。"
      en:
        - "Points out that correlation is about deviations, not about the sign of returns."
        - "Points out that one observation is too small a sample. Both points are required."

  - id: Q3
    kind: exercise
    level: B
    concepts: [expected-value, variance, standard-deviation, covariance, correlation]
    expected: { cov_CD: "-88.95", rho_CD: "-0.98", E50: "6.1", sd50: "3.56" }
    question:
      zh-cn: |-
        三种情景概率为 0.3、0.4、0.3；资产 C 的收益为 25、8、−10（%），资产 D 为 −5、6、12（%）。已知 $E[C] = 7.7\%$，$\sigma_C \approx 13.56\%$，$E[D] = 4.5\%$，$\sigma_D \approx 6.70\%$。
        (a) 计算两者的协方差和相关系数。
        (b) 一位分析师说：“D 的期望收益比 C 低得多，波动也不算小，放进组合只会拉低收益，不值得持有。”计算 C、D 各一半的组合的期望和标准差，评价这个说法。
      en: |-
        Three scenarios have probabilities 0.3, 0.4 and 0.3. Asset C returns 25, 8 and −10 (%), and asset D returns −5, 6 and 12 (%). Given: $E[C] = 7.7\%$, $\sigma_C \approx 13.56\%$, $E[D] = 4.5\%$, $\sigma_D \approx 6.70\%$.
        (a) Calculate their covariance and correlation.
        (b) An analyst says: "D's expected return is much lower than C's and its swings are not small, so adding it to a portfolio only drags down the return; it is not worth holding." Calculate the expected value and standard deviation of a portfolio with half in each, and evaluate the statement.
    answer:
      zh-cn: |-
        (a) $\text{Cov} = 0.3(17.3)(-9.5) + 0.4(0.3)(1.5) + 0.3(-17.7)(7.5) = -88.95$（%²），$\rho = \frac{-88.95}{13.56 \times 6.70} \approx -0.98$。
        (b) $E = 0.5 \times 7.7 + 0.5 \times 4.5 = 6.1\%$；$\text{Var} = 0.25 \times 183.81 + 0.25 \times 44.85 + 2 \times 0.25 \times (-88.95) = 12.69$（%²），$\sigma \approx 3.56\%$。和只持有 C 相比，期望收益只少 1.6 个百分点，标准差却从 13.56% 降到 3.56%。分析师只看了 D 自己的期望和波动，忽略了它与 C 几乎完全负相关：D 在 C 表现差的时候表现好，持有它大幅降低了组合的风险。评价一项资产，要看它对组合的影响。
      en: |-
        (a) $\text{Cov} = 0.3(17.3)(-9.5) + 0.4(0.3)(1.5) + 0.3(-17.7)(7.5) = -88.95$ (%²), and $\rho = \frac{-88.95}{13.56 \times 6.70} \approx -0.98$.
        (b) $E = 0.5 \times 7.7 + 0.5 \times 4.5 = 6.1\%$; $\text{Var} = 0.25 \times 183.81 + 0.25 \times 44.85 + 2 \times 0.25 \times (-88.95) = 12.69$ (%²), so $\sigma \approx 3.56\%$. Compared with holding only C, the expected return is only 1.6 percentage points lower, while the standard deviation falls from 13.56% to 3.56%. The analyst looks only at D's own expected return and swings and ignores that it is almost perfectly negatively correlated with C: D does well when C does badly, so holding it greatly lowers the portfolio's risk. An asset should be judged by its effect on the portfolio.
    rubric:
      zh-cn:
        - "(a) 协方差 −88.95（%²），相关系数约 −0.98，写出计算过程。"
        - "(b) 期望 6.1%、标准差约 3.56%，并指出 D 的价值在于与 C 负相关、降低组合风险。同意分析师的说法：需要订正。"
      en:
        - "(a) A covariance of −88.95 (%²) and a correlation of about −0.98, with working shown."
        - "(b) An expected value of 6.1% and a standard deviation of about 3.56%, and points out that D's value lies in its negative correlation with C, which lowers portfolio risk. Agreeing with the analyst: needs revision."

  - id: Q5
    kind: exercise
    level: C
    star: true
    concepts: [portfolio-variance, expected-value, variance, covariance]
    question:
      zh-cn: |-
        证明 $\text{Var}(aX + bY) = a^2\text{Var}(X) + b^2\text{Var}(Y) + 2ab\,\text{Cov}(X, Y)$。
      en: |-
        Prove that $\text{Var}(aX + bY) = a^2\text{Var}(X) + b^2\text{Var}(Y) + 2ab\,\text{Cov}(X, Y)$.
    answer:
      zh-cn: |-
        由期望的线性，$E[aX + bY] = aE[X] + bE[Y]$。记 $\tilde X = X - E[X]$，$\tilde Y = Y - E[Y]$，则
        $$\text{Var}(aX+bY) = E\big[(a\tilde X + b\tilde Y)^2\big] = a^2E[\tilde X^2] + b^2E[\tilde Y^2] + 2abE[\tilde X\tilde Y],$$
        即 $a^2\text{Var}(X) + b^2\text{Var}(Y) + 2ab\,\text{Cov}(X, Y)$。
      en: |-
        By linearity of expectation, $E[aX + bY] = aE[X] + bE[Y]$. Let $\tilde X = X - E[X]$ and $\tilde Y = Y - E[Y]$. Then
        $$\text{Var}(aX+bY) = E\big[(a\tilde X + b\tilde Y)^2\big] = a^2E[\tilde X^2] + b^2E[\tilde Y^2] + 2abE[\tilde X\tilde Y],$$
        which equals $a^2\text{Var}(X) + b^2\text{Var}(Y) + 2ab\,\text{Cov}(X, Y)$.
    rubric:
      zh-cn:
        - "使用期望的线性那一步要写出理由。"
        - "正确展开平方，并逐项识别为方差和协方差。"
      en:
        - "The step that uses linearity of expectation must be justified."
        - "Expands the square correctly and identifies each term as a variance or covariance."

  - id: Q6
    kind: exercise
    level: C
    concepts: [portfolio-variance, correlation]
    expected: { w: "30.8" }
    question:
      zh-cn: |-
        若 $\rho = -1$，求使组合方差为 0 的权重 $w$（用 $\sigma_A, \sigma_B$ 表示），并代入 $\sigma_A = 18\%$、$\sigma_B = 8\%$ 求数值。
      en: |-
        If $\rho = -1$, find the weight $w$ that makes the portfolio variance 0 (in terms of $\sigma_A$ and $\sigma_B$), and then compute its value for $\sigma_A = 18\%$ and $\sigma_B = 8\%$.
    answer:
      zh-cn: |-
        $\rho = -1$ 时 $\sigma_P^2 = \big(w\sigma_A - (1-w)\sigma_B\big)^2$，令其为 0 得 $w = \frac{\sigma_B}{\sigma_A + \sigma_B} = \frac{8}{26} \approx 30.8$%。$w$ 自动在 0 与 1 之间，不需要卖空。
      en: |-
        When $\rho = -1$, $\sigma_P^2 = \big(w\sigma_A - (1-w)\sigma_B\big)^2$. Setting it to 0 gives $w = \frac{\sigma_B}{\sigma_A + \sigma_B} = \frac{8}{26} \approx 30.8$%. The weight is automatically between 0 and 1, so no short selling is needed.
    rubric:
      zh-cn:
        - "写出 $\\rho = -1$ 时方差为完全平方，或等价推导。"
        - "得出公式与数值。"
      en:
        - "Shows that the variance is a perfect square when $\\rho = -1$, or an equivalent derivation."
        - "Obtains the formula and the value."

  - id: Q7
    kind: exercise
    level: C
    concepts: [portfolio-variance, diversification]
    question:
      zh-cn: |-
        等权持有 $n$ 只股票，每只方差都是 $\sigma^2$，任意两只之间的协方差都是 $c$（$c > 0$）。求组合方差，讨论 $n \to \infty$ 时的极限，并解释其投资含义。
      en: |-
        You hold $n$ stocks with equal weights. Each has variance $\sigma^2$, and the covariance between any two is $c$ ($c > 0$). Find the portfolio variance, discuss its limit as $n \to \infty$, and explain what it means for investing.
    answer:
      zh-cn: |-
        $\text{Var} = \frac{1}{n^2}\big(n\sigma^2 + (n^2 - n)c\big) = \frac{\sigma^2}{n} + \left(1 - \frac{1}{n}\right)c \to c$。
        个股自己的风险（$\sigma^2/n$ 项）可以分散掉；所有股票共同的风险 $c$ 分散不掉（[[concept:systematic-risk]]，[[4.5]] 详细讲）。
      en: |-
        $\text{Var} = \frac{1}{n^2}\big(n\sigma^2 + (n^2 - n)c\big) = \frac{\sigma^2}{n} + \left(1 - \frac{1}{n}\right)c \to c$.
        The risk specific to each stock (the $\sigma^2/n$ term) can be diversified away; the risk common to all stocks, $c$, cannot ([[concept:systematic-risk]], covered in [[4.5]]).
    rubric:
      zh-cn:
        - "交叉项个数为 $n^2 - n$。"
        - "极限正确。"
        - "含义要区分“能分散的”和“不能分散的”。"
      en:
        - "The number of cross terms is $n^2 - n$."
        - "The limit is correct."
        - "The interpretation distinguishes the risk that can be diversified from the risk that cannot."
