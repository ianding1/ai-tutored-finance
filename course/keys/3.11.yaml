# Answer key for lesson 3.11. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[3.11#pe]] (section), [[concept:cape]], [[check:Q3]], [[fig:4-1]].
# expected: values are recomputed by course/verify/3.11.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "3.11"

context:
  - zh-cn: |-
      学习者学过经济周期（[[2.8]]）、财务报表与盈余质量（[[3.7]]）、ROE 与财务杠杆（[[3.8]]）、Gordon 模型、派息率和可持续增长率（[[3.9]]）、企业价值和 DCF（[[3.10]]）。讲义还没有讲资本市场假设（[[4.11]]）。金额保留两位小数。
    en: |-
      The learner has studied the business cycle ([[2.8]]), financial statements and earnings quality ([[3.7]]), ROE and financial leverage ([[3.8]]), the Gordon model, the payout ratio and the sustainable growth rate ([[3.9]]), and enterprise value and DCF ([[3.10]]). The lesson has not yet covered capital market assumptions ([[4.11]]). Amounts to two decimals.
  - concepts: [price-earnings-ratio]
    zh-cn: |-
      讲义：相对估值用可比公司的倍数乘以目标公司的数字；前提是可比公司在增长、风险和盈利能力上相似，且市场定价合理。静态与动态市盈率。$\frac{P_0}{E_1} = \frac{1 - b}{r - g}$，取决于派息率、股权成本和增长率；增长越快、风险越低，市盈率越高；市盈率与 ROE 的关系留给练习题。盈利收益率 $\frac{E_1}{P_0}$。
    en: |-
      The lesson: relative valuation multiplies the target's numbers by comparables' multiples; it assumes comparables are similar in growth, risk and profitability and are reasonably priced. Trailing and forward P/E. $\frac{P_0}{E_1} = \frac{1 - b}{r - g}$, depending on the payout ratio, the cost of equity and growth; faster growth and lower risk mean a higher P/E; the link to ROE is left to an exercise. Earnings yield $\frac{E_1}{P_0}$.
  - concepts: [ev-ebitda, price-to-book, price-to-sales]
    zh-cn: |-
      讲义：EV/EBITDA 不受资本结构和折旧政策影响，常用于比较负债不同的公司，但忽略资本支出；市净率适用于银行、保险公司（与 ROE 的关系留给练习题）；市销率用于利润为负或不稳定的公司，要结合利润率。分子分母要对应同一类投资者：股权价值配净利润、账面权益；企业价值配 EBITDA、EBIT（收入也常与企业价值相除）。
    en: |-
      The lesson: EV/EBITDA is unaffected by capital structure and depreciation policy, often used to compare companies with different debt, but ignores capital spending; P/B suits banks and insurers (its link to ROE is left to an exercise); P/S is for companies with negative or unstable profit and must be read with margins. Numerator and denominator must belong to the same investors: equity value with net income and book equity; enterprise value with EBITDA and EBIT (revenue is also commonly divided into enterprise value).
  - concepts: [cape, price-earnings-ratio]
    zh-cn: |-
      讲义：周期性公司利润波动大、股价波动小，当年市盈率会误导。[[fig:4-1]]：股价一直为 100，利润为 $5(1 + a \sin(2\pi t / 8))$，市盈率用当年利润，CAPE 用过去 10 年平均利润；滑块：幅度 $a$ 为 0 到 0.8（步长 0.1，默认 0.5）；读数显示 16 年中市盈率和 CAPE 的范围。CAPE：价格除以过去 10 年经通胀调整的平均利润（Shiller）；标普 500 自 1881 年以来平均约 17，1999 年 12 月约 44，2025 年底到 2026 年约 39 到 41。CAPE 高时此后 10 年的平均实际收益往往较低，但关系不精确，不能用来精确择时；能否估计长期预期收益留给练习题。
    en: |-
      The lesson: cyclical companies' profits swing widely while prices move little, so the current P/E misleads. [[fig:4-1]]: price stays at 100, earnings are $5(1 + a \sin(2\pi t / 8))$, P/E uses current earnings and CAPE the average of the last 10 years; slider: amplitude $a$ from 0 to 0.8 (in steps of 0.1, default 0.5); the readout shows the ranges of P/E and CAPE over 16 years. CAPE: price divided by average inflation-adjusted earnings of the past 10 years (Shiller); for the S&P 500 it has averaged about 17 since 1881, was about 44 in December 1999, and about 39 to 41 from late 2025 into 2026. High CAPE tends to be followed by low average real returns over 10 years, but the relation is inexact and cannot time the market precisely; whether it can estimate long-run expected returns is left to an exercise.

common_errors:
  - questions: [C1, C2, Q1]
    zh-cn: |-
      以为市盈率低就一定便宜；忽略市盈率反映的增长、风险和盈利能力的差别。
    en: |-
      Thinking a low P/E always means cheap; ignoring the differences in growth, risk and profitability that the P/E reflects.
  - questions: [C3, Q3]
    zh-cn: |-
      分子分母不对应：例如用企业价值除以净利润，或用股价比较负债水平很不相同的公司而不考虑杠杆。
    en: |-
      Mismatching numerator and denominator: for example, dividing enterprise value by net income, or comparing price multiples of companies with very different debt without considering leverage.
  - questions: [C4, Q4]
    zh-cn: |-
      周期性公司在利润最高（市盈率最低）时显得最便宜；或者把 CAPE 当作精确的择时工具。
    en: |-
      Cyclical companies look cheapest when profits peak (P/E lowest); or treating CAPE as a precise timing tool.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: multiples
    concepts: [price-earnings-ratio]
    expected: { p: "60" }
    question:
      zh-cn: |-
        同行业可比公司的平均市盈率为 15，目标公司每股利润为 4。(a) 按可比公司的倍数，目标公司每股值多少？(b) 目标公司的负债比同行高得多，增长也较慢。用同行的平均市盈率估值，结果可能偏高还是偏低？为什么？
      en: |-
        Comparable companies in the industry have an average P/E of 15, and the target company earns 4 per share. (a) By the comparables' multiple, what is the target worth per share? (b) The target has much more debt than its peers and grows more slowly. Is a valuation with the peers' average P/E likely too high or too low? Why?
    answer:
      zh-cn: |-
        (a) $15 \times 4 = 60$。
        (b) 偏高。负债高使股东的风险更大，股权成本 $r$ 更高；增长较慢使 $g$ 更低。两者都使合理的市盈率低于同行，直接用同行的 15 倍会高估它。
      en: |-
        (a) $15 \times 4 = 60$.
        (b) Too high. More debt makes shareholders' risk larger, so the cost of equity $r$ is higher; slower growth means a lower $g$. Both push the justified P/E below the peers', so using the peers' 15 overvalues it.
    rubric:
      zh-cn:
        - "(a) 60。"
        - "(b) 偏高，用风险（股权成本）和增长说明。"
      en:
        - "(a) 60."
        - "(b) Too high, explained by risk (cost of equity) and growth."

  - id: C2
    kind: check
    section: pe
    concepts: [price-earnings-ratio, gordon-growth-model, payout-ratio]
    expected: { pe: "10" }
    question:
      zh-cn: |-
        (a) 一家公司派息率为 40%，股权成本 10%，股息和利润预计永远每年增长 6%。按 Gordon 模型，合理的动态市盈率是多少？
        (b) A、B 两家公司的静态市盈率都是 25。A 的利润稳定增长；B 是周期性公司，去年利润因行业低迷大幅下降。两者的 25 倍含义有什么不同？
      en: |-
        (a) A company has a payout ratio of 40% and a cost of equity of 10%, and its dividends and earnings are expected to grow 6% a year forever. By the Gordon model, what is the justified forward P/E?
        (b) Companies A and B both have a trailing P/E of 25. A's earnings grow steadily; B is cyclical and its earnings fell sharply last year in an industry downturn. How do the two 25s differ in meaning?
    answer:
      zh-cn: |-
        (a) $\frac{0.4}{0.10 - 0.06} = 10$ 倍。
        (b) A 的 25 倍反映市场对它长期增长的预期（或较低的风险）。B 的 25 倍主要是因为分母（去年的利润）暂时很低，市场预期利润会恢复，股价并没有随利润同比例下降；它不一定说明市场预期 B 会高增长，用正常年份的利润计算，它的市盈率可能并不高。
      en: |-
        (a) $\frac{0.4}{0.10 - 0.06} = 10$ times.
        (b) A's 25 reflects the market's expectation of long-run growth (or lower risk). B's 25 arises mainly because the denominator (last year's earnings) is temporarily very low; the market expects earnings to recover, so the price did not fall in proportion to earnings. It does not necessarily mean the market expects high growth from B; on normal-year earnings its P/E may not be high.
    rubric:
      zh-cn:
        - "(a) 10 倍。"
        - "(b) 区分增长预期和暂时偏低的利润。"
      en:
        - "(a) 10 times."
        - "(b) Distinguishes growth expectations from temporarily low earnings."

  - id: C3
    kind: check
    section: other-multiples
    concepts: [ev-ebitda, price-earnings-ratio, financial-leverage]
    expected: { a: "13.33", b: "8.89" }
    question:
      zh-cn: |-
        A、B 两家公司的业务完全相同：EBITDA 都是 100，折旧 20，税率 25%，企业价值都是 800（EV/EBITDA 都是 8）。A 没有负债，股权价值 800；B 有 400 的负债（利息 20），股权价值 400。(a) 两家公司的市盈率各是多少？(b) B 的市盈率较低，是否说明 B 的股票更便宜？
      en: |-
        Companies A and B have identical businesses: EBITDA of 100 each, depreciation of 20, a tax rate of 25%, and an enterprise value of 800 each (EV/EBITDA of 8 for both). A has no debt and equity worth 800; B has debt of 400 (interest 20) and equity worth 400. (a) What is each company's P/E? (b) B has a lower P/E. Does that mean B's stock is cheaper?
    answer:
      zh-cn: |-
        (a) A 的净利润 $(100 - 20) \times 0.75 = 60$，市盈率 $\frac{800}{60} \approx 13.33$。B 的净利润 $(100 - 20 - 20) \times 0.75 = 45$，市盈率 $\frac{400}{45} \approx 8.89$。
        (b) 不是。两家公司的业务和企业价值完全相同，B 的市盈率较低只是因为杠杆：B 的股东承担更大的风险，要求更高的回报，所以每 1 元利润的价格较低。比较资本结构不同的公司时，用 EV/EBITDA 这类与资本结构无关的倍数更合适。
      en: |-
        (a) A's net income is $(100 - 20) \times 0.75 = 60$, so its P/E is $\frac{800}{60} \approx 13.33$. B's net income is $(100 - 20 - 20) \times 0.75 = 45$, so its P/E is $\frac{400}{45} \approx 8.89$.
        (b) No. The two businesses and their enterprise values are identical; B's lower P/E comes only from leverage: B's shareholders bear more risk and require a higher return, so each dollar of earnings is priced lower. To compare companies with different capital structures, a multiple independent of capital structure, such as EV/EBITDA, is more suitable.
    rubric:
      zh-cn:
        - "(a) 约 13.33 和 8.89。"
        - "(b) 不是，用杠杆和风险说明。"
      en:
        - "(a) About 13.33 and 8.89."
        - "(b) No, explained by leverage and risk."

  - id: C4
    kind: check
    section: cape
    concepts: [cape, price-earnings-ratio, business-cycle]
    widget: { id: cycle-pe, set: { a: 0.5 } }
    expected: { lo: "13.33", hi: "40", clo: "18.43", chi: "21.87" }
    question:
      zh-cn: |-
        在 [[fig:4-1]] 中，把利润周期的幅度设为 0.5。(a) 读出 16 年中市盈率和 CAPE 的范围。市盈率在利润周期的哪个阶段最高？(b) 一位投资者只在周期性股票的市盈率很低时买入。这个规则有什么问题？
      en: |-
        In [[fig:4-1]], set the amplitude of the earnings cycle to 0.5. (a) Read off the ranges of P/E and CAPE over the 16 years. At which stage of the earnings cycle is the P/E highest? (b) An investor buys cyclical stocks only when their P/E is very low. What is wrong with this rule?
    answer:
      zh-cn: |-
        (a) 市盈率在约 13.33 到 40 之间，CAPE 只在约 18.43 到 21.87 之间。市盈率在利润最低（周期的谷底）时最高，在利润最高时最低，而股价并没有变。
        (b) 周期性股票的市盈率最低时，往往正是利润处于顶峰、即将下降的时候；按这个规则会在周期的高点买入，在谷底（市盈率很高）时却不敢买。对周期性公司，应该用正常化的利润（例如多年平均）计算市盈率。
      en: |-
        (a) P/E ranges from about 13.33 to 40, while CAPE stays between about 18.43 and 21.87. The P/E is highest when earnings are lowest (the trough of the cycle) and lowest when earnings peak, although the price does not change.
        (b) A cyclical stock's P/E is lowest exactly when earnings are at a peak and about to fall; the rule buys at the top of the cycle and avoids buying at the bottom, when the P/E is high. For cyclical companies, the P/E should use normalized earnings (for example, a multi-year average).
    rubric:
      zh-cn:
        - "(a) 约 13.33 到 40，CAPE 约 18.43 到 21.87；谷底时市盈率最高。"
        - "(b) 指出低市盈率出现在利润顶峰，应使用正常化的利润。"
      en:
        - "(a) About 13.33 to 40; CAPE about 18.43 to 21.87; P/E highest at the trough."
        - "(b) Points out that low P/Es come at earnings peaks and that normalized earnings should be used."

  # ---------- Exercises (练习题) ----------
  - id: Q1
    kind: exercise
    level: B
    star: true
    concepts: [price-earnings-ratio, sustainable-growth-rate, return-on-equity]
    expected: { p20: "16", p9: "11.11" }
    question:
      zh-cn: |-
        (a) 由 $\frac{P_0}{E_1} = \frac{1 - b}{r - g}$ 和 $g = b \times \text{ROE}$，把动态市盈率写成 $g$、ROE 和 $r$ 的函数。
        (b) 股权成本 9%，增长率 4%。ROE 为 20% 和 9% 时，合理的市盈率各是多少？为什么增长率相同，市盈率却不同？
      en: |-
        (a) From $\frac{P_0}{E_1} = \frac{1 - b}{r - g}$ and $g = b \times \text{ROE}$, write the forward P/E as a function of $g$, ROE and $r$.
        (b) The cost of equity is 9% and growth 4%. What is the justified P/E with an ROE of 20% and of 9%? Why do the P/Es differ when growth is the same?
    answer:
      zh-cn: |-
        (a) $b = \frac{g}{\text{ROE}}$，所以 $\frac{P_0}{E_1} = \frac{1 - g/\text{ROE}}{r - g}$。
        (b) ROE 20%：$\frac{1 - 4/20}{0.09 - 0.04} = 16$ 倍。ROE 9%：$\frac{1 - 4/9}{0.05} \approx 11.11$ 倍，正好等于 $\frac{1}{0.09}$，与不增长时相同。ROE 高的公司只需留存少量利润就能达到同样的增长，可以把更多利润派发给股东；ROE 等于股权成本时，增长不创造价值，市盈率就是 $\frac{1}{r}$。市盈率反映的是增长的质量，而不只是增长的速度。
      en: |-
        (a) $b = \frac{g}{\text{ROE}}$, so $\frac{P_0}{E_1} = \frac{1 - g/\text{ROE}}{r - g}$.
        (b) ROE 20%: $\frac{1 - 4/20}{0.09 - 0.04} = 16$ times. ROE 9%: $\frac{1 - 4/9}{0.05} \approx 11.11$ times, exactly $\frac{1}{0.09}$, the same as with no growth. A company with a high ROE needs to retain little profit to reach the same growth and can pay out more; when ROE equals the cost of equity, growth creates no value and the P/E is simply $\frac{1}{r}$. The P/E reflects the quality of growth, not just its speed.
    rubric:
      zh-cn:
        - "(a) $\\frac{1 - g/\\text{ROE}}{r - g}$。"
        - "(b) 16 和约 11.11 倍，并说明再投资回报的作用。"
      en:
        - "(a) $\\frac{1 - g/\\text{ROE}}{r - g}$."
        - "(b) 16 and about 11.11 times, explaining the role of the return on reinvestment."

  - id: Q2
    kind: exercise
    level: B
    concepts: [price-to-book, return-on-equity, cost-of-equity]
    expected: { h: "1.33", l: "0.67" }
    question:
      zh-cn: |-
        可以证明，在 Gordon 模型的假设下，$\frac{P_0}{B_0} = \frac{\text{ROE} - g}{r - g}$，$B_0$ 是每股账面股东权益。
        (a) 一家银行的股权成本为 10%，长期增长率为 4%。ROE 为 12% 和 8% 时，合理的市净率各是多少？
        (b) 为什么很多银行的股价长期低于每股账面价值？这是否说明它们被低估了？
      en: |-
        One can show that under the Gordon model's assumptions, $\frac{P_0}{B_0} = \frac{\text{ROE} - g}{r - g}$, where $B_0$ is book equity per share.
        (a) A bank has a cost of equity of 10% and long-run growth of 4%. What is the justified P/B with an ROE of 12% and of 8%?
        (b) Why do many banks trade below book value per share for long periods? Does this mean they are undervalued?
    answer:
      zh-cn: |-
        (a) ROE 12%：$\frac{12 - 4}{10 - 4} \approx 1.33$；ROE 8%：$\frac{8 - 4}{10 - 4} \approx 0.67$。
        (b) ROE 低于股权成本时，股东投入的每 1 元账面资本只赚取低于要求的回报，价值低于 1 元，合理的市净率小于 1。所以低于账面价值不一定是低估，可能只是 ROE 低于股权成本；也可能是市场怀疑账面价值高估了资产（例如贷款的损失还没有确认）。只有在 ROE 能够回升、或账面资产可靠时，低市净率才可能意味着低估。
      en: |-
        (a) ROE 12%: $\frac{12 - 4}{10 - 4} \approx 1.33$; ROE 8%: $\frac{8 - 4}{10 - 4} \approx 0.67$.
        (b) When ROE is below the cost of equity, each dollar of book capital earns less than shareholders require and is worth less than a dollar, so the justified P/B is below 1. So trading below book is not necessarily undervaluation; it may simply reflect an ROE below the cost of equity, or the market may suspect that book value overstates the assets (for example, loan losses not yet recognized). A low P/B may signal undervaluation only if ROE can recover or the book assets are reliable.
    rubric:
      zh-cn:
        - "(a) 约 1.33 和 0.67。"
        - "(b) 用 ROE 与股权成本的比较说明，并提到账面价值的可靠性。"
      en:
        - "(a) About 1.33 and 0.67."
        - "(b) Explains by comparing ROE with the cost of equity, mentioning the reliability of book value."

  - id: Q3
    kind: exercise
    level: B
    concepts: [price-to-sales, price-earnings-ratio]
    expected: { a: "10", b: "100" }
    question:
      zh-cn: |-
        A、B 两家公司的市销率都是 2。A 的净利润率为 20%，B 为 2%。
        (a) 两家公司的市盈率各是多少？
        (b) 市销率在什么情况下有用？用它比较公司时最需要注意什么？
      en: |-
        Companies A and B both have a P/S of 2. A's net margin is 20% and B's is 2%.
        (a) What is each company's P/E?
        (b) When is P/S useful? What matters most when using it to compare companies?
    answer:
      zh-cn: |-
        (a) 市盈率 = 市销率 ÷ 净利润率：A 为 $\frac{2}{0.20} = 10$，B 为 $\frac{2}{0.02} = 100$。
        (b) 公司目前亏损或利润很不稳定（例如初创公司、处于低谷的周期性公司）时，无法用市盈率，可以用市销率。但同样的市销率背后可能是完全不同的盈利能力：市场为 B 付同样的价格，必须相信它的利润率将来会大幅提高。比较时要看可比公司的长期利润率，以及目标公司达到这个利润率的可能性。
      en: |-
        (a) P/E = P/S ÷ net margin: A is $\frac{2}{0.20} = 10$ and B is $\frac{2}{0.02} = 100$.
        (b) When a company is losing money or its profit is very unstable (for example, a young company or a cyclical company in a downturn), the P/E cannot be used and P/S can. But the same P/S can hide very different profitability: to pay the same price for B, the market must believe its margin will rise a lot. In comparisons, look at comparables' long-run margins and at how likely the target is to reach them.
    rubric:
      zh-cn:
        - "(a) 10 和 100。"
        - "(b) 说明适用情况和利润率的作用。"
      en:
        - "(a) 10 and 100."
        - "(b) Explains when it applies and the role of margins."

  - id: Q4
    kind: exercise
    level: B
    concepts: [cape, real-interest-rate, earnings-quality]
    expected: { y36: "2.78", y15: "6.67" }
    question:
      zh-cn: |-
        一种粗略的看法认为，CAPE 的倒数（周期调整的盈利收益率）可以近似地看作股市的长期实际预期收益。
        (a) CAPE 为 36 和 15 时，这个近似给出的长期实际预期收益各是多少？
        (b) 给出两个理由，说明今天的 CAPE 与几十年前的 CAPE 可能不能直接比较；再说明为什么不能用 CAPE 决定什么时候全部卖出股票。
      en: |-
        A rough view holds that the inverse of CAPE (the cyclically adjusted earnings yield) approximates the stock market's long-run real expected return.
        (a) With a CAPE of 36 and of 15, what long-run real expected return does this approximation give?
        (b) Give two reasons why today's CAPE may not be directly comparable with CAPE decades ago; then explain why CAPE cannot be used to decide when to sell all stocks.
    answer:
      zh-cn: |-
        (a) $\frac{1}{36} \approx 2.78\%$，$\frac{1}{15} \approx 6.67\%$。
        (b) 例如：会计准则的变化（例如更多地确认资产减值）使过去 10 年的利润偏低、CAPE 偏高；公司更多地用回购代替股息，利润增长更快，过去的平均利润低估了现在的盈利能力；实际利率比过去长期偏低，投资者愿意接受较低的盈利收益率；指数中高利润率、高增长的公司比例增加。CAPE 高只说明长期平均收益可能较低，并不说明股市何时下跌：CAPE 可以在高位停留很多年，在此期间全部卖出会错过上涨；它对未来 1 到 2 年收益的预测能力很弱。
      en: |-
        (a) $\frac{1}{36} \approx 2.78\%$ and $\frac{1}{15} \approx 6.67\%$.
        (b) For example: changes in accounting rules (such as more write-downs being recognized) lower past 10-year earnings and raise CAPE; companies use more buybacks instead of dividends, so earnings grow faster and the past average understates current earning power; real interest rates have been lower than in the past for long periods, so investors accept a lower earnings yield; high-margin, high-growth companies make up more of the index. A high CAPE says only that long-run average returns may be low, not when the market will fall: CAPE can stay high for many years, and selling everything means missing the gains in the meantime; it has little power to predict returns over the next 1 to 2 years.
    rubric:
      zh-cn:
        - "(a) 约 2.78% 和 6.67%。"
        - "(b) 两个合理的理由，并说明不能用于择时。"
      en:
        - "(a) About 2.78% and 6.67%."
        - "(b) Two reasonable reasons, and why it cannot time the market."
