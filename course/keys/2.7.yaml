# Answer key for lesson 2.7. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[2.7#ppp]] (section), [[concept:real-exchange-rate]], [[check:Q3]], [[fig:4-1]].
# expected: values are recomputed by course/verify/2.7.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "2.7"

context:
  - zh-cn: |-
      学习者学过方差、标准差和相关系数（[[0.3]]）、Fisher 方程（[[1.3]]）、GDP 的支出法（[[2.1]]）、货币政策（[[2.5]]）和财政赤字（[[2.6]]）。讲义中汇率 $E$ 记为每单位外币值多少美元，$E$ 上升表示外币升值。百分数的计算用百分点表示。
    en: |-
      The learner has studied variance, standard deviation and correlation ([[0.3]]), the Fisher equation ([[1.3]]), the expenditure approach to GDP ([[2.1]]), monetary policy ([[2.5]]) and budget deficits ([[2.6]]). In the lesson the exchange rate $E$ is dollars per unit of foreign currency, so a rise in $E$ means the foreign currency appreciates. Percentage calculations are in percentage points.
  - concepts: [current-account]
    zh-cn: |-
      讲义：经常账户 ≈ 净出口加净投资收入和转移；经常账户赤字对应等额的资本净流入；$S - I = NX$；赤字不一定是坏事。美国 2025 年经常账户赤字约 1.12 万亿美元，占 GDP 的 3.6%；2025 年末净国际投资头寸约 −27.54 万亿美元（BEA，2026 年 3 月 25 日）。
    en: |-
      The lesson: the current account ≈ net exports plus net investment income and transfers; a current account deficit matches an equal net capital inflow; $S - I = NX$; a deficit is not necessarily bad. The US current account deficit in 2025 was about 1.12 trillion dollars, 3.6% of GDP; the net international investment position at the end of 2025 was about −27.54 trillion dollars (BEA, March 25, 2026).
  - concepts: [nominal-exchange-rate, real-exchange-rate, purchasing-power-parity]
    zh-cn: |-
      讲义：$\varepsilon = \frac{EP^*}{P}$，$\varepsilon$ 上升表示美国产品更有竞争力；购买力平价 $E = \frac{P}{P^*}$；相对购买力平价 $\frac{\Delta E}{E} \approx \pi - \pi^*$；短期不准，长期是参照。
    en: |-
      The lesson: $\varepsilon = \frac{EP^*}{P}$, and a rise in $\varepsilon$ makes US goods more competitive; PPP $E = \frac{P}{P^*}$; relative PPP $\frac{\Delta E}{E} \approx \pi - \pi^*$; inaccurate in the short run, a reference in the long run.
  - concepts: [covered-interest-parity, uncovered-interest-parity, currency-hedging]
    zh-cn: |-
      讲义：抛补利率平价 $\frac{F}{E} = \frac{1 + i}{1 + i^*}$；非抛补利率平价 $\frac{\Delta E^e}{E} \approx i - i^*$，短期中常不成立；套息交易平均赚钱但有崩盘风险。本币收益 $1 + R = (1 + R^*)(1 + x)$；对冲成本约为利差；是否对冲取决于汇率波动及其与资产收益的相关性；外国债券一般要对冲。[[fig:4-1]]：美元利率和外币利率滑块都是 0–8，步长 0.5，默认 4 和 2；读数显示对冲后的收益和两者相等时外币的变化。
    en: |-
      The lesson: covered interest parity $\frac{F}{E} = \frac{1 + i}{1 + i^*}$; uncovered interest parity $\frac{\Delta E^e}{E} \approx i - i^*$, which often fails in the short run; carry trades earn on average but can crash. Return in home currency $1 + R = (1 + R^*)(1 + x)$; the hedging cost is about the interest differential; whether to hedge depends on currency volatility and its correlation with asset returns; foreign bonds are usually hedged. [[fig:4-1]]: dollar and foreign rate sliders from 0 to 8 in steps of 0.5, defaults 4 and 2; the readout shows the hedged return and the currency change at which the two are equal.

common_errors:
  - questions: [C1, Q1]
    zh-cn: |-
      以为经常账户赤字只由贸易政策决定，或者一定说明经济不好。它等于储蓄与投资之差，也可能来自旺盛的投资。
    en: |-
      Thinking that a current account deficit is set only by trade policy or must mean the economy is doing badly. It equals saving minus investment and can also come from strong investment.
  - questions: [C2, Q2, Q4]
    zh-cn: |-
      只看名义汇率，忘记两国的通胀；或者把汇率的方向弄反（$E$ 是每单位外币的美元价格）。
    en: |-
      Looking only at the nominal exchange rate and forgetting the two countries' inflation; or getting the direction of the exchange rate backwards ($E$ is the dollar price of one unit of foreign currency).
  - questions: [C3, Q3, Q4]
    zh-cn: |-
      以为外国利率更高，对冲后就能赚更多。由抛补利率平价，对冲后的收益等于本国利率；更高的利率只有在承担汇率风险时才可能赚到。
    en: |-
      Thinking that a higher foreign interest rate means earning more after hedging. By covered interest parity, the hedged return equals the home interest rate; the higher rate can be earned only by bearing currency risk.
  - questions: [C4, Q5]
    zh-cn: |-
      把本币收益算成两个收益率直接相加，忽略交叉项；或者以为对冲总能降低风险，忽略相关性。
    en: |-
      Adding the two returns directly and ignoring the cross term; or thinking that hedging always lowers risk, ignoring correlation.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: bop
    concepts: [current-account]
    expected: { ca: "-3.6" }
    question:
      zh-cn: |-
        某国的国民储蓄为 GDP 的 18%，投资为 GDP 的 21.6%（忽略净投资收入和转移）。(a) 经常账户差额占 GDP 的百分之几？外国资本净流入呢？(b) 如果这个赤字是因为企业投资增加造成的，是否一定是坏事？
      en: |-
        A country's national saving is 18% of GDP and its investment is 21.6% of GDP (ignore net investment income and transfers). (a) What is the current account balance as a percentage of GDP? What is the net inflow of foreign capital? (b) If the deficit was caused by higher business investment, is it necessarily bad?
    answer:
      zh-cn: |-
        (a) $S - I = 18\% - 21.6\% = -3.6\%$，经常账户赤字为 GDP 的 3.6%；外国资本净流入也是 GDP 的 3.6%。
        (b) 不一定。借外国的钱投资，如果投资的收益高于借款的成本，将来的产出足以偿还，就是合理的；如果赤字来自消费或政府赤字，未来要用更多的产出偿还而没有相应的资产，更值得担心。
      en: |-
        (a) $S - I = 18\% - 21.6\% = -3.6\%$: a current account deficit of 3.6% of GDP, and a net inflow of foreign capital of 3.6% of GDP.
        (b) Not necessarily. Borrowing from abroad to invest is reasonable if the investment earns more than the cost of borrowing, so that future output can repay it; a deficit that comes from consumption or a government deficit is more worrying, because more output must be paid back later with no matching assets.
    rubric:
      zh-cn:
        - "(a) −3.6%（写作 - 或 − 均可），资本净流入 3.6%。"
        - "(b) 比较投资收益和借款成本。"
      en:
        - "(a) −3.6% (written with - or −); net capital inflow 3.6%."
        - "(b) Compares the return on investment with the cost of borrowing."

  - id: C2
    kind: check
    section: ppp
    concepts: [purchasing-power-parity, real-exchange-rate]
    expected: { e10: "1.2127" }
    question:
      zh-cn: |-
        现在 1 欧元 = 1.10 美元。假设今后 10 年美国每年通胀 3%，欧元区每年 2%。(a) 按相对购买力平价（精确形式 $\frac{E_{t+1}}{E_t} = \frac{1 + \pi}{1 + \pi^*}$），10 年后的汇率是多少？哪种货币贬值？(b) 为什么不能用这个方法预测明年的汇率？
      en: |-
        Now 1 euro = 1.10 dollars. Suppose that over the next 10 years US inflation is 3% a year and euro-area inflation 2% a year. (a) By relative purchasing power parity (exact form $\frac{E_{t+1}}{E_t} = \frac{1 + \pi}{1 + \pi^*}$), what is the exchange rate after 10 years? Which currency depreciates? (b) Why can this method not be used to forecast next year's exchange rate?
    answer:
      zh-cn: |-
        (a) $E_{10} = 1.10 \times \left(\frac{1.03}{1.02}\right)^{10} \approx 1.2127$ 美元。$E$ 上升，欧元升值，美元贬值，每年约 1%，正好抵消美国较高的通胀，实际汇率不变。
        (b) 短期中汇率主要受资本流动、利率和预期影响，可以多年偏离购买力平价；通胀的差别每年只有 1 个百分点左右，远小于汇率每年的波动。
      en: |-
        (a) $E_{10} = 1.10 \times \left(\frac{1.03}{1.02}\right)^{10} \approx 1.2127$ dollars. $E$ rises: the euro appreciates and the dollar depreciates, by about 1% a year, which exactly offsets the higher US inflation and leaves the real exchange rate unchanged.
        (b) In the short run exchange rates are driven mainly by capital flows, interest rates and expectations, and can stay away from purchasing power parity for years; the inflation difference is only about 1 percentage point a year, far smaller than yearly exchange-rate swings.
    rubric:
      zh-cn:
        - "(a) 约 1.2127 美元，美元贬值。"
        - "(b) 说明短期汇率的主要影响因素。"
      en:
        - "(a) About 1.2127 dollars; the dollar depreciates."
        - "(b) Explains what drives exchange rates in the short run."

  - id: C3
    kind: check
    section: interest-parity
    concepts: [covered-interest-parity, uncovered-interest-parity]
    widget: { id: fx-return, set: { i: 4, istar: 2 } }
    expected: { f: "1.1216", be: "1.96" }
    question:
      zh-cn: |-
        美元 1 年期利率 4%，欧元 2%，即期汇率 1 欧元 = 1.10 美元。(a) 由抛补利率平价，1 年期远期汇率是多少？美国投资者买欧元国债并对冲，收益是多少？(b) 在 [[fig:4-1]] 中读出：不对冲时，欧元的变化要高于多少才比对冲好？按非抛补利率平价，市场预期欧元怎样变化？
      en: |-
        The 1-year dollar rate is 4%, the euro rate 2%, and the spot rate 1 euro = 1.10 dollars. (a) By covered interest parity, what is the 1-year forward rate? What does a US investor earn on euro government bonds when hedged? (b) In [[fig:4-1]], read off how much the euro must change for not hedging to beat hedging. Under uncovered interest parity, what change in the euro does the market expect?
    answer:
      zh-cn: |-
        (a) $F = 1.10 \times \frac{1.04}{1.02} \approx 1.1216$ 美元。对冲时按远期汇率换回，收益为 4%，与美国国债相同。
        (b) 欧元的变化要高于约 1.96%（$\frac{1.04}{1.02} - 1$）。按非抛补利率平价，市场正是预期欧元升值约 1.96%，使两种投资的预期收益相等；欧元利率低，是由预期的升值补偿的。
      en: |-
        (a) $F = 1.10 \times \frac{1.04}{1.02} \approx 1.1216$ dollars. Hedged, the euros are converted back at the forward rate and the return is 4%, the same as on US Treasuries.
        (b) The euro must change by more than about 1.96% ($\frac{1.04}{1.02} - 1$). Under uncovered interest parity the market expects exactly this appreciation of about 1.96%, which makes the expected returns equal; the lower euro rate is offset by the expected appreciation.
    rubric:
      zh-cn:
        - "(a) 约 1.1216 美元，对冲收益 4%。"
        - "(b) 约 1.96%，说明预期升值补偿利差。"
      en:
        - "(a) About 1.1216 dollars; hedged return 4%."
        - "(b) About 1.96%, explaining that expected appreciation offsets the rate gap."

  - id: C4
    kind: check
    section: fx-risk
    concepts: [currency-hedging]
    expected: { r: "1.2" }
    question:
      zh-cn: |-
        一位美国投资者持有日本股票。一年中，以日元计的收益为 10%，日元对美元贬值 8%。以美元计的收益是多少？有人直接算 $10\% - 8\% = 2\%$，差别来自哪里？
      en: |-
        A US investor holds Japanese stocks. Over a year the return in yen is 10% and the yen falls 8% against the dollar. What is the return in dollars? Someone simply computes $10\% - 8\% = 2\%$; where does the difference come from?
    answer:
      zh-cn: |-
        $1.10 \times 0.92 - 1 = 1.2\%$。直接相减忽略了交叉项 $10\% \times (-8\%) = -0.8\%$：日元贬值不只作用于本金，也作用于 10% 的收益。
      en: |-
        $1.10 \times 0.92 - 1 = 1.2\%$. Simple subtraction ignores the cross term $10\% \times (-8\%) = -0.8\%$: the fall of the yen applies not only to the principal but also to the 10% gain.
    rubric:
      zh-cn:
        - "1.2%。"
        - "指出交叉项。"
      en:
        - "1.2%."
        - "Points to the cross term."

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: B
    concepts: [current-account]
    expected: { ca2: "-5" }
    question:
      zh-cn: |-
        某国 GDP 为 100，国民储蓄 20，投资 23（忽略净投资收入和转移），经常账户赤字为 3。
        (a) 新技术使企业投资增加到 25，储蓄不变。经常账户差额变为多少？外国人用什么换来了这些产品？
        (b) 政府宣布对进口加征关税。如果储蓄和投资都不变，长期中经常账户差额会变吗？为什么？
      en: |-
        A country's GDP is 100, national saving 20 and investment 23 (ignore net investment income and transfers), so the current account deficit is 3.
        (a) A new technology raises business investment to 25, with saving unchanged. What is the current account balance now? What do foreigners get in exchange for the extra goods?
        (b) The government announces tariffs on imports. If saving and investment do not change, does the current account balance change in the long run? Why?
    answer:
      zh-cn: |-
        (a) $20 - 25 = -5$。外国人得到本国的资产：股票、债券、工厂的所有权，或者对本国的贷款。
        (b) 不会：$S - I = NX$ 是恒等式，只要储蓄和投资不变，经常账户差额就不变。关税可能减少进口，但也会通过汇率（本币升值）或其他渠道减少出口，或者改变储蓄和投资；只靠关税而不改变储蓄和投资，不能改变经常账户的总差额。
      en: |-
        (a) $20 - 25 = -5$. Foreigners get domestic assets: shares, bonds, ownership of factories, or loans to the country.
        (b) No: $S - I = NX$ is an identity, so as long as saving and investment are unchanged, the current account balance is unchanged. Tariffs may reduce imports, but they also reduce exports through the exchange rate (the home currency appreciates) or other channels, or they change saving and investment; tariffs alone, without a change in saving and investment, cannot change the overall current account balance.
    rubric:
      zh-cn:
        - "(a) −5（写作 -5 或 −5 均可），外国人得到本国资产。"
        - "(b) 用恒等式说明不变，并指出抵消的渠道。"
      en:
        - "(a) −5 (written -5 or −5); foreigners get domestic assets."
        - "(b) Uses the identity to explain why it does not change, and names an offsetting channel."

  - id: Q2
    kind: exercise
    level: B
    star: true
    concepts: [real-exchange-rate, nominal-exchange-rate]
    expected: { de: "4.81" }
    question:
      zh-cn: |-
        一年中，欧元对美元升值 10%（$E$ 上升 10%），美国物价上涨 6%，欧元区物价上涨 1%。
        (a) 实际汇率 $\varepsilon = \frac{EP^*}{P}$ 变化了百分之几？
        (b) 美国产品相对欧洲产品变得更有竞争力了吗？为什么名义汇率的变化夸大了这种变化？
      en: |-
        Over a year, the euro rises 10% against the dollar ($E$ up 10%), US prices rise 6% and euro area prices 1%.
        (a) By what percentage does the real exchange rate $\varepsilon = \frac{EP^*}{P}$ change?
        (b) Have US goods become more competitive relative to European goods? Why does the change in the nominal rate overstate this?
    answer:
      zh-cn: |-
        (a) $\frac{1.10 \times 1.01}{1.06} - 1 \approx 4.81\%$。
        (b) 实际汇率上升，美国产品相对变便宜，竞争力提高，但只提高约 4.81%，而不是 10%：美元贬值的一部分被美国较高的通胀抵消了。
      en: |-
        (a) $\frac{1.10 \times 1.01}{1.06} - 1 \approx 4.81\%$.
        (b) The real exchange rate rises, so US goods become relatively cheaper and more competitive, but only by about 4.81%, not 10%: part of the dollar's depreciation is offset by higher US inflation.
    rubric:
      zh-cn:
        - "(a) 约 4.81%。"
        - "(b) 说明更有竞争力，以及通胀差别的抵消作用。"
      en:
        - "(a) About 4.81%."
        - "(b) Explains greater competitiveness and the offset from the inflation gap."

  - id: Q3
    kind: exercise
    level: C
    star: true
    concepts: [uncovered-interest-parity, covered-interest-parity]
    expected: { be: "3.37" }
    question:
      zh-cn: |-
        一位投资者借入日元（年利率 0.5%），换成美元投资于 1 年期美国国债（年利率 4%），不对冲，一年后换回日元还款。
        (a) 美元对日元最多可以贬值多少，这笔交易才不亏？
        (b) 如果非抛补利率平价成立，这种交易的预期收益是多少？为什么现实中它平均能赚钱，却被比作“在压路机前捡硬币”？
      en: |-
        An investor borrows yen (at 0.5% a year), converts them to dollars and buys 1-year US Treasuries (at 4% a year), unhedged, converting back to yen after a year to repay the loan.
        (a) By how much at most can the dollar fall against the yen for the trade not to lose money?
        (b) If uncovered interest parity holds, what is the expected return of this trade? Why does it make money on average in practice, yet is compared to "picking up coins in front of a steamroller"?
    answer:
      zh-cn: |-
        (a) 设美元对日元的变化为 $x$，不亏要求 $1.04(1 + x) \ge 1.005$，$x \ge \frac{1.005}{1.04} - 1 \approx -3.37\%$：美元最多可贬值约 3.37%。
        (b) 如果非抛补利率平价成立，市场预期美元贬值约等于利差，预期收益约为 0。现实中高利率货币平均没有贬值那么多，交易在大多数年份赚取利差；但在危机中，投资者同时平仓，高利率货币突然大幅贬值（例如贬值 10% 就亏掉借款的约 6.9%），一次亏损就可能抵消多年的收益，而且这种亏损恰好发生在其他资产也下跌的时候。
      en: |-
        (a) Let $x$ be the change of the dollar against the yen. Breaking even requires $1.04(1 + x) \ge 1.005$, so $x \ge \frac{1.005}{1.04} - 1 \approx -3.37\%$: the dollar can fall by at most about 3.37%.
        (b) If uncovered interest parity holds, the market expects the dollar to fall by about the rate gap, so the expected return is about 0. In practice high-rate currencies have on average fallen less than that, so the trade earns the rate gap in most years; but in a crisis investors unwind together and the high-rate currency suddenly falls sharply (a 10% fall loses about 6.9% of the loan), so one loss can wipe out years of gains, and it comes exactly when other assets are falling too.
    rubric:
      zh-cn:
        - "(a) 约 3.37%。"
        - "(b) 预期收益约 0；说明平时赚利差、危机中集中亏损。"
      en:
        - "(a) About 3.37%."
        - "(b) Expected return about 0; explains small gains in normal times and concentrated losses in crises."

  - id: Q4
    kind: exercise
    level: B
    concepts: [purchasing-power-parity, covered-interest-parity, fisher-equation]
    expected: { dep: "16.5" }
    question:
      zh-cn: |-
        某国每年通胀 20%，美国 3%。该国 1 年期国债利率为 24%。
        (a) 按相对购买力平价（精确形式），该国货币每年对美元约贬值多少？
        (b) 一家理财产品宣传“年收益 24%，远高于美国国债”。结合 Fisher 方程和抛补利率平价，说明为什么这不是“免费的午餐”。
      en: |-
        A country has inflation of 20% a year, the US 3%. The country's 1-year government bond rate is 24%.
        (a) By relative PPP (in exact form), by about how much does the country's currency fall against the dollar each year?
        (b) An investment product advertises "a 24% yearly return, far above US Treasuries". Using the Fisher equation and covered interest parity, explain why this is not a "free lunch".
    answer:
      zh-cn: |-
        (a) 外币的美元价格每年变为原来的 $\frac{1.03}{1.20}$ 倍，即该国货币对美元贬值约 $1 - \frac{1.03}{1.20} \approx 14.2\%$；换一种说法，美元对该国货币升值 $\frac{1.20}{1.03} - 1 \approx 16.5\%$。
        (b) 24% 的名义利率主要补偿 20% 的通胀，实际利率只有约 $\frac{1.24}{1.20} - 1 \approx 3.3\%$。换成美元后，货币的贬值会吃掉大部分利差；如果对冲，由抛补利率平价，对冲后的收益等于美元利率。高利率只是高通胀的反映，要拿到它就要承担汇率大幅贬值的风险。
      en: |-
        (a) The dollar price of the foreign currency is multiplied by $\frac{1.03}{1.20}$ each year, so the currency falls about $1 - \frac{1.03}{1.20} \approx 14.2\%$ against the dollar; put the other way, the dollar rises $\frac{1.20}{1.03} - 1 \approx 16.5\%$ against it.
        (b) The 24% nominal rate mainly compensates for 20% inflation; the real rate is only about $\frac{1.24}{1.20} - 1 \approx 3.3\%$. In dollars, the currency's depreciation eats up most of the interest differential; if hedged, covered interest parity makes the hedged return equal to the dollar rate. The high rate only reflects high inflation, and earning it means bearing the risk of a large depreciation.
    rubric:
      zh-cn:
        - "(a) 约 14.2%（或美元升值约 16.5%），方向正确。"
        - "(b) 用 Fisher 方程和抛补利率平价说明。"
      en:
        - "(a) About 14.2% (or the dollar up about 16.5%), with the right direction."
        - "(b) Uses the Fisher equation and covered interest parity."

  - id: Q5
    kind: exercise
    level: B
    concepts: [currency-hedging, standard-deviation, correlation]
    expected: { sd0: "17.89", sdneg: "15.59", sdb: "8.54" }
    question:
      zh-cn: |-
        把以本币计的收益近似为 $R \approx R^* + x$，用 [[0.3]] 的 $\sigma^2 = \sigma_1^2 + \sigma_2^2 + 2\rho\sigma_1\sigma_2$；假设对冲完全消除汇率变化。
        (a) 欧洲股票以欧元计的收益标准差为 16%，欧元对美元变化的标准差为 8%。两者的相关系数为 0 和 −0.3 时，不对冲的标准差各是多少？与对冲相比如何？
        (b) 欧洲债券以欧元计的收益标准差为 3%，与汇率的相关系数为 0。不对冲时的标准差是多少？为什么外国债券一般要对冲，而外国股票不一定？
      en: |-
        Approximate the return in home currency as $R \approx R^* + x$ and use $\sigma^2 = \sigma_1^2 + \sigma_2^2 + 2\rho\sigma_1\sigma_2$ from [[0.3]]; assume hedging removes exchange-rate changes completely.
        (a) European stocks have a return standard deviation of 16% in euros, and the euro's change against the dollar has a standard deviation of 8%. With correlations of 0 and −0.3, what is the unhedged standard deviation? How does it compare with hedging?
        (b) European bonds have a return standard deviation of 3% in euros, with a correlation of 0 with the exchange rate. What is the unhedged standard deviation? Why are foreign bonds usually hedged while foreign stocks are not necessarily?
    answer:
      zh-cn: |-
        (a) 相关系数为 0 时 $\sqrt{16^2 + 8^2} \approx 17.89\%$，只比对冲后的 16% 高不到 2 个百分点；为 −0.3 时 $\sqrt{16^2 + 8^2 + 2 \times (-0.3) \times 16 \times 8} = \sqrt{243.2} \approx 15.59\%$，比对冲后还低：负相关时，汇率起到了分散风险的作用。
        (b) $\sqrt{3^2 + 8^2} \approx 8.54\%$，几乎是债券本身风险的 3 倍。对债券来说，汇率波动远大于资产本身的波动，不对冲就把一个低风险资产变成了高风险资产，所以一般要对冲；对股票来说，汇率只增加少量风险，甚至可能降低风险，是否对冲要看相关性和对冲成本。
      en: |-
        (a) With correlation 0, $\sqrt{16^2 + 8^2} \approx 17.89\%$, less than 2 percentage points above the hedged 16%; with −0.3, $\sqrt{16^2 + 8^2 + 2 \times (-0.3) \times 16 \times 8} = \sqrt{243.2} \approx 15.59\%$, lower than hedged: with negative correlation the exchange rate diversifies risk.
        (b) $\sqrt{3^2 + 8^2} \approx 8.54\%$, almost 3 times the bond's own risk. For bonds, exchange-rate swings are much larger than the asset's own swings, so not hedging turns a low-risk asset into a high-risk one, and bonds are usually hedged; for stocks, the exchange rate adds little risk or may even reduce it, so whether to hedge depends on the correlation and the cost of hedging.
    rubric:
      zh-cn:
        - "(a) 约 17.89% 和 15.59%，与 16% 比较。"
        - "(b) 约 8.54%，说明债券和股票的不同。"
      en:
        - "(a) About 17.89% and 15.59%, compared with 16%."
        - "(b) About 8.54%, explaining the difference between bonds and stocks."
