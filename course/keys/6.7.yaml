# Answer key for lesson 6.7. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[5.2#strategies]] (section), [[concept:beta]], [[check:Q3]], [[fig:3-1]].
# expected: values are recomputed by course/verify/6.7.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.
# Check questions are answered on the page: `correct` is true / false, or the letter of one of `choices`.
# A wrong answer shows the `why` of the chosen option (or the `hint` of a true / false question), never the
# right answer; `answer` is the full explanation for reference. They have no expected and no rubric.

lesson: "6.7"

context:
  - zh-cn: |-
      学习者学过组合方差（[[0.3]]、[[4.2]]）、资本配置与风险厌恶（[[4.3]]）、市场组合（[[4.3]]、[[4.4]]）、市场效率与行为金融（[[4.7]]、[[4.8]]）、资本市场假设与 CAPE（[[4.11]]）、生命周期配置与目标日期基金（[[4.12]]）、汇率风险与对冲（[[2.7]]）、账户与税务（[[6.5]]）、家庭资产负债表（[[6.6]]）。百分数用百分点表示；方差用 %²。
    en: |-
      The learner has studied portfolio variance ([[0.3]], [[4.2]]), capital allocation and risk aversion ([[4.3]]), the market portfolio ([[4.3]], [[4.4]]), market efficiency and behavioral finance ([[4.7]], [[4.8]]), capital market assumptions and CAPE ([[4.11]]), lifecycle allocation and target-date funds ([[4.12]]), exchange-rate risk and hedging ([[2.7]]), accounts and taxes ([[6.5]]) and the household balance sheet ([[6.6]]). Percentages in percentage points; variance in %².
  - concepts: [strategic-asset-allocation, tactical-asset-allocation]
    zh-cn: |-
      讲义：战略配置是长期目标比例，来自目标与期限、风险承受能力（财务）与意愿（心理）中较低者、以及资本市场假设，写进 IPS，不随短期变化而改变；战术配置是基于短期判断的暂时偏离，实际上是择时，面对市场效率的证据和成本。
    en: |-
      The lesson: strategic allocation is the long-term target mix, set by goals and horizon, the lower of risk capacity (financial) and tolerance (psychological), and capital market assumptions; it goes into the IPS and does not change with short-term moves. Tactical allocation is a temporary departure on a short-term view, in effect market timing, facing the evidence on efficiency and costs.
  - concepts: [strategic-asset-allocation, target-date-fund, human-capital]
    zh-cn: |-
      讲义：下滑路径例如离退休 40 年时股票约 90%，退休时 40%–50%；to 与 through；收入稳定、有养老金的人可多持股票，收入与股市高度相关的人应少持；退休前后的大跌影响最大（[[6.9]]）。
    en: |-
      The lesson: glide paths, for example about 90% stocks 40 years before retirement and 40%–50% at retirement; "to" versus "through"; people with stable incomes or pensions can hold more stocks, people whose income moves with the market fewer; falls around retirement matter most ([[6.9]]).
  - concepts: [home-bias, currency-hedging]
    zh-cn: |-
      讲义：美国股票约占全球股市 60% 以上（MSCI ACWI，2025 年）；本土偏好；理论上的市场组合是全球的；2000 年后各国股市相关性较高，短期降波动有限，好处更多在长期，例：日经 225 1989 年 12 月的高点到 2024 年 2 月才被超过；股票的汇率风险通常不对冲，债券通常对冲；一些目标日期基金约 40% 的股票在美国以外。
    en: |-
      The lesson: US stocks are more than 60% of the global market (MSCI ACWI, 2025); home bias; the theoretical market portfolio is global; correlations between markets have been fairly high since 2000, so short-term volatility reduction is limited and the benefit is mostly long-run, e.g. the Nikkei 225's December 1989 peak was not surpassed until February 2024; currency risk in stocks is usually unhedged, in bonds usually hedged; some target-date funds hold about 40% of stocks outside the US.
  - concepts: [rebalancing]
    zh-cn: |-
      讲义：再平衡卖出比例过高、买入过低的资产；日历规则与区间规则（如 ±5 个百分点）；成本：交易成本、应税账户的资本利得税；减少成本的方法：用新存款、股息和利息买入低配资产，在税务递延账户中调整，只在偏离大时交易。[[fig:4-1]]：一条固定的模拟路径（股票均值 7%、波动率 17%，债券 4%、6%，独立），40 年；从不再平衡时 40 年后股票约 80%、最高约 90%；滑块区间 ±1 到 ±10 个百分点（步长 1，默认 5）；再平衡次数：±1 时 36 次，±5 时 10 次，±10 时 4 次。讲义没有讨论再平衡是否提高收益（留给 [[check:Q1]]）。
    en: |-
      The lesson: rebalancing sells overweight and buys underweight assets; calendar and band rules (such as ±5 percentage points); costs: trading and capital gains tax in taxable accounts; ways to reduce them: use contributions, dividends and interest to buy underweights, adjust in tax-deferred accounts, trade only on large drifts. [[fig:4-1]]: one fixed simulated path (stocks mean 7%, volatility 17%; bonds 4%, 6%; independent), 40 years; never rebalanced, stocks end at about 80%, peaking at about 90%; slider band ±1 to ±10 percentage points (steps of 1, default 5); rebalances: 36 at ±1, 10 at ±5, 4 at ±10. The lesson does not discuss whether rebalancing raises returns (left to [[check:Q1]]).

common_errors:
  - questions: [Q1]
    zh-cn: |-
      认为再平衡是“卖出赢家、买入输家”，违背动量，所以不应该做；或者认为再平衡一定提高收益。忽略再平衡的主要目的是控制风险，以及它在震荡市中可能获益、在单边市中可能少赚。
    en: |-
      Thinking rebalancing "sells winners and buys losers" against momentum and so should be avoided; or thinking it always raises returns. Ignoring that its main purpose is controlling risk, and that it may gain in choppy markets and lose out in trending ones.
  - questions: [Q2]
    zh-cn: |-
      因为各国股市相关性高、加入国际股票降低的波动很小，就认为国际分散没有用；忽略单一国家长期低迷的风险和全球市场组合的意义。
    en: |-
      Concluding that international diversification is useless because markets are highly correlated and adding foreign stocks cuts volatility little; ignoring the risk of a long single-country slump and the meaning of the global market portfolio.
  - questions: [Q3]
    zh-cn: |-
      根据估值指标做全进全出的择时，大幅改变股票比例；忽略估值对短期收益的预测力很弱，以及即使预期收益降低，按预期收益和风险计算的配置变化也应是温和的。
    en: |-
      Timing the market all-in or all-out on a valuation measure, changing the stock share drastically; ignoring that valuations predict short-term returns poorly, and that even with lower expected returns, the allocation change implied by expected return and risk should be modest.
  - questions: [Q4]
    zh-cn: |-
      认为每次都要在任何账户中严格回到目标比例；忽略在应税账户中卖出增值资产的税务成本，以及可以用新资金或在递延账户中再平衡。
    en: |-
      Thinking the portfolio must be returned exactly to target each time in whatever account; ignoring the tax cost of selling appreciated assets in taxable accounts, and that new money or tax-deferred accounts can do the rebalancing.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: strategic-tactical
    concepts: [strategic-asset-allocation]
    question:
      zh-cn: |-
        一对年轻夫妻说自己能接受组合下跌 50%，但这笔钱 3 年后要用来付房子的首付，届时必须有足够的金额。决定这笔钱的配置时，主要的依据应该是：
      en: |-
        A young couple says they could accept a 50% fall in their portfolio, but this money is needed in 3 years for a house down payment, and the amount must be there then. In setting the allocation of this money, the main basis should be:
    choices:
      - zh-cn: 风险承受能力：期限短、金额必须到位，财务上承受不起大的损失，应以低风险资产为主
        en: 'Risk capacity: with a short horizon and an amount that must be there, they cannot afford a large loss financially, so it should be mainly low-risk assets'
      - zh-cn: 风险承受意愿：他们能接受 50% 的下跌，可以主要投资股票
        en: 'Risk tolerance: they can accept a 50% fall, so it can be mainly stocks'
        why:
          zh-cn: 意愿和能力不一致时，应该取哪一个？如果 3 年后股票下跌 30%，首付怎么办？
          en: When tolerance and capacity differ, which governs? If stocks are down 30% in 3 years, what happens to the down payment?
      - zh-cn: 资本市场假设：股票的长期预期收益更高，所以应多配股票
        en: 'Capital market assumptions: stocks have higher long-run expected returns, so hold more stocks'
        why:
          zh-cn: 长期预期收益对 3 年后必须到位的钱有多重要？这段时间股票收益的波动有多大？
          en: How much does long-run expected return matter for money that must be there in 3 years? How much do stock returns swing over that span?
    correct: A
    answer:
      zh-cn: |-
        (A)。战略配置取风险承受能力和意愿中较低的一个。他们心理上能接受大的波动，但这笔钱期限短、用途确定，3 年中股票下跌 30% 以上并不罕见，那时他们无法按计划买房。所以这笔钱的风险承受能力很低，应主要放在短期债券或存款中；他们较高的风险承受意愿可以体现在长期的退休资金上。
      en: |-
        (A). The strategic allocation follows the lower of risk capacity and tolerance. They can bear large swings psychologically, but this money has a short horizon and a fixed use; a fall of 30% or more within 3 years is not rare, and then they could not buy as planned. So this money's risk capacity is low, and it belongs mainly in short-term bonds or deposits; their high tolerance can show in their long-term retirement savings.

  - id: C2
    kind: check
    section: glide-path
    concepts: [human-capital, strategic-asset-allocation]
    question:
      zh-cn: |-
        两位 40 岁的投资者金融资产相同、风险厌恶程度相同：一位是有终身教职和养老金的大学教授，另一位是收入主要来自年终奖和公司股票的投资银行家。按生命周期配置的思路，谁的金融资产更适合持有较高的股票比例？
      en: |-
        Two 40-year-old investors have the same financial assets and the same risk aversion: one is a tenured professor with a pension, the other an investment banker whose income comes mainly from year-end bonuses and company stock. Following lifecycle allocation, whose financial assets suit a higher stock share?
    choices:
      - zh-cn: 教授，因为他的人力资本稳定、像债券，金融资产可以多承担股票风险
        en: The professor, because his human capital is stable and bond-like, so his financial assets can bear more stock risk
      - zh-cn: 投资银行家，因为他了解金融市场
        en: The banker, because he understands financial markets
        why:
          zh-cn: 了解市场能降低他的风险吗？他的收入在股市下跌时会怎样？
          en: Does understanding markets lower his risk? What happens to his income when stocks fall?
      - zh-cn: 两人应该相同，因为年龄、财富和风险厌恶都相同
        en: The same, since their age, wealth and risk aversion are the same
        why:
          zh-cn: 总财富包括人力资本。两人的人力资本风险一样吗？
          en: Total wealth includes human capital. Is the risk of their human capital the same?
    correct: A
    answer:
      zh-cn: |-
        (A)。总财富的风险由人力资本和金融资产共同决定（[[4.12]]）。教授的收入几乎不受股市影响，人力资本像一大笔债券，金融资产可以多持股票；投资银行家的奖金、工作和公司股票都与市场高度相关，人力资本像股票，金融资产应该更保守，并减少与雇主和金融行业相关的持仓。
      en: |-
        (A). The risk of total wealth depends on both human capital and financial assets ([[4.12]]). The professor's income hardly moves with the market, so his human capital is like a large bond holding and his financial assets can hold more stocks; the banker's bonus, job and company stock all move closely with the market, so his human capital is stock-like and his financial assets should be more conservative, with fewer holdings tied to his employer and the financial industry.

  - id: C3
    kind: check
    section: international
    concepts: [home-bias, market-portfolio]
    question:
      zh-cn: |-
        一位美国投资者只持有标普 500 指数基金。因为这些大公司的业务遍布全球，很大一部分收入来自海外，所以他已经实现了国际分散，不需要再持有美国以外的股票。
      en: |-
        A US investor holds only an S&P 500 index fund. Since these large companies do business worldwide and earn much of their revenue abroad, he is already internationally diversified and needs no stocks outside the US.
    correct: false
    hint:
      zh-cn: 收入来自海外，和股票收益来自哪个市场，是一回事吗？如果美国股市的整体估值下降，这些公司的股价会怎样？
      en: Is earning revenue abroad the same as returns coming from a market? If valuations across the US market fell, what would happen to these companies' share prices?
    answer:
      zh-cn: |-
        错。海外收入确实提供了一些对外国经济的暴露，但这些股票都在美国上市，价格由美国市场的估值、利率和投资者情绪共同决定，彼此高度相关，而且只覆盖美国的大公司，没有包括外国公司和小公司。一个国家的股市可能因为估值过高或本国问题而长期低迷，例如日本 1989 年之后。持有全球市场才能分散这种单一国家的风险。
      en: |-
        False. Foreign revenue does give some exposure to foreign economies, but these stocks are all listed in the US, and their prices are driven together by US market valuations, interest rates and investor sentiment; they are highly correlated and cover only large US companies, not foreign or small companies. A country's market can slump for a long time because of high valuations or domestic problems, as Japan's did after 1989. Holding the global market diversifies that single-country risk.

  - id: C4
    kind: check
    section: rebalancing
    concepts: [rebalancing]
    widget: { id: rebalance, set: { band: 1 } }
    question:
      zh-cn: |-
        在 [[fig:4-1]] 中，把再平衡区间从 ±5 缩小到 ±1 个百分点。下面哪种说法正确？
      en: |-
        In [[fig:4-1]], narrow the rebalancing band from ±5 to ±1 percentage point. Which statement is correct?
    choices:
      - zh-cn: 股票比例更贴近 60%，但再平衡的次数大大增加，交易成本和税也随之增加
        en: The stock weight stays closer to 60%, but rebalancing happens far more often, adding trading costs and taxes
      - zh-cn: 区间越窄越好，因为组合的风险控制得更精确，没有额外的代价
        en: The narrower the band the better, since risk is controlled more precisely at no extra cost
        why:
          zh-cn: 看读数中的再平衡次数。每次再平衡在应税账户中意味着什么？
          en: Look at the number of rebalances in the readout. What does each rebalance mean in a taxable account?
      - zh-cn: 区间的宽度不影响再平衡的次数
        en: The width of the band does not affect how often rebalancing happens
        why:
          zh-cn: 看读数：±5 时和 ±1 时再平衡的次数各是多少？
          en: 'Look at the readout: how many rebalances are there at ±5 and at ±1?'
    correct: A
    answer:
      zh-cn: |-
        (A)。在这条路径上，±5 时 40 年再平衡约 10 次，±1 时约 36 次，几乎每年都要交易。比例偏离 1 个百分点对组合风险的影响很小，却要多付交易成本，在应税账户中还要更频繁地实现资本利得。区间规则的意义是只在偏离对风险有实质影响时才交易；±5 个百分点左右是常见的折中。
      en: |-
        (A). On this path there are about 10 rebalances in 40 years at ±5 and about 36 at ±1, trading almost every year. A drift of 1 percentage point barely changes portfolio risk, yet the trading costs more and, in taxable accounts, realizes capital gains more often. The point of a band rule is to trade only when the drift matters for risk; about ±5 percentage points is a common compromise.

  - id: C5
    kind: check
    section: rebalancing
    concepts: [rebalancing, asset-location]
    question:
      zh-cn: |-
        一个家庭的股票比例从目标 60% 漂移到 66%。他们的股票大部分在应税账户中，有大量未实现的利得；401(k) 中有股票和债券，并且每月还会存入新的钱。最省税的再平衡方法是：
      en: |-
        A household's stock weight has drifted from its 60% target to 66%. Most of its stocks are in a taxable account with large unrealized gains; its 401(k) holds both stocks and bonds and receives new money every month. The most tax-efficient way to rebalance is:
    choices:
      - zh-cn: 在 401(k) 中卖出股票、买入债券，并把新存入的钱投向债券
        en: Sell stocks and buy bonds inside the 401(k), and direct new contributions to bonds
      - zh-cn: 在应税账户中卖出股票，因为那里的股票最多
        en: Sell stocks in the taxable account, since that is where most stocks are
        why:
          zh-cn: 在应税账户中卖出有大量利得的股票要交什么？在 401(k) 中交易要交税吗？
          en: What does selling stocks with large gains in a taxable account cost? Is trading inside a 401(k) taxed?
      - zh-cn: 不必再平衡，因为再平衡总会产生税
        en: No need to rebalance, since rebalancing always creates tax
        why:
          zh-cn: 在 401(k) 中买卖会产生税吗？用新存入的钱买入低配的资产呢？
          en: Does trading inside a 401(k) create tax? What about using new contributions to buy the underweight asset?
    correct: A
    answer:
      zh-cn: |-
        (A)。401(k) 中的交易不产生税，新存入的钱也可以直接买入低配的资产，这样不必卖出应税账户中增值的股票。再平衡看的是所有账户合起来的比例，而不是每个账户各自的比例。只有在递延账户和新资金都不够时，才需要考虑在应税账户中卖出，并优先卖出利得较小或亏损的部分。
      en: |-
        (A). Trades inside the 401(k) are not taxed, and new contributions can go straight to the underweight asset, so there is no need to sell appreciated stocks in the taxable account. Rebalancing looks at the mix across all accounts together, not each account by itself. Only if tax-deferred accounts and new money are not enough should selling in the taxable account be considered, choosing lots with small gains or losses first.

  # ---------- Exercises (练习题) ----------
  - id: Q1
    kind: exercise
    level: B
    concepts: [rebalancing, momentum]
    expected: { w: "67.24", sell: "42", bonus: "4.17" }
    question:
      zh-cn: |-
        一个 50 万美元的组合年初为 60% 股票、40% 债券。这一年股票上涨 30%，债券下跌 5%。
        (a) 年末股票占多少？要回到 60/40，需要卖出多少股票（千美元）？
        (b) 一位朋友说：“再平衡就是卖出赢家、买入输家，而股票有动量（[[4.6]]），所以再平衡会降低收益，不应该做。”评价这个说法。考虑一个简化的例子：一项资产先涨 50%、再跌三分之一（回到原价），另一项是收益为 0 的现金；比较始终持有 50/50 并每期再平衡，与一开始 50/50 然后不再调整，两期后各增长多少。这个例子说明了什么？在什么市场中再平衡会少赚？
      en: |-
        A 500,000 dollar portfolio starts the year at 60% stocks and 40% bonds. Over the year stocks rise 30% and bonds fall 5%.
        (a) What is the stock weight at year end? How many stocks must be sold to return to 60/40 (thousand dollars)?
        (b) A friend says: "Rebalancing sells winners and buys losers, and stocks have momentum ([[4.6]]), so rebalancing lowers returns and should be avoided." Evaluate this statement. Consider a simplified example: one asset first rises 50% and then falls by a third (back to its starting price), and the other is cash earning 0; compare holding 50/50 rebalanced each period with starting at 50/50 and never adjusting, and find each one's growth after two periods. What does the example show? In what kind of market does rebalancing earn less?
    answer:
      zh-cn: |-
        (a) 股票 $0.6 \times 1.3 = 0.78$，债券 $0.4 \times 0.95 = 0.38$，合计 1.16；股票占 $\frac{0.78}{1.16} \approx 67.24\%$。目标股票 $0.6 \times 1.16 = 0.696$，卖出 $0.78 - 0.696 = 0.084$，乘以 500 约为 42（千美元），用来买入债券。
        (b) 说法不对，至少不全面。再平衡的主要目的是控制风险：不再平衡时，股票比例会随股票上涨不断升高（[[fig:4-1]] 中曾到约 90%），组合的风险就不再是 IPS 中选定的风险。至于收益，取决于市场的走势。例子中，不调整的组合两期后回到原值，增长 0；每期再平衡的组合第一期为 $0.5 \times 1.5 + 0.5 = 1.25$，第二期为 $0.5 \times \frac{2}{3} + 0.5 \approx 0.833$，两期后为 $1.25 \times 0.833 \approx 1.0417$，增长约 4.17%。在来回震荡的市场中，再平衡在高位卖出、低位买入，可以获益。反过来，在一个方向持续上涨的市场中（例如股票连续多年跑赢债券），再平衡不断卖出上涨的资产，收益会低于不再平衡；动量在一年以内的期限上存在，而年度或区间再平衡的期限上，长期反转也存在（[[4.7]]）。所以再平衡并不保证提高收益，它换来的是风险保持在设定的水平。
      en: |-
        (a) Stocks $0.6 \times 1.3 = 0.78$, bonds $0.4 \times 0.95 = 0.38$, total 1.16; stocks are $\frac{0.78}{1.16} \approx 67.24\%$. Target stocks $0.6 \times 1.16 = 0.696$, so sell $0.78 - 0.696 = 0.084$, times 500, about 42 (thousand dollars), and buy bonds with it.
        (b) The statement is wrong, or at least incomplete. Rebalancing is mainly about controlling risk: without it, the stock share keeps rising as stocks rise (to about 90% at one point in [[fig:4-1]]), and the portfolio's risk is no longer the one chosen in the IPS. Whether it helps returns depends on how markets move. In the example, the unadjusted portfolio ends where it started, growth 0; the rebalanced one is $0.5 \times 1.5 + 0.5 = 1.25$ after the first period and $0.5 \times \frac{2}{3} + 0.5 \approx 0.833$ in the second, so $1.25 \times 0.833 \approx 1.0417$ after two, growth about 4.17%. In markets that swing back and forth, rebalancing sells high and buys low and gains. Conversely, in a market that keeps rising in one direction (stocks beating bonds for many years in a row), rebalancing keeps selling the rising asset and earns less than not rebalancing; momentum exists at horizons up to a year, while at the horizons of yearly or band rebalancing long-run reversal also exists ([[4.7]]). So rebalancing does not guarantee higher returns; what it buys is keeping risk at the chosen level.
    rubric:
      zh-cn:
        - "(a) 通过：约 67.24%，卖出约 42（千美元）。"
        - "(b) 通过：指出再平衡的主要目的是控制风险；算出例子中再平衡增长约 4.17%、不调整为 0，并说明在单边趋势市中再平衡会少赚。只说“再平衡总是更好”或同意朋友，需要订正。"
      en:
        - "(a) OK: about 67.24%, sell about 42 (thousand dollars)."
        - "(b) OK: says rebalancing is mainly about controlling risk; computes about 4.17% growth with rebalancing and 0 without in the example, and explains that rebalancing earns less in trending markets. Only saying rebalancing is always better, or agreeing with the friend, needs revision."

  - id: Q2
    kind: exercise
    level: B
    concepts: [home-bias, portfolio-variance, market-portfolio]
    expected: { sd: "15.96" }
    question:
      zh-cn: |-
        美国股票的波动率为 16%，美国以外发达市场股票的波动率为 18%，两者的相关系数为 0.8。
        (a) 60% 美国、40% 国际的股票组合，波动率是多少？比 100% 美国股票低多少？
        (b) 一位投资者据此说：“国际股票几乎不降低风险，还更波动，持有它没有意义。”评价这个说法。
      en: |-
        US stocks have a volatility of 16%, developed markets outside the US 18%, and their correlation is 0.8.
        (a) What is the volatility of a stock portfolio of 60% US and 40% international? How much lower than 100% US?
        (b) An investor concludes: "International stocks hardly reduce risk and are more volatile, so there is no point in holding them." Evaluate this statement.
    answer:
      zh-cn: |-
        (a) 方差 $0.6^2 \times 16^2 + 0.4^2 \times 18^2 + 2 \times 0.6 \times 0.4 \times 0.8 \times 16 \times 18 = 92.16 + 51.84 + 110.59 = 254.59$（%²），波动率约 15.96%，只比 16% 低约 0.04 个百分点。
        (b) 计算本身没有错：在相关系数为 0.8 时，年度波动率几乎不变。但说法不成立。第一，年度波动率衡量的是短期的风险，而国际分散的价值在于避免单一国家长期低迷的风险：日本股市 1989 年后三十多年没有回到高点；美国股市在 2000 年代的十年中总收益也很低。这种风险在年度相关系数中看不出来。第二，各国的估值、行业构成和货币不同，长期收益可能差别很大，事先无法知道哪个国家会更好。第三，按理论，市场组合是全球的，只持有一个国家是在押注该国跑赢（[[4.3]]）。第四，国际股票降低风险的效果不大，但也几乎不增加风险；预期收益相近时，用很小的代价获得对单一国家风险的保险是值得的。
      en: |-
        (a) Variance $0.6^2 \times 16^2 + 0.4^2 \times 18^2 + 2 \times 0.6 \times 0.4 \times 0.8 \times 16 \times 18 = 92.16 + 51.84 + 110.59 = 254.59$ (%²), volatility about 15.96%, only about 0.04 percentage points below 16%.
        (b) The arithmetic is right: with a correlation of 0.8 yearly volatility barely changes. But the conclusion does not follow. First, yearly volatility measures short-term risk, while the value of international diversification lies in avoiding a long slump in one country: Japan's market did not regain its 1989 high for over thirty years, and US stocks had a very low total return over the 2000s. This risk does not show in yearly correlations. Second, countries differ in valuations, sector mix and currency, so long-run returns can differ greatly, and no one knows in advance which country will do better. Third, in theory the market portfolio is global, and holding one country is a bet that it will win ([[4.3]]). Fourth, international stocks reduce volatility little but hardly add any; with similar expected returns, insurance against single-country risk at almost no cost is worth having.
    rubric:
      zh-cn:
        - "(a) 通过：约 15.96%，只低约 0.04 个百分点。"
        - "(b) 通过：指出年度波动率看不出单一国家长期低迷的风险，举例（日本或其他）；提到全球市场组合或事先无法知道哪个国家更好。同意“没有意义”，需要订正。"
      en:
        - "(a) OK: about 15.96%, only about 0.04 percentage points lower."
        - "(b) OK: says yearly volatility hides the risk of a long single-country slump, with an example (Japan or another); mentions the global market portfolio or that no one knows which country will do better. Agreeing there is no point needs revision."

  - id: Q3
    kind: exercise
    level: B
    concepts: [tactical-asset-allocation, strategic-asset-allocation, capital-market-assumptions]
    expected: { e60: "4.6", e30: "4.3" }
    question:
      zh-cn: |-
        一位投资者的战略配置为 60% 股票、40% 债券。现在 CAPE 很高，他用积木法（[[4.11]]）估计今后 10 年股票的年预期收益只有 5%，债券为 4%。
        (a) 按这个估计，60/40 和 30/70 两种配置的预期收益各是多少？
        (b) 他打算“在估值回落之前把股票降到 30%，回落后再加回来”。评价这个计划。如果他对股票预期收益的估计确实下调了，合理的调整是怎样的？
      en: |-
        An investor's strategic allocation is 60% stocks and 40% bonds. CAPE is now high, and using the building-block method ([[4.11]]) he estimates stocks will return only 5% a year over the next 10 years, and bonds 4%.
        (a) By this estimate, what are the expected returns of 60/40 and 30/70?
        (b) He plans to "cut stocks to 30% until valuations come down, then add them back". Evaluate this plan. If his estimate of stocks' expected return really has fallen, what would a reasonable adjustment look like?
    answer:
      zh-cn: |-
        (a) 60/40：$0.6 \times 5\% + 0.4 \times 4\% = 4.6\%$；30/70：$0.3 \times 5\% + 0.7 \times 4\% = 4.3\%$。
        (b) 这个计划是战术择时，问题很多。第一，CAPE 对今后 10 年收益有一定的解释力，但对 1–2 年几乎没有预测力，估值可以在高位停留很多年（[[4.11]]）；“回落后再加回来”需要两次都判断对时机，而“回落”的标准事先并不清楚。第二，即使按他自己的估计，股票的预期收益仍高于债券，股票风险溢价变小了，但没有消失。第三，按资本配置的思路（[[4.3]]），最优股票比例与风险溢价成正比：如果他原来估计股票比债券多 3 个百分点、现在只多 1 个百分点，按比例降低是一种思路，但风险溢价的估计误差很大（[[4.10]]），把 60% 一下子降到 30% 过于依赖一个不确定的点估计。合理的做法是：把下调后的资本市场假设写进 IPS，在战略配置的允许范围内温和地调整（例如几个百分点），并接受预期收益较低的现实（增加储蓄或调整目标），而不是全进全出。
      en: |-
        (a) 60/40: $0.6 \times 5\% + 0.4 \times 4\% = 4.6\%$; 30/70: $0.3 \times 5\% + 0.7 \times 4\% = 4.3\%$.
        (b) The plan is tactical timing with many problems. First, CAPE has some power to explain the next 10 years' returns but almost none for 1–2 years, and valuations can stay high for many years ([[4.11]]); "adding back after they come down" needs the timing right twice, and what counts as "down" is not defined in advance. Second, even by his own estimate stocks still earn more than bonds; the equity premium has shrunk, not vanished. Third, by capital allocation reasoning ([[4.3]]), the optimal stock share is proportional to the risk premium: if he used to expect stocks to beat bonds by 3 percentage points and now by only 1, scaling down is one line of thought, but premium estimates are very imprecise ([[4.10]]), and cutting from 60% to 30% at once leans too hard on one uncertain point estimate. A reasonable approach: write the lowered capital market assumptions into the IPS, adjust modestly within the ranges the strategic allocation allows (a few percentage points, say), and accept lower expected returns (save more or adjust goals), rather than going all in or all out.
    rubric:
      zh-cn:
        - "(a) 通过：4.6% 和 4.3%。"
        - "(b) 通过：指出估值对短期预测力弱、需要两次判断时机；按他的估计股票仍有溢价；建议基于资本市场假设的温和调整而非全进全出。同意计划，需要订正。"
      en:
        - "(a) OK: 4.6% and 4.3%."
        - "(b) OK: says valuations predict poorly in the short run and timing must be right twice; by his own estimate stocks still carry a premium; recommends a modest adjustment based on capital market assumptions rather than all in or out. Agreeing with the plan needs revision."

  - id: Q4
    kind: exercise
    level: B
    concepts: [rebalancing, asset-location, long-term-capital-gain]
    expected: { tax: "7.5" }
    question:
      zh-cn: |-
        一个家庭的组合为 100 万美元，目标 60% 股票。现在股票占 70%，需要卖出约 10 万美元股票。他们的应税账户中，股票的成本基础只有市值的一半；长期资本利得税率为 15%。他们的 401(k) 中有 20 万美元，现在全部是股票。
        (a) 如果在应税账户中卖出 10 万美元股票，要交多少税（千美元）？
        (b) 一位朋友说：“规则就是规则，每年都必须在每个账户里把比例调回 60/40。”评价这个说法，并给出更好的再平衡方案。
      en: |-
        A household's portfolio is 1 million dollars with a 60% stock target. Stocks are now 70%, so about 100,000 dollars of stocks must be sold. In their taxable account the stocks' cost basis is only half their market value; the long-term capital gains rate is 15%. Their 401(k) holds 200,000 dollars, all in stocks.
        (a) If they sell 100,000 dollars of stocks in the taxable account, how much tax is due (thousand dollars)?
        (b) A friend says: "A rule is a rule; every year every account must be put back to 60/40." Evaluate this statement and give a better rebalancing plan.
    answer:
      zh-cn: |-
        (a) 利得为 $100 \times 50\% = 50$，税 $50 \times 15\% = 7.5$（千美元）。
        (b) 说法不对。再平衡的目标是整个家庭组合的比例，不是每个账户各自的比例。更好的方案：在 401(k) 中卖出 10 万美元股票、买入债券，不产生任何税，就能把总股票比例从 70% 降到 60%；今后新存入的钱和应税账户中的股息优先买入低配的资产。这样同时也符合资产位置的原则：债券放在递延账户，股票留在应税账户（[[6.5]]）。如果不得不在应税账户中卖出，应先卖成本基础较高或亏损的部分，并考虑与税损收割结合。另外，只在偏离超过区间时才交易，可以减少不必要的交易。
      en: |-
        (a) The gain is $100 \times 50\% = 50$, so the tax is $50 \times 15\% = 7.5$ (thousand dollars).
        (b) The statement is wrong. Rebalancing targets the mix of the household's whole portfolio, not each account separately. A better plan: sell 100,000 dollars of stocks inside the 401(k) and buy bonds, with no tax at all, bringing the total stock share from 70% to 60%; afterwards direct new contributions and taxable dividends to the underweight asset first. This also fits asset location: bonds in the tax-deferred account, stocks in the taxable one ([[6.5]]). If selling in the taxable account cannot be avoided, sell lots with higher basis or losses first, and consider combining with tax-loss harvesting. Also, trading only when the drift exceeds a band avoids unnecessary trades.
    rubric:
      zh-cn:
        - "(a) 通过：7.5（千美元）。"
        - "(b) 通过：指出再平衡看整体比例；提出在 401(k) 中调整、用新资金调整等无税方案；提到资产位置或按批次卖出、区间规则中的至少一项更好。同意朋友，需要订正。"
      en:
        - "(a) OK: 7.5 (thousand dollars)."
        - "(b) OK: says rebalancing targets the overall mix; proposes tax-free ways such as trading in the 401(k) and using new money; mentioning asset location, lot selection or band rules is a plus. Agreeing with the friend needs revision."
