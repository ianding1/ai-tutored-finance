lesson: "1.9"

context:
  - zh-cn: |-
      学习者学过期望（[[0.3]]）、年金与复利（[[0.1]]）、风险厌恶（[[1.4]]）、博弈论（[[1.7]]）以及剩余、外部性（[[1.8]]）。本课不使用正式的契约理论模型；信号传递和筛选只讲直观的条件。
    en: |-
      The learner has studied expected value ([[0.3]]), annuities and compounding ([[0.1]]), risk aversion ([[1.4]]), game theory ([[1.7]]), and surplus and externalities ([[1.8]]). This lesson does not use formal contract-theory models; signaling and screening are covered only through intuitive conditions.
  - concepts: [asymmetric-information, adverse-selection]
    zh-cn: |-
      讲义的柠檬市场：好车对买方价值 10,000、车主最低要价 8,000；柠檬对买方 4,000、车主 3,000；买方风险中性，最多付平均价值。一半好车时买方最多付 7,000，好车退出，只剩柠檬、价格 4,000。[[fig:2-1]]：好车比例滑块从 0 到 1，步长 0.05，默认 0.5；读数给出买方最多愿意付的价格和好车车主是否留下。讲义没有给出好车留下所需的比例（留给随堂题）。讲义还讲了保险中的逆向选择、增发股票时股价下跌、银行限制贷款数量而不是单纯提高利率。
    en: |-
      The lesson's lemons market: a good car is worth 10,000 to buyers and its owner's lowest price is 8,000; a lemon is worth 4,000 to buyers and 3,000 to its owner; buyers are risk neutral and pay at most the average value. With half good cars, buyers pay at most 7,000, good cars leave, and only lemons remain at 4,000. [[fig:2-1]]: a slider for the share of good cars from 0 to 1 in steps of 0.05 (default 0.5); the readout gives the most buyers will pay and whether owners of good cars stay. The lesson does not give the share needed for good cars to stay (left to a check question). It also covers adverse selection in insurance, the fall in share prices when firms issue new shares, and banks limiting loan amounts rather than only raising interest rates.
  - concepts: [signaling, screening]
    zh-cn: |-
      讲义：信号要对好的类型便宜、对差的类型昂贵（例如保修）；条件的推导留给练习题。例子：学历（斯彭斯）、稳定的股息、经理买入本公司股票。筛选：保险公司同时提供高免赔额低保费和全额赔付高保费的保单；银行要求抵押或首付。
    en: |-
      The lesson: a signal must be cheap for the good type and expensive for the bad type (for example a warranty); deriving the condition is left to an exercise. Examples: education (Spence), steady dividends, managers buying their own company's shares. Screening: an insurer offers both a low-premium policy with a high deductible and a high-premium policy with full coverage; banks require collateral or a down payment.
  - concepts: [moral-hazard, principal-agent-problem]
    zh-cn: |-
      讲义：道德风险的对策是免赔额、共担损失、保费折扣和监督；金融中的例子是“大而不能倒”和存款保险。委托–代理问题的例子：股东与经理、投资者与基金经理（按规模收费、收益共享而不承担损失）、客户与拿佣金的顾问。对策：激励（但会把风险转给风险厌恶的代理人）、监督、法律责任（美国注册投资顾问按 1940 年《投资顾问法》负有受托责任；经纪商自 2020 年起须遵守 SEC 的 Regulation Best Interest）。
    en: |-
      The lesson: remedies for moral hazard are deductibles, shared losses, premium discounts and monitoring; financial examples are "too big to fail" and deposit insurance. Examples of the principal-agent problem: shareholders and managers, investors and fund managers (fees based on assets, sharing gains without bearing losses), clients and commission-paid advisers. Remedies: incentives (which shift risk onto a risk-averse agent), monitoring, legal duties (in the US, registered investment advisers have a fiduciary duty under the Investment Advisers Act of 1940; broker-dealers must follow the SEC's Regulation Best Interest since 2020).

common_errors:
  - questions: [C1, C2, Q1]
    zh-cn: |-
      用所有类型的平均值定价后就停下，没有检查在这个价格下谁会留在市场里；留下的类型变了，平均值也要重新计算。
    en: |-
      Stopping after pricing at the average over all types, without checking who stays in the market at that price; when the types that stay change, the average must be recomputed.
  - questions: [C3, Q3]
    zh-cn: |-
      只检查好的类型是否愿意发出信号，没有检查差的类型会不会模仿。信号要起作用，差的类型模仿必须不划算。
    en: |-
      Checking only whether the good type is willing to send the signal, not whether the bad type would copy it. For a signal to work, copying must not pay for the bad type.
  - questions: [C4]
    zh-cn: |-
      认为全额保险时投保人仍会因为损失的可能而小心。全额保险时损失由保险公司承担，小心对投保人自己没有好处。
    en: |-
      Thinking that a fully insured person still takes care because of the chance of a loss. With full insurance the insurer bears the loss, so taking care brings the insured person no benefit.
  - questions: [Q2]
    zh-cn: |-
      只比较两种策略的期望收益（都是 5%），没有注意到业绩报酬只分享收益、不承担损失，使经理偏好波动大的策略。
    en: |-
      Comparing only the expected returns of the two strategies (both 5%), without noticing that a performance fee shares gains but not losses, which makes the manager prefer the volatile strategy.
  - questions: [Q5]
    zh-cn: |-
      以为 5% 的佣金和每年不到 1 个百分点的费用差别只是小钱。佣金一次性减少了投入的本金，费用每年都从收益中扣除并复利，20 年后差距很大；顾问得到的只是佣金，客户付出的却远不止这些。
    en: |-
      Thinking a 5% commission and a fee difference under 1 percentage point a year are small change. The commission cuts the money invested at once, and fees are taken from returns every year and compound, so after 20 years the gap is large; the adviser receives only the commission, while the client loses far more.
  - questions: [Q4]
    zh-cn: |-
      认为委托人应该把全部利润都给代理人（努力最高），或者一点都不给。委托人关心的是自己的那一份，要在努力和分成之间权衡。
    en: |-
      Thinking that the principal should give the agent all the profit (maximum effort) or none of it. The principal cares about its own share and must trade effort off against the split.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: adverse-selection
    concepts: [adverse-selection, expected-value]
    widget: { id: lemons, set: { q: 0.7 } }
    question:
      zh-cn: |-
        在 [[fig:2-1]] 中逐渐降低好车的比例。当买方最多愿意付的价格低于好车车主的最低要价时：
      en: |-
        In [[fig:2-1]], lower the share of good cars step by step. When the most buyers will pay falls below the good-car owners' lowest acceptable price:
    choices:
      - zh-cn: 好车车主退出，市场上只剩柠檬
        en: Good-car owners leave, and only lemons remain
      - zh-cn: 好车车主降价，按买方愿意付的价格出售
        en: Good-car owners cut their price and sell at what buyers will pay
        why:
          zh-cn: 买方愿意付的价格低于好车车主的最低要价。车主会以低于自己估价的价格卖车吗？
          en: Buyers will pay less than the good-car owners' lowest price. Would an owner sell below his own valuation?
      - zh-cn: 买方提高出价，因为他们想要好车
        en: Buyers raise their offers, because they want good cars
        why:
          zh-cn: 买方分不清好车和柠檬。他们愿意付的最高价格由什么决定？
          en: Buyers cannot tell good cars from lemons. What decides the most they will pay?
      - zh-cn: 没有变化，好车和柠檬照样成交
        en: Nothing changes; good cars and lemons still trade
        why:
          zh-cn: 在这个价格下，好车车主卖车得到的比他自己对车的估价多还是少？
          en: At this price, does a good-car owner get more or less than his own valuation by selling?
    correct: A
    answer:
      zh-cn: |-
        (A)。买方分不清好车和柠檬，只愿意按平均价值付钱。好车比例低时，平均价值低于好车车主的最低要价，他们宁可不卖。好车退出后，待售车的平均质量更低，买方愿意付的更少：市场上只剩柠檬，本来对双方都有利的好车交易没有发生。
      en: |-
        (A). Buyers cannot tell good cars from lemons and will pay only the average value. With few good cars, the average falls below what good-car owners will accept, so they keep their cars. Once they leave, the average quality is even lower and buyers pay even less: only lemons remain, and the good-car trades that would benefit both sides do not happen.

  - id: C2
    kind: check
    section: adverse-selection
    concepts: [adverse-selection, risk-aversion]
    question:
      zh-cn: |-
        一种健康保险的潜在投保人一半是低风险的人（预期理赔 200 美元，最多愿意付 300 美元），一半是高风险的人（预期理赔 800 美元，最多愿意付 1,000 美元）。保险公司分不清两类人，只能对所有投保人收同一个保费，并按投保人的平均预期理赔定价（不赚不赔）。最后：
      en: |-
        Half of the potential buyers of a health insurance policy are low risk (expected claims 200 dollars, willing to pay at most 300) and half are high risk (expected claims 800 dollars, willing to pay at most 1,000). The insurer cannot tell them apart, must charge everyone the same premium, and sets it at the average expected claim of those who buy (breaking even). In the end:
    choices:
      - zh-cn: 只有高风险的人投保，保费 800 美元
        en: Only high-risk people buy, at a premium of 800 dollars
      - zh-cn: 两类人都投保，保费 500 美元
        en: Both types buy, at a premium of 500 dollars
        why:
          zh-cn: 保费为 500 美元时，低风险的人愿意买吗？
          en: At a premium of 500 dollars, will low-risk people buy?
      - zh-cn: 没有人投保
        en: No one buys
        why:
          zh-cn: 只剩高风险的人时，保费要多高才能不赔？高风险的人愿意付这么多吗？
          en: With only high-risk people left, what premium breaks even? Are they willing to pay that much?
      - zh-cn: 只有低风险的人投保
        en: Only low-risk people buy
        why:
          zh-cn: 统一保费下，谁觉得保险更划算：预期理赔高的人，还是预期理赔低的人？
          en: 'With one premium for all, who finds the insurance a better deal: those with high expected claims or those with low ones?'
    correct: A
    answer:
      zh-cn: |-
        (A)。两类人都投保时保费为 500，低风险的人最多付 300，不买。只剩高风险的人，保费涨到 800；他们最多愿意付 1,000，所以会买。结果没有效率：为低风险的人提供保险的预期成本只有 200，他们愿意付 300，这笔交易本来对双方都有好处，却因为保险公司分不清风险高低而没有发生。
      en: |-
        (A). With both types the premium is 500, which low-risk people (at most 300) will not pay. With only high-risk people left, the premium rises to 800, which they will pay (at most 1,000). The outcome is inefficient: covering low-risk people costs 200 in expectation and they would pay 300, a trade good for both sides that does not happen because the insurer cannot tell the risks apart.

  - id: C3
    kind: check
    section: signaling-screening
    concepts: [signaling, adverse-selection]
    question:
      zh-cn: |-
        在二手车市场中，好车车主愿意提供一年保修，因为好车一年内的预期修理费很低。所以提供保修一定能让买方区分好车和柠檬。
      en: |-
        In a used-car market, good-car owners are willing to offer a one-year warranty, because a good car's expected repairs within a year are low. So offering a warranty must let buyers tell good cars from lemons.
    correct: false
    hint:
      zh-cn: 只检查好车车主愿意提供保修还不够。柠檬车主模仿、也提供保修，划算吗？
      en: Checking that good-car owners are willing is not enough. Would it pay lemon owners to copy them and offer a warranty too?
    answer:
      zh-cn: |-
        错。信号要起作用，还需要差的类型模仿不划算。如果柠檬的预期修理费不够高，柠檬车主也提供保修、被当作好车卖出能得到更多，他们就会模仿；有保修的车里也有柠檬，买方不再相信保修，它就不能区分两种车。只有当信号对差的类型足够昂贵时，它才有信息含量。
      en: |-
        False. A signal works only if copying it does not pay for the bad type. If a lemon's expected repairs are not high enough, lemon owners also gain by offering a warranty and being sold as good cars, so they copy; then cars with warranties include lemons, buyers stop trusting warranties, and the warranty no longer separates the two. A signal carries information only if it is costly enough for the bad type.

  - id: C4
    kind: check
    section: moral-hazard
    concepts: [moral-hazard]
    question:
      zh-cn: |-
        全额保险会让投保人不那么小心，而设置免赔额（每次损失的前一部分由投保人自己承担）能减轻这个问题。
      en: |-
        Full insurance makes policyholders less careful, and a deductible (the policyholder bears the first part of each loss) can reduce this problem.
    correct: true
    hint:
      zh-cn: 全额保险时，投保人小心带来的好处归谁？有免赔额时呢？
      en: With full insurance, who gets the benefit of the policyholder's care? With a deductible?
    answer:
      zh-cn: |-
        对。全额保险时损失由保险公司承担，小心只有成本、对投保人没有好处，所以他不会小心，这是道德风险。有免赔额时，投保人自己承担每次损失的一部分，小心降低了他自己的预期损失；免赔额足够大时，小心带来的好处超过成本，他就会小心。代价是投保人要承担一部分风险。
      en: |-
        True. With full insurance the insurer bears the loss, so care only costs the policyholder and brings him nothing, and he is not careful: moral hazard. With a deductible he bears part of each loss, so care lowers his own expected loss; with a large enough deductible the gain exceeds the cost and he takes care. The price is that he bears some of the risk.

  - id: C5
    kind: check
    section: principal-agent
    concepts: [principal-agent-problem, moral-hazard]
    question:
      zh-cn: |-
        一位理财顾问不向客户收费，收入全部来自他推荐的基金支付的销售佣金。下面哪种办法最直接地减轻他和客户之间的利益冲突？
      en: |-
        A financial adviser charges clients nothing and earns all his income from sales commissions paid by the funds he recommends. Which measure most directly reduces the conflict of interest between him and his clients?
    choices:
      - zh-cn: 改为客户直接向顾问付固定的费用，顾问不收产品佣金
        en: Clients pay the adviser a fixed fee directly, and he takes no product commissions
      - zh-cn: 让顾问每次推荐更多只基金供客户选择
        en: Have the adviser recommend more funds each time for clients to choose from
        why:
          zh-cn: 推荐的基金多了，顾问的收入仍然取决于哪只基金的佣金高吗？
          en: With more funds recommended, does his income still depend on which fund pays the highest commission?
      - zh-cn: 提高所有基金的佣金率
        en: Raise the commission rate on all funds
        why:
          zh-cn: 佣金更高，顾问推荐高佣金产品的动机是变弱还是变强？
          en: With higher commissions, is his incentive to push high-commission products weaker or stronger?
      - zh-cn: 客户更信任顾问
        en: Clients trust the adviser more
        why:
          zh-cn: 信任改变了顾问的激励吗？客户能看到顾问为什么推荐某只基金吗？
          en: Does trust change the adviser's incentives? Can clients see why he recommends a fund?
    correct: A
    answer:
      zh-cn: |-
        (A)。客户是委托人，顾问是代理人。顾问的收入取决于佣金，有动机推荐佣金高、往往费用也高的基金，而客户难以判断。改为客户直接付固定费用后，顾问的收入不再取决于推荐哪只基金，利益冲突的来源消失。其他办法还包括选择负有受托责任的顾问、要求披露佣金。
      en: |-
        (A). The client is the principal and the adviser the agent. His income depends on commissions, so he is tempted to recommend high-commission funds, which often also have high fees, and the client finds this hard to judge. With a fixed fee paid by the client, his income no longer depends on which fund he recommends, and the source of the conflict goes away. Other measures include choosing advisers with a fiduciary duty and requiring disclosure of commissions.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: B
    concepts: [adverse-selection, expected-value]
    question:
      zh-cn: |-
        一个二手车市场中，车的质量 $v$ 均匀分布在 0 到 10,000 美元之间（$v$ 是车主对这辆车的估价），买方对质量为 $v$ 的车估价 $1.5v$。只有车主知道 $v$；买方风险中性，只知道待售车的平均质量。
        (a) 如果市场价格是 $p$，哪些车主愿意卖？待售车的平均质量是多少？买方愿意付多少？
        (b) 证明除了 $p = 0$，没有价格能使买方愿意付的等于 $p$。这说明了什么？
      en: |-
        In a used-car market, car quality $v$ is uniformly distributed between 0 and 10,000 dollars ($v$ is the owner's value of the car), and buyers value a car of quality $v$ at $1.5v$. Only owners know $v$; buyers are risk neutral and know only the average quality of the cars for sale.
        (a) If the market price is $p$, which owners are willing to sell? What is the average quality of the cars for sale? How much are buyers willing to pay?
        (b) Show that no price except $p = 0$ makes what buyers are willing to pay equal to $p$. What does this show?
    answer:
      zh-cn: |-
        (a) 车主估价 $v \le p$ 时愿意卖，待售车的质量均匀分布在 0 到 $p$ 之间，平均质量 $\frac{p}{2}$。买方愿意付 $1.5 \times \frac{p}{2} = 0.75p$。
        (b) 买方愿意付的 $0.75p$ 总是低于 $p$（$p > 0$ 时）。按 $p$ 卖不出去；降价后最好的那些车又退出，平均质量继续下降。只有 $p = 0$ 时两者相等，市场完全瓦解，虽然每一辆车对买方的价值都是车主的 1.5 倍，却没有一辆成交。逆向选择可以使整个市场消失，而不只是让好车退出。
      en: |-
        (a) Owners with $v \le p$ are willing to sell, so the quality of the cars for sale is uniform between 0 and $p$, with average $\frac{p}{2}$. Buyers are willing to pay $1.5 \times \frac{p}{2} = 0.75p$.
        (b) What buyers will pay, $0.75p$, is always below $p$ (for $p > 0$). At $p$ the cars do not sell; at a lower price the best remaining cars leave and the average quality falls again. Only at $p = 0$ are the two equal, and the market collapses completely: although every car is worth 1.5 times as much to buyers as to its owner, none is traded. Adverse selection can make a whole market disappear, not only drive out the good cars.
    rubric:
      zh-cn:
        - "(a) $v \\le p$ 的车主卖，平均质量 $\\frac{p}{2}$，买方愿意付 $0.75p$。"
        - "(b) $0.75p < p$，只有 $p = 0$；指出市场完全瓦解，尽管每笔交易都有好处。"
      en:
        - "(a) Owners with $v \\le p$ sell; average quality $\\frac{p}{2}$; buyers pay $0.75p$."
        - "(b) $0.75p < p$, so only $p = 0$; points out that the market collapses even though every trade would be beneficial."

  - id: Q2
    kind: exercise
    level: B
    concepts: [principal-agent-problem, risk-aversion, expected-value]
    expected: { safe: "1", risky: "4" }
    question:
      zh-cn: |-
        一位基金经理的报酬是基金当年收益的 20%，但收益为负时报酬为 0（不承担损失）。稳健策略每年收益确定为 5%；激进策略每年等概率收益 +40% 或 −30%，期望收益也是 5%。
        (a) 两种策略下经理的期望报酬各是多少（占基金资产的百分比）？经理会选哪一种？风险厌恶的投资者更喜欢哪一种？
        (b) 这个报酬结构的问题在哪里？提出一种改进的办法。
      en: |-
        A fund manager is paid 20% of the fund's yearly return, but nothing when the return is negative (he bears no losses). A safe strategy returns 5% for certain each year; an aggressive strategy returns +40% or −30% with equal probability, also an expected 5%.
        (a) What is the manager's expected pay under each strategy (as a percentage of fund assets)? Which will he choose? Which would a risk-averse investor prefer?
        (b) What is wrong with this pay structure? Suggest one improvement.
    answer:
      zh-cn: |-
        (a) 稳健：$20\% \times 5\% = 1\%$。激进：$0.5 \times 20\% \times 40\% + 0.5 \times 0 = 4\%$。经理会选激进策略；而两种策略期望收益相同，激进的风险大得多，风险厌恶的投资者更喜欢稳健策略。
        (b) 经理分享收益却不承担损失，他的报酬像一份看涨期权：波动越大，期望报酬越高；投资者承担全部下跌风险，经理却有动机加大风险。改进：要求经理用自己的钱投资于基金；设置历史最高净值线（high-water mark）；用多年业绩计算报酬；或者只收固定的管理费。
      en: |-
        (a) Safe: $20\% \times 5\% = 1\%$. Aggressive: $0.5 \times 20\% \times 40\% + 0.5 \times 0 = 4\%$. The manager chooses the aggressive strategy; with equal expected returns and much more risk, a risk-averse investor prefers the safe one.
        (b) The manager shares gains but not losses, so his pay is like a call option: the more volatility, the higher his expected pay; investors bear all the downside while the manager has reason to add risk. Improvements: require the manager to invest his own money in the fund; use a high-water mark; base pay on several years' results; or charge only a fixed management fee.
    rubric:
      zh-cn:
        - "(a) 1% 和 4%，经理选激进，投资者偏好稳健。"
        - "(b) 指出不对称的报酬，并给出合理的改进。"
      en:
        - "(a) 1% and 4%; the manager picks aggressive, investors prefer safe."
        - "(b) Identifies the asymmetric pay and a reasonable improvement."

  - id: Q3
    kind: exercise
    level: B
    star: true
    concepts: [signaling, adverse-selection]
    question:
      zh-cn: |-
        有两种类型的卖方：好的和差的。被买方认作好类型时，卖方多得到 $\Delta > 0$。发出一个信号的成本：好类型为 $c_H$，差类型为 $c_L$。
        (a) 证明：存在“好类型发信号、差类型不发”的结果，当且仅当 $c_H \le \Delta \le c_L$。由此说明，如果信号对两类人的成本一样，会怎样？
        (b) 公司宣布提高股息常常被看作好消息。用这个条件解释：为什么股息可以是信号？什么样的公司难以模仿？
      en: |-
        There are two types of seller, good and bad. Being seen as good earns a seller $\Delta > 0$ more. Sending a signal costs a good type $c_H$ and a bad type $c_L$.
        (a) Show that an outcome where good types signal and bad types do not exists if and only if $c_H \le \Delta \le c_L$. What happens if the signal costs both types the same?
        (b) A company announcing a higher dividend is often seen as good news. Use this condition to explain why a dividend can be a signal. What kind of company finds it hard to imitate?
    answer:
      zh-cn: |-
        (a) 好类型愿意发信号需要 $\Delta \ge c_H$；差类型不模仿需要 $\Delta \le c_L$。两者同时成立即 $c_H \le \Delta \le c_L$。如果成本相同（$c_H = c_L = c$），只有 $\Delta = c$ 这个巧合能成立；一般要么两类人都发，要么都不发，买方从信号中得不到信息。所以信号对差类型必须更昂贵。
        (b) 提高股息就是承诺以后每年付出更多现金。现金流稳定、前景好的公司做得到，成本低；现金流不稳定或前景差的公司以后可能要削减股息（会被市场严厉惩罚）或借钱维持，成本高，所以难以模仿。
      en: |-
        (a) Good types signal if $\Delta \ge c_H$; bad types do not imitate if $\Delta \le c_L$. Both hold exactly when $c_H \le \Delta \le c_L$. With equal costs ($c_H = c_L = c$), this holds only in the coincidence $\Delta = c$; generally either both types signal or neither does, and buyers learn nothing. So the signal must cost bad types more.
        (b) Raising the dividend commits the company to paying more cash every year. A company with stable cash flows and good prospects can do this cheaply; one with unstable cash flows or poor prospects may later have to cut the dividend (which markets punish severely) or borrow to keep it, which is costly, so it finds it hard to imitate.
    rubric:
      zh-cn:
        - "(a) 推出条件，并说明成本相同时信号失效。"
        - "(b) 用成本差异解释股息的信号作用。"
      en:
        - "(a) Derives the condition and explains that equal costs make the signal useless."
        - "(b) Explains the dividend signal by the difference in costs."

  - id: Q4
    kind: exercise
    level: C
    star: true
    concepts: [principal-agent-problem, first-order-condition]
    expected: { e: "5", owner: "25", agency: "12.5" }
    question:
      zh-cn: |-
        公司所有者（委托人）请一位经理（代理人）经营公司。经理的努力 $e$ 使利润为 $10e$，努力给经理带来的成本为 $\frac{e^2}{2}$（以美元计）。所有者看不到努力，只能看到利润，于是把利润的比例 $s$ 付给经理。经理是风险中性的。
        (a) 给定 $s$，经理选择多大的努力？所有者选择多大的 $s$？这时经理的努力和所有者的收益各是多少？
        (b) 如果所有者能直接看到并规定努力，使总剩余（利润减去努力成本）最大的努力是多少？与 (a) 相比，总剩余少了多少？这部分损失来自哪里？
      en: |-
        A company owner (principal) hires a manager (agent). Effort $e$ produces profit $10e$ and costs the manager $\frac{e^2}{2}$ (in dollars). The owner cannot see effort, only profit, and pays the manager a share $s$ of profit. The manager is risk neutral.
        (a) Given $s$, what effort does the manager choose? What $s$ does the owner choose? What are the manager's effort and the owner's payoff then?
        (b) If the owner could see and set effort directly, what effort would maximize total surplus (profit minus the cost of effort)? Compared with (a), how much total surplus is lost? Where does the loss come from?
    answer:
      zh-cn: |-
        (a) 经理最大化 $s \cdot 10e - \frac{e^2}{2}$，得 $e = 10s$。所有者得到 $(1 - s) \cdot 100s$，最大时 $s = 0.5$。经理努力 $e = 5$，利润 50，所有者得 25。
        (b) 总剩余 $10e - \frac{e^2}{2}$ 在 $e = 10$ 时最大，为 50。(a) 中总剩余 $50 - 12.5 = 37.5$，少了 12.5。损失来自所有者看不到努力：经理只得到边际利润的一半，所以只做到一半的努力；所有者给经理更大的比例，努力会增加，但自己的那一份会减少。这 12.5 就是代理成本。
      en: |-
        (a) The manager maximizes $s \cdot 10e - \frac{e^2}{2}$, giving $e = 10s$. The owner gets $(1 - s) \cdot 100s$, maximized at $s = 0.5$. Effort is $e = 5$, profit 50, and the owner gets 25.
        (b) Total surplus $10e - \frac{e^2}{2}$ is largest at $e = 10$, where it is 50. In (a) it is $50 - 12.5 = 37.5$, a loss of 12.5. The loss comes from the owner not seeing effort: the manager gets only half of the marginal profit and so puts in only half the effort; a larger share would raise effort but shrink the owner's own share. This 12.5 is the agency cost.
    rubric:
      zh-cn:
        - "(a) $e = 10s$、$s = 0.5$、努力 5、所有者得 25。"
        - "(b) 最优努力 10，损失 12.5，说明代理成本的来源。"
      en:
        - "(a) $e = 10s$, $s = 0.5$, effort 5, owner gets 25."
        - "(b) Optimal effort 10, a loss of 12.5, and the source of the agency cost."

  - id: Q5
    kind: exercise
    level: B
    concepts: [principal-agent-problem, future-value]
    expected: { x: "304678", y: "383368", gap: "78690" }
    question:
      zh-cn: |-
        一位拿佣金的顾问建议客户把 100,000 美元投入基金 X：买入时收取 5% 的销售佣金（付给顾问），之后每年费用率 1.0%。另一个选择是指数基金 Y：没有销售佣金，每年费用率 0.05%。两只基金扣费前的年收益都是 7%，费用直接从年收益中扣除。持有 20 年。
        (a) 20 年后两种选择的终值各是多少？相差多少？
        (b) 顾问从这笔建议中得到多少？用委托–代理的概念说明，为什么这种安排会让客户付出代价。
      en: |-
        A commission-paid adviser recommends that a client put 100,000 dollars into fund X, which charges a 5% sales commission on purchase (paid to the adviser) and then an expense ratio of 1.0% a year. The alternative is index fund Y, with no sales commission and an expense ratio of 0.05% a year. Both funds earn 7% a year before fees, and fees are taken directly out of the yearly return. The money is held for 20 years.
        (a) What is the value of each choice after 20 years? How large is the difference?
        (b) How much does the adviser get from this recommendation? Use the principal-agent idea to explain why this arrangement costs the client.
    answer:
      zh-cn: |-
        (a) X：实际投入 95,000，年收益 6%：$95{,}000 \times 1.06^{20} \approx 304{,}678$。Y：$100{,}000 \times 1.0695^{20} \approx 383{,}368$。相差约 78,690 美元，约为 Y 终值的 20%。
        (b) 顾问得到 5,000 美元佣金（基金每年的费用中可能还有给销售渠道的部分）。客户（委托人）请顾问（代理人）替自己选择，但顾问的收入来自产品佣金，与客户的利益不一致；客户又很难看出另一种选择会好多少。5,000 美元的佣金和每年多出的费用，20 年后使客户少了近 8 万美元。
      en: |-
        (a) X: 95,000 is actually invested, growing at 6% a year: $95{,}000 \times 1.06^{20} \approx 304{,}678$. Y: $100{,}000 \times 1.0695^{20} \approx 383{,}368$. The difference is about 78,690 dollars, about 20% of Y's final value.
        (b) The adviser gets a commission of 5,000 dollars (the fund's yearly fees may also include a part for the sales channel). The client (the principal) asks the adviser (the agent) to choose on the client's behalf, but the adviser's income comes from product commissions and is not aligned with the client's interest; and the client finds it hard to see how much better the other choice would be. The 5,000-dollar commission and the higher yearly fees leave the client almost 80,000 dollars poorer after 20 years.
    rubric:
      zh-cn:
        - "(a) 约 304,678 和 383,368，相差约 78,690。"
        - "(b) 佣金 5,000；用利益不一致和信息不对称说明。"
      en:
        - "(a) About 304,678 and 383,368, a difference of about 78,690."
        - "(b) Commission of 5,000; explained with misaligned interests and asymmetric information."
