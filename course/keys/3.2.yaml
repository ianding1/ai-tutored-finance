# Answer key for lesson 3.2. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[3.2#irr]] (section), [[concept:net-present-value]], [[check:Q3]], [[fig:3-1]].
# expected: values are recomputed by course/verify/3.2.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.
# Check questions are answered on the page: `correct` is true / false, or the letter of one of `choices`.
# A wrong answer shows the `why` of the chosen option (or the `hint` of a true / false question), never the
# right answer; `answer` is the full explanation for reference. They have no expected and no rubric.

lesson: "3.2"

context:
  - zh-cn: |-
      学习者学过现值、年金公式（[[0.1]]）、沉没成本（[[1.5]]）、Fisher 方程（[[1.3]]）。讲义还没有讲怎样估计资本成本（第 4 阶段）和期限结构（[[3.5]]）。金额保留两位小数，百分数用百分点表示。
    en: |-
      The learner has studied present value and the annuity formula ([[0.1]]), sunk costs ([[1.5]]) and the Fisher equation ([[1.3]]). The lesson has not yet covered how to estimate the cost of capital (Stage 4) or the term structure ([[3.5]]). Amounts to two decimals; percentages in percentage points.
  - concepts: [net-present-value, cost-of-capital]
    zh-cn: |-
      讲义：$\text{NPV} = \sum_t \frac{C_t}{(1 + r)^t}$；NPV 为正接受，互斥项目选 NPV 最大的；折现率是风险相同的投资的预期收益（机会成本）。增量现金流：不计沉没成本，计入机会成本、蚕食等副作用、营运资本和税（折旧减税，计算留给练习题）；美国联邦公司所得税率 21%（2018 年起）；名义与实际一致。
    en: |-
      The lesson: $\text{NPV} = \sum_t \frac{C_t}{(1 + r)^t}$; accept if NPV is positive and pick the largest NPV among mutually exclusive projects; the discount rate is the expected return on investments of the same risk (an opportunity cost). Incremental cash flows: exclude sunk costs; include opportunity costs, side effects such as cannibalization, working capital and taxes (the depreciation tax saving is left to an exercise); the US federal corporate tax rate is 21% (since 2018); nominal and real must be consistent.
  - concepts: [internal-rate-of-return, payback-period, profitability-index]
    zh-cn: |-
      讲义：IRR 使 NPV 为零；对单独的常规项目与 NPV 法则一致；陷阱：互斥项目（规模、时间）、多个 IRR、借款型项目、随期限变化的资本成本。[[fig:3-1]]：项目 A 的现金流 −100、60、50、20，项目 B 为 −100、10、20、115（第 0–3 年）；折现率滑块 0 到 25%，步长 0.5，默认 10；读数显示两个项目的 NPV。回收期忽略时间价值和后期现金流；$\text{PI} = \frac{\text{NPV}}{-C_0}$ 用于资本配给。
    en: |-
      The lesson: the IRR makes NPV zero; for a single conventional project it agrees with the NPV rule; pitfalls: mutually exclusive projects (scale, timing), multiple IRRs, borrowing-type projects, a cost of capital that varies with maturity. [[fig:3-1]]: project A has cash flows −100, 60, 50, 20 and project B −100, 10, 20, 115 (years 0–3); a discount-rate slider from 0 to 25% in steps of 0.5, default 10; the readout shows both NPVs. Payback ignores time value and later cash flows; $\text{PI} = \frac{\text{NPV}}{-C_0}$ is used under capital rationing.

common_errors:
  - questions: [C2, Q5]
    zh-cn: |-
      把沉没成本算进 NPV，或者漏掉机会成本和蚕食效应；把折旧当作现金流出。
    en: |-
      Including sunk costs in NPV, or leaving out opportunity costs and cannibalization; treating depreciation as a cash outflow.
  - questions: [C4, Q3]
    zh-cn: |-
      在互斥项目中选 IRR 较高的项目。规模和现金流时间不同时，应比较 NPV。
    en: |-
      Picking the project with the higher IRR among mutually exclusive projects. When scale or timing differ, compare NPVs.
  - questions: [Q1]
    zh-cn: |-
      用名义折现率折现实际现金流（或反过来），低估或高估了项目价值。
    en: |-
      Discounting real cash flows at a nominal rate (or the reverse), under- or overstating the project's value.
  - questions: [Q2]
    zh-cn: |-
      以为每个项目只有一个 IRR，并且 IRR 高于资本成本就一定应该接受。
    en: |-
      Thinking every project has exactly one IRR and should always be accepted when the IRR exceeds the cost of capital.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: npv
    concepts: [net-present-value, cost-of-capital, annuity]
    question:
      zh-cn: |-
        一家公司可以从银行以 6% 借到一个项目所需的全部资金，而风险相同的投资预期收益为 10%。计算这个项目的 NPV 应该用哪个折现率？
      en: |-
        A company can borrow all the money a project needs from a bank at 6%, while investments of the same risk are expected to earn 10%. Which discount rate should be used for the project's NPV?
    choices:
      - zh-cn: 6%，因为这是公司实际的融资成本
        en: 6%, because it is the company's actual financing cost
        why:
          zh-cn: "借款利率是银行所承担风险的价格。银行贷款优先偿还，风险低于这个项目的现金流，它的利率不能代表项目风险的价格。"
          en: "The loan rate is the price of the bank's risk. A bank loan is repaid first and is less risky than the project's cash flows, so its rate is not the price of the project's risk."
      - zh-cn: 10%，因为这是把钱投到风险相同的地方能得到的回报
        en: 10%, because it is what the money could earn in an investment of the same risk
      - zh-cn: 8%，取两者的平均
        en: 8%, the average of the two
        why:
          zh-cn: "取平均没有依据：折现率应该反映项目现金流本身的风险，与钱从哪里借来无关。"
          en: "Averaging has no basis: the discount rate should reflect the risk of the project's own cash flows, whatever the source of the money."
      - zh-cn: 无风险利率，因为未来现金流已经估计好了
        en: The risk-free rate, because the future cash flows are already estimated
        why:
          zh-cn: "项目的现金流是有风险的估计，不是确定的金额；用无风险利率折现会忽略这种风险。"
          en: "The project's cash flows are risky estimates, not certain amounts; discounting at the risk-free rate ignores that risk."
    correct: B
    answer:
      zh-cn: |-
        (B)。折现率是资本的机会成本，应反映项目现金流的风险：投资者把钱投到风险相同的地方能得到 10%。银行贷款优先偿还、风险较低，它的利率不是这个项目风险的价格。
      en: |-
        (B). The discount rate is the opportunity cost of capital and should reflect the risk of the project's cash flows: investors could earn 10% elsewhere at the same risk. A bank loan is repaid first and is less risky, so its rate is not the price of this project's risk.

  - id: C2
    kind: check
    section: cash-flows
    concepts: [net-present-value, sunk-cost]
    question:
      zh-cn: |-
        评估一个新产品项目时，下列哪一项不应计入项目的现金流？
      en: |-
        When evaluating a new product project, which of the following should not be included in the project's cash flows?
    choices:
      - zh-cn: 项目要用的一块闲置场地，现在可以出售得到的价格
        en: The price at which an idle piece of land the project will use could be sold now
        why:
          zh-cn: "这块场地如果不用于项目，可以卖掉换成现金。用于项目就放弃了这笔钱，这是项目的机会成本。"
          en: "If the land were not used for the project, it could be sold for cash. Using it gives up that money, which is an opportunity cost of the project."
      - zh-cn: 新产品使公司原有产品减少的现金流
        en: The cash flow the company's existing products lose because of the new product
        why:
          zh-cn: "原有产品减少的现金流是因为做了这个项目才发生的，属于项目带来的增量现金流。"
          en: "The lost cash flow of existing products happens because of the project, so it is part of the project's incremental cash flow."
      - zh-cn: 去年已经花掉的市场调研费用
        en: Market research costs already spent last year
      - zh-cn: 项目需要增加的存货
        en: The extra inventory the project needs
        why:
          zh-cn: "增加的存货要占用现金，而且是因为做项目才需要的。"
          en: "The extra inventory ties up cash, and it is needed only because of the project."
    correct: C
    answer:
      zh-cn: |-
        (C)。去年的调研费已经花掉，做不做项目都收不回来，是沉没成本。场地的出售价格是机会成本，原有产品减少的现金流和增加的存货都随项目而发生，应当计入。
      en: |-
        (C). Last year's research cost is already spent and cannot be recovered whether or not the project goes ahead: it is a sunk cost. The land's sale price is an opportunity cost, and the lost sales of existing products and the extra inventory happen because of the project, so they are included.

  - id: C3
    kind: check
    section: irr
    concepts: [internal-rate-of-return, net-present-value]
    widget: { id: npv-profile, set: { r: 15 } }
    question:
      zh-cn: |-
        对一个先付出、后收回的常规项目（例如 [[fig:3-1]] 中的项目 A），只要资本成本低于它的 IRR，它的 NPV 就一定为正。
      en: |-
        For a conventional project that pays out first and receives later (such as project A in [[fig:3-1]]), as long as the cost of capital is below its IRR, its NPV must be positive.
    correct: true
    hint:
      zh-cn: "想一想：常规项目的 NPV 随折现率怎样变化？NPV 曲线与横轴相交几次？"
      en: "Think: how does a conventional project's NPV change with the discount rate? How many times does its NPV curve cross the horizontal axis?"
    answer:
      zh-cn: |-
        对。常规项目的 NPV 随折现率上升而下降，只与横轴相交一次（在 IRR 处），所以折现率低于 IRR 时 NPV 为正，高于时为负，IRR 法则与 NPV 法则一致。
      en: |-
        True. A conventional project's NPV falls as the discount rate rises and crosses the horizontal axis only once (at the IRR), so the NPV is positive below the IRR and negative above it; the IRR rule and the NPV rule agree.

  - id: C4
    kind: check
    section: irr-pitfalls
    concepts: [internal-rate-of-return, net-present-value]
    widget: { id: npv-profile, set: { r: 5 } }
    question:
      zh-cn: |-
        [[fig:3-1]] 中项目 B 的 IRR（约 14.76%）低于项目 A（约 17.21%）。两个项目只能选一个，资本成本为 5%。应该怎样选？
      en: |-
        In [[fig:3-1]], project B's IRR (about 14.76%) is below project A's (about 17.21%). Only one of the two can be chosen, and the cost of capital is 5%. Which should be chosen?
    choices:
      - zh-cn: 选 A，因为它的 IRR 更高
        en: A, because its IRR is higher
        why:
          zh-cn: "IRR 的高低不等于 NPV 的大小。两个项目只能选一个时，要比较在资本成本下哪个创造的价值更多。"
          en: "A higher IRR does not mean a larger NPV. When only one project can be chosen, compare which creates more value at the cost of capital."
      - zh-cn: 选 B，因为在 5% 时它的 NPV 更大
        en: B, because its NPV is larger at 5%
      - zh-cn: 选 A，因为它回收得更快
        en: A, because it pays back faster
        why:
          zh-cn: "回收的快慢没有考虑回收之后的现金流，也没有考虑折现。"
          en: "How fast a project pays back ignores the cash flows after payback, and ignores discounting."
      - zh-cn: 两者一样好，因为两者的 NPV 都为正
        en: Either, because both NPVs are positive
        why:
          zh-cn: "两个项目只能选一个，NPV 都为正时，还要比较哪个更大。"
          en: "Only one can be chosen; when both NPVs are positive, you still have to compare which is larger."
    correct: B
    answer:
      zh-cn: |-
        (B)。互斥项目要比较 NPV。B 的现金流来得晚，折现率低时受益更多：在 5% 时 B 的 NPV 更大。两条 NPV 曲线约在 11.07% 相交，资本成本高于这个水平时才应选 A。IRR 的高低不等于 NPV 的大小。
      en: |-
        (B). Mutually exclusive projects are compared by NPV. B's cash flows come later and gain more from a low discount rate: at 5% B's NPV is larger. The two NPV curves cross at about 11.07%, and only above that should A be chosen. A higher IRR does not mean a larger NPV.

  - id: C5
    kind: check
    section: other-rules
    concepts: [payback-period]
    question:
      zh-cn: |-
        回收期较短的项目，NPV 一定较大。
      en: |-
        A project with a shorter payback period always has a larger NPV.
    correct: false
    hint:
      zh-cn: "想一想：回收期法怎样对待回收期之后的现金流？它有没有考虑折现？"
      en: "Think: how does the payback method treat cash flows after the payback date? Does it discount?"
    answer:
      zh-cn: |-
        错。回收期法不折现，而且完全忽略回收期之后的现金流。[[fig:3-1]] 中 A 回收得更快，但 B 第 3 年有一大笔现金流，资本成本为 5% 时 B 的 NPV 更大。
      en: |-
        False. The payback method does not discount and ignores all cash flows after the payback date. In [[fig:3-1]] A pays back faster, but B has a large cash flow in year 3, and at a 5% cost of capital B's NPV is larger.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: B
    concepts: [net-present-value, fisher-equation, real-interest-rate]
    expected: { right: "273.07", wrong: "257.71" }
    question:
      zh-cn: |-
        一个项目今后 3 年每年带来按今天的价格计算（实际）100 的现金流。名义资本成本为 8%，预期通胀为 3%。(a) 现金流的现值是多少？(b) 一位分析师直接用 8% 折现这些现金流，得到多少？他错在哪里，低估还是高估了项目的价值？
      en: |-
        A project brings cash flows of 100 a year for 3 years, stated in today's prices (real). The nominal cost of capital is 8% and expected inflation 3%. (a) What is the present value of the cash flows? (b) An analyst discounts these cash flows at 8% directly. What does he get? What is wrong, and does he under- or overstate the value?
    answer:
      zh-cn: |-
        (a) 实际资本成本 $\frac{1.08}{1.03} - 1 \approx 4.85\%$，现值 $100 \times \frac{1 - 1.0485^{-3}}{0.0485} \approx 273.07$。（也可以先换成名义现金流 $100 \times 1.03^t$ 再用 8% 折现，结果相同。）
        (b) 约 257.71，低估了：实际现金流不含通胀，却用了包含通胀的折现率。
      en: |-
        (a) The real cost of capital is $\frac{1.08}{1.03} - 1 \approx 4.85\%$, and the present value is $100 \times \frac{1 - 1.0485^{-3}}{0.0485} \approx 273.07$. (Converting to nominal flows $100 \times 1.03^t$ and discounting at 8% gives the same result.)
        (b) About 257.71, an understatement: the real cash flows exclude inflation but the rate includes it.
    rubric:
      zh-cn:
        - "(a) 约 273.07。"
        - "(b) 约 257.71，说明名义与实际不一致，低估。"
      en:
        - "(a) About 273.07."
        - "(b) About 257.71; explains the mismatch and the understatement."

  - id: Q2
    kind: exercise
    level: B
    star: true
    concepts: [internal-rate-of-return, net-present-value]
    expected: { i1: "10", i2: "20" }
    question:
      zh-cn: |-
        一个矿山项目：今天投资 100，第 1 年得到 230，第 2 年要付 132 的环境修复费用。(a) 用 $x = 1 + \text{IRR}$ 把 NPV = 0 写成一元二次方程，求出所有 IRR。(b) 资本成本在什么范围内这个项目值得做？为什么“IRR 高于资本成本就接受”在这里没有意义？
      en: |-
        A mine: invest 100 today, receive 230 in year 1, and pay 132 for environmental cleanup in year 2. (a) With $x = 1 + \text{IRR}$, write NPV = 0 as a quadratic equation and find all the IRRs. (b) For what range of the cost of capital is the project worth doing? Why does "accept if the IRR exceeds the cost of capital" make no sense here?
    answer:
      zh-cn: |-
        (a) $-100 + \frac{230}{x} - \frac{132}{x^2} = 0$，即 $100x^2 - 230x + 132 = 0$，$x = \frac{230 \pm 10}{200}$，$x = 1.1$ 或 $1.2$：IRR 为 10% 和 20%。
        (b) 只有资本成本在 10% 到 20% 之间时 NPV 为正（例如 15% 时 NPV 约 0.19，5% 和 25% 时为负）。现金流的符号变化了两次，NPV 曲线先升后降，有两个 IRR；拿哪一个和资本成本比较都不能给出正确结论，应直接看 NPV。
      en: |-
        (a) $-100 + \frac{230}{x} - \frac{132}{x^2} = 0$, so $100x^2 - 230x + 132 = 0$ and $x = \frac{230 \pm 10}{200}$, giving $x = 1.1$ or $1.2$: IRRs of 10% and 20%.
        (b) The NPV is positive only for a cost of capital between 10% and 20% (for example, about 0.19 at 15%, negative at 5% and 25%). The cash flows change sign twice, the NPV curve rises then falls, and there are two IRRs; comparing either with the cost of capital cannot give the right answer, so look at NPV directly.
    rubric:
      zh-cn:
        - "(a) 10% 和 20%。"
        - "(b) 10% 到 20%，说明多个 IRR 的原因。"
      en:
        - "(a) 10% and 20%."
        - "(b) 10% to 20%, explaining why there are several IRRs."

  - id: Q3
    kind: exercise
    level: C
    star: true
    concepts: [internal-rate-of-return, net-present-value]
    expected: { nx: "3.64", ny: "90.91", inc: "19.70" }
    question:
      zh-cn: |-
        资本成本为 10%，两个互斥项目：X 今天投资 10，一年后得到 15（IRR 50%）；Y 今天投资 1000，一年后得到 1200（IRR 20%）。(a) 应选哪个？(b) 计算“从 X 换成 Y”的增量现金流的 IRR。它为什么也能给出正确的选择？
      en: |-
        The cost of capital is 10%, and there are two mutually exclusive projects: X invests 10 today and receives 15 in a year (IRR 50%); Y invests 1000 today and receives 1200 in a year (IRR 20%). (a) Which should be chosen? (b) Compute the IRR of the incremental cash flows from "switching from X to Y". Why does it also give the right choice?
    answer:
      zh-cn: |-
        (a) X 的 NPV $-10 + \frac{15}{1.1} \approx 3.64$，Y 的 NPV $-1000 + \frac{1200}{1.1} \approx 90.91$，选 Y。IRR 是比率，不反映创造的价值有多少。
        (b) 增量现金流：今天 $-990$，一年后 $+1185$，增量 IRR $= \frac{1185}{990} - 1 \approx 19.70\%$。它回答的是“多投入的 990 是否值得”：高于 10%，所以值得，选 Y，与 NPV 一致。
      en: |-
        (a) X's NPV is $-10 + \frac{15}{1.1} \approx 3.64$ and Y's is $-1000 + \frac{1200}{1.1} \approx 90.91$: choose Y. The IRR is a ratio and does not show how much value is created.
        (b) Incremental cash flows: $-990$ today and $+1185$ in a year, so the incremental IRR is $\frac{1185}{990} - 1 \approx 19.70\%$. It answers "is the extra 990 worth investing?": it is above 10%, so yes, choose Y, as NPV says.
    rubric:
      zh-cn:
        - "(a) 约 3.64 和 90.91，选 Y。"
        - "(b) 约 19.70%，说明增量 IRR 的含义。"
      en:
        - "(a) About 3.64 and 90.91; choose Y."
        - "(b) About 19.70%, explaining what the incremental IRR measures."

  - id: Q4
    kind: exercise
    level: B
    concepts: [profitability-index, net-present-value]
    expected: { best: "27" }
    question:
      zh-cn: |-
        预算为 100，项目不能分割：P1 投资 100，NPV 20；P2 投资 50，NPV 15；P3 投资 50，NPV 12。(a) 应该做哪些项目？(b) 如果 P3 的投资改为 60，答案会怎样变化？这说明按盈利指数排序有什么局限？
      en: |-
        The budget is 100, and projects cannot be split: P1 invests 100 with NPV 20; P2 invests 50 with NPV 15; P3 invests 50 with NPV 12. (a) Which projects should be done? (b) If P3 needs 60 instead, how does the answer change? What limitation of ranking by profitability index does this show?
    answer:
      zh-cn: |-
        (a) 盈利指数 P1 0.2、P2 0.3、P3 0.24。选 P2 和 P3，正好用完 100，总 NPV $15 + 12 = 27$，大于只做 P1 的 20。
        (b) P2 + P3 需要 110，超出预算；可行的是只做 P1（20）、只做 P2（15）或只做 P3（12），应选 P1。按盈利指数先选 P2 后，剩下的 50 不够做 P3，只得到 15。项目不能分割时，要比较所有可行组合的总 NPV。
      en: |-
        (a) The profitability indexes are P1 0.2, P2 0.3, P3 0.24. Choose P2 and P3, using exactly 100, for a total NPV of $15 + 12 = 27$, more than 20 from P1 alone.
        (b) P2 + P3 now needs 110, over budget; the feasible choices are P1 alone (20), P2 alone (15) or P3 alone (12), so choose P1. Ranking by PI would pick P2 first and leave 50, not enough for P3, giving only 15. With indivisible projects, compare the total NPV of all feasible combinations.
    rubric:
      zh-cn:
        - "(a) P2 和 P3，总 NPV 27。"
        - "(b) 选 P1，并说明不可分割时的局限。"
      en:
        - "(a) P2 and P3, total NPV 27."
        - "(b) Chooses P1 and explains the limitation with indivisible projects."

  - id: Q5
    kind: exercise
    level: B
    concepts: [net-present-value, annuity]
    expected: { shield: "42", pv: "159.21" }
    question:
      zh-cn: |-
        一台设备今天花费 1000，按 5 年直线折旧（每年 200），公司所得税率为 21%，资本成本为 10%。(a) 折旧每年少交的税，现值合计是多少？(b) 如果税法允许第一年就把 1000 全部扣除，这部分节税的现值会变大还是变小？为什么？
      en: |-
        A machine costs 1000 today and is depreciated straight-line over 5 years (200 a year); the corporate tax rate is 21% and the cost of capital 10%. (a) What is the present value of the tax saved each year because of depreciation? (b) If tax law allowed the whole 1000 to be deducted in the first year, would the present value of the tax savings be larger or smaller? Why?
    answer:
      zh-cn: |-
        (a) 折旧减少应税利润，每年少交 $200 \times 21\% = 42$；现值 $42 \times \frac{1 - 1.1^{-5}}{0.1} \approx 159.21$。
        (b) 变大：节税的总额同样是 210，但来得更早，折现损失更少（第一年末得到 210，现值约 190.91）。所以加速折旧提高了投资的 NPV。
      en: |-
        (a) Depreciation lowers taxable profit, saving $200 \times 21\% = 42$ a year; the present value is $42 \times \frac{1 - 1.1^{-5}}{0.1} \approx 159.21$.
        (b) Larger: the total saving is the same 210, but it comes sooner, so less is lost to discounting (210 at the end of year 1 has a present value of about 190.91). So faster depreciation raises the NPV of investment.
    rubric:
      zh-cn:
        - "(a) 约 159.21。"
        - "(b) 变大，用时间价值解释。"
      en:
        - "(a) About 159.21."
        - "(b) Larger, explained by the time value of money."
