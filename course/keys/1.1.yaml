# Answer key for lesson 1.1. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.4]] (lesson), [[1.1#equilibrium]] (section), [[concept:demand]], [[check:Q4]].
# expected: values are recomputed by course/verify/1.1.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "1.1"

context:
  - zh-cn: |-
      学习者学过导数、一阶条件、边际收入和边际成本（[[0.2]]）。本课是微观经济学的第一课；还没有学消费者理论（[[1.2]]）、生产者理论（[[1.5]]）和税收归宿（[[1.8]]）。
    en: |-
      The learner has studied derivatives, first-order conditions, marginal revenue and marginal cost ([[0.2]]). This is the first lesson of microeconomics; the learner has not yet studied consumer theory ([[1.2]]), producer theory ([[1.5]]) or tax incidence ([[1.8]]).
  - concepts: [demand, supply, market-equilibrium, comparative-statics]
    zh-cn: |-
      讲义例子：咖啡豆需求 $Q_d = 100 - 2P$，供给 $Q_s = -20 + 4P$（$P \ge 5$），均衡 $P^* = 20$、$Q^* = 60$；价格 25 时过剩 30，价格 15 时短缺 30。收入上升使需求变为 $Q_d = 130 - 2P$，新均衡 $P^* = 25$、$Q^* = 80$。讲义区分了沿曲线移动（价格变化）和整条曲线移动（其他条件变化），给出比较静态的三个步骤。讲义没有讨论需求和供给同时移动的情形。
    en: |-
      Example in the lesson: coffee bean demand $Q_d = 100 - 2P$ and supply $Q_s = -20 + 4P$ ($P \ge 5$), equilibrium $P^* = 20$ and $Q^* = 60$; at a price of 25 there is a surplus of 30, at 15 a shortage of 30. Higher income changes demand to $Q_d = 130 - 2P$, with the new equilibrium $P^* = 25$ and $Q^* = 80$. The lesson distinguishes a movement along a curve (a price change) from a shift of the whole curve (a change in other conditions) and gives three steps for comparative statics. The lesson does not discuss demand and supply shifting at the same time.
  - questions: [C2]
    zh-cn: |-
      [[fig:4-1]] 的需求为 $Q_d = 100 + \Delta D - 2P$，供给为 $Q_s = -20 + \Delta S + 4P$，滑块 $\Delta D$、$\Delta S$ 从 −30 到 30，步长 5。
    en: |-
      In [[fig:4-1]], demand is $Q_d = 100 + \Delta D - 2P$ and supply is $Q_s = -20 + \Delta S + 4P$; the sliders $\Delta D$ and $\Delta S$ go from −30 to 30 in steps of 5.
  - concepts: [price-elasticity]
    zh-cn: |-
      讲义定义 $\varepsilon = \frac{dQ}{dP} \cdot \frac{P}{Q}$，按绝对值分为富有弹性、缺乏弹性和单位弹性；给出中点法公式；例：$Q = 100 - 2P$ 在 $P = 20$ 处 $\varepsilon \approx -0.67$。讲义列出影响弹性的因素：替代品、占支出的比例、必需品、时间长短。讲义没有说明弹性是否沿直线需求曲线变化，也没有给出弹性与总收入的关系（留给练习题）。
    en: |-
      The lesson defines $\varepsilon = \frac{dQ}{dP} \cdot \frac{P}{Q}$, classifies it by absolute value as elastic, inelastic or unit elastic, and gives the midpoint (arc) formula; example: $Q = 100 - 2P$ at $P = 20$ gives $\varepsilon \approx -0.67$. The lesson lists what affects elasticity: substitutes, the share of spending, necessity and the time horizon. The lesson does not say whether elasticity changes along a linear demand curve and does not give the relation between elasticity and total revenue (left to exercises).
  - concepts: [income-elasticity, cross-price-elasticity]
    zh-cn: |-
      讲义定义收入弹性（正常品、奢侈品 $> 1$、必需品 $0$ 到 $1$、劣等品 $< 0$）和交叉价格弹性（替代品 $> 0$、互补品 $< 0$），并提到必需品公司的收入受经济衰退影响较小、定价能力与需求缺乏弹性有关。
    en: |-
      The lesson defines the income elasticity (normal goods, luxuries $> 1$, necessities between $0$ and $1$, inferior goods $< 0$) and the cross-price elasticity (substitutes $> 0$, complements $< 0$), and mentions that companies selling necessities see their revenue affected less by recessions and that pricing power is related to inelastic demand.

common_errors:
  - questions: [Q2]
    zh-cn: |-
      以为利润最大化的公司会把价格定在需求缺乏弹性的区间。在那里提价既增加收入，又减少产量和成本，利润一定还能提高。
    en: |-
      Thinking a profit-maximizing firm may set its price where demand is inelastic. There a price rise both raises revenue and lowers output and cost, so profit can always be increased.
  - questions: [Q4]
    zh-cn: |-
      把整个市场的结果套到单个生产者身上。需求缺乏弹性时，全体歉收使价格大涨、总收入增加；只有自己一家歉收时价格几乎不变，收入随产量下降。
    en: |-
      Applying the result for the whole market to a single producer. With inelastic demand, a general poor harvest raises the price a lot and total revenue rises; when only one farm has a poor harvest the price hardly changes, and its revenue falls with its output.
  - questions: [Q6]
    zh-cn: |-
      只用自身的价格弹性分析提价，忽略竞争对手同时涨价时，交叉价格弹性使需求向自己这边移动。
    en: |-
      Analyzing a price rise with the own-price elasticity only, ignoring that when competitors raise prices at the same time, the cross-price elasticity shifts demand toward the firm.
  - questions: [C1]
    zh-cn: |-
      把短缺和过剩弄反：价格低于均衡时需求量大于供给量，是短缺。
    en: |-
      Confusing a shortage with a surplus: below the equilibrium price the quantity demanded exceeds the quantity supplied, which is a shortage.
  - questions: [C2, Q3]
    zh-cn: |-
      把沿曲线的移动当成曲线移动：例如需求增加使价格上升后，说“供给也增加了”。供给曲线没有动，增加的是供给量。
    en: |-
      Treating a movement along a curve as a shift of the curve: for example, saying that "supply also increased" after higher demand raised the price. The supply curve did not move; the quantity supplied increased.
  - questions: [C3, Q1, Q5]
    zh-cn: |-
      用斜率代替弹性，或把弹性算成 $\frac{dQ}{dP} \cdot \frac{Q}{P}$（比值写反）。
    en: |-
      Using the slope instead of the elasticity, or computing $\frac{dQ}{dP} \cdot \frac{Q}{P}$ (the ratio upside down).

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: equilibrium
    concepts: [market-equilibrium, demand, supply]
    question:
      zh-cn: |-
        政府规定一种商品的价格不得超过某个水平，而这个上限低于均衡价格。市场上会出现：
      en: |-
        The government caps a good's price at a level below the equilibrium price. The market will have:
    choices:
      - zh-cn: 短缺：买方想买的数量多于卖方愿意卖的数量
        en: 'A shortage: buyers want more than sellers are willing to sell'
      - zh-cn: 过剩：卖方卖不出去
        en: 'A surplus: sellers cannot sell all they offer'
        why:
          zh-cn: 价格低于均衡时，沿着需求曲线需求量是增加还是减少？沿着供给曲线供给量呢？
          en: Below the equilibrium price, does the quantity demanded rise or fall along the demand curve? And the quantity supplied along the supply curve?
      - zh-cn: 仍然是均衡，只是价格更低
        en: Still an equilibrium, only at a lower price
        why:
          zh-cn: 均衡要求需求量等于供给量。在这个上限价格下，两者相等吗？
          en: Equilibrium requires the quantity demanded to equal the quantity supplied. Are they equal at the capped price?
      - zh-cn: 供给曲线向左移动
        en: A shift of the supply curve to the left
        why:
          zh-cn: 价格的变化会使整条供给曲线移动，还是沿着供给曲线移动？
          en: Does a change in price shift the whole supply curve, or move along it?
    correct: A
    answer:
      zh-cn: |-
        (A)。价格低于均衡时，需求量大于均衡数量，供给量小于均衡数量，出现短缺。价格不能上升来消除短缺，于是会出现排队、配给或黑市。供给曲线本身没有移动，只是沿着它移动到了较少的供给量。
      en: |-
        (A). Below the equilibrium price, the quantity demanded exceeds the equilibrium quantity and the quantity supplied falls short of it, so there is a shortage. The price cannot rise to remove it, so queues, rationing or black markets appear. The supply curve itself does not shift; the market only moves along it to a smaller quantity supplied.

  - id: C2
    kind: check
    section: comparative-statics
    concepts: [comparative-statics, supply]
    widget: { id: supply-demand, set: { dS: -30 } }
    question:
      zh-cn: |-
        在 [[fig:4-1]] 中保持 $\Delta D = 0$，把 $\Delta S$ 调到 −30（例如产区歉收），与讲义中收入上升的例子比较：
      en: |-
        In [[fig:4-1]], keep $\Delta D = 0$ and set $\Delta S$ to −30 (for example, a poor harvest). Compared with the lesson's example of rising incomes:
    choices:
      - zh-cn: 两个例子中价格都上升，但数量的变化方向相反
        en: The price rises in both examples, but the quantity moves in opposite directions
      - zh-cn: 两个例子中价格和数量都上升
        en: Both the price and the quantity rise in both examples
        why:
          zh-cn: 看图中的读数：供给减少时，均衡数量比 60 多还是少？
          en: 'Look at the readout: when supply falls, is the equilibrium quantity above or below 60?'
      - zh-cn: 歉收时价格下降，数量也下降
        en: With the poor harvest, both the price and the quantity fall
        why:
          zh-cn: 供给曲线向左移动后，在原来的价格 20 美元下，是过剩还是短缺？价格会向哪个方向调整？
          en: After the supply curve shifts left, is there a surplus or a shortage at the old price of 20 dollars? Which way does the price adjust?
      - zh-cn: 歉收时价格上升，数量不变
        en: With the poor harvest, the price rises and the quantity stays the same
        why:
          zh-cn: 价格上升时，买方会沿着需求曲线减少购买吗？
          en: When the price rises, do buyers move along the demand curve and buy less?
    correct: A
    answer:
      zh-cn: |-
        (A)。供给减少后，均衡价格升到 25 美元，数量降到 50；收入上升时价格升到 25 美元，数量增加到 80。只看到价格上涨，不能判断是需求还是供给变了，要同时看数量。
      en: |-
        (A). After supply falls, the equilibrium price rises to 25 dollars and the quantity falls to 50; with rising incomes the price rises to 25 dollars and the quantity grows to 80. A price rise alone does not tell whether demand or supply changed; the quantity must be looked at as well.

  - id: C3
    kind: check
    section: price-elasticity
    concepts: [price-elasticity]
    question:
      zh-cn: |-
        下面哪种商品的需求最可能富有弹性？
      en: |-
        Which good's demand is most likely to be elastic?
    choices:
      - zh-cn: 某一个品牌的瓶装水
        en: One particular brand of bottled water
      - zh-cn: 糖尿病患者需要的胰岛素
        en: Insulin for people with diabetes
        why:
          zh-cn: 病人有没有相近的替代品？它是必需品吗？
          en: Do patients have close substitutes? Is it a necessity?
      - zh-cn: 食盐
        en: Table salt
        why:
          zh-cn: 食盐占家庭支出的比例有多大？涨价一倍，人们会少吃很多盐吗？
          en: How large a share of household spending is salt? If its price doubled, would people use much less?
      - zh-cn: 一周之内的汽油
        en: Gasoline over one week
        why:
          zh-cn: 一周之内，开车的人有多少办法换车、搬家或改变通勤方式？
          en: Within a week, how many ways do drivers have to change cars, move or commute differently?
    correct: A
    answer:
      zh-cn: |-
        (A)。一个品牌的瓶装水有很多几乎相同的替代品（其他品牌），涨价后买方很容易转向别的品牌，需求富有弹性。胰岛素是没有替代品的必需品；食盐占支出的比例很小；汽油在一周之内很难找到替代，需求都缺乏弹性。注意：“瓶装水”整体的需求比某一个品牌的需求缺乏弹性得多。
      en: |-
        (A). One brand of bottled water has many nearly identical substitutes (other brands), so after a price rise buyers easily switch, and demand is elastic. Insulin is a necessity with no substitute; salt is a tiny share of spending; gasoline is hard to replace within a week; all of these have inelastic demand. Note that demand for bottled water as a whole is much less elastic than demand for one brand.

  - id: C4
    kind: check
    section: other-elasticities
    concepts: [income-elasticity, cross-price-elasticity]
    question:
      zh-cn: |-
        经济衰退、收入下降时，收入弹性为负的商品，销量会下降。
      en: |-
        In a recession, when incomes fall, sales of goods with a negative income elasticity fall.
    correct: false
    hint:
      zh-cn: 收入弹性为负，表示收入和需求量向同一方向还是相反方向变化？
      en: Does a negative income elasticity mean income and the quantity demanded move in the same or opposite directions?
    answer:
      zh-cn: |-
        错。收入弹性为负的是劣等品，收入和需求量反向变化：收入下降时，人们会多买这类较便宜的替代品，销量反而上升。例如收入下降时，人们少坐飞机、多乘长途大巴。
      en: |-
        False. Goods with a negative income elasticity are inferior goods: income and the quantity demanded move in opposite directions. When incomes fall, people buy more of these cheaper substitutes, so sales rise. For example, with lower incomes people fly less and take long-distance buses more.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [price-elasticity]
    expected: { e10: "-0.25", e25: "-1", e40: "-4" }
    question:
      zh-cn: |-
        判断真假并说明理由：需求曲线是一条直线，斜率处处相同，所以沿着这条需求曲线，需求的价格弹性也处处相同。用 $Q = 100 - 2P$ 在 $P = 10$、$25$、$40$ 处的弹性说明。
      en: |-
        Determine whether this statement is true or false, and explain: a demand curve is a straight line with the same slope everywhere, so the price elasticity of demand is also the same everywhere along it. Use the elasticity of $Q = 100 - 2P$ at $P = 10$, $25$ and $40$ to illustrate.
    answer:
      zh-cn: |-
        假。弹性 $\varepsilon = \frac{dQ}{dP} \cdot \frac{P}{Q}$ 除了斜率，还取决于 $\frac{P}{Q}$，而沿着直线需求曲线，价格越高、数量越小，$\frac{P}{Q}$ 越大。
        $P = 10$：$Q = 80$，$\varepsilon = -2 \times \frac{10}{80} = -0.25$；$P = 25$：$Q = 50$，$\varepsilon = -1$；$P = 40$：$Q = 20$，$\varepsilon = -4$。
        直线需求曲线在价格低的一段缺乏弹性，在价格高的一段富有弹性，中点处是单位弹性。
      en: |-
        False. The elasticity $\varepsilon = \frac{dQ}{dP} \cdot \frac{P}{Q}$ depends on $\frac{P}{Q}$ as well as on the slope, and along a linear demand curve, a higher price comes with a smaller quantity, so $\frac{P}{Q}$ rises.
        $P = 10$: $Q = 80$ and $\varepsilon = -2 \times \frac{10}{80} = -0.25$; $P = 25$: $Q = 50$ and $\varepsilon = -1$; $P = 40$: $Q = 20$ and $\varepsilon = -4$.
        A linear demand curve is inelastic at low prices, elastic at high prices and unit elastic at its midpoint.
    rubric:
      zh-cn:
        - "结论为假。"
        - "指出弹性还取决于 $P/Q$。"
        - "三个弹性 −0.25、−1、−4。"
      en:
        - "States false."
        - "Points out that the elasticity also depends on $P/Q$."
        - "The three elasticities −0.25, −1 and −4."

  - id: Q2
    kind: exercise
    level: C
    star: true
    concepts: [price-elasticity, marginal-revenue, first-order-condition]
    question:
      zh-cn: |-
        (a) 总收入 $R = P \cdot Q(P)$。证明 $\frac{dR}{dP} = Q\,(1 + \varepsilon)$，并说明需求富有弹性和缺乏弹性时，提价分别使收入增加还是减少。
        (b) 一家利润最大化的公司（成本随产量增加）会把价格定在需求缺乏弹性的区间吗？用 (a) 的结论说明。
      en: |-
        (a) Total revenue is $R = P \cdot Q(P)$. Show that $\frac{dR}{dP} = Q\,(1 + \varepsilon)$, and explain whether a price increase raises or lowers revenue when demand is elastic and when it is inelastic.
        (b) Would a profit-maximizing company (whose cost rises with output) set its price in the range where demand is inelastic? Use the result of (a) to explain.
    answer:
      zh-cn: |-
        (a) $\frac{dR}{dP} = Q + P\,\frac{dQ}{dP} = Q\left(1 + \frac{dQ}{dP} \cdot \frac{P}{Q}\right) = Q\,(1 + \varepsilon)$。$\varepsilon < -1$（富有弹性）时 $1 + \varepsilon < 0$，提价使收入减少；$-1 < \varepsilon < 0$（缺乏弹性）时提价使收入增加；$\varepsilon = -1$ 时收入最大。
        (b) 不会。在缺乏弹性的区间，提价使收入增加，同时产量减少使成本下降，利润一定增加，所以公司会继续提价，直到进入富有弹性的区间。
      en: |-
        (a) $\frac{dR}{dP} = Q + P\,\frac{dQ}{dP} = Q\left(1 + \frac{dQ}{dP} \cdot \frac{P}{Q}\right) = Q\,(1 + \varepsilon)$. When $\varepsilon < -1$ (elastic), $1 + \varepsilon < 0$ and a price increase lowers revenue; when $-1 < \varepsilon < 0$ (inelastic), a price increase raises revenue; revenue is highest at $\varepsilon = -1$.
        (b) No. In the inelastic range a price increase raises revenue, and the lower output lowers cost, so profit must rise; the company would keep raising the price until it is in the elastic range.
    rubric:
      zh-cn:
        - "(a) 用乘积法则推出公式，并正确说明两种情形。"
        - "(b) 结论为不会，理由同时用到收入增加和成本下降。"
      en:
        - "(a) Derives the formula with the product rule and states both cases correctly."
        - "(b) Concludes no, with a reason that uses both the higher revenue and the lower cost."

  - id: Q3
    kind: exercise
    level: B
    concepts: [comparative-statics, market-equilibrium]
    question:
      zh-cn: |-
        讲义中的咖啡豆市场（$Q_d = 100 - 2P$，$Q_s = -20 + 4P$）中，需求在每个价格下增加 $a$，供给在每个价格下增加 $b$（$a, b > 0$）。均衡数量一定增加吗？均衡价格呢？在什么条件下价格上升？
      en: |-
        In the coffee bean market of the lesson ($Q_d = 100 - 2P$, $Q_s = -20 + 4P$), demand rises by $a$ and supply rises by $b$ at every price ($a, b > 0$). Does the equilibrium quantity always rise? What about the equilibrium price? Under what condition does the price rise?
    answer:
      zh-cn: |-
        $100 + a - 2P = -20 + b + 4P$，$P^* = 20 + \frac{a - b}{6}$，$Q^* = 60 + \frac{4a + 2b}{6}$。
        数量一定增加（两个移动都使数量增加）。价格的方向不确定：需求增加推高价格，供给增加压低价格；$a > b$ 时价格上升，$a < b$ 时价格下降，$a = b$ 时不变（在这两条曲线的斜率下）。只知道两条曲线都向右移动，不能判断价格的方向。
      en: |-
        $100 + a - 2P = -20 + b + 4P$ gives $P^* = 20 + \frac{a - b}{6}$ and $Q^* = 60 + \frac{4a + 2b}{6}$.
        The quantity always rises (both shifts raise it). The direction of the price is ambiguous: higher demand pushes it up and higher supply pushes it down; the price rises when $a > b$, falls when $a < b$ and does not change when $a = b$ (with these slopes). Knowing only that both curves shift to the right is not enough to tell which way the price moves.
    rubric:
      zh-cn:
        - "数量一定增加，价格方向不确定，并给出价格上升的条件。"
      en:
        - "The quantity always rises, the price direction is ambiguous, and the condition for a price rise is given."

  - id: Q4
    kind: exercise
    level: C
    concepts: [price-elasticity, comparative-statics]
    expected: { price_up: "56.25", rev_up: "25" }
    question:
      zh-cn: |-
        某种农产品的需求为 $Q = A\,P^{-0.5}$，每一点的价格弹性都是 −0.5。
        (a) 一年歉收，供应到市场的数量比正常年份少 20%，全部卖出。价格上升多少？农民的总收入变化多少？
        (b) 为什么全体农民在歉收年的收入反而可能更高，而只有自己一家歉收的农民收入会下降？
      en: |-
        Demand for a farm product is $Q = A\,P^{-0.5}$, with a price elasticity of −0.5 at every point.
        (a) In a year with a poor harvest, the quantity brought to market is 20% below a normal year, and all of it is sold. By how much does the price rise? How much does the farmers' total revenue change?
        (b) Why can farmers as a whole earn more in a year with a poor harvest, while a single farmer whose own harvest alone is poor earns less?
    answer:
      zh-cn: |-
        (a) $P = (Q/A)^{-2}$。数量变为原来的 0.8 倍，价格变为原来的 $0.8^{-2} = 1.5625$ 倍，上升 56.25%。总收入变为 $1.5625 \times 0.8 = 1.25$ 倍，增加 25%。
        (b) 需求缺乏弹性：全体农民的产量减少时，市场价格上升的百分比大于数量减少的百分比，总收入增加。只有一家农民歉收时，他的产量太小，不影响市场价格，他按原价出售更少的产品，收入下降。
      en: |-
        (a) $P = (Q/A)^{-2}$. The quantity is 0.8 times its normal level, so the price is $0.8^{-2} = 1.5625$ times its normal level, a rise of 56.25%. Total revenue is $1.5625 \times 0.8 = 1.25$ times its normal level, an increase of 25%.
        (b) Demand is inelastic: when all farmers produce less, the market price rises by a larger percentage than the quantity falls, so total revenue rises. When only one farmer has a poor harvest, his output is too small to affect the market price; he sells less at the old price and earns less.
    rubric:
      zh-cn:
        - "(a) 价格上升 56.25%，总收入增加 25%。"
        - "(b) 区分全体（价格随总产量变化）与个体（价格不变）。"
      en:
        - "(a) The price rises 56.25% and total revenue rises 25%."
        - "(b) Distinguishes all farmers (the price moves with total output) from one farmer (the price does not change)."

  - id: Q5
    kind: exercise
    level: B
    concepts: [price-elasticity]
    expected: { mid: "-0.82" }
    question:
      zh-cn: |-
        一家书店把某本书的价格从 4 美元提高到 5 美元，每周销量从 120 本降到 100 本。以起点为基数，涨价时算出的弹性约为 −0.67；而反过来从 5 美元降到 4 美元时，算出的弹性是 −1。用中点法计算弹性，并说明为什么中点法更适合描述这两组数据之间的弹性。
      en: |-
        A bookstore raises the price of a book from 4 dollars to 5 dollars, and weekly sales fall from 120 copies to 100. Using the starting point as the base, the price rise gives an elasticity of about −0.67, while going the other way, from 5 dollars to 4, gives −1. Compute the elasticity with the midpoint method, and explain why the midpoint method is better for describing the elasticity between these two observations.
    answer:
      zh-cn: |-
        $\frac{-20/110}{1/4.5} \approx \frac{-18.2\%}{22.2\%} \approx -0.82$。
        同一段需求曲线，按方向不同、以起点为基数会得到不同的弹性；中点法用两点的平均值作基数，无论从哪个方向计算结果都相同，所以更适合描述两点之间的弹性。
      en: |-
        $\frac{-20/110}{1/4.5} \approx \frac{-18.2\%}{22.2\%} \approx -0.82$.
        For the same stretch of the demand curve, using the starting point as the base gives a different elasticity depending on the direction; the midpoint method uses the averages of the two points as the base, so it gives the same result in either direction and is better for describing the elasticity between the two points.
    rubric:
      zh-cn:
        - "约 −0.82。"
        - "说明中点法的结果与方向无关。"
      en:
        - "About −0.82."
        - "Explains that the midpoint result does not depend on the direction."

  - id: Q6
    kind: exercise
    level: C
    concepts: [price-elasticity, cross-price-elasticity]
    expected: { rev: "4.5", dq: "-2", rev2: "7.8" }
    question:
      zh-cn: |-
        一家流媒体公司把月费从 10 美元提高到 11 美元，订阅人数减少了 5%（其他条件不变）。
        (a) 月费收入变化了百分之几？
        (b) 假设竞争对手同时也涨价 10%，而这家公司订阅人数对竞争对手价格的交叉价格弹性是 0.3。这家公司的订阅人数和月费收入大约会变化多少？为什么同行一起涨价时，提价的效果更好？
      en: |-
        A streaming company raises its monthly fee from 10 dollars to 11 dollars, and the number of subscribers falls 5% (other things equal).
        (a) By what percentage does the fee revenue change?
        (b) Suppose a competitor also raises its price by 10% at the same time, and the cross-price elasticity of this company's subscribers with respect to the competitor's price is 0.3. By about how much do this company's subscribers and fee revenue change? Why does a price increase work better when competitors raise their prices too?
    answer:
      zh-cn: |-
        (a) 收入变为原来的 $1.1 \times 0.95 = 1.045$ 倍，增加 4.5%（需求缺乏弹性，弹性为 −0.5）。
        (b) 订阅人数约变化 $-0.5 \times 10\% + 0.3 \times 10\% = -2$%。收入约变为 $1.1 \times 0.98 = 1.078$ 倍，增加约 7.8%。两家是替代品：竞争对手涨价使一部分用户留下或转过来，抵消了本公司涨价造成的流失。
      en: |-
        (a) Revenue becomes $1.1 \times 0.95 = 1.045$ times the original, an increase of 4.5% (demand is inelastic, with elasticity −0.5).
        (b) Subscribers change by about $-0.5 \times 10\% + 0.3 \times 10\% = -2$%. Revenue becomes about $1.1 \times 0.98 = 1.078$ times the original, an increase of about 7.8%. The two services are substitutes: the competitor's price increase keeps some users or brings some over, which offsets the loss caused by this company's own increase.
    rubric:
      zh-cn:
        - "(a) 收入增加 4.5%。"
        - "(b) 人数约减少 2%，收入约增加 7.8%，并用替代品解释。"
      en:
        - "(a) Revenue rises 4.5%."
        - "(b) Subscribers fall about 2%, revenue rises about 7.8%, explained with substitutes."
