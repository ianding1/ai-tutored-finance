#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "3.1"

context:
  - zh-cn: |-
      学习者学过货币时间价值（[[0.1]]）、方差、标准差与分散化（[[0.3]]）、逆向选择和道德风险（[[1.9]]）、银行、挤兑与存款保险（[[2.3]]）。百分数的计算用百分点表示。
    en: |-
      The learner has studied the time value of money ([[0.1]]), variance, standard deviation and diversification ([[0.3]]), adverse selection and moral hazard ([[1.9]]), and banks, runs and deposit insurance ([[2.3]]). Percentage calculations are in percentage points.
  - concepts: [financial-intermediary, money-market, capital-market, primary-market, secondary-market]
    zh-cn: |-
      讲义：金融体系的功能（跨时间转移资源、分担风险、汇集资金、生产信息）；直接融资与间接融资；中介的理由（分散化、信息成本、期限与流动性转换）。货币市场（一年以内：短期国债、商业票据、回购；货币市场基金资产 2025 年 12 月初约 7.65 万亿美元，ICI）与资本市场；债务与股票的区别。一级市场（IPO、承销）与二级市场（流动性、价格发现）。
    en: |-
      The lesson: functions of the financial system (moving resources over time, sharing risk, pooling funds, producing information); direct and indirect finance; reasons for intermediaries (diversification, information costs, maturity and liquidity transformation). The money market (up to a year: Treasury bills, commercial paper, repo; money market fund assets about 7.65 trillion dollars in early December 2025, ICI) and the capital market; debt versus equity. Primary market (IPO, underwriting) and secondary market (liquidity, price discovery).
  - concepts: [market-maker, bid-ask-spread, short-selling, limit-order]
    zh-cn: |-
      讲义：做市商报出买价和卖价；价差是立即交易的成本，也补偿逆向选择；美国股票 2024 年 5 月 28 日起 T+1 结算。卖空：借股卖出、以后买回，要支付股息，潜在损失无上限。市价单、限价单、止损单；订单簿与价格冲击。[[fig:5-1]] 的订单簿：中间价 100.00；卖单 100.05 × 500、100.10 × 500、100.20 × 1000、100.40 × 2000；买单 99.95 × 500、99.90 × 800、99.80 × 1000、99.60 × 2000；市价买单股数滑块 100 到 4000，步长 100，默认 500；读数显示平均成交价、比中间价高的百分比和多付的金额。
    en: |-
      The lesson: market makers quote bid and ask prices; the spread is the cost of trading immediately and also compensates for adverse selection; US stocks have settled T+1 since May 28, 2024. Short selling: borrow shares, sell them, buy back later; the short seller pays dividends; the potential loss is unlimited. Market, limit and stop orders; the order book and price impact. The order book of [[fig:5-1]]: midpoint 100.00; asks 100.05 × 500, 100.10 × 500, 100.20 × 1000, 100.40 × 2000; bids 99.95 × 500, 99.90 × 800, 99.80 × 1000, 99.60 × 2000; a market-buy size slider from 100 to 4000 in steps of 100, default 500; the readout shows the average price, its percentage above the midpoint and the extra amount paid.

common_errors:
  - questions: [C1, Q1]
    zh-cn: |-
      以为分散化可以消除所有风险。贷款的违约在衰退中会同时上升，相关的风险不能靠增加贷款数量分散掉。
    en: |-
      Thinking that diversification removes all risk. Loan defaults rise together in recessions, and correlated risk cannot be diversified away by making more loans.
  - questions: [C2, C3, Q4]
    zh-cn: |-
      忽略交易成本，以为按中间价或最近的成交价就能买卖。立即买入付卖价、立即卖出得买价，大单还有价格冲击。
    en: |-
      Ignoring trading costs and assuming one can trade at the midpoint or the last trade price. Immediate buys pay the ask, immediate sells get the bid, and large orders also have price impact.
  - questions: [Q2]
    zh-cn: |-
      计算卖空的盈亏时忘记卖空者要支付股息，或者以为卖空的最大损失是投入的保证金。
    en: |-
      Forgetting that the short seller pays the dividends, or thinking that the largest loss on a short sale is the margin put up.
  - questions: [Q3]
    zh-cn: |-
      以为二级市场的交易会给企业带来资金。只有一级市场的发行才为企业筹资。
    en: |-
      Thinking that trading in the secondary market raises money for the company. Only issuance in the primary market does.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: intermediation
    concepts: [financial-intermediary, diversification, standard-deviation]
    question:
      zh-cn: |-
        只要银行发放的贷款笔数足够多，违约损失占贷款总额的比例就会非常稳定，无论经济是否陷入衰退。
      en: |-
        As long as a bank makes enough loans, its default losses as a share of total lending will be very stable, whether or not the economy falls into recession.
    correct: false
    answer:
      zh-cn: |-
        错。增加贷款笔数只能分散相互独立的违约风险。衰退中很多借款者同时出问题，违约正相关，这部分风险不能靠增加贷款数量分散掉，所以损失比例在衰退时会明显上升。
      en: |-
        False. More loans diversify away only defaults that are independent of each other. In a recession many borrowers get into trouble at the same time, so defaults are positively correlated; this part of the risk cannot be diversified away by making more loans, and the loss share rises noticeably in recessions.

  - id: C2
    kind: check
    section: trading
    concepts: [bid-ask-spread, market-maker]
    question:
      zh-cn: |-
        一只股票突然出现了大量可能掌握内部消息的交易者。做市商最可能怎样做？
      en: |-
        A stock suddenly attracts many traders who may have inside information. What is the market maker most likely to do?
    choices:
      - zh-cn: 缩小买卖价差，以吸引更多交易
        en: Narrow the bid-ask spread to attract more trading
      - zh-cn: 扩大买卖价差
        en: Widen the bid-ask spread
      - zh-cn: 价差不变，因为价差只取决于交易量
        en: Keep the spread unchanged, because the spread depends only on trading volume
      - zh-cn: 只报买价，不报卖价
        en: Quote only a bid and no ask
    correct: B
    answer:
      zh-cn: |-
        (B)。与知情交易者交易时，做市商往往在价格将要上涨时卖出、将要下跌时买入，会亏损（逆向选择）。知情交易者越多，做市商要用越大的价差从其他交易者那里补偿这些损失。
      en: |-
        (B). Trading with informed traders, the market maker tends to sell just before prices rise and buy just before they fall, and loses money (adverse selection). The more informed traders there are, the wider the spread the market maker needs to recover these losses from other traders.

  - id: C3
    kind: check
    section: orders
    concepts: [limit-order, bid-ask-spread]
    widget: { id: order-book, set: { q: 3000 } }
    question:
      zh-cn: |-
        在 [[fig:5-1]] 中，把市价买单从 1500 股增加到 3000 股。与按中间价成交相比，多付的总金额会怎样变化？
      en: |-
        In [[fig:5-1]], raise the market buy order from 1500 shares to 3000 shares. Compared with trading at the midpoint, how does the total extra amount paid change?
    choices:
      - zh-cn: 正好变为两倍
        en: It exactly doubles
      - zh-cn: 增加，但不到两倍
        en: It rises, but less than double
      - zh-cn: 超过两倍
        en: It more than doubles
      - zh-cn: 不变
        en: It does not change
    correct: C
    answer:
      zh-cn: |-
        (C)。1500 股多付约 175 美元，3000 股多付约 675 美元。后面的股数要吃到更高的价位，每股多付的金额随订单增大而增加：价格冲击是递增的。
      en: |-
        (C). 1500 shares cost about 175 dollars extra and 3000 shares about 675 dollars. The later shares must take higher price levels, so the extra paid per share rises with order size: price impact grows faster than the order.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: B
    concepts: [financial-intermediary, adverse-selection]
    question:
      zh-cn: |-
        发行公司债有一项约 100 万美元的固定成本（承销、法律、评级等），与发行金额无关。一家要借 500 万美元的小企业通常向银行借款，而一家要借 10 亿美元的大公司常常直接发行债券。除了固定成本，用信息问题说明为什么小企业更依赖银行。
      en: |-
        Issuing corporate bonds involves a fixed cost of about 1 million dollars (underwriting, legal work, ratings and so on), whatever the amount. A small firm borrowing 5 million dollars usually borrows from a bank, while a large company borrowing 1 billion dollars often issues bonds directly. Apart from the fixed cost, explain with information problems why small firms rely more on banks.
    answer:
      zh-cn: |-
        固定成本占小企业借款的 20%，只占大公司的 0.1%。此外，投资者很难了解一家小企业的质量：愿意接受高利率的往往是风险更高的借款者（逆向选择），借到钱后企业也可能冒更大的风险（道德风险）。分散的债券投资者各自调查和监督不划算；银行可以集中调查，通过长期往来积累信息，在贷款合同中加入条款并持续监督，以更低的成本解决信息问题。大公司的信息公开、有评级，这些问题小得多。
      en: |-
        The fixed cost is 20% of the small firm's borrowing and only 0.1% of the large company's. Beyond that, investors find it hard to judge a small firm's quality: those willing to pay high rates tend to be riskier borrowers (adverse selection), and after borrowing the firm may take more risk (moral hazard). It does not pay for many dispersed bondholders each to investigate and monitor; a bank can investigate in one place, build information through a long relationship, write covenants into the loan and keep monitoring, solving the information problems at lower cost. Large companies publish information and have ratings, so these problems are much smaller.
    rubric:
      zh-cn:
        - "用逆向选择、道德风险和监督成本说明银行的优势。"
      en:
        - "Explains the bank's advantage with adverse selection, moral hazard and monitoring costs."

  - id: Q2
    kind: exercise
    level: B
    star: true
    concepts: [short-selling]
    expected: { loss: "1100" }
    question:
      zh-cn: |-
        一位投资者以每股 50 美元卖空 100 股，持有期间公司发放每股 1 美元的股息，之后以 60 美元买回。(a) 盈亏是多少？(b) 卖空者的最大损失和买入者的最大损失有什么不同？券商为什么要求卖空者存入保证金，并在价格上涨时要求追加？
      en: |-
        An investor sells short 100 shares at 50 dollars; while the position is open the company pays a dividend of 1 dollar per share; the shares are then bought back at 60 dollars. (a) What is the gain or loss? (b) How does the short seller's largest possible loss differ from a buyer's? Why do brokers require short sellers to post margin and add more when the price rises?
    answer:
      zh-cn: |-
        (a) 卖出得 5000，买回付 6000，还要付股息 100：亏损 $1000 + 100 = 1100$ 美元。
        (b) 买入者最多损失全部投入（股价跌到 0）；卖空者的损失没有上限，因为股价上涨没有上限。券商借出了股票，如果卖空者亏损太多无力买回，损失会落到券商身上；保证金和追加要求保证卖空者有能力承担损失。
      en: |-
        (a) The sale brings 5000, buying back costs 6000, and the dividend costs 100: a loss of $1000 + 100 = 1100$ dollars.
        (b) A buyer can lose at most the amount invested (if the price falls to 0); a short seller's loss has no limit, because the price can rise without limit. The broker has lent the shares; if the short seller loses too much to buy them back, the loss falls on the broker, so margin and margin calls make sure the short seller can cover losses.
    rubric:
      zh-cn:
        - "(a) 亏损 1100，计入股息。"
        - "(b) 有限与无上限，并说明保证金的作用。"
      en:
        - "(a) A loss of 1100, including the dividend."
        - "(b) Limited versus unlimited, and the role of margin."

  - id: Q3
    kind: exercise
    level: B
    concepts: [primary-market, adverse-selection]
    expected: { left: "50" }
    question:
      zh-cn: |-
        一家公司 IPO 发行 1000 万股，发行价 20 美元；上市第一天收盘价为 25 美元。(a) 和按第一天的收盘价发行相比，公司少得了多少？(b) 研究发现 IPO 平均有这种“首日上涨”。从发行者和投资者之间的信息不对称，给出一种解释。
      en: |-
        A company sells 10 million shares in an IPO at 20 dollars; the first-day closing price is 25 dollars. (a) Compared with selling at the first-day close, how much less did the company receive? (b) Studies find such first-day gains on average in IPOs. Give one explanation based on asymmetric information between issuers and investors.
    answer:
      zh-cn: |-
        (a) $10 \times (25 - 20) = 50$ 百万美元。
        (b) 例如：消息灵通的投资者只申购好的 IPO，消息不灵通的投资者在好的 IPO 中分到的少、在差的 IPO 中分到的多（“赢家的诅咒”，一种逆向选择）。为了让他们仍然愿意参与，发行价平均要定得低一些。
      en: |-
        (a) $10 \times (25 - 20) = 50$ million dollars.
        (b) For example: well-informed investors apply only for good IPOs, so less-informed investors get little of the good ones and a lot of the bad ones (the "winner's curse", a form of adverse selection). For them to keep taking part, offer prices must be set lower on average.
    rubric:
      zh-cn:
        - "(a) 50 百万美元。"
        - "(b) 给出基于信息不对称的合理解释。"
      en:
        - "(a) 50 million dollars."
        - "(b) A reasonable explanation based on asymmetric information."

  - id: Q4
    kind: exercise
    level: C
    star: true
    concepts: [limit-order, adverse-selection, expected-value]
    expected: { e: "100.128" }
    question:
      zh-cn: |-
        中间价 100.00，卖价 100.05。你要买入一股，有两种选择：(i) 市价单，按 100.05 成交；(ii) 限价单，出价 99.98，估计有 60% 的可能成交；没有成交通常是因为价格上涨了，你要在卖价 100.35 时改用市价单买入。
        (a) 限价单的预期成交价是多少？哪种选择更好？
        (b) 限价单在什么情况下最容易成交？为什么这说明限价单也有一种“逆向选择”的成本？
      en: |-
        The midpoint is 100.00 and the ask 100.05. You want to buy one share: (i) a market order, filled at 100.05; or (ii) a limit order at 99.98, with an estimated 60% chance of a fill; if not filled, it is usually because the price has risen, and you then buy with a market order at an ask of 100.35.
        (a) What is the expected price with the limit order? Which choice is better?
        (b) When is a limit order most likely to be filled? Why does this mean limit orders also carry a kind of "adverse selection" cost?
    answer:
      zh-cn: |-
        (a) $0.6 \times 99.98 + 0.4 \times 100.35 = 100.128$，高于 100.05，这里市价单更好。
        (b) 价格往下走时（有人急于卖出，或者出现了坏消息），限价买单最容易成交；价格往上走时，它恰好成交不了。所以限价单往往在“不该买”的时候买到、在“该买”的时候错过：成交本身就是价格可能继续下跌的信号。
      en: |-
        (a) $0.6 \times 99.98 + 0.4 \times 100.35 = 100.128$, above 100.05, so here the market order is better.
        (b) A limit buy is most likely to fill when the price is falling (someone is eager to sell, or bad news has arrived); when the price is rising, it does not fill. So limit orders tend to buy when it would have been better not to and miss when it would have been better to buy: being filled is itself a sign the price may keep falling.
    rubric:
      zh-cn:
        - "(a) 100.128，市价单更好。"
        - "(b) 说明成交与价格下跌的关系。"
      en:
        - "(a) 100.128; the market order is better."
        - "(b) Explains the link between fills and falling prices."

  - id: Q5
    kind: exercise
    level: B
    concepts: [money-market, bank-run]
    question:
      zh-cn: |-
        货币市场基金通常把每份净值维持在 1.00 美元。2008 年 9 月 16 日，美国一只大型货币市场基金因为持有的雷曼兄弟商业票据违约，净值跌破 1 美元。假设一只基金 3% 的资产变得一文不值，但仍按 1.00 美元为先赎回的人兑付。为什么投资者会争相赎回？和银行存款相比，当时货币市场基金缺少什么保护？
      en: |-
        Money market funds usually keep their share value at 1.00 dollar. On September 16, 2008, a large US money market fund's share value fell below 1 dollar because Lehman Brothers commercial paper it held defaulted. Suppose a fund loses 3% of its assets but still pays 1.00 dollar to those who redeem first. Why would investors rush to redeem? Compared with bank deposits, what protection did money market funds lack at the time?
    answer:
      zh-cn: |-
        资产只值每份 0.97 美元。先赎回的人拿走 1.00，损失就留给后面的人，后赎回的人每份得到的更少；每个人都想抢在别人前面，于是大家都赎回，基金要贱卖资产，损失更大。和 [[2.3]] 的银行挤兑一样，是自我实现的“先到先得”。
        当时货币市场基金没有存款保险，也不能向央行借款；投资者以为它和存款一样安全，但它的价值取决于所持资产。
      en: |-
        The assets are worth only 0.97 dollars per share. Those who redeem first take 1.00 and leave the loss to those who remain, who then get less; everyone wants to get out first, so everyone redeems, the fund must sell assets cheaply, and losses grow. As with the bank runs of [[2.3]], it is a self-fulfilling "first come, first served".
        Money market funds then had no deposit insurance and no access to central bank lending; investors treated them as being as safe as deposits, but their value depends on the assets they hold.
    rubric:
      zh-cn:
        - "说明先到先得的挤兑机制。"
        - "指出缺少存款保险和央行支持。"
      en:
        - "Explains the first-come-first-served run."
        - "Notes the lack of deposit insurance and central bank support."
