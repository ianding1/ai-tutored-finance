# Answer key for lesson 3.1. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[3.1#orders]] (section), [[concept:limit-order]], [[check:Q3]], [[fig:5-1]].
# expected: values are recomputed by course/verify/3.1.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
