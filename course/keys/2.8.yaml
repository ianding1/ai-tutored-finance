# Answer key for lesson 2.8. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[2.8#yield-curve]] (section), [[concept:yield-curve]], [[check:Q3]], [[fig:5-1]].
# expected: values are recomputed by course/verify/2.8.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "2.8"

context:
  - zh-cn: |-
      学习者学过概率、方差、相关系数和组合方差（[[0.3]]）、现值（[[0.1]]）、失业率（[[2.1]]）、AD-AS 与需求和供给冲击（[[2.4]]）、货币政策与前瞻指引（[[2.5]]，包括长期利率约为预期短期利率的平均值）。讲义还没有讲债券定价、期限结构和信用风险的细节（第 3 阶段）。百分数的计算用百分点表示。
    en: |-
      The learner has studied probability, variance, correlation and portfolio variance ([[0.3]]), present value ([[0.1]]), the unemployment rate ([[2.1]]), AD-AS and demand and supply shocks ([[2.4]]), and monetary policy and forward guidance ([[2.5]], including that the long rate is about the average of expected short rates). The lesson has not yet covered bond pricing, the term structure or credit risk in detail (Stage 3). Percentage calculations are in percentage points.
  - concepts: [business-cycle, recession, leading-indicator]
    zh-cn: |-
      讲义：NBER 认定衰退（显著、广泛、持续），综合多种指标，有滞后；“连续两个季度 GDP 负增长”只是粗略标准。1945–2020 年扩张平均约 64 个月，衰退约 10 个月；最近一次衰退是 2020 年 2–4 月。领先、同步、滞后指标的例子；Sahm 规则（3 个月平均失业率比过去 12 个月的最低 3 个月平均值高 0.5 个百分点以上）；2024 年 8 月触发但没有衰退，原因之一是劳动力增长快。
    en: |-
      The lesson: the NBER dates recessions (significant, widespread, lasting) using many indicators, with a delay; "two quarters of negative GDP growth" is only a rough rule. In 1945–2020 expansions averaged about 64 months and recessions about 10; the latest recession was February–April 2020. Examples of leading, coincident and lagging indicators; the Sahm rule (the 3-month average unemployment rate at least 0.5 points above its lowest 3-month average of the past 12 months); it was triggered in August 2024 without a recession, partly because the labor force grew fast.
  - concepts: [yield-curve]
    zh-cn: |-
      讲义：倒挂反映对降息的预期、紧缩的政策和银行利润的压缩；1960 年代末以来每次衰退前 10 年期与 3 个月期利差都曾倒挂，时滞几个月到两年；2022 年 10 月到 2024 年底大部分时间倒挂，截至 2026 年 11 月没有衰退；2026 年 9 月利差约 0.8 个百分点。
    en: |-
      The lesson: inversion reflects expected rate cuts, tight policy and squeezed bank margins; since the late 1960s the 10-year–3-month spread inverted before every US recession, with lags of a few months to two years; it was mostly inverted from October 2022 to the end of 2024, with no recession as of November 2026; the spread was about 0.8 points in September 2026.
  - concepts: [stock-bond-correlation, correlation, portfolio-variance]
    zh-cn: |-
      讲义：资产价格领先经济；周期性与防御性行业；衰退中国债通常上涨，信用利差扩大。股债相关性：需求冲击为主时为负，通胀冲击为主时为正；1970–1990 年代大致为正，2000–2010 年代大致为负，2022 年后转正；2022 年标普 500 总收益约 −18.1%，彭博美国综合债券指数约 −13.0%。[[fig:5-1]]：股票标准差 16%，债券 6%；相关系数滑块 −0.6 到 0.6、股票权重 0 到 1，步长都是 0.1，默认 −0.3 和 0.6；读数显示组合的标准差。
    en: |-
      The lesson: asset prices lead the economy; cyclical and defensive sectors; in recessions Treasuries usually rise and credit spreads widen. Stock–bond correlation: negative when demand shocks dominate, positive when inflation shocks dominate; roughly positive in the 1970s–1990s, negative in the 2000s–2010s, positive again after 2022; in 2022 the S&P 500 total return was about −18.1% and the Bloomberg US Aggregate about −13.0%. [[fig:5-1]]: stock standard deviation 16%, bonds 6%; a correlation slider from −0.6 to 0.6 and a stock-weight slider from 0 to 1, both in steps of 0.1, defaults −0.3 and 0.6; the readout shows the portfolio standard deviation.

common_errors:
  - questions: [C1, Q4]
    zh-cn: |-
      把衰退等同于“GDP 连续两个季度负增长”，或者以为某一个指标触发就说明衰退一定发生。
    en: |-
      Equating a recession with "two quarters of negative GDP growth", or thinking that one indicator being triggered means a recession is certain.
  - questions: [C2, Q1]
    zh-cn: |-
      以为收益率曲线倒挂会“导致”衰退或必然预示衰退；它反映的是预期和政策，信号有时滞也可能出错。
    en: |-
      Thinking that an inverted yield curve "causes" a recession or always predicts one; it reflects expectations and policy, and the signal has lags and can be wrong.
  - questions: [C3, Q5]
    zh-cn: |-
      以为可以等经济数据确认衰退后再卖出股票。股价通常在数据确认之前就已经反映了预期。
    en: |-
      Thinking one can wait for the data to confirm a recession before selling stocks. Prices usually reflect expectations before the data confirm them.
  - questions: [C4, Q2, Q3]
    zh-cn: |-
      以为债券总能对冲股票的下跌。股债相关性取决于冲击的类型，通胀冲击时两者可能一起下跌。
    en: |-
      Thinking that bonds always hedge falls in stocks. The correlation depends on the type of shock, and with inflation shocks both can fall together.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: indicators
    concepts: [leading-indicator, recession]
    question:
      zh-cn: |-
        最近 3 个月的平均失业率比过去 12 个月中的最低值高了 0.5 个百分点以上，Sahm 规则被触发。这说明经济一定已经进入了衰退。
      en: |-
        The 3-month average unemployment rate has risen more than 0.5 percentage points above its low of the past 12 months, triggering the Sahm rule. This shows the economy must already be in a recession.
    correct: false
    hint:
      zh-cn: 失业率上升一定是因为裁员吗？如果有很多人新加入劳动力、正在找工作，会怎样？
      en: Must rising unemployment come from layoffs? What if many people newly join the labor force and are looking for work?
    answer:
      zh-cn: |-
        错。Sahm 规则在历史上是很好的衰退信号，但它只是一个经验规律。例如劳动力增长很快（移民或更多人开始找工作），新进入的人需要时间找到工作，失业率上升，但并没有大量裁员，也没有“失业—消费减少—再裁员”的循环。任何一个指标触发都不能确定衰退，NBER 要综合就业、收入、消费、生产等多方面的数据判断。
      en: |-
        False. The Sahm rule has been a good recession signal historically, but it is only an empirical regularity. If the labor force grows fast (immigration, or more people starting to look for work), newcomers take time to find jobs and unemployment rises without mass layoffs and without the cycle of job losses, lower spending and more layoffs. No single indicator settles whether there is a recession; the NBER weighs employment, income, spending, production and more.

  - id: C2
    kind: check
    section: yield-curve
    concepts: [yield-curve]
    question:
      zh-cn: |-
        收益率曲线倒挂会导致经济衰退：只要长期利率低于短期利率，衰退就会随之而来。
      en: |-
        An inverted yield curve causes recessions: whenever long rates fall below short rates, a recession follows.
    correct: false
    hint:
      zh-cn: 倒挂反映的是市场对未来短期利率的什么预期？它和衰退之间是因果关系，还是都和别的东西有关？倒挂之后一定有衰退吗？
      en: What does an inversion say about expected future short rates? Is it a cause of recessions, or are both linked to something else? Does a recession always follow?
    answer:
      zh-cn: |-
        错。倒挂主要反映市场预期央行将来会降息，而央行通常在经济走弱、通胀下降时降息，所以倒挂是对经济走弱的预期，不是衰退的原因。当前的高短期利率确实会抑制需求，但这来自央行的政策，而不是曲线的形状。而且信号有很长且不固定的时滞，也出现过倒挂之后没有衰退的情况；期限溢价的变化也会改变曲线的形状。
      en: |-
        False. An inversion mainly reflects expectations that the central bank will cut rates later, and central banks usually cut when the economy weakens and inflation falls; so an inversion is an expectation of weakness, not a cause of recession. High short rates do restrain demand, but that comes from policy, not from the shape of the curve. The signal also has long and variable lags, inversions have been followed by no recession, and changes in the term premium can change the curve's shape too.

  - id: C3
    kind: check
    section: assets
    concepts: [business-cycle, recession]
    question:
      zh-cn: |-
        NBER 宣布：经济在 8 个月前已经进入衰退。当天股市上涨。最合理的解释是：
      en: |-
        The NBER announces that the economy entered a recession 8 months ago. The stock market rises that day. The most reasonable explanation:
    choices:
      - zh-cn: 股价早已反映了衰退，宣布不是新信息；市场可能已经在预期经济复苏
        en: Prices already reflected the recession, the announcement is not news, and the market may already expect a recovery
      - zh-cn: 市场不理性，衰退的消息应该使股价下跌
        en: The market is irrational; news of a recession should make stocks fall
        why:
          zh-cn: 在 NBER 宣布之前，投资者能不能从其他数据看到经济在走弱？那时股价有什么变化？
          en: Before the NBER spoke, could investors see the economy weakening in other data? What did stock prices do then?
      - zh-cn: 衰退在宣布的当天结束了
        en: The recession ended on the day of the announcement
        why:
          zh-cn: NBER 的宣布描述的是 8 个月前发生的事。宣布本身会改变经济吗？
          en: The announcement describes what happened 8 months ago. Does the announcement itself change the economy?
      - zh-cn: NBER 的判断错了，投资者不相信它
        en: The NBER is wrong, and investors do not believe it
        why:
          zh-cn: 如果投资者早就看到了衰退，他们需要不相信 NBER 才会让股价上涨吗？
          en: If investors had already seen the recession, would they need to disbelieve the NBER for prices to rise?
    correct: A
    answer:
      zh-cn: |-
        (A)。股价反映对未来的预期。投资者早已从各种数据中看到了衰退，股价已经下跌；NBER 的宣布只是确认了已知的事，不是新信息。到宣布时，股价可能已经在反映经济将来的回升。所以等数据确认衰退后再卖出股票，往往已经太晚。
      en: |-
        (A). Stock prices reflect expectations about the future. Investors had seen the recession in many data long before and prices had already fallen; the NBER only confirmed what was known, which is not news. By the time of the announcement, prices may already reflect a future recovery. That is why selling stocks after the data confirm a recession is usually too late.

  - id: C4
    kind: check
    section: stock-bond
    concepts: [stock-bond-correlation, portfolio-variance]
    widget: { id: stock-bond-mix, set: { rho: 0.5, w: 0.6 } }
    question:
      zh-cn: |-
        在 [[fig:5-1]] 中把股票权重设为 0.6，再把股债相关系数从 −0.3 调到 0.5。组合的标准差：
      en: |-
        In [[fig:5-1]], set the stock weight to 0.6, then move the stock–bond correlation from −0.3 to 0.5. The portfolio's standard deviation:
    choices:
      - zh-cn: 上升
        en: Rises
      - zh-cn: 下降，因为两种资产一起上涨的时候更多了
        en: Falls, because the two assets rise together more often
        why:
          zh-cn: 相关系数为正时，两种资产也更常一起下跌。组合方差中的协方差项是变大还是变小？
          en: With a positive correlation they also fall together more often. Does the covariance term in the portfolio variance grow or shrink?
      - zh-cn: 不变，因为两种资产各自的标准差没有变
        en: Stays the same, because each asset's standard deviation is unchanged
        why:
          zh-cn: 组合的方差只取决于两种资产各自的方差吗？还有哪一项？
          en: Does the portfolio variance depend only on each asset's own variance? What other term is there?
      - zh-cn: 先下降后上升
        en: First falls and then rises
        why:
          zh-cn: 协方差项 $2w(1-w)\rho\sigma_1\sigma_2$ 随 $\rho$ 怎样变化？是单调的吗？
          en: How does the covariance term $2w(1-w)\rho\sigma_1\sigma_2$ change with $\rho$? Is it monotonic?
    correct: A
    answer:
      zh-cn: |-
        (A)。组合方差中的协方差项与相关系数成正比，相关系数从负变正，标准差从约 9.17% 上升到约 11%。需求冲击使股价和通胀同向下降、央行降息、债券上涨，股债负相关；通胀冲击使股价下跌、利率上升、债券也下跌，股债正相关。通胀成为主要的风险时，债券分散风险的作用变弱。
      en: |-
        (A). The covariance term in the portfolio variance is proportional to the correlation, so moving it from negative to positive raises the standard deviation from about 9.17% to about 11%. Demand shocks push stocks and inflation down together, the central bank cuts rates and bonds rise, so stocks and bonds are negatively correlated; inflation shocks push stocks down and rates up, so bonds fall too, and the correlation is positive. When inflation is the main risk, bonds diversify less.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: B
    star: true
    concepts: [yield-curve, recession]
    expected: { p: "61.4" }
    question:
      zh-cn: |-
        设想 1000 个 12 个月的时期。其中 15% 的时期内会开始一次衰退。在会开始衰退的时期之前，收益率曲线倒挂的比例是 90%；在不会开始衰退的时期之前，倒挂的比例是 10%。
        (a) 看到倒挂后，接下来 12 个月开始衰退的概率约是多少？
        (b) 如果一位投资者每次看到倒挂就卖出全部股票，你预计会发生什么？
      en: |-
        Imagine 1000 periods of 12 months. A recession starts in 15% of them. Before periods in which a recession starts, the yield curve is inverted 90% of the time; before periods without one, 10% of the time.
        (a) After an inversion, what is the probability that a recession starts in the next 12 months?
        (b) If an investor sells all stocks every time the curve inverts, what do you expect to happen?
    answer:
      zh-cn: |-
        (a) 会开始衰退的时期 150 个，其中倒挂 $150 \times 90\% = 135$ 个；不会开始衰退的 850 个，其中倒挂 $850 \times 10\% = 85$ 个。概率为 $\frac{135}{220} \approx 61.4\%$。
        (b) 倒挂之后约有四成的情况没有衰退；即使有衰退，时间也不确定，倒挂到衰退之间股市可能继续上涨。频繁地全部卖出，会错过很多上涨，还可能在错误的时间重新买入。信号有用，但不足以决定全部仓位。
      en: |-
        (a) Recessions start in 150 periods, of which $150 \times 90\% = 135$ follow an inversion; of the 850 without one, $850 \times 10\% = 85$ follow an inversion. The probability is $\frac{135}{220} \approx 61.4\%$.
        (b) About four in ten inversions are not followed by a recession; even when one follows, its timing is uncertain, and stocks may keep rising between the inversion and the recession. Selling everything often misses many gains and risks buying back at the wrong time. The signal is useful but not enough to decide the whole position.
    rubric:
      zh-cn:
        - "(a) 约 61.4%。"
        - "(b) 说明错误信号和时间的不确定。"
      en:
        - "(a) About 61.4%."
        - "(b) Explains false signals and uncertain timing."

  - id: Q2
    kind: exercise
    level: B
    star: true
    concepts: [stock-bond-correlation, aggregate-demand, aggregate-supply]
    question:
      zh-cn: |-
        在 [[2.4#ad-as]] 中图的模型里，需求冲击（$D = -4$）使产出降到约 97.33、价格水平降到约 97.33；供给冲击（$S = 6$）使产出降到 98、价格水平升到 104。
        (a) 假设央行按 Taylor 规则（[[2.5]]）对通胀和产出缺口作出反应，两种情况下利率各大致朝哪个方向变化？股票和债券的价格呢？
        (b) 如果一个时期的冲击以供给冲击为主，股债组合的风险会怎样？
      en: |-
        In the model of the figure in [[2.4#ad-as]], a demand shock ($D = -4$) lowers output to about 97.33 and the price level to about 97.33; a supply shock ($S = 6$) lowers output to 98 and raises the price level to 104.
        (a) If the central bank responds to inflation and the output gap by the Taylor rule ([[2.5]]), in which direction does the interest rate roughly move in each case? What about stock and bond prices?
        (b) If the shocks of a period are mainly supply shocks, what happens to the risk of a stock-bond portfolio?
    answer:
      zh-cn: |-
        (a) 需求冲击：产出和价格都下降，央行降息；利润下降，股价下跌，利率下降使债券上涨：股债反向。供给冲击：产出下降、价格上升，按 Taylor 规则通胀的系数更大，央行倾向于加息；股价下跌，利率上升使债券也下跌：股债同向。
        (b) 股债相关性为正，债券不再能抵消股票的损失，组合的风险上升（如 2022 年）。
      en: |-
        (a) Demand shock: output and prices both fall and the central bank cuts rates; profits fall so stocks fall, while lower rates lift bonds: stocks and bonds move in opposite directions. Supply shock: output falls and prices rise; the Taylor rule puts the larger weight on inflation, so the central bank tends to raise rates; stocks fall and higher rates push bonds down too: they move together.
        (b) The stock-bond correlation turns positive, bonds no longer offset stock losses, and portfolio risk rises (as in 2022).
    rubric:
      zh-cn:
        - "(a) 两种冲击下利率、股票和债券的方向。"
        - "(b) 相关性为正，风险上升。"
      en:
        - "(a) Directions of rates, stocks and bonds under each shock."
        - "(b) Positive correlation; higher risk."

  - id: Q3
    kind: exercise
    level: C
    star: true
    concepts: [stock-bond-correlation, diversification]
    expected: { r22: "-16.06", r2: "-8.46" }
    question:
      zh-cn: |-
        一个 60% 股票、40% 债券的组合（每年初调回这个比例）。
        (a) 用讲义中 2022 年的收益（股票 −18.1%，债券 −13.0%），组合当年的收益是多少？如果另一年股票同样下跌 18.1%、但债券上涨 6%，组合的收益是多少？
        (b) 两者的差别说明了什么？如果投资者担心未来的冲击主要来自通胀，他可能会考虑哪些类型的资产来分散风险？（只说明理由，不涉及具体证券。）
      en: |-
        A portfolio of 60% stocks and 40% bonds (rebalanced to these weights at the start of each year).
        (a) Using the lesson's 2022 returns (stocks −18.1%, bonds −13.0%), what was the portfolio's return that year? In another year in which stocks also fall 18.1% but bonds rise 6%, what is the portfolio's return?
        (b) What does the difference show? If an investor worries that future shocks will come mainly from inflation, what types of assets might they consider for diversification? (Give reasons only; no specific securities.)
    answer:
      zh-cn: |-
        (a) $0.6 \times (-18.1\%) + 0.4 \times (-13.0\%) = -16.06\%$；$0.6 \times (-18.1\%) + 0.4 \times 6\% = -8.46\%$。
        (b) 同样的股市下跌，组合的损失相差约 7.6 个百分点：分散的效果取决于股债相关性。通胀冲击下，名义债券和股票都受利率上升的打击。可以考虑的是收益与通胀挂钩或在通胀上升时往往表现较好的资产，例如通胀保值债券（本金随 CPI 调整）、短期债券（利率上升时很快按新利率再投资）、大宗商品等；它们各有自己的风险，在需求冲击下的表现也可能更差。
      en: |-
        (a) $0.6 \times (-18.1\%) + 0.4 \times (-13.0\%) = -16.06\%$; $0.6 \times (-18.1\%) + 0.4 \times 6\% = -8.46\%$.
        (b) For the same stock decline, the portfolio losses differ by about 7.6 percentage points: the benefit of diversification depends on the stock-bond correlation. In an inflation shock, nominal bonds and stocks are both hit by rising rates. Candidates are assets whose returns are linked to inflation or tend to do well when inflation rises, such as inflation-protected bonds (principal adjusted with the CPI), short-term bonds (quickly reinvested at new, higher rates) and commodities; each has its own risks and may do worse in a demand shock.
    rubric:
      zh-cn:
        - "(a) −16.06% 和 −8.46%（写作 - 或 − 均可）。"
        - "(b) 说明相关性的作用，并给出有理由的资产类型。"
      en:
        - "(a) −16.06% and −8.46% (written with - or −)."
        - "(b) Explains the role of correlation and gives asset types with reasons."

  - id: Q4
    kind: exercise
    level: B
    concepts: [recession, business-cycle]
    question:
      zh-cn: |-
        某国连续两个季度实际 GDP 按年率下降 0.5% 和 0.3%；同期非农就业每月增加约 40 万人，失业率保持在 3.6%，实际消费继续增长。
        (a) 按“两个季度负增长”的粗略标准这是衰退。按 NBER 的标准，委员会可能怎样判断？为什么？
        (b) GDP 的初步估计后来常被修订（[[2.1]]）。这对实时判断衰退有什么影响？
      en: |-
        A country's real GDP fell at annual rates of 0.5% and 0.3% in two consecutive quarters; over the same period nonfarm employment rose by about 400,000 a month, unemployment stayed at 3.6% and real consumption kept growing.
        (a) By the rough "two quarters of negative growth" rule this is a recession. How might the NBER committee judge it? Why?
        (b) Early GDP estimates are often revised later ([[2.1]]). What does this mean for judging recessions in real time?
    answer:
      zh-cn: |-
        (a) 很可能不认定为衰退。NBER 要求经济活动显著、广泛、持续地下降；这里 GDP 的下降很小，而就业强劲增长、失业率很低、消费增长，衰退没有遍及整个经济。GDP 的小幅下降可能来自存货或净出口等波动较大的部分。
        (b) 实时数据不完整，后来的修订可能改变下降的幅度甚至方向，所以单看初步的 GDP 数据容易误判；这也是 NBER 要等较长时间、综合多种指标才认定的原因。
      en: |-
        (a) Most likely not a recession. The NBER requires a significant, broad and lasting decline in economic activity; here the GDP decline is small, while employment grows strongly, unemployment is low and consumption grows, so the decline does not spread across the economy. The small GDP fall may come from volatile parts such as inventories or net exports.
        (b) Real-time data are incomplete, and later revisions may change the size or even the direction of the decline, so judging from early GDP data alone is error-prone; this is why the NBER waits a long time and looks at many indicators before deciding.
    rubric:
      zh-cn:
        - "(a) 很可能不是衰退，用显著、广泛、持续说明。"
        - "(b) 说明数据修订带来的误判。"
      en:
        - "(a) Most likely not a recession, explained by significant, broad and lasting."
        - "(b) Explains misjudgment caused by data revisions."

  - id: Q5
    kind: exercise
    level: B
    concepts: [leading-indicator, present-value]
    question:
      zh-cn: |-
        (a) 用现值（[[0.1]]）说明为什么股价是领先指标。
        (b) 为什么新建住房许可会领先于经济，而失业的平均持续时间是滞后指标？
      en: |-
        (a) Use present value ([[0.1]]) to explain why stock prices are a leading indicator.
        (b) Why do new housing permits lead the economy, while the average duration of unemployment is a lagging indicator?
    answer:
      zh-cn: |-
        (a) 股价是未来利润（股息）的现值。投资者一旦预期未来的利润会下降或回升，今天的股价就会立即变化，而利润和经济的实际变化要以后才出现。
        (b) 盖房子之前先要申请许可，许可的变化反映了建筑商对未来需求的判断和对利率的反应（房贷利率上升，许可减少）；住宅投资又是 GDP 中波动最大的部分之一，会通过就业和收入影响整个经济。失业的平均持续时间要等失业的人找了一段时间工作才会变长；经济回升后，长期失业的人也要过一段时间才找到工作，所以它在衰退开始后才上升，在复苏后才下降。
      en: |-
        (a) A stock price is the present value of future profits (dividends). As soon as investors expect future profits to fall or recover, today's price changes, while the actual changes in profits and the economy come later.
        (b) A permit must be obtained before a house is built, so permits reflect builders' views of future demand and their response to interest rates (higher mortgage rates, fewer permits); residential investment is one of the most volatile parts of GDP and affects the whole economy through jobs and income. The average duration of unemployment rises only after the unemployed have searched for a while, and after a recovery begins the long-term unemployed also take time to find jobs, so it rises after a recession starts and falls after the recovery.
    rubric:
      zh-cn:
        - "(a) 用未来利润的现值说明。"
        - "(b) 分别说明领先和滞后的原因。"
      en:
        - "(a) Explains with the present value of future profits."
        - "(b) Explains both the lead and the lag."
