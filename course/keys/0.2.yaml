# Answer key for lesson 0.2. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.4]] (lesson), [[0.2#lagrange]] (section), [[concept:shadow-price]], [[check:Q4]].
# expected: values are recomputed by course/verify/0.2.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "0.2"

context:
  - zh-cn: |-
      学习者会求导，学过 [[0.1]]；还没有学消费者理论（[[1.2]]）、生产者理论（[[1.5]]）和组合优化（[[4.2]]）。
    en: |-
      The learner can take derivatives and has studied [[0.1]]. The learner has not yet studied consumer theory ([[1.2]]), producer theory ([[1.5]]) or portfolio optimization ([[4.2]]).
  - concepts: [first-order-condition, second-order-condition]
    zh-cn: |-
      讲义给出一阶条件 $f'(x^*) = 0$，以及二阶条件：$f''(x^*) < 0$ 是最大值，$f''(x^*) > 0$ 是最小值。讲义没有讨论二阶导数为 0 的情形，也没有讨论局部最优与全局最优的区别。
    en: |-
      The lesson gives the first-order condition $f'(x^*) = 0$ and the second-order condition: $f''(x^*) < 0$ means a maximum and $f''(x^*) > 0$ a minimum. The lesson does not discuss the case where the second derivative is 0, or the difference between local and global optima.
  - concepts: [fixed-cost, variable-cost, marginal-cost, marginal-revenue, profit-maximization, sunk-cost]
    zh-cn: |-
      讲义定义了总成本 $C(q) = F + VC(q)$：固定成本 $F$ 与产量无关，可变成本 $VC(q)$ 随产量变化；$MC = C'(q)$；利润最大化的内部最优点满足 $MR = MC$；沉没成本是已经付出、收不回的成本。讲义用例子 $\pi(q) = 40q - 100 - q^2$（$q^* = 20$，$\pi^* = 300$）演示了利润最大化，并有一张可以调整 $F$ 的互动图，但没有解释固定成本对最优产量、利润和是否经营的影响，这些留给题目。
    en: |-
      The lesson defines total cost $C(q) = F + VC(q)$: the fixed cost $F$ does not depend on output, and the variable cost $VC(q)$ changes with output; $MC = C'(q)$; at an interior optimum of profit maximization, $MR = MC$; a sunk cost is a cost that has already been paid and cannot be recovered. The lesson shows profit maximization with the example $\pi(q) = 40q - 100 - q^2$ ($q^* = 20$, $\pi^* = 300$) and has an interactive figure in which $F$ can be changed, but it does not explain how the fixed cost affects the optimal output, the profit or whether to stay in business; that is left to the questions.
  - concepts: [partial-derivative]
    zh-cn: |-
      讲义例子：$f(x, y) = -x^2 - y^2 + 2x + 8y$ 在 $(1, 4)$ 取最大值 17。讲义说明交叉项 $f_{xy}$ 为 0 时，$f_{xx} < 0$ 且 $f_{yy} < 0$ 即为最大值。
    en: |-
      Example in the lesson: $f(x, y) = -x^2 - y^2 + 2x + 8y$ has its maximum 17 at $(1, 4)$. The lesson states that when the cross term $f_{xy}$ is 0, $f_{xx} < 0$ and $f_{yy} < 0$ give a maximum.
  - concepts: [budget-constraint, lagrange-multiplier, shadow-price]
    zh-cn: |-
      讲义例子：$U = xy$，$p_x = 2$，$p_y = 4$，预算 100；$\mathcal{L} = xy + \lambda(100 - 2x - 4y)$，解得 $x^* = 25$，$y^* = 12.5$，$\lambda = 6.25$。讲义用“挪一美元”的论证得出内部最优点满足 $\frac{MU_x}{p_x} = \frac{MU_y}{p_y} = \lambda$（挪 1 美元时 $x$ 增加 $\frac{1}{p_x}$ 单位、$y$ 减少 $\frac{1}{p_y}$ 单位），几何上是等高线与预算线相切。$\lambda$ 是影子价格：预算多 1 美元时最大效用的近似增量（预算 101 时多约 6.28）。讲义只用了 $\lambda(\text{总量} - \text{用量})$ 这一种写法，没有讨论其他符号约定，也没有给出一般价格和预算下的需求函数。
    en: |-
      Example in the lesson: $U = xy$, $p_x = 2$, $p_y = 4$, budget 100; $\mathcal{L} = xy + \lambda(100 - 2x - 4y)$ gives $x^* = 25$, $y^* = 12.5$ and $\lambda = 6.25$. The lesson uses the "move one dollar" argument to show that an interior optimum satisfies $\frac{MU_x}{p_x} = \frac{MU_y}{p_y} = \lambda$ (moving 1 dollar raises $x$ by $\frac{1}{p_x}$ units and lowers $y$ by $\frac{1}{p_y}$ units); geometrically, the contour is tangent to the budget line. $\lambda$ is the shadow price: the approximate increase in maximum utility when the budget rises by 1 dollar (about 6.28 at a budget of 101). The lesson uses only the form $\lambda(\text{total} - \text{use})$; it does not discuss other sign conventions and does not give demand functions for general prices and budgets.
  - concepts: [corner-solution]
    zh-cn: |-
      讲义例子：$U = \ln x + y$，$p_x = 1$，$p_y = 10$，$M = 5$。拉格朗日解 $x = 10$，$y = -0.5$ 不可行；真正的最优是角点 $x = 5$，$y = 0$，此时 $\frac{MU_x}{p_x} = 0.2 > \frac{MU_y}{p_y} = 0.1$。讲义说明拉格朗日解满足写进 $\mathcal{L}$ 的等式约束，但不保证非负。
    en: |-
      Example in the lesson: $U = \ln x + y$, $p_x = 1$, $p_y = 10$, $M = 5$. The Lagrange solution $x = 10$, $y = -0.5$ is not feasible; the true optimum is the corner $x = 5$, $y = 0$, where $\frac{MU_x}{p_x} = 0.2 > \frac{MU_y}{p_y} = 0.1$. The lesson explains that the Lagrange solution satisfies the equality constraint written into $\mathcal{L}$ but is not guaranteed to be non-negative.

common_errors:
  - questions: [Q1]
    zh-cn: |-
      把一阶条件当作充分条件：导数为 0 的点也可能是最小值或拐点。
    en: |-
      Treating the first-order condition as sufficient: a point where the derivative is 0 can also be a minimum or an inflection point.
  - questions: [Q2]
    zh-cn: |-
      用分摊到每件产品上的固定成本决定产量，以为多生产能“摊薄”固定成本、提高利润；或者以为亏损就应该立即停产，没有区分短期的沉没成本和长期可以避免的成本。
    en: |-
      Choosing output by the fixed cost per unit, thinking that producing more "spreads" the fixed cost and raises profit; or thinking a loss means stopping at once, without separating sunk costs in the short run from costs that can be avoided in the long run.
  - questions: [Q4]
    zh-cn: |-
      以为两种商品的支出比例取决于价格。对 $U = x^2 y$，支出的比例只取决于效用函数的指数，价格只决定能买多少单位。
    en: |-
      Thinking the shares of spending on the two goods depend on prices. For $U = x^2 y$, the shares depend only on the exponents of the utility function; prices only decide how many units are bought.
  - questions: [Q5]
    zh-cn: |-
      以为一种商品降价一定会改变另一种商品的需求。对 $U = xy$，每种商品的支出总是预算的一半，$y^*$ 与 $p_x$ 无关。
    en: |-
      Thinking a fall in one good's price must change the demand for the other. For $U = xy$, spending on each good is always half the budget, so $y^*$ does not depend on $p_x$.
  - questions: [Q6]
    zh-cn: |-
      改变拉格朗日函数中约束的写法后，以为 $\lambda$ 不变。约束写成 $p_x x + p_y y - M$ 时，$\lambda$ 变号，影子价格是 $-\lambda$。
    en: |-
      Thinking $\lambda$ stays the same when the constraint is written the other way. With $p_x x + p_y y - M$, $\lambda$ changes sign, and the shadow price is $-\lambda$.
  - questions: [C4]
    zh-cn: |-
      拉格朗日法解出负数时直接接受，没有检查非负约束。
    en: |-
      Accepting a negative Lagrange solution without checking the non-negativity constraints.
  - questions: [C4]
    zh-cn: |-
      “挪一美元”时把 $x$ 和 $y$ 各挪 1 单位：价格不为 1 时，这样会离开预算线。挪 1 美元是 $x$ 变化 $\frac{1}{p_x}$ 单位、$y$ 变化 $\frac{1}{p_y}$ 单位。
    en: |-
      Moving one unit of $x$ and one unit of $y$ when "moving one dollar": when prices are not 1, this leaves the budget line. Moving 1 dollar changes $x$ by $\frac{1}{p_x}$ units and $y$ by $\frac{1}{p_y}$ units.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: single-variable
    concepts: [first-order-condition, second-order-condition, fixed-cost, profit-maximization]
    question:
      zh-cn: |-
        一家公司的固定成本从 100 美元提高到 300 美元，价格和可变成本都不变，而且公司继续生产。利润最高的产量和最大利润会怎样变化？
      en: |-
        A firm's fixed cost rises from 100 to 300 dollars; the price and the variable cost do not change, and the firm keeps producing. How do the profit-maximizing output and the maximum profit change?
    choices:
      - zh-cn: 产量不变，最大利润减少 200 美元
        en: Output stays the same, and the maximum profit falls by 200 dollars
      - zh-cn: 产量减少，最大利润减少
        en: Output falls, and the maximum profit falls
        why:
          zh-cn: 产量由一阶条件决定。固定成本对 $q$ 求导是多少？它会进入一阶条件吗？
          en: Output is set by the first-order condition. What is the derivative of the fixed cost with respect to $q$? Does it enter that condition?
      - zh-cn: 产量增加，把固定成本分摊到更多产品上
        en: Output rises, to spread the fixed cost over more units
        why:
          zh-cn: 多生产一件时，固定成本会增加或减少吗？比较的应该是多生产一件带来的收入和成本。
          en: Does producing one more unit change the fixed cost? The comparison is between the revenue and the cost of one more unit.
      - zh-cn: 产量和最大利润都不变
        en: Neither output nor the maximum profit changes
        why:
          zh-cn: 固定成本不影响产量的选择，但它会不会出现在利润里？
          en: The fixed cost does not affect the choice of output, but does it appear in the profit?
    correct: A
    answer:
      zh-cn: |-
        (A)。固定成本与产量无关，对 $q$ 求导为 0，不进入一阶条件 $MR = MC$，所以 $q^*$ 不变。它让整条利润曲线下移 200 美元，最大利润也减少 200 美元。
      en: |-
        (A). The fixed cost does not depend on output; its derivative with respect to $q$ is 0, so it does not enter the first-order condition $MR = MC$, and $q^*$ is unchanged. It shifts the whole profit curve down by 200 dollars, so the maximum profit also falls by 200 dollars.

  - id: C2
    kind: check
    section: partial
    concepts: [partial-derivative, first-order-condition]
    question:
      zh-cn: |-
        函数 $f(x, y)$ 在某一点处 $\frac{\partial f}{\partial x} = 0$，而 $\frac{\partial f}{\partial y} > 0$。这一点：
      en: |-
        At some point a function $f(x, y)$ has $\frac{\partial f}{\partial x} = 0$ and $\frac{\partial f}{\partial y} > 0$. This point:
    choices:
      - zh-cn: 是最大值点，因为对 $x$ 的偏导数为 0
        en: Is a maximum, because the partial derivative with respect to $x$ is 0
        why:
          zh-cn: 没有约束的内部最大值点，需要哪些偏导数为 0？
          en: At an unconstrained interior maximum, which partial derivatives must be 0?
      - zh-cn: 不是最大值点：稍微增大 $y$ 就能使 $f$ 更大
        en: 'Is not a maximum: increasing $y$ slightly makes $f$ larger'
      - zh-cn: 是最小值点
        en: Is a minimum
        why:
          zh-cn: 在这一点，沿某个方向移动能使 $f$ 变大或变小吗？最小值点要满足什么？
          en: Can moving in some direction make $f$ larger or smaller at this point? What must hold at a minimum?
      - zh-cn: 只有知道二阶偏导数才能判断它是不是最大值点
        en: Only the second partial derivatives can tell whether it is a maximum
        why:
          zh-cn: 二阶条件用来区分满足一阶条件的点。这一点满足全部一阶条件吗？
          en: Second-order conditions sort out points that satisfy the first-order conditions. Does this point satisfy all of them?
    correct: B
    answer:
      zh-cn: |-
        (B)。没有约束时，内部最优点处所有偏导数都要为 0。$\frac{\partial f}{\partial y} > 0$ 说明保持 $x$ 不变、增大 $y$ 时 $f$ 增加，所以这一点既不是最大值点也不是最小值点，不需要再看二阶条件。
      en: |-
        (B). Without constraints, all partial derivatives must be 0 at an interior optimum. $\frac{\partial f}{\partial y} > 0$ means that $f$ rises when $y$ increases with $x$ held fixed, so the point is neither a maximum nor a minimum, and there is no need to look at second-order conditions.

  - id: C3
    kind: check
    section: lagrange
    concepts: [lagrange-multiplier, shadow-price, budget-constraint]
    question:
      zh-cn: |-
        在讲义的例子中（$U = xy$，$p_x = 2$，$p_y = 4$，预算 100 美元），$\lambda = 6.25$。由此可知，预算从 100 美元增加到 200 美元时，最大效用大约增加 $100 \times 6.25 = 625$。
      en: |-
        In the lesson's example ($U = xy$, $p_x = 2$, $p_y = 4$, a budget of 100 dollars), $\lambda = 6.25$. So when the budget rises from 100 to 200 dollars, the maximum utility rises by about $100 \times 6.25 = 625$.
    correct: false
    hint:
      zh-cn: $\lambda$ 描述的是预算变化很小时的效用变化。预算大幅增加时，$\lambda$ 本身会不会变？
      en: $\lambda$ describes the change in utility for a small change in the budget. When the budget rises a lot, does $\lambda$ itself change?
    answer:
      zh-cn: |-
        错。$\lambda$ 是影子价格，只说明预算多 1 美元时最大效用约增加多少。这里 $U^* = \frac{M^2}{32}$，预算越多，$\lambda$ 越大：预算为 200 美元时 $U^* = 1250$，比 312.5 多 937.5，远大于 625。大幅变化时，不能把 $\lambda$ 当作不变的单价。
      en: |-
        False. $\lambda$ is a shadow price: it tells only how much the maximum utility rises with one more dollar of budget. Here $U^* = \frac{M^2}{32}$, and $\lambda$ grows with the budget: with a budget of 200 dollars $U^* = 1250$, which is 937.5 more than 312.5, far more than 625. For large changes, $\lambda$ cannot be treated as a fixed price per dollar.

  - id: C4
    kind: check
    section: corner
    concepts: [corner-solution, lagrange-multiplier, budget-constraint]
    question:
      zh-cn: |-
        用拉格朗日乘数法求消费者的最优选择，解出 $x = 10$，$y = -0.5$。下一步应该怎样做？
      en: |-
        Solving a consumer's choice with the Lagrange multiplier method gives $x = 10$ and $y = -0.5$. What should be done next?
    choices:
      - zh-cn: 接受这个解，$y$ 为负表示把这种商品卖给别人
        en: Accept the solution; a negative $y$ means selling the good to others
        why:
          zh-cn: 消费者能买到负数量的商品吗？拉格朗日法保证满足哪些约束？
          en: Can a consumer buy a negative quantity of a good? Which constraints does the Lagrange method guarantee?
      - zh-cn: 改为 $y = 0$，把预算全部花在 $x$ 上，并检查这时挪一美元是否还能提高效用
        en: Set $y = 0$, spend the whole budget on $x$, and check whether moving a dollar can still raise utility
      - zh-cn: 取绝对值，改为 $y = 0.5$
        en: Take the absolute value and use $y = 0.5$
        why:
          zh-cn: 改成 0.5 之后，还在预算线上吗？这样做有什么依据？
          en: Is the point still on the budget line after the change? What would justify it?
      - zh-cn: 说明这个问题没有最优解
        en: Conclude that the problem has no optimum
        why:
          zh-cn: 预算线上可行的那一段有没有效用最高的点？
          en: Does the feasible part of the budget line have a point with the highest utility?
    correct: B
    answer:
      zh-cn: |-
        (B)。拉格朗日法只保证满足写进拉格朗日函数的等式约束，不保证非负。解出负数说明最优点在边界上，是角点解：$y = 0$，钱全部花在 $x$ 上。在角点处检查等边际条件的方向：如果 $\frac{MU_x}{p_x} > \frac{MU_y}{p_y}$，消费者还想从 $y$ 挪钱到 $x$，但 $y$ 已经是 0，这就是最优点。
      en: |-
        (B). The Lagrange method guarantees only the equality constraints written into the Lagrangian, not nonnegativity. A negative solution means the optimum is on the boundary, a corner solution: $y = 0$, with all money spent on $x$. At the corner, check the direction of the equal-marginal condition: if $\frac{MU_x}{p_x} > \frac{MU_y}{p_y}$, the consumer would like to move money from $y$ to $x$, but $y$ is already 0, so this is the optimum.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [first-order-condition, second-order-condition]
    question:
      zh-cn: |-
        判断真假并说明理由：若 $f'(x^*) = 0$，则 $x^*$ 一定是 $f$ 的最大值点。
      en: |-
        Determine whether this statement is true or false, and explain: if $f'(x^*) = 0$, then $x^*$ is a maximum point of $f$.
    answer:
      zh-cn: |-
        假。导数为 0 的点也可能是最小值点（如 $f = x^2$ 在 0 处），或者既不是最大值也不是最小值的拐点（如 $f = x^3$ 在 0 处）。一阶条件是必要条件，不是充分条件；还要用二阶条件判断，而且二阶条件只能说明是局部最大值。
      en: |-
        False. A point where the derivative is 0 can also be a minimum (for example $f = x^2$ at 0), or an inflection point that is neither a maximum nor a minimum (for example $f = x^3$ at 0). The first-order condition is necessary, not sufficient; the second-order condition is also needed, and it only shows a local maximum.
    rubric:
      zh-cn:
        - "结论为假。"
        - "举出反例（最小值或拐点），或说明一阶条件只是必要条件。"
      en:
        - "States false."
        - "Gives a counterexample (a minimum or an inflection point), or explains that the first-order condition is only necessary."

  - id: Q2
    kind: exercise
    level: A
    concepts: [fixed-cost, variable-cost, marginal-cost, profit-maximization, sunk-cost]
    expected: { pi: "-100", pi25: "-125" }
    question:
      zh-cn: |-
        一家公司按价格 40 美元出售产品，成本为 $C(q) = 500 + q^2$，其中 500 是固定成本。经理说：“我们的固定成本很高，所以要多生产，把固定成本分摊到更多产品上，每件的成本降下来，利润就会更高。”
        (a) 比较 $q = 20$ 和 $q = 25$ 时的利润，评价经理的说法。
        (b) 公司在利润最高的产量下仍然亏损。短期内，如果 500 是已经签约、无论是否生产都要付的租金，公司应该停产吗？长期呢？
      en: |-
        A firm sells its product at 40 dollars, with cost $C(q) = 500 + q^2$, where 500 is the fixed cost. The manager says: "Our fixed cost is high, so we should produce more and spread it over more units; with a lower cost per unit, profit will be higher."
        (a) Compare the profit at $q = 20$ and at $q = 25$, and evaluate the manager's statement.
        (b) Even at the profit-maximizing output the firm loses money. In the short run, if the 500 is rent already contracted and payable whether or not the firm produces, should it stop producing? What about the long run?
    answer:
      zh-cn: |-
        (a) $\pi(20) = 800 - 500 - 400 = -100$，$\pi(25) = 1000 - 500 - 625 = -125$。多生产反而亏得更多。经理错在用分摊后的固定成本做决策：多生产一件时固定成本不变，该比较的是多生产一件的收入 40 和边际成本 $2q$。$q > 20$ 时边际成本超过 40，多生产的每一件都在亏钱。固定成本不影响 $q^* = 20$。
        (b) 短期内租金是沉没成本，停产仍要付 500，亏损 500；生产 20 件只亏 100，所以应该继续生产。长期内租约到期，固定成本可以避免；如果价格不变，最大利润仍为 −100，就应该退出。
      en: |-
        (a) $\pi(20) = 800 - 500 - 400 = -100$ and $\pi(25) = 1000 - 500 - 625 = -125$. Producing more loses more. The manager decides with the fixed cost spread per unit, but one more unit does not change the fixed cost; the comparison is between the revenue of one more unit, 40, and the marginal cost $2q$. Above $q = 20$ the marginal cost exceeds 40, so each extra unit loses money. The fixed cost does not affect $q^* = 20$.
        (b) In the short run the rent is a sunk cost: stopping still costs 500, a loss of 500, while producing 20 units loses only 100, so the firm should keep producing. In the long run the lease ends and the fixed cost can be avoided; if the price stays the same, the maximum profit is still −100, and the firm should exit.
    rubric:
      zh-cn:
        - "(a) 利润 −100 和 −125，并指出决策应比较边际收入和边际成本，固定成本不影响产量。"
        - "(b) 短期继续生产（停产亏损更多），长期退出。只说“亏损就停产”：需要订正。"
      en:
        - "(a) Profits of −100 and −125, and points out that the decision compares marginal revenue with marginal cost and that the fixed cost does not affect output."
        - "(b) Keep producing in the short run (stopping loses more) and exit in the long run. Saying only \"stop when losing money\": needs revision."

  - id: Q4
    kind: exercise
    level: B
    concepts: [lagrange-multiplier, budget-constraint]
    expected: { x: "10", y: "10", lambda: "100", u: "1000" }
    question:
      zh-cn: |-
        $U = x^2 y$，$p_x = 2$，$p_y = 1$，预算 $M = 30$。用拉格朗日乘数法求 $x^*$、$y^*$、$\lambda$，以及两种商品的支出各占预算的比例。
      en: |-
        $U = x^2 y$, $p_x = 2$, $p_y = 1$, and the budget is $M = 30$. Use the Lagrange multiplier method to find $x^*$, $y^*$ and $\lambda$, and the share of the budget spent on each good.
    answer:
      zh-cn: |-
        $\mathcal{L} = x^2 y + \lambda(30 - 2x - y)$。一阶条件 $2xy = 2\lambda$、$x^2 = \lambda$，得 $xy = x^2$，即 $x(x - y) = 0$。
        $x = 0$ 时 $U = 0$，不是最大值，舍去；所以 $x = y$，代入 $2x + y = 30$ 得 $x^* = y^* = 10$，$\lambda = 100$，$U^* = 1000$。
        支出：$x$ 上 20 美元，占 2/3；$y$ 上 10 美元，占 1/3。
      en: |-
        $\mathcal{L} = x^2 y + \lambda(30 - 2x - y)$. The first-order conditions $2xy = 2\lambda$ and $x^2 = \lambda$ give $xy = x^2$, that is, $x(x - y) = 0$.
        $x = 0$ gives $U = 0$, which is not a maximum, so it is rejected. So $x = y$, and $2x + y = 30$ gives $x^* = y^* = 10$, $\lambda = 100$ and $U^* = 1000$.
        Spending: 20 dollars on $x$, which is 2/3 of the budget, and 10 dollars on $y$, which is 1/3.
    rubric:
      zh-cn:
        - "一阶条件正确，并处理了 $x = 0$ 的情形。"
        - "$x^*$、$y^*$、$\\lambda$ 正确。"
        - "支出比例为 2/3 与 1/3。"
      en:
        - "The first-order conditions are correct, and the case $x = 0$ is handled."
        - "$x^*$, $y^*$ and $\\lambda$ are correct."
        - "The spending shares are 2/3 and 1/3."

  - id: Q5
    kind: exercise
    level: C
    concepts: [lagrange-multiplier, budget-constraint]
    question:
      zh-cn: |-
        对一般的价格 $p_x$、$p_y$ 和预算 $M$，求 $U = xy$ 的需求函数 $x^*$、$y^*$ 与 $\lambda$。从结果中能看出哪些经济含义？至少说明两点。
      en: |-
        For general prices $p_x$, $p_y$ and budget $M$, find the demand functions $x^*$, $y^*$ and $\lambda$ for $U = xy$. What economic meaning can you see in the result? Explain at least two points.
    answer:
      zh-cn: |-
        $\mathcal{L} = xy + \lambda(M - p_x x - p_y y)$，$y = \lambda p_x$，$x = \lambda p_y$，代入约束得
        $x^* = \frac{M}{2p_x}$，$y^* = \frac{M}{2p_y}$，$\lambda = \frac{M}{2p_xp_y}$。
        含义：(1) 每种商品的支出都是预算的一半（$p_x x^* = p_y y^* = \frac{M}{2}$），支出占比与价格无关。(2) $x^*$ 的式子里没有 $p_y$：$y$ 涨价时，消费者只减少 $y$，对 $x$ 的需求不变（[[1.2]] 会用替代效应和收入效应相互抵消来解释）。其他正确的含义也可以，例如需求随预算成比例增加、随自身价格下降。
      en: |-
        $\mathcal{L} = xy + \lambda(M - p_x x - p_y y)$ gives $y = \lambda p_x$ and $x = \lambda p_y$; substituting into the constraint gives
        $x^* = \frac{M}{2p_x}$, $y^* = \frac{M}{2p_y}$ and $\lambda = \frac{M}{2p_xp_y}$.
        Meaning: (1) spending on each good is half of the budget ($p_x x^* = p_y y^* = \frac{M}{2}$), so the spending shares do not depend on prices. (2) $p_y$ does not appear in $x^*$: when $y$ becomes more expensive, the consumer buys less $y$ but the same amount of $x$ ([[1.2]] explains this as the substitution effect and the income effect cancelling out). Other correct points are also acceptable, for example that demand rises in proportion to the budget and falls with the good's own price.
    rubric:
      zh-cn:
        - "需求函数和 $\\lambda$ 正确。"
        - "说明至少两点正确的经济含义，例如支出占比固定、$x^*$ 与 $p_y$ 无关。"
      en:
        - "The demand functions and $\\lambda$ are correct."
        - "Explains at least two correct economic points, for example fixed spending shares and $x^*$ not depending on $p_y$."

  - id: Q6
    kind: exercise
    level: C
    star: true
    concepts: [lagrange-multiplier, shadow-price]
    question:
      zh-cn: |-
        由 [[check:Q5]] 求出最大效用 $U^*(M)$，验证 $\frac{dU^*}{dM} = \lambda$。如果把拉格朗日函数写成 $xy + \lambda(p_x x + p_y y - M)$，$x^*$、$y^*$ 和 $\lambda$ 会有什么变化？$\lambda$ 的含义要怎样调整？
      en: |-
        Use [[check:Q5]] to find the maximum utility $U^*(M)$, and verify that $\frac{dU^*}{dM} = \lambda$. If the Lagrangian is written as $xy + \lambda(p_x x + p_y y - M)$ instead, how do $x^*$, $y^*$ and $\lambda$ change? How must the meaning of $\lambda$ be adjusted?
    answer:
      zh-cn: |-
        $U^* = x^* y^* = \frac{M^2}{4p_xp_y}$，$\frac{dU^*}{dM} = \frac{M}{2p_xp_y} = \lambda$。
        换成另一种写法后，一阶条件只是 $\lambda$ 变号，$x^*$、$y^*$ 不变，$\lambda = -\frac{M}{2p_xp_y}$。这时 $\frac{dU^*}{dM} = -\lambda > 0$：影子价格是 $-\lambda$，经济含义不变，只是符号约定不同。
      en: |-
        $U^* = x^* y^* = \frac{M^2}{4p_xp_y}$ and $\frac{dU^*}{dM} = \frac{M}{2p_xp_y} = \lambda$.
        With the other form, only the sign of $\lambda$ in the first-order conditions changes: $x^*$ and $y^*$ stay the same and $\lambda = -\frac{M}{2p_xp_y}$. Then $\frac{dU^*}{dM} = -\lambda > 0$: the shadow price is $-\lambda$. The economic meaning is the same; only the sign convention differs.
    rubric:
      zh-cn:
        - "$U^*(M)$ 和导数正确，等于 $\\lambda$。"
        - "指出换写法后 $x^*$、$y^*$ 不变，$\\lambda$ 变号，影子价格是 $-\\lambda$。"
      en:
        - "$U^*(M)$ and its derivative are correct and equal $\\lambda$."
        - "Points out that with the other form $x^*$ and $y^*$ do not change, $\\lambda$ changes sign, and the shadow price is $-\\lambda$."
