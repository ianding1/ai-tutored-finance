# Answer key for lesson 1.8. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.1]] (lesson), [[1.8#tax-incidence]] (section), [[concept:externality]], [[check:Q2]], [[fig:3-1]].
# expected: values are recomputed by course/verify/1.8.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "1.8"

context:
  - zh-cn: |-
      学习者学过供给、需求与均衡（[[1.1]]）、竞争厂商的供给曲线就是边际成本曲线（[[1.5]]）、垄断（[[1.6]]），以及囚徒困境与纳什均衡（[[1.7]]）。本课是简讲：只用线性的需求和供给，没有讲一般均衡和福利定理的正式表述。
    en: |-
      The learner has studied supply, demand and equilibrium ([[1.1]]), that a competitive firm's supply curve is its marginal cost curve ([[1.5]]), monopoly ([[1.6]]), and the prisoner's dilemma and Nash equilibrium ([[1.7]]). This is a short lesson: it uses only linear demand and supply and does not cover general equilibrium or a formal statement of the welfare theorems.
  - concepts: [consumer-surplus, producer-surplus, deadweight-loss]
    zh-cn: |-
      讲义的例子：[[1.1]] 的咖啡豆市场 $Q_d = 100 - 2P$、$Q_s = -20 + 4P$，即 $P = 50 - \frac{Q}{2}$、$P = 5 + \frac{Q}{4}$，均衡价格 20、数量 60（千袋 / 周）；消费者剩余 900、生产者剩余 450、总剩余 1,350（千美元 / 周）。讲义说明竞争均衡使总剩余最大，有效率不等于公平。无谓损失的例子：[[1.6]] 的垄断（$P = 100 - Q$，边际成本 20），无谓损失 800，垄断利润 1600 是转移。
    en: |-
      The lesson's example: the coffee-bean market of [[1.1]], $Q_d = 100 - 2P$ and $Q_s = -20 + 4P$, that is, $P = 50 - \frac{Q}{2}$ and $P = 5 + \frac{Q}{4}$, with equilibrium price 20 and quantity 60 (thousand bags per week); consumer surplus 900, producer surplus 450, total surplus 1,350 (thousand dollars per week). The lesson explains that the competitive equilibrium maximizes total surplus and that efficient does not mean fair. Deadweight-loss example: the monopoly of [[1.6]] ($P = 100 - Q$, marginal cost 20), with deadweight loss 800; the monopoly profit of 1600 is a transfer.
  - concepts: [tax-incidence]
    zh-cn: |-
      讲义对卖方征收每袋 $t$ 美元的税：$100 - 2P_b = -20 + 4(P_b - t)$。$t = 6$ 时买方付 24、卖方得 18、数量 52，买方承担三分之二；税收 312，无谓损失 24。[[fig:3-1]]：税额滑块从 0 到 30，步长 1，默认 0；读数显示买方付的价格、卖方得到的价格、数量、消费者剩余、生产者剩余、税收和无谓损失。讲义没有给出税负分配与弹性的一般关系（留给练习题），也没有计算向买方征税的情形（留给练习题）。讲义提到对证券交易征税时交易量可能大幅减少。
    en: |-
      The lesson taxes sellers $t$ dollars per bag: $100 - 2P_b = -20 + 4(P_b - t)$. At $t = 6$ buyers pay 24, sellers receive 18, the quantity is 52, and buyers bear two thirds; tax revenue is 312 and the deadweight loss is 24. [[fig:3-1]]: a tax slider from 0 to 30 in steps of 1 (default 0); the readout shows the price buyers pay, the price sellers receive, the quantity, consumer surplus, producer surplus, tax revenue and deadweight loss. The lesson does not give the general relation between the split of the tax and elasticities (left to an exercise), nor does it compute the case of a tax on buyers (left to an exercise). The lesson mentions that a tax on securities trading may reduce trading volume sharply.
  - concepts: [externality, pigouvian-tax]
    zh-cn: |-
      讲义：负外部性时社会边际成本 = 企业的边际成本 + 外部成本，市场生产太多；正外部性时生产太少。庇古税等于每单位的外部成本，减少无谓损失。提到科斯定理（谈判成本高时难以做到）和金融业的系统性风险（系统重要性银行多持有资本，作用类似庇古税）。
    en: |-
      The lesson: with a negative externality, social marginal cost = the firm's marginal cost + the external cost, and the market produces too much; with a positive externality it produces too little. A Pigouvian tax equals the external cost per unit and reduces the deadweight loss. The lesson mentions the Coase theorem (hard to apply when bargaining is costly) and systemic risk in finance (systemically important banks must hold more capital, which works like a Pigouvian tax).
  - concepts: [public-good]
    zh-cn: |-
      讲义按竞争性和排他性分为私人物品、俱乐部物品、公共资源和公共品；公共品有搭便车问题，与囚徒困境类似，通常由政府提供；公共资源被过度使用。讲义提到价格信息是金融市场中的公共品，被动投资者搭主动投资者的便车。
    en: |-
      The lesson classifies goods by rivalry and excludability into private goods, club goods, common resources and public goods; public goods have a free-rider problem, similar to the prisoner's dilemma, and are usually provided by the government; common resources are overused. The lesson mentions that price information is a public good in financial markets, with passive investors free-riding on active investors.

common_errors:
  - questions: [C1, C2, C4]
    zh-cn: |-
      计算剩余时用错了三角形的高或底：消费者剩余的高是需求曲线截距减去价格，生产者剩余的高是价格减去供给曲线截距；需求写成 $Q = \ldots$ 时要先改写成价格的形式。
    en: |-
      Using the wrong height or base for the surplus triangles: the height of consumer surplus is the demand intercept minus the price, and the height of producer surplus is the price minus the supply intercept; demand written as $Q = \ldots$ must first be rewritten in terms of the price.
  - questions: [C2]
    zh-cn: |-
      把垄断利润当作无谓损失。利润是从消费者转到垄断者的，总剩余中消失的只有三角形。
    en: |-
      Counting the monopoly profit as deadweight loss. The profit is transferred from consumers to the monopolist; only the triangle disappears from total surplus.
  - questions: [C3, Q1, Q2]
    zh-cn: |-
      认为由谁把税交给政府，谁就承担税负；或者认为价格会上涨整个税额。
    en: |-
      Thinking that whoever hands the tax to the government bears it, or that the price rises by the full amount of the tax.
  - questions: [C3, Q3]
    zh-cn: |-
      把税收当作无谓损失。税收是转移；无谓损失只来自没有发生的交易。
    en: |-
      Counting tax revenue as deadweight loss. The revenue is a transfer; the deadweight loss comes only from trades that no longer happen.
  - questions: [C4, Q5]
    zh-cn: |-
      用社会边际成本求市场的实际产量，或者用企业的边际成本求社会最优产量，把两者弄反。
    en: |-
      Using social marginal cost to find the market's actual output, or the firm's own marginal cost to find the social optimum, mixing the two up.
  - questions: [Q4]
    zh-cn: |-
      以为只要装路灯对两户都有利，它就一定会被装上。每户都希望对方出钱，自己搭便车；不出钱是占优策略时，结果是谁也不出，和囚徒困境相同。
    en: |-
      Thinking the streetlight will be installed because it benefits both households. Each hopes the other will pay and free rides; when not paying is a dominant strategy, no one pays, as in the prisoner's dilemma.
  - questions: [C5]
    zh-cn: |-
      把“免费”当作公共品的标准，或者把公共资源（有竞争性）当作公共品。
    en: |-
      Treating "free of charge" as the test for a public good, or treating a common resource (which is rival) as a public good.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: surplus
    concepts: [consumer-surplus, producer-surplus]
    question:
      zh-cn: |-
        在竞争市场中，如果成交量因为某种原因少于均衡数量，总剩余（消费者剩余加生产者剩余）会减少。
      en: |-
        In a competitive market, if for some reason fewer units are traded than the equilibrium quantity, total surplus (consumer plus producer surplus) falls.
    correct: true
    hint:
      zh-cn: 那些没有成交的单位，买方愿意付的价格和卖方的成本相比，是高还是低？
      en: For the units that are no longer traded, is the buyers' willingness to pay above or below the sellers' cost?
    answer:
      zh-cn: |-
        对。在均衡数量以内，每一单位的支付意愿（需求曲线的高度）都高于卖方的成本（供给曲线的高度），每成交一单位都创造剩余。成交量少于均衡时，这些本来能创造剩余的交易没有发生，总剩余减少，减少的部分就是无谓损失。同理，成交量多于均衡时，多出的单位成本高于支付意愿，总剩余也减少。
      en: |-
        True. Up to the equilibrium quantity, each unit's willingness to pay (the height of the demand curve) exceeds the seller's cost (the height of the supply curve), so each trade creates surplus. With fewer trades, these surplus-creating trades do not happen and total surplus falls; the loss is the deadweight loss. Likewise, trading more than the equilibrium quantity adds units whose cost exceeds the willingness to pay, which also lowers total surplus.

  - id: C2
    kind: check
    section: deadweight-loss
    concepts: [deadweight-loss, consumer-surplus, monopoly]
    question:
      zh-cn: |-
        一个市场从完全竞争变为垄断。完全竞争时的消费者剩余在垄断时：
      en: |-
        A market changes from perfect competition to monopoly. The consumer surplus under perfect competition, under monopoly:
    choices:
      - zh-cn: 一部分仍是消费者剩余，一部分成为垄断利润，一部分成为无谓损失
        en: Is partly still consumer surplus, partly monopoly profit and partly deadweight loss
      - zh-cn: 全部成为垄断利润
        en: Becomes entirely monopoly profit
        why:
          zh-cn: 垄断时仍在购买的消费者，付的价格比他们愿意付的最高价格低吗？
          en: Do the consumers still buying under monopoly pay less than the most they are willing to pay?
      - zh-cn: 一部分成为利润，其余仍是消费者剩余，总剩余不变
        en: Partly becomes profit and the rest stays consumer surplus, so total surplus is unchanged
        why:
          zh-cn: 垄断时产量减少了。那些不再成交的单位，原来创造的剩余到了谁手里？
          en: Output falls under monopoly. Where does the surplus of the units no longer traded go?
      - zh-cn: 全部成为无谓损失
        en: Becomes entirely deadweight loss
        why:
          zh-cn: 垄断者赚到的利润从哪里来？仍在购买的消费者还有剩余吗？
          en: Where does the monopolist's profit come from? Do the consumers still buying keep any surplus?
    correct: A
    answer:
      zh-cn: |-
        (A)。垄断者提价、减产。仍在购买的消费者付更高的价格，他们的一部分剩余转给垄断者，成为利润；这是转移，总剩余不变。不再成交的那些单位，支付意愿高于边际成本，本来能创造剩余，现在谁也得不到，这是无谓损失。例如需求 $P = 120 - 2Q$、边际成本 40 时，1600 的消费者剩余分为 400 的消费者剩余、800 的利润和 400 的无谓损失。
      en: |-
        (A). The monopolist raises the price and cuts output. Consumers who still buy pay more, and part of their surplus goes to the monopolist as profit; this is a transfer and leaves total surplus unchanged. The units no longer traded had a willingness to pay above marginal cost and would have created surplus that now goes to no one: the deadweight loss. With demand $P = 120 - 2Q$ and marginal cost 40, for example, the consumer surplus of 1600 splits into 400 of consumer surplus, 800 of profit and 400 of deadweight loss.

  - id: C3
    kind: check
    section: tax-incidence
    concepts: [tax-incidence, deadweight-loss]
    widget: { id: surplus-tax, set: { t: 12 } }
    question:
      zh-cn: |-
        在 [[fig:3-1]] 的咖啡豆市场中，价格每变化 1 美元，需求量变化 2 千袋，供给量变化 4 千袋。对卖方征税时，哪一方承担的税更多？
      en: |-
        In the coffee-bean market of [[fig:3-1]], each 1-dollar change in price changes the quantity demanded by 2 thousand bags and the quantity supplied by 4 thousand bags. With a tax levied on sellers, which side bears more of it?
    choices:
      - zh-cn: 买方，因为需求对价格更不敏感
        en: Buyers, because demand is less sensitive to price
      - zh-cn: 卖方，因为税是向卖方征收的
        en: Sellers, because the tax is levied on them
        why:
          zh-cn: 拖动税额，看买方付的价格和卖方得到的价格各变化了多少。谁交税和谁承担税是一回事吗？
          en: Move the tax slider and see how much the buyers' price and the sellers' price each change. Is who pays the tax to the government the same as who bears it?
      - zh-cn: 各承担一半
        en: Each side bears half
        why:
          zh-cn: 读一下图中买方多付和卖方少得的金额，两者相等吗？
          en: Read off how much more buyers pay and how much less sellers get. Are they equal?
      - zh-cn: 卖方，因为供给对价格更敏感
        en: Sellers, because supply is more sensitive to price
        why:
          zh-cn: 对价格更敏感的一方，能不能更容易地通过改变数量躲开税？
          en: Can the side more sensitive to price more easily avoid the tax by changing quantity?
    correct: A
    answer:
      zh-cn: |-
        (A)。卖方对价格更敏感：价格稍低，他们就大量减少供给，所以价格的调整主要落在买方身上。在这个市场中，买方承担三分之二（例如税额 12 美元时，买方多付 8，卖方少得 4）。对价格越不敏感的一方，越难通过改变数量躲开税，承担得越多；税由谁交给政府不影响这个结果。
      en: |-
        (A). Sellers are more sensitive to price: when the price they get falls a little, they cut supply a lot, so most of the price adjustment falls on buyers. In this market buyers bear two thirds (with a 12-dollar tax, for example, buyers pay 8 more and sellers get 4 less). The less price-sensitive side finds it harder to escape the tax by changing quantity and bears more of it; who hands the tax to the government does not change this.

  - id: C4
    kind: check
    section: externalities
    concepts: [externality, pigouvian-tax, deadweight-loss]
    question:
      zh-cn: |-
        一种产品的生产会污染环境，污染的损失由附近居民承担，企业不承担。竞争市场的产量会高于社会最优的产量。
      en: |-
        Producing a good pollutes the environment, and the damage falls on nearby residents rather than on the firms. The competitive market produces more than the socially optimal quantity.
    correct: true
    hint:
      zh-cn: 企业按自己的边际成本决定产量。社会的边际成本比企业的边际成本高还是低？
      en: Firms set output by their own marginal cost. Is the social marginal cost above or below it?
    answer:
      zh-cn: |-
        对。企业只考虑自己的成本，不考虑污染的损失，所以市场的供给曲线是企业的边际成本，低于社会边际成本。市场产量在需求等于企业边际成本处，超过了需求等于社会边际成本的社会最优产量；多生产的那些单位，社会成本高于支付意愿，造成无谓损失。按每单位损失征收庇古税，可以让企业把外部成本算进自己的决策。
      en: |-
        True. Firms count only their own costs, not the pollution damage, so market supply follows the firms' marginal cost, which is below the social marginal cost. Market output is where demand equals the firms' marginal cost, above the social optimum where demand equals social marginal cost; the extra units cost society more than buyers are willing to pay, a deadweight loss. A Pigouvian tax equal to the damage per unit makes firms count the external cost.

  - id: C5
    kind: check
    section: public-goods
    concepts: [public-good]
    question:
      zh-cn: |-
        如果完全交给市场，下面哪一种最可能提供得太少？
      en: |-
        Left entirely to the market, which of these is most likely to be underprovided?
    choices:
      - zh-cn: 免费播出的天气预报
        en: A weather forecast broadcast for free
      - zh-cn: 一家视频网站的会员
        en: A membership of a video streaming site
        why:
          zh-cn: 不付费的人能看这家网站的视频吗？网站能向用户收费、收回成本吗？
          en: Can people who do not pay watch the site's videos? Can the site charge users and recover its costs?
      - zh-cn: 公海里的鱼
        en: Fish in the open sea
        why:
          zh-cn: 公海里的鱼的问题，是没有人提供，还是被捕得太多？
          en: Is the problem with fish in the open sea that no one provides them, or that too many are caught?
      - zh-cn: 一份外卖午餐
        en: A delivered lunch
        why:
          zh-cn: 一份午餐一个人吃了别人就不能吃，不付钱也拿不到。市场能提供它吗？
          en: A lunch eaten by one person cannot be eaten by another, and cannot be had without paying. Can the market provide it?
    correct: A
    answer:
      zh-cn: |-
        (A)。免费播出的天气预报是公共品：一个人收听不减少别人可以收听的，也无法阻止不付钱的人收听。没有人能向搭便车的人收费，私人提供者收不回成本，所以容易提供得太少。视频网站会员是俱乐部物品，外卖午餐是私人物品，市场都能提供；公海里的鱼是公共资源，问题相反，是被过度捕捞。
      en: |-
        (A). A free weather broadcast is a public good: one person listening does not reduce what others can hear, and non-payers cannot be stopped from listening. No one can charge the free riders, so private providers cannot recover their costs and it tends to be underprovided. A streaming membership is a club good and a lunch a private good, both provided by markets; fish in the open sea are a common resource, with the opposite problem of overfishing.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [tax-incidence]
    expected: { pb: "24", ps: "18", q: "52" }
    question:
      zh-cn: |-
        在讲义的咖啡豆市场中，改为向买方征收每袋 6 美元的税：买方每买一袋，除了付给卖方的价格 $P_s$，还要另交 6 美元给政府。求买方付的总价、卖方得到的价格和成交量，并与讲义中向卖方征税的结果比较。这说明了什么？
      en: |-
        In the lesson's coffee-bean market, tax buyers 6 dollars per bag instead: for each bag, a buyer pays the seller the price $P_s$ and also pays 6 dollars to the government. Find the total price buyers pay, the price sellers receive and the quantity traded, and compare with the lesson's result for a tax on sellers. What does this show?
    answer:
      zh-cn: |-
        买方按总价 $P_s + 6$ 决定需求量：$100 - 2(P_s + 6) = -20 + 4P_s$，$88 - 2P_s = -20 + 4P_s$，$P_s = 18$。买方付的总价 24，数量 52。
        与向卖方征税完全相同：买方付 24、卖方得 18、数量 52。税负怎样分配只取决于需求和供给，与法律规定由谁缴税无关；法律只决定谁把钱交给政府。
      en: |-
        Buyers decide how much to buy based on the total price $P_s + 6$: $100 - 2(P_s + 6) = -20 + 4P_s$, so $88 - 2P_s = -20 + 4P_s$ and $P_s = 18$. Buyers pay 24 in total, and the quantity is 52.
        This is exactly the same as with a tax on sellers: buyers pay 24, sellers receive 18, and the quantity is 52. How the burden is split depends only on demand and supply, not on who the law says must pay; the law only decides who hands the money to the government.
    rubric:
      zh-cn:
        - "正确列出方程，得到买方付 24、卖方得 18、数量 52。"
        - "指出结果与向卖方征税相同，税负分配与由谁缴税无关。"
      en:
        - "Sets up the equation correctly: buyers pay 24, sellers receive 18, quantity 52."
        - "Points out that the result is the same as taxing sellers, so the split does not depend on who pays."

  - id: Q2
    kind: exercise
    level: B
    star: true
    concepts: [tax-incidence, deadweight-loss, price-elasticity]
    question:
      zh-cn: |-
        一般的线性市场：需求 $Q_d = a - bP$，供给 $Q_s = c + dP$（$b, d > 0$）。对每单位征税 $t$。
        (a) 证明买方承担的比例为 $\frac{d}{b + d}$，并把它写成税前均衡点的弹性形式 $\frac{e_s}{e_s + |e_d|}$。用一句话解释。
        (b) 证明无谓损失 $= \frac{bd}{2(b + d)}\,t^2$。税额加倍时，无谓损失怎样变化？
      en: |-
        A general linear market: demand $Q_d = a - bP$ and supply $Q_s = c + dP$ ($b, d > 0$). A tax of $t$ per unit is imposed.
        (a) Show that buyers bear a share $\frac{d}{b + d}$ of the tax, and write it in elasticity form at the pre-tax equilibrium, $\frac{e_s}{e_s + |e_d|}$. Explain in one sentence.
        (b) Show that the deadweight loss is $\frac{bd}{2(b + d)}\,t^2$. How does it change when the tax doubles?
    answer:
      zh-cn: |-
        (a) $a - bP_b = c + d(P_b - t)$，$P_b = \frac{a - c + dt}{b + d}$，比税前 $\frac{a - c}{b + d}$ 高 $\frac{d}{b + d}\,t$。在税前均衡点，$|e_d| = b\frac{P^*}{Q^*}$，$e_s = d\frac{P^*}{Q^*}$，所以 $\frac{d}{b + d} = \frac{e_s}{e_s + |e_d|}$：对价格越不敏感的一方承担得越多。
        (b) 成交量减少 $\Delta Q = b \cdot \frac{d}{b + d}\,t$，无谓损失是高为 $t$、底为 $\Delta Q$ 的三角形：$\tfrac12 \cdot t \cdot \frac{bd}{b + d}\,t = \frac{bd}{2(b + d)}\,t^2$。与 $t^2$ 成正比：税额加倍，无谓损失变为 4 倍。（讲义中 $b = 2$、$d = 4$、$t = 6$ 时为 24。）
      en: |-
        (a) $a - bP_b = c + d(P_b - t)$ gives $P_b = \frac{a - c + dt}{b + d}$, which is $\frac{d}{b + d}\,t$ above the pre-tax price $\frac{a - c}{b + d}$. At the pre-tax equilibrium $|e_d| = b\frac{P^*}{Q^*}$ and $e_s = d\frac{P^*}{Q^*}$, so $\frac{d}{b + d} = \frac{e_s}{e_s + |e_d|}$: the less price-sensitive side bears more.
        (b) Quantity falls by $\Delta Q = b \cdot \frac{d}{b + d}\,t$, and the deadweight loss is a triangle of height $t$ and base $\Delta Q$: $\tfrac12 \cdot t \cdot \frac{bd}{b + d}\,t = \frac{bd}{2(b + d)}\,t^2$. It is proportional to $t^2$: doubling the tax quadruples the deadweight loss. (With the lesson's $b = 2$, $d = 4$, $t = 6$ it is 24.)
    rubric:
      zh-cn:
        - "(a) 推出比例和弹性形式，并解释。"
        - "(b) 推出公式，税额加倍时变为 4 倍。"
      en:
        - "(a) Derives the share and the elasticity form, with the explanation."
        - "(b) Derives the formula; doubling the tax quadruples it."

  - id: Q3
    kind: exercise
    level: B
    concepts: [tax-incidence, deadweight-loss]
    expected: { tmax: "22.5", rmax: "675", dwl: "337.5" }
    question:
      zh-cn: |-
        在讲义的咖啡豆市场中，政府想从这个市场得到尽可能多的税收。
        (a) 求使税收最大的每袋税额、最大税收和这时的无谓损失。
        (b) 税额超过这个水平后，继续提高税额会怎样？结合 [[fig:3-1]] 说明。
      en: |-
        In the lesson's coffee bean market, the government wants as much tax revenue as possible.
        (a) Find the tax per bag that maximizes revenue, the maximum revenue and the deadweight loss at that point.
        (b) What happens if the tax is raised beyond this level? Use [[fig:3-1]] to explain.
    answer:
      zh-cn: |-
        (a) 成交量 $Q = 60 - \frac{4t}{3}$，税收 $R(t) = t\left(60 - \frac{4t}{3}\right)$，$R'(t) = 60 - \frac{8t}{3} = 0$，$t = 22.5$，$R = 675$。无谓损失 $\tfrac12 \times 22.5 \times 30 = 337.5$，正好是税收的一半。
        (b) 再提高税额，成交量下降得更快，税收反而减少，无谓损失却继续增加。在图中把 $t$ 从 22 调到 30：税收从约 675 降到 600，无谓损失从约 323 增加到 600。
      en: |-
        (a) Quantity is $Q = 60 - \frac{4t}{3}$ and revenue $R(t) = t\left(60 - \frac{4t}{3}\right)$; $R'(t) = 60 - \frac{8t}{3} = 0$ gives $t = 22.5$ and $R = 675$. The deadweight loss is $\tfrac12 \times 22.5 \times 30 = 337.5$, exactly half the revenue.
        (b) A higher tax makes quantity fall faster, so revenue falls while the deadweight loss keeps growing. In the figure, moving $t$ from 22 to 30 lowers revenue from about 675 to 600 and raises the deadweight loss from about 323 to 600.
    rubric:
      zh-cn:
        - "(a) 22.5、675、337.5。"
        - "(b) 税收下降而无谓损失增加。"
      en:
        - "(a) 22.5, 675, 337.5."
        - "(b) Revenue falls while the deadweight loss rises."

  - id: Q4
    kind: exercise
    level: B
    concepts: [public-good, prisoners-dilemma, dominant-strategy]
    question:
      zh-cn: |-
        两户邻居考虑在两家之间装一盏路灯，成本 120 美元，每户从路灯得到的好处值 80 美元。如果两户都愿意出钱，各出 60；如果只有一户出钱，它出全部 120；如果都不出，就不装。
        (a) 写出收益矩阵（收益 = 好处 − 出的钱），预测结果。从总剩余看，应该装路灯吗？
        (b) 这和 [[1.7]] 的哪个博弈相同？给出一种解决办法。
      en: |-
        Two neighbors consider a streetlight between their houses, costing 120 dollars; each gets a benefit worth 80 dollars. If both are willing to pay, each pays 60; if only one pays, it pays all 120; if neither pays, there is no light.
        (a) Write the payoff matrix (payoff = benefit − payment) and predict the outcome. Judged by total surplus, should the light be built?
        (b) Which game from [[1.7]] is this? Give one way to solve the problem.
    answer:
      zh-cn: |-
        (a) 都出钱：(20, 20)；甲出、乙不出：(−40, 80)；甲不出、乙出：(80, −40)；都不出：(0, 0)。无论对方怎样，不出钱都更好（80 > 20，0 > −40），结果是不装。但总好处 160 大于成本 120，应该装，装上后总剩余增加 40。
        (b) 囚徒困境：各自的占优策略（搭便车）导致对双方都更差的结果。解决办法：由社区或政府向两户各收 60 美元（强制分摊），或者两户签订有约束力的协议。
      en: |-
        (a) Both pay: (20, 20); first pays, second does not: (−40, 80); first does not, second pays: (80, −40); neither: (0, 0). Whatever the other does, not paying is better (80 > 20, 0 > −40), so no light is built. But the total benefit of 160 exceeds the cost of 120, so it should be built, raising total surplus by 40.
        (b) A prisoners' dilemma: each one's dominant strategy (free riding) leads to an outcome worse for both. Solutions: a community or government charges each household 60 dollars (compulsory cost sharing), or the two sign a binding agreement.
    rubric:
      zh-cn:
        - "(a) 矩阵正确，预测不装，但应该装。"
        - "(b) 囚徒困境，给出合理的解决办法。"
      en:
        - "(a) Correct matrix; predicts no light, though it should be built."
        - "(b) A prisoners' dilemma, with a reasonable solution."

  - id: Q5
    kind: exercise
    level: C
    concepts: [externality, pigouvian-tax, deadweight-loss]
    expected: { lp: "10", ls: "8", tax: "4", dwl: "4" }
    question:
      zh-cn: |-
        一家大银行选择高风险贷款的规模 $L$（十亿美元），这些贷款给银行带来的预期利润为 $20L - L^2$（百万美元）。由于这家银行一旦出问题会牵连其他银行，每十亿美元的高风险贷款还给其他金融机构和纳税人带来 4 百万美元的预期损失，银行自己不承担。
        (a) 银行自己选择的 $L$ 和社会最优的 $L$ 各是多少？无谓损失是多少？
        (b) 监管机构对每十亿美元的高风险贷款收多少费用，能使银行选择社会最优的 $L$？为什么说这类监管类似于庇古税？
      en: |-
        A large bank chooses the size $L$ (billions of dollars) of its high-risk loans, which give it an expected profit of $20L - L^2$ (millions of dollars). Because trouble at this bank would spread to others, each billion of high-risk loans also causes 4 million dollars of expected losses to other institutions and taxpayers, which the bank does not bear.
        (a) What $L$ does the bank choose, and what is the socially optimal $L$? What is the deadweight loss?
        (b) What charge per billion of high-risk loans makes the bank choose the social optimum? Why is such regulation like a Pigouvian tax?
    answer:
      zh-cn: |-
        (a) 银行：$20 - 2L = 0$，$L = 10$。社会：$20 - 2L - 4 = 0$，$L = 8$。社会净收益 $20L - L^2 - 4L$ 在 $L = 8$ 时为 64，在 $L = 10$ 时为 60，无谓损失 4 百万美元。
        (b) 每十亿美元收 4 百万美元（或要求成本相当的额外资本）：银行的边际条件变为 $20 - 2L - 4 = 0$，选择 $L = 8$。它让银行自己面对给别人造成的预期损失，把外部成本变成决策者自己的成本，这正是庇古税的作用。
      en: |-
        (a) Bank: $20 - 2L = 0$, so $L = 10$. Society: $20 - 2L - 4 = 0$, so $L = 8$. Social net benefit $20L - L^2 - 4L$ is 64 at $L = 8$ and 60 at $L = 10$, a deadweight loss of 4 million dollars.
        (b) 4 million dollars per billion (or an equally costly extra capital requirement): the bank's marginal condition becomes $20 - 2L - 4 = 0$, so it chooses $L = 8$. It makes the bank bear the expected losses it imposes on others, turning an external cost into its own cost, exactly what a Pigouvian tax does.
    rubric:
      zh-cn:
        - "(a) 10 和 8，无谓损失 4。"
        - "(b) 每十亿美元 4 百万，联系庇古税。"
      en:
        - "(a) 10 and 8; deadweight loss 4."
        - "(b) 4 million per billion, linked to a Pigouvian tax."
