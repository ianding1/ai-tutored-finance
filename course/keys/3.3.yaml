# Answer key for lesson 3.3. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[3.3#ytm]] (section), [[concept:yield-to-maturity]], [[check:Q3]], [[fig:2-1]].
# expected: values are recomputed by course/verify/3.3.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.
# Check questions are answered on the page: `correct` is true / false, or the letter of one of `choices`;
# `answer` is the explanation shown after a wrong answer. They have no expected and no rubric.

lesson: "3.3"

context:
  - zh-cn: |-
      学习者学过现值、年金、EAR 与复利（[[0.1]]），NPV 与 IRR（[[3.2]]）。讲义还没有讲久期、凸性的计算（[[3.4]]）和期限结构理论（[[3.5]]），也没有讲违约风险（[[3.6]]）：本课的债券都假设不违约。金额保留两位小数，百分数用百分点表示。
    en: |-
      The learner has studied present value, annuities, EAR and compounding ([[0.1]]), and NPV and IRR ([[3.2]]). The lesson has not yet covered duration and convexity calculations ([[3.4]]), term structure theories ([[3.5]]) or default risk ([[3.6]]): bonds in this lesson are assumed not to default. Amounts to two decimals; percentages in percentage points.
  - concepts: [coupon-rate, yield-to-maturity]
    zh-cn: |-
      讲义：$P = C \times \frac{1 - (1 + y)^{-T}}{y} + \frac{F}{(1 + y)^T}$；美国国债每半年付息；到期收益率是按市场价格买入的 IRR；价格与收益率反向、凸；平价、溢价、折价；当期收益率 = 年票息 / 价格。收益率不变时价格向面值靠拢，持有收益等于到期收益率；到期收益率假设持有到期、不违约、票息按同样收益率再投资。[[fig:2-1]]：面值 100、每年付息；票面利率滑块 0–10%（步长 0.5）、剩余年数 1–30（步长 1）、收益率 0–10%（步长 0.25），默认 5、10、5；读数显示价格、溢价或折价、当期收益率。
    en: |-
      The lesson: $P = C \times \frac{1 - (1 + y)^{-T}}{y} + \frac{F}{(1 + y)^T}$; US Treasuries pay semiannual coupons; the yield to maturity is the IRR of buying at the market price; price and yield move inversely along a convex curve; par, premium and discount; current yield = annual coupon / price. With an unchanged yield the price is pulled to par and the holding return equals the yield to maturity; the yield to maturity assumes holding to maturity, no default and reinvesting coupons at the same yield. [[fig:2-1]]: face value 100, annual coupons; sliders for the coupon rate 0–10% (in steps of 0.5), years to maturity 1–30 (in steps of 1) and yield 0–10% (in steps of 0.25), defaults 5, 10 and 5; the readout shows the price, premium or discount, and the current yield.
  - concepts: [zero-coupon-bond, spot-rate, forward-rate]
    zh-cn: |-
      讲义：零息债；STRIPS；即期利率 $s_t$；$P = \sum_t \frac{\text{CF}_t}{(1 + s_t)^t}$，否则存在套利；到期收益率是即期利率的一种加权平均；票息效应（留给练习题）。远期利率 $(1 + s_2)^2 = (1 + s_1)(1 + f_{1,2})$，可以今天锁定（买 2 年期零息债、卖空 1 年期零息债）。
    en: |-
      The lesson: zero-coupon bonds; STRIPS; the spot rate $s_t$; $P = \sum_t \frac{\text{CF}_t}{(1 + s_t)^t}$, or else there is arbitrage; the yield to maturity is a kind of weighted average of spot rates; the coupon effect (left to an exercise). The forward rate $(1 + s_2)^2 = (1 + s_1)(1 + f_{1,2})$ can be locked in today (buy the 2-year zero, short the 1-year zero).

common_errors:
  - questions: [C2, Q2]
    zh-cn: |-
      以为收益率上升和下降同样幅度时，价格的涨跌幅度相同；或者以为长期和短期债券对收益率变化同样敏感。
    en: |-
      Thinking that equal rises and falls in yield move the price by equal amounts; or that long and short bonds are equally sensitive to yield changes.
  - questions: [C3, Q5]
    zh-cn: |-
      把到期收益率当作一定能得到的收益，忽略再投资利率和中途卖出时的价格风险。
    en: |-
      Treating the yield to maturity as a guaranteed return, ignoring the reinvestment rate and price risk if sold early.
  - questions: [C4, Q3]
    zh-cn: |-
      用同一个到期收益率给期限相同、票面利率不同的债券定价，忽略了即期利率随期限变化。
    en: |-
      Pricing bonds of the same maturity but different coupons with one yield, ignoring that spot rates vary with maturity.
  - questions: [C5, Q4]
    zh-cn: |-
      把远期利率当作简单的两个即期利率之差，或者以为远期利率就是市场对未来利率的预测。
    en: |-
      Treating the forward rate as a simple difference between two spot rates, or as the market's forecast of the future rate.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: bonds
    concepts: [coupon-rate, annuity]
    question:
      zh-cn: |-
        一张债券的票面利率为 6%，市场对它要求的收益率为 5%。它的价格：
      en: |-
        A bond has a 6% coupon rate, and the market requires a 5% yield on it. Its price is:
    choices:
      - zh-cn: 高于面值
        en: Above face value
      - zh-cn: 等于面值
        en: Equal to face value
      - zh-cn: 低于面值
        en: Below face value
      - zh-cn: 无法判断，要看还有几年到期
        en: Impossible to tell without knowing the years to maturity
    correct: A
    answer:
      zh-cn: |-
        (A)。它每年付的票息比按 5% 计算的多，投资者愿意为多出的票息多付钱，价格高于面值（溢价）。到期年数只影响溢价的大小，不影响方向。
      en: |-
        (A). Each year it pays more than a 5% coupon would, and investors pay extra for the extra coupons, so the price is above face value (a premium). The years to maturity affect only the size of the premium, not its direction.

  - id: C2
    kind: check
    section: ytm
    concepts: [yield-to-maturity]
    widget: { id: bond-price, set: { c: 5, n: 10, y: 6 } }
    question:
      zh-cn: |-
        在 [[fig:2-1]] 中，票面利率 5%、10 年到期的债券按面值交易（收益率 5%）。收益率下降 1 个百分点和上升 1 个百分点，价格变化的幅度相比：
      en: |-
        In [[fig:2-1]], a 5% coupon, 10-year bond trades at par (yield 5%). Comparing a 1-point fall in yield with a 1-point rise, the size of the price change is:
    choices:
      - zh-cn: 收益率下降时，价格上涨的幅度更大
        en: Larger for the price rise when the yield falls
      - zh-cn: 收益率上升时，价格下跌的幅度更大
        en: Larger for the price fall when the yield rises
      - zh-cn: 两者相等
        en: The same in both cases
      - zh-cn: 取决于债券是否按面值交易
        en: Dependent on whether the bond trades at par
    correct: A
    answer:
      zh-cn: |-
        (A)。价格与收益率的关系是凸的：收益率越低，曲线越陡。所以收益率下降带来的涨幅（约 8.11%）大于收益率上升带来的跌幅（约 7.36%）。
      en: |-
        (A). The price–yield relation is convex: the lower the yield, the steeper the curve. So the rise from a fall in yield (about 8.11%) is larger than the fall from a rise in yield (about 7.36%).

  - id: C3
    kind: check
    section: price-over-time
    concepts: [yield-to-maturity]
    question:
      zh-cn: |-
        按 5% 的到期收益率买入一张 5 年期债券，一年后卖出。即使这一年里市场收益率升到了 6%，这一年的持有收益仍然是 5%。
      en: |-
        You buy a 5-year bond at a yield to maturity of 5% and sell it a year later. Even if the market yield has risen to 6% during the year, your holding return for the year is still 5%.
    correct: false
    answer:
      zh-cn: |-
        错。收益率上升使债券价格下跌，中途卖出要承受价格损失，这一年的持有收益低于 5%。只有收益率不变，或者持有到期且票息按同样的收益率再投资时，实际收益才等于买入时的到期收益率。
      en: |-
        False. The rise in yield lowers the bond's price, so selling early means a price loss and the holding return is below 5%. The realized return equals the yield at purchase only if the yield does not change, or if the bond is held to maturity with coupons reinvested at that yield.

  - id: C4
    kind: check
    section: spot-rates
    concepts: [spot-rate, zero-coupon-bond]
    question:
      zh-cn: |-
        1 年期即期利率为 4%，2 年期为 5%。一张 2 年期附息国债的市场价格，低于用这两个即期利率折现它的现金流得到的价格。怎样获得无风险利润？
      en: |-
        The 1-year spot rate is 4% and the 2-year spot rate is 5%. A 2-year coupon Treasury trades below the price obtained by discounting its cash flows at these two spot rates. How can a riskless profit be made?
    choices:
      - zh-cn: 卖空这张债券，买入现金流相同的零息债
        en: Short the bond and buy zeros with the same cash flows
      - zh-cn: 买入这张债券，同时卖出现金流相同的零息债
        en: Buy the bond and sell zeros with the same cash flows
      - zh-cn: 买入这张债券并持有到期
        en: Buy the bond and hold it to maturity
      - zh-cn: 无法套利，因为它的到期收益率与即期利率不同
        en: No arbitrage is possible, because its yield to maturity differs from the spot rates
    correct: B
    answer:
      zh-cn: |-
        (B)。用零息债复制这张债券的现金流，成本就是按即期利率折现的价格。债券比复制它的零息债便宜，就买入便宜的债券、卖出贵的零息债：未来的现金流正好抵消，今天得到差价。只买入并持有虽然收益较高，但不是无风险套利。
      en: |-
        (B). Replicating the bond's cash flows with zeros costs exactly the price at the spot rates. If the bond is cheaper than the zeros that replicate it, buy the cheap bond and sell the expensive zeros: future cash flows cancel and the difference is earned today. Just buying and holding gives a higher return, but it is not riskless arbitrage.

  - id: C5
    kind: check
    section: forward-rates
    concepts: [forward-rate, spot-rate]
    question:
      zh-cn: |-
        1 年期即期利率为 4%，2 年期为 5%。今天能用零息债锁定的、从第 1 年到第 2 年的利率高于 5%。
      en: |-
        The 1-year spot rate is 4% and the 2-year spot rate is 5%. The rate that can be locked in today with zeros, from year 1 to year 2, is above 5%.
    correct: true
    answer:
      zh-cn: |-
        对。两年的总收益 $(1.05)^2$ 要等于先按 4% 投资一年、再按远期利率投资一年，第一年只有 4%，第二年就必须高于 5% 才能补足：$f_{1,2} = \frac{1.05^2}{1.04} - 1 \approx 6.01\%$。
      en: |-
        True. Two years at 5%, $(1.05)^2$, must equal one year at 4% followed by one year at the forward rate; since the first year earns only 4%, the second must earn more than 5% to make up for it: $f_{1,2} = \frac{1.05^2}{1.04} - 1 \approx 6.01\%$.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: B
    concepts: [coupon-rate, yield-to-maturity, ear]
    expected: { p: "96.01", ear: "4.55" }
    question:
      zh-cn: |-
        一张 10 年期美国国债，面值 100，票面利率 4%，每半年付息 2；报价的到期收益率为 4.5%（每半年复利，即每半年 2.25%）。(a) 它的价格是多少？(b) 要和一张每年付息一次、按年复利报价的债券比较收益，应该先怎样换算？
      en: |-
        A 10-year US Treasury note has a face value of 100 and a 4% coupon, paying 2 every six months; its quoted yield to maturity is 4.5% (compounded semiannually, so 2.25% per half-year). (a) What is its price? (b) To compare its yield with that of an annual-pay bond quoted with annual compounding, what conversion is needed first?
    answer:
      zh-cn: |-
        (a) 20 期，每期 2.25%：$2 \times \frac{1 - 1.0225^{-20}}{0.0225} + \frac{100}{1.0225^{20}} \approx 96.01$。
        (b) 换成同样的复利频率，例如有效年利率 $1.0225^2 - 1 \approx 4.55\%$（[[0.1]]）；报价的 4.5% 低估了按年计算的收益。
      en: |-
        (a) 20 periods at 2.25%: $2 \times \frac{1 - 1.0225^{-20}}{0.0225} + \frac{100}{1.0225^{20}} \approx 96.01$.
        (b) Convert to the same compounding, for example the effective annual rate $1.0225^2 - 1 \approx 4.55\%$ ([[0.1]]); the quoted 4.5% understates the annual return.
    rubric:
      zh-cn:
        - "(a) 约 96.01。"
        - "(b) 约 4.55%，说明复利频率的一致。"
      en:
        - "(a) About 96.01."
        - "(b) About 4.55%, explaining consistent compounding."

  - id: Q2
    kind: exercise
    level: B
    star: true
    concepts: [zero-coupon-bond, yield-to-maturity]
    expected: { dn30: "-24.75", up30: "33.25", dn2: "-1.88", up2: "1.93" }
    question:
      zh-cn: |-
        面值 100 的 30 年期和 2 年期零息债，收益率都是 5%（每年复利）。(a) 收益率升到 6% 或降到 4% 时，两张零息债的价格各变化百分之几？(b) 为什么期限越长，价格对收益率越敏感，而且上涨和下跌的幅度越不对称？
      en: |-
        30-year and 2-year zero-coupon bonds with face value 100 both yield 5% (annual compounding). (a) If the yield rises to 6% or falls to 4%, by what percentage does each bond's price change? (b) Why is the price more sensitive to the yield, and the rise and fall more asymmetric, the longer the maturity?
    answer:
      zh-cn: |-
        (a) 30 年期：6% 时变化约 -24.75%，4% 时约 +33.25%。2 年期：6% 时约 -1.88%，4% 时约 +1.93%。
        (b) 价格是 $100\,(1 + y)^{-T}$：收益率的变化在 $T$ 年中被复利放大，$T$ 越大影响越大。价格是收益率的凸函数，$T$ 越大弯曲越明显，所以上涨和下跌的不对称也越大。
      en: |-
        (a) 30-year: about -24.75% at 6% and about +33.25% at 4%. 2-year: about -1.88% at 6% and about +1.93% at 4%.
        (b) The price is $100\,(1 + y)^{-T}$: a change in yield is compounded over $T$ years, so the larger $T$, the larger the effect. The price is a convex function of the yield, and the larger $T$, the more curved it is, so the asymmetry between rise and fall grows too.
    rubric:
      zh-cn:
        - "(a) 四个变化幅度正确。"
        - "(b) 用复利放大和凸性解释。"
      en:
        - "(a) The four changes correct."
        - "(b) Explains by compounding and convexity."

  - id: Q3
    kind: exercise
    level: C
    star: true
    concepts: [spot-rate, yield-to-maturity, coupon-rate]
    expected: { pl: "89.40", yl: "5.96", ph: "111.14", yh: "5.85" }
    question:
      zh-cn: |-
        即期利率：1 年 3%，2 年 5%，3 年 6%。两张 3 年期国债，面值 100，每年付息：L 的票面利率 2%，H 的票面利率 10%。(a) 用即期利率求两张债券的价格和到期收益率。(b) 一位投资者说“L 的到期收益率更高，所以 L 更便宜”。他对吗？为什么两张债券的到期收益率不同？
      en: |-
        Spot rates: 1 year 3%, 2 years 5%, 3 years 6%. Two 3-year Treasuries with face value 100 and annual coupons: L has a 2% coupon and H a 10% coupon. (a) Price both bonds with the spot rates and find their yields to maturity. (b) An investor says "L has the higher yield to maturity, so L is cheaper". Is he right? Why do the two yields differ?
    answer:
      zh-cn: |-
        (a) L：$\frac{2}{1.03} + \frac{2}{1.05^2} + \frac{102}{1.06^3} \approx 89.40$，到期收益率约 5.96%；H：$\frac{10}{1.03} + \frac{10}{1.05^2} + \frac{110}{1.06^3} \approx 111.14$，约 5.85%。
        (b) 不对。两张债券都按同一组即期利率准确定价，没有哪一张更便宜。到期收益率是即期利率的加权平均：即期利率随期限上升，H 的票息高，较多的价值来自前两年（较低的即期利率），到期收益率被拉低；L 的价值几乎全在第 3 年，接近 6%。差别只反映现金流的时间分布（票息效应）。
      en: |-
        (a) L: $\frac{2}{1.03} + \frac{2}{1.05^2} + \frac{102}{1.06^3} \approx 89.40$, yield about 5.96%; H: $\frac{10}{1.03} + \frac{10}{1.05^2} + \frac{110}{1.06^3} \approx 111.14$, about 5.85%.
        (b) No. Both bonds are priced exactly from the same spot rates, so neither is cheaper. The yield to maturity is a weighted average of spot rates: spot rates rise with maturity, and H's large coupons put more of its value in the first two years (at lower spot rates), pulling its yield down; L's value is almost all in year 3, so its yield is close to 6%. The difference only reflects the timing of the cash flows (the coupon effect).
    rubric:
      zh-cn:
        - "(a) 约 89.40、5.96% 和 111.14、5.85%。"
        - "(b) 用权重解释票息效应，并指出不能据此判断便宜。"
      en:
        - "(a) About 89.40, 5.96% and 111.14, 5.85%."
        - "(b) Explains the coupon effect by the weights and notes that it does not show cheapness."

  - id: Q4
    kind: exercise
    level: B
    concepts: [forward-rate, spot-rate]
    expected: { f: "5.01" }
    question:
      zh-cn: |-
        1 年期即期利率 3%，2 年期 4%。你要投资两年，可以买 2 年期零息债，也可以买 1 年期零息债、一年后再投资 1 年。(a) 一年后的 1 年期利率高于多少，第二种办法才更好？(b) 如果你认为它会是 4.5%，选哪种？选第二种办法要承担什么风险？
      en: |-
        The 1-year spot rate is 3% and the 2-year 4%. You want to invest for two years: buy the 2-year zero, or buy the 1-year zero and reinvest for a year after it matures. (a) Above what 1-year rate a year from now is the second plan better? (b) If you think that rate will be 4.5%, which do you choose? What risk does the second plan carry?
    answer:
      zh-cn: |-
        (a) 盈亏平衡点就是远期利率：$\frac{1.04^2}{1.03} - 1 \approx 5.01\%$。
        (b) 4.5% 低于 5.01%，选 2 年期零息债（$1.04^2 = 1.0816$，大于 $1.03 \times 1.045 \approx 1.0764$）。第二种办法的风险是一年后的利率不确定：它可能比预期低，两年的总收益就更少。
      en: |-
        (a) The break-even is the forward rate: $\frac{1.04^2}{1.03} - 1 \approx 5.01\%$.
        (b) 4.5% is below 5.01%, so buy the 2-year zero ($1.04^2 = 1.0816$, more than $1.03 \times 1.045 \approx 1.0764$). The second plan's risk is that next year's rate is uncertain: it may be lower than expected, lowering the two-year return.
    rubric:
      zh-cn:
        - "(a) 约 5.01%，指出是远期利率。"
        - "(b) 选 2 年期，并说明再投资利率的风险。"
      en:
        - "(a) About 5.01%, identified as the forward rate."
        - "(b) The 2-year zero, and the reinvestment-rate risk."

  - id: Q5
    kind: exercise
    level: B
    concepts: [yield-to-maturity, future-value]
    expected: { fv: "318.55", r: "4.79" }
    question:
      zh-cn: |-
        一张债券面值 1000，票面利率 6%，每年付息一次，还有 5 年到期。你以 1043.29 买入（到期收益率 5%），持有到期，但收到的票息只能按 3% 的年利率再投资。(a) 这 5 年的实际年收益率是多少？(b) 为什么低于 5%？零息债有没有这个问题？
      en: |-
        A bond has face value 1000, a 6% annual coupon and 5 years to maturity. You buy it at 1043.29 (yield to maturity 5%) and hold it to maturity, but coupons can only be reinvested at 3% a year. (a) What is your realized yearly return over the 5 years? (b) Why is it below 5%? Does a zero-coupon bond have this problem?
    answer:
      zh-cn: |-
        (a) 票息及再投资收益的终值 $60 \times \frac{1.03^5 - 1}{0.03} \approx 318.55$，到期共有 1318.55；年收益 $\left(\frac{1318.55}{1043.29}\right)^{1/5} - 1 \approx 4.79\%$。
        (b) 到期收益率假设票息能按 5% 再投资，实际只有 3%，这叫再投资风险。零息债中间没有现金流需要再投资，持有到期就能得到买入时的收益率。
      en: |-
        (a) The coupons with their reinvestment earnings grow to $60 \times \frac{1.03^5 - 1}{0.03} \approx 318.55$, for a total of 1318.55 at maturity; the yearly return is $\left(\frac{1318.55}{1043.29}\right)^{1/5} - 1 \approx 4.79\%$.
        (b) The yield to maturity assumes coupons are reinvested at 5%, but only 3% is available: reinvestment risk. A zero-coupon bond has no cash flows to reinvest, so holding it to maturity earns the yield at purchase.
    rubric:
      zh-cn:
        - "(a) 约 4.79%。"
        - "(b) 说明再投资风险，零息债没有。"
      en:
        - "(a) About 4.79%."
        - "(b) Explains reinvestment risk, absent for zeros."
