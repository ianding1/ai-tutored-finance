# Answer key for lesson 0.4. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.3]] (lesson), [[0.4#standard-error]] (section), [[concept:standard-error]], [[check:Q4]].
# expected: values are recomputed by course/verify/0.4.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "0.4"

context:
  - zh-cn: |-
      本课收益以百分点为单位。学习者已经学过期望、方差、协方差和线性组合的方差（[[0.3]]），以及对数收益率（[[0.1]]）；还没有学回归（[[0.5]]）。计算题统一用 1.96 作为 95% 的临界值，除非题目另有说明。
    en: |-
      Returns in this lesson are in percentage points. The learner has studied expected value, variance, covariance and the variance of a linear combination ([[0.3]]), and log returns ([[0.1]]). The learner has not yet studied regression ([[0.5]]). Calculations use 1.96 as the 95% critical value unless a question says otherwise.
  - concepts: [normal-distribution, z-score, probability-density]
    zh-cn: |-
      讲义给出 68–95–99.7 规则（$\mu \pm 1\sigma, 2\sigma, 3\sigma$），以及标准分数 $z = \frac{R - \mu}{\sigma}$。讲义例子：年收益 $N(8\%, 16\%^2)$，约 68% 的年份在 −8% 到 24%，约 95% 在 −24% 到 40%。
    en: |-
      The lesson gives the 68–95–99.7 rule ($\mu \pm 1\sigma, 2\sigma, 3\sigma$) and the z-score $z = \frac{R - \mu}{\sigma}$. Example in the lesson: annual returns $N(8\%, 16\%^2)$; about 68% of years are between −8% and 24%, and about 95% between −24% and 40%.
  - concepts: [fat-tails]
    zh-cn: |-
      讲义定义肥尾：极端涨跌出现得比同样标准差的正态分布预测的更频繁。讲义没有给出具体的历史事件，也没有直接说明正态模型对大跌概率的估计偏高还是偏低。
    en: |-
      The lesson defines fat tails: extreme moves occur more often than a normal distribution with the same standard deviation predicts. The lesson gives no specific historical event and does not state directly whether a normal model overstates or understates the probability of a large loss.
  - concepts: [median, right-skew, lognormal-distribution]
    zh-cn: |-
      讲义例子：100 美元每年等概率乘以 1.5 或 0.6。均值 $100 \times 1.05^n$，中位数约 $100 \times 0.9^{n/2}$；10 年后均值约 162.9 美元，中位数 59.0 美元。讲义用“1,024 个人各玩一次”解释：均值是一群人的平均，中位数是排在中间那个人的结果；右偏的原因是财富按比例增减、亏损有下限。讲义没有讨论退休规划等应用中该看哪一个。
    en: |-
      Example in the lesson: 100 dollars is multiplied each year by 1.5 or 0.6 with equal probability. The mean is $100 \times 1.05^n$ and the median is about $100 \times 0.9^{n/2}$; after 10 years the mean is about 162.9 dollars and the median 59.0 dollars. The lesson explains with "1,024 people each play once": the mean is the average over the group, the median is the result of the person in the middle; the right skew comes from wealth changing in proportion and losses having a floor. The lesson does not discuss which one to use in applications such as retirement planning.
  - concepts: [sample-mean, sample-standard-deviation, degrees-of-freedom, parameter-estimation]
    zh-cn: |-
      样本标准差 $s = \sqrt{\frac{1}{n-1}\sum (R_t - \bar R)^2}$。讲义的手算例子：5 年收益 20、−5、15、30、−10，$\bar R = 10$，$s \approx 16.96$。讲义解释了除以 $n - 1$ 的原因（偏差相对样本均值偏小；自由度）。
    en: |-
      Sample standard deviation $s = \sqrt{\frac{1}{n-1}\sum (R_t - \bar R)^2}$. Worked example in the lesson: 5 yearly returns 20, −5, 15, 30, −10, with $\bar R = 10$ and $s \approx 16.96$. The lesson explains why the divisor is $n - 1$ (deviations from the sample mean are too small; degrees of freedom).
  - concepts: [standard-error, confidence-interval, central-limit-theorem, t-distribution]
    zh-cn: |-
      讲义用“100 段平行历史”解释标准误：换一段历史，样本均值通常差多少。每年独立时 $\text{SE} = \frac{\sigma}{\sqrt{n}}$（由线性组合的方差公式、协方差为 0 推出），实际中用 $\frac{s}{\sqrt{n}}$。95% 置信区间 $\bar R \pm 1.96\,\text{SE}$；准确含义是用这种方法造的区间中约 95% 包含真实 $\mu$。小样本时应把 1.96 换成 t 分布的临界值（$n = 5$ 时约 2.78）。讲义例子：$\sigma = 16\%$，$n = 20$，SE 约 3.58%，样本均值 8% 时区间约 $[1.0\%, 15.0\%]$。讲义没有直接比较 $\sigma$ 与标准误随数据量的变化，也没有讨论相邻年份相关的情形。
    en: |-
      The lesson explains the standard error with "100 parallel histories": how much the sample mean typically differs in another history. With independent years $\text{SE} = \frac{\sigma}{\sqrt{n}}$ (from the variance of a linear combination with zero covariance); in practice $\frac{s}{\sqrt{n}}$ is used. 95% confidence interval: $\bar R \pm 1.96\,\text{SE}$; its exact meaning is that about 95% of intervals built this way contain the true $\mu$. With small samples, 1.96 should be replaced by a critical value of the t distribution (about 2.78 for $n = 5$). Example in the lesson: $\sigma = 16\%$, $n = 20$, SE about 3.58%; with a sample mean of 8% the interval is about $[1.0\%, 15.0\%]$. The lesson does not compare directly how $\sigma$ and the standard error change with more data, and does not discuss returns that are correlated across years.
  - questions: [C7]
    zh-cn: |-
      [[fig:5-1]] 是一张模拟图：100 段平行历史，每段从 $N(8\%, 16\%^2)$ 中抽 $n$ 年，用 $\bar R \pm 1.96\,s/\sqrt{n}$ 画置信区间，标出包含 8% 的区间个数。学习者可以用滑块调 $n$，并按按钮重新抽样。
    en: |-
      [[fig:5-1]] is a simulation: 100 parallel histories, each drawing $n$ years from $N(8\%, 16\%^2)$, with the confidence interval $\bar R \pm 1.96\,s/\sqrt{n}$ and the count of intervals that contain 8%. The learner can change $n$ with a slider and draw new samples with a button.
  - concepts: [hypothesis-test, t-statistic, statistical-significance, multiple-testing]
    zh-cn: |-
      $t = \frac{\bar R}{\text{SE}}$，$|t| > 1.96$ 时在 5% 水平上显著，等价于 95% 置信区间不包含 0。讲义列出的局限：显著不等于重要；不显著不等于真实值为 0；无效策略每次检验也有约 5% 的概率碰巧显著（多重检验），后果留给练习题。
    en: |-
      $t = \frac{\bar R}{\text{SE}}$; $|t| > 1.96$ means significance at the 5% level, which is the same as a 95% confidence interval that does not contain 0. Limits listed in the lesson: significant does not mean important; not significant does not mean the true value is 0; a useless strategy is significant by chance in about 5% of tests (multiple testing), with the consequences left to an exercise.

common_errors:
  - questions: [Q1]
    zh-cn: |-
      混淆资产的标准差 $\sigma$ 与样本均值的标准误：$\sigma$ 描述某一年收益的波动，不随数据量变化；标准误描述估计 $\mu$ 的误差，随 $\sqrt{n}$ 变小。
    en: |-
      Confusing the asset's standard deviation $\sigma$ with the standard error of the sample mean: $\sigma$ describes how much one year's return varies and does not change with the amount of data; the standard error describes the error in estimating $\mu$ and shrinks with $\sqrt{n}$.
  - questions: [Q3]
    zh-cn: |-
      以为期望收益为正的投资长期持有就几乎不会亏钱；或者把每年收益的标准差当作多年平均收益的标准差。多年平均收益的标准差是 $\frac{\sigma}{\sqrt{n}}$，亏损的概率下降但不为 0。
    en: |-
      Thinking an investment with a positive expected return almost never loses money if held long enough; or using the standard deviation of one year's return for the average over many years. The average has standard deviation $\frac{\sigma}{\sqrt{n}}$, so the chance of a loss falls but is not 0.
  - questions: [Q4]
    zh-cn: |-
      用期望财富描述普通投资者的结果，忽略右偏使中位数远低于均值；或者以为降低期望收益一定使长期结果变差，忽略波动的拖累。
    en: |-
      Using the expected wealth to describe the typical investor's result, ignoring that right skew puts the median far below the mean; or thinking a lower expected return must make long-run results worse, ignoring the drag from volatility.
  - questions: [Q5]
    zh-cn: |-
      以为不显著就说明没有能力，或者以为几年的业绩就足以判断能力。真实能力也要很多年的记录才能和运气区分开。
    en: |-
      Thinking that a result that is not significant shows a lack of skill, or that a few years of performance are enough to judge skill. Even real skill takes many years of record to tell apart from luck.
  - questions: [Q6]
    zh-cn: |-
      只看报告出来的那个显著结果，不问一共检验了多少个。检验 20 个无效的策略，平均就有 1 个会碰巧在 5% 水平上显著。
    en: |-
      Looking only at the significant result reported, without asking how many were tested. Testing 20 useless strategies gives on average 1 that is significant at the 5% level by chance.
  - questions: [Q7]
    zh-cn: |-
      以为数据越多，样本均值的误差总会趋于 0。各年收益正相关时，样本均值的方差趋于协方差 $c$，增加数据也无法消除这部分误差。
    en: |-
      Thinking that more data always drive the error of the sample mean to 0. When years are positively correlated, the variance of the sample mean approaches the covariance $c$, and more data cannot remove that error.
  - questions: [C4]
    zh-cn: |-
      计算样本标准差时除以 $n$ 而不是 $n - 1$。
    en: |-
      Dividing by $n$ instead of $n - 1$ when computing the sample standard deviation.
  - questions: [C5]
    zh-cn: |-
      把 95% 置信区间说成“真实期望有 95% 的概率在这个区间里”。真实期望是一个固定的数；95% 说的是造区间的方法。
    en: |-
      Saying that a 95% confidence interval means "the true mean is in this interval with probability 95%". The true mean is a fixed number; the 95% describes the method of building intervals.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: normal
    concepts: [normal-distribution, z-score]
    question:
      zh-cn: |-
        资产 A 的年收益服从 $N(8\%, 16\%^2)$，资产 B 服从 $N(4\%, 8\%^2)$。哪一项一年亏损超过 12% 的概率更大？
      en: |-
        Asset A's annual return follows $N(8\%, 16\%^2)$ and asset B's follows $N(4\%, 8\%^2)$. Which is more likely to lose more than 12% in a year?
    choices:
      - zh-cn: A
        en: A
      - zh-cn: B，因为它的期望收益更低
        en: B, because its expected return is lower
        why:
          zh-cn: 亏损超过 12% 的概率取决于 −12% 离各自的期望有几个标准差。分别算一算这个距离。
          en: The probability of losing more than 12% depends on how many standard deviations −12% is from each expected value. Work out that distance for each.
      - zh-cn: 两者相同，因为 −12% 对两者都是 2 个标准差以外
        en: The same, because −12% is more than 2 standard deviations away for both
        why:
          zh-cn: 用 $z = \frac{R - \mu}{\sigma}$ 分别检查一下，两者的 $z$ 真的相同吗？
          en: Check each with $z = \frac{R - \mu}{\sigma}$. Are the two values of $z$ really the same?
      - zh-cn: 不知道真实的分布，无法比较
        en: They cannot be compared without knowing the true distributions
        why:
          zh-cn: 题目已经给出了两个正态分布。正态分布由哪两个数完全确定？
          en: The question gives both normal distributions. Which two numbers fully determine a normal distribution?
    correct: A
    answer:
      zh-cn: |-
        (A)。对 A，$z = \frac{-12 - 8}{16} = -1.25$；对 B，$z = \frac{-12 - 4}{8} = -2$。−12% 离 A 的期望只有 1.25 个标准差，离 B 有 2 个标准差，所以 A 亏损超过 12% 的概率（约 11%）大于 B（约 2.3%）。期望较高并不意味着大亏的概率较低，还要看标准差。
      en: |-
        (A). For A, $z = \frac{-12 - 8}{16} = -1.25$; for B, $z = \frac{-12 - 4}{8} = -2$. −12% is only 1.25 standard deviations below A's expected value but 2 below B's, so A is more likely to lose more than 12% (about 11%) than B (about 2.3%). A higher expected return does not mean a lower chance of a large loss; the standard deviation matters too.

  - id: C2
    kind: check
    section: fat-tails
    concepts: [fat-tails, normal-distribution, z-score]
    question:
      zh-cn: |-
        1987 年 10 月 19 日，美国股市一天下跌约 20%。按日期望收益约为 0、日标准差约为 1% 的正态分布，这是离期望约 20 个标准差的事件。这说明那一天发生了一件即使用正确的模型来看也几乎不可能发生的事。
      en: |-
        On October 19, 1987, the US stock market fell about 20% in one day. Under a normal distribution with an expected daily return of about 0 and a daily standard deviation of about 1%, this is an event about 20 standard deviations from the expected value. This shows that something happened that was almost impossible even under the correct model.
    correct: false
    hint:
      zh-cn: 一件按某个模型“几乎不可能”的事真的发生了，更可能说明运气极差，还是这个模型的假设有问题？
      en: When something "almost impossible" under a model actually happens, is it more likely very bad luck, or a wrong assumption in the model?
    answer:
      zh-cn: |-
        错。按正态分布，20 个标准差的事件在宇宙的寿命里也几乎不会发生，而类似的大跌在历史上多次出现。更合理的结论是正态分布的假设错了：真实收益的尾部比正态分布厚（肥尾），极端涨跌比正态分布预测的频繁得多。假设正态分布的风险模型会严重低估大跌的概率。
      en: |-
        False. Under a normal distribution, a 20-standard-deviation event would almost never happen in the lifetime of the universe, yet similar crashes have happened several times. The more reasonable conclusion is that the normal assumption is wrong: real returns have fatter tails, and extreme moves are far more frequent than the normal distribution predicts. Risk models that assume normality greatly underestimate the probability of crashes.

  - id: C3
    kind: check
    section: mean-median
    concepts: [median, right-skew, expected-value]
    question:
      zh-cn: |-
        在讲义的抛硬币投资中（每年等概率乘以 1.5 或 0.6），玩的年数越多：
      en: |-
        In the lesson's coin-flip investment (each year wealth is multiplied by 1.5 or 0.6 with equal probability), the more years one plays:
    choices:
      - zh-cn: 期望财富越来越高，中位数越来越低
        en: The expected wealth keeps rising and the median keeps falling
      - zh-cn: 期望财富和中位数都越来越高，因为每年的期望收益是正的
        en: Both the expected wealth and the median keep rising, because the expected return each year is positive
        why:
          zh-cn: 一个普通人大约一半年份正面、一半反面。一正一反之后，他的财富是原来的多少倍？
          en: A typical player gets heads about half the years and tails the other half. After one head and one tail, how many times the starting wealth does he have?
      - zh-cn: 两者都越来越低
        en: Both keep falling
        why:
          zh-cn: 整个群体平均每人的钱，每年期望乘以多少？
          en: Each year, by what factor is the average wealth of the whole group expected to be multiplied?
      - zh-cn: 两者越来越接近，因为结果会平均掉
        en: The two get closer, because the outcomes average out
        why:
          zh-cn: 在 [[fig:3-1]] 中拖动年数，均值和中位数的差距是变大还是变小？想一想少数幸运者的财富怎样增长。
          en: Drag the number of years in [[fig:3-1]]. Does the gap between the mean and the median grow or shrink? Think about how the wealth of the few lucky players grows.
    correct: A
    answer:
      zh-cn: |-
        (A)。整个群体平均每人的钱每年期望乘以 1.05，均值是 $100 \times 1.05^n$，越来越高。一个普通人大约一半正面、一半反面，一正一反的净效果是 $1.5 \times 0.6 = 0.9$，中位数约为 $100 \times 0.9^{n/2}$，越来越低。年数越多，总财富越集中在少数幸运者手里，分布越右偏，两者分得越开。
      en: |-
        (A). The group's average wealth is expected to be multiplied by 1.05 each year, so the mean is $100 \times 1.05^n$ and keeps rising. A typical player gets about half heads and half tails, and one of each has a net effect of $1.5 \times 0.6 = 0.9$, so the median is about $100 \times 0.9^{n/2}$ and keeps falling. The more years, the more total wealth is concentrated among the few lucky players, the more right-skewed the distribution, and the further apart the two become.

  - id: C4
    kind: check
    section: estimation
    concepts: [sample-mean, sample-standard-deviation, degrees-of-freedom]
    question:
      zh-cn: |-
        有 1,000 个观测时，样本方差除以 $n$ 还是除以 $n - 1$，对样本标准差几乎没有影响。
      en: |-
        With 1,000 observations, whether the sample variance is divided by $n$ or by $n - 1$ makes almost no difference to the sample standard deviation.
    correct: true
    hint:
      zh-cn: 比较 $\frac{1}{1000}$ 和 $\frac{1}{999}$ 相差多少。$n = 5$ 时呢？
      en: Compare $\frac{1}{1000}$ with $\frac{1}{999}$. What about $n = 5$?
    answer:
      zh-cn: |-
        对。两种算法的方差之比为 $\frac{n}{n-1}$，$n = 1000$ 时只差约 0.1%，标准差只差约 0.05%。除以 $n - 1$ 是为了修正“偏差相对样本均值计算”造成的低估，这个修正只在样本小时重要：$n = 5$ 时方差差 25%。
      en: |-
        True. The two variances differ by the factor $\frac{n}{n-1}$: with $n = 1000$ only about 0.1%, and the standard deviations about 0.05%. Dividing by $n - 1$ corrects the underestimate caused by measuring deviations from the sample mean, and that correction matters only for small samples: with $n = 5$ the variances differ by 25%.

  - id: C5
    kind: check
    section: standard-error
    concepts: [standard-error, confidence-interval, hypothesis-test]
    question:
      zh-cn: |-
        25 年的数据给出平均收益的 95% 置信区间为 $[-1.84\%, 13.84\%]$。下面哪种说法正确？
      en: |-
        25 years of data give a 95% confidence interval of $[-1.84\%, 13.84\%]$ for the average return. Which statement is correct?
    choices:
      - zh-cn: 用这种方法造的区间，约 95% 会包含真实的期望收益
        en: About 95% of intervals made this way contain the true expected return
      - zh-cn: 真实的期望收益有 95% 的概率落在这个区间里
        en: The true expected return lies in this interval with 95% probability
        why:
          zh-cn: 真实的期望收益是一个固定的数，还是随机的？95% 描述的是哪一个随机的东西？
          en: Is the true expected return a fixed number or a random one? What random thing does the 95% describe?
      - zh-cn: 以后约 95% 的年份，收益会落在这个区间里
        en: In about 95% of future years, the return will lie in this interval
        why:
          zh-cn: 这个区间的宽度由标准误决定。标准误描述的是每一年收益的波动，还是平均收益的估计误差？
          en: The width of this interval is set by the standard error. Does the standard error describe the swings in each year's return or the error in estimating the average?
      - zh-cn: 区间包含 0，说明真实的期望收益就是 0
        en: The interval contains 0, so the true expected return is 0
        why:
          zh-cn: 区间里还有很多别的数，例如 10%。数据能说明真实值就是区间里的某一个数吗？
          en: The interval also contains many other numbers, such as 10%. Can the data show that the true value is one particular number in it?
    correct: A
    answer:
      zh-cn: |-
        (A)。真实的期望收益是固定的，随机的是区间：换一段历史，样本均值和区间都会变。95% 的意思是用这种方法造区间，约 95% 的历史中区间会罩住真实值；我们不知道自己这一段是不是例外。区间描述的是平均收益的估计误差，不是每一年收益的范围。区间包含 0 只说明数据不能排除 0，不说明真实值是 0。
      en: |-
        (A). The true expected return is fixed; the interval is random: with another stretch of history, the sample mean and the interval would change. 95% means that in about 95% of histories an interval made this way covers the true value; we do not know whether ours is an exception. The interval describes the error in estimating the average, not the range of each year's return. Containing 0 means only that the data cannot rule out 0, not that the true value is 0.

  - id: C6
    kind: check
    section: standard-error
    concepts: [standard-error]
    question:
      zh-cn: |-
        要把样本均值的标准误减半，需要两倍年数的数据。
      en: |-
        Halving the standard error of the sample mean requires twice as many years of data.
    correct: false
    hint:
      zh-cn: 标准误等于 $\frac{\sigma}{\sqrt{n}}$。$n$ 变为两倍时，$\sqrt{n}$ 变为几倍？
      en: The standard error equals $\frac{\sigma}{\sqrt{n}}$. When $n$ doubles, by what factor does $\sqrt{n}$ grow?
    answer:
      zh-cn: |-
        错。标准误与 $\sqrt{n}$ 成反比，减半需要 $\sqrt{n}$ 变为两倍，即 4 倍的数据。例如 $\sigma = 16\%$ 时，标准误从 4% 降到 2%，需要的数据从 16 年增加到 64 年。估计精度的提高非常慢，这是从历史数据估计期望收益很难的原因。
      en: |-
        False. The standard error is inversely proportional to $\sqrt{n}$, so halving it requires $\sqrt{n}$ to double, that is, 4 times as much data. With $\sigma = 16\%$, for example, cutting the standard error from 4% to 2% takes the data from 16 to 64 years. Precision improves very slowly, which is why expected returns are hard to estimate from history.

  - id: C7
    kind: check
    section: standard-error
    concepts: [confidence-interval, t-distribution, sample-standard-deviation]
    widget: { id: ci-sim, set: { n: 5 } }
    question:
      zh-cn: |-
        在 [[fig:5-1]] 中把年数调到 5，多按几次“重新抽样”。包含真实期望的区间：
      en: |-
        In [[fig:5-1]], set the number of years to 5 and press "Resample" several times. The intervals that contain the true expected value:
    choices:
      - zh-cn: 常常少于 95 个
        en: Are often fewer than 95
      - zh-cn: 每次都正好是 95 个
        en: Are exactly 95 every time
        why:
          zh-cn: 每次重新抽样，100 个区间都不同。罩住真实值的个数会每次都一样吗？
          en: Each resample gives 100 different intervals. Can the number that covers the true value be the same every time?
      - zh-cn: 常常多于 95 个，因为样本小时区间很宽
        en: Are often more than 95, because intervals are wide in small samples
        why:
          zh-cn: 区间用样本标准差 $s$ 代替 $\sigma$。只有 5 个观测时，$s$ 常常偏大还是偏小？偏小时区间会怎样？
          en: The intervals use the sample standard deviation $s$ instead of $\sigma$. With only 5 observations, is $s$ often too large or too small? What happens to the interval when it is too small?
      - zh-cn: 大约只有 50 个
        en: Are only about 50
        why:
          zh-cn: 多按几次，数一数实际的个数。区间虽然不够宽，但会差这么多吗？
          en: Press it a few more times and count. The intervals are not wide enough, but are they that far off?
    correct: A
    answer:
      zh-cn: |-
        (A)。每次抽样的结果不同，大约在 80 到 95 个之间，平均约 88 个。区间用样本标准差 $s$ 代替 $\sigma$，$n = 5$ 时 $s$ 的误差很大，有时明显偏小，区间就太窄；1.96 没有考虑这部分误差。改用 t 分布的临界值（$n = 5$ 时约 2.78），区间更宽，覆盖率回到约 95%。
      en: |-
        (A). The count varies from sample to sample, roughly between 80 and 95, about 88 on average. The intervals use the sample standard deviation $s$ instead of $\sigma$; with $n = 5$, $s$ has a large error and is sometimes clearly too small, making the interval too narrow, and 1.96 does not allow for this. With the t-distribution critical value (about 2.78 for $n = 5$), the intervals are wider and the coverage returns to about 95%.

  - id: C8
    kind: check
    section: hypothesis-test
    concepts: [hypothesis-test, standard-error, multiple-testing]
    question:
      zh-cn: |-
        用 100 万个日观测检验一个交易策略，平均每天多赚 0.001%，t 值为 5，在 5% 水平上高度显著。所以这是一个值得投入资金的策略。
      en: |-
        A trading strategy is tested on 1 million daily observations: it earns 0.001% more per day on average, with a t-statistic of 5, highly significant at the 5% level. So it is a strategy worth putting money into.
    correct: false
    hint:
      zh-cn: 统计显著说明的是什么？它能说明效果有多大、扣除交易成本后还剩多少吗？
      en: What does statistical significance tell you? Does it say how large the effect is, or what is left after trading costs?
    answer:
      zh-cn: |-
        错。显著只说明真实效果不太可能是 0，不说明效果大到值得做。样本非常大时，标准误很小，微小的差别也会显著。每天 0.001%，一年约 0.25%，很可能还不够支付交易成本。判断时要同时看效果的大小、成本和风险。
      en: |-
        False. Significance says only that the true effect is unlikely to be 0, not that it is large enough to matter. With a very large sample the standard error is tiny, so even a small difference becomes significant. 0.001% a day is about 0.25% a year, probably not enough to pay for trading costs. Size of the effect, costs and risk must all be considered.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [standard-error, standard-deviation, sample-standard-deviation]
    question:
      zh-cn: |-
        判断真假并说明理由：收集的历史数据年数越多，一只股票每年收益的标准差就越小。
      en: |-
        Determine whether this statement is true or false, and explain: the more years of historical data you collect, the smaller the standard deviation of a stock's yearly return becomes.
    answer:
      zh-cn: |-
        假。每年收益的标准差 $\sigma$ 是股票本身的性质，不因为我们收集了更多数据而改变。更多数据只让我们对 $\sigma$ 的估计（样本标准差）更准，并让样本均值的标准误 $\frac{\sigma}{\sqrt{n}}$ 变小。
      en: |-
        False. The standard deviation $\sigma$ of the yearly return is a property of the stock; it does not change because we collect more data. More data only makes our estimate of $\sigma$ (the sample standard deviation) more accurate, and makes the standard error of the sample mean, $\frac{\sigma}{\sqrt{n}}$, smaller.
    rubric:
      zh-cn:
        - "结论为假。"
        - "区分 $\\sigma$（资产的性质）与标准误（估计的误差，随 $n$ 变小）。"
      en:
        - "States false."
        - "Distinguishes $\\sigma$ (a property of the asset) from the standard error (the error of an estimate, which shrinks with $n$)."

  - id: Q3
    kind: exercise
    level: B
    concepts: [normal-distribution, z-score]
    expected: { p: "32", z10: "-1.48", p10: "7" }
    question:
      zh-cn: |-
        年收益服从正态分布，$\mu = 7\%$，$\sigma = 15\%$，各年相互独立。一位顾问说：“这项投资的期望收益是 7%，长期持有几乎不会亏钱。”
        (a) 某一年亏损的概率大约是多少？
        (b) 持有 10 年，这 10 年的平均年收益低于 0 的概率大约是多少？据此评价顾问的说法。（已知 $P(Z < -0.47) \approx 0.32$，$P(Z < -1.48) \approx 0.07$。）
      en: |-
        Annual returns are normally distributed with $\mu = 7\%$ and $\sigma = 15\%$, independent from year to year. An adviser says: "The expected return is 7%, so holding it for the long run you will almost never lose money."
        (a) Roughly what is the probability of a loss in a given year?
        (b) Holding it for 10 years, roughly what is the probability that the average annual return over the 10 years is below 0? Use this to evaluate the adviser's statement. (Given: $P(Z < -0.47) \approx 0.32$ and $P(Z < -1.48) \approx 0.07$.)
    answer:
      zh-cn: |-
        (a) $z = \frac{0 - 7}{15} \approx -0.47$，亏损的概率约 32%，大约每三年一次。
        (b) 10 年平均年收益的标准差为 $\frac{15}{\sqrt{10}} \approx 4.74\%$，$z = \frac{0 - 7}{4.74} \approx -1.48$，概率约 7%。持有越久，平均收益越集中在 7% 附近，亏损的概率确实下降，但 10 年后仍有约 7% 的可能平均收益为负，并不是“几乎不会”。而且这个计算假设分布和期望都已知、各年独立；真实的期望收益本身估计得很不准（[[0.4#standard-error]]）。
      en: |-
        (a) $z = \frac{0 - 7}{15} \approx -0.47$, so the probability of a loss is about 32%, roughly one year in three.
        (b) The standard deviation of the 10-year average is $\frac{15}{\sqrt{10}} \approx 4.74\%$, so $z = \frac{0 - 7}{4.74} \approx -1.48$ and the probability is about 7%. The longer the holding, the more the average return concentrates near 7%, so the chance of a loss does fall, but after 10 years there is still about a 7% chance that the average return is negative, which is not "almost never". And this calculation assumes that the distribution and the expected value are known and that years are independent; the true expected return is itself estimated very imprecisely ([[0.4#standard-error]]).
    rubric:
      zh-cn:
        - "(a) 约 32%。"
        - "(b) 用 $\\frac{15}{\\sqrt{10}}$ 作为 10 年平均收益的标准差，得到约 7%，并指出风险下降但没有消失。用 15% 作为 10 年平均收益的标准差：需要订正。"
      en:
        - "(a) About 32%."
        - "(b) Uses $\\frac{15}{\\sqrt{10}}$ as the standard deviation of the 10-year average, gets about 7%, and points out that the risk falls but does not vanish. Using 15% as the standard deviation of the 10-year average: needs revision."

  - id: Q4
    kind: exercise
    level: B
    concepts: [median, right-skew, expected-value]
    expected: { median: "66.5", median_h: "148.0", mean_h: "265.3" }
    question:
      zh-cn: |-
        一项投资每年等概率 +60% 或 −40%，每年的期望收益为 10%。投入 100 美元，20 年后的期望财富约为 672.7 美元。
        (a) 20 年后财富的中位数是多少？一位顾问说：“期望收益每年 10%，长期持有，大多数人的财富都会增长。”评价这个说法。
        (b) 改为一半钱投入这项投资、一半持有现金（收益为 0），每年年初再平衡回各一半。20 年后的期望财富和中位数各是多少？为什么期望收益降低了，普通人的结果反而变好了？
      en: |-
        An investment returns +60% or −40% each year with equal probability, an expected return of 10% a year. With 100 dollars invested, the expected wealth after 20 years is about 672.7 dollars.
        (a) What is the median wealth after 20 years? An adviser says: "The expected return is 10% a year, so over the long run most people's wealth will grow." Evaluate the statement.
        (b) Instead, put half the money in this investment and keep half in cash (return 0), rebalancing to half and half at the start of each year. What are the expected wealth and the median after 20 years? Why does the typical result improve even though the expected return is lower?
    answer:
      zh-cn: |-
        (a) 一个普通人 10 次涨、10 次跌，一涨一跌的净效果是 $1.6 \times 0.6 = 0.96$，中位数为 $100 \times 0.96^{10} \approx 66.5$ 美元。超过一半的人亏钱，顾问错了：期望财富被少数幸运者的巨大收益拉高，不代表普通人的结果。
        (b) 每年组合乘以 1.3 或 0.8，期望收益为 5%，期望财富为 $100 \times 1.05^{20} \approx 265.3$ 美元；一涨一跌的净效果是 $1.3 \times 0.8 = 1.04 > 1$，中位数为 $100 \times 1.04^{10} \approx 148.0$ 美元。持有现金把波动减半，一涨一跌的损失大幅减小，普通人的财富从缩水变为增长。期望收益只降低一半，波动造成的拖累却按波动的平方减小（[[4.1]] 会正式讨论）。每年再平衡是关键：不再平衡时，投资部分涨多了比例会变大，波动又会回升。
      en: |-
        (a) A typical investor gets 10 rises and 10 falls, and one of each has a net effect of $1.6 \times 0.6 = 0.96$, so the median is $100 \times 0.96^{10} \approx 66.5$ dollars. More than half of investors lose money, so the adviser is wrong: the expected wealth is pulled up by the huge gains of a few lucky investors and does not describe the typical result.
        (b) Each year the portfolio is multiplied by 1.3 or 0.8, an expected return of 5%, so the expected wealth is $100 \times 1.05^{20} \approx 265.3$ dollars; one rise and one fall give $1.3 \times 0.8 = 1.04 > 1$, so the median is $100 \times 1.04^{10} \approx 148.0$ dollars. Holding cash halves the swings and greatly reduces the loss from a rise followed by a fall, so the typical investor's wealth grows instead of shrinking. The expected return falls only by half, while the drag from volatility shrinks with the square of the volatility ([[4.1]] treats this formally). Rebalancing each year is essential: without it, the invested part grows as a share after gains and the swings return.
    rubric:
      zh-cn:
        - "(a) 中位数约 66.5 美元，并指出期望财富不代表普通人的结果。"
        - "(b) 期望约 265.3 美元，中位数约 148.0 美元；用一涨一跌的净效果（或波动的减小）解释中位数为什么提高。只算数字、不解释：需要订正。"
      en:
        - "(a) A median of about 66.5 dollars, and points out that the expected wealth does not describe the typical result."
        - "(b) An expected wealth of about 265.3 dollars and a median of about 148.0 dollars; explains with the net effect of a rise and a fall (or the smaller swings) why the median rises. Numbers without an explanation: needs revision."

  - id: Q5
    kind: exercise
    level: C
    concepts: [standard-error, t-statistic, statistical-significance]
    expected: { se: "2.68", t: "1.12", n: "16" }
    question:
      zh-cn: |-
        某基金经理过去 5 年平均每年跑赢指数 3 个百分点，跑赢部分的年标准差为 6 个百分点。
        (a) 用标准误和 t 值判断：这能在 5% 水平上说明他有能力吗？
        (b) 假设他真实的能力就是每年跑赢 3 个百分点、标准差 6 个百分点，而且以后的记录的平均值正好是 3 个百分点。至少要多少年的记录，结果才会在 5% 水平上显著？这对评价基金经理意味着什么？
      en: |-
        A fund manager has beaten the index by 3 percentage points a year on average over the past 5 years, with an annual standard deviation of 6 percentage points for the excess return.
        (a) Use the standard error and the t-statistic to judge: does this show skill at the 5% level?
        (b) Suppose his true skill is exactly 3 percentage points a year with a standard deviation of 6 percentage points, and his future record averages exactly 3 percentage points. At least how many years of record are needed for the result to be significant at the 5% level? What does this mean for judging fund managers?
    answer:
      zh-cn: |-
        (a) $\text{SE} = \frac{6}{\sqrt{5}} \approx 2.68$，$t = \frac{3}{2.68} \approx 1.12 < 1.96$，不显著。数据和“没有能力”并不矛盾，但这也不说明他没有能力。
        (b) 需要 $\frac{3}{6 / \sqrt{n}} > 1.96$，即 $\sqrt{n} > 3.92$，$n > 15.4$，至少 16 年。即使能力是真的，也要很多年的记录才能和运气区分开；而基金经理的任期和策略常常比这短，所以单凭几年的业绩很难判断能力。
      en: |-
        (a) $\text{SE} = \frac{6}{\sqrt{5}} \approx 2.68$ and $t = \frac{3}{2.68} \approx 1.12 < 1.96$: not significant. The data do not contradict "no skill", but they do not show a lack of skill either.
        (b) We need $\frac{3}{6 / \sqrt{n}} > 1.96$, that is, $\sqrt{n} > 3.92$ and $n > 15.4$: at least 16 years. Even real skill takes many years of record to tell apart from luck, and managers' tenures and strategies often last less than that, so a few years of performance say little about skill.
    rubric:
      zh-cn:
        - "(a) 标准误约 2.68，t 约 1.12，不显著。"
        - "(b) 至少 16 年，并说明从短期业绩判断能力的困难。"
      en:
        - "(a) A standard error of about 2.68 and t of about 1.12: not significant."
        - "(b) At least 16 years, and explains the difficulty of judging skill from a short record."

  - id: Q6
    kind: exercise
    level: C
    concepts: [multiple-testing, statistical-significance, hypothesis-test]
    expected: { false20: "1", false100: "5" }
    question:
      zh-cn: |-
        一位研究者测试了 20 个互不相关的选股策略，报告其中 1 个“在 5% 水平上显著有效”。你怎么看？如果测试的是 100 个策略，又会怎样？
      en: |-
        A researcher tested 20 unrelated stock-picking strategies and reports that 1 of them is "significant at the 5% level". What do you make of this? What if 100 strategies had been tested?
    answer:
      zh-cn: |-
        即使 20 个策略全部无效，每个也有 5% 的概率碰巧显著，平均会有 $20 \times 0.05 = 1$ 个显著。所以这个结果几乎没有证据力。测试 100 个时，平均会有 5 个碰巧显著。
        应该看：检验是否事先确定、是否在新数据（样本外）上同样有效、是否对检验次数做了修正（例如提高显著性门槛）。
      en: |-
        Even if all 20 strategies are useless, each has a 5% chance of being significant by luck, so on average $20 \times 0.05 = 1$ is significant. The result is therefore almost no evidence. With 100 strategies, on average 5 would be significant by chance.
        What to look for: whether the test was chosen in advance, whether the strategy also works on new data (out of sample), and whether the number of tests was corrected for (for example with a stricter significance threshold).
    rubric:
      zh-cn:
        - "算出期望的假阳性个数：20 个时约 1 个，100 个时约 5 个。"
        - "指出结果缺乏证据力，并提出至少一种应对方法。"
      en:
        - "Computes the expected number of false positives: about 1 with 20 tests and about 5 with 100."
        - "Points out that the result is weak evidence, and suggests at least one remedy."

  - id: Q7
    kind: exercise
    level: C
    star: true
    concepts: [standard-error, portfolio-variance, covariance]
    question:
      zh-cn: |-
        推导 $\text{SE}(\bar R) = \frac{\sigma}{\sqrt{n}}$ 用到了“每年收益相互独立”这一假设。如果任意两年的收益都正相关（协方差为 $c > 0$），样本均值的方差是多少？标准误会变大还是变小？数据年数趋于无穷时会怎样？
      en: |-
        The derivation of $\text{SE}(\bar R) = \frac{\sigma}{\sqrt{n}}$ assumes that yearly returns are independent. If the returns of any two years are positively correlated (covariance $c > 0$), what is the variance of the sample mean? Does the standard error become larger or smaller? What happens as the number of years goes to infinity?
    answer:
      zh-cn: |-
        $\bar R$ 是 $n$ 个收益的等权组合。由线性组合的方差公式，$n$ 个方差项和 $n^2 - n$ 个协方差项：
        $$\text{Var}(\bar R) = \frac{1}{n^2}\big(n\sigma^2 + (n^2 - n)c\big) = \frac{\sigma^2}{n} + \left(1 - \frac{1}{n}\right)c$$
        比独立时大，标准误变大。$n \to \infty$ 时方差趋于 $c$，不趋于 0：数据再多，误差也降不到 0。相关的观测相当于有效样本更少。
      en: |-
        $\bar R$ is an equally weighted combination of $n$ returns. By the variance of a linear combination, there are $n$ variance terms and $n^2 - n$ covariance terms:
        $$\text{Var}(\bar R) = \frac{1}{n^2}\big(n\sigma^2 + (n^2 - n)c\big) = \frac{\sigma^2}{n} + \left(1 - \frac{1}{n}\right)c$$
        This is larger than with independence, so the standard error is larger. As $n \to \infty$ the variance tends to $c$, not to 0: however much data there is, the error does not go to 0. Correlated observations are like a smaller effective sample.
    rubric:
      zh-cn:
        - "方差公式正确，协方差项的个数为 $n^2 - n$。"
        - "标准误变大，且 $n \\to \\infty$ 时方差趋于 $c$。"
      en:
        - "The variance formula is correct, with $n^2 - n$ covariance terms."
        - "The standard error is larger, and the variance tends to $c$ as $n \\to \\infty$."
