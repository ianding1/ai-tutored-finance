# Answer key for lesson 1.5. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.2]] (lesson), [[1.5#long-run]] (section), [[concept:marginal-cost]], [[check:Q4]].
# expected: values are recomputed by course/verify/1.5.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "1.5"

context:
  - zh-cn: |-
      学习者学过固定成本、可变成本、边际成本、利润最大化（价格接受者 $P = MC$）和沉没成本（[[0.2]]），供给与需求（[[1.1]]），以及消费者最优条件 $\frac{MU_x}{p_x} = \frac{MU_y}{p_y}$（[[1.2]]）。还没有学垄断和其他市场结构（[[1.6]]）。
    en: |-
      The learner has studied fixed and variable costs, marginal cost, profit maximization (a price taker sets $P = MC$) and sunk costs ([[0.2]]), supply and demand ([[1.1]]), and the consumer's optimality condition $\frac{MU_x}{p_x} = \frac{MU_y}{p_y}$ ([[1.2]]). The learner has not yet studied monopoly or other market structures ([[1.6]]).
  - concepts: [production-function, marginal-product, returns-to-scale, short-run, long-run]
    zh-cn: |-
      讲义定义生产函数、短期与长期（按能否调整投入区分）、边际产量和边际收益递减；例：$Q = K^{0.5}L^{0.5}$，$K = 16$ 时 $Q = 4\sqrt{L}$。规模报酬：Cobb–Douglas 函数 $f(tK, tL) = t^{\alpha+\beta}f(K, L)$。讲义没有讨论边际产量递减与规模报酬之间的关系。
    en: |-
      The lesson defines the production function, the short run and the long run (distinguished by whether inputs can be adjusted), the marginal product and diminishing marginal returns; example: $Q = K^{0.5}L^{0.5}$ with $K = 16$ gives $Q = 4\sqrt{L}$. Returns to scale: for Cobb–Douglas, $f(tK, tL) = t^{\alpha+\beta}f(K, L)$. The lesson does not discuss the relation between diminishing marginal products and returns to scale.
  - concepts: [average-cost, shutdown-point, perfect-competition]
    zh-cn: |-
      讲义的成本函数 $C(q) = 72 + q^3 - 10q^2 + 40q$，$MC = 3q^2 - 20q + 40$，$\text{AVC} = q^2 - 10q + 40$，$\text{ATC} = \text{AVC} + \frac{72}{q}$。讲义说明 MC 穿过 AVC 和 ATC 的最低点（证明留给练习题），但没有算出这两个最低点。完全竞争厂商：$P = MC$（上升部分），价格低于 AVC 最低点时停产，短期供给是 AVC 最低点以上的 MC。[[fig:4-1]] 的价格滑块从 10 到 50，步长 1，默认 35。
    en: |-
      The lesson's cost function is $C(q) = 72 + q^3 - 10q^2 + 40q$, with $MC = 3q^2 - 20q + 40$, $\text{AVC} = q^2 - 10q + 40$ and $\text{ATC} = \text{AVC} + \frac{72}{q}$. The lesson states that MC passes through the minimum points of AVC and ATC (the proof is left to an exercise) but does not compute these minimum points. Competitive firm: $P = MC$ (rising part), shut down when the price is below the minimum of AVC; short-run supply is MC above the minimum of AVC. In [[fig:4-1]] the price slider goes from 10 to 50 in steps of 1, default 35.
  - concepts: [economic-profit, long-run]
    zh-cn: |-
      讲义说明经济利润扣除包括机会成本在内的全部成本；长期中进入和退出使经济利润为 0，价格等于长期平均成本的最低点；成本最低的投入组合满足 $\frac{MP_L}{w} = \frac{MP_K}{r}$；没有进入障碍的行业，资本回报率长期接近资本的机会成本。
    en: |-
      The lesson explains that economic profit subtracts all costs, including opportunity costs; in the long run, entry and exit drive economic profit to 0, and the price equals the minimum of long-run average cost; the cost-minimizing input mix satisfies $\frac{MP_L}{w} = \frac{MP_K}{r}$; in industries without barriers to entry, the return on capital stays close to the opportunity cost of capital in the long run.

common_errors:
  - questions: [C4, Q3]
    zh-cn: |-
      用平均总成本判断短期是否停产：短期内固定成本已经无法避免，停产的标准是价格低于 AVC 的最低点，而不是 ATC。
    en: |-
      Using average total cost to decide whether to shut down in the short run: the fixed cost cannot be avoided in the short run, so the test is whether the price is below the minimum of AVC, not ATC.
  - questions: [C1, C2, Q1]
    zh-cn: |-
      把边际产量递减和规模报酬递减混为一谈：前者只增加一种投入，后者所有投入同比例增加。
    en: |-
      Confusing diminishing marginal product with decreasing returns to scale: the first increases one input only, the second increases all inputs in the same proportion.
  - questions: [Q2]
    zh-cn: |-
      以为 MC 穿过 ATC 的地方是 MC 的最低点。MC 穿过的是 AVC 和 ATC 的最低点；MC 在它们下方时它们下降，在上方时上升。
    en: |-
      Thinking MC crosses ATC at the minimum of MC. MC crosses AVC and ATC at their minimums; they fall while MC is below them and rise while it is above.
  - questions: [Q4]
    zh-cn: |-
      以为需求增加后价格会长期保持在较高水平。在可以自由进入、成本不变的行业，短期的高价和利润会吸引新厂商进入，长期价格回到 ATC 的最低点，增加的需求由更多厂商满足。
    en: |-
      Thinking a rise in demand keeps the price high in the long run. In an industry with free entry and constant costs, the short-run high price and profit attract entry, the long-run price returns to the minimum of ATC, and more firms meet the extra demand.
  - questions: [Q6]
    zh-cn: |-
      在成本最低的条件中把工资和租金的位置弄反，或者以为规模报酬不变时平均成本会随产量下降。
    en: |-
      Swapping the wage and the rental rate in the cost-minimizing condition, or thinking average cost falls with output under constant returns to scale.
  - questions: [Q5]
    zh-cn: |-
      只扣除实际支付的成本，忽略店主自己的时间和资本的机会成本，把会计利润当作经济利润。
    en: |-
      Subtracting only the costs actually paid and ignoring the opportunity cost of the owner's own time and capital, treating accounting profit as economic profit.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: production-function
    concepts: [marginal-product, short-run]
    question:
      zh-cn: |-
        资本固定时，劳动的边际产量递减。所以多雇一名工人会使总产量下降。
      en: |-
        With capital fixed, the marginal product of labor diminishes. So hiring one more worker lowers total output.
    correct: false
    hint:
      zh-cn: “边际产量递减”说的是边际产量变小，还是变成负数？
      en: Does "diminishing marginal product" mean the marginal product gets smaller, or that it becomes negative?
    answer:
      zh-cn: |-
        错。边际产量递减是说每多雇一名工人，增加的产量比前一名少，但只要边际产量仍为正，总产量仍在增加。例如 $Q = 4\sqrt{L}$ 时，劳动从 4 增加到 16，边际产量从 1 降到 0.5，总产量从 8 增加到 16。只有边际产量变为负数（例如工人太多、互相妨碍）时，总产量才下降。
      en: |-
        False. Diminishing marginal product means each extra worker adds less output than the one before, but as long as the marginal product is positive, total output still rises. With $Q = 4\sqrt{L}$, for example, raising labor from 4 to 16 lowers the marginal product from 1 to 0.5 while output rises from 8 to 16. Total output falls only if the marginal product turns negative (for example, workers getting in each other's way).

  - id: C2
    kind: check
    section: returns-to-scale
    concepts: [returns-to-scale]
    question:
      zh-cn: |-
        生产函数 $Q = K^{0.3}L^{0.6}$。资本和劳动都翻倍时，产量：
      en: |-
        The production function is $Q = K^{0.3}L^{0.6}$. When capital and labor both double, output:
    choices:
      - zh-cn: 不到原来的 2 倍
        en: Less than doubles
      - zh-cn: 正好是原来的 2 倍，因为所有投入都翻倍了
        en: Exactly doubles, because all inputs doubled
        why:
          zh-cn: 把 $2K$ 和 $2L$ 代入生产函数，产量乘以 2 的几次方？
          en: Put $2K$ and $2L$ into the production function. Output is multiplied by 2 to what power?
      - zh-cn: 超过原来的 2 倍
        en: More than doubles
        why:
          zh-cn: 产量变为原来的 $2^{a + b}$ 倍。这里的 $a + b$ 比 1 大还是小？
          en: Output is multiplied by $2^{a + b}$. Is $a + b$ here above or below 1?
      - zh-cn: 无法判断，要看资本和劳动的价格
        en: Cannot be determined without the prices of capital and labor
        why:
          zh-cn: 规模报酬只取决于生产函数本身，与投入的价格有关吗？
          en: Returns to scale depend only on the production function. Do input prices matter?
    correct: A
    answer:
      zh-cn: |-
        (A)。产量变为原来的 $2^{0.3 + 0.6} = 2^{0.9} \approx 1.87$ 倍，不到 2 倍，是规模报酬递减。对这类生产函数，指数之和小于 1 时规模报酬递减，等于 1 时不变，大于 1 时递增。
      en: |-
        (A). Output is multiplied by $2^{0.3 + 0.6} = 2^{0.9} \approx 1.87$, less than 2: decreasing returns to scale. For production functions of this form, exponents summing to less than 1 give decreasing returns, to 1 constant returns, and to more than 1 increasing returns.

  - id: C3
    kind: check
    section: cost-curves
    concepts: [average-cost, marginal-cost]
    question:
      zh-cn: |-
        在某个产量处，边际成本低于平均可变成本。再多生产一单位，平均可变成本会：
      en: |-
        At some output, marginal cost is below average variable cost. If one more unit is produced, average variable cost:
    choices:
      - zh-cn: 下降
        en: Falls
      - zh-cn: 上升
        en: Rises
        why:
          zh-cn: 新增的这一单位比现有的平均可变成本贵还是便宜？把它加进来，平均值会被拉高还是拉低？
          en: Is the extra unit dearer or cheaper than the current average variable cost? Adding it pulls the average up or down?
      - zh-cn: 不变
        en: Stays the same
        why:
          zh-cn: 只有新增的一单位成本正好等于平均值时，平均值才不变。这里两者相等吗？
          en: The average stays the same only if the extra unit costs exactly the average. Are they equal here?
      - zh-cn: 取决于固定成本的大小
        en: Depends on the size of the fixed cost
        why:
          zh-cn: 平均可变成本里包含固定成本吗？
          en: Does average variable cost include the fixed cost?
    correct: A
    answer:
      zh-cn: |-
        (A)。新增的一单位的成本（MC）低于现有的平均值，把它加进来会拉低平均值，就像考了一个低于平均分的成绩会拉低平均分。所以 MC 在 AVC 下方时 AVC 下降，在上方时 AVC 上升，MC 穿过 AVC 的最低点。
      en: |-
        (A). The cost of the extra unit (MC) is below the current average, so adding it pulls the average down, just as a score below your average pulls your average down. So AVC falls while MC is below it and rises while MC is above it, and MC crosses AVC at its minimum.

  - id: C4
    kind: check
    section: competitive-firm
    concepts: [shutdown-point, perfect-competition, average-cost]
    widget: { id: competitive-firm, set: { p: 20 } }
    question:
      zh-cn: |-
        在 [[fig:4-1]] 中把价格从 30 慢慢降低。厂商：
      en: |-
        In [[fig:4-1]], lower the price slowly from 30. The firm:
    choices:
      - zh-cn: 先开始亏损但继续生产，价格再低一些才停产
        en: First makes losses but keeps producing, and stops only at a lower price
      - zh-cn: 一出现亏损就停产
        en: Stops as soon as it makes a loss
        why:
          zh-cn: 短期内停产时，固定成本还要付吗？比较停产的亏损和生产的亏损。
          en: In the short run, is the fixed cost still paid after stopping? Compare the loss from stopping with the loss from producing.
      - zh-cn: 一直生产，直到价格降到 0
        en: Keeps producing until the price reaches 0
        why:
          zh-cn: 价格低到连可变成本都收不回时，多生产的每一单位是在减少亏损还是增加亏损？
          en: When the price cannot even cover variable cost, does each unit produced reduce the loss or add to it?
      - zh-cn: 开始亏损的价格和停产的价格相同
        en: Starts losing money and stops at the same price
        why:
          zh-cn: 开始亏损的价格对应哪条曲线的最低点？停产的价格对应哪条曲线的最低点？
          en: The price at which losses start corresponds to the minimum of which curve? And the shutdown price?
    correct: A
    answer:
      zh-cn: |-
        (A)。价格低于 ATC 的最低点 28 时开始亏损，但只要价格高于 AVC 的最低点 15，收入就能覆盖可变成本，还能抵消一部分固定成本，生产比停产亏得少。价格低于 15 时，生产连可变成本都收不回，才应该停产。
      en: |-
        (A). Below 28, the minimum of ATC, the firm makes losses, but as long as the price is above 15, the minimum of AVC, revenue covers variable cost and part of the fixed cost, so producing loses less than stopping. Only below 15, when production cannot even cover variable cost, should it stop.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [marginal-product, returns-to-scale]
    question:
      zh-cn: |-
        判断真假并说明理由：如果一个生产函数对资本和劳动的边际产量都递减，那么它一定是规模报酬递减的。用 $Q = K^{0.6}L^{0.6}$ 检验。
      en: |-
        Determine whether this statement is true or false, and explain: if a production function has diminishing marginal products of both capital and labor, it must have decreasing returns to scale. Check it with $Q = K^{0.6}L^{0.6}$.
    answer:
      zh-cn: |-
        假。$MP_L = 0.6\,K^{0.6}L^{-0.4}$，随 $L$ 增加而下降；$MP_K$ 同理，两个边际产量都递减。但 $f(tK, tL) = t^{1.2}f(K, L)$，所有投入翻倍时产量变为 $2^{1.2} \approx 2.3$ 倍，规模报酬递增。边际产量递减是只增加一种投入（其他投入固定）时的性质，规模报酬是所有投入同时增加时的性质，两者没有必然联系。
      en: |-
        False. $MP_L = 0.6\,K^{0.6}L^{-0.4}$ falls as $L$ rises, and the same holds for $MP_K$, so both marginal products diminish. But $f(tK, tL) = t^{1.2}f(K, L)$: doubling all inputs multiplies output by $2^{1.2} \approx 2.3$, so returns to scale are increasing. Diminishing marginal product is a property of increasing one input with the others fixed; returns to scale concern increasing all inputs together. One does not imply the other.
    rubric:
      zh-cn:
        - "结论为假。"
        - "验证两个边际产量递减，并算出规模报酬递增。"
        - "区分“一种投入”与“全部投入”。"
      en:
        - "States false."
        - "Verifies that both marginal products diminish and shows increasing returns to scale."
        - "Distinguishes increasing one input from increasing all inputs."

  - id: Q2
    kind: exercise
    level: C
    star: true
    concepts: [average-cost, marginal-cost]
    question:
      zh-cn: |-
        (a) 对 $\text{ATC}(q) = \frac{C(q)}{q}$ 求导，证明 $\text{ATC}' = \frac{1}{q}(MC - \text{ATC})$，从而 MC 在 ATC 的最低点穿过 ATC。用“考试平均分”的例子解释 MC 与 ATC 的关系。
        (b) 为什么 MC 先穿过 AVC 的最低点，再穿过 ATC 的最低点？
      en: |-
        (a) Differentiate $\text{ATC}(q) = \frac{C(q)}{q}$ to show that $\text{ATC}' = \frac{1}{q}(MC - \text{ATC})$, so MC crosses ATC at its minimum. Explain the relation between MC and ATC with the example of an exam average.
        (b) Why does MC cross the minimum of AVC before the minimum of ATC?
    answer:
      zh-cn: |-
        (a) $\text{ATC}'(q) = \frac{C'(q)\,q - C(q)}{q^2} = \frac{1}{q}\left(MC - \text{ATC}\right)$。最低点处导数为 0，所以 $MC = \text{ATC}$；$MC > \text{ATC}$ 时 ATC 上升，$MC < \text{ATC}$ 时下降。就像平均分：新考的一次分数高于目前的平均分，平均分上升；低于平均分，平均分下降。
        (b) 同理 $\text{AVC}' = \frac{1}{q}(MC - \text{AVC})$。$\text{ATC} = \text{AVC} + \frac{FC}{q}$ 在 AVC 之上；在 AVC 的最低点，MC 等于 AVC，因此小于 ATC，ATC 仍在下降，它的最低点在更大的产量处。（讲义的例子中分别是 $q = 5$ 和 $q = 6$。）
      en: |-
        (a) $\text{ATC}'(q) = \frac{C'(q)\,q - C(q)}{q^2} = \frac{1}{q}\left(MC - \text{ATC}\right)$. At the minimum the derivative is 0, so $MC = \text{ATC}$; when $MC > \text{ATC}$, ATC rises, and when $MC < \text{ATC}$, it falls. Like an exam average: a new score above the current average raises it; a score below lowers it.
        (b) In the same way, $\text{AVC}' = \frac{1}{q}(MC - \text{AVC})$. $\text{ATC} = \text{AVC} + \frac{FC}{q}$ lies above AVC; at AVC's minimum MC equals AVC and is therefore below ATC, so ATC is still falling and reaches its minimum at a larger output. (In the lesson's example, $q = 5$ and $q = 6$.)
    rubric:
      zh-cn:
        - "(a) 推导正确并给出直观解释。"
        - "(b) 用 ATC 在 AVC 之上说明顺序。"
      en:
        - "(a) Correct derivation with an intuitive explanation."
        - "(b) Explains the order by ATC lying above AVC."

  - id: Q3
    kind: exercise
    level: B
    concepts: [shutdown-point, average-cost, perfect-competition]
    expected: { shut: "15", qs: "5", be: "28", qb: "6" }
    question:
      zh-cn: |-
        (a) 对讲义的成本函数 $C(q) = 72 + q^3 - 10q^2 + 40q$，求停产点（AVC 的最低点）和盈亏平衡点（ATC 的最低点）的产量和价格。
        (b) 一家航空公司在淡季继续飞一条航线，票价低于每位乘客分摊的全部成本（包括飞机的折旧和租金、机场的长期合同）。一位分析师说：“它在每位乘客身上都亏钱，继续飞是不理性的。”用 (a) 背后的逻辑评价这个说法。在什么情况下它应该停飞这条航线？长期呢？
      en: |-
        (a) For the lesson's cost function $C(q) = 72 + q^3 - 10q^2 + 40q$, find the output and price at the shutdown point (the minimum of AVC) and the break-even point (the minimum of ATC).
        (b) In the low season an airline keeps flying a route at fares below the full cost per passenger (including depreciation and leases of the aircraft and long-term airport contracts). An analyst says: "It loses money on every passenger, so flying is irrational." Evaluate the statement using the logic behind (a). When should it stop flying the route? What about the long run?
    answer:
      zh-cn: |-
        (a) $\text{AVC} = q^2 - 10q + 40$，$\text{AVC}' = 2q - 10 = 0$，$q = 5$，最低值 15。$\text{ATC}' = 2q - 10 - \frac{72}{q^2} = 0$，$q = 6$ 满足，最低值 28。（验证 $MC(5) = 15$，$MC(6) = 28$。）
        (b) 飞机的折旧和租金、长期合同在淡季不飞也要付，相当于固定成本。是否飞这条航线，应该比较票价收入和可以避免的成本（燃油、机组、起降费等，相当于可变成本）。只要收入高于这些成本，飞比不飞亏得少，分析师错在用平均总成本做短期决策。只有收入连可避免的成本都覆盖不了，或者飞机有更好的用途（机会成本）时，才应该停飞。长期内飞机和合同可以调整，如果这条航线全年的收入都覆盖不了全部成本，就应该放弃它。
      en: |-
        (a) $\text{AVC} = q^2 - 10q + 40$, $\text{AVC}' = 2q - 10 = 0$, so $q = 5$ with a minimum of 15. $\text{ATC}' = 2q - 10 - \frac{72}{q^2} = 0$ holds at $q = 6$, with a minimum of 28. (Check: $MC(5) = 15$, $MC(6) = 28$.)
        (b) Aircraft depreciation and leases and long-term contracts must be paid in the low season whether or not the route is flown, so they act as fixed costs. Whether to fly should compare fare revenue with the costs that can be avoided (fuel, crews, landing fees and so on, like variable costs). As long as revenue exceeds those, flying loses less than not flying; the analyst uses average total cost for a short-run decision. The airline should stop only if revenue does not cover even the avoidable costs, or if the aircraft has a better use (an opportunity cost). In the long run aircraft and contracts can be adjusted, and if the route's revenue over the whole year does not cover its full cost, it should be dropped.
    rubric:
      zh-cn:
        - "(a) 停产点 $q = 5$、价格 15；盈亏平衡点 $q = 6$、价格 28。"
        - "(b) 指出短期决策应比较收入和可以避免的成本，固定成本不影响是否飞；说明停飞和长期退出的条件。同意分析师的说法：需要订正。"
      en:
        - "(a) Shutdown point $q = 5$ at a price of 15; break-even point $q = 6$ at a price of 28."
        - "(b) Points out that the short-run decision compares revenue with avoidable costs and that fixed costs do not affect it; states the conditions for stopping and for leaving in the long run. Agreeing with the analyst: needs revision."

  - id: Q4
    kind: exercise
    level: C
    concepts: [long-run, perfect-competition, economic-profit, market-equilibrium]
    expected: { n0: "120", n1: "170" }
    question:
      zh-cn: |-
        一个完全竞争行业中，所有厂商（现有的和潜在进入的）的成本都与讲义相同：$C(q) = 72 + q^3 - 10q^2 + 40q$。长期中厂商可以自由进入和退出，进入不改变成本。市场需求为 $Q_d = 1000 - 10P$。
        (a) 长期均衡价格、市场数量和厂商数目各是多少？
        (b) 需求增加到 $Q_d = 1300 - 10P$。短期（厂商数目不变）和长期各会发生什么？新的长期均衡价格和厂商数目是多少？
      en: |-
        In a perfectly competitive industry, all firms (current and potential entrants) have the lesson's cost: $C(q) = 72 + q^3 - 10q^2 + 40q$. In the long run firms can enter and exit freely, and entry does not change costs. Market demand is $Q_d = 1000 - 10P$.
        (a) What are the long-run equilibrium price, market quantity and number of firms?
        (b) Demand rises to $Q_d = 1300 - 10P$. What happens in the short run (with the number of firms fixed) and in the long run? What are the new long-run price and number of firms?
    answer:
      zh-cn: |-
        (a) 长期价格等于 ATC 最低点 28，每个厂商生产 6。市场数量 $1000 - 280 = 720$，厂商数目 $\frac{720}{6} = 120$。
        (b) 短期：120 个厂商沿 MC 增产，价格上升到 28 以上（约 46），厂商有正的经济利润。长期：利润吸引新厂商进入，供给增加，价格回落到 28；市场数量 $1300 - 280 = 1020$，厂商数目 $\frac{1020}{6} = 170$。成本不变的行业，需求增加长期只增加厂商数目，不改变价格。
      en: |-
        (a) The long-run price equals the minimum of ATC, 28, and each firm produces 6. Market quantity is $1000 - 280 = 720$ and the number of firms $\frac{720}{6} = 120$.
        (b) Short run: the 120 firms raise output along MC, the price rises above 28 (to about 46), and firms earn positive economic profit. Long run: profit attracts entry, supply rises, and the price falls back to 28; market quantity is $1300 - 280 = 1020$ and the number of firms $\frac{1020}{6} = 170$. In a constant-cost industry, higher demand raises only the number of firms in the long run, not the price.
    rubric:
      zh-cn:
        - "(a) 价格 28、数量 720、厂商 120。"
        - "(b) 说明短期利润和长期进入，价格 28、厂商 170。"
      en:
        - "(a) Price 28, quantity 720, 120 firms."
        - "(b) Explains short-run profit and long-run entry; price 28, 170 firms."

  - id: Q5
    kind: exercise
    level: B
    concepts: [economic-profit, long-run]
    expected: { acc: "80", econ: "-2" }
    question:
      zh-cn: |-
        一位店主经营一家咖啡馆，一年的收入 300（千美元），房租、原料和员工工资等实际支出 220。她不领工资；如果去别的公司工作，年薪是 70。她投入了 200 的自有资金，这笔钱投资在别处每年可以得到 6% 的回报。
        (a) 会计利润和经济利润各是多少？从长期看，她应该继续经营吗？
        (b) 有人说：“这家咖啡馆每年赚 8 万美元，回报率高达 40%（80 / 200），是很好的投资。”指出这个说法的问题。
      en: |-
        An owner runs a café with yearly revenue of 300 (thousand dollars) and actual expenses (rent, ingredients, staff wages) of 220. She takes no salary; working for another company, she would earn 70 a year. She put in 200 of her own money, which could earn 6% a year elsewhere.
        (a) What are the accounting profit and the economic profit? In the long run, should she keep running the café?
        (b) Someone says: "The café makes 80 thousand dollars a year, a 40% return (80 / 200), a great investment." What is wrong with this?
    answer:
      zh-cn: |-
        (a) 会计利润 $300 - 220 = 80$。机会成本：她自己的时间 70，资金 $200 \times 6\% = 12$。经济利润 $80 - 70 - 12 = -2$：她的时间和资金在别处能得到更多，如果情况不会改善，长期应该退出（不过差距很小，如果她从经营中得到其他满足，也可能选择继续）。
        (b) 80 中有 70 实际上是她自己劳动的报酬，不是资本的回报。扣除这部分后，资本只得到 10，回报率 5%，低于 6% 的机会成本。
      en: |-
        (a) Accounting profit is $300 - 220 = 80$. Opportunity costs: her own time, 70, and her money, $200 \times 6\% = 12$. Economic profit is $80 - 70 - 12 = -2$: her time and money would earn more elsewhere, so if nothing improves she should exit in the long run (though the gap is small, and she may stay if running the café gives her other satisfaction).
        (b) 70 of the 80 is really pay for her own work, not a return on capital. Without it, the capital earns only 10, a 5% return, below its 6% opportunity cost.
    rubric:
      zh-cn:
        - "(a) 会计利润 80、经济利润 −2（写作 - 或 − 均可），长期应考虑退出。"
        - "(b) 指出把劳动报酬算成了资本回报。"
      en:
        - "(a) Accounting profit 80, economic profit −2 (written with - or −); she should consider exiting."
        - "(b) Points out that pay for her labor was counted as a return on capital."

  - id: Q6
    kind: exercise
    level: B
    concepts: [production-function, long-run, returns-to-scale, marginal-product]
    expected: { L: "20", K: "80", ac: "16" }
    question:
      zh-cn: |-
        长期中厂商可以同时选择 $K$ 和 $L$。生产函数 $Q = K^{0.5}L^{0.5}$，工资 $w = 16$，资本租金 $r = 4$。
        (a) 生产 $Q = 40$ 时，成本最低的 $K$、$L$ 和平均成本各是多少？
        (b) 产量翻倍到 80 时，平均成本是多少？这和规模报酬有什么关系？
      en: |-
        In the long run a firm chooses both $K$ and $L$. The production function is $Q = K^{0.5}L^{0.5}$, the wage $w = 16$ and the rental rate of capital $r = 4$.
        (a) To produce $Q = 40$, what are the cost-minimizing $K$ and $L$ and the average cost?
        (b) If output doubles to 80, what is the average cost? How does this relate to returns to scale?
    answer:
      zh-cn: |-
        (a) 成本最低要求 $\frac{MP_L}{MP_K} = \frac{K}{L} = \frac{w}{r} = 4$，$K = 4L$。$Q = \sqrt{4L \cdot L} = 2L = 40$，$L = 20$，$K = 80$；总成本 $16 \times 20 + 4 \times 80 = 640$，平均成本 16。
        (b) $L = 40$，$K = 160$，成本 1280，平均成本仍是 16。规模报酬不变（$0.5 + 0.5 = 1$），投入和成本与产量同比例增加，长期平均成本是水平的。
      en: |-
        (a) Minimum cost requires $\frac{MP_L}{MP_K} = \frac{K}{L} = \frac{w}{r} = 4$, so $K = 4L$. $Q = \sqrt{4L \cdot L} = 2L = 40$ gives $L = 20$, $K = 80$; total cost is $16 \times 20 + 4 \times 80 = 640$ and average cost 16.
        (b) $L = 40$, $K = 160$, cost 1280, and average cost is still 16. With constant returns to scale ($0.5 + 0.5 = 1$), inputs and cost rise in proportion to output, so long-run average cost is flat.
    rubric:
      zh-cn:
        - "(a) $L = 20$、$K = 80$、平均成本 16。"
        - "(b) 平均成本不变，联系规模报酬不变。"
      en:
        - "(a) $L = 20$, $K = 80$, average cost 16."
        - "(b) Average cost unchanged, linked to constant returns to scale."
