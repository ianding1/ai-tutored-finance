# Answer key for lesson 1.2. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.2]] (lesson), [[1.2#slutsky]] (section), [[concept:demand]], [[check:Q4]].
# expected: values are recomputed by course/verify/1.2.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "1.2"

context:
  - zh-cn: |-
      学习者学过偏导数、预算约束、拉格朗日乘数法、“挪一美元”的论证（内部最优点 $\frac{MU_x}{p_x} = \frac{MU_y}{p_y}$）和角点解（[[0.2]]），以及需求、正常品和劣等品（[[1.1]]）。[[0.2]] 的练习题已推出 $U = xy$ 的需求函数 $x^* = \frac{M}{2p_x}$、$y^* = \frac{M}{2p_y}$。还没有学跨期选择（[[1.3]]）和不确定性下的选择（[[1.4]]）。
    en: |-
      The learner has studied partial derivatives, budget constraints, the Lagrange multiplier method, the "move one dollar" argument (an interior optimum satisfies $\frac{MU_x}{p_x} = \frac{MU_y}{p_y}$) and corner solutions ([[0.2]]), as well as demand and normal and inferior goods ([[1.1]]). An exercise in [[0.2]] derived the demand functions for $U = xy$: $x^* = \frac{M}{2p_x}$ and $y^* = \frac{M}{2p_y}$. The learner has not yet studied intertemporal choice ([[1.3]]) or choice under uncertainty ([[1.4]]).
  - concepts: [preferences, utility-function, marginal-utility]
    zh-cn: |-
      讲义列出偏好的四个假设（完备性、传递性、多多益善、凸性），说明效用函数只用来排序、严格递增变换表示同一种偏好（序数效用），并定义边际效用。讲义没有证明变换后 MRS 不变。
    en: |-
      The lesson lists four assumptions on preferences (completeness, transitivity, monotonicity, convexity), explains that a utility function is only used for ranking and that a strictly increasing transformation represents the same preferences (ordinal utility), and defines marginal utility. The lesson does not prove that the MRS is unchanged by a transformation.
  - concepts: [indifference-curve, marginal-rate-of-substitution]
    zh-cn: |-
      讲义定义 $MRS = -\frac{dy}{dx}\big|_{U} = \frac{MU_x}{MU_y}$；例：$U = xy$ 时 $MRS = \frac{y}{x}$，在 $(4, 9)$ 为 2.25。凸性意味着无差异曲线凸向原点。
    en: |-
      The lesson defines $MRS = -\frac{dy}{dx}\big|_{U} = \frac{MU_x}{MU_y}$; example: for $U = xy$, $MRS = \frac{y}{x}$, which is 2.25 at $(4, 9)$. Convexity means indifference curves bow toward the origin.
  - concepts: [budget-constraint, corner-solution]
    zh-cn: |-
      讲义给出内部最优条件 $MRS = \frac{p_x}{p_y}$（相切）；例：$U = xy$，$p_x = 2$，$p_y = 1$，$M = 40$，$x^* = 10$，$y^* = 20$。讲义提到完全互补 $U = \min(x, y)$ 的最优点在拐角、完全替代 $U = x + y$ 通常是角点解，但没有具体求解。
    en: |-
      The lesson gives the interior optimality condition $MRS = \frac{p_x}{p_y}$ (tangency); example: $U = xy$, $p_x = 2$, $p_y = 1$, $M = 40$ give $x^* = 10$ and $y^* = 20$. The lesson mentions that with perfect complements $U = \min(x, y)$ the optimum is at the kink and that perfect substitutes $U = x + y$ usually give a corner solution, but it does not solve either case.
  - concepts: [substitution-effect, income-effect, slutsky-equation, giffen-good]
    zh-cn: |-
      讲义用 Slutsky 补偿（调整收入使新价格下恰好买得起原组合）分解价格变化。例：$U = xy$，$M = 40$，$p_y = 1$，$p_x$ 从 2 降到 1：A $x = 10$，补偿收入 30，B $x = 15$，C $x = 20$，替代效应 5、收入效应 5。讲义给出 Slutsky 方程 $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\frac{\partial x}{\partial M}$（推导留给练习题），说明替代效应总是使需求量与价格反向变化，劣等品的收入效应方向相反，吉芬商品的收入效应超过替代效应。[[fig:5-1]] 中 $p_x$ 的滑块从 0.5 到 4，步长 0.25。
    en: |-
      The lesson splits a price change with Slutsky compensation (adjusting income so that the original bundle is just affordable at the new prices). Example: $U = xy$, $M = 40$, $p_y = 1$, $p_x$ falls from 2 to 1: A has $x = 10$, compensated income is 30, B has $x = 15$, C has $x = 20$; substitution effect 5, income effect 5. The lesson states the Slutsky equation $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\frac{\partial x}{\partial M}$ (the derivation is left to an exercise), explains that the substitution effect always moves the quantity demanded opposite to the price, that the income effect of an inferior good goes the other way, and that a Giffen good's income effect outweighs its substitution effect. In [[fig:5-1]] the slider for $p_x$ goes from 0.5 to 4 in steps of 0.25.

common_errors:
  - questions: [Q1]
    zh-cn: |-
      以为对效用函数做严格递增的变换会改变最优选择。边际效用会变，但两种商品的边际效用按同一个因子变化，边际替代率不变，最优选择也不变。
    en: |-
      Thinking a strictly increasing transformation of the utility function changes the optimal choice. Marginal utilities change, but both by the same factor, so the marginal rate of substitution and the optimal choice stay the same.
  - questions: [Q4]
    zh-cn: |-
      以为吉芬商品只需要是劣等品。替代效应总是使需求量与价格反向变化，收入效应必须足够大才能超过它；收入效应的大小与这种商品的购买量 $x$ 成正比，所以它通常要占支出的很大比例。
    en: |-
      Thinking a Giffen good need only be inferior. The substitution effect always moves the quantity opposite to the price, and the income effect must be large enough to outweigh it; the income effect is proportional to the quantity bought, $x$, so the good usually takes a large share of spending.
  - questions: [C2, Q2]
    zh-cn: |-
      把边际替代率写反（$\frac{MU_y}{MU_x}$），或把它和价格比的比较方向弄反：$MRS > \frac{p_x}{p_y}$ 时应该多买 $x$。
    en: |-
      Writing the marginal rate of substitution upside down ($\frac{MU_y}{MU_x}$), or comparing it with the price ratio in the wrong direction: when $MRS > \frac{p_x}{p_y}$, the consumer should buy more $x$.
  - questions: [C3, Q3]
    zh-cn: |-
      对完全互补或完全替代的偏好仍然套用相切条件 $MRS = \frac{p_x}{p_y}$。
    en: |-
      Applying the tangency condition $MRS = \frac{p_x}{p_y}$ to perfect complements or perfect substitutes.
  - questions: [C4, Q5, Q6]
    zh-cn: |-
      补偿收入算错：Slutsky 补偿是让消费者在新价格下恰好买得起原来的组合，补偿收入 = 新价格 × 原来的数量之和，而不是让他回到原来的效用水平。
    en: |-
      Computing the compensated income incorrectly: Slutsky compensation makes the original bundle just affordable at the new prices, so compensated income is the sum of new prices times the original quantities, not the income that restores the original utility.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: utility
    concepts: [utility-function, preferences]
    question:
      zh-cn: |-
        $U = xy$ 给组合 $(2, 8)$ 打 16 分，给 $(3, 5)$ 打 15 分。由此可知，消费者从 $(2, 8)$ 得到的满足比从 $(3, 5)$ 多约 7%。
      en: |-
        $U = xy$ gives the bundle $(2, 8)$ a score of 16 and $(3, 5)$ a score of 15. So the consumer gets about 7% more satisfaction from $(2, 8)$ than from $(3, 5)$.
    correct: false
    hint:
      zh-cn: 用 $V = \ln(xy)$ 打分，表示的是不是同一种偏好？两个分数的比例还是 $\frac{16}{15}$ 吗？
      en: Does scoring with $V = \ln(xy)$ represent the same preferences? Is the ratio of the two scores still $\frac{16}{15}$?
    answer:
      zh-cn: |-
        错。效用函数只用来排序：16 大于 15 只说明 $(2, 8)$ 更好，不说明好多少。对 $U$ 做严格递增的变换，例如 $V = \ln(xy)$，表示的是同一种偏好，但分数变成 $\ln 16 \approx 2.77$ 和 $\ln 15 \approx 2.71$，比例完全不同。分数的比例或差值没有意义，这就是序数效用。
      en: |-
        False. A utility function only ranks: 16 above 15 says only that $(2, 8)$ is better, not by how much. A strictly increasing transformation of $U$, such as $V = \ln(xy)$, represents the same preferences but gives scores $\ln 16 \approx 2.77$ and $\ln 15 \approx 2.71$, with a completely different ratio. Ratios or differences of the scores have no meaning; this is ordinal utility.

  - id: C2
    kind: check
    section: mrs
    concepts: [marginal-rate-of-substitution, marginal-utility]
    question:
      zh-cn: |-
        在消费者现在的组合处，边际替代率 $MRS = 3$，而价格比 $\frac{p_x}{p_y} = 2$。他应该：
      en: |-
        At the consumer's current bundle, the marginal rate of substitution is $MRS = 3$, while the price ratio is $\frac{p_x}{p_y} = 2$. He should:
    choices:
      - zh-cn: 多买 $x$，少买 $y$
        en: Buy more $x$ and less $y$
      - zh-cn: 少买 $x$，多买 $y$
        en: Buy less $x$ and more $y$
        why:
          zh-cn: $MRS = 3$ 表示他愿意用几单位 $y$ 换 1 单位 $x$？市场上换 1 单位 $x$ 要放弃几单位 $y$？
          en: $MRS = 3$ means he is willing to give up how many units of $y$ for one unit of $x$? How many units of $y$ does the market ask for one unit of $x$?
      - zh-cn: 保持不变，因为他已经在预算线上
        en: Keep the bundle, because he is already on the budget line
        why:
          zh-cn: 在预算线上只说明钱花完了。最优点还要满足什么条件？这里满足吗？
          en: Being on the budget line only means the money is spent. What else must hold at the optimum? Does it hold here?
      - zh-cn: 只买 $y$，因为 $y$ 相对便宜
        en: Buy only $y$, because $y$ is relatively cheap
        why:
          zh-cn: 消费者对 $x$ 的评价和 $x$ 的市场代价相比，是高还是低？
          en: Is the consumer's value of $x$ higher or lower than its cost in the market?
    correct: A
    answer:
      zh-cn: |-
        (A)。他愿意用 3 单位 $y$ 换 1 单位 $x$，而市场上只要 2 单位 $y$ 就能换到 1 单位 $x$：他对 $x$ 的评价高于它的代价。多买 $x$、少买 $y$ 能提高效用。随着 $x$ 增加、$y$ 减少，MRS 下降，直到等于价格比。
      en: |-
        (A). He is willing to give 3 units of $y$ for one unit of $x$, while the market asks only 2: he values $x$ above its cost. Buying more $x$ and less $y$ raises his utility. As $x$ rises and $y$ falls, the MRS falls until it equals the price ratio.

  - id: C3
    kind: check
    section: optimal-choice
    concepts: [budget-constraint, indifference-curve]
    question:
      zh-cn: |-
        一个人只在左鞋和右鞋成对时才得到效用：$U = \min(x, y)$。左鞋涨价，右鞋价格和预算不变。他会：
      en: |-
        A person gets utility only from pairs of left and right shoes: $U = \min(x, y)$. The price of left shoes rises; the price of right shoes and the budget do not change. He will:
    choices:
      - zh-cn: 左鞋和右鞋都少买，仍然成对
        en: Buy fewer left and right shoes, still in pairs
      - zh-cn: 只少买左鞋，右鞋的数量不变
        en: Buy fewer left shoes only, keeping the number of right shoes
        why:
          zh-cn: 多出来的单只右鞋会增加他的效用吗？
          en: Would unmatched right shoes add to his utility?
      - zh-cn: 不改变购买，因为左右鞋不能互相替代
        en: Not change his purchases, because left and right shoes cannot replace each other
        why:
          zh-cn: 涨价后，原来的组合还买得起吗？
          en: After the price rise, can he still afford his old bundle?
      - zh-cn: 多买右鞋，代替一部分左鞋
        en: Buy more right shoes to replace some left shoes
        why:
          zh-cn: 对这个人来说，右鞋能代替左鞋吗？
          en: For this person, can right shoes replace left shoes?
    correct: A
    answer:
      zh-cn: |-
        (A)。多出来的单只鞋不增加效用，所以他总是成对购买：$x = y = \frac{M}{p_x + p_y}$。左鞋涨价使一双鞋变贵，他买的双数减少。这里没有替代效应，只有收入效应；无差异曲线是直角，最优点在拐角处，相切条件不适用。
      en: |-
        (A). Unmatched shoes add no utility, so he always buys pairs: $x = y = \frac{M}{p_x + p_y}$. A higher price of left shoes makes a pair more expensive, so he buys fewer pairs. There is no substitution effect here, only an income effect; the indifference curves are right angles, the optimum is at the corner, and the tangency condition does not apply.

  - id: C4
    kind: check
    section: slutsky
    concepts: [substitution-effect, income-effect]
    widget: { id: slutsky, set: { p: 0.5 } }
    question:
      zh-cn: |-
        一种商品降价时，替代效应使它的需求量增加，收入效应也总是使它的需求量增加。
      en: |-
        When a good's price falls, the substitution effect raises the quantity demanded, and so does the income effect, always.
    correct: false
    hint:
      zh-cn: 收入效应的方向取决于收入增加时消费者会多买还是少买这种商品。有没有收入越高、买得越少的商品？
      en: The direction of the income effect depends on whether the consumer buys more or less of the good when income rises. Are there goods that people buy less of as income rises?
    answer:
      zh-cn: |-
        错。前半句对：替代效应总是使需求量与价格反向变化。收入效应的方向取决于商品的性质：正常品的收入效应也使需求量增加；劣等品的收入效应使需求量减少，与替代效应方向相反。只有劣等品的收入效应大到超过替代效应时，降价才会使需求量减少（吉芬商品）。
      en: |-
        False. The first half is right: the substitution effect always moves the quantity demanded opposite to the price. The direction of the income effect depends on the good: for a normal good it also raises the quantity demanded; for an inferior good it lowers it, working against the substitution effect. Only when an inferior good's income effect outweighs the substitution effect does a price fall reduce the quantity demanded (a Giffen good).

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [utility-function, marginal-rate-of-substitution]
    question:
      zh-cn: |-
        判断真假并说明理由：对效用函数 $U$ 做严格递增的变换 $V = f(U)$ 后，边际效用变了，所以消费者在同样的价格和收入下的最优选择也会改变。
      en: |-
        Determine whether this statement is true or false, and explain: after a strictly increasing transformation $V = f(U)$ of a utility function $U$, the marginal utilities change, so the consumer's best choice at the same prices and income changes too.
    answer:
      zh-cn: |-
        假。边际效用确实变了：$\frac{\partial V}{\partial x} = f'(U)\,MU_x$，$\frac{\partial V}{\partial y} = f'(U)\,MU_y$。但边际替代率是两者之比，$f'(U) > 0$ 约掉了：$MRS_V = \frac{f'(U)\,MU_x}{f'(U)\,MU_y} = MRS_U$。无差异曲线和最优条件 $MRS = \frac{p_x}{p_y}$ 都不变，所以最优选择不变。这正说明边际效用的大小本身没有意义，有意义的是 MRS。
      en: |-
        False. The marginal utilities do change: $\frac{\partial V}{\partial x} = f'(U)\,MU_x$ and $\frac{\partial V}{\partial y} = f'(U)\,MU_y$. But the marginal rate of substitution is their ratio, and $f'(U) > 0$ cancels: $MRS_V = \frac{f'(U)\,MU_x}{f'(U)\,MU_y} = MRS_U$. The indifference curves and the optimality condition $MRS = \frac{p_x}{p_y}$ are unchanged, so the best choice is unchanged. This shows that the size of marginal utility has no meaning by itself; what matters is the MRS.
    rubric:
      zh-cn:
        - "结论为假。"
        - "用链式法则说明 $f'(U)$ 在 MRS 中约掉，或说明无差异曲线不变。"
      en:
        - "States false."
        - "Uses the chain rule to show that $f'(U)$ cancels in the MRS, or explains that the indifference curves do not change."

  - id: Q2
    kind: exercise
    level: B
    concepts: [marginal-rate-of-substitution, indifference-curve, budget-constraint]
    expected: { x: "10", y: "10" }
    question:
      zh-cn: |-
        效用函数 $U = x^{0.3} y^{0.7}$。
        (a) 求边际替代率。沿着一条无差异曲线，$x$ 增加时 MRS 怎样变化？这说明了无差异曲线的什么形状？
        (b) $p_x = 3$，$p_y = 7$，$M = 100$。用相切条件求最优选择。花在 $x$ 上的钱占预算的比例是多少？
      en: |-
        The utility function is $U = x^{0.3} y^{0.7}$.
        (a) Find the marginal rate of substitution. Along an indifference curve, how does the MRS change as $x$ rises? What does this say about the shape of the indifference curve?
        (b) $p_x = 3$, $p_y = 7$ and $M = 100$. Use the tangency condition to find the best choice. What share of the budget is spent on $x$?
    answer:
      zh-cn: |-
        (a) $MU_x = 0.3\,x^{-0.7}y^{0.7}$，$MU_y = 0.7\,x^{0.3}y^{-0.3}$，$MRS = \frac{0.3}{0.7} \cdot \frac{y}{x}$。沿着无差异曲线，$x$ 增加时 $y$ 减少，$\frac{y}{x}$ 下降，MRS 递减：无差异曲线凸向原点。
        (b) $\frac{0.3}{0.7} \cdot \frac{y}{x} = \frac{3}{7}$，得 $y = x$。代入 $3x + 7y = 100$，$x = y = 10$。花在 $x$ 上的钱是 30 美元，占 30%，正好等于 $x$ 的指数 0.3。
      en: |-
        (a) $MU_x = 0.3\,x^{-0.7}y^{0.7}$ and $MU_y = 0.7\,x^{0.3}y^{-0.3}$, so $MRS = \frac{0.3}{0.7} \cdot \frac{y}{x}$. Along an indifference curve, $y$ falls as $x$ rises, so $\frac{y}{x}$ falls and the MRS diminishes: the indifference curve bows toward the origin.
        (b) $\frac{0.3}{0.7} \cdot \frac{y}{x} = \frac{3}{7}$ gives $y = x$. The budget $3x + 7y = 100$ then gives $x = y = 10$. Spending on $x$ is 30 dollars, 30% of the budget, exactly the exponent of $x$, 0.3.
    rubric:
      zh-cn:
        - "(a) MRS 的表达式正确，说明递减和凸向原点。"
        - "(b) $x = y = 10$，支出比例 30%。"
      en:
        - "(a) The MRS is correct, and its decline and the bowed shape are explained."
        - "(b) $x = y = 10$, a spending share of 30%."

  - id: Q3
    kind: exercise
    level: B
    concepts: [corner-solution, indifference-curve, demand]
    expected: { y: "30", x: "20", pstar: "2" }
    question:
      zh-cn: |-
        某人认为 1 单位 $x$ 和 2 单位 $y$ 一样好：$U = 2x + y$。预算 $M = 30$，$p_y = 1$。
        (a) $p_x = 3$ 和 $p_x = 1.5$ 时，他各买多少 $x$ 和 $y$？
        (b) 描述他对 $x$ 的需求曲线的形状。为什么相切条件在这里帮不上忙？
      en: |-
        Someone thinks 1 unit of $x$ is as good as 2 units of $y$: $U = 2x + y$. The budget is $M = 30$ and $p_y = 1$.
        (a) How much $x$ and $y$ does he buy when $p_x = 3$ and when $p_x = 1.5$?
        (b) Describe the shape of his demand curve for $x$. Why does the tangency condition not help here?
    answer:
      zh-cn: |-
        (a) 比较每 1 美元带来的效用：$x$ 为 $\frac{2}{p_x}$，$y$ 为 1。$p_x = 3$ 时 $\frac{2}{3} < 1$，全部买 $y$：$y = 30$，$x = 0$。$p_x = 1.5$ 时 $\frac{2}{1.5} > 1$，全部买 $x$：$x = 20$，$y = 0$。
        (b) $p_x > 2$ 时不买 $x$；$p_x < 2$ 时买 $x = \frac{30}{p_x}$；需求曲线在 $p_x = 2$ 处从 0 跳到 15。无差异曲线是斜率为 −2 的直线，MRS 处处等于 2，只有价格比正好等于 2 时才“相切”（整条预算线都是最优）；其他情况下最优点都在角点上。
      en: |-
        (a) Compare utility per dollar: $\frac{2}{p_x}$ for $x$ and 1 for $y$. At $p_x = 3$, $\frac{2}{3} < 1$, so he buys only $y$: $y = 30$, $x = 0$. At $p_x = 1.5$, $\frac{2}{1.5} > 1$, so he buys only $x$: $x = 20$, $y = 0$.
        (b) He buys no $x$ when $p_x > 2$ and $x = \frac{30}{p_x}$ when $p_x < 2$; the demand curve jumps from 0 to 15 at $p_x = 2$. The indifference curves are straight lines with slope −2, so the MRS is 2 everywhere; there is a "tangency" only when the price ratio is exactly 2 (then the whole budget line is optimal); otherwise the optimum is at a corner.
    rubric:
      zh-cn:
        - "(a) $p_x = 3$ 时只买 $y$（30），$p_x = 1.5$ 时只买 $x$（20）。"
        - "(b) 需求在 $p_x = 2$ 处跳跃，并说明角点解。"
      en:
        - "(a) Only $y$ (30) at $p_x = 3$; only $x$ (20) at $p_x = 1.5$."
        - "(b) Demand jumps at $p_x = 2$, explained by corner solutions."

  - id: Q4
    kind: exercise
    level: C
    star: true
    concepts: [slutsky-equation, substitution-effect, income-effect]
    question:
      zh-cn: |-
        推导 Slutsky 方程。设 $x(p_x, M)$ 是需求函数（$p_y$ 固定），原来的价格为 $p_0$，原来的选择为 $x_0 = x(p_0, M_0)$。Slutsky 补偿后的需求是
        $$x^s(p_x) = x\big(p_x,\; M_0 + x_0\,(p_x - p_0)\big)$$
        (a) 解释括号里的第二项为什么是补偿后的收入，再对 $p_x$ 求导并在 $p_x = p_0$ 处取值，推出 $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\,\frac{\partial x}{\partial M}$。
        (b) 用这个方程说明：为什么一种商品要成为吉芬商品，它必须是劣等品，而且通常要在消费者的支出中占很大比例？
      en: |-
        Derive the Slutsky equation. Let $x(p_x, M)$ be the demand function ($p_y$ fixed), with original price $p_0$ and original choice $x_0 = x(p_0, M_0)$. Slutsky-compensated demand is
        $$x^s(p_x) = x\big(p_x,\; M_0 + x_0\,(p_x - p_0)\big)$$
        (a) Explain why the second argument is the compensated income, then differentiate with respect to $p_x$ and evaluate at $p_x = p_0$ to obtain $\frac{\partial x}{\partial p_x} = \frac{\partial x^s}{\partial p_x} - x\,\frac{\partial x}{\partial M}$.
        (b) Use the equation to explain why, for a good to be a Giffen good, it must be inferior and usually take a large share of the consumer's spending.
    answer:
      zh-cn: |-
        (a) 价格从 $p_0$ 变为 $p_x$ 后，要买得起原来的组合，买 $x_0$ 单位 $x$ 需要多花 $x_0(p_x - p_0)$（$y$ 的价格不变），所以收入要调整为 $M_0 + x_0(p_x - p_0)$。由链式法则，$\frac{dx^s}{dp_x} = \frac{\partial x}{\partial p_x} + \frac{\partial x}{\partial M} \cdot x_0$。在 $p_x = p_0$ 处补偿后的收入就是 $M_0$，$x = x_0$，移项即得。
        (b) 替代效应 $\frac{\partial x^s}{\partial p_x} \le 0$。要使 $\frac{\partial x}{\partial p_x} > 0$，必须 $-x\,\frac{\partial x}{\partial M} > 0$ 且足够大，即 $\frac{\partial x}{\partial M} < 0$（劣等品）。收入效应的大小与 $x$ 成正比：这种商品买得越多（支出占比越大），价格变化对实际收入的影响越大，收入效应才可能超过替代效应。
      en: |-
        (a) After the price changes from $p_0$ to $p_x$, buying the original bundle costs $x_0(p_x - p_0)$ more for $x$ (the price of $y$ is unchanged), so income must become $M_0 + x_0(p_x - p_0)$. By the chain rule, $\frac{dx^s}{dp_x} = \frac{\partial x}{\partial p_x} + \frac{\partial x}{\partial M} \cdot x_0$. At $p_x = p_0$ compensated income is $M_0$ and $x = x_0$; rearranging gives the result.
        (b) The substitution effect is $\frac{\partial x^s}{\partial p_x} \le 0$. For $\frac{\partial x}{\partial p_x} > 0$, we need $-x\,\frac{\partial x}{\partial M} > 0$ and large enough, so $\frac{\partial x}{\partial M} < 0$ (an inferior good). The income effect is proportional to $x$: the more of the good is bought (the larger its share of spending), the more a price change affects real income, and only then can the income effect outweigh the substitution effect.
    rubric:
      zh-cn:
        - "(a) 解释补偿收入，用链式法则推出方程。"
        - "(b) 说明劣等品和支出占比两个条件。"
      en:
        - "(a) Explains compensated income and derives the equation with the chain rule."
        - "(b) Explains both conditions: inferior good and large spending share."

  - id: Q5
    kind: exercise
    level: B
    concepts: [substitution-effect, income-effect]
    expected: { se: "5", ie: "-5" }
    question:
      zh-cn: |-
        $U = xy$，$M = 40$，$p_x = 2$。$y$ 的价格从 1 涨到 2，而这个消费者对 $x$ 的需求 $x = \frac{M}{2p_x}$ 与 $p_y$ 无关。对 $x$ 做 Slutsky 分解，替代效应和收入效应各是多少？用它们解释为什么 $x$ 的需求与 $p_y$ 无关。
      en: |-
        $U = xy$, $M = 40$, $p_x = 2$. The price of $y$ rises from 1 to 2, while this consumer's demand for $x$, $x = \frac{M}{2p_x}$, does not depend on $p_y$. Do a Slutsky decomposition for $x$: what are the substitution and income effects? Use them to explain why the demand for $x$ does not depend on $p_y$.
    answer:
      zh-cn: |-
        原来的组合是 $x = 10$，$y = 20$。补偿收入 $M' = 2 \times 10 + 2 \times 20 = 60$，补偿后 $x = \frac{60}{2 \times 2} = 15$。替代效应 $15 - 10 = 5$（$y$ 相对变贵，用 $x$ 替代 $y$），收入效应 $10 - 15 = -5$（实际收入下降，$x$ 是正常品，买得更少）。
        对这个效用函数，两个效应大小相等、方向相反，正好抵消，所以 $x$ 的需求不随 $p_y$ 变化。
      en: |-
        The original bundle is $x = 10$, $y = 20$. Compensated income is $M' = 2 \times 10 + 2 \times 20 = 60$, and compensated demand is $x = \frac{60}{2 \times 2} = 15$. The substitution effect is $15 - 10 = 5$ ($y$ is relatively dearer, so $x$ replaces $y$), and the income effect is $10 - 15 = -5$ (real income falls and $x$ is normal, so less is bought).
        For this utility function the two effects are equal and opposite and cancel exactly, so the demand for $x$ does not change with $p_y$.
    rubric:
      zh-cn:
        - "替代效应 5、收入效应 −5（写作 -5 或 −5 均可）。"
        - "说明两者正好抵消。"
      en:
        - "Substitution effect 5, income effect −5 (written -5 or −5)."
        - "Explains that the two cancel exactly."

  - id: Q6
    kind: exercise
    level: B
    concepts: [giffen-good, slutsky-equation, income-effect]
    expected: { ie: "4.5", total: "2.5" }
    question:
      zh-cn: |-
        一个低收入家庭每月买 60 公斤米，米是这个家庭最主要的支出。研究者估计：米价每公斤上涨 0.5 美元时，替代效应使米的需求量减少 2 公斤；这个家庭对米的需求随收入的变化是 $\frac{\partial x}{\partial M} = -0.15$ 公斤 / 美元。
        (a) 用 Slutsky 方程估计总效应。对这个家庭来说，米是吉芬商品吗？
        (b) 为什么同样是劣等品，对富裕家庭来说米通常不会是吉芬商品？
      en: |-
        A low-income household buys 60 kilograms of rice a month, and rice is its largest expense. Researchers estimate that when the price of rice rises by 0.5 dollars per kilogram, the substitution effect lowers the quantity of rice demanded by 2 kilograms, and that the household's demand for rice changes with income by $\frac{\partial x}{\partial M} = -0.15$ kilograms per dollar.
        (a) Use the Slutsky equation to estimate the total effect. Is rice a Giffen good for this household?
        (b) Why is rice usually not a Giffen good for a well-off household, even though it is also inferior there?
    answer:
      zh-cn: |-
        (a) 收入效应 $= -x\,\frac{\partial x}{\partial M}\,\Delta p = -60 \times (-0.15) \times 0.5 = 4.5$ 公斤，总效应 $= -2 + 4.5 = 2.5$ 公斤：价格上升时需求量增加，是吉芬商品。
        (b) 收入效应与购买量 $x$ 成正比。富裕家庭买的米占支出的比例很小，米价上涨对它的实际收入影响很小，收入效应远小于替代效应，需求量仍随价格上升而下降。
      en: |-
        (a) The income effect is $-x\,\frac{\partial x}{\partial M}\,\Delta p = -60 \times (-0.15) \times 0.5 = 4.5$ kilograms, so the total effect is $-2 + 4.5 = 2.5$ kilograms: demand rises when the price rises, so rice is a Giffen good here.
        (b) The income effect is proportional to the quantity bought. Rice is a small share of a well-off household's spending, so a price rise barely affects its real income; the income effect is far smaller than the substitution effect, and demand still falls when the price rises.
    rubric:
      zh-cn:
        - "(a) 收入效应 4.5、总效应 2.5，是吉芬商品。"
        - "(b) 用收入效应与购买量成正比解释。"
      en:
        - "(a) Income effect 4.5, total effect 2.5; a Giffen good."
        - "(b) Explains that the income effect is proportional to the quantity bought."
