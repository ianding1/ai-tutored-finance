# Answer key for lesson 1.4. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.4]] (lesson), [[1.4#crra]] (section), [[concept:risk-premium]], [[check:Q4]].
# expected: values are recomputed by course/verify/1.4.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "1.4"

context:
  - zh-cn: |-
      学习者学过期望和方差（[[0.3]]）、样本均值的标准误、均值与中位数和 [[0.4]] 的抛硬币投资（每年等概率乘以 1.5 或 0.6），以及效用函数（[[1.2]]）。还没有学资本配置与最优股票比例（[[4.3]]）。
    en: |-
      The learner has studied expected values and variances ([[0.3]]), the standard error of a sample mean, the mean and the median, and the coin-flip investment of [[0.4]] (wealth multiplied each year by 1.5 or 0.6 with equal probability), as well as utility functions ([[1.2]]). The learner has not yet studied capital allocation and the optimal share in stocks ([[4.3]]).
  - concepts: [expected-utility, risk-aversion, absolute-risk-aversion, relative-risk-aversion]
    zh-cn: |-
      讲义定义期望效用 $E[u(W)] = \sum p_i u(W_i)$，说明效用只能做正的线性变换；风险厌恶 $u(E[W]) > E[u(W)]$ 等价于 $u$ 严格凹；$A = -\frac{u''}{u'}$，$R = -\frac{Wu''}{u'}$。讲义的引例：财富 10 万美元，抛硬币赢或输 5 万美元。
    en: |-
      The lesson defines expected utility $E[u(W)] = \sum p_i u(W_i)$ and explains that utility allows only positive linear transformations; risk aversion $u(E[W]) > E[u(W)]$ is equivalent to a strictly concave $u$; $A = -\frac{u''}{u'}$ and $R = -\frac{Wu''}{u'}$. Opening example: wealth of 100,000 dollars and a coin flip to win or lose 50,000.
  - concepts: [certainty-equivalent, risk-premium]
    zh-cn: |-
      讲义例子：$u = \ln W$，财富 100，等概率变为 150 或 50，CE $= \sqrt{7500} \approx 86.60$，风险溢价约 13.40；近似公式 $\pi \approx \frac{1}{2}A\sigma^2$ 给出 12.5（推导留给练习题）。[[fig:4-1]] 为财富 100、赌局 $100 \pm h$ 的 CRRA 效用，滑块 $\gamma$ 从 0 到 5（步长 0.5），$h$ 从 10 到 90（步长 10），默认 $\gamma = 1$、$h = 50$。
    en: |-
      Example in the lesson: $u = \ln W$, wealth 100 becoming 150 or 50 with equal probability, CE $= \sqrt{7500} \approx 86.60$, risk premium about 13.40; the approximation $\pi \approx \frac{1}{2}A\sigma^2$ gives 12.5 (the derivation is left to an exercise). [[fig:4-1]] shows CRRA utility for wealth 100 and the gamble $100 \pm h$; the slider $\gamma$ goes from 0 to 5 in steps of 0.5 and $h$ from 10 to 90 in steps of 10, with defaults $\gamma = 1$ and $h = 50$.
  - concepts: [risk-premium, risk-aversion]
    questions: [C4, Q5]
    zh-cn: |-
      讲义的保险例子：财富 100，房子 75，1% 概率全损，预期损失 0.75，$u = \ln W$，CE $\approx 98.62$，最高保费约 1.38；保险公司承保大量独立保单，近似风险中性。
    en: |-
      Insurance example in the lesson: wealth 100, a house worth 75, a 1% chance of total loss, expected loss 0.75, $u = \ln W$, CE $\approx 98.62$, highest acceptable premium about 1.38; an insurer with many independent policies is close to risk neutral.
  - concepts: [crra-utility]
    zh-cn: |-
      讲义给出 CRRA 效用 $\frac{W^{1-\gamma}}{1-\gamma}$（$\gamma = 1$ 为 $\ln W$），$R = \gamma$，按比例的风险溢价 $\frac{\pi}{W} \approx \frac{1}{2}\gamma\sigma^2$；说明 CRRA 投资者对按比例的赌局的态度与财富无关（没有证明），研究中 $\gamma$ 的估计大多在 1 到 10 之间；指出对数效用最大化对数收益率的期望，与关心中位数的思路一致（细节留给练习题）。
    en: |-
      The lesson gives CRRA utility $\frac{W^{1-\gamma}}{1-\gamma}$ ($\ln W$ when $\gamma = 1$), $R = \gamma$, and the proportional risk premium $\frac{\pi}{W} \approx \frac{1}{2}\gamma\sigma^2$; it states (without proof) that a CRRA investor's attitude to proportional gambles does not depend on wealth, that estimates of $\gamma$ mostly lie between 1 and 10, and that log utility maximizes the expected log return, in line with caring about the median (details left to exercises).

common_errors:
  - questions: [C1, C3, C4, Q6]
    zh-cn: |-
      把确定性等价算成效用的期望值本身（例如写 CE = 6），忘了用 $u^{-1}$ 换回金额。
    en: |-
      Reporting the expected utility itself as the certainty equivalent (for example, CE = 6), forgetting to convert back to money with $u^{-1}$.
  - questions: [Q2]
    zh-cn: |-
      把 $u(\mu - \pi)$ 也展开到二阶，或者以为 $E[\varepsilon] = 0$ 时一阶项和二阶项都消失。一阶项因 $E[\varepsilon] = 0$ 而消失，风险溢价来自二阶项 $\frac{1}{2}u''\sigma^2$；$\pi$ 本身是 $\sigma^2$ 量级，它的二阶项可以忽略。
    en: |-
      Expanding $u(\mu - \pi)$ to second order too, or thinking both the first- and second-order terms vanish when $E[\varepsilon] = 0$. The first-order term vanishes because $E[\varepsilon] = 0$, and the risk premium comes from the second-order term $\frac{1}{2}u''\sigma^2$; $\pi$ itself is of order $\sigma^2$, so its second-order term can be ignored.
  - questions: [Q3]
    zh-cn: |-
      以为越富有的人一定把越大比例的财富投入风险资产。CRRA 投资者按比例计算的风险溢价与财富无关，投入风险资产的比例也与财富无关。
    en: |-
      Thinking richer people must put a larger share of wealth into risky assets. For a CRRA investor the proportional risk premium does not depend on wealth, and neither does the share in risky assets.
  - questions: [Q4]
    zh-cn: |-
      以为期望收益为正就应该全部投入。对数效用的投资者最大化 $E[\ln W]$，也就是长期中位数财富的增长率；全部投入时它可能为负，最优比例要权衡期望收益和波动。
    en: |-
      Thinking a positive expected return means investing everything. A log-utility investor maximizes $E[\ln W]$, the growth rate of long-run median wealth; investing everything can make it negative, and the best share balances expected return against volatility.
  - questions: [Q1]
    zh-cn: |-
      认为风险厌恶就是拒绝一切风险：对期望收益为正的小赌局，风险溢价（与方差成正比，是二阶小量）可能小于期望收益（一阶），风险厌恶的人也会接受。
    en: |-
      Thinking that risk aversion means refusing all risk: for a small gamble with a positive expected gain, the risk premium (proportional to the variance, a second-order quantity) can be smaller than the expected gain (first order), and a risk-averse person accepts it.
  - questions: [C4, Q5]
    zh-cn: |-
      认为保费高于预期损失就一定不划算：风险厌恶的人愿意付出风险溢价来消除风险。
    en: |-
      Thinking that a premium above the expected loss is always a bad deal: a risk-averse person is willing to pay a risk premium to remove the risk.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: expected-utility
    concepts: [expected-utility, certainty-equivalent]
    question:
      zh-cn: |-
        效用函数是凹函数的人，面对一个赌局和一笔确定的财富，如果两者的期望财富相同，他总是更喜欢确定的财富。
      en: |-
        A person with a concave utility function, choosing between a lottery and a sure amount of wealth with the same expected value, always prefers the sure amount.
    correct: true
    hint:
      zh-cn: 凹函数图像上两点的连线，在曲线的上方还是下方？连线中点的高度代表什么？
      en: Does the chord between two points on a concave curve lie above or below the curve? What does the height of its midpoint represent?
    answer:
      zh-cn: |-
        对。凹函数上两点的连线在曲线下方，所以赌局的期望效用 $E[u(W)]$ 低于期望财富的效用 $u(E[W])$。确定性等价低于期望财富，差额就是风险溢价。这正是风险厌恶的定义。
      en: |-
        True. For a concave function the chord between two points lies below the curve, so the lottery's expected utility $E[u(W)]$ is below the utility of the expected wealth $u(E[W])$. The certainty equivalent is below the expected wealth, and the difference is the risk premium. This is exactly what risk aversion means.

  - id: C2
    kind: check
    section: risk-aversion
    concepts: [risk-aversion, absolute-risk-aversion, relative-risk-aversion]
    question:
      zh-cn: |-
        一个效用为 $u = \ln W$ 的人，财富从 10 万美元增加到 1,000 万美元。面对一个“等概率输或赢 1,000 美元”的赌局，他要求的风险溢价：
      en: |-
        A person with utility $u = \ln W$ sees his wealth grow from 100 thousand to 10 million dollars. For a lottery that wins or loses 1,000 dollars with equal probability, the risk premium he requires:
    choices:
      - zh-cn: 变小
        en: Becomes smaller
      - zh-cn: 变大，因为他有更多的钱可以输
        en: Becomes larger, because he has more money to lose
        why:
          zh-cn: 对数效用的绝对风险厌恶系数 $A = \frac{1}{W}$。财富增加时它怎样变化？
          en: Log utility has absolute risk aversion $A = \frac{1}{W}$. How does it change as wealth grows?
      - zh-cn: 不变，因为他的相对风险厌恶系数不变
        en: Stays the same, because his relative risk aversion does not change
        why:
          zh-cn: 相对风险厌恶描述的是对按财富比例计算的赌局的态度。1,000 美元占他财富的比例变了吗？
          en: Relative risk aversion describes attitudes to lotteries scaled to wealth. Does 1,000 dollars remain the same share of his wealth?
      - zh-cn: 先变大后变小
        en: First grows and then shrinks
        why:
          zh-cn: $A = \frac{1}{W}$ 随财富单调变化，还是先升后降？
          en: Does $A = \frac{1}{W}$ change monotonically with wealth, or rise and then fall?
    correct: A
    answer:
      zh-cn: |-
        (A)。小赌局的风险溢价约为 $\frac{1}{2}A\sigma^2$，对数效用的 $A = \frac{1}{W}$ 随财富下降。1,000 美元对 10 万美元的财富是 1%，对 1,000 万美元只是 0.01%，他越富有越不在乎这个固定金额的赌局。他的相对风险厌恶不变，说明的是对“输赢各为财富 1%”这类按比例的赌局态度不变。
      en: |-
        (A). For a small lottery the risk premium is about $\frac{1}{2}A\sigma^2$, and log utility has $A = \frac{1}{W}$, which falls with wealth. 1,000 dollars is 1% of 100 thousand but only 0.01% of 10 million, so the richer he is, the less he cares about a lottery of a fixed amount. His constant relative risk aversion means his attitude to lotteries scaled to wealth, such as winning or losing 1% of it, stays the same.

  - id: C3
    kind: check
    section: certainty-equivalent
    concepts: [certainty-equivalent, risk-premium, crra-utility]
    widget: { id: risk-premium, set: { g: 3 } }
    question:
      zh-cn: |-
        在 [[fig:4-1]] 中保持 $\gamma$ 不变，把赌局的大小 $h$ 加倍（例如从 10 调到 20）。风险溢价：
      en: |-
        In [[fig:4-1]], keep $\gamma$ fixed and double the size of the lottery $h$ (for example, from 10 to 20). The risk premium:
    choices:
      - zh-cn: 大约变为原来的 4 倍
        en: Becomes about 4 times as large
      - zh-cn: 正好变为原来的 2 倍，与 $h$ 成正比
        en: Becomes exactly twice as large, in proportion to $h$
        why:
          zh-cn: 风险溢价的近似公式 $\frac{1}{2}A\sigma^2$ 中，赌局的大小以什么形式出现？
          en: In the approximation $\frac{1}{2}A\sigma^2$ for the risk premium, in what form does the size of the lottery appear?
      - zh-cn: 不变，因为期望财富没有变
        en: Stays the same, because the expected wealth has not changed
        why:
          zh-cn: 期望财富确实不变，但确定性等价呢？看图中连线中点的高度怎样变化。
          en: The expected wealth is indeed unchanged, but what about the certainty equivalent? Watch how the height of the chord's midpoint changes.
      - zh-cn: 变小，因为赢的部分也变大了
        en: Becomes smaller, because the possible gain also grows
        why:
          zh-cn: 赢和输都加倍了，但效用函数是凹的：多赢 10 增加的效用和多输 10 减少的效用，哪个大？
          en: 'Both the gain and the loss double, but utility is concave: is the utility added by winning 10 more larger or smaller than that lost by losing 10 more?'
    correct: A
    answer:
      zh-cn: |-
        (A)。对较小的赌局，风险溢价约为 $\frac{1}{2}A\sigma^2$，与方差成正比，而方差随赌局大小的平方增长：$h$ 加倍，风险溢价约变为 4 倍。所以风险厌恶的人对小风险几乎不在乎，对大风险非常在乎。赌局很大时，近似不再准确。
      en: |-
        (A). For moderate lotteries the risk premium is about $\frac{1}{2}A\sigma^2$, proportional to the variance, which grows with the square of the lottery's size: doubling $h$ roughly quadruples the risk premium. So a risk-averse person cares little about small risks and a lot about large ones. For very large lotteries the approximation becomes less accurate.

  - id: C4
    kind: check
    section: insurance
    concepts: [risk-premium, certainty-equivalent, risk-aversion]
    question:
      zh-cn: |-
        一份汽车保险的保费高于预期损失。对一个风险厌恶的人来说，买这份保险一定不划算。
      en: |-
        A car insurance policy has a premium above the expected loss. For a risk-averse person, buying it is certainly a bad deal.
    correct: false
    hint:
      zh-cn: 风险厌恶的人愿意为消除风险付出多少？把保费和预期损失加上风险溢价比较。
      en: How much is a risk-averse person willing to pay to remove a risk? Compare the premium with the expected loss plus the risk premium.
    answer:
      zh-cn: |-
        错。风险厌恶的人愿意付出比预期损失更多的钱来消除风险，多付的上限就是风险溢价。只要保费低于预期损失加上风险溢价，买保险就提高了他的期望效用。例如财富 50、汽车值 20、全损概率 5%、$u = \ln W$ 时，预期损失为 1，他愿意付的最高保费约为 1.26。
      en: |-
        False. A risk-averse person is willing to pay more than the expected loss to remove a risk, up to the risk premium on top. As long as the premium is below the expected loss plus the risk premium, insurance raises his expected utility. For example, with wealth 50, a car worth 20, a 5% chance of total loss and $u = \ln W$, the expected loss is 1 and the most he will pay is about 1.26.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [risk-aversion, certainty-equivalent]
    expected: { ce: "100.4" }
    question:
      zh-cn: |-
        判断真假并说明理由：风险厌恶的人不会接受任何有风险的赌局，即使它的期望收益为正。用 $u = \ln W$、财富 100、赌局“等概率赢 12 或输 10”检验。
      en: |-
        Determine whether this statement is true or false, and explain: a risk-averse person accepts no risky gamble, even one with a positive expected gain. Check it with $u = \ln W$, wealth 100 and a gamble that wins 12 or loses 10 with equal probability.
    answer:
      zh-cn: |-
        假。$\text{CE} = \sqrt{112 \times 90} \approx 100.4 > 100$，参加赌局比不参加好。期望收益 1 是“一阶”的，与赌局大小成正比；风险溢价约 $\frac{1}{2}A\sigma^2 = \frac{1}{2} \times 0.01 \times 121 \approx 0.6$，与方差成正比。赌局足够小时，期望收益大于风险溢价，风险厌恶的人也会接受。风险厌恶只是说他会为风险要求补偿。
      en: |-
        False. $\text{CE} = \sqrt{112 \times 90} \approx 100.4 > 100$, so taking the gamble is better than not. The expected gain of 1 is "first order", proportional to the size of the gamble, while the risk premium, about $\frac{1}{2}A\sigma^2 = \frac{1}{2} \times 0.01 \times 121 \approx 0.6$, is proportional to the variance. For a small enough gamble, the expected gain exceeds the risk premium, and a risk-averse person accepts. Risk aversion only means that he requires compensation for risk.
    rubric:
      zh-cn:
        - "结论为假，CE 约 100.4。"
        - "比较期望收益与风险溢价（或说明风险溢价与方差成正比）。"
      en:
        - "States false; CE about 100.4."
        - "Compares the expected gain with the risk premium (or explains that the risk premium is proportional to the variance)."

  - id: Q2
    kind: exercise
    level: C
    star: true
    concepts: [risk-premium, absolute-risk-aversion]
    question:
      zh-cn: |-
        推导小赌局的风险溢价近似公式。财富 $W = \mu + \varepsilon$，$E[\varepsilon] = 0$，$\text{Var}(\varepsilon) = \sigma^2$ 很小。
        (a) 把 $E[u(W)]$ 在 $\mu$ 处做二阶泰勒展开，把 $u(\mu - \pi)$ 做一阶泰勒展开，由两者相等推出 $\pi \approx \frac{1}{2}A(\mu)\sigma^2$。
        (b) 为什么 $E[u(W)]$ 要展开到二阶，而 $u(\mu - \pi)$ 只需展开到一阶？
      en: |-
        Derive the risk premium approximation for small gambles. Wealth is $W = \mu + \varepsilon$ with $E[\varepsilon] = 0$ and small $\text{Var}(\varepsilon) = \sigma^2$.
        (a) Expand $E[u(W)]$ to second order and $u(\mu - \pi)$ to first order around $\mu$, and set them equal to obtain $\pi \approx \frac{1}{2}A(\mu)\sigma^2$.
        (b) Why must $E[u(W)]$ be expanded to second order while $u(\mu - \pi)$ needs only first order?
    answer:
      zh-cn: |-
        (a) $u(\mu + \varepsilon) \approx u(\mu) + u'(\mu)\,\varepsilon + \frac{1}{2}u''(\mu)\,\varepsilon^2$，取期望得 $E[u(W)] \approx u(\mu) + \frac{1}{2}u''(\mu)\,\sigma^2$；$u(\mu - \pi) \approx u(\mu) - u'(\mu)\,\pi$。两式相等：$\pi = -\frac{1}{2}\frac{u''(\mu)}{u'(\mu)}\sigma^2 = \frac{1}{2}A(\mu)\sigma^2$。
        (b) $\varepsilon$ 的一阶项期望为 0，要展开到二阶才能保留方差。$\pi$ 本身与 $\sigma^2$ 同阶，是小量；$\pi^2$ 的项与 $\sigma^4$ 同阶，相对于保留的项可以忽略。
      en: |-
        (a) $u(\mu + \varepsilon) \approx u(\mu) + u'(\mu)\,\varepsilon + \frac{1}{2}u''(\mu)\,\varepsilon^2$, so $E[u(W)] \approx u(\mu) + \frac{1}{2}u''(\mu)\,\sigma^2$; and $u(\mu - \pi) \approx u(\mu) - u'(\mu)\,\pi$. Setting them equal: $\pi = -\frac{1}{2}\frac{u''(\mu)}{u'(\mu)}\sigma^2 = \frac{1}{2}A(\mu)\sigma^2$.
        (b) The first-order term in $\varepsilon$ has zero expectation, so the expansion must go to second order to keep the variance. $\pi$ itself is of the same order as $\sigma^2$, a small quantity; terms in $\pi^2$ are of order $\sigma^4$ and negligible next to the terms kept.
    rubric:
      zh-cn:
        - "(a) 两个展开和推导正确。"
        - "(b) 说明阶数的理由。"
      en:
        - "(a) Both expansions and the derivation correct."
        - "(b) Explains the orders."

  - id: Q3
    kind: exercise
    level: B
    concepts: [crra-utility, relative-risk-aversion, certainty-equivalent]
    question:
      zh-cn: |-
        $u(W) = \frac{W^{1-\gamma}}{1-\gamma}$，相对风险厌恶系数为 $\gamma$。
        (a) 赌局使财富等概率变为 $W(1 + h)$ 或 $W(1 - h)$。证明它的确定性等价是 $W$ 乘以一个与 $W$ 无关的数，所以按比例计算的风险溢价 $\frac{\pi}{W}$ 与财富无关。
        (b) 一个财富 10 万美元和一个财富 1,000 万美元、$\gamma$ 相同的 CRRA 投资者，会把财富的多大比例投入同一种风险资产？
      en: |-
        $u(W) = \frac{W^{1-\gamma}}{1-\gamma}$, with relative risk aversion $\gamma$.
        (a) A gamble leaves wealth at $W(1 + h)$ or $W(1 - h)$ with equal probability. Show that its certainty equivalent is $W$ times a number that does not depend on $W$, so the proportional risk premium $\frac{\pi}{W}$ does not depend on wealth.
        (b) Two CRRA investors with the same $\gamma$, one with 100,000 dollars and one with 10 million dollars: what share of wealth does each put into the same risky asset?
    answer:
      zh-cn: |-
        (a) $E[u] = \frac{W^{1-\gamma}}{1-\gamma} \cdot \frac{(1+h)^{1-\gamma} + (1-h)^{1-\gamma}}{2}$。由 $u(\text{CE}) = E[u]$，$\text{CE} = W \cdot \left[\frac{(1+h)^{1-\gamma} + (1-h)^{1-\gamma}}{2}\right]^{\frac{1}{1-\gamma}}$，方括号部分与 $W$ 无关，所以 $\frac{\pi}{W} = 1 - \frac{\text{CE}}{W}$ 与 $W$ 无关。（$\gamma = 1$ 时 $\text{CE} = W\sqrt{(1+h)(1-h)}$，结论相同。）
        (b) 投资的收益是按比例的，CRRA 投资者对按比例风险的态度与财富无关，所以两人会把相同的比例投入风险资产（金额相差 100 倍）。
      en: |-
        (a) $E[u] = \frac{W^{1-\gamma}}{1-\gamma} \cdot \frac{(1+h)^{1-\gamma} + (1-h)^{1-\gamma}}{2}$. From $u(\text{CE}) = E[u]$, $\text{CE} = W \cdot \left[\frac{(1+h)^{1-\gamma} + (1-h)^{1-\gamma}}{2}\right]^{\frac{1}{1-\gamma}}$; the bracket does not depend on $W$, so $\frac{\pi}{W} = 1 - \frac{\text{CE}}{W}$ does not either. (With $\gamma = 1$, $\text{CE} = W\sqrt{(1+h)(1-h)}$, with the same conclusion.)
        (b) Investment returns are proportional, and a CRRA investor's attitude toward proportional risk does not depend on wealth, so both put the same share into the risky asset (the amounts differ by a factor of 100).
    rubric:
      zh-cn:
        - "(a) 推出 CE 与 $W$ 成比例。"
        - "(b) 相同的比例。"
      en:
        - "(a) Shows that the CE is proportional to $W$."
        - "(b) The same share."

  - id: Q4
    kind: exercise
    level: C
    star: true
    concepts: [expected-utility, crra-utility, median]
    expected: { f: "0.25", g: "0.62" }
    question:
      zh-cn: |-
        回到 [[0.4]] 的抛硬币投资：每年财富等概率乘以 1.5 或 0.6，期望每年增长 5%。一个对数效用（$u = \ln W$）的投资者把全部财富投入时，$E[\ln W]$ 反而下降（$\frac{1}{2}\ln 0.9 < 0$）。
        (a) 如果他把比例 $f$ 投入（其余持有现金、收益为 0），财富变为 $1 + 0.5f$ 或 $1 - 0.4f$ 倍。求使 $E[\ln W]$ 最大的 $f$。
        (b) 按这个 $f$ 投资，$E[\ln W]$ 每年增加多少？这与 [[0.4]] 中“中位数财富的增长”有什么关系？
      en: |-
        Return to the coin-flip investment of [[0.4]]: each year wealth is multiplied by 1.5 or 0.6 with equal probability, an expected growth of 5% a year. For an investor with log utility ($u = \ln W$), putting all wealth in actually lowers $E[\ln W]$ ($\frac{1}{2}\ln 0.9 < 0$).
        (a) If he invests a share $f$ (holding the rest in cash at 0 return), wealth is multiplied by $1 + 0.5f$ or $1 - 0.4f$. Find the $f$ that maximizes $E[\ln W]$.
        (b) Investing this share, by how much does $E[\ln W]$ rise each year? How does this relate to "the growth of median wealth" in [[0.4]]?
    answer:
      zh-cn: |-
        (a) 最大化 $\frac{1}{2}\ln(1 + 0.5f) + \frac{1}{2}\ln(1 - 0.4f)$：一阶条件 $\frac{0.5}{1 + 0.5f} = \frac{0.4}{1 - 0.4f}$，$0.5 - 0.2f = 0.4 + 0.2f$，$f = 0.25$。
        (b) $\frac{1}{2}\ln 1.125 + \frac{1}{2}\ln 0.9 \approx 0.0062$，即每年约 0.62%。$E[\ln W]$ 是对数收益率的期望，$n$ 年后中位数财富约为 $e^{n\,E[\ln]}$ 倍。对数效用投资者最大化的正是中位数财富的增长率：全部投入时中位数每年缩小（一涨一跌净 0.9），投入 25% 时中位数每年增长约 0.62%。
      en: |-
        (a) Maximize $\frac{1}{2}\ln(1 + 0.5f) + \frac{1}{2}\ln(1 - 0.4f)$: the first-order condition $\frac{0.5}{1 + 0.5f} = \frac{0.4}{1 - 0.4f}$ gives $0.5 - 0.2f = 0.4 + 0.2f$, so $f = 0.25$.
        (b) $\frac{1}{2}\ln 1.125 + \frac{1}{2}\ln 0.9 \approx 0.0062$, about 0.62% a year. $E[\ln W]$ is the expected log return, and after $n$ years median wealth is about $e^{n\,E[\ln]}$ times the start. A log-utility investor maximizes exactly the growth rate of median wealth: investing everything makes the median shrink each year (one rise and one fall net 0.9), while investing 25% makes it grow about 0.62% a year.
    rubric:
      zh-cn:
        - "(a) $f = 0.25$。"
        - "(b) 约 0.62%，并联系中位数的增长。"
      en:
        - "(a) $f = 0.25$."
        - "(b) About 0.62%, linked to median growth."

  - id: Q5
    kind: exercise
    level: B
    concepts: [risk-premium, risk-aversion, standard-error]
    expected: { sdavg: "0.044", z: "2.29" }
    question:
      zh-cn: |-
        保险公司承保一种汽车保单：每份保单有 5% 的概率赔付 20（千美元），否则赔付 0；每份的期望赔付为 1，标准差约 4.36。
        (a) 公司承保 10,000 份相互独立的保单，每份收保费 1.1。平均每份保单赔付的标准差是多少？平均赔付超过保费是均值之上几个标准差的事件？这说明保险公司为什么可以近似看作风险中性？
        (b) 如果这些汽车都在同一个城市，主要风险是一场冰雹，(a) 的结论还成立吗？
      en: |-
        An insurer writes car policies: each policy pays 20 (thousand dollars) with probability 5% and nothing otherwise; the expected payout per policy is 1 and the standard deviation about 4.36.
        (a) The insurer writes 10,000 independent policies and charges a premium of 1.1 each. What is the standard deviation of the average payout per policy? How many standard deviations above the mean is an average payout above the premium? Why can the insurer be treated as roughly risk neutral?
        (b) If all the cars are in one city and the main risk is a hailstorm, does (a) still hold?
    answer:
      zh-cn: |-
        (a) 独立时平均值的标准差为 $\frac{4.36}{\sqrt{10{,}000}} \approx 0.044$；$\frac{1.1 - 1}{0.0436} \approx 2.29$ 个标准差，概率约 1%。平均赔付几乎确定，公司面对的风险很小，可以按期望值决策，近似风险中性。
        (b) 不成立。一场冰雹会使很多保单同时赔付，保单之间高度相关，平均值的方差不会按 $\frac{1}{n}$ 下降（[[0.4]]）。这种相关的风险很难分散，保险公司要么收更高的保费，要么通过再保险把风险转移出去。
      en: |-
        (a) With independence the standard deviation of the average is $\frac{4.36}{\sqrt{10{,}000}} \approx 0.044$; $\frac{1.1 - 1}{0.0436} \approx 2.29$ standard deviations, a probability of about 1%. The average payout is nearly certain, so the insurer bears little risk and can decide by expected values: roughly risk neutral.
        (b) No. A hailstorm makes many policies pay out at once, the policies are highly correlated, and the variance of the average does not fall like $\frac{1}{n}$ ([[0.4]]). Such correlated risk is hard to diversify, so the insurer must charge more or pass the risk on through reinsurance.
    rubric:
      zh-cn:
        - "(a) 约 0.044、约 2.29 个标准差，说明近似风险中性。"
        - "(b) 不成立，指出相关性。"
      en:
        - "(a) About 0.044 and about 2.29 standard deviations; explains near risk neutrality."
        - "(b) No, pointing to correlation."

  - id: Q6
    kind: exercise
    level: B
    concepts: [crra-utility, certainty-equivalent, relative-risk-aversion]
    expected: { gamma: "1.53" }
    question:
      zh-cn: |-
        一位客户说：她觉得“确定地拥有 80 万美元”和“等概率拥有 50 万或 150 万美元”一样好。假设她的效用是 CRRA。
        (a) 她的相对风险厌恶系数 $\gamma$ 大约是多少？（可以用计算器或代码求解。）
        (b) 对数效用的人对这个赌局的确定性等价是多少？她比对数效用的人更厌恶风险还是更不厌恶风险？
      en: |-
        A client says that she finds "having 800,000 dollars for sure" as good as "having 500,000 or 1.5 million dollars with equal probability". Assume her utility is CRRA.
        (a) About what is her coefficient of relative risk aversion $\gamma$? (You may solve with a calculator or code.)
        (b) What is the certainty equivalent of this gamble for someone with log utility? Is she more or less risk averse than such a person?
    answer:
      zh-cn: |-
        (a) 以十万美元为单位，解 $\left(\frac{1}{2} \times 5^{1-\gamma} + \frac{1}{2} \times 15^{1-\gamma}\right)^{\frac{1}{1-\gamma}} = 8$（单位不影响结果，因为 CRRA 的确定性等价与财富成比例）。数值求解得 $\gamma \approx 1.53$。
        (b) 对数效用（以万美元为单位）：$\text{CE} = \sqrt{50 \times 150} \approx 86.6$，即约 86.6 万美元。她的确定性等价只有 80 万，比 86.6 万低，风险溢价更大，所以她比对数效用的人更厌恶风险（$\gamma > 1$）。
      en: |-
        (a) In units of 100,000 dollars, solve $\left(\frac{1}{2} \times 5^{1-\gamma} + \frac{1}{2} \times 15^{1-\gamma}\right)^{\frac{1}{1-\gamma}} = 8$ (the unit does not matter, because the CRRA certainty equivalent is proportional to wealth). Solving numerically gives $\gamma \approx 1.53$.
        (b) Log utility (in units of 10,000 dollars): $\text{CE} = \sqrt{50 \times 150} \approx 86.6$, about 866,000 dollars. Her certainty equivalent is only 800,000, lower than 866,000, so her risk premium is larger and she is more risk averse than a person with log utility ($\gamma > 1$).
    rubric:
      zh-cn:
        - "(a) 写出方程，$\\gamma$ 约 1.5。"
        - "(b) 对数效用的 CE 约 86.6 万美元，她更厌恶风险。"
      en:
        - "(a) Writes the equation; $\\gamma$ is about 1.5."
        - "(b) The log-utility CE is about 866,000 dollars; she is more risk averse."
