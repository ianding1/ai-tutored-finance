# Answer key for lesson 2.1. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.3]] (lesson), [[2.1#gdp]] (section), [[concept:gdp]], [[check:Q3]], [[fig:4-1]].
# expected: values are recomputed by course/verify/2.1.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "2.1"

context:
  - zh-cn: |-
      本课是宏观经济学的第一课。学习者学过复利（[[0.1]]）、替代效应（[[1.2]]）、名义与实际利率和 Fisher 方程（[[1.3]]）。讲义中的数据：美国 2025 年 GDP 约 30.8 万亿美元，消费 68%、投资 18%、政府购买 17%、净出口 −3%（BEA，2026 年 2 月初步估计）；2025 年名义 GDP 增长 5.0%、实际 GDP 增长 2.1%，PCE 价格指数上涨 2.6%、核心 PCE 2.8%（BEA）；2026 年 10 月失业率 4.1%、劳动参与率 61.9%、非农就业增加 16.5 万（BLS，2026 年 11 月 6 日）。
    en: |-
      This is the first lesson of macroeconomics. The learner has studied compounding ([[0.1]]), the substitution effect ([[1.2]]), and nominal and real interest rates and the Fisher equation ([[1.3]]). Data in the lesson: US GDP in 2025 was about 30.8 trillion dollars, with consumption 68%, investment 18%, government purchases 17% and net exports −3% (BEA, advance estimate, February 2026); in 2025 nominal GDP grew 5.0% and real GDP 2.1%, the PCE price index rose 2.6% and core PCE 2.8% (BEA); in October 2026 the unemployment rate was 4.1%, the labor force participation rate 61.9%, and nonfarm payrolls rose by 165,000 (BLS, November 6, 2026).
  - concepts: [gdp]
    zh-cn: |-
      讲义用小麦、面粉、面包的例子说明只算最终产品（100 美元）或各环节增加值之和；GDP 可用生产法、支出法、收入法计算，结果相同。不计入：二手商品、股票债券的买卖、转移支付、家务劳动。支出法 $Y = C + I + G + NX$；宏观的“投资”是购买新的资本品（含新住房和存货变化），不包括买股票；进口要减去。
    en: |-
      The lesson uses wheat, flour and bread to show that only the final product (100 dollars) counts, or equivalently the sum of value added at each stage; GDP can be computed by production, expenditure or income, with the same result. Not counted: used goods, purchases of stocks and bonds, transfer payments, household work. Expenditure approach $Y = C + I + G + NX$; "investment" in macroeconomics means buying new capital goods (including new homes and changes in inventories), not buying shares; imports are subtracted.
  - concepts: [real-gdp, gdp-deflator]
    zh-cn: |-
      讲义定义 $D = \frac{Y^n}{Y^r} \times 100$，用 Fisher 方程同样的关系说明 $1 + g^n = (1 + g^r)(1 + \pi)$（名义增长率、实际增长率、价格增长率）；季度增长率按年率公布：$1.005^4 - 1 \approx 2.0\%$；同比与年化的区别。
    en: |-
      The lesson defines $D = \frac{Y^n}{Y^r} \times 100$ and uses the same relation as the Fisher equation: $1 + g^n = (1 + g^r)(1 + \pi)$ (nominal growth, real growth, price growth); quarterly growth is reported at an annual rate: $1.005^4 - 1 \approx 2.0\%$; the difference between year-over-year and annualized growth.
  - concepts: [cpi, pce-price-index, core-inflation]
    zh-cn: |-
      CPI 例子：一篮子 10 磅咖啡、4 张电影票，基期 90 美元，现在 104 美元，上涨约 15.6%。固定篮子有替代偏差；PCE 覆盖更广、权重每期更新，通常比 CPI 低；美联储 2% 目标按 PCE 定义（2012 年起）。[[fig:4-1]]：家庭把一半收入花在 A、一半花在 B；A 涨价的滑块从 0 到 100%，步长 5，默认 40；固定篮子上涨 $0.5a$，保持同样效用的成本上涨 $\sqrt{1 + a} - 1$。讲义没有推导这个公式（留给练习题）。
    en: |-
      CPI example: a basket of 10 pounds of coffee and 4 movie tickets costs 90 dollars in the base period and 104 dollars now, a rise of about 15.6%. A fixed basket has substitution bias; PCE covers more and updates weights each period, and is usually lower than CPI; the Fed's 2% target is defined on PCE (since 2012). [[fig:4-1]]: a household spends half on A and half on B; a slider for A's price rise from 0 to 100% in steps of 5 (default 40); the fixed basket rises by $0.5a$, the cost of keeping the same utility by $\sqrt{1 + a} - 1$. The lesson does not derive this formula (left to an exercise).
  - concepts: [unemployment-rate, labor-force-participation-rate]
    zh-cn: |-
      讲义定义 $u = \frac{U}{E + U}$，$\text{LFPR} = \frac{E + U}{N}$（$N$ 为 16 岁及以上人口），说明不再找工作的人使失业率下降，劳动参与率长期下降部分源于老龄化；介绍了家庭调查和企业调查（非农就业）。
    en: |-
      The lesson defines $u = \frac{U}{E + U}$ and $\text{LFPR} = \frac{E + U}{N}$ ($N$ is the population aged 16 and over), explains that people who stop looking for work lower the unemployment rate, and that the long decline in participation is partly due to aging; it introduces the household survey and the establishment survey (nonfarm payrolls).
  - questions: [C5, Q5]
    zh-cn: |-
      讲义的“怎样读数据发布”一节：发布时间、季节调整、月度 / 年化 / 同比的区别（CPI 一个月 0.3% 年化约 3.7%）、修订，以及资产价格对数据与预期之差作出反应；好的就业报告可能因为利率预期上升而使股价下跌。
    en: |-
      The lesson's section on reading data releases: release dates, seasonal adjustment, the difference between monthly, annualized and year-over-year changes (0.3% in a month is about 3.7% annualized), revisions, and that asset prices react to the difference between the data and expectations; a strong jobs report can lower stock prices by raising expected interest rates.

common_errors:
  - questions: [C1, Q1]
    zh-cn: |-
      把买股票或二手商品算作投资或计入 GDP；或者认为进口商品会使 GDP 下降（进口在 $C$ 中加上、在 $NX$ 中减去，对 GDP 没有影响）。
    en: |-
      Counting purchases of shares or used goods as investment or as part of GDP; or thinking that buying imported goods lowers GDP (the import is added in $C$ and subtracted in $NX$, so GDP does not change).
  - questions: [C2, Q5]
    zh-cn: |-
      把名义增长当作实际增长，或者把季度增长率直接当作年增长率（或直接乘以 4 而不按复利计算）。
    en: |-
      Treating nominal growth as real growth, or taking a quarterly growth rate as a yearly one (or multiplying by 4 instead of compounding).
  - questions: [C3, Q3]
    zh-cn: |-
      认为固定篮子的价格指数准确反映生活成本；忽略了涨价后人们会少买贵的、多买便宜的东西。
    en: |-
      Thinking that a fixed-basket price index measures the cost of living exactly, ignoring that people buy less of what has become dearer and more of what is cheaper.
  - questions: [C4, Q4]
    zh-cn: |-
      用全部人口而不是劳动力作为失业率的分母；或者认为失业率下降一定说明就业改善。
    en: |-
      Using the whole population instead of the labor force as the denominator of the unemployment rate; or thinking that a falling unemployment rate always means more people have jobs.
  - questions: [Q2]
    zh-cn: |-
      把各个环节的销售额相加，重复计算了中间产品。GDP 只算最终产品，或者各环节的增加值之和。
    en: |-
      Adding up the sales of every stage and so counting intermediate goods several times. GDP counts only final goods, or equivalently the sum of value added at each stage.
  - questions: [C5]
    zh-cn: |-
      认为好的经济数据一定使股价上涨。价格反映的是数据与预期之差，以及它对利率预期的影响。
    en: |-
      Thinking that good economic data must raise stock prices. Prices react to the difference from expectations and to the effect on expected interest rates.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: expenditure
    concepts: [gdp]
    question:
      zh-cn: |-
        今年企业多生产了价值 50 的产品，但没有卖出去，留在仓库里。今年的 GDP：
      en: |-
        This year firms produce an extra 50 worth of goods that are not sold and stay in the warehouse. This year's GDP:
    choices:
      - zh-cn: 增加 50，记在投资（存货的增加）中
        en: Rises by 50, recorded in investment (the change in inventories)
      - zh-cn: 不变，因为产品没有卖出去
        en: Does not change, because the goods were not sold
        why:
          zh-cn: GDP 衡量的是一年内生产了什么，还是卖出了什么？
          en: Does GDP measure what was produced in the year, or what was sold?
      - zh-cn: 增加 50，记在消费中
        en: Rises by 50, recorded in consumption
        why:
          zh-cn: 还没有家庭买这些产品。它们属于谁，在支出法里应该算作哪一项？
          en: No household has bought these goods yet. Who holds them, and under which item of the expenditure approach do they belong?
      - zh-cn: 等到明年卖出时才计入 GDP
        en: Is counted only next year, when the goods are sold
        why:
          zh-cn: 产品是今年生产的。明年卖出时，存货减少，明年的 GDP 会再算一次吗？
          en: The goods were produced this year. When they are sold next year and inventories fall, does next year's GDP count them again?
    correct: A
    answer:
      zh-cn: |-
        (A)。GDP 衡量的是一定时期内生产的最终产品，不是销售。没有卖出的产品是企业存货的增加，记在投资中，所以今年的 GDP 增加 50。明年卖出时，消费增加、存货减少，两者抵消，不会重复计算。
      en: |-
        (A). GDP measures final goods produced in a period, not sales. Unsold goods are an increase in firms' inventories and are recorded in investment, so this year's GDP rises by 50. When they are sold next year, consumption rises and inventories fall by the same amount, so they are not counted twice.

  - id: C2
    kind: check
    section: real-gdp
    concepts: [real-gdp, gdp-deflator]
    question:
      zh-cn: |-
        一个国家的名义 GDP 一年增长了 26%，这说明它生产的商品和服务增加了约 26%。
      en: |-
        A country's nominal GDP grew 26% in a year, which means it produced about 26% more goods and services.
    correct: false
    hint:
      zh-cn: 名义 GDP 是按哪一年的价格计算的？如果所有价格都上涨了，名义 GDP 会怎样变化？
      en: At which year's prices is nominal GDP measured? If all prices rose, what would happen to nominal GDP?
    answer:
      zh-cn: |-
        错。名义 GDP 按当年价格计算，它的增长包括产量的增长和价格的上涨。要看生产了多少，要用实际 GDP（按基年价格计算）。例如讲义的苹果和橙子经济中，名义 GDP 增长 26%，实际 GDP 只增长 5%，其余来自价格上涨 20%：$1.05 \times 1.20 = 1.26$。
      en: |-
        False. Nominal GDP uses each year's prices, so its growth includes both more output and higher prices. To see how much was produced, use real GDP (at base-year prices). In an apples-and-oranges economy, for example, nominal GDP can grow 26% while real GDP grows only 5%, with the rest from a 20% rise in prices: $1.05 \times 1.20 = 1.26$.

  - id: C3
    kind: check
    section: price-indexes
    concepts: [cpi, substitution-effect]
    widget: { id: substitution-bias, set: { a: 60 } }
    question:
      zh-cn: |-
        在 [[fig:4-1]] 中提高 A 的涨幅。与固定篮子的成本相比，保持同样效用所需的成本：
      en: |-
        In [[fig:4-1]], raise the price increase of A. Compared with the cost of the fixed basket, the cost of keeping the same utility:
    choices:
      - zh-cn: 上涨得更少，而且 A 涨得越多，两者差距越大
        en: Rises less, and the more A's price rises, the larger the gap
      - zh-cn: 上涨得一样多，因为家庭的收入一半花在 A 上
        en: Rises by the same amount, because the household spends half its income on A
        why:
          zh-cn: A 变贵后，家庭还会买和原来一样多的 A 吗？
          en: After A gets dearer, does the household still buy as much A as before?
      - zh-cn: 上涨得更多，因为家庭被迫改买不喜欢的 B
        en: Rises more, because the household is forced to buy B, which it likes less
        why:
          zh-cn: 家庭转向 B 是被迫的，还是因为这样能用更少的钱得到同样的满足？如果原来的篮子更好，它还可以照买吗？
          en: Does the household switch to B because it must, or because it reaches the same satisfaction for less money? Could it still buy the old basket if that were better?
      - zh-cn: 不变，因为 B 的价格没有变
        en: Does not change, because B's price is unchanged
        why:
          zh-cn: 家庭原来也买 A。A 涨价后，即使改买更多 B，花费会完全不变吗？
          en: The household also bought A before. After A's price rises, can it keep its spending exactly the same even by buying more B?
    correct: A
    answer:
      zh-cn: |-
        (A)。A 变贵后，家庭少买 A、多买相对便宜的 B，达到原来的满足程度所需的花费比固定篮子少。固定篮子假设购买量不变，忽略了这种替代，所以高估了生活成本的上涨。A 涨得越多，替代越多，高估越大。原来的篮子仍然买得起，所以保持同样效用的成本不会比固定篮子更高。
      en: |-
        (A). After A gets dearer, the household buys less A and more of the relatively cheaper B, reaching its old satisfaction for less than the fixed basket costs. The fixed basket assumes unchanged quantities and ignores this substitution, so it overstates the rise in the cost of living. The more A's price rises, the more substitution and the larger the overstatement. The old basket remains affordable, so keeping the same utility never costs more than the fixed basket.

  - id: C4
    kind: check
    section: labor-market
    concepts: [unemployment-rate, labor-force-participation-rate]
    question:
      zh-cn: |-
        一个国家的失业率下降了，说明有更多的人找到了工作。
      en: |-
        A country's unemployment rate fell, so more people have found jobs.
    correct: false
    hint:
      zh-cn: 失业率的分母是什么？一个失业者不再找工作时，他还算在劳动力里吗？
      en: What is the denominator of the unemployment rate? When an unemployed person stops looking for work, is he still in the labor force?
    answer:
      zh-cn: |-
        错。失业率是失业人数除以劳动力（就业加上正在找工作的人）。失业者放弃找工作后退出劳动力，失业人数和劳动力都减少，失业率下降，但就业人数没有变。所以还要同时看就业人数和劳动参与率。
      en: |-
        False. The unemployment rate is the number unemployed divided by the labor force (the employed plus those looking for work). When unemployed people give up looking, they leave the labor force; the number unemployed and the labor force both shrink and the rate falls, but employment is unchanged. So employment and the participation rate must be looked at as well.

  - id: C5
    kind: check
    section: data-releases
    concepts: [unemployment-rate]
    question:
      zh-cn: |-
        某月就业报告公布前，分析师的一致预期是非农就业增加 10 万人。实际增加 16.5 万人，失业率下降。当天股价指数下跌，10 年期国债收益率上升。最可能的原因是：
      en: |-
        Before a monthly jobs report, analysts expect payrolls to rise by 100 thousand. The actual rise is 165 thousand, and unemployment falls. That day the stock index falls and the 10-year Treasury yield rises. The most likely reason:
    choices:
      - zh-cn: 市场预期央行会让利率在较高水平保持更久，未来现金流的折现率上升
        en: The market expects the central bank to keep rates high for longer, so future cash flows are discounted at a higher rate
      - zh-cn: 就业增加使企业的工资成本上升，利润一定下降
        en: More jobs raise firms' wage costs, so profits must fall
        why:
          zh-cn: 就业强通常意味着需求也强。为什么国债收益率也同时上升了？
          en: Strong hiring usually also means strong demand. Why did the Treasury yield rise at the same time?
      - zh-cn: 市场不理性，好消息本来应该让股价上涨
        en: The market is irrational; good news should make stock prices rise
        why:
          zh-cn: 价格在公布前已经反映了什么？市场对数据作出反应，是对数据本身，还是对它与预期之差及其影响？
          en: What did prices already reflect before the release? Does the market react to the number itself, or to its surprise and what that implies?
      - zh-cn: 公布的数据有错误，市场不相信它
        en: The data are wrong and the market does not believe them
        why:
          zh-cn: 如果市场不相信数据，价格还会有这样一致的反应吗？
          en: If the market did not believe the data, would prices react in such a consistent way?
    correct: A
    answer:
      zh-cn: |-
        (A)。价格已经反映了预期，市场对的是“意外”作出反应。就业比预期强，投资者预期经济更热、通胀压力更大，央行更可能维持较高的利率或推迟降息，所以收益率上升。更高的利率使未来现金流的现值下降，也提高了债券相对股票的吸引力，股价可能因此下跌，即使企业盈利前景略有改善。
      en: |-
        (A). Prices already reflect expectations; the market reacts to the surprise. Stronger hiring than expected makes investors expect a hotter economy and more inflation pressure, so the central bank is more likely to keep rates high or delay cuts, and yields rise. Higher rates lower the present value of future cash flows and make bonds more attractive relative to stocks, so stock prices can fall even if earnings prospects improve a little.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [gdp]
    question:
      zh-cn: |-
        判断下面每一项是否计入美国当年的 GDP；如果计入，记在支出法的哪一项。
        (a) 一个人买了 100 股苹果公司的股票。
        (b) 一位退休者领到社会保障金。
        (c) 一辆在美国肯塔基州工厂生产的丰田汽车卖给美国家庭。
        (d) 美国家庭买了一部在中国组装的手机。
      en: |-
        For each item, say whether it counts in US GDP for the year and, if so, under which expenditure component.
        (a) Someone buys 100 shares of Apple stock.
        (b) A retiree receives a Social Security payment.
        (c) A Toyota built at a factory in Kentucky is sold to a US household.
        (d) A US household buys a phone assembled in China.
    answer:
      zh-cn: |-
        (a) 不计入：只是资产换手。（券商的佣金是一项服务，计入消费。）
        (b) 不计入：转移支付，没有交换产品或服务。退休者用它购买的东西会计入消费。
        (c) 计入，消费：GDP 按生产地点计算，与公司的国籍无关。
        (d) 对 GDP 没有影响：消费增加，进口同样增加。
      en: |-
        (a) Not counted: assets just change hands. (The broker's commission is a service and counts in consumption.)
        (b) Not counted: a transfer payment, with no good or service exchanged. What the retiree buys with it counts in consumption.
        (c) Counted, in consumption: GDP is based on where things are produced, not the company's nationality.
        (d) No effect on GDP: consumption rises and imports rise by the same amount.
    rubric:
      zh-cn:
        - "四项判断和理由正确。"
      en:
        - "All four items correct, with reasons."

  - id: Q2
    kind: exercise
    level: B
    concepts: [gdp]
    expected: { gdp: "900" }
    question:
      zh-cn: |-
        一个经济只有三家企业。矿山开采铁矿石卖给钢厂，得 200（工资 150，利润 50）；钢厂炼钢卖给汽车厂，得 500（买矿石 200，工资 200，利润 100）；汽车厂造车卖给家庭，得 900（买钢 500，工资 250，利润 150）。分别用支出法、生产法（增加值）和收入法计算 GDP，并说明为什么三种方法的结果相同。
      en: |-
        An economy has only three firms. A mine sells iron ore to a steel mill for 200 (wages 150, profit 50); the steel mill sells steel to a car maker for 500 (ore bought 200, wages 200, profit 100); the car maker sells cars to households for 900 (steel bought 500, wages 250, profit 150). Compute GDP by the expenditure, production (value added) and income approaches, and explain why the three give the same result.
    answer:
      zh-cn: |-
        支出法：最终产品只有卖给家庭的汽车，900。
        生产法：增加值 $200 + (500 - 200) + (900 - 500) = 200 + 300 + 400 = 900$。
        收入法：工资 $150 + 200 + 250 = 600$，利润 $50 + 100 + 150 = 300$，合计 900。
        每家企业的增加值等于它付出的工资加上利润；所有增加值加起来就是最终产品的价值。最终支出的每一美元，都在生产的某个环节成为某人的收入，所以三种方法的结果相同。
      en: |-
        Expenditure: the only final product is the cars sold to households, 900.
        Production: value added $200 + (500 - 200) + (900 - 500) = 200 + 300 + 400 = 900$.
        Income: wages $150 + 200 + 250 = 600$, profits $50 + 100 + 150 = 300$, a total of 900.
        Each firm's value added equals the wages it pays plus its profit, and all the value added together is the value of the final product. Every dollar of final spending becomes someone's income at some stage of production, so the three approaches agree.
    rubric:
      zh-cn:
        - "三种方法都得到 900，计算正确。"
        - "解释增加值 = 工资 + 利润，最终支出成为收入。"
      en:
        - "All three approaches give 900, computed correctly."
        - "Explains that value added = wages + profit and that final spending becomes income."

  - id: Q3
    kind: exercise
    level: B
    star: true
    concepts: [cpi, substitution-effect, utility-function]
    question:
      zh-cn: |-
        一个家庭的效用为 $U = \sqrt{xy}$，收入为 $M$，两种商品的价格为 $p_A$、$p_B$；由 [[1.2]]，最优选择是 $x = \frac{M}{2p_A}$，$y = \frac{M}{2p_B}$。
        (a) 证明：达到效用 $\bar U$ 所需的最少支出是 $2\bar U\sqrt{p_A p_B}$。
        (b) 由此证明：$p_A$ 上涨 $a$、$p_B$ 不变时，保持原来效用的成本上涨 $\sqrt{1 + a} - 1$，而固定篮子的成本上涨 $\frac{a}{2}$。为什么前者总是不大于后者？
      en: |-
        A household has utility $U = \sqrt{xy}$, income $M$, and prices $p_A$, $p_B$; by [[1.2]], the optimal choice is $x = \frac{M}{2p_A}$ and $y = \frac{M}{2p_B}$.
        (a) Show that the least spending needed to reach utility $\bar U$ is $2\bar U\sqrt{p_A p_B}$.
        (b) Hence show that when $p_A$ rises by $a$ and $p_B$ is unchanged, the cost of keeping the original utility rises by $\sqrt{1 + a} - 1$, while the fixed basket's cost rises by $\frac{a}{2}$. Why is the first never larger than the second?
    answer:
      zh-cn: |-
        (a) $U^* = \sqrt{\frac{M}{2p_A} \cdot \frac{M}{2p_B}} = \frac{M}{2\sqrt{p_A p_B}}$。要使 $U^* = \bar U$，需要 $M = 2\bar U\sqrt{p_A p_B}$；支出更少时最大效用低于 $\bar U$。
        (b) 新成本与原成本之比为 $\sqrt{1 + a}$。原来的篮子中两种商品的支出各占一半，A 涨 $a$，篮子成本涨 $\frac{a}{2}$。原来的篮子在新价格下仍然能达到原来的效用，所以最少成本不会超过它；家庭还可以改买更多 B，所以通常更低（例如 $a = 44\%$ 时为 20% 对 22%）。
      en: |-
        (a) $U^* = \sqrt{\frac{M}{2p_A} \cdot \frac{M}{2p_B}} = \frac{M}{2\sqrt{p_A p_B}}$. For $U^* = \bar U$, we need $M = 2\bar U\sqrt{p_A p_B}$; with less spending, maximum utility is below $\bar U$.
        (b) The ratio of new to old cost is $\sqrt{1 + a}$. In the original basket each good takes half of spending, so a rise of $a$ in A's price raises the basket's cost by $\frac{a}{2}$. The original basket still reaches the original utility at the new prices, so the least cost cannot exceed it; the household can also switch toward B, so it is usually lower (for example, 20% against 22% when $a = 44\%$).
    rubric:
      zh-cn:
        - "(a) 推导正确。"
        - "(b) 两个涨幅正确，并说明为什么不会更大。"
      en:
        - "(a) Correct derivation."
        - "(b) Both increases correct, with the reason the first is never larger."

  - id: Q4
    kind: exercise
    level: B
    concepts: [labor-force-participation-rate]
    expected: { before: "72", after: "68" }
    question:
      zh-cn: |-
        把 16 岁及以上的人口分成两组：65 岁以下的劳动参与率是 80%，65 岁及以上的是 40%，两组的参与率都不变。
        (a) 65 岁及以上的人占 16 岁及以上人口的比例从 20% 上升到 30% 时，总的劳动参与率从多少变为多少？
        (b) 一位评论员看到总参与率下降，说“人们越来越不愿意工作了”。评价这个说法。
      en: |-
        Split the population aged 16 and over into two groups: participation is 80% for those under 65 and 40% for those 65 and over, and neither changes.
        (a) If the share of people 65 and over rises from 20% to 30% of the population aged 16 and over, how does total participation change?
        (b) A commentator sees total participation falling and says "people are less and less willing to work". Evaluate this claim.
    answer:
      zh-cn: |-
        (a) $0.8 \times 80\% + 0.2 \times 40\% = 72\%$ 降到 $0.7 \times 80\% + 0.3 \times 40\% = 68\%$。
        (b) 两组的参与率都没有变，总参与率下降 4 个百分点完全来自人口结构：退休年龄的人越来越多。这个说法把结构变化误当成了行为变化。判断工作意愿，要看同一年龄组的参与率（例如 25–54 岁）。
      en: |-
        (a) From $0.8 \times 80\% + 0.2 \times 40\% = 72\%$ to $0.7 \times 80\% + 0.3 \times 40\% = 68\%$.
        (b) Neither group's participation changed; the 4-point fall comes entirely from the population mix, with more people of retirement age. The claim mistakes a change in composition for a change in behavior. To judge willingness to work, look at participation within an age group (for example, ages 25–54).
    rubric:
      zh-cn:
        - "(a) 72% 降到 68%。"
        - "(b) 指出是结构变化。"
      en:
        - "(a) From 72% to 68%."
        - "(b) Identifies a change in composition."

  - id: Q5
    kind: exercise
    level: C
    concepts: [real-gdp, compound-interest]
    expected: { ann: "-0.4", yoy: "1.41" }
    question:
      zh-cn: |-
        某国四个季度的实际 GDP 环比增长率（未年化）依次是 0.2%、0.8%、0.5%、−0.1%。
        (a) 第四季度公布的年化增长率是多少？比去年同期增长了多少？
        (b) 两家媒体的标题分别是“经济萎缩”和“经济过去一年增长 1.4%”。两者都对吗？它们回答的是什么不同的问题？
      en: |-
        A country's real GDP grows quarter on quarter (not annualized) by 0.2%, 0.8%, 0.5% and −0.1% in four successive quarters.
        (a) What annualized growth rate is reported for the fourth quarter? How much has GDP grown from the same quarter a year earlier?
        (b) Two headlines say "economy shrinks" and "economy grew 1.4% over the past year". Are both right? What different questions do they answer?
    answer:
      zh-cn: |-
        (a) 年化 $0.999^4 - 1 \approx -0.4\%$；同比 $1.002 \times 1.008 \times 1.005 \times 0.999 - 1 \approx 1.41\%$。
        (b) 都对。年化的季度增长率回答“最近一个季度的势头如何”，最新一个季度略有萎缩；同比增长率回答“和一年前相比如何”，前几个季度的增长使它仍为正。一个季度的负增长还不能说明经济进入衰退，初步数据也可能被修订。
      en: |-
        (a) Annualized $0.999^4 - 1 \approx -0.4\%$; year over year $1.002 \times 1.008 \times 1.005 \times 0.999 - 1 \approx 1.41\%$.
        (b) Both are right. The annualized quarterly rate answers "what is the latest momentum?", and the latest quarter shrank slightly; the year-over-year rate answers "how does it compare with a year ago?", and growth in earlier quarters keeps it positive. One negative quarter does not mean a recession, and first estimates may be revised.
    rubric:
      zh-cn:
        - "(a) 约 −0.4% 和 1.41%（写作 - 或 − 均可）。"
        - "(b) 说明两者回答的问题不同。"
      en:
        - "(a) About −0.4% and 1.41% (written with - or −)."
        - "(b) Explains the different questions."
