# Answer key for lesson 1.6. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.2]] (lesson), [[1.6#cournot]] (section), [[concept:monopoly]], [[check:Q4]], [[fig:3-1]].
# expected: values are recomputed by course/verify/1.6.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "1.6"

context:
  - zh-cn: |-
      学习者学过利润最大化 $MR = MC$（[[0.2]]）、需求价格弹性（[[1.1]]）、完全竞争、规模报酬、经济利润和长期均衡（[[1.5]]）。还没有学博弈论（纳什均衡、囚徒困境，[[1.7]]）和消费者剩余、无谓损失（[[1.8]]）。
    en: |-
      The learner has studied profit maximization $MR = MC$ ([[0.2]]), the price elasticity of demand ([[1.1]]), and perfect competition, returns to scale, economic profit and long-run equilibrium ([[1.5]]). The learner has not yet studied game theory (Nash equilibrium, the prisoner's dilemma, [[1.7]]) or consumer surplus and deadweight loss ([[1.8]]).
  - concepts: [monopoly, lerner-index, price-discrimination]
    zh-cn: |-
      讲义推导了 $MR = P + Q\frac{dP}{dQ}$、线性需求 $P = a - bQ$ 时 $MR = a - 2bQ$、$MR = P\left(1 - \frac{1}{|\varepsilon|}\right)$ 和勒纳指数 $\frac{P - MC}{P} = \frac{1}{|\varepsilon|}$。例：$P = 100 - Q$，$MC = 20$，垄断产量 40、价格 60、利润 1600。讲义没有说明垄断者在需求曲线的哪一段生产（留给练习题）。价格歧视分一、二、三级；三级价格歧视在每个市场令 $MR_i = MC$。
    en: |-
      The lesson derives $MR = P + Q\frac{dP}{dQ}$, $MR = a - 2bQ$ for linear demand $P = a - bQ$, $MR = P\left(1 - \frac{1}{|\varepsilon|}\right)$ and the Lerner index $\frac{P - MC}{P} = \frac{1}{|\varepsilon|}$. Example: $P = 100 - Q$ and $MC = 20$ give monopoly output 40, price 60 and profit 1600. The lesson does not say on which part of the demand curve a monopolist produces (left to an exercise). Price discrimination is first, second or third degree; under third-degree discrimination the firm sets $MR_i = MC$ in each market.
  - concepts: [oligopoly, cournot-model, bertrand-model]
    zh-cn: |-
      讲义推导了两个厂商的古诺反应函数 $q_1 = \frac{a - c - b\,q_2}{2b}$ 和对称均衡 $q = \frac{a - c}{3b}$，但没有给出 $n$ 个厂商的一般公式（留给练习题）。[[fig:3-1]]：需求 $P = 100 - Q$，边际成本 20，厂商数目滑块从 1 到 20，默认 2，读数显示每家产量、总产量、价格和行业总利润。伯特兰模型：产品相同、成本相同时，两个厂商的价格都等于边际成本（伯特兰悖论）；讲义没有讨论成本不同的情形。
    en: |-
      The lesson derives the two-firm Cournot reaction function $q_1 = \frac{a - c - b\,q_2}{2b}$ and the symmetric equilibrium $q = \frac{a - c}{3b}$, but does not give the general formula for $n$ firms (left to an exercise). [[fig:3-1]]: demand $P = 100 - Q$, marginal cost 20, a slider for the number of firms from 1 to 20 (default 2); the readout shows output per firm, total output, the price and total industry profit. Bertrand model: with identical products and equal costs, both firms set the price equal to marginal cost (the Bertrand paradox); the lesson does not discuss unequal costs.
  - concepts: [monopolistic-competition, barriers-to-entry, economic-moat, natural-monopoly]
    zh-cn: |-
      垄断竞争：产品有差别、可以自由进入，短期可有利润，长期价格等于平均成本、经济利润为 0。进入壁垒的来源：规模经济（自然垄断）、网络效应、转换成本、无形资产（品牌、专利、牌照）、成本优势。护城河是使经济利润长期为正的持久竞争优势；讲义提醒护城河会变窄，且有护城河的企业不一定是好的投资（价格可能已经反映）。
    en: |-
      Monopolistic competition: differentiated products and free entry; profit is possible in the short run, but in the long run the price equals average cost and economic profit is 0. Sources of barriers to entry: economies of scale (natural monopoly), network effects, switching costs, intangible assets (brands, patents, licenses) and cost advantages. A moat is a durable competitive advantage that keeps economic profit positive for a long time; the lesson notes that moats can narrow and that a firm with a moat is not necessarily a good investment (the price may already reflect it).

common_errors:
  - questions: [C1, Q6]
    zh-cn: |-
      垄断者令 $P = MC$，或者求出 $MR = MC$ 的产量后用 MC 或 MR 而不是需求曲线来定价。
    en: |-
      Having the monopolist set $P = MC$, or, after finding the output where $MR = MC$, reading the price from MC or MR instead of from the demand curve.
  - questions: [C1, C2]
    zh-cn: |-
      对线性需求 $P = a - bQ$，把 MR 的斜率写成 $-b$ 而不是 $-2b$；或者需求写成 $Q = \ldots - kP$ 时没有先改写成 $P$ 的形式。
    en: |-
      For linear demand $P = a - bQ$, writing the slope of MR as $-b$ instead of $-2b$, or not first rewriting demand of the form $Q = \ldots - kP$ in terms of $P$.
  - questions: [Q4]
    zh-cn: |-
      统一定价时把两个市场的需求直接相加，忽略了价格超过 30 时市场 B 的需求为 0（总需求曲线有折点）。
    en: |-
      Under uniform pricing, adding the two demand curves directly and ignoring that demand in market B is 0 when the price is above 30 (the total demand curve has a kink).

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: monopoly
    concepts: [monopoly, lerner-index]
    expected: { p: "80", lerner: "0.5" }
    question:
      zh-cn: |-
        垄断者面对需求 $P = 120 - 2Q$，边际成本恒为 40。利润最大的价格和这时的勒纳指数是多少？用这一点的需求弹性验证 $\frac{P - MC}{P} = \frac{1}{|\varepsilon|}$。
      en: |-
        A monopolist faces demand $P = 120 - 2Q$ with a constant marginal cost of 40. What are the profit-maximizing price and the Lerner index there? Check $\frac{P - MC}{P} = \frac{1}{|\varepsilon|}$ with the demand elasticity at that point.
    answer:
      zh-cn: |-
        $MR = 120 - 4Q = 40$，$Q = 20$，$P = 80$。勒纳指数 $\frac{80 - 40}{80} = 0.5$。
        $Q = 60 - \frac{P}{2}$，$|\varepsilon| = \frac12 \times \frac{80}{20} = 2$，$\frac{1}{|\varepsilon|} = 0.5$，相符。
      en: |-
        $MR = 120 - 4Q = 40$ gives $Q = 20$ and $P = 80$. The Lerner index is $\frac{80 - 40}{80} = 0.5$.
        $Q = 60 - \frac{P}{2}$, so $|\varepsilon| = \frac12 \times \frac{80}{20} = 2$ and $\frac{1}{|\varepsilon|} = 0.5$, which matches.
    rubric:
      zh-cn:
        - "价格 80、勒纳指数 0.5。"
        - "弹性 2，验证相符。"
      en:
        - "Price 80, Lerner index 0.5."
        - "Elasticity 2; the check matches."

  - id: C2
    kind: check
    section: price-discrimination
    concepts: [price-discrimination, lerner-index]
    expected: { pa: "55", pb: "20" }
    question:
      zh-cn: |-
        一个厂商能把买者分成两组并防止转卖，边际成本恒为 10。A 组需求 $Q_A = 100 - P_A$，B 组需求 $Q_B = 60 - 2P_B$。两组的价格各是多少？为什么 A 组的价格更高？
      en: |-
        A firm can split buyers into two groups and prevent resale; marginal cost is a constant 10. Group A has demand $Q_A = 100 - P_A$ and group B $Q_B = 60 - 2P_B$. What price does each group pay? Why is group A's price higher?
    answer:
      zh-cn: |-
        A 组：$MR_A = 100 - 2Q_A = 10$，$Q_A = 45$，$P_A = 55$。B 组：$P_B = 30 - \frac{Q_B}{2}$，$MR_B = 30 - Q_B = 10$，$Q_B = 20$，$P_B = 20$。
        在各自的价格处，A 组的需求弹性约 $1 \times \frac{55}{45} \approx 1.22$，B 组为 $2 \times \frac{20}{20} = 2$。A 组更缺乏弹性，按勒纳指数 $\frac{1}{|\varepsilon|}$ 加价更多。
      en: |-
        Group A: $MR_A = 100 - 2Q_A = 10$ gives $Q_A = 45$ and $P_A = 55$. Group B: $P_B = 30 - \frac{Q_B}{2}$, $MR_B = 30 - Q_B = 10$ gives $Q_B = 20$ and $P_B = 20$.
        At these prices, group A's elasticity is about $1 \times \frac{55}{45} \approx 1.22$ and group B's $2 \times \frac{20}{20} = 2$. Group A is less elastic, so by the Lerner index $\frac{1}{|\varepsilon|}$ it gets a higher markup.
    rubric:
      zh-cn:
        - "$P_A = 55$、$P_B = 20$。"
        - "用弹性和勒纳指数解释。"
      en:
        - "$P_A = 55$, $P_B = 20$."
        - "Explains with elasticity and the Lerner index."

  - id: C3
    kind: check
    section: cournot
    concepts: [cournot-model, oligopoly, monopoly]
    widget: { id: cournot, set: { n: 10 } }
    expected: { p1: "60", p10: "27.27" }
    question:
      zh-cn: |-
        在 [[fig:3-1]] 中，厂商数目为 1 和 10 时，价格各是多少？厂商越来越多时，价格和总产量趋向什么？
      en: |-
        In [[fig:3-1]], what is the price with 1 firm and with 10 firms? As the number of firms grows, what do the price and total output approach?
    answer:
      zh-cn: |-
        1 家：价格 60，就是垄断。10 家：价格 27.27。
        厂商越多，价格越低、总产量越高，趋向完全竞争的结果：价格等于边际成本 20，总产量 80，行业总利润趋向 0。
      en: |-
        1 firm: price 60, the monopoly outcome. 10 firms: price 27.27.
        The more firms, the lower the price and the higher total output, approaching the perfectly competitive outcome: price equal to marginal cost, 20, total output 80, and industry profit near 0.
    rubric:
      zh-cn:
        - "价格 60 和 27.27。"
        - "趋向价格 20、产量 80。"
      en:
        - "Prices 60 and 27.27."
        - "Approaches price 20 and output 80."

  - id: C4
    kind: check
    section: bertrand
    concepts: [bertrand-model]
    expected: { price: "120" }
    question:
      zh-cn: |-
        两家航空公司在同一条航线上按伯特兰模型竞争，服务相同。甲公司每位乘客的边际成本是 100 美元，乙公司是 120 美元。均衡价格大约是多少？谁得到乘客？各自的利润如何？
      en: |-
        Two airlines compete on the same route as in the Bertrand model, with identical service. Airline A's marginal cost per passenger is 100 dollars and airline B's is 120 dollars. About what is the equilibrium price? Who gets the passengers? What are their profits?
    answer:
      zh-cn: |-
        价格约为 120 美元（略低于乙的成本）。乙不会把价格定在 120 以下，否则每位乘客都亏损；甲只要定价略低于 120，就能得到全部乘客，而定得更低只会减少利润。所以甲得到全部乘客，每位乘客赚约 20 美元；乙没有乘客，利润为 0。
        成本较低的一方赚到的是成本差，而不是垄断利润：乙的存在限制了甲的定价。
      en: |-
        The price is about 120 dollars (just below B's cost). B will not price below 120, since it would lose money on every passenger; A gets all the passengers by pricing just below 120, and pricing any lower would only reduce its profit. So A gets all the passengers and earns about 20 dollars per passenger; B has no passengers and zero profit.
        The lower-cost firm earns the cost difference, not a monopoly profit: B's presence limits A's price.
    rubric:
      zh-cn:
        - "价格约 120（略低于高成本方的成本）。"
        - "甲得到全部乘客，每人赚约 20；乙利润为 0。"
      en:
        - "Price about 120 (just below the higher cost)."
        - "A gets all passengers and earns about 20 each; B earns 0."

  - id: C5
    kind: check
    section: moats
    concepts: [barriers-to-entry, economic-moat, monopolistic-competition]
    question:
      zh-cn: |-
        下面三家企业目前都有正的经济利润。分别判断它们主要依靠哪种进入壁垒，或者没有明显的壁垒；哪一家的利润最可能被竞争消除？
        (a) 一个支付网络：商户接受它，是因为很多消费者使用它；消费者使用它，是因为很多商户接受它。
        (b) 一家为大企业提供财务核算软件的公司，客户更换系统需要迁移多年的数据并重新培训员工。
        (c) 一家很受欢迎的新式茶饮店，所在城市有数百家茶饮店，开一家新店的成本不高。
      en: |-
        Each of the three firms below currently earns a positive economic profit. For each, decide which barrier to entry it mainly relies on, or whether it has no clear barrier. Whose profit is most likely to be competed away?
        (a) A payment network: merchants accept it because many consumers use it, and consumers use it because many merchants accept it.
        (b) A company that sells accounting software to large firms; a customer that changes systems must migrate years of data and retrain its staff.
        (c) A very popular new-style tea shop in a city with hundreds of tea shops, where opening a new shop is not expensive.
    answer:
      zh-cn: |-
        (a) 网络效应：新的支付网络既没有商户也没有消费者，很难起步。
        (b) 转换成本：即使竞争者的软件更便宜，客户换用的代价也很高。
        (c) 没有明显的壁垒，属于垄断竞争：产品有特色，但别人很容易模仿配方和风格开新店。它的利润最可能被竞争消除，长期趋向 0。
      en: |-
        (a) Network effects: a new payment network has neither merchants nor consumers and finds it hard to get started.
        (b) Switching costs: even if a competitor's software is cheaper, changing is expensive for the customer.
        (c) No clear barrier; this is monopolistic competition: the product is distinctive, but others can easily copy the recipes and style and open new shops. Its profit is the most likely to be competed away, toward 0 in the long run.
    rubric:
      zh-cn:
        - "(a) 网络效应；(b) 转换成本。"
        - "(c) 没有明显壁垒（垄断竞争），利润最可能消失。"
      en:
        - "(a) Network effects; (b) switching costs."
        - "(c) No clear barrier (monopolistic competition); its profit is the most likely to disappear."

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [monopoly, lerner-index, price-elasticity]
    question:
      zh-cn: |-
        (a) 证明：边际成本为正时，利润最大的垄断者一定在需求富有弹性（$|\varepsilon| > 1$）的部分生产。
        (b) 一家垄断企业的经理说：“我们的需求缺乏弹性，涨价 10% 销量只下降 3%。”如果这是真的，企业应该怎么做？为什么？
      en: |-
        (a) Show that when marginal cost is positive, a profit-maximizing monopolist always produces where demand is elastic ($|\varepsilon| > 1$).
        (b) A manager of a monopoly says: "Our demand is inelastic: a 10% price increase lowers sales by only 3%." If this is true, what should the firm do, and why?
    answer:
      zh-cn: |-
        (a) 最优点 $MR = MC > 0$。$MR = P\left(1 - \frac{1}{|\varepsilon|}\right) > 0$ 要求 $\frac{1}{|\varepsilon|} < 1$，即 $|\varepsilon| > 1$。在缺乏弹性的部分，MR 为负，减少产量反而增加收入。
        (b) 应该涨价。弹性约 0.3 < 1，涨价使收入增加（价格上升的比例大于销量下降的比例），同时销量减少使成本下降，利润一定增加。应一直涨价到需求变得富有弹性、满足 $MR = MC$ 为止。所以“需求缺乏弹性”不可能是利润最大化的垄断者的现状。
      en: |-
        (a) At the optimum $MR = MC > 0$. $MR = P\left(1 - \frac{1}{|\varepsilon|}\right) > 0$ requires $\frac{1}{|\varepsilon|} < 1$, that is, $|\varepsilon| > 1$. Where demand is inelastic, MR is negative, and producing less would actually raise revenue.
        (b) The firm should raise its price. The elasticity is about 0.3 < 1, so a higher price raises revenue (the price rises by a larger percentage than sales fall), while lower sales reduce cost, so profit certainly rises. It should keep raising the price until demand becomes elastic and $MR = MC$. So "inelastic demand" cannot describe a profit-maximizing monopolist's current position.
    rubric:
      zh-cn:
        - "(a) 由 $MR = MC > 0$ 和 MR 的弹性形式推出 $|\\varepsilon| > 1$。"
        - "(b) 应涨价：收入上升、成本下降；指出目前的位置不是最优。"
      en:
        - "(a) Derives $|\\varepsilon| > 1$ from $MR = MC > 0$ and the elasticity form of MR."
        - "(b) Raise the price: revenue rises and cost falls; points out that the current position is not optimal."

  - id: Q2
    kind: exercise
    level: B
    concepts: [cournot-model, oligopoly, perfect-competition]
    question:
      zh-cn: |-
        $n$ 个相同的厂商进行古诺竞争，需求 $P = a - bQ$，边际成本都为 $c$。
        (a) 写出厂商 $i$ 的利润和一阶条件（记其他厂商的总产量为 $Q_{-i}$），利用对称性求每个厂商的产量、总产量和价格。
        (b) 检验 $n = 1$ 和 $n \to \infty$ 时的结果。
      en: |-
        $n$ identical firms compete à la Cournot, with demand $P = a - bQ$ and marginal cost $c$ for each.
        (a) Write firm $i$'s profit and first-order condition (with $Q_{-i}$ the total output of the other firms), and use symmetry to find each firm's output, total output and the price.
        (b) Check the results for $n = 1$ and $n \to \infty$.
    answer:
      zh-cn: |-
        (a) $\pi_i = \left(a - b(q_i + Q_{-i}) - c\right) q_i$，一阶条件 $a - c - 2b\,q_i - b\,Q_{-i} = 0$。对称时 $Q_{-i} = (n - 1)q$，得 $q = \frac{a - c}{(n + 1)b}$。总产量 $Q = \frac{n}{n + 1}\cdot\frac{a - c}{b}$，价格 $P = \frac{a + nc}{n + 1}$。
        (b) $n = 1$：$Q = \frac{a - c}{2b}$，$P = \frac{a + c}{2}$，即垄断。$n \to \infty$：$Q \to \frac{a - c}{b}$，$P \to c$，即完全竞争。
      en: |-
        (a) $\pi_i = \left(a - b(q_i + Q_{-i}) - c\right) q_i$, with first-order condition $a - c - 2b\,q_i - b\,Q_{-i} = 0$. By symmetry $Q_{-i} = (n - 1)q$, so $q = \frac{a - c}{(n + 1)b}$. Total output is $Q = \frac{n}{n + 1}\cdot\frac{a - c}{b}$ and the price $P = \frac{a + nc}{n + 1}$.
        (b) $n = 1$: $Q = \frac{a - c}{2b}$, $P = \frac{a + c}{2}$, the monopoly. $n \to \infty$: $Q \to \frac{a - c}{b}$, $P \to c$, perfect competition.
    rubric:
      zh-cn:
        - "(a) 一阶条件和对称解正确。"
        - "(b) 两个极限正确。"
      en:
        - "(a) Correct first-order condition and symmetric solution."
        - "(b) Both limits correct."

  - id: Q3
    kind: exercise
    level: B
    concepts: [cournot-model, monopoly, oligopoly]
    expected: { qd: "30", pid: "900", pio: "600" }
    question:
      zh-cn: |-
        两个厂商，需求 $P = 100 - Q$，边际成本都为 20。古诺均衡时每个厂商的利润约为 711.11；如果两家合谋像一个垄断者一样生产（总产量 40）并平分，每家得到 800。合谋后，如果厂商 2 遵守约定生产 20，厂商 1 的最优产量是多少？两个厂商的利润各是多少？这说明合谋有什么问题？
      en: |-
        Two firms face demand $P = 100 - Q$, each with marginal cost 20. In the Cournot equilibrium each earns about 711.11; if they collude and produce like a monopolist (total output 40), splitting it equally, each earns 800. Under the agreement, if firm 2 keeps its promise and produces 20, what is firm 1's best output? What does each firm earn? What does this say about collusion?
    answer:
      zh-cn: |-
        由反应函数 $q_1 = \frac{80 - q_2}{2} = \frac{80 - 20}{2} = 30$，价格 $100 - 50 = 50$。厂商 1 利润 $30 \times 30 = 900$，厂商 2 利润 $20 \times 30 = 600$。
        每个厂商都有违约的动机：对方守约时，自己多生产可以从 800 增加到 900。如果两个厂商都这样想，就会回到古诺均衡，两人都只得到 711.11。合谋对双方都更好，却不稳定（[[1.7]] 的囚徒困境）。
      en: |-
        From the reaction function $q_1 = \frac{80 - q_2}{2} = \frac{80 - 20}{2} = 30$, the price is $100 - 50 = 50$. Firm 1 earns $30 \times 30 = 900$ and firm 2 earns $20 \times 30 = 600$.
        Each firm has a reason to cheat: if the other keeps the deal, producing more raises its profit from 800 to 900. If both think this way, they return to the Cournot equilibrium and each gets only 711.11. Collusion is better for both but unstable (the prisoners' dilemma of [[1.7]]).
    rubric:
      zh-cn:
        - "产量 30，利润 900 和 600。"
        - "说明违约动机和合谋的不稳定。"
      en:
        - "Output 30; profits 900 and 600."
        - "Explains the incentive to cheat and the instability of collusion."

  - id: Q4
    kind: exercise
    level: C
    star: true
    concepts: [price-discrimination, monopoly]
    expected: { pu: "55", piu: "2025", pid: "2225" }
    question:
      zh-cn: |-
        沿用 [[check:C2]] 的两组买者（$Q_A = 100 - P_A$，$Q_B = 60 - 2P_B$，边际成本 10）。
        (a) 如果法律禁止价格歧视，厂商只能对两组收同一个价格。利润最大的价格和利润是多少？与价格歧视时相比如何？（注意：价格高于某个水平时，B 组不再购买。）
        (b) 禁止价格歧视对 B 组买者是好是坏？对总销量呢？
      en: |-
        Use the two groups of [[check:C2]] ($Q_A = 100 - P_A$, $Q_B = 60 - 2P_B$, marginal cost 10).
        (a) If the law forbids price discrimination and the firm must charge both groups the same price, what are the profit-maximizing price and profit? How do they compare with price discrimination? (Note: above some price, group B stops buying.)
        (b) Is the ban good or bad for group B? For total sales?
    answer:
      zh-cn: |-
        (a) 价格不超过 30 时两组都购买，总需求 $Q = 160 - 3P$，利润 $(P - 10)(160 - 3P)$ 在这一段随价格上升，最优是 $P = 30$，利润 1400。价格高于 30 时只有 A 组购买，最优 $P = 55$，利润 $45 \times 45 = 2025$。所以统一定价为 55，利润 2025，只卖给 A 组。价格歧视时总利润 $2025 + 200 = 2225$，多 200。
        (b) 对 B 组是坏事：价格歧视时他们能以 20 买到 20 单位，禁止后完全买不到；A 组的价格不变。总销量从 65 降到 45。当低需求的市场在统一定价下会被放弃时，价格歧视反而增加了销量。
      en: |-
        (a) At prices up to 30 both groups buy, with total demand $Q = 160 - 3P$; profit $(P - 10)(160 - 3P)$ rises with the price over this range, so the best is $P = 30$ with profit 1400. Above 30 only group A buys, and the best is $P = 55$ with profit $45 \times 45 = 2025$. So the uniform price is 55, profit 2025, selling only to A. With discrimination total profit is $2025 + 200 = 2225$, 200 more.
        (b) Bad for group B: with discrimination they buy 20 units at 20; with the ban they cannot buy at all; group A's price is unchanged. Total sales fall from 65 to 45. When a low-demand market would be abandoned under a uniform price, price discrimination actually raises sales.
    rubric:
      zh-cn:
        - "(a) 统一价格 55、利润 2025，比歧视时少 200。"
        - "(b) B 组买不到，总销量下降。"
      en:
        - "(a) Uniform price 55, profit 2025, 200 less than with discrimination."
        - "(b) Group B is shut out and total sales fall."

  - id: Q5
    kind: exercise
    level: B
    concepts: [lerner-index, monopoly, price-elasticity]
    expected: { p1: "90", p2: "40" }
    question:
      zh-cn: |-
        一家企业的边际成本恒为 30，需求弹性在相关范围内大约恒为 $-1.5$。一个相近的竞争产品上市后，弹性变为 $-4$。
        (a) 竞争产品上市前后，利润最大的价格各是多少？
        (b) 用这个例子解释：为什么一个行业的竞争者变多，或者顾客更容易比较价格时，企业的加价率会下降？
      en: |-
        A firm has a constant marginal cost of 30 and a demand elasticity of about $-1.5$ over the relevant range. After a close competing product appears, the elasticity becomes $-4$.
        (a) What is the profit-maximizing price before and after the competing product appears?
        (b) Use this example to explain why markups fall when an industry gains competitors or when customers can compare prices more easily.
    answer:
      zh-cn: |-
        (a) 由 $P = \frac{MC}{1 - 1/|\varepsilon|}$：之前 $\frac{30}{1 - 2/3} = 90$，之后 $\frac{30}{1 - 1/4} = 40$。
        (b) 有了相近的替代品，顾客对价格更敏感，需求弹性变大，勒纳指数 $\frac{1}{|\varepsilon|}$ 从约 0.67 降到 0.25，加价随之下降。顾客更容易比较价格也有同样的效果。
      en: |-
        (a) From $P = \frac{MC}{1 - 1/|\varepsilon|}$: before, $\frac{30}{1 - 2/3} = 90$; after, $\frac{30}{1 - 1/4} = 40$.
        (b) With a close substitute, customers are more price sensitive and demand is more elastic, so the Lerner index $\frac{1}{|\varepsilon|}$ falls from about 0.67 to 0.25 and the markup falls. Easier price comparison has the same effect.
    rubric:
      zh-cn:
        - "(a) 90 和 40。"
        - "(b) 用弹性和勒纳指数解释。"
      en:
        - "(a) 90 and 40."
        - "(b) Explains with elasticity and the Lerner index."

  - id: Q6
    kind: exercise
    level: C
    concepts: [natural-monopoly, monopoly, returns-to-scale, average-cost]
    expected: { loss: "-900", qa: "78.54", pa: "21.46" }
    question:
      zh-cn: |-
        一个城市的自来水供应，成本 $C(Q) = 900 + 10Q$（900 是管网的固定成本），需求 $P = 100 - Q$。放任垄断时，价格为 55。
        (a) 为什么由一家企业供应比两家各建一套管网成本更低？
        (b) 监管者要求价格等于边际成本时，企业的利润是多少，这个要求能长期维持吗？改为要求价格等于平均成本时，产量和价格是多少（取较大的产量）？
      en: |-
        A city's water supply has cost $C(Q) = 900 + 10Q$ (900 is the fixed cost of the pipe network) and demand $P = 100 - Q$. Left alone as a monopoly, it charges 55.
        (a) Why is supply by one firm cheaper than two firms each building a network?
        (b) If the regulator requires price to equal marginal cost, what is the firm's profit, and can this last? If instead price must equal average cost, what are output and price (take the larger output)?
    answer:
      zh-cn: |-
        (a) $\text{AC} = 10 + \frac{900}{Q}$ 随产量一直下降。两家企业各建一套管网，要付两次固定成本，生产同样的总产量，总成本多 900。这就是自然垄断。
        (b) $P = 10$，$Q = 90$，收入恰好等于可变成本，利润 $-900$：企业无法收回管网成本，长期会退出，除非政府补贴。按平均成本定价：$100 - Q = 10 + \frac{900}{Q}$，$Q^2 - 90Q + 900 = 0$，$Q \approx 78.54$，$P \approx 21.46$，与垄断定价相比产量更高、价格更低，企业仍能收回成本。
      en: |-
        (a) $\text{AC} = 10 + \frac{900}{Q}$ falls as output rises. Two firms each building a network pay the fixed cost twice for the same total output, so total cost is 900 higher. This is a natural monopoly.
        (b) $P = 10$, $Q = 90$: revenue just equals variable cost, so profit is $-900$; the firm cannot recover the network cost and would exit in the long run unless subsidized. With average-cost pricing, $100 - Q = 10 + \frac{900}{Q}$, so $Q^2 - 90Q + 900 = 0$, $Q \approx 78.54$ and $P \approx 21.46$: more output and a lower price than the monopoly, while the firm still covers its costs.
    rubric:
      zh-cn:
        - "(a) 用平均成本递减说明自然垄断。"
        - "(b) 利润 −900（写作 - 或 − 均可），不能长期维持；约 78.54 和 21.46。"
      en:
        - "(a) Explains natural monopoly by falling average cost."
        - "(b) Profit −900 (written with - or −), not sustainable; about 78.54 and 21.46."
