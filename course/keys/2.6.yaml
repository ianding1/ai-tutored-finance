# Answer key for lesson 2.6. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[2.6#debt]] (section), [[concept:fiscal-multiplier]], [[check:Q3]], [[fig:4-1]].
# expected: values are recomputed by course/verify/2.6.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "2.6"

context:
  - zh-cn: |-
      学习者学过现值（[[0.1]]）、无谓损失（[[1.8]]）、GDP 的支出法（[[2.1]]）、Solow 模型（[[2.2]]）、通胀的成本（[[2.3]]）、IS 曲线和 AD-AS（[[2.4]]，包括练习题中推导的政府购买乘数 $\frac{1}{1 - b}$）、货币政策与零下限（[[2.5]]）。百分数的计算用百分点表示。
    en: |-
      The learner has studied present value ([[0.1]]), deadweight loss ([[1.8]]), the expenditure approach to GDP ([[2.1]]), the Solow model ([[2.2]]), the costs of inflation ([[2.3]]), the IS curve and AD-AS ([[2.4]], including the government purchases multiplier $\frac{1}{1 - b}$ derived in an exercise) and monetary policy and the zero lower bound ([[2.5]]). Percentage calculations are in percentage points.
  - concepts: [budget-deficit, primary-deficit]
    zh-cn: |-
      讲义：美国联邦政府 2026 财年收入约 5.40 万亿美元，支出约 7.40 万亿美元，赤字约 1.99 万亿美元，净利息约 1.14 万亿美元（CBO，2026 年 10 月 8 日）；公众持有的债务约为 GDP 的 100%（CBO，2026 年 2 月）。基本赤字不含利息。
    en: |-
      The lesson: in fiscal year 2026 US federal revenue was about 5.40 trillion dollars, outlays about 7.40 trillion, the deficit about 1.99 trillion and net interest about 1.14 trillion (CBO, October 8, 2026); debt held by the public is about 100% of GDP (CBO, February 2026). The primary deficit excludes interest.
  - concepts: [fiscal-multiplier, automatic-stabilizer, crowding-out]
    zh-cn: |-
      讲义：政府购买乘数 $\frac{1}{1 - b}$（利率不变）；减税的效果与政府购买不同（讲义没有给出减税乘数，留给随堂题）；现实中的乘数约 0.5 到 2，衰退和零下限时较大；自动稳定器使乘数变小（计算留给练习题）。挤出效应：从利率看和从储蓄看；经济接近潜在产出时挤出较多；长期中赤字减少资本积累。
    en: |-
      The lesson: the government purchases multiplier $\frac{1}{1 - b}$ (at a constant interest rate); tax cuts work differently from purchases (the lesson gives no tax multiplier; it is left to a check question); real-world multipliers are about 0.5 to 2, larger in recessions and at the zero lower bound; automatic stabilizers make the multiplier smaller (the calculation is left to an exercise). Crowding out: the interest-rate view and the saving view; more crowding out near potential output; in the long run deficits reduce capital accumulation.
  - concepts: [primary-deficit, budget-deficit]
    questions: [C3, Q3, Q5]
    zh-cn: |-
      讲义：$b_{t+1} = \frac{1 + r}{1 + g} b_t + d_{t+1}$；$r < g$ 时有少量基本赤字也能稳定，$r > g$ 时需要基本盈余；使比例不变的基本赤字留给随堂题。[[fig:4-1]]：起点 100%，基本赤字滑块 −3 到 6、利率和增长率滑块 0 到 8，步长都是 0.5，默认 3、3.5、4；读数显示 30 年后的债务比例和使比例保持在 100% 的基本赤字。不可持续的结局：增税或减支、违约、通胀。
    en: |-
      The lesson: $b_{t+1} = \frac{1 + r}{1 + g} b_t + d_{t+1}$; with $r < g$ a small primary deficit can be stable, with $r > g$ a primary surplus is needed; the primary deficit that keeps the ratio constant is left to a check question. [[fig:4-1]]: starting at 100%, a primary-deficit slider from −3 to 6 and interest-rate and growth sliders from 0 to 8, all in steps of 0.5, defaults 3, 3.5 and 4; the readout shows debt after 30 years and the primary deficit that keeps the ratio at 100%. Unsustainable paths end in tax increases or spending cuts, default or inflation.
  - concepts: [ricardian-equivalence]
    zh-cn: |-
      讲义：Ricardo 等价的推理（今天的减税等于将来税收的现值）；不成立的原因：流动性约束、不看那么远或认为税由别人承担、税收的扭曲；实证中家庭会消费一部分临时减税。
    en: |-
      The lesson: the reasoning of Ricardian equivalence (today's tax cut equals the present value of future taxes); reasons it fails: liquidity constraints, short horizons or expecting others to pay the taxes, distortions from taxes; empirically households spend part of temporary tax cuts.

common_errors:
  - questions: [C1, Q1]
    zh-cn: |-
      以为减税和同样金额的政府购买效果相同。减税的第一轮中，有一部分被储蓄，所以乘数小一些。
    en: |-
      Thinking that a tax cut has the same effect as government purchases of the same amount. In the first round, part of a tax cut is saved, so its multiplier is smaller.
  - questions: [C2, Q4]
    zh-cn: |-
      以为财政扩张总会使产出按简单乘数增加，忽略利率上升和私人投资减少。
    en: |-
      Thinking that a fiscal expansion always raises output by the simple multiplier, ignoring higher interest rates and lower private investment.
  - questions: [C3, Q3, Q5]
    zh-cn: |-
      只看赤字的绝对大小判断债务能否持续，忽略利率与名义增长率之差和债务比例本身。
    en: |-
      Judging whether debt is sustainable only from the size of the deficit, ignoring the gap between the interest rate and nominal growth and the debt ratio itself.
  - questions: [Q2]
    zh-cn: |-
      以为比例税只是减少了家庭的收入。收入下降时税收自动减少，可支配收入下降得少，消费波动变小，乘数降低，冲击对产出的影响被缓和；代价是扩张性冲击和政策的效果也被削弱。
    en: |-
      Thinking a proportional tax only reduces households' income. When income falls, taxes fall automatically, disposable income falls less, consumption swings less and the multiplier is smaller, softening shocks; the price is that expansionary shocks and policies are weakened too.
  - questions: [C4, Q4]
    zh-cn: |-
      把 Ricardo 等价理解为“赤字无关紧要”。它是在很强的假设下关于融资方式的结论，并不说政府支出本身无关紧要。
    en: |-
      Reading Ricardian equivalence as "deficits do not matter". It is a statement about the way spending is financed under strong assumptions, not a claim that government spending itself does not matter.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: multiplier
    concepts: [fiscal-multiplier]
    question:
      zh-cn: |-
        利率不变时，政府向家庭减税 100，和政府增加购买 100，对产出的效果相同。
      en: |-
        With interest rates unchanged, cutting households' taxes by 100 has the same effect on output as raising government purchases by 100.
    correct: false
    hint:
      zh-cn: 政府购买的 100 全部直接成为需求。家庭得到减税的 100 后，会全部花掉吗？
      en: The 100 of government purchases is all direct demand. Do households spend all of a 100 tax cut?
    answer:
      zh-cn: |-
        错。政府购买的 100 全部直接成为对产出的需求；减税的 100 只增加家庭的可支配收入，家庭只消费其中的一部分（边际消费倾向 $b$），其余被储蓄，没有成为需求。所以减税乘数 $\frac{b}{1 - b}$ 小于政府购买乘数 $\frac{1}{1 - b}$：$b = 0.8$ 时分别为 4 和 5。
      en: |-
        False. The 100 of government purchases is all direct demand for output; a 100 tax cut only raises households' disposable income, of which they spend a fraction (the marginal propensity to consume $b$) and save the rest. So the tax multiplier $\frac{b}{1 - b}$ is smaller than the purchases multiplier $\frac{1}{1 - b}$: with $b = 0.8$, 4 against 5.

  - id: C2
    kind: check
    section: crowding-out
    concepts: [crowding-out]
    question:
      zh-cn: |-
        政府增加购买，央行担心经济过热而提高利率。与利率不变时相比，产出的增加：
      en: |-
        The government raises its purchases, and the central bank, worried about overheating, raises interest rates. Compared with unchanged rates, the increase in output is:
    choices:
      - zh-cn: 更少，因为利率上升使私人投资减少
        en: Smaller, because higher rates reduce private investment
      - zh-cn: 更多，因为利率上升使储蓄者的收入增加
        en: Larger, because higher rates raise savers' incomes
        why:
          zh-cn: 在 IS 曲线中，利率通过哪一项支出影响产出？它向哪个方向变化？
          en: Through which spending does the interest rate affect output in the IS curve? Which way does it move?
      - zh-cn: 一样多，因为政府购买的增加不变
        en: The same, because the increase in government purchases is the same
        why:
          zh-cn: 利率上升时，企业的投资会不会变化？投资的变化也会通过乘数影响产出吗？
          en: When rates rise, does firms' investment change? Does that change also work through the multiplier?
      - zh-cn: 变为负数，产出比原来更低
        en: Negative, with output below where it started
        why:
          zh-cn: 央行加息是为了抑制过热。它通常会把利率提高到完全抵消财政扩张、甚至更多吗？
          en: The central bank raises rates to curb overheating. Would it usually raise them enough to cancel the fiscal expansion, or more?
    correct: A
    answer:
      zh-cn: |-
        (A)。利率上升使投资减少，投资的减少又通过乘数使产出少增加一部分：政府支出挤出了一部分私人投资。挤出的大小取决于央行的反应：经济处于衰退、有大量闲置资源，或利率处于零下限、央行不会加息时，挤出很小。
      en: |-
        (A). Higher rates cut investment, and the drop in investment works through the multiplier to reduce the rise in output: government spending crowds out part of private investment. How much depends on the central bank's response: in a deep recession with idle resources, or at the zero lower bound when the central bank will not raise rates, crowding out is small.

  - id: C3
    kind: check
    section: debt
    concepts: [primary-deficit, budget-deficit]
    widget: { id: debt-dynamics, set: { d: 3, r: 5, g: 4 } }
    question:
      zh-cn: |-
        在 [[fig:4-1]] 中把基本赤字设为 0，利率略高于名义增长率。债务占 GDP 的比例：
      en: |-
        In [[fig:4-1]], set the primary deficit to 0, with the interest rate slightly above nominal growth. The debt-to-GDP ratio:
    choices:
      - zh-cn: 逐年上升
        en: Rises year after year
      - zh-cn: 保持在 100%，因为没有基本赤字
        en: Stays at 100%, because there is no primary deficit
        why:
          zh-cn: 没有基本赤字时，债务还会因为什么增加？债务和 GDP 哪个增长得更快？
          en: With no primary deficit, what else makes the debt grow? Which grows faster, the debt or GDP?
      - zh-cn: 逐年下降
        en: Falls year after year
        why:
          zh-cn: 比例下降需要 GDP 增长得比债务快。这里债务按什么速度增长？
          en: For the ratio to fall, GDP must grow faster than the debt. At what rate does the debt grow here?
      - zh-cn: 先上升后下降
        en: First rises and then falls
        why:
          zh-cn: 公式 $b_{t+1} = \frac{1 + r}{1 + g} b_t$ 中，比值 $\frac{1 + r}{1 + g}$ 会随时间变化吗？
          en: In $b_{t+1} = \frac{1 + r}{1 + g} b_t$, does the factor $\frac{1 + r}{1 + g}$ change over time?
    correct: A
    answer:
      zh-cn: |-
        (A)。没有基本赤字时，债务每年按利率增长（利息靠借新债支付），GDP 按名义增长率增长。$r > g$ 时，$b_{t+1} = \frac{1 + r}{1 + g} b_t$ 中的比值大于 1，债务比例逐年上升，而且越来越快。要让比例不升，需要基本盈余；反过来，$r < g$ 时，即使有少量基本赤字，比例也可以保持稳定。
      en: |-
        (A). With no primary deficit, the debt grows at the interest rate (interest is paid by new borrowing), while GDP grows at the nominal growth rate. With $r > g$, the factor in $b_{t+1} = \frac{1 + r}{1 + g} b_t$ is above 1, so the ratio rises every year, ever faster. Holding it steady needs a primary surplus; conversely, with $r < g$ the ratio can stay steady even with a small primary deficit.

  - id: C4
    kind: check
    section: ricardian
    concepts: [ricardian-equivalence, present-value]
    question:
      zh-cn: |-
        按 Ricardo 等价，政府今年减税、发行国债弥补、以后加税还本付息时，家庭会把减税的钱存起来，今年的消费不变。
      en: |-
        Under Ricardian equivalence, when the government cuts taxes this year, issues bonds to cover it and raises taxes later to repay them, households save the tax cut and keep this year's consumption unchanged.
    correct: true
    hint:
      zh-cn: 以后多交的税，折现到今天值多少？家庭一生的财富因为减税变化了吗？
      en: What are the future extra taxes worth today? Does the tax cut change households' lifetime wealth?
    answer:
      zh-cn: |-
        对。以后多交的税的现值正好等于今天的减税，家庭一生的财富没有变化，所以消费不变，把减税的钱存起来（例如买政府发行的国债），以后用本息交税。这个结论依赖很强的假设：家庭不受流动性约束、能预见未来的税、把子孙的负担也考虑在内。现实中这些假设常常不成立，家庭会花掉一部分减税。
      en: |-
        True. The future extra taxes have a present value exactly equal to today's cut, so lifetime wealth is unchanged, consumption stays the same, and households save the cut (for example, by buying the bonds issued) and use the proceeds to pay the later taxes. The result rests on strong assumptions: households are not liquidity constrained, foresee the future taxes and count their descendants' burden. In practice these often fail, and households spend part of a tax cut.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: B
    star: true
    concepts: [fiscal-multiplier]
    expected: { kt: "-3", bb: "1" }
    question:
      zh-cn: |-
        在简单模型 $Y = a + b(Y - T) + I + G$ 中（利率不变）：
        (a) 求税收乘数（$b = 0.75$ 时是多少），并求政府同时增加购买和税收各 100（预算平衡）时产出的变化。
        (b) 为什么预算平衡的扩张也能增加产出？
      en: |-
        In the simple model $Y = a + b(Y - T) + I + G$ (at a constant interest rate):
        (a) Find the tax multiplier (its value when $b = 0.75$), and the change in output when the government raises both purchases and taxes by 100 (a balanced budget).
        (b) Why can a balanced-budget expansion raise output?
    answer:
      zh-cn: |-
        (a) $(1 - b)\Delta Y = -b\,\Delta T$，税收乘数 $-\frac{b}{1 - b}$，$b = 0.75$ 时为 -3。预算平衡时 $\Delta Y = \frac{1}{1 - b} \times 100 - \frac{b}{1 - b} \times 100 = 100$，乘数为 1，与 $b$ 无关。
        (b) 政府购买的 100 全部成为需求；加税 100 只使消费减少 $100b$，其余部分原本会被储蓄。总需求在第一轮净增 $100(1 - b)$，再乘以 $\frac{1}{1 - b}$，正好是 100。
      en: |-
        (a) $(1 - b)\Delta Y = -b\,\Delta T$, so the tax multiplier is $-\frac{b}{1 - b}$, which is -3 with $b = 0.75$. With a balanced budget, $\Delta Y = \frac{1}{1 - b} \times 100 - \frac{b}{1 - b} \times 100 = 100$: a multiplier of 1, whatever $b$ is.
        (b) All 100 of purchases becomes demand, while a 100 tax rise cuts consumption by only $100b$, because the rest would have been saved. The first-round net rise in demand is $100(1 - b)$, and multiplied by $\frac{1}{1 - b}$ it is exactly 100.
    rubric:
      zh-cn:
        - "(a) $-\\frac{b}{1 - b}$，−3（写作 -3 或 −3 均可）；预算平衡乘数 1。"
        - "(b) 解释净需求增加。"
      en:
        - "(a) $-\\frac{b}{1 - b}$, −3 (written -3 or −3); a balanced-budget multiplier of 1."
        - "(b) Explains the net rise in demand."

  - id: Q2
    kind: exercise
    level: B
    concepts: [automatic-stabilizer, fiscal-multiplier]
    expected: { k0: "5", k: "2.5", dy0: "-500", dy: "-250" }
    question:
      zh-cn: |-
        边际消费倾向 $b = 0.8$。比较两种税制：(i) 固定税额，与收入无关；(ii) 税收为收入的 25%，$T = 0.25Y$。
        (a) 两种税制下的支出乘数各是多少？企业投资突然减少 100，产出各减少多少？
        (b) 为什么比例税被称为自动稳定器？它的代价是什么？
      en: |-
        The marginal propensity to consume is $b = 0.8$. Compare two tax systems: (i) a fixed tax that does not depend on income; (ii) a tax of 25% of income, $T = 0.25Y$.
        (a) What is the spending multiplier under each? If business investment suddenly falls by 100, by how much does output fall under each?
        (b) Why is a proportional tax called an automatic stabilizer? What is its cost?
    answer:
      zh-cn: |-
        (a) (i) $\frac{1}{1 - 0.8} = 5$，产出变化 -500。(ii) $C = a + 0.8(1 - 0.25)Y = a + 0.6Y$，乘数 $\frac{1}{1 - 0.6} = 2.5$，产出变化 -250。
        (b) 收入下降时税收自动减少，可支配收入下降得少，消费减少得少，冲击被缓冲，不需要政府做任何决定。代价是：经济好转时它同样会抑制增长，而且衰退时税收减少会使赤字自动扩大。
      en: |-
        (a) (i) $\frac{1}{1 - 0.8} = 5$, so output changes by -500. (ii) $C = a + 0.8(1 - 0.25)Y = a + 0.6Y$, a multiplier of $\frac{1}{1 - 0.6} = 2.5$, so output changes by -250.
        (b) When income falls, taxes fall automatically, so disposable income and consumption fall less and the shock is cushioned, with no decision by the government. The cost: it also restrains growth when the economy recovers, and in a recession lower tax revenue automatically widens the deficit.
    rubric:
      zh-cn:
        - "(a) 5 和 2.5；−500 和 −250（写作 - 或 − 均可）。"
        - "(b) 说明自动缓冲的机制和代价。"
      en:
        - "(a) 5 and 2.5; −500 and −250 (written with - or −)."
        - "(b) Explains the automatic cushioning and its cost."

  - id: Q3
    kind: exercise
    level: C
    star: true
    concepts: [primary-deficit, budget-deficit, inflation]
    expected: { b2: "141.37", s: "0.96", d2: "1.89" }
    question:
      zh-cn: |-
        一国政府债务为 GDP 的 100%，基本赤字每年为 GDP 的 3%。
        (a) 利率 5%、名义增长率 4% 时，10 年后债务比例是多少？要使比例稳定在 100%，需要多大的基本盈余？
        (b) 假设现有债务都是长期固定利率债券，平均利率为 4%；通胀意外上升 2 个百分点，使名义增长率从 4% 升到 6%，而现有债务的利率暂时不变。这时使比例稳定所允许的基本赤字是多少？谁承担了代价？为什么这种办法不能反复使用？
      en: |-
        A government's debt is 100% of GDP, and the primary deficit is 3% of GDP each year.
        (a) With an interest rate of 5% and nominal growth of 4%, what is the debt ratio after 10 years? What primary surplus is needed to keep the ratio at 100%?
        (b) Suppose existing debt is all long-term fixed-rate bonds with an average rate of 4%; inflation rises unexpectedly by 2 percentage points, raising nominal growth from 4% to 6%, while the rate on existing debt stays the same for now. What primary deficit now keeps the ratio stable? Who bears the cost? Why can this not be done again and again?
    answer:
      zh-cn: |-
        (a) 逐年计算 $b_{t+1} = \frac{1.05}{1.04} b_t + 3$，10 年后约 141.37%（若 $r = g$，则只是每年加 3，为 130%）。稳定需要 $d = \frac{0.04 - 0.05}{1.04} \times 100 \approx -0.96$，即约 0.96% 的基本盈余。
        (b) $d = \frac{0.06 - 0.04}{1.06} \times 100 \approx 1.89\%$。意外的通胀使名义 GDP 增长加快，而债务的利息固定，债务的实际价值下降：代价由持有固定利率国债的债权人承担（[[2.3#inflation-costs]]）。投资者吸取教训后，会对新发的债务要求更高的利率（包含通胀风险补偿），通胀的好处就消失了，还带来通胀本身的成本。
      en: |-
        (a) Computing $b_{t+1} = \frac{1.05}{1.04} b_t + 3$ year by year gives about 141.37% after 10 years (with $r = g$ it would just add 3 a year, to 130%). Stability requires $d = \frac{0.04 - 0.05}{1.04} \times 100 \approx -0.96$, a primary surplus of about 0.96%.
        (b) $d = \frac{0.06 - 0.04}{1.06} \times 100 \approx 1.89\%$. Unexpected inflation speeds up nominal GDP growth while interest on the debt is fixed, so the real value of the debt falls: the cost falls on creditors holding fixed-rate government bonds ([[2.3#inflation-costs]]). Once investors learn, they demand higher rates on new debt (including compensation for inflation risk), the gain disappears, and the costs of inflation itself remain.
    rubric:
      zh-cn:
        - "(a) 约 141.37%，基本盈余约 0.96%。"
        - "(b) 约 1.89%，说明债权人承担代价，以及预期调整使它不能反复使用。"
      en:
        - "(a) About 141.37%; a primary surplus of about 0.96%."
        - "(b) About 1.89%, explaining that creditors bear the cost and that adjusting expectations prevent repeated use."

  - id: Q4
    kind: exercise
    level: B
    concepts: [ricardian-equivalence, crowding-out]
    expected: { ns1: "0", ns2: "-150" }
    question:
      zh-cn: |-
        国民储蓄 = 私人储蓄 + 政府储蓄（政府储蓄 = −赤字）。政府减税 200，使赤字增加 200，政府购买不变。
        (a) 如果 Ricardo 等价成立，国民储蓄变化多少？如果家庭只把减税的 25% 存起来呢？
        (b) 一位议员说：“减税让家庭有更多的钱，一定能刺激经济，而且不会影响企业的投资。”分别在两种情况下评价这个说法。
      en: |-
        National saving = private saving + government saving (government saving = −deficit). The government cuts taxes by 200, raising the deficit by 200, with purchases unchanged.
        (a) If Ricardian equivalence holds, by how much does national saving change? What if households save only 25% of the tax cut?
        (b) A legislator says: "A tax cut leaves households more money, so it must stimulate the economy, and it does not affect business investment." Evaluate the statement in each of the two cases.
    answer:
      zh-cn: |-
        (a) Ricardo 等价成立时，私人储蓄增加 200，政府储蓄减少 200，国民储蓄变化 0。只存 25% 时，私人储蓄增加 50，国民储蓄变化 $50 - 200 = -150$。
        (b) 两种情况下这个说法都不成立，但错的地方不同。Ricardo 等价成立时，家庭多买的国债正好等于政府多发的国债，资金的供求不变，利率和投资都不变，减税也不刺激需求。不成立时，国民储蓄减少，可用于投资的资金减少，实际利率上升，私人投资被挤出；同时消费增加，短期需求上升。
      en: |-
        (a) Under Ricardian equivalence, private saving rises by 200 and government saving falls by 200, so national saving changes by 0. If only 25% is saved, private saving rises by 50, so national saving changes by $50 - 200 = -150$.
        (b) The statement fails in both cases, but in different ways. Under Ricardian equivalence, the extra bonds households buy exactly match the extra bonds issued, so the supply and demand for funds are unchanged, interest rates and investment do not change, and the tax cut does not stimulate demand. Otherwise national saving falls, less is available for investment, the real rate rises and private investment is crowded out; consumption rises at the same time, so short-run demand goes up.
    rubric:
      zh-cn:
        - "(a) 0 和 −150（写作 -150 或 −150 均可）。"
        - "(b) 指出 Ricardo 等价成立时减税不刺激需求，不成立时刺激需求但挤出私人投资。"
      en:
        - "(a) 0 and −150 (written -150 or −150)."
        - "(b) Points out that under Ricardian equivalence the cut does not stimulate demand, and that otherwise it stimulates demand but crowds out private investment."

  - id: Q5
    kind: exercise
    level: B
    concepts: [budget-deficit, primary-deficit]
    expected: { out: "15.45", rev: "21.15", prim: "0.85" }
    question:
      zh-cn: |-
        用讲义中 2026 财年的数字：收入 5.403 万亿美元，支出 7.396 万亿美元，净利息 1.143 万亿美元。
        (a) 净利息占支出和占收入的百分比各是多少？基本赤字是多少？
        (b) 公众持有的债务约 31 万亿美元，债务的平均利率每上升 1 个百分点，每年利息最终约增加 0.31 万亿美元。为什么利息负担上升会使财政政策在下一次衰退中更难发挥作用？
      en: |-
        Use the lesson's fiscal year 2026 figures: revenue 5.403 trillion dollars, outlays 7.396 trillion, net interest 1.143 trillion.
        (a) What percentage of outlays and of revenue is net interest? What is the primary deficit?
        (b) Debt held by the public is about 31 trillion dollars, so each 1-point rise in the average rate on the debt eventually adds about 0.31 trillion dollars of interest a year. Why does a rising interest burden make fiscal policy less able to act in the next recession?
    answer:
      zh-cn: |-
        (a) 占支出 $\frac{1.143}{7.396} \approx 15.45\%$，占收入 $\frac{1.143}{5.403} \approx 21.15\%$。总赤字 $7.396 - 5.403 = 1.993$ 万亿美元，基本赤字 $1.993 - 1.143 = 0.85$ 万亿美元。
        (b) 利息是必须支付的支出，占用的部分越大，其他支出的空间越小；债务比例已经很高时，衰退中再扩大赤字会使债务更快上升，投资者可能要求更高的利率（$r$ 上升），使债务更难持续。所以政府在衰退中扩张的余地变小。
      en: |-
        (a) Of outlays $\frac{1.143}{7.396} \approx 15.45\%$; of revenue $\frac{1.143}{5.403} \approx 21.15\%$. The total deficit is $7.396 - 5.403 = 1.993$ trillion dollars, and the primary deficit $1.993 - 1.143 = 0.85$ trillion dollars.
        (b) Interest must be paid; the larger its share, the less room for other spending. With the debt ratio already high, wider deficits in a recession make debt rise faster, and investors may demand higher rates ($r$ rises), which makes the debt harder to sustain. So the government has less room to expand in a recession.
    rubric:
      zh-cn:
        - "(a) 约 15.45% 和 21.15%，基本赤字约 0.85 万亿美元。"
        - "(b) 说明财政空间变小。"
      en:
        - "(a) About 15.45% and 21.15%; primary deficit about 0.85 trillion dollars."
        - "(b) Explains the smaller fiscal room."
