# Answer key for lesson 0.5. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.4]] (lesson), [[0.5#ols]] (section), [[concept:ols]], [[check:Q4]].
# expected: values are recomputed by course/verify/0.5.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "0.5"

context:
  - zh-cn: |-
      学习者学过期望、方差、协方差、相关系数（[[0.3]]），标准误、t 值、置信区间（[[0.4]]），以及一阶条件和偏导数（[[0.2]]）。本课只讲一个自变量的回归；还没有学 CAPM（[[4.4]]）和多因子模型（[[4.6]]）。
    en: |-
      The learner has studied expected value, variance, covariance and correlation ([[0.3]]), standard errors, t-statistics and confidence intervals ([[0.4]]), and first-order conditions and partial derivatives ([[0.2]]). This lesson covers regression with one explanatory variable only; the learner has not yet studied the CAPM ([[4.4]]) or multi-factor models ([[4.6]]).
  - concepts: [regression, residual, ols, regression-coefficient]
    zh-cn: |-
      讲义给出 $y_i = a + b\,x_i + e_i$，残差 $e_i = y_i - \hat y_i$；OLS 使残差平方和最小，$b = \frac{\sum (x_i - \bar x)(y_i - \bar y)}{\sum (x_i - \bar x)^2}$，$a = \bar y - b\bar x$（推导留给练习题）。讲义例子：6 个月市场收益 −4、−2、−1、1、2、4，股票收益 −4、−3、−0.5、2.5、3、8，回归直线 $\hat y = 1 + 1.5x$，残差平方和 4。讲义说明斜率是 $x$ 增加一个单位时 $y$ 的平均变化，系数有单位，截距在 $x = 0$ 远离数据范围时可能没有意义。讲义没有讨论斜率与相关系数之间的关系。
    en: |-
      The lesson gives $y_i = a + b\,x_i + e_i$ and the residual $e_i = y_i - \hat y_i$; OLS minimizes the sum of squared residuals, $b = \frac{\sum (x_i - \bar x)(y_i - \bar y)}{\sum (x_i - \bar x)^2}$ and $a = \bar y - b\bar x$ (the derivation is left to an exercise). Example in the lesson: 6 months of market returns −4, −2, −1, 1, 2, 4 and stock returns −4, −3, −0.5, 2.5, 3, 8, with the regression line $\hat y = 1 + 1.5x$ and a sum of squared residuals of 4. The lesson explains that the slope is the average change in $y$ when $x$ rises by one unit, that coefficients have units, and that the intercept may be meaningless when $x = 0$ is far outside the data. The lesson does not discuss the relation between the slope and the correlation coefficient.
  - concepts: [r-squared]
    zh-cn: |-
      $R^2 = 1 - \frac{\text{SSR}}{\text{SST}}$，是 $y$ 的变化中被回归解释的比例。讲义例子 $R^2 \approx 0.96$。讲义没有说明 $R^2$ 与相关系数的关系，也没有讨论 $R^2$ 低时的解读。
    en: |-
      $R^2 = 1 - \frac{\text{SSR}}{\text{SST}}$, the share of the variation of $y$ that the regression explains. Example in the lesson: $R^2 \approx 0.96$. The lesson does not state the relation between $R^2$ and the correlation coefficient and does not discuss how to read a low $R^2$.
  - concepts: [standard-error, t-statistic, confidence-interval]
    zh-cn: |-
      斜率的标准误 $\text{SE}(b) = \frac{s_e}{\sqrt{\sum (x_i - \bar x)^2}}$，$s_e = \sqrt{\frac{\text{SSR}}{n-2}}$；t 值 $\frac{b}{\text{SE}(b)}$；95% 置信区间 $b \pm 1.96\,\text{SE}(b)$。
    en: |-
      Standard error of the slope: $\text{SE}(b) = \frac{s_e}{\sqrt{\sum (x_i - \bar x)^2}}$ with $s_e = \sqrt{\frac{\text{SSR}}{n-2}}$; t-statistic $\frac{b}{\text{SE}(b)}$; 95% confidence interval $b \pm 1.96\,\text{SE}(b)$.
  - concepts: [omitted-variable-bias, correlation-vs-causation]
    zh-cn: |-
      讲义给出：真实关系为 $y = \alpha + \beta_1 x_1 + \beta_2 x_2 + \varepsilon$、只用 $x_1$ 回归时，斜率接近 $\beta_1 + \beta_2 \frac{\text{Cov}(x_1, x_2)}{\text{Var}(x_1)}$；偏差不为 0 需要 $\beta_2 \ne 0$ 且 $x_1$、$x_2$ 相关。讲义例子：工资对受教育年数回归，遗漏了能力。相关的三种来源：反向因果、共同原因、巧合（多重检验）。
    en: |-
      The lesson states: if the true relation is $y = \alpha + \beta_1 x_1 + \beta_2 x_2 + \varepsilon$ and $y$ is regressed on $x_1$ only, the slope is close to $\beta_1 + \beta_2 \frac{\text{Cov}(x_1, x_2)}{\text{Var}(x_1)}$; the bias is not 0 only if $\beta_2 \ne 0$ and $x_1$ and $x_2$ are correlated. Example in the lesson: wages regressed on years of education, with ability left out. Three sources of correlation: reverse causation, a common cause, and chance (multiple testing).

common_errors:
  - questions: [C1]
    zh-cn: |-
      残差的符号弄反：残差是实际值减去拟合值，点在直线上方时为正。
    en: |-
      Getting the sign of the residual wrong: the residual is the actual value minus the fitted value, positive when the point is above the line.
  - questions: [Q1]
    zh-cn: |-
      以为 $R^2$ 低就说明 $x$ 对 $y$ 没有影响。$R^2$ 衡量 $x$ 解释了 $y$ 的总变化的多大部分；$y$ 有很多其他来源的波动时，作用明确、显著的 $x$ 也可能只有很低的 $R^2$。
    en: |-
      Thinking a low $R^2$ means $x$ has no effect on $y$. $R^2$ measures the share of $y$'s total variation that $x$ explains; when $y$ varies for many other reasons, an $x$ with a clear, significant effect can still have a low $R^2$.
  - questions: [Q3]
    zh-cn: |-
      把基金收益超过市场的部分全部当作选股能力，忽略斜率大于 1 时，市场上涨期间基金本来就会多赚；或者用很少的数据下结论。
    en: |-
      Treating all of a fund's return above the market as stock-picking skill, ignoring that with a slope above 1 the fund earns more anyway when the market rises; or drawing conclusions from very little data.
  - questions: [Q5, Q6]
    zh-cn: |-
      对 $S(a, b)$ 求偏导数时漏掉链式法则中的系数 −2 或 $-x_i$，或者只对一个参数求导。
    en: |-
      Leaving out the factor −2 or $-x_i$ from the chain rule when taking partial derivatives of $S(a, b)$, or differentiating with respect to only one parameter.
  - questions: [Q7]
    zh-cn: |-
      把显著的回归系数当作因果关系，没有考虑反向因果和共同原因，例如经济前景同时影响利率和股价。
    en: |-
      Treating a significant regression coefficient as a causal effect without considering reverse causality and common causes, such as the economic outlook affecting both interest rates and stock prices.
  - questions: [Q2]
    zh-cn: |-
      把斜率的大小当作相关程度：斜率有单位，取决于 $x$ 和 $y$ 的尺度；相关系数没有单位。
    en: |-
      Reading the size of the slope as the strength of the correlation: the slope has units and depends on the scales of $x$ and $y$, while the correlation has no units.
  - questions: [C6, Q4]
    zh-cn: |-
      只说“遗漏了变量”，没有说明偏差的方向：方向由被遗漏变量对 $y$ 的作用的符号和它与 $x$ 的协方差的符号共同决定。
    en: |-
      Saying only that "a variable was left out" without the direction of the bias: the direction depends on the sign of the omitted variable's effect on $y$ and the sign of its covariance with $x$.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: regression
    concepts: [regression, residual]
    question:
      zh-cn: |-
        讲义中的回归直线是 $\hat y = 1 + 1.5x$。由此可知，市场月收益为 2% 的月份，这只股票的月收益一定是 4%。
      en: |-
        The lesson's regression line is $\hat y = 1 + 1.5x$. So in a month when the market returns 2%, the stock's return is certain to be 4%.
    correct: false
    hint:
      zh-cn: 回归直线给出的是什么？数据中的点都正好落在直线上吗？
      en: What does the regression line give? Do the data points all lie exactly on the line?
    answer:
      zh-cn: |-
        错。4% 是拟合值，是市场收益为 2% 时这只股票收益的平均值。实际的收益还有残差 $e_i = y_i - \hat y_i$：讲义中市场收益为 2% 的那个月，股票收益是 3%，残差为 −1。回归描述的是平均关系，不是每一次都成立。
      en: |-
        False. 4% is the fitted value: the average return of the stock when the market returns 2%. Actual returns also have a residual $e_i = y_i - \hat y_i$: in the lesson's month with a market return of 2%, the stock returned 3%, a residual of −1. A regression describes an average relationship, not one that holds every time.

  - id: C2
    kind: check
    section: ols
    concepts: [ols, regression-coefficient]
    question:
      zh-cn: |-
        在讲义的 6 个数据点中再加入一个远离其他点的点：$x = 10$，$y = -5$。最小二乘直线会：
      en: |-
        Add to the lesson's 6 data points one point far from the others: $x = 10$, $y = -5$. The least-squares line:
    choices:
      - zh-cn: 明显改变，斜率变小
        en: Changes a lot, with a smaller slope
      - zh-cn: 几乎不变，因为只多了一个点
        en: Hardly changes, because only one point was added
        why:
          zh-cn: 最小二乘法最小化的是残差的平方和。如果直线不动，这个点的残差有多大，它的平方呢？
          en: Least squares minimizes the sum of squared residuals. If the line stayed put, how large would this point's residual be, and its square?
      - zh-cn: 完全不变，因为最小二乘法会忽略异常的点
        en: Does not change at all, because least squares ignores unusual points
        why:
          zh-cn: 最小二乘的目标函数里，每个点都出现吗？它对远离直线的点是惩罚得更轻还是更重？
          en: Does every point appear in the least-squares objective? Does it penalize points far from the line less or more?
      - zh-cn: 斜率变大，因为这个点的 $x$ 很大
        en: Has a larger slope, because this point's $x$ is large
        why:
          zh-cn: 这个点的 $x$ 大，但 $y$ 是高于还是低于原来的直线在 $x = 10$ 处的值？直线要向哪个方向转才能靠近它？
          en: Its $x$ is large, but is its $y$ above or below the old line at $x = 10$? Which way must the line turn to get closer to it?
    correct: A
    answer:
      zh-cn: |-
        (A)。原来的直线在 $x = 10$ 处的拟合值是 16，这个点的残差为 −21，平方为 441，远大于其他所有残差平方之和 4。最小二乘法会把直线大幅向下转来减小它：斜率从 1.5 降到约 0.09。平方会放大大的偏离，所以 OLS 对离群的点很敏感。
      en: |-
        (A). The old line's fitted value at $x = 10$ is 16, so this point's residual would be −21, squared 441, far more than the sum of all other squared residuals, 4. Least squares turns the line down sharply to reduce it: the slope falls from 1.5 to about 0.09. Squaring magnifies large deviations, so OLS is very sensitive to outlying points.

  - id: C3
    kind: check
    section: coefficients
    concepts: [regression-coefficient]
    question:
      zh-cn: |-
        用成年人的工资（千美元）对身高（厘米）做回归，得到：工资 $= -20 + 0.4 \times$ 身高。截距 −20 表示身高为 0 的人工资为负，所以这个回归一定有错误。
      en: |-
        Regressing adults' pay (thousand dollars) on height (centimeters) gives: pay $= -20 + 0.4 \times$ height. The intercept of −20 means a person of height 0 has negative pay, so the regression must be wrong.
    correct: false
    hint:
      zh-cn: 截距是哪个 $x$ 处的拟合值？数据里有接近这个 $x$ 的观测吗？
      en: The intercept is the fitted value at which $x$? Are there observations near that $x$ in the data?
    answer:
      zh-cn: |-
        错。截距是 $x = 0$ 时的拟合值，而成年人的身高大约在 150 到 200 厘米之间，$x = 0$ 远在数据范围之外。直线只描述数据范围内的平均关系，截距在这里只是为了确定直线的位置，本身没有实际意义，不能说明回归有错。在数据范围内，例如身高 170 厘米，拟合值是 48 千美元。
      en: |-
        False. The intercept is the fitted value at $x = 0$, while adult heights lie roughly between 150 and 200 centimeters, so $x = 0$ is far outside the data. The line describes the average relationship only within the range of the data; here the intercept just fixes the position of the line and has no meaning of its own, so it does not show that the regression is wrong. Within the range, for example at 170 centimeters, the fitted value is 48 thousand dollars.

  - id: C4
    kind: check
    section: r-squared
    concepts: [r-squared, residual]
    question:
      zh-cn: |-
        把回归中 $y$ 的单位从百分数改为小数（所有 $y$ 都除以 100），$x$ 不变。$R^2$ 会：
      en: |-
        In a regression, change the unit of $y$ from percent to decimals (divide every $y$ by 100), leaving $x$ unchanged. $R^2$:
    choices:
      - zh-cn: 不变
        en: Does not change
      - zh-cn: 变为原来的 $\frac{1}{100}$
        en: Becomes $\frac{1}{100}$ of its value
        why:
          zh-cn: $R^2 = 1 - \frac{\text{SSR}}{\text{SST}}$。$y$ 除以 100 时，SSR 和 SST 各变为原来的多少？
          en: $R^2 = 1 - \frac{\text{SSR}}{\text{SST}}$. When $y$ is divided by 100, by what factor do SSR and SST change?
      - zh-cn: 变为原来的 $\frac{1}{10{,}000}$
        en: Becomes $\frac{1}{10{,}000}$ of its value
        why:
          zh-cn: 平方和确实缩小 10,000 倍，但 $R^2$ 是两个平方和的比值。比值会变吗？
          en: The sums of squares do shrink by a factor of 10,000, but $R^2$ is a ratio of two of them. Does the ratio change?
      - zh-cn: 变大，因为数值变小后残差也变小了
        en: Rises, because the residuals get smaller with smaller numbers
        why:
          zh-cn: 残差变小了，$y$ 的总变化呢？$R^2$ 比较的是哪两样东西？
          en: The residuals get smaller, but what about the total variation of $y$? What two things does $R^2$ compare?
    correct: A
    answer:
      zh-cn: |-
        (A)。$y$ 除以 100 时，残差也都除以 100，SSR 和 SST 都缩小 10,000 倍，比值不变。$R^2$ 是没有单位的比例，衡量直线解释了 $y$ 的总变化的多大部分，不受单位影响；而斜率有单位，会变为原来的 $\frac{1}{100}$。
      en: |-
        (A). Dividing $y$ by 100 divides every residual by 100 too, so SSR and SST both shrink by a factor of 10,000 and their ratio is unchanged. $R^2$ is a unit-free share of the total variation of $y$ that the line explains, so units do not affect it; the slope does have units and becomes $\frac{1}{100}$ of its value.

  - id: C5
    kind: check
    section: inference
    concepts: [standard-error, t-statistic, confidence-interval, regression-coefficient]
    question:
      zh-cn: |-
        一个回归的斜率为 1.2，标准误为 0.5，在 5% 水平上显著不为 0。这说明斜率已经估计得很精确了。
      en: |-
        A regression slope is 1.2 with a standard error of 0.5, significantly different from 0 at the 5% level. This shows the slope has been estimated precisely.
    correct: false
    hint:
      zh-cn: 写出斜率的 95% 置信区间，看看它有多宽。显著回答的是什么问题？
      en: Write down the 95% confidence interval of the slope and see how wide it is. What question does significance answer?
    answer:
      zh-cn: |-
        错。$t = 2.4 > 1.96$，所以斜率显著不为 0，但 95% 置信区间是 $1.2 \pm 1.96 \times 0.5$，即约 $[0.22, 2.18]$：斜率可能小到 0.22，也可能大到 2.18。显著只说明斜率不太可能是 0，不说明它的大小已经确定。
      en: |-
        False. $t = 2.4 > 1.96$, so the slope is significantly different from 0, but the 95% confidence interval is $1.2 \pm 1.96 \times 0.5$, about $[0.22, 2.18]$: the slope could be as small as 0.22 or as large as 2.18. Significance says only that the slope is unlikely to be 0, not that its size is pinned down.

  - id: C6
    kind: check
    section: omitted-variable
    concepts: [omitted-variable-bias]
    question:
      zh-cn: |-
        在某个城市，用房价对“到市中心的距离”做回归，得到正的斜率。回归中遗漏了房子的面积：面积越大房价越高，而离市中心越远，房子往往越大。在面积相同的情况下，距离对房价的真实作用：
      en: |-
        In a city, regressing house prices on distance from the center gives a positive slope. The regression leaves out floor area: larger houses cost more, and houses further from the center tend to be larger. With floor area held the same, the true effect of distance on price:
    choices:
      - zh-cn: 比回归的斜率小，可能是负的
        en: Is smaller than the regression slope and may be negative
      - zh-cn: 比回归的斜率大，一定是正的
        en: Is larger than the regression slope and certainly positive
        why:
          zh-cn: 遗漏的面积对房价的作用是正的，它与距离的协方差也是正的。偏差项 $\beta_2 \frac{\text{Cov}}{\text{Var}}$ 的符号是什么？它让回归的斜率偏高还是偏低？
          en: The omitted area has a positive effect on price, and its covariance with distance is positive. What is the sign of the bias term $\beta_2 \frac{\text{Cov}}{\text{Var}}$? Does it push the regression slope up or down?
      - zh-cn: 与回归的斜率相同，遗漏变量只会降低 $R^2$
        en: Equals the regression slope; an omitted variable only lowers $R^2$
        why:
          zh-cn: 遗漏变量偏差不为 0 需要哪两个条件？这里两个条件都成立吗？
          en: Which two conditions make the omitted variable bias nonzero? Do both hold here?
      - zh-cn: 无法判断偏差的方向
        en: The direction of the bias cannot be determined
        why:
          zh-cn: 题目给出了面积对房价作用的符号，以及面积和距离一起变化的方向。偏差的方向由这两个符号决定。
          en: The question gives the sign of the effect of area on price and the direction in which area and distance move together. Those two signs decide the direction of the bias.
    correct: A
    answer:
      zh-cn: |-
        (A)。面积影响房价（$\beta_2 > 0$），而且和距离正相关，所以偏差项为正，距离的系数被高估。回归的正斜率有一部分来自远处的房子更大；在面积相同时，距离的真实作用很可能是负的（越远越便宜）。
      en: |-
        (A). Area affects price ($\beta_2 > 0$) and is positively correlated with distance, so the bias term is positive and the coefficient on distance is overstated. Part of the positive slope comes from larger houses further out; with area held the same, the true effect of distance is probably negative (further means cheaper).

  - id: C7
    kind: check
    section: causation
    concepts: [correlation-vs-causation, omitted-variable-bias]
    question:
      zh-cn: |-
        数据显示，持有指数基金的家庭，平均净资产比不持有的家庭高得多。这说明买指数基金会让家庭变富。
      en: |-
        Data show that households holding index funds have a much higher average net worth than those that do not. This shows that buying index funds makes households richer.
    correct: false
    hint:
      zh-cn: 是先买了基金才变富，还是先有了钱才买基金？有没有别的因素同时影响两者？
      en: Did households get rich after buying funds, or buy funds after having money? Could something else affect both?
    answer:
      zh-cn: |-
        错。相关不等于因果。可能是反向因果：家庭有了钱，才更可能去投资。也可能有共同原因：收入、受教育程度、理财知识、年龄等，同时让家庭更可能买指数基金、也更可能积累财富。数据本身不能区分这些解释。
      en: |-
        False. Correlation is not causation. It could be reverse causality: households with money are more likely to invest. Or a common cause: income, education, financial knowledge or age can make a household both more likely to buy index funds and more likely to build wealth. The data alone cannot tell these explanations apart.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [r-squared, regression-coefficient]
    question:
      zh-cn: |-
        判断真假并说明理由：一个回归的 $R^2$ 只有 0.05，说明 $x$ 对 $y$ 没有影响。
      en: |-
        Determine whether this statement is true or false, and explain: a regression with an $R^2$ of only 0.05 shows that $x$ has no effect on $y$.
    answer:
      zh-cn: |-
        假。$R^2$ 是 $y$ 的变化中由 $x$ 解释的比例。$R^2$ 低说明还有很多别的因素影响 $y$，不说明 $x$ 的作用为 0：斜率可以不小，在样本大时也可以显著。例如个股月收益中只有一小部分由某个因素解释，但这个因素对平均收益的影响仍然可能很重要。
      en: |-
        False. $R^2$ is the share of the variation of $y$ explained by $x$. A low $R^2$ means that many other factors affect $y$; it does not mean that the effect of $x$ is 0. The slope can be sizable, and with a large sample it can be significant. For example, a factor may explain only a small part of a stock's monthly returns and still matter a lot for its average return.
    rubric:
      zh-cn:
        - "结论为假。"
        - "区分“解释的比例”与“作用的大小 / 是否显著”。"
      en:
        - "States false."
        - "Distinguishes the share explained from the size or significance of the effect."

  - id: Q2
    kind: exercise
    level: A
    concepts: [regression-coefficient, correlation]
    question:
      zh-cn: |-
        判断真假并说明理由：两个回归中，A 的斜率是 2.0，B 的斜率是 0.5，所以 A 中两个变量的相关性比 B 中强。
      en: |-
        Determine whether this statement is true or false, and explain: in two regressions, the slope in A is 2.0 and the slope in B is 0.5, so the two variables in A are more strongly correlated than those in B.
    answer:
      zh-cn: |-
        假（不一定）。斜率有单位，取决于 $x$ 和 $y$ 的尺度；相关系数没有单位。由 $b = \frac{\text{Cov}(x,y)}{\text{Var}(x)}$ 和 $\rho = \frac{\text{Cov}(x,y)}{\sigma_x\sigma_y}$ 得 $b = \rho\,\frac{\sigma_y}{\sigma_x}$。$y$ 的波动大或 $x$ 的波动小时，相关性弱也可能得到大的斜率。例如把 $y$ 的单位从美元换成美分，斜率乘以 100，相关系数不变。
      en: |-
        False (not necessarily). The slope has units and depends on the scales of $x$ and $y$; the correlation has no units. From $b = \frac{\text{Cov}(x,y)}{\text{Var}(x)}$ and $\rho = \frac{\text{Cov}(x,y)}{\sigma_x\sigma_y}$ we get $b = \rho\,\frac{\sigma_y}{\sigma_x}$. When $y$ varies a lot or $x$ varies little, a weak correlation can still give a large slope. For example, measuring $y$ in cents instead of dollars multiplies the slope by 100 and leaves the correlation unchanged.
    rubric:
      zh-cn:
        - "结论为假或不一定。"
        - "说明斜率取决于尺度，最好给出 $b = \\rho\\,\\sigma_y / \\sigma_x$ 或换单位的例子。"
      en:
        - "States false or not necessarily."
        - "Explains that the slope depends on scale, ideally with $b = \\rho\\,\\sigma_y / \\sigma_x$ or an example of changing units."

  - id: Q3
    kind: exercise
    level: B
    concepts: [ols, regression-coefficient, r-squared]
    expected: { b: "1.1", a: "0.57", diff: "0.67", beta_part: "0.1" }
    question:
      zh-cn: |-
        6 个月的数据：市场月收益 $x$ = −3、−1、0、2、4、4（%），某基金月收益 $y$ = −2、−2、1、3、6、4（%）。
        (a) 求基金收益对市场收益回归的斜率和截距。
        (b) 基金的宣传说：“过去 6 个月，我们平均每月比市场多赚约 0.67 个百分点，说明我们的选股能力很强。”用回归结果把这 0.67 个百分点分成两部分：一部分来自基金承担了比市场更多的市场风险，另一部分是截距。这个结论还有什么局限？
      en: |-
        Six months of data: market monthly returns $x$ = −3, −1, 0, 2, 4, 4 (%), and a fund's monthly returns $y$ = −2, −2, 1, 3, 6, 4 (%).
        (a) Find the slope and intercept of the regression of the fund's return on the market return.
        (b) The fund's advertisement says: "Over the past 6 months we beat the market by about 0.67 percentage points a month on average, which shows our stock picking is very strong." Use the regression to split these 0.67 percentage points into two parts: one from the fund taking more market risk than the market, and the intercept. What are the limits of this conclusion?
    answer:
      zh-cn: |-
        (a) $\bar x = 1$，$\bar y \approx 1.67$。$\sum (x_i - \bar x)(y_i - \bar y) = 44$，$\sum (x_i - \bar x)^2 = 40$，$b = 1.1$，$a = 1.67 - 1.1 \times 1 \approx 0.57$。
        (b) $\bar y - \bar x \approx 0.67$。因为回归直线经过 $(\bar x, \bar y)$，$\bar y - \bar x = a + (b - 1)\bar x$：斜率为 1.1，基金随市场的波动比市场大，这部分贡献 $(1.1 - 1) \times 1 = 0.1$ 个百分点；截距贡献约 0.57 个百分点。所以多赚的部分中有一些只是因为承担了更多市场风险，在市场下跌时会变成多亏。截距才可能反映选股能力，但只有 6 个点，它的标准误很大，很可能和 0 没有显著差别；而且 6 个月里市场平均上涨，结果依赖于这段时间。要判断能力，需要更长的数据，并检验截距是否显著。
      en: |-
        (a) $\bar x = 1$ and $\bar y \approx 1.67$. $\sum (x_i - \bar x)(y_i - \bar y) = 44$ and $\sum (x_i - \bar x)^2 = 40$, so $b = 1.1$ and $a = 1.67 - 1.1 \times 1 \approx 0.57$.
        (b) $\bar y - \bar x \approx 0.67$. Because the regression line passes through $(\bar x, \bar y)$, $\bar y - \bar x = a + (b - 1)\bar x$: with a slope of 1.1 the fund swings more than the market, which contributes $(1.1 - 1) \times 1 = 0.1$ percentage points; the intercept contributes about 0.57. So part of the extra return comes only from taking more market risk and would turn into extra losses when the market falls. Only the intercept might reflect stock picking, but with 6 points its standard error is large and it is probably not significantly different from 0; and the market rose on average in these 6 months, so the result depends on that period. Judging skill needs much longer data and a test of whether the intercept is significant.
    rubric:
      zh-cn:
        - "(a) 斜率 1.1，截距约 0.57。"
        - "(b) 分成市场风险的部分约 0.1 和截距约 0.57，并指出样本太小、截距可能不显著。把 0.67 全部当作选股能力：需要订正。"
      en:
        - "(a) A slope of 1.1 and an intercept of about 0.57."
        - "(b) Splits it into about 0.1 from market risk and about 0.57 from the intercept, and points out that the sample is too small and the intercept may not be significant. Treating all 0.67 as stock-picking skill: needs revision."

  - id: Q4
    kind: exercise
    level: B
    concepts: [omitted-variable-bias]
    expected: { biased: "1" }
    question:
      zh-cn: |-
        研究者用基金的年收益 $y$ 对基金规模 $x_1$（标准化后的数值）做回归。假设真实关系为 $y = 1 - 0.5x_1 + 2x_2 + \varepsilon$，其中 $x_2$ 是基金经理的能力（无法直接观察）：能力强的经理收益高，也吸引更多资金。设 $\text{Var}(x_1) = 4$，$\text{Cov}(x_1, x_2) = 3$。
        (a) 数据很多时，只用规模做回归，斜率接近多少？一位分析师据此说：“基金越大越好。”评价这个说法。
        (b) 要更好地估计规模本身的作用，可以用什么样的数据或比较？
      en: |-
        A researcher regresses funds' annual returns $y$ on fund size $x_1$ (in standardized units). Suppose the true relationship is $y = 1 - 0.5x_1 + 2x_2 + \varepsilon$, where $x_2$ is the manager's skill (not directly observable): skilled managers earn more and also attract more money. Let $\text{Var}(x_1) = 4$ and $\text{Cov}(x_1, x_2) = 3$.
        (a) With a lot of data, what does the slope of a regression on size alone approach? An analyst concludes: "The bigger the fund, the better." Evaluate this.
        (b) What kind of data or comparison would give a better estimate of the effect of size itself?
    answer:
      zh-cn: |-
        (a) $-0.5 + 2 \times \frac{3}{4} = 1$。回归的斜率为正，但规模本身的作用是 −0.5：基金越大，收益越低（例如大资金难以买卖小盘股）。正斜率来自遗漏的能力：能力影响收益（$\beta_2 > 0$），又与规模正相关，偏差为正，大到使符号反转。分析师把能力的作用算到了规模头上。
        (b) 例如：加入能代表能力的变量（例如基金规模扩大之前的业绩）；比较同一只基金在规模变化前后的收益，这样经理的能力基本不变；或者利用与能力无关的规模变化（例如因为外部原因突然流入或流出的资金）。
      en: |-
        (a) $-0.5 + 2 \times \frac{3}{4} = 1$. The regression slope is positive, but the effect of size itself is −0.5: bigger funds earn less (for example, large sums are hard to trade in small stocks). The positive slope comes from the omitted skill: skill affects returns ($\beta_2 > 0$) and is positively correlated with size, so the bias is positive and large enough to flip the sign. The analyst credits size with the effect of skill.
        (b) For example: add a variable that proxies for skill (such as performance before the fund grew); compare the same fund before and after its size changes, so that the manager's skill stays roughly the same; or use changes in size unrelated to skill (such as sudden inflows or outflows for outside reasons).
    rubric:
      zh-cn:
        - "(a) 斜率接近 1，并指出遗漏的能力使符号反转，规模本身的作用为负。"
        - "(b) 至少一种能排除能力影响的合理方法。"
      en:
        - "(a) A slope near 1, and points out that the omitted skill flips the sign, while the effect of size itself is negative."
        - "(b) At least one reasonable way to remove the influence of skill."

  - id: Q5
    kind: exercise
    level: C
    star: true
    concepts: [ols, first-order-condition, partial-derivative]
    question:
      zh-cn: |-
        推导普通最小二乘法的公式：对 $S(a, b) = \sum_i (y_i - a - b\,x_i)^2$ 求偏导数并令其为 0，证明 $a = \bar y - b\bar x$，$b = \frac{\sum_i (x_i - \bar x)(y_i - \bar y)}{\sum_i (x_i - \bar x)^2}$。再说明残差之和为 0。
      en: |-
        Derive the formulas of ordinary least squares: take the partial derivatives of $S(a, b) = \sum_i (y_i - a - b\,x_i)^2$, set them to 0, and show that $a = \bar y - b\bar x$ and $b = \frac{\sum_i (x_i - \bar x)(y_i - \bar y)}{\sum_i (x_i - \bar x)^2}$. Then show that the residuals add up to 0.
    answer:
      zh-cn: |-
        $\frac{\partial S}{\partial a} = -2\sum_i (y_i - a - bx_i) = 0$，即 $\sum_i e_i = 0$（残差之和为 0），两边除以 $n$ 得 $\bar y - a - b\bar x = 0$，$a = \bar y - b\bar x$。
        $\frac{\partial S}{\partial b} = -2\sum_i x_i (y_i - a - bx_i) = 0$。代入 $a$：$\sum_i x_i\big((y_i - \bar y) - b(x_i - \bar x)\big) = 0$。因为 $\sum_i \bar x (y_i - \bar y) = 0$、$\sum_i \bar x (x_i - \bar x) = 0$，可以把 $x_i$ 换成 $x_i - \bar x$，得 $\sum_i (x_i - \bar x)(y_i - \bar y) = b\sum_i (x_i - \bar x)^2$，即所求公式。
        （$S$ 是 $a, b$ 的凸二次函数，所以这个驻点是最小值。）
      en: |-
        $\frac{\partial S}{\partial a} = -2\sum_i (y_i - a - bx_i) = 0$, that is, $\sum_i e_i = 0$ (the residuals add up to 0); dividing by $n$ gives $\bar y - a - b\bar x = 0$, so $a = \bar y - b\bar x$.
        $\frac{\partial S}{\partial b} = -2\sum_i x_i (y_i - a - bx_i) = 0$. Substituting $a$: $\sum_i x_i\big((y_i - \bar y) - b(x_i - \bar x)\big) = 0$. Since $\sum_i \bar x (y_i - \bar y) = 0$ and $\sum_i \bar x (x_i - \bar x) = 0$, $x_i$ can be replaced by $x_i - \bar x$, giving $\sum_i (x_i - \bar x)(y_i - \bar y) = b\sum_i (x_i - \bar x)^2$, which is the formula.
        ($S$ is a convex quadratic function of $a$ and $b$, so this stationary point is a minimum.)
    rubric:
      zh-cn:
        - "两个一阶条件正确，并由第一个推出 $a$ 和残差之和为 0。"
        - "由第二个推出 $b$，替换 $x_i$ 为 $x_i - \\bar x$ 的一步有理由。"
      en:
        - "Both first-order conditions are correct; the first gives $a$ and the zero sum of residuals."
        - "The second gives $b$, with a reason for replacing $x_i$ by $x_i - \\bar x$."

  - id: Q6
    kind: exercise
    level: C
    concepts: [r-squared, correlation, ols]
    question:
      zh-cn: |-
        证明：只有一个自变量（并有截距）的回归中，$R^2$ 等于 $x$ 与 $y$ 的样本相关系数的平方。
      en: |-
        Prove that in a regression with one explanatory variable (and an intercept), $R^2$ equals the square of the sample correlation between $x$ and $y$.
    answer:
      zh-cn: |-
        记 $S_{xy} = \sum (x_i - \bar x)(y_i - \bar y)$，$S_{xx} = \sum (x_i - \bar x)^2$，$S_{yy} = \sum (y_i - \bar y)^2$。$\hat y_i - \bar y = b(x_i - \bar x)$，所以回归解释的平方和为 $b^2 S_{xx} = \frac{S_{xy}^2}{S_{xx}}$。
        $R^2 = \frac{b^2 S_{xx}}{S_{yy}} = \frac{S_{xy}^2}{S_{xx}S_{yy}} = \rho^2$，其中 $\rho = \frac{S_{xy}}{\sqrt{S_{xx}S_{yy}}}$ 是样本相关系数。（用到了总平方和的分解 SST = 解释部分 + SSR。）
      en: |-
        Write $S_{xy} = \sum (x_i - \bar x)(y_i - \bar y)$, $S_{xx} = \sum (x_i - \bar x)^2$ and $S_{yy} = \sum (y_i - \bar y)^2$. Since $\hat y_i - \bar y = b(x_i - \bar x)$, the explained sum of squares is $b^2 S_{xx} = \frac{S_{xy}^2}{S_{xx}}$.
        $R^2 = \frac{b^2 S_{xx}}{S_{yy}} = \frac{S_{xy}^2}{S_{xx}S_{yy}} = \rho^2$, where $\rho = \frac{S_{xy}}{\sqrt{S_{xx}S_{yy}}}$ is the sample correlation. (This uses the decomposition SST = explained part + SSR.)
    rubric:
      zh-cn:
        - "用 $\\hat y_i - \\bar y = b(x_i - \\bar x)$ 写出解释的平方和。"
        - "化简得到 $\\rho^2$。"
      en:
        - "Writes the explained sum of squares using $\\hat y_i - \\bar y = b(x_i - \\bar x)$."
        - "Simplifies to $\\rho^2$."

  - id: Q7
    kind: exercise
    level: C
    concepts: [correlation-vs-causation, omitted-variable-bias, regression-coefficient]
    question:
      zh-cn: |-
        一份报告用 30 个国家的数据做回归，发现一国的利率越低，同一年股市涨得越多，斜率显著。报告据此建议：央行降息就能让股市上涨。评估这个建议：回归结果本身说明了什么，没有说明什么？至少给出两种其他解释，并说明需要什么样的证据才能支持报告的结论。
      en: |-
        A report regresses data from 30 countries and finds that the lower a country's interest rate, the more its stock market rises in the same year, with a significant slope. The report concludes that a central bank can make the stock market rise by cutting rates. Evaluate this advice: what does the regression itself show, and what does it not show? Give at least two other explanations, and say what kind of evidence would be needed to support the report's conclusion.
    answer:
      zh-cn: |-
        回归只说明在这些国家、这段时间里，低利率和股市上涨一起出现；不说明降息是原因。
        其他解释：(1) 共同原因：经济状况、通胀等同时影响利率和股市（例如通胀低的国家利率低、股市估值也高），回归遗漏了这些变量。(2) 反向因果或同时决定：股市和经济的变化会影响央行的利率决策。(3) 只有 30 个观测，国家之间差别很大，结果可能不稳定，也可能是检验了很多变量后挑出的结果。
        需要的证据：只有利率变化、其他条件基本不变的情形（例如出乎市场意料的利率决定前后股市的反应），或者在回归中控制主要的共同原因并检验结果是否稳定。
      en: |-
        The regression only shows that, in these countries and this period, low rates and rising stock markets occurred together; it does not show that cutting rates is the cause.
        Other explanations: (1) a common cause: economic conditions, inflation and so on affect both rates and stock markets (for example, countries with low inflation have low rates and high stock valuations), and these variables are left out of the regression; (2) reverse causation or joint determination: changes in stock markets and the economy affect the central bank's rate decisions; (3) with only 30 observations and very different countries, the result may not be stable, and it may have been picked after testing many variables.
        Evidence needed: situations where only the interest rate changes and other conditions stay about the same (for example, how stock markets react around rate decisions that surprise the market), or regressions that control for the main common causes and check whether the result holds.
    rubric:
      zh-cn:
        - "指出回归只说明相关，不说明降息是原因。"
        - "给出至少两种其他解释（共同原因 / 遗漏变量、反向因果、样本小或多重检验）。"
        - "提出能支持因果结论的证据。"
      en:
        - "Points out that the regression shows correlation, not that cutting rates is the cause."
        - "Gives at least two other explanations (a common cause or omitted variable, reverse causation, a small sample or multiple testing)."
        - "Proposes evidence that could support a causal conclusion."
