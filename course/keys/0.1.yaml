# Answer key for lesson 0.1. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.4]] (lesson), [[0.1#annuity]] (section), [[concept:annuity]], [[check:Q4]].
# expected: values are recomputed by course/verify/0.1.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "0.1"

context:
  - zh-cn: |-
      本课金额以美元为单位，利率以年为单位，除非题目另有说明。学习者已经学过指数、对数和等比数列求和；还没有学 NPV（[[3.2]]）、债券定价（[[3.3]]）和股利贴现模型（[[3.9]]）。
    en: |-
      In this lesson, amounts are in dollars and rates are per year unless a question says otherwise. The learner knows exponents, logarithms and geometric series. The learner has not yet studied NPV ([[3.2]]), bond pricing ([[3.3]]) or the dividend discount model ([[3.9]]).
  - concepts: [future-value, present-value, discount-factor, compound-interest]
    zh-cn: |-
      $FV = PV(1+r)^n$，$PV = \frac{FV}{(1+r)^n}$；$\frac{1}{(1+r)^n}$ 是折现因子。
    en: |-
      $FV = PV(1+r)^n$ and $PV = \frac{FV}{(1+r)^n}$; $\frac{1}{(1+r)^n}$ is the discount factor.
  - concepts: [apr, ear, continuous-compounding]
    zh-cn: |-
      $\text{EAR} = (1 + \frac{r}{m})^m - 1$，其中 $r$ 是名义年利率（APR），$m$ 是一年的复利次数。讲义给出了连续复利 $FV = PV\,e^{rT}$，极限 $(1+\frac{r}{m})^m \to e^r$ 的证明留给练习题。讲义没有讨论 EAR 是否随 $m$ 单调增加。
    en: |-
      $\text{EAR} = (1 + \frac{r}{m})^m - 1$, where $r$ is the annual percentage rate (APR) and $m$ is the number of compounding periods per year. The lesson gives continuous compounding, $FV = PV\,e^{rT}$, and leaves the proof of the limit $(1+\frac{r}{m})^m \to e^r$ to an exercise. The lesson does not discuss whether the EAR increases with $m$.
  - concepts: [annuity, perpetuity, annuity-due, growing-perpetuity]
    zh-cn: |-
      讲义给出的公式（每期期末付款 $C$，每期利率 $r$，共 $n$ 期）：年金现值 $\frac{C}{r}[1-(1+r)^{-n}]$；年金终值 $C\frac{(1+r)^n-1}{r}$；永续年金 $\frac{C}{r}$；增长永续年金 $\frac{C}{r-g}$（$C$ 为第 1 期期末的付款）。讲义没有给出这些公式的推导，也没有给出期初年金的公式。房贷月供 $C = \frac{P\,i}{1-(1+i)^{-n}}$，$i$ 为月利率，$n$ 为月数。
    en: |-
      Formulas given in the lesson (payment $C$ at the end of each period, rate $r$ per period, $n$ periods): annuity present value $\frac{C}{r}[1-(1+r)^{-n}]$; annuity future value $C\frac{(1+r)^n-1}{r}$; perpetuity $\frac{C}{r}$; growing perpetuity $\frac{C}{r-g}$ ($C$ is the payment at the end of the first period). The lesson does not derive these formulas and does not give the formula for an annuity due. Mortgage payment: $C = \frac{P\,i}{1-(1+i)^{-n}}$, with the monthly rate $i$ and the number of months $n$.
  - questions: [Q4]
    zh-cn: |-
      讲义中的房贷例子：贷款 500,000 美元，30 年，APR 6% 按月复利，月供约 2,997.75 美元，总利息约 579,191 美元。
    en: |-
      Mortgage example in the lesson: a loan of 500,000 dollars for 30 years at an APR of 6% compounded monthly. The monthly payment is about 2,997.75 dollars and the total interest is about 579,191 dollars.
  - concepts: [simple-return, log-return]
    zh-cn: |-
      简单收益率 $R = \frac{P_1}{P_0} - 1$，多期连乘；对数收益率 $\ell = \ln\frac{P_1}{P_0}$，讲义说明多期可以相加（用 100 → 80 → 100 的例子），但没有解释原因。
    en: |-
      Simple return $R = \frac{P_1}{P_0} - 1$, which compounds by multiplication over several periods. Log return $\ell = \ln\frac{P_1}{P_0}$; the lesson states that log returns add over several periods (with the example 100 → 80 → 100) but does not explain why.

common_errors:
  - questions: [Q3]
    zh-cn: |-
      直接比较两家银行的名义年利率，忽略复利频率的不同；要比较有效年利率。
    en: |-
      Comparing the two banks' annual percentage rates directly, ignoring the different compounding; compare effective annual rates.
  - questions: [Q6]
    zh-cn: |-
      求等比数列的和时弄错项数或首项；或者以为期初年金的现值比普通年金少一期的折现，把系数 $(1+r)$ 乘反成除。
    en: |-
      Getting the number of terms or the first term of the geometric series wrong; or dividing by $(1+r)$ instead of multiplying when relating an annuity due to an ordinary annuity.
  - questions: [Q7]
    zh-cn: |-
      以为简单收益率也可以多期相加；多期的简单收益率要连乘，只有对数收益率可以相加，因为乘积的对数等于对数之和。
    en: |-
      Thinking simple returns over several periods can be added; they must be multiplied, and only log returns add, because the log of a product is the sum of the logs.
  - questions: [Q1]
    zh-cn: |-
      以为复利越频繁，有效年利率可以无限增大。它随复利频率增大，但有上限 $e^r - 1$。
    en: |-
      Thinking that more frequent compounding can raise the effective annual rate without limit. It increases with the frequency but is bounded by $e^r - 1$.
  - questions: [Q2]
    zh-cn: |-
      以为 $g \ge r$ 时公式 $\frac{C}{r-g}$ 仍然适用；这时各期现值不减小，级数发散，公式不成立。
    en: |-
      Thinking that $\frac{C}{r-g}$ still applies when $g \ge r$; then the present values of the payments do not shrink, the series diverges, and the formula does not hold.
  - questions: [Q4]
    zh-cn: |-
      把不同时间付的钱直接相加来比较成本，例如把 30 年房贷的月供合计与贷款额比较。
    en: |-
      Comparing costs by adding up money paid at different dates, for example comparing the sum of 30 years of mortgage payments with the loan.
  - questions: [Q5]
    zh-cn: |-
      以为 1% 和 0.05% 的年费率差别很小；复利使费率的差距随时间放大。
    en: |-
      Thinking that annual fees of 1% and 0.05% differ little; compounding magnifies the difference over time.
  - questions: [Q4]
    zh-cn: |-
      按月付款却用年利率和年数代入年金公式：每月付款时，利率要用月利率，期数要用月数。
    en: |-
      Using the annual rate and the number of years in the annuity formula for monthly payments: with monthly payments, the rate must be the monthly rate and the number of periods must be the number of months.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: fv-pv
    concepts: [present-value]
    question:
      zh-cn: |-
        年利率从 5% 升到 6%。下面哪一笔未来的钱，现值下降的比例最大？
      en: |-
        The annual interest rate rises from 5% to 6%. Which of these future amounts loses the largest share of its present value?
    choices:
      - zh-cn: 1 年后的 100 美元
        en: 100 dollars in 1 year
        why:
          zh-cn: 1 年后的钱只折现一年。想一想折现的年数越多，利率的变化会被放大还是缩小。
          en: Money in 1 year is discounted for only one year. Think about whether more years of discounting magnify or shrink the effect of a rate change.
      - zh-cn: 10 年后的 100 美元
        en: 100 dollars in 10 years
        why:
          zh-cn: 它比 1 年后的钱受影响更大，但选项中还有折现年数更多的。
          en: It is affected more than money in 1 year, but another option is discounted for more years.
      - zh-cn: 30 年后的 100 美元
        en: 100 dollars in 30 years
      - zh-cn: 三笔下降的比例相同，因为利率都只升了 1 个百分点
        en: All three fall by the same share, because the rate rose by only 1 percentage point for each
        why:
          zh-cn: 折现因子是 $\frac{1}{(1+r)^n}$。利率的变化对它的影响和 $n$ 有没有关系？
          en: The discount factor is $\frac{1}{(1+r)^n}$. Does the effect of a rate change on it depend on $n$?
    correct: C
    answer:
      zh-cn: |-
        (C)。折现因子 $\frac{1}{(1+r)^n}$ 中，利率的作用要乘 $n$ 次：现值变为原来的 $\left(\frac{1.05}{1.06}\right)^n$。1 年后的钱下降约 0.9%，10 年后约 9%，30 年后约 25%。越远的现金流，现值对利率越敏感。
      en: |-
        (C). In the discount factor $\frac{1}{(1+r)^n}$ the rate acts $n$ times: the present value is multiplied by $\left(\frac{1.05}{1.06}\right)^n$. Money in 1 year loses about 0.9%, in 10 years about 9%, in 30 years about 25%. The further away a cash flow is, the more sensitive its present value is to the rate.

  - id: C2
    kind: check
    section: compounding
    concepts: [apr, ear]
    question:
      zh-cn: |-
        两笔贷款的名义年利率（APR）都是 12%，一笔按月计息，一笔按年计息。按月计息的贷款，一年实际付的利息更多。
      en: |-
        Two loans both have an annual percentage rate (APR) of 12%; one charges interest monthly and the other yearly. The loan with monthly interest costs more interest over a year.
    correct: true
    hint:
      zh-cn: 想一想第一个月的利息，在之后的月份里会不会继续计息。
      en: Think about whether the first month's interest itself earns interest in the following months.
    answer:
      zh-cn: |-
        对。按月计息时，每月的利息计入欠款，以后的月份也要计息，有效年利率为 $1.01^{12} - 1 \approx 12.68\%$，高于按年计息的 12%。APR 相同不代表实际成本相同，比较要看有效年利率。
      en: |-
        True. With monthly interest, each month's interest is added to the balance and is charged interest in later months, so the effective annual rate is $1.01^{12} - 1 \approx 12.68\%$, above the 12% of yearly interest. The same APR does not mean the same actual cost; compare effective annual rates.

  - id: C3
    kind: check
    section: annuity
    concepts: [annuity, present-value]
    question:
      zh-cn: |-
        折现率 10%。每年末收 100 美元、共 20 年的年金，现值是每年末收 100 美元、共 10 年的年金的两倍。
      en: |-
        The discount rate is 10%. An annuity paying 100 dollars at the end of each year for 20 years has twice the present value of one paying 100 dollars a year for 10 years.
    correct: false
    hint:
      zh-cn: 后 10 年的付款和前 10 年的付款，折现到今天值得一样多吗？
      en: Are the payments of the second 10 years worth as much today as those of the first 10 years?
    answer:
      zh-cn: |-
        错。后 10 年的每笔付款都要多折现 10 年，今天的价值只有前 10 年对应付款的 $\frac{1}{1.1^{10}} \approx 0.39$ 倍。20 年年金的现值约 851.36 美元，10 年年金约 614.46 美元，只多出约 39%。付款的笔数加倍，现值远不到两倍。
      en: |-
        False. Each payment of the second 10 years is discounted for 10 more years, so today it is worth only $\frac{1}{1.1^{10}} \approx 0.39$ times the matching payment of the first 10 years. The 20-year annuity is worth about 851.36 dollars and the 10-year one about 614.46 dollars, only about 39% more. Twice as many payments give far less than twice the present value.

  - id: C4
    kind: check
    section: perpetuity
    concepts: [perpetuity]
    question:
      zh-cn: |-
        折现率 10%。每年末收 100 美元、共 50 年的年金，现值已经很接近永远每年末收 100 美元的永续年金（1,000 美元）。
      en: |-
        The discount rate is 10%. An annuity paying 100 dollars at the end of each year for 50 years is already worth almost as much as a perpetuity paying 100 dollars a year forever (1,000 dollars).
    correct: true
    hint:
      zh-cn: 50 年以后的那些付款，折现到今天还值多少？
      en: How much are the payments after year 50 worth today?
    answer:
      zh-cn: |-
        对。50 年年金的现值为 $1{,}000 \times (1 - 1.1^{-50}) \approx 991.5$ 美元。永续年金比它多的，只是第 50 年以后的付款，而它们的现值合计只有 $\frac{1{,}000}{1.1^{50}} \approx 8.5$ 美元。很远的现金流折现后几乎不值钱，所以“永远”的价值是有限的。
      en: |-
        True. The 50-year annuity is worth $1{,}000 \times (1 - 1.1^{-50}) \approx 991.5$ dollars. The perpetuity adds only the payments after year 50, and together they are worth only $\frac{1{,}000}{1.1^{50}} \approx 8.5$ dollars today. Very distant cash flows are worth almost nothing after discounting, which is why "forever" has a finite value.

  - id: C5
    kind: check
    section: growing-perpetuity
    concepts: [growing-perpetuity]
    question:
      zh-cn: |-
        一项资产今天刚付了 5,000 美元，以后每年末付款，每年增长 2%，永远持续。用 $\frac{C}{r-g}$ 计算以后所有付款的现值时，$C$ 应该代入：
      en: |-
        An asset has just paid 5,000 dollars today; from now on it pays at the end of each year, growing 2% a year, forever. When using $\frac{C}{r-g}$ to value all the future payments, $C$ should be:
    choices:
      - zh-cn: 5,000 美元
        en: 5,000 dollars
        why:
          zh-cn: 公式中的 $C$ 是哪个时点的付款？5,000 美元是在这个时点付的吗？
          en: Which date's payment is $C$ in the formula? Is the 5,000 dollars paid on that date?
      - zh-cn: 5,100 美元
        en: 5,100 dollars
      - zh-cn: $\frac{5{,}000}{1.02}$ 美元
        en: $\frac{5{,}000}{1.02}$ dollars
        why:
          zh-cn: 付款每年增长，下一笔付款比今天的这笔大还是小？
          en: The payments grow every year. Is the next payment larger or smaller than today's?
      - zh-cn: 5,000 美元乘以 1 加折现率
        en: 5,000 dollars times 1 plus the discount rate
        why:
          zh-cn: 付款按什么比例增长？折现率描述的是付款本身的变化吗？
          en: At what rate do the payments grow? Does the discount rate describe how the payments change?
    correct: B
    answer:
      zh-cn: |-
        (B)。公式中的 $C$ 是第 1 期期末的付款。今天的 5,000 美元已经付过，第 1 年末的付款是 $5{,}000 \times 1.02 = 5{,}100$ 美元。代入 5,000 美元会少算一年的增长。
      en: |-
        (B). $C$ in the formula is the payment at the end of the first period. Today's 5,000 dollars has already been paid; the payment at the end of year 1 is $5{,}000 \times 1.02 = 5{,}100$ dollars. Using 5,000 dollars leaves out one year of growth.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [apr, ear, continuous-compounding]
    expected: { lim: "10.52" }
    question:
      zh-cn: |-
        一款存款产品的广告说：“名义年利率 10%，每秒复利一次。复利越频繁，赚得越多；只要复利足够频繁，一年的实际收益可以要多高有多高。”这个说法对吗？复利频率无限增加时，有效年利率趋于多少？
      en: |-
        An advertisement for a savings product says: "10% annual percentage rate, compounded every second. The more often interest is compounded, the more you earn; with frequent enough compounding, the actual return in a year can be as high as you like." Is this right? What does the effective annual rate approach as the compounding frequency grows without limit?
    answer:
      zh-cn: |-
        前半句对，后半句错。复利越频繁，利息越早开始生息，$(1+\frac{r}{m})^m$ 随 $m$ 增大。但它有上限：$m \to \infty$ 时 $(1+\frac{r}{m})^m \to e^r$，所以有效年利率不超过 $e^{0.1} - 1 \approx 10.52\%$。按日复利已经是约 10.52%，再频繁也几乎不再增加。
      en: |-
        The first half is right and the second wrong. The more often interest is compounded, the earlier it starts to earn interest, so $(1+\frac{r}{m})^m$ increases with $m$. But it has a limit: as $m \to \infty$, $(1+\frac{r}{m})^m \to e^r$, so the effective annual rate cannot exceed $e^{0.1} - 1 \approx 10.52\%$. Daily compounding already gives about 10.52%, and more frequent compounding adds almost nothing.
    rubric:
      zh-cn:
        - "指出 EAR 随复利频率增大，但有上限 $e^r - 1 \\approx 10.52\\%$。只说“越频繁越高”而没有指出上限：需要订正。"
      en:
        - "Points out that the EAR increases with the compounding frequency but has the limit $e^r - 1 \\approx 10.52\\%$. Saying only that more frequent compounding gives more, without the limit: needs revision."

  - id: Q2
    kind: exercise
    level: A
    concepts: [growing-perpetuity, geometric-series]
    question:
      zh-cn: |-
        判断真假并说明理由：当 $g \ge r$ 时，公式 $\frac{C}{r-g}$ 说明增长永续年金的价值是无穷大。
      en: |-
        Determine whether this statement is true or false, and explain: when $g \ge r$, the formula $\frac{C}{r-g}$ shows that the value of a growing perpetuity is infinite.
    answer:
      zh-cn: |-
        假。$g = r$ 时公式没有定义，$g > r$ 时公式给出负数，都不能说明价值是无穷大。
        公式来自等比数列 $\sum_{t \ge 1} \frac{C(1+g)^{t-1}}{(1+r)^t}$ 的求和，只在公比 $\frac{1+g}{1+r} < 1$ 时成立。$g \ge r$ 时每一项都不小于 $\frac{C}{1+r}$，和发散到无穷大，但这是级数本身的结论，公式在这时已经不适用。现实中也没有资产能永远以不低于折现率的速度增长。
      en: |-
        False. When $g = r$ the formula is undefined, and when $g > r$ it gives a negative number; neither shows that the value is infinite.
        The formula comes from summing the geometric series $\sum_{t \ge 1} \frac{C(1+g)^{t-1}}{(1+r)^t}$ and holds only when the ratio $\frac{1+g}{1+r} < 1$. When $g \ge r$, every term is at least $\frac{C}{1+r}$ and the sum diverges to infinity, but that is a conclusion about the series itself; the formula no longer applies. In reality, no asset can grow forever at a rate at least as high as the discount rate.
    rubric:
      zh-cn:
        - "结论为假。"
        - "指出公式只在公比小于 1（$g < r$）时成立；$g \\ge r$ 时级数发散，公式不适用。"
      en:
        - "States false."
        - "Points out that the formula holds only when the ratio is less than 1 ($g < r$); when $g \\ge r$ the series diverges and the formula does not apply."

  - id: Q3
    kind: exercise
    level: B
    concepts: [ear, apr]
    expected: { ear_A: "5.127", ear_B: "5.10" }
    question:
      zh-cn: |-
        银行 A 的存款名义年利率 5.0%，按日复利（一年 365 天）；银行 B 的名义年利率 5.1%，按年复利。哪家更好？计算两者的有效年利率。
      en: |-
        Bank A offers a deposit rate with an APR of 5.0%, compounded daily (365 days a year). Bank B offers an APR of 5.1%, compounded once a year. Which is better? Compute the effective annual rate of each.
    answer:
      zh-cn: |-
        A：$(1 + \frac{0.05}{365})^{365} - 1 \approx 5.127$%；B：5.10%。A 更好。
      en: |-
        A: $(1 + \frac{0.05}{365})^{365} - 1 \approx 5.127$%; B: 5.10%. A is better.
    rubric:
      zh-cn:
        - "两个 EAR 都正确。"
        - "按 EAR 而不是 APR 比较，结论为 A 更好。"
      en:
        - "Both EARs are correct."
        - "Compares by EAR, not by APR, and concludes that A is better."

  - id: Q4
    kind: exercise
    level: B
    concepts: [annuity, apr]
    expected: { pv: "500000" }
    question:
      zh-cn: |-
        贷款 500,000 美元，30 年，名义年利率 6%，按月还款。讲义算出月供约 2,997.75 美元，360 个月共还约 1,079,191 美元。一位朋友说：“利息比本金还多，30 年房贷让你多付了一倍多的钱。手里有现金的话，应该一次性付清。”
        (a) 按每月 0.5% 折现，这 360 笔月供今天合计值多少？朋友的比较错在哪里？
        (b) 在什么条件下，用手里的现金提前还清这笔贷款更好？
      en: |-
        A loan of 500,000 dollars for 30 years at an annual percentage rate of 6%, repaid monthly. The lesson finds a monthly payment of about 2,997.75 dollars, about 1,079,191 dollars in total over 360 months. A friend says: "The interest is more than the loan itself, so a 30-year mortgage makes you pay more than twice as much. If you have the cash, pay it all at once."
        (a) Discounted at 0.5% a month, what are the 360 payments worth today in total? What is wrong with the friend's comparison?
        (b) Under what condition is it better to use your cash to repay this loan early?
    answer:
      zh-cn: |-
        (a) 月供正是按“所有月供按贷款利率折现后等于贷款额”算出来的，所以现值正好是 500,000 美元。朋友把 30 年里不同时间付的钱直接相加，忽略了货币时间价值：30 年后的 2,997.75 美元远不如今天的 2,997.75 美元值钱。按贷款利率折现，分期付款和一次付清的代价相同。
        (b) 提前还款相当于得到 6% 的确定收益（省下的利息）。如果这笔现金能得到的、风险相近的收益低于 6%（例如国债利率只有 4%），提前还清更好；如果能稳定地得到高于 6% 的收益，保留贷款更好。还要考虑保留现金应急的需要，以及房贷利息可能有的税收抵扣。
      en: |-
        (a) The payment is found exactly so that all payments, discounted at the loan rate, equal the loan, so their present value is exactly 500,000 dollars. The friend adds up money paid at different dates over 30 years, ignoring the time value of money: 2,997.75 dollars in 30 years is worth far less than 2,997.75 dollars today. At the loan rate, paying over time and paying at once cost the same.
        (b) Repaying early is like earning a sure 6% (the interest saved). If the cash would earn less than 6% at similar risk (for example, Treasury bonds pay only 4%), repaying is better; if it could reliably earn more than 6%, keeping the loan is better. The need to keep cash for emergencies and any tax deduction for mortgage interest also matter.
    rubric:
      zh-cn:
        - "(a) 现值为 500,000，并指出不同时间的钱不能直接相加。"
        - "(b) 把贷款利率和这笔钱在风险相近时能得到的收益比较。"
      en:
        - "(a) A present value of 500,000, and points out that money at different dates cannot simply be added."
        - "(b) Compares the loan rate with what the money could earn at similar risk."

  - id: Q5
    kind: exercise
    level: B
    concepts: [future-value, compound-interest]
    expected: { less: "23.5" }
    question:
      zh-cn: |-
        两只跟踪同一指数的基金，扣费前的年收益都是 7%，年费率分别为 1.00% 和 0.05%（费用直接从年收益中扣除）。一次性投入 10,000 美元，30 年后高费率基金的终值比低费率基金少百分之几？如果改成每年定投，费率造成的差距会更大还是更小？为什么？
      en: |-
        Two funds track the same index. Before fees, both return 7% a year. Their annual fees are 1.00% and 0.05% (the fee is subtracted directly from the annual return). You invest 10,000 dollars once. After 30 years, by what percentage is the future value of the high-fee fund lower than that of the low-fee fund? If you invested every year instead, would the gap caused by fees be larger or smaller? Why?
    answer:
      zh-cn: |-
        终值之比为 $\left(\frac{1.06}{1.0695}\right)^{30} \approx 0.765$，高费率基金少约 23.5%（以低费率基金为基数）。
        每年定投时差距更小（每年年初定投时约少 16.3%），因为后投入的钱复利的时间短，费率拖累的年数也少。
      en: |-
        The ratio of future values is $\left(\frac{1.06}{1.0695}\right)^{30} \approx 0.765$, so the high-fee fund ends about 23.5% lower (relative to the low-fee fund).
        With yearly investments the gap is smaller (about 16.3% lower when investing at the start of each year), because money invested later compounds for fewer years, so the fee reduces it for fewer years.
    rubric:
      zh-cn:
        - "扣费后收益为 6% 和 6.95%，终值之比约 0.765。"
        - "“少百分之几”以低费率基金为基数。"
        - "定投时差距更小，并用复利时间的长短解释。"
      en:
        - "Net returns are 6% and 6.95%, and the ratio of future values is about 0.765."
        - "\"How much lower\" uses the low-fee fund as the base."
        - "With yearly investments the gap is smaller, explained by the shorter time that later money compounds."

  - id: Q6
    kind: exercise
    level: C
    star: true
    concepts: [annuity, annuity-due, perpetuity, geometric-series]
    question:
      zh-cn: |-
        推导普通年金的现值公式 $PV = \frac{C}{r}[1-(1+r)^{-n}]$，再由它推出年金终值公式和期初年金的现值公式。
      en: |-
        Derive the present value of an ordinary annuity, $PV = \frac{C}{r}[1-(1+r)^{-n}]$. Then use it to derive the future value of an annuity and the present value of an annuity due.
    answer:
      zh-cn: |-
        现值：$PV = \sum_{t=1}^{n} \frac{C}{(1+r)^t}$ 是首项 $\frac{C}{1+r}$、公比 $\frac{1}{1+r}$ 的等比数列，求和得 $\frac{C}{r}[1-(1+r)^{-n}]$。也可以看成两个永续年金之差：从第 1 期起的永续年金 $\frac{C}{r}$，减去从第 $n+1$ 期起的永续年金，后者的现值为 $\frac{C}{r}(1+r)^{-n}$。
        终值：$FV = PV(1+r)^n = C\frac{(1+r)^n-1}{r}$。
        期初年金：每笔付款都早一期，少折现一次，所以 $PV_{\text{期初}} = (1+r)\,PV_{\text{普通}}$。
      en: |-
        Present value: $PV = \sum_{t=1}^{n} \frac{C}{(1+r)^t}$ is a geometric series with first term $\frac{C}{1+r}$ and ratio $\frac{1}{1+r}$; its sum is $\frac{C}{r}[1-(1+r)^{-n}]$. It can also be seen as the difference of two perpetuities: a perpetuity starting in period 1, worth $\frac{C}{r}$, minus a perpetuity starting in period $n+1$, worth $\frac{C}{r}(1+r)^{-n}$ today.
        Future value: $FV = PV(1+r)^n = C\frac{(1+r)^n-1}{r}$.
        Annuity due: each payment comes one period earlier and is discounted once less, so $PV_{\text{due}} = (1+r)\,PV_{\text{ordinary}}$.
    rubric:
      zh-cn:
        - "现值推导正确（等比数列求和或两个永续年金之差）。"
        - "由现值推出终值。"
        - "期初年金为普通年金的 $(1+r)$ 倍，并说明原因。"
      en:
        - "The derivation of the present value is correct (a geometric series or the difference of two perpetuities)."
        - "Derives the future value from the present value."
        - "The annuity due is $(1+r)$ times the ordinary annuity, with the reason."

  - id: Q7
    kind: exercise
    level: C
    concepts: [continuous-compounding, log-return, logarithm, derivative]
    question:
      zh-cn: |-
        证明 $\lim_{m\to\infty}\left(1+\frac{r}{m}\right)^m = e^r$，并解释为什么多期的对数收益率可以相加。
      en: |-
        Prove that $\lim_{m\to\infty}\left(1+\frac{r}{m}\right)^m = e^r$, and explain why log returns over several periods can be added.
    answer:
      zh-cn: |-
        取对数：$m\ln(1+\frac{r}{m})$。令 $x = \frac{r}{m}$，则它等于 $r \cdot \frac{\ln(1+x)}{x}$。$m \to \infty$ 时 $x \to 0$，而 $\lim_{x\to0}\frac{\ln(1+x)}{x}$ 正是 $\ln t$ 在 $t = 1$ 处的导数，等于 1。所以对数趋于 $r$，由 $e^x$ 的连续性，原式趋于 $e^r$。
        对数收益率：$\ln\frac{P_2}{P_0} = \ln\left(\frac{P_2}{P_1}\cdot\frac{P_1}{P_0}\right) = \ln\frac{P_2}{P_1} + \ln\frac{P_1}{P_0}$。多期的价格比是各期价格比的乘积，对数把乘法变成加法。
      en: |-
        Take logarithms: $m\ln(1+\frac{r}{m})$. Let $x = \frac{r}{m}$; then this equals $r \cdot \frac{\ln(1+x)}{x}$. As $m \to \infty$, $x \to 0$, and $\lim_{x\to0}\frac{\ln(1+x)}{x}$ is the derivative of $\ln t$ at $t = 1$, which is 1. So the logarithm tends to $r$, and by the continuity of $e^x$ the expression tends to $e^r$.
        Log returns: $\ln\frac{P_2}{P_0} = \ln\left(\frac{P_2}{P_1}\cdot\frac{P_1}{P_0}\right) = \ln\frac{P_2}{P_1} + \ln\frac{P_1}{P_0}$. The price ratio over several periods is the product of the ratios of each period, and the logarithm turns multiplication into addition.
    rubric:
      zh-cn:
        - "极限的证明完整，关键的一步有理由（导数定义、洛必达法则或泰勒展开均可）。"
        - "用对数的性质说明对数收益率可加。"
      en:
        - "The proof of the limit is complete, and the key step is justified (by the definition of the derivative, L'Hôpital's rule or a Taylor expansion)."
        - "Uses a property of logarithms to show that log returns add."
