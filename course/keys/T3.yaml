# Answer key for comprehensive quiz T3 (Stages 5–6: derivatives and alternative assets, household
# investing in practice). Shown to learners only inside the generated grading prompt.
# The quiz page shows only the questions. Each question is marked ok or revise.
# expected: values are recomputed by course/verify/T3.py in CI and must appear verbatim in every answer text.
# Each question tests a different idea, most combine lessons from more than one stage, and each names
# the misconception it can reveal (common_errors).

lesson: "T3"

context:
  - zh-cn: |-
      综合测验三考 [[5.1]] 到 [[6.13]]：衍生品与另类资产、家庭投资实践，也可以用到第 0–4 阶段的工具。题目大多结合了不同阶段的内容，题干是一个情境，不说明要用哪个概念；重点是能否认出适用的概念、建立简单的模型并得出结论，计算很少。学习者可以用计算器或代码，卷首有公式表：年金现值、Fisher 方程；持有成本模型 $F = S e^{(r - q)T}$、抛补利率平价、最小方差对冲比率；看涨–看跌平价、Black–Scholes 公式；互换利率；费用使期末财富减少的比例 $\approx 1 - e^{-fT}$；增长年金现值；资金充足率；夏普比率、两项资产组合的方差、alpha 的 t 值 $\approx IR\sqrt{T}$。其中有些公式没有题用到。题目中的税率等制度按 2026 年的美国规定。批改时，推理和理由比算术更重要。
    en: |-
      Comprehensive quiz T3 covers [[5.1]] to [[6.13]]: derivatives and alternative assets, and household investing in practice; tools from Stages 0–4 may also be used. Most questions combine material from different stages; each stem is a situation that does not say which concept to use. What matters is whether the learner recognizes the concepts that apply, builds a simple model and draws the conclusion; there is little calculation. The learner may use a calculator or code, and the quiz starts with a formula sheet: the present value of an annuity, the Fisher equation; the cost-of-carry model $F = S e^{(r - q)T}$, covered interest parity, the minimum-variance hedge ratio; put–call parity, the Black–Scholes formula; the swap rate; the share of final wealth lost to fees $\approx 1 - e^{-fT}$; the present value of a growing annuity; the funded ratio; the Sharpe ratio, the variance of a two-asset portfolio, and the t-value of alpha $\approx IR\sqrt{T}$. Some of these formulas are used by no question. Tax rates and other rules in the questions are the 2026 US rules. When grading, reasoning and reasons count more than arithmetic.

common_errors:
  - questions: [Q1]
    zh-cn: |-
      以为风险中性定价说明市场认为股票的预期收益等于无风险利率，于是在估计达成目标的概率时也用无风险利率；没有分清给现金流定价（用无风险利率折现与风险中性概率是一致的）与预测结果的概率（要用真实的预期收益）。
    en: |-
      Thinking risk-neutral pricing means the market believes stocks are expected to earn the risk-free rate, and so using the risk-free rate to estimate the probability of reaching a goal; not separating pricing cash flows (where risk-free discounting and risk-neutral probabilities go together) from forecasting the probability of outcomes (which needs real expected returns).
  - questions: [Q2]
    zh-cn: |-
      以为期货只能用来投机、会增加风险，或者以为只有卖出股票才能降低股票的风险；没有看出持有股票同时卖出股指期货，按持有成本模型约等于持有短期国债。
    en: |-
      Thinking futures are only for speculation and add risk, or that only selling stock can reduce stock risk; not seeing that holding stock and selling index futures is, by the cost-of-carry model, about the same as holding Treasury bills.
  - questions: [Q3]
    zh-cn: |-
      只看投资组合中的股票和债券比例，不把按通胀调整的终身收入（社会保障金、养老金）看作家庭总财富中的一项类似债券的资产；以为用债券换来更多的终身收入使家庭更冒险。
    en: |-
      Looking only at the stock and bond shares of the portfolio, not counting inflation-adjusted lifetime income (Social Security, pensions) as a bond-like asset in total household wealth; thinking that trading bonds for more lifetime income makes the household riskier.
  - questions: [Q4]
    zh-cn: |-
      以为市场下跌后转换 Roth 是“低价买入”，回升的部分免税；没有看出传统账户中有比例为税率的部分属于政府，转换只是按市价买回这部分，价格高低不影响这笔交易是否划算，影响的是转换时和取出时的税率。
    en: |-
      Thinking a Roth conversion after a fall is "buying low" with a tax-free recovery; not seeing that a share of the traditional account equal to the tax rate belongs to the government, and that converting only buys back that share at the market price, so the price level does not make the trade better or worse; the tax rates at conversion and at withdrawal do.
  - questions: [Q5]
    zh-cn: |-
      把费用与名义收益比较，低估费用的影响（货币幻觉）；费用要从投资者实际能保留的实际收益（或超过无风险利率的部分）中扣除。
    en: |-
      Comparing costs with the nominal return and so understating their effect (money illusion); costs come out of the real return the investor actually keeps (or out of the part above the risk-free rate).
  - questions: [Q6]
    zh-cn: |-
      把卖出期权的策略在没有发生大跌的样本中的高夏普比率当作能力或低风险的证据；不知道这种收益是承担少见大跌的补偿，分布左偏、尾部很厚，样本中的波动率低估了风险。
    en: |-
      Taking the high Sharpe ratio of an option-selling strategy, measured in a sample without a crash, as evidence of skill or low risk; not knowing that its return is pay for bearing rare crashes, with a left-skewed, fat-tailed distribution, so the sample volatility understates the risk.
  - questions: [Q7]
    zh-cn: |-
      机械地使用“不付股息的股票的美式看涨期权不应提前行权”，不问它的条件（持有者可以卖出期权或对冲）；或者反过来，为了分散风险立即行使全部期权，没有先用代价更小的办法（卖出已有的公司股票）。
    en: |-
      Applying "an American call on a non-dividend stock should never be exercised early" mechanically without asking its condition (the holder can sell or hedge the option); or the reverse, exercising all options at once to diversify without first using the cheaper way (selling company shares already held).
  - questions: [Q8]
    zh-cn: |-
      只按已投入部分的估值计算私募基金的比例，忽略未催缴的承诺是一笔必须支付的负债；以为私募基金的估值波动小，就不会影响其他目标，忽略催缴不看市场行情，而且常常在市场下跌时到来。
    en: |-
      Measuring the share of the private fund only by the value of what has been called, ignoring that the uncalled commitment is a liability that must be paid; thinking that because the fund's marks are smooth it cannot affect other goals, ignoring that capital calls ignore market conditions and often come when markets have fallen.
  - questions: [Q9]
    zh-cn: |-
      以为免赔额越低越安全、多付保费总是值得；不比较多付的保费与多得到的预期赔付，也不考虑对有应急基金的家庭来说，几千美元的损失带来的风险成本很小。
    en: |-
      Thinking a lower deductible is always safer and the extra premium always worth it; not comparing the extra premium with the extra expected payout, and not considering that for a household with an emergency fund a loss of a few thousand dollars carries a very small cost of risk.
  - questions: [Q10]
    zh-cn: |-
      相信“不用付期权费”的下跌保护是免费的；没有把产品拆成指数、买入的看跌期权和卖出的看涨期权，看不出保护的代价是放弃的上涨和股息。
    en: |-
      Believing that downside protection "with no option premium" is free; not breaking the product into the index, the puts bought and the calls sold, and so not seeing that the protection is paid for with the upside and the dividends given up.
  - questions: [Q11]
    zh-cn: |-
      以为有死亡率收益，年金对每个人都比自己准备便宜；不知道年金的价格按购买年金的人群（往往比平均更长寿）的寿命确定，对预期寿命短的人并不划算。
    en: |-
      Thinking that because of mortality credits an annuity is cheaper than providing for oneself for everyone; not knowing that annuity prices are set by the lifespans of the people who buy annuities (often longer than average), so they are a poor deal for someone with a short life expectancy.
  - questions: [Q12]
    zh-cn: |-
      把远期汇率高于即期汇率看作锁定汇率的成本，或者以为美元利率更高就能多赚；不知道远期升水只是两国利差（抛补利率平价），也不知道对一个以欧元计价的目标，美元国债并不是无风险资产。
    en: |-
      Seeing a forward rate above the spot rate as a cost of locking in the exchange rate, or thinking the higher dollar rate earns extra; not knowing the forward premium is only the interest-rate gap (covered interest parity), and not knowing that for a goal priced in euros, dollar Treasuries are not the riskless asset.

questions:
  - id: Q1
    kind: quiz
    part: judge
    concepts: [risk-neutral-pricing, funded-ratio, monte-carlo-simulation, capital-market-assumptions]
    question:
      zh-cn: |-
        一位理财规划师说：“期权的价格是按股票的预期收益等于无风险利率算出来的，市场就是这样定价的。所以我估计客户 20 年后达成退休目标的概率时，也假设股票的预期收益等于无风险利率，这样最符合市场。”
      en: |-
        A financial planner says: "Option prices are computed as if the expected return on stocks equals the risk-free rate; that is how the market prices them. So when I estimate the probability that a client reaches a retirement goal in 20 years, I also assume stocks are expected to earn the risk-free rate, because that is most consistent with the market."
    answer:
      zh-cn: |-
        假。风险中性定价是一种计算价格的方法，不是对真实结果的预测。期权可以用股票和借款复制，所以它的价格不取决于股票的真实预期收益；按风险中性概率求期望、再按无风险利率折现，与按真实概率求期望、再按包含风险溢价的折现率折现，得到同样的价格。风险中性概率把坏结果的权重调高了，它反映的是价格，而不是事件发生的可能性。估计达成目标的概率，问的是真实世界中结果的分布，要用资本市场假设中的真实预期收益（包含股权溢价）和波动率，例如在蒙特卡洛模拟中。假设预期收益等于无风险利率，会系统地低估股票较多的组合达成目标的概率。不过，规划师的想法有一半是对的：计算目标的现值和资金充足率时，用无风险利率折现，正与市场的定价方法一致。
      en: |-
        False. Risk-neutral pricing is a way to compute prices, not a forecast of actual outcomes. An option can be replicated with stock and borrowing, so its price does not depend on the stock's true expected return; taking expectations under risk-neutral probabilities and discounting at the risk-free rate gives the same price as taking expectations under true probabilities and discounting at a rate that includes a risk premium. Risk-neutral probabilities put more weight on bad outcomes; they reflect prices, not how likely events are. The probability of reaching a goal is a question about the distribution of outcomes in the real world, so it needs the true expected returns (including the equity premium) and volatilities of the capital market assumptions, for example in a Monte Carlo simulation. Assuming an expected return equal to the risk-free rate systematically understates the probability of success for portfolios with more stock. The planner is half right, though: computing the present value of a goal and the funded ratio by discounting at the risk-free rate is consistent with how the market prices cash flows.
    rubric:
      zh-cn:
        - "通过：判断为假，并说明风险中性概率是定价工具，价格不依赖真实的预期收益；估计达成的概率要用真实的预期收益（包含风险溢价）。只说“股票的预期收益高于无风险利率”而不说明定价与预测的区别，或只写“假”，需要订正。（指出计算目标现值时用无风险利率是对的，是加分的讨论。）"
      en:
        - "OK: false, explaining that risk-neutral probabilities are a pricing device, that prices do not depend on true expected returns, and that the probability of success needs true expected returns (including the risk premium). Saying only that stocks are expected to earn more than the risk-free rate without the difference between pricing and forecasting, or only false, needs revision. (Noting that discounting the goal at the risk-free rate is right is a welcome extra.)"

  - id: Q2
    kind: quiz
    part: judge
    concepts: [futures-contract, cost-of-carry, rebalancing, long-term-capital-gain]
    question:
      zh-cn: |-
        一个家庭有 100 万美元，股票指数基金占 70%，大部分在应税账户中，有大量未实现的利得。他们希望把股票降到 60%，但打算等明年 1 月一方退休、收入降低后再卖出股票，那时长期资本利得税率较低。顾问建议：现在卖出名义金额约 10 万美元的标普 500 指数期货（他们的基金跟踪标普 500），明年卖出股票时再平仓。他说：“在这几个月里，你们组合的风险和预期收益，与现在就卖出 10 万美元股票、买入短期国债几乎相同。”
      en: |-
        A household has 1 million dollars, 70% in a stock index fund, mostly in a taxable account with large unrealized gains. They want to bring stocks down to 60%, but plan to sell the stock next January, when one of them retires, their income falls and their long-term capital gains tax rate is lower. An adviser suggests selling S&P 500 index futures with a notional value of about 100,000 dollars now (their fund tracks the S&P 500) and closing the futures when they sell the stock next year. He says: "During these months, the risk and expected return of your portfolio will be almost the same as if you sold 100,000 dollars of stock now and bought Treasury bills."
    answer:
      zh-cn: |-
        真。按持有成本模型，指数期货的价格约为 $F = S e^{(r - q)T}$。持有 10 万美元股票、同时卖出同样名义金额的期货，到期时股票价格的涨跌被期货的盈亏抵消，这个组合得到股息 $q$，再加上期货价格高于现货的部分 $r - q$，合计约为无风险利率 $r$，与短期国债相同。所以这 10 万美元的股票风险被移除了，组合约相当于 60% 股票。区别很小：期货要逐日结算，需要留出现金应付保证金（股票上涨时要补交）；合约大小固定，名义金额只能大致对上；基金与指数之间有少量基差。期货的盈亏每年按市价计税，但股票的利得推迟到明年按较低税率实现，这正是这个做法的目的。
      en: |-
        True. By the cost-of-carry model, the index futures price is about $F = S e^{(r - q)T}$. Holding 100,000 dollars of stock and selling futures with the same notional value, the stock's price changes are offset by the futures gains and losses; the combination earns the dividend $q$ plus the excess of the futures price over spot, $r - q$, about the risk-free rate $r$ in total, the same as Treasury bills. So the stock risk of these 100,000 dollars is removed, and the portfolio is about 60% stock. The differences are small: futures are settled daily, so cash must be kept for margin (more is needed if stocks rise); contracts have a fixed size, so the notional value matches only roughly; and there is a little basis between the fund and the index. Futures gains and losses are taxed each year at market value, but the gains on the stock are postponed to next year at a lower rate, which is the point of the plan.
    rubric:
      zh-cn:
        - "通过：判断为真，并用持有成本模型（或套利关系）说明股票加上卖出的期货约等于无风险资产，收益约为无风险利率；提到保证金、合约大小或基差等小的差别更好。只说“期货可以对冲”而没有说明为什么收益等于无风险利率，或只写“真”，需要订正。认为期货一定增加风险而判断为假，需要订正。"
      en:
        - "OK: true, using the cost-of-carry model (or the arbitrage relation) to explain that stock plus the futures sold is about a riskless asset earning about the risk-free rate; mentioning small differences such as margin, contract size or basis is a plus. Saying only that futures can hedge without explaining why the return equals the risk-free rate, or only true, needs revision. Judging it false because futures must add risk needs revision."

  - id: Q3
    kind: quiz
    part: judge
    concepts: [human-capital, household-balance-sheet, full-retirement-age, strategic-asset-allocation]
    question:
      zh-cn: |-
        一位 62 岁的单身退休者有 120 万美元，股票和债券各一半。他决定推迟到 70 岁才领取社会保障金，在这 8 年里用组合中的债券支付生活费，所以 70 岁时组合中的股票比例会远高于 50%。他的顾问说：“如果把社会保障金也算进来，你的整体财富并没有因此变得更冒险；到时不一定要卖出股票、把组合调回 50/50。”
      en: |-
        A single 62-year-old retiree has 1.2 million dollars, half in stocks and half in bonds. He decides to wait until 70 to claim Social Security and to pay his living costs during these 8 years from the portfolio's bonds, so at 70 the stock share of his portfolio will be far above 50%. His adviser says: "If you count Social Security too, your overall wealth has not become riskier; you will not necessarily need to sell stocks to bring the portfolio back to 50/50."
    answer:
      zh-cn: |-
        真。推迟领取社会保障金，相当于用这 8 年少领的钱（这里由组合中的债券支付）买入一份更大的、按通胀调整的终身收入。这份收入就像一份没有违约风险的实际年金，在家庭总财富中是一项类似债券（甚至比名义债券更安全）的资产。他是用一种安全资产（债券）换了另一种安全资产（更多的社会保障金），所以总财富中安全资产的比例没有明显下降，长寿风险还降低了。如果他原来的 50/50 是按总财富中能承受的风险选的，组合中股票比例升高正好反映了这次交换，不需要卖股票再调回去；应该按包括社会保障金现值在内的总财富来判断风险。当然，如果他在乎的是组合本身的波动（例如要留给继承人的钱），或者另有大额的支出需要，可以另作考虑。
      en: |-
        True. Delaying Social Security is like using the payments forgone during these 8 years (here paid for from the portfolio's bonds) to buy a larger, inflation-adjusted lifetime income. That income is like a real annuity without default risk, a bond-like asset in total household wealth (even safer than a nominal bond). He traded one safe asset (bonds) for another (more Social Security), so the share of safe assets in total wealth does not fall much, and his longevity risk falls. If his original 50/50 was chosen for the risk his total wealth could bear, the higher stock share of the portfolio just reflects this trade, and he does not need to sell stocks to go back; risk should be judged on total wealth including the present value of Social Security. Of course, if what he cares about is the portfolio itself (for example, money for heirs), or he has other large spending needs, he can think about it separately.
    rubric:
      zh-cn:
        - "通过：判断为真，并说明推迟领取相当于用债券换取按通胀调整的终身收入，这份收入在总财富中类似债券，所以总财富的风险没有明显增加，不必按组合比例机械地调回。只按组合的股票比例判断为假，或只写“真”，需要订正。"
      en:
        - "OK: true, explaining that delaying is like trading bonds for an inflation-adjusted lifetime income that is bond-like in total wealth, so the risk of total wealth does not rise much and the portfolio need not be mechanically rebalanced. Judging false from the portfolio's stock share alone, or only true, needs revision."

  - id: Q4
    kind: quiz
    part: judge
    concepts: [roth-account, traditional-account, efficient-market-hypothesis]
    question:
      zh-cn: |-
        股市在三个月内下跌了 30%。一位投资者打算把传统 IRA 中的 10 万美元（下跌后的市值）转换为 Roth IRA，用应税账户中的现金交税。他说：“大跌之后正是转换的好时机：同样多的基金份额，现在转换交的税比三个月前少 30%，等市场回升，回升的部分全部免税。”在他转换时和退休取钱时的边际税率都相同、为 24% 的条件下，判断：在这一年里，大跌之后转换比在其他时候转换更划算。
      en: |-
        The stock market has fallen 30% in three months. An investor plans to convert 100,000 dollars (the value after the fall) in his traditional IRA to a Roth IRA, paying the tax from cash in his taxable account. He says: "Right after a crash is a good time to convert: for the same number of fund shares, I pay 30% less tax than three months ago, and when the market recovers, the whole recovery is tax-free." Assume his marginal tax rate is 24% both when he converts and when he withdraws in retirement. Judge: within this year, converting after the crash is a better deal than converting at another time.
    answer:
      zh-cn: |-
        假。传统账户中的钱，取出时要按 24% 交税，所以账户中相当于有 24% 属于政府，投资者只拥有 76%，而且这 76% 的增长本来就不用再交税。转换就是用 24% 的现金按现在的市价买回政府的那一份。价格低时，买回同样多份额花的钱少，但买到的也是同样多的、价值较低的份额；在有效市场中，现在的价格是公平的价格，以后的预期收益与其他时候相同，所以这笔交易的价值不取决于价格高低。拿三个月前比较是事后诸葛：如果那时就知道会大跌，任何投资都应该晚点买。“回升的部分全部免税”也只是一半：如果市场继续下跌，下跌的部分也由他一人承担，而不转换时政府分担了 24%。真正决定转换是否划算的是税率：转换时的税率低于取出时的税率就有利；在两者相同时，转换的好处只来自其他因素（例如用应税账户的现金交税，相当于把更多的钱放进免税账户，但这与市场是否大跌无关）。只有当大跌使他这一年的收入下降、可以在较低的税率档内转换更多份额时，时机才通过税率起作用。
      en: |-
        False. Money in a traditional account is taxed at 24% when withdrawn, so in effect 24% of the account belongs to the government and the investor owns 76%, and the growth of his 76% is already untaxed. Converting means using cash equal to 24% to buy back the government's share at today's market price. When the price is low, buying back the same number of shares costs less, but what he buys is the same number of shares, now worth less; in an efficient market, today's price is a fair price and the expected return from here is the same as at other times, so the value of this trade does not depend on the price level. Comparing with three months ago is hindsight: had he known about the crash, any investment should have been made later. "The whole recovery is tax-free" is also only half the story: if the market keeps falling, he bears the whole fall alone, whereas without converting the government shares 24% of it. What decides whether converting pays is the tax rate: it helps when the rate at conversion is below the rate at withdrawal; when the two are equal, any benefit comes from other factors (for example, paying the tax from taxable cash, which effectively puts more money in a tax-free account, but this has nothing to do with a crash). Timing matters only through tax rates: if the crash lowers his income this year, he can convert more shares within a lower tax bracket.
    rubric:
      zh-cn:
        - "通过：判断为假，并说明转换相当于按市价买回政府在账户中的份额（或者说明税率相同时转换前后的税后结果按同样的比例增长，与转换时的价格无关），低价转换只有在预期价格回升多于市场预期时才有利，那是择时；指出决定因素是税率。只说“市场可能继续下跌”，或只写“假”，需要订正。"
      en:
        - "OK: false, explaining that converting buys back the government's share of the account at the market price (or that with equal tax rates the after-tax results grow in the same proportion whatever the price at conversion), that a low-price conversion helps only if prices recover more than the market expects, which is market timing, and that tax rates are what matter. Saying only that the market may fall further, or only false, needs revision."

  - id: Q5
    kind: quiz
    part: judge
    concepts: [expense-ratio, money-illusion, fisher-equation, capital-market-assumptions]
    expected: { real: "3.41", share: "38.1" }
    question:
      zh-cn: |-
        一位理财顾问每年收取客户资产的 1%，他为客户选的基金平均费用率为 0.3%。他的资本市场假设是：今后 10 年客户 60/40 组合的名义收益率为每年 6%，通胀率为每年 2.5%。他说：“总费用 1.3%，只占预期收益的约五分之一，客户保留了收益的大部分。”
      en: |-
        A financial adviser charges clients 1% of assets a year, and the funds he chooses for them have an average expense ratio of 0.3%. His capital market assumptions are: over the next 10 years, the clients' 60/40 portfolio earns a nominal 6% a year, and inflation is 2.5% a year. He says: "Total costs of 1.3% take only about one fifth of the expected return; clients keep most of it."
    answer:
      zh-cn: |-
        假。按 Fisher 方程，组合的预期实际收益率为 $\frac{1.06}{1.025} - 1 \approx 3.41\%$。通胀那部分收益并不增加客户的购买力，而费用要从客户实际能增加的购买力中扣除：1.3% 约占预期实际收益的 38.1%，接近五分之二，而不是五分之一。如果和超过无风险利率的那部分收益（承担风险得到的补偿）比较，费用占的比例更高。把费用与名义收益比较，是货币幻觉。10 年下来，费用使期末财富减少约 $1 - e^{-0.013 \times 10} \approx 12\%$，占实际增值的比例还要更高。顾问的服务（规划、税务、行为上的帮助）可能值这个价，但要按实际收益来衡量它的代价。
      en: |-
        False. By the Fisher equation, the portfolio's expected real return is $\frac{1.06}{1.025} - 1 \approx 3.41\%$. The part of the return that only matches inflation does not add to the client's purchasing power, while the costs come out of the purchasing power the client actually gains: 1.3% is about 38.1% of the expected real return, close to two fifths, not one fifth. Compared with the part of the return above the risk-free rate (the pay for bearing risk), the share is higher still. Comparing costs with the nominal return is money illusion. Over 10 years, the costs reduce final wealth by about $1 - e^{-0.013 \times 10} \approx 12\%$, an even larger share of the real gain. The adviser's services (planning, tax and behavioral help) may be worth the price, but their cost should be measured against the real return.
    rubric:
      zh-cn:
        - "通过：判断为假，算出实际收益约 3.41%（用近似 3.5% 也可以），费用约占实际收益的 38.1%（或约 37%），并说明费用应与实际收益（或超额收益）比较，与名义收益比较是货币幻觉。只说“费用很高”或只写“假”，需要订正。"
      en:
        - "OK: false, computing a real return of about 3.41% (the approximation 3.5% is fine) and costs of about 38.1% (or about 37%) of it, and explaining that costs should be compared with the real (or excess) return and that comparing with the nominal return is money illusion. Saying only that the costs are high, or only false, needs revision."

  - id: Q6
    kind: quiz
    part: judge
    concepts: [sharpe-ratio, put-option, volatility-skew, fat-tails, due-diligence]
    question:
      zh-cn: |-
        一只对冲基金每个月卖出 1 个月期、执行价比当时指数低 7% 的股指看跌期权，并持有短期国债作为保证金。过去 8 年中它只有 3 个月亏损，夏普比率为 2.0，而同期股指的夏普比率约为 0.7。一位分析师说：“即使这些数据都真实无误，这个夏普比率也很可能高估了这只基金的风险调整后表现。”
      en: |-
        A hedge fund sells 1-month index put options with a strike 7% below the index each month and holds Treasury bills as margin. Over the past 8 years it has lost money in only 3 months and has a Sharpe ratio of 2.0, compared with about 0.7 for the stock index over the same period. An analyst says: "Even if all these data are accurate, this Sharpe ratio very likely overstates the fund's risk-adjusted performance."
    answer:
      zh-cn: |-
        真。卖出虚值看跌期权，平时每个月收到期权费，只有在指数一个月内大跌超过 7% 时才大亏，亏损可能是期权费的许多倍。它的收益分布左偏、尾部很厚：在一个没有发生大跌（或只有很少几次）的 8 年样本中，收益平稳，样本的波动率远低于它真正承担的风险，夏普比率只用波动率衡量风险，因此被高估。这种收益主要是对承担市场大跌风险的补偿（虚值看跌期权的隐含波动率通常较高，说明投资者愿意为这种保护多付钱），而不是选股能力；它的亏损恰好集中在股市大跌、其他资产也大跌的时候，比同样波动率的收益更糟。评价这类基金应该看期权头寸本身、压力情景（例如指数一个月下跌 20% 时的亏损）和最大回撤，而不是只看夏普比率。
      en: |-
        True. Selling out-of-the-money puts brings in a premium every month, and the fund loses heavily only when the index falls more than 7% within a month, and then the loss can be many times the premium. Its return distribution is left-skewed with fat tails: in an 8-year sample without a crash (or with very few), returns are smooth and the sample volatility is far below the risk actually borne; the Sharpe ratio measures risk only by volatility and is therefore overstated. This return is mainly pay for bearing the risk of a market crash (out-of-the-money puts usually have higher implied volatility, showing that investors pay extra for such protection), not stock-picking skill; and its losses come exactly when stocks crash and other assets fall too, which is worse than returns with the same volatility. Such a fund should be judged by its option positions, stress scenarios (for example, the loss if the index falls 20% in a month) and maximum drawdown, not by the Sharpe ratio alone.
    rubric:
      zh-cn:
        - "通过：判断为真，并说明卖出看跌期权的收益分布左偏、偶尔大亏，没有大跌的样本中的波动率低估了风险，夏普比率只看波动率；提到这是承担大跌风险的补偿、亏损集中在市场大跌时，或应看压力测试，更好。只说“过去的业绩不代表将来”，或只写“真”，需要订正。"
      en:
        - "OK: true, explaining that selling puts gives a left-skewed distribution with occasional large losses, that volatility in a sample without a crash understates the risk, and that the Sharpe ratio looks only at volatility; noting that this is pay for bearing crash risk, that losses come in market crashes, or that stress tests are needed is a plus. Saying only that past performance does not predict the future, or only true, needs revision."

  - id: Q7
    kind: quiz
    part: problem
    concepts: [employee-stock-option, black-scholes-model, time-value, put-call-parity, firm-specific-risk, restricted-stock-unit]
    expected: { c: "66.97", tv: "6.97", interest: "5.91" }
    question:
      zh-cn: |-
        一位工程师在一家上市公司工作了 6 年，持有 1 万份已经归属的员工期权：执行价 40 美元，还有 4 年到期，不能出售。公司股票现在为 100 美元，不付股息，波动率约 35%；连续复利的无风险利率为 4%。他还持有 3,000 股由 RSU 归属得到的公司股票，成本基础约为每股 95 美元。期权和这些股票合计约占他家庭金融资产的 55%。
        (a) 对一个可以自由买卖和对冲的投资者来说，每份期权按 Black–Scholes 公式值多少？其中时间价值是多少？这部分时间价值主要从哪里来？
        (b) 他担心集中持有的风险，打算现在行使全部期权并卖出股票。一位同事说：“不付股息的股票的期权，永远不应该提前行权，提前行权就白白扔掉了时间价值。”评价同事的说法，并给出你的建议。
      en: |-
        An engineer has worked at a listed company for 6 years and holds 10,000 vested employee stock options: strike 40 dollars, 4 years to expiry, not transferable. The company's stock is now 100 dollars, pays no dividend and has a volatility of about 35%; the continuously compounded risk-free rate is 4%. He also holds 3,000 company shares from vested RSUs, with a cost basis of about 95 dollars a share. The options and these shares together are about 55% of his household's financial assets.
        (a) For an investor who can trade and hedge freely, what is each option worth by the Black–Scholes formula? How much of that is time value? Where does this time value mainly come from?
        (b) Worried about his concentration, he plans to exercise all the options now and sell the shares. A colleague says: "Options on a stock that pays no dividend should never be exercised early; exercising early throws the time value away." Evaluate the colleague's statement and give your advice.
    answer:
      zh-cn: |-
        (a) $d_1 = \frac{\ln(100/40) + (0.04 + 0.35^2/2) \times 4}{0.35 \times 2} \approx 1.888$，$d_2 \approx 1.188$，$C \approx 100 \times N(1.888) - 40 e^{-0.16} N(1.188) \approx 66.97$ 美元。内在价值为 60，时间价值约为 6.97 美元。按看涨–看跌平价，$C = S - K e^{-rT} + P$，所以时间价值 $= K(1 - e^{-rT}) + P$：其中约 $40 \times (1 - e^{-0.16}) \approx 5.91$ 美元是推迟 4 年支付执行价的利息，其余约 1.05 美元是同执行价看跌期权的价值（股价跌到 40 以下时的保护）。期权很深的实值，时间价值主要来自推迟支付执行价。
        (b) 同事的说法有一个条件：持有者可以卖出期权，或者通过对冲降低风险。对这样的投资者，提前行权得到 60，卖出或继续持有却值约 66.97，所以不应提前行权。这位工程师不能卖出期权，公司也通常禁止对冲，他要承担大量的公司特有风险；他的工资和职业也依赖这家公司（人力资本与金融资产高度相关），这些风险分散不掉、也得不到补偿。所以提前行权可能是合理的：每份期权放弃约 6.97 美元（1 万份约 7 万美元，约占期权价值的 10%），换来风险的大幅下降。
        但更便宜的第一步是先卖出那 3,000 股 RSU 股票：卖出它们不放弃任何时间价值，而且成本基础接近市价，交的税很少。之后如果集中度仍然太高，再分批行使一部分期权（行权时价差按普通所得纳税，所以分几年行权还可以避免一年中收入过高、税率过高）。他也可以在不能卖出的时候少持有其他科技股，降低整体的集中度。总之，“永远不要提前行权”只对能自由买卖或对冲的人成立。
      en: |-
        (a) $d_1 = \frac{\ln(100/40) + (0.04 + 0.35^2/2) \times 4}{0.35 \times 2} \approx 1.888$, $d_2 \approx 1.188$, $C \approx 100 \times N(1.888) - 40 e^{-0.16} N(1.188) \approx 66.97$ dollars. The intrinsic value is 60, so the time value is about 6.97 dollars. By put–call parity, $C = S - K e^{-rT} + P$, so the time value $= K(1 - e^{-rT}) + P$: about $40 \times (1 - e^{-0.16}) \approx 5.91$ dollars is the interest from paying the strike 4 years later, and the remaining 1.05 dollars or so is the value of the put with the same strike (protection if the stock falls below 40). The option is deep in the money, so its time value comes mainly from paying the strike later.
        (b) The colleague's rule has a condition: the holder can sell the option or reduce its risk by hedging. For such an investor, exercising early gives 60 while selling or holding is worth about 66.97, so he should not exercise early. This engineer cannot sell the options, the company usually forbids hedging, and he bears a large amount of firm-specific risk; his salary and career also depend on the company (his human capital is highly correlated with his financial assets), and this risk cannot be diversified and earns no reward. So exercising early can be rational: he gives up about 6.97 dollars per option (about 70,000 dollars for 10,000 options, about 10% of their value) in exchange for much lower risk.
        But a cheaper first step is to sell the 3,000 RSU shares: selling them gives up no time value, and with a cost basis close to the market price the tax is small. If the concentration is still too high after that, he can exercise part of the options in stages (the spread at exercise is taxed as ordinary income, so spreading exercises over several years also avoids very high income and tax rates in one year). He can also hold fewer other tech stocks while he cannot sell, lowering his overall concentration. In short, "never exercise early" holds only for someone who can sell or hedge freely.
    rubric:
      zh-cn:
        - "(a) 通过：期权价值约 66.97、时间价值约 6.97 美元，并说明时间价值主要是推迟支付执行价的利息（约 5.91），其余是看跌期权（保护）的价值。只算出数值而不说明来源，需要订正。"
        - "(b) 通过：指出“不应提前行权”的条件是可以卖出或对冲，员工期权不满足，所以为分散风险提前行权可能合理；并指出应先卖出 RSU 股票（不放弃时间价值、税少），再分批行权。照搬同事的规则，或主张立即行使全部期权而不考虑先卖 RSU 股票，需要订正。"
      en:
        - "(a) OK: an option value of about 66.97 and a time value of about 6.97 dollars, explaining that the time value is mainly the interest from paying the strike later (about 5.91) and the rest the value of the put (protection). Giving only the numbers without where the time value comes from needs revision."
        - "(b) OK: pointing out that the rule against early exercise assumes the holder can sell or hedge, which employee options do not allow, so exercising early to diversify can be rational; and that he should first sell the RSU shares (no time value lost, little tax) and then exercise in stages. Following the colleague's rule, or exercising all options at once without first considering selling the RSU shares, needs revision."

  - id: Q8
    kind: quiz
    part: problem
    concepts: [private-equity, household-balance-sheet, goals-based-investing, illiquidity-premium]
    expected: { share: "40.2" }
    question:
      zh-cn: |-
        一个家庭三年前向一只私募股权基金承诺了 40 万美元，到现在基金已经催缴了 16 万美元，最新的季度报告把这部分估值为 17 万美元；剩下的 24 万美元预计在今后三四年内分次催缴，家庭收到通知后必须在两周内付款，否则会失去已投入部分的大部分权益。家庭的其他金融资产是 70 万美元股票指数基金和 15 万美元现金，现金准备两年后用作买房的首付。
        (a) 如果把已承诺但还没有催缴的部分也算作私募基金的投资，私募基金占家庭金融资产（按现在的价值）的百分之几？
        (b) 他们说：“私募基金只占我们资产的约 17%，估值又很稳定，就算股市大跌，也不会影响买房的计划。”评价这个说法。
      en: |-
        Three years ago a household committed 400,000 dollars to a private equity fund. The fund has so far called 160,000 dollars, which the latest quarterly report values at 170,000 dollars; the remaining 240,000 dollars is expected to be called in stages over the next three or four years, and after each notice the household must pay within two weeks or lose most of its interest in what it has already invested. The household's other financial assets are 700,000 dollars in a stock index fund and 150,000 dollars in cash, which is set aside for a home down payment in two years.
        (a) Counting the committed but not yet called part as an investment in the private fund too, what percentage of the household's financial assets (at current values) is in the private fund?
        (b) They say: "The private fund is only about 17% of our assets and its value is very stable, so even if stocks crash, it will not affect our plan to buy a home." Evaluate this statement.
    answer:
      zh-cn: |-
        (a) 金融资产合计 $700 + 150 + 170 = 1{,}020$ 千美元。算上未催缴的 240 千美元，私募基金的投资为 $170 + 240 = 410$ 千美元，占 $\frac{410}{1{,}020} \approx 40.2\%$。未催缴的承诺是一笔必须支付的负债：在家庭资产负债表上，应该从流动资产中扣除，或者把它看作以后一定要投入私募基金的钱。
        (b) 这个说法有三个问题。第一，真正的私募敞口约为 40%，而不是 17%，而且这 24 万美元必须从指数基金或现金中支付，这就像一笔借款。第二，催缴的时间由基金决定，不看家庭的处境，而且常常在市场下跌后到来（基金趁低价买入公司）。如果股市下跌 30%，指数基金只剩约 49 万美元，催缴仍要付；家庭要么在低点卖出股票，要么动用首付的现金。不付款会失去已投入部分的大部分权益；在二级市场上出售基金份额，在市场下跌时通常要打很大的折扣。第三，“估值稳定”只是季度评估的平滑，基金持有的公司同样受经济衰退影响，它的真实风险接近甚至高于股票；股市大跌后，私募基金按评估值计算的比例反而会上升。所以首付的钱应当单独放在短期国债等安全资产中，不能指望在需要时卖出股票；还应该为未催缴的承诺准备好流动资金，并按 40% 左右的敞口判断家庭能否承受这种风险和缺乏流动性的代价（这种代价应该由流动性溢价补偿）。
      en: |-
        (a) Financial assets total $700 + 150 + 170 = 1{,}020$ thousand dollars. Counting the uncalled 240 thousand dollars, the private fund investment is $170 + 240 = 410$ thousand dollars, $\frac{410}{1{,}020} \approx 40.2\%$. The uncalled commitment is a liability that must be paid: on the household balance sheet, it should be subtracted from liquid assets, or treated as money that is certain to go into the private fund later.
        (b) The statement has three problems. First, the true private equity exposure is about 40%, not 17%, and the 240,000 dollars must be paid from the index fund or the cash, like a loan. Second, the fund decides when to call capital without regard to the household's situation, and calls often come after markets fall (funds buy companies when prices are low). If stocks fall 30%, the index fund is worth only about 490,000 dollars, but the calls must still be paid; the household must either sell stocks at the bottom or use the down-payment cash. Not paying loses most of its interest in what it has invested; selling the fund interest on the secondary market usually means a large discount when markets are down. Third, the "stable value" is only the smoothing of quarterly appraisals; the companies the fund holds are hit by recessions too, so its true risk is close to or above that of stocks, and after a stock crash the private fund's share at appraised value actually rises. So the down-payment money should be kept separately in safe assets such as Treasury bills, without counting on selling stocks when it is needed; liquid funds should be set aside for the uncalled commitment; and whether the household can bear this risk and the lack of liquidity (which an illiquidity premium should pay for) should be judged on an exposure of about 40%.
    rubric:
      zh-cn:
        - "(a) 通过：约 40.2%（或按 410 除以其他合理的分母，只要说明了未催缴的承诺应计入敞口）。只用 17 万美元计算，需要订正。"
        - "(b) 通过：指出未催缴的承诺是必须支付的负债、催缴不看市场且常在下跌后到来，股市大跌时可能被迫低价卖出股票或动用首付；并指出估值稳定是平滑的结果。建议把首付放在安全资产中、为催缴预留资金。只说“私募基金流动性差”而不说明承诺与首付的冲突，需要订正。"
      en:
        - "(a) OK: about 40.2% (or 410 divided by another reasonable denominator, as long as the uncalled commitment is counted in the exposure). Using only the 170,000 dollars needs revision."
        - "(b) OK: pointing out that the uncalled commitment is a liability that must be paid, that calls ignore markets and often come after falls, so that in a crash the household may have to sell stocks low or use the down payment; and that the stable value comes from smoothing. Advice to keep the down payment in safe assets and set aside funds for calls. Saying only that private funds are illiquid, without the conflict between the commitment and the down payment, needs revision."

  - id: Q9
    kind: quiz
    part: problem
    concepts: [risk-premium, certainty-equivalent, expected-value, emergency-fund]
    expected: { extra: "160", ratio: "3.75" }
    question:
      zh-cn: |-
        一个家庭续保房屋保险，有两个选择：免赔额 1,000 美元，年保费 2,400 美元；或者免赔额 5,000 美元，年保费 1,800 美元。按他们所在地区的数据，一年中发生理赔的概率约为 4%，理赔的损失几乎都超过 5,000 美元。这个家庭有 3 万美元的应急基金，金融资产约 30 万美元。
        (a) 选择较高的免赔额，每年省下的保费是多少？发生理赔时多付的金额乘以概率，每年预期多付多少？省下的保费是预期多付金额的几倍？
        (b) 邻居说：“免赔额越低越安全，每年多花 600 美元，换来出事时少付 4,000 美元，买个安心很值得。”评价这个说法。在什么情况下较低的免赔额可能是合理的？
      en: |-
        A household is renewing its home insurance and has two choices: a deductible of 1,000 dollars with an annual premium of 2,400 dollars, or a deductible of 5,000 dollars with an annual premium of 1,800 dollars. According to data for their area, the probability of a claim in a year is about 4%, and claim losses almost always exceed 5,000 dollars. The household has a 30,000-dollar emergency fund and about 300,000 dollars of financial assets.
        (a) How much premium does the higher deductible save each year? Multiplying the extra amount paid in a claim by the probability, how much more do they expect to pay each year? How many times the expected extra payment is the premium saved?
        (b) A neighbor says: "The lower the deductible, the safer; spending 600 dollars more a year to pay 4,000 dollars less when something happens buys peace of mind and is well worth it." Evaluate this statement. Under what conditions could the lower deductible be reasonable?
    answer:
      zh-cn: |-
        (a) 每年省下 $2{,}400 - 1{,}800 = 600$ 美元。理赔时多付 $5{,}000 - 1{,}000 = 4{,}000$ 美元，每年预期多付 $4\% \times 4{,}000 = 160$ 美元。省下的保费是预期多付金额的 $\frac{600}{160} = 3.75$ 倍。
        (b) 较低的免赔额就是多买一层保险：保险公司多赔的是损失中 1,000 到 5,000 美元之间的那一段（像一个期权价差），预期价值只有每年 160 美元，却要多付 600 美元，附加费用约为预期赔付的 2.75 倍。风险厌恶的人愿意为保险多付钱，但愿意多付的金额（风险溢价）随风险相对于财富的大小迅速变小：对有 3 万美元应急基金、30 万美元金融资产的家庭，一笔 4,000 美元的损失只是财富的约 1.3%，按 [[1.4]] 的近似 $\frac{1}{2}\gamma\frac{\sigma^2}{W}$，即使相对风险厌恶系数为 3，这层风险的风险溢价也只有几美元。所以这层保险远不值 600 美元；长期下来，每年省下 600、预期多付 160，平均每年约省 440 美元。保险最适合于自己承担不起的大损失，几千美元的损失最好用应急基金自己承担。较低的免赔额在以下情况可能合理：家庭没有应急基金、出事时只能用高利率的信用卡借钱；理赔的概率远高于保险公司定价时假设的（例如房子很旧、所在地区灾害频繁，而保费没有反映）；或者 4,000 美元的损失对家庭的影响很大（收入低、财富少）。
      en: |-
        (a) The saving is $2{,}400 - 1{,}800 = 600$ dollars a year. In a claim they pay $5{,}000 - 1{,}000 = 4{,}000$ dollars more, so the expected extra payment is $4\% \times 4{,}000 = 160$ dollars a year. The premium saved is $\frac{600}{160} = 3.75$ times the expected extra payment.
        (b) The lower deductible is an extra layer of insurance: the insurer pays the part of the loss between 1,000 and 5,000 dollars (like an option spread), whose expected value is only 160 dollars a year, yet it costs 600 dollars more, a loading of about 2.75 times the expected payout. Risk-averse people are willing to pay extra for insurance, but how much extra (the risk premium) shrinks quickly as the risk gets small relative to wealth: for a household with a 30,000-dollar emergency fund and 300,000 dollars of financial assets, a 4,000-dollar loss is about 1.3% of wealth, and by the approximation $\frac{1}{2}\gamma\frac{\sigma^2}{W}$ of [[1.4]], even with relative risk aversion of 3 the risk premium of this layer is only a few dollars. So this layer is worth far less than 600 dollars; over the long run, saving 600 and expecting to pay 160 more saves about 440 dollars a year on average. Insurance is best for large losses one cannot bear; losses of a few thousand dollars are best covered by the emergency fund. The lower deductible could be reasonable if the household had no emergency fund and could only borrow on a high-rate credit card after a loss; if the claim probability were much higher than the insurer assumes in its price (for example, a very old house or an area with frequent disasters that the premium does not reflect); or if a 4,000-dollar loss would hit the household hard (low income, little wealth).
    rubric:
      zh-cn:
        - "(a) 通过：省下 600 美元，预期多付 160 美元，约 3.75 倍。"
        - "(b) 通过：说明较低的免赔额要为预期 160 美元的赔付多付 600 美元，对有应急基金的家庭这层小额风险的风险成本很小，所以不值；并给出至少一个较低免赔额合理的条件（没有应急基金、理赔概率被低估、损失相对财富很大）。只说“要看个人对风险的态度”而不比较价格与预期赔付，需要订正。"
      en:
        - "(a) OK: a saving of 600 dollars, an expected extra payment of 160 dollars, about 3.75 times."
        - "(b) OK: explaining that the lower deductible costs 600 dollars more for an expected payout of 160, and that for a household with an emergency fund the cost of this small risk is tiny, so it is not worth it; and giving at least one condition under which a lower deductible is reasonable (no emergency fund, an underestimated claim probability, a loss large relative to wealth). Saying only that it depends on one's attitude to risk, without comparing the price with the expected payout, needs revision."

  - id: Q10
    kind: quiz
    part: problem
    concepts: [put-option, call-option, replicating-portfolio, protective-put, covered-call]
    expected: { down: "-15.8", up: "13.2", idxdown: "-23.5", idxup: "31.5" }
    question:
      zh-cn: |-
        一只“缓冲 ETF”的说明书写道：在一年的结果期内，如果标普 500 指数（价格，不含股息）下跌，基金承担不了前 10% 的下跌，即指数下跌 10% 以内时基金收益为 0，下跌超过 10% 时只承担超过的部分；如果指数上涨，基金的收益最多为 14%。基金的费用率为 0.8%。宣传材料说：“我们用期权实现下跌保护，但投资者不用支付任何期权费。”指数的股息率约为每年 1.5%。
        (a) 用指数（不含股息）和期权写出这只基金一年的收益由哪些头寸组成。如果这一年指数价格下跌 25%，或者上涨 30%，基金的收益各是多少（扣除费用）？持有指数基金的总收益各是多少（不考虑指数基金的费用）？
        (b) 评价宣传材料的说法。一位 58 岁、担心退休前遇到大跌的投资者，与其把全部股票换成这只基金，还有什么办法？
      en: |-
        The prospectus of a "buffer ETF" says: over a one-year outcome period, if the S&P 500 index (price, excluding dividends) falls, the fund is protected from the first 10% of the fall: when the index falls by 10% or less the fund's return is 0, and when it falls by more the fund bears only the part beyond 10%; if the index rises, the fund's return is at most 14%. The fund's expense ratio is 0.8%. Its marketing says: "We provide downside protection with options, but investors do not pay any option premium." The index's dividend yield is about 1.5% a year.
        (a) Write the fund's one-year return as a set of positions in the index (excluding dividends) and options. If over the year the index price falls 25%, or rises 30%, what is the fund's return (after its fee)? What is the total return of holding an index fund in each case (ignoring that fund's fee)?
        (b) Evaluate the marketing claim. For a 58-year-old investor worried about a crash before retirement, what alternatives are there to swapping all his stocks for this fund?
    answer:
      zh-cn: |-
        (a) 设指数现在为 100。基金相当于：持有指数（不含股息）；买入执行价 100 的看跌期权；卖出执行价 90 的看跌期权（所以只保护 100 到 90 之间的下跌）；卖出执行价 114 的看涨期权（所以收益最多 14%）。指数下跌 25% 时，基金收益为 $-25\% + 10\% - 0.8\% = -15.8\%$；指数基金的总收益为 $-25\% + 1.5\% = -23.5\%$。指数上涨 30% 时，基金收益为 $14\% - 0.8\% = 13.2\%$，指数基金为 $30\% + 1.5\% = 31.5\%$。
        (b) “不用支付期权费”只说明基金没有向投资者另外收钱，而不是保护是免费的：买入看跌期权价差的费用，由卖出看涨期权收到的期权费支付，投资者付出的是 14% 以上的全部上涨。此外，期权按指数价格计算，投资者还放弃了每年约 1.5% 的股息（在定价中，股息使看涨期权更便宜、看跌期权更贵，所以上限要定得更低），再加上 0.8% 的费用。因为股指的虚值看跌期权通常比较贵（波动率偏斜），这种保护的代价往往不低。保护只对整个结果期成立：在期中买入的投资者，得到的缓冲和上限与说明书上的不同。而且它只保护前 10%，大跌时仍然承担大部分损失。
        对这位投资者，更直接的办法是按目标和风险承受能力降低股票比例，例如把将来几年要用的钱放在债券或 TIPS 阶梯中，并沿下滑路径逐步降低股票比例。降低股票比例同样降低了大跌的损失，但没有上限，不放弃股息，费用也低得多。如果他确实想用期权，也应该先比较这只基金的上限与用同样的钱减少股票、持有债券的结果，看这份保护的价格是否合理。
      en: |-
        (a) Let the index be 100 now. The fund is equivalent to: holding the index (excluding dividends); buying a put with strike 100; selling a put with strike 90 (so only the fall from 100 to 90 is protected); and selling a call with strike 114 (so the return is at most 14%). If the index falls 25%, the fund's return is $-25\% + 10\% - 0.8\% = -15.8\%$; the index fund's total return is $-25\% + 1.5\% = -23.5\%$. If the index rises 30%, the fund's return is $14\% - 0.8\% = 13.2\%$, and the index fund's is $30\% + 1.5\% = 31.5\%$.
        (b) "No option premium" only means the fund does not charge investors separately, not that the protection is free: the cost of buying the put spread is paid with the premium from selling the call, and the investor pays with all the upside above 14%. In addition, the options are on the index price, so the investor gives up a dividend of about 1.5% a year (in pricing, dividends make calls cheaper and puts dearer, so the cap must be set lower), plus the 0.8% fee. Because out-of-the-money index puts are usually expensive (the volatility skew), this protection often costs a good deal. The protection holds only for the whole outcome period: an investor who buys in the middle gets a different buffer and cap from the prospectus. And it covers only the first 10%, so in a crash he still bears most of the loss.
        For this investor, a more direct approach is to lower his stock share according to his goals and risk tolerance, for example by putting the money he will need in the next few years in bonds or a TIPS ladder and lowering his stock share gradually along a glide path. Lowering the stock share also reduces losses in a crash, but has no cap, gives up no dividends and costs much less. If he does want to use options, he should first compare this fund's cap with the result of holding less stock and more bonds with the same money, to see whether the price of this protection is reasonable.
    rubric:
      zh-cn:
        - "(a) 通过：写出持有指数、买入执行价 100 的看跌、卖出执行价 90 的看跌、卖出执行价 114 的看涨（或说明等价的收益结构）；基金约 −15.8% 和 13.2%，指数基金约 −23.5% 和 31.5%。没有写出期权组合，只按说明书计算，需要订正。"
        - "(b) 通过：指出保护的代价是卖出看涨期权放弃的上涨和放弃的股息（以及费用），所以不是免费的；并提出降低股票比例、用债券或 TIPS 准备将来几年要用的钱等替代办法。只说“费用率高”，或只说“上限限制了收益”而不说明它就是保护的价格，需要订正。"
      en:
        - "(a) OK: holding the index, buying a put at 100, selling a put at 90 and selling a call at 114 (or an equivalent description of the payoff); the fund about −15.8% and 13.2%, the index fund about −23.5% and 31.5%. Computing from the prospectus without writing the options needs revision."
        - "(b) OK: pointing out that the protection is paid for with the upside given up by selling the call and with the dividends given up (plus the fee), so it is not free; and proposing alternatives such as lowering the stock share and holding bonds or TIPS for the money needed in the next few years. Saying only that the expense ratio is high, or only that the cap limits returns without explaining that it is the price of the protection, needs revision."

  - id: Q11
    kind: quiz
    part: problem
    concepts: [longevity-risk, adverse-selection, tips, annuity]
    expected: { l15: "514.0", l30: "895.9" }
    question:
      zh-cn: |-
        一位 65 岁的退休者患有一种慢性心脏病，医生估计他的预期寿命约为 80 岁。他需要每年 4 万美元（按今天的购买力，年末支付）的基本生活费，除了社会保障金以外的部分由投资提供。各期限 TIPS 的实际收益率都是 2.0%。一家保险公司报价：一次支付 75 万美元，购买一份每年 4 万美元、按通胀调整、终身支付的年金。
        (a) 用 TIPS 阶梯提供 15 年（到 80 岁）和 30 年（到 95 岁）的这笔支出，今天各要花多少（千美元）？
        (b) 他的理财顾问说：“年金有死亡率收益，比自己准备便宜得多：你看，75 万美元就能终身领取，而 TIPS 阶梯到 95 岁就要近 90 万美元。所以基本生活费一定要全部年金化。”评价这个建议对这位退休者是否合适，并给出你的建议。
      en: |-
        A 65-year-old retiree has a chronic heart condition, and his doctor estimates his life expectancy at about 80. He needs 40,000 dollars a year (in today's purchasing power, paid at year end) for basic living costs, the part beyond Social Security to come from his investments. TIPS of all maturities have a real yield of 2.0%. An insurer quotes a single payment of 750,000 dollars for an annuity paying 40,000 dollars a year, adjusted for inflation, for life.
        (a) How much does a TIPS ladder providing this spending for 15 years (to age 80) and for 30 years (to age 95) cost today (in thousands of dollars)?
        (b) His financial adviser says: "Annuities have mortality credits, so they are much cheaper than providing for yourself: 750,000 dollars buys income for life, while a TIPS ladder to 95 costs nearly 900,000. So basic living costs should definitely be fully annuitized." Evaluate whether this advice suits this retiree, and give your advice.
    answer:
      zh-cn: |-
        (a) 15 年：$40 \times \frac{1 - 1.02^{-15}}{0.02} \approx 514.0$ 千美元；30 年：$40 \times \frac{1 - 1.02^{-30}}{0.02} \approx 895.9$ 千美元。
        (b) 年金的价格是按购买年金的人群的寿命定的。买年金的人往往身体较好、预期寿命比平均更长（逆向选择），保险公司也按此定价。75 万美元的价格之所以低于到 95 岁的 TIPS 阶梯，是因为在这个人群中，早去世的人留下的钱支付了长寿的人（死亡率收益）；对一个人来说，这笔交易的价值取决于他自己能活多久。对这位退休者，如果预期寿命约为 80 岁，年金按他的寿命计算的价值大约只相当于 15 年的阶梯（约 51 万美元），远低于 75 万美元的价格，他平均会让出很多钱给其他长寿的人。所以全部年金化对他并不划算，顾问的比较只适用于寿命与年金人群相当的人。
        但他仍然有长寿风险：医生的估计只是平均值，他也可能活到 90 岁。更合适的做法是：用 TIPS 阶梯提供前面一段时间的支出（例如到 80 或 85 岁）；对更远的年份，可以考虑推迟领取社会保障金（它对每个人按同样的规则计算，不按健康状况定价，但对预期寿命短的人推迟的价值也较低，需要和配偶的情况一起考虑），或者购买从 85 岁才开始支付的递延年金，用较少的钱为长寿的情形投保；其余的钱可以留给继承人。如果有健康问题可以证明，有些保险公司还提供支付更高的“受损寿命”年金，也值得比较。
      en: |-
        (a) 15 years: $40 \times \frac{1 - 1.02^{-15}}{0.02} \approx 514.0$ thousand dollars; 30 years: $40 \times \frac{1 - 1.02^{-30}}{0.02} \approx 895.9$ thousand dollars.
        (b) Annuity prices are set by the lifespans of the people who buy annuities. Buyers tend to be in better health and to live longer than average (adverse selection), and insurers price for that. The price of 750,000 dollars is below the TIPS ladder to 95 because, in this pool, the money left by those who die early pays those who live long (mortality credits); for one person, the value of the deal depends on how long he himself lives. For this retiree, with a life expectancy of about 80, the annuity is worth roughly what a 15-year ladder costs (about 514,000 dollars) given his own lifespan, far below its price of 750,000, so on average he would give up a lot of money to other, longer-lived buyers. Fully annuitizing is therefore a poor deal for him; the adviser's comparison applies only to someone whose lifespan is like that of the annuity pool.
        But he still has longevity risk: the doctor's estimate is only an average, and he may live to 90. A better approach: use a TIPS ladder for the spending of the earlier years (for example, to 80 or 85); for the later years, consider delaying Social Security (which follows the same rules for everyone and is not priced by health, although delaying is also worth less to someone with a short life expectancy and should be considered together with a spouse's situation), or buying a deferred annuity that starts paying only at 85, insuring the long-life case for much less money; the rest can go to heirs. If his health problem can be documented, some insurers also offer "impaired life" annuities with higher payments, which are worth comparing.
    rubric:
      zh-cn:
        - "(a) 通过：约 514.0 和 895.9 千美元。"
        - "(b) 通过：指出年金按购买人群（往往更长寿）的寿命定价，死亡率收益来自人群中的分担，对预期寿命短的人年金的价值低于价格（例如与 15 年阶梯比较），所以全部年金化不合适；同时指出他仍有长寿风险，建议用 TIPS 阶梯加上对更远年份的保护（递延年金、推迟领取社会保障金等）。只说“年金不能留给继承人”而不比较他的寿命与定价，或完全忽略长寿风险，需要订正。"
      en:
        - "(a) OK: about 514.0 and 895.9 thousand dollars."
        - "(b) OK: pointing out that annuities are priced on the lifespans of buyers (who tend to live longer), that mortality credits come from sharing within the pool, and that for someone with a short life expectancy the annuity is worth less than its price (for example, compared with the 15-year ladder), so full annuitization does not suit him; while noting that he still has longevity risk, and advising a TIPS ladder plus protection for the later years (a deferred annuity, delaying Social Security and so on). Saying only that an annuity leaves nothing to heirs without comparing his lifespan with the pricing, or ignoring longevity risk entirely, needs revision."

  - id: Q12
    kind: quiz
    part: problem
    concepts: [covered-interest-parity, forward-contract, funded-ratio, goals-based-investing, currency-hedging]
    expected: { fwd: "1.1592", pv: "309.1", fr: "97.0" }
    question:
      zh-cn: |-
        一个美国家庭计划 3 年后搬到德国，届时要用 30 万欧元买一套公寓（价格已经大致谈定）。他们为此准备了 30 万美元，现在全部是美国国债。现在的汇率为 1 欧元 = 1.10 美元；3 年期美国国债的收益率为每年 4.0%，3 年期德国国债为每年 2.2%（都按年复利）。银行可以提供 3 年期的欧元远期合约。
        (a) 按抛补利率平价，3 年期的远期汇率是多少？这个目标今天值多少美元（千美元）？他们的资金充足率是多少？
        (b) 他们说：“远期汇率比现在的汇率贵了 5% 以上，锁定汇率太不划算；美元利率比欧元高，持有美国国债三年多赚的利息正好可以弥补。而且国债是最安全的资产。”评价这个说法，并说明对这个目标来说，什么是无风险的做法。
      en: |-
        An American household plans to move to Germany in 3 years and will then need 300,000 euros to buy an apartment (the price is roughly agreed). They have set aside 300,000 dollars for it, now all in US Treasuries. The exchange rate is 1 euro = 1.10 dollars; 3-year US Treasuries yield 4.0% a year and 3-year German government bonds 2.2% a year (both compounded annually). A bank can provide a 3-year euro forward contract.
        (a) By covered interest parity, what is the 3-year forward exchange rate? What is the goal worth today in dollars (in thousands)? What is their funded ratio?
        (b) They say: "The forward rate is more than 5% above today's rate, so locking it in is a bad deal; dollar rates are higher than euro rates, and the extra interest from holding Treasuries for three years will make up for it. Besides, Treasuries are the safest asset." Evaluate this statement, and explain what the riskless approach for this goal is.
    answer:
      zh-cn: |-
        (a) 远期汇率 $F = 1.10 \times \left(\frac{1.04}{1.022}\right)^3 \approx 1.1592$ 美元/欧元，比即期汇率高约 5.4%。目标今天的价值：按欧元无风险利率折现再换成美元，$\frac{300}{1.022^3} \times 1.10 \approx 309.1$ 千美元（等价地，$\frac{300 \times 1.1592}{1.04^3}$）。资金充足率为 $\frac{300}{309.1} \approx 97.0\%$。
        (b) 远期汇率高于即期汇率，正是两国利率之差：在美元上多赚的利息，与远期多付的美元恰好抵消（抛补利率平价）。锁定汇率并不“贵”，持有美元国债多赚的利息也不是额外的收益，两者是同一件事的两面。不锁定汇率时，他们 3 年后能换到多少欧元取决于那时的汇率，而汇率每年的波动常常有 8% 到 10%，也不能指望利率高的货币按利差贬值（无抛补利率平价常常不成立）。对一个以欧元计价、必须达成的目标，美元国债并不是无风险资产：它在美元上无风险，在欧元上却承担全部汇率风险。无风险的做法是持有期限与目标匹配的欧元无风险资产，例如 3 年期德国国债（约 309.1 千美元可以锁定 30 万欧元），或者持有美元国债并买入 3 年期欧元远期，两者等价。现在资金充足率约为 97.0%，他们还需要再存入约 9,000 美元（或接受一个稍小的公寓预算），而不是靠承担汇率风险来补上缺口。
      en: |-
        (a) The forward rate is $F = 1.10 \times \left(\frac{1.04}{1.022}\right)^3 \approx 1.1592$ dollars per euro, about 5.4% above the spot rate. The goal's value today: discount at the euro risk-free rate and convert to dollars, $\frac{300}{1.022^3} \times 1.10 \approx 309.1$ thousand dollars (equivalently, $\frac{300 \times 1.1592}{1.04^3}$). The funded ratio is $\frac{300}{309.1} \approx 97.0\%$.
        (b) The forward rate is above the spot rate exactly because of the gap between the two interest rates: the extra interest earned in dollars just offsets the extra dollars paid under the forward (covered interest parity). Locking in the rate is not "expensive", and the extra interest on dollar Treasuries is not an extra gain; they are two sides of the same thing. Without locking in, how many euros they get in 3 years depends on the exchange rate then, which often moves 8% to 10% a year, and the high-rate currency cannot be counted on to depreciate by the rate gap (uncovered interest parity often fails). For a goal priced in euros that must be met, dollar Treasuries are not a riskless asset: they are riskless in dollars, but bear the full exchange-rate risk in euros. The riskless approach is to hold euro riskless assets matching the goal's horizon, such as 3-year German government bonds (about 309.1 thousand dollars locks in 300,000 euros), or to hold dollar Treasuries and buy a 3-year euro forward; the two are equivalent. With a funded ratio of about 97.0%, they need to save about 9,000 dollars more (or accept a slightly smaller apartment budget), rather than close the gap by bearing exchange-rate risk.
    rubric:
      zh-cn:
        - "(a) 通过：远期汇率约 1.1592，目标现值约 309.1 千美元，资金充足率约 97.0%。用美元利率折现 30 万欧元按即期汇率换算的金额，需要订正。"
        - "(b) 通过：指出远期升水等于利差，锁定汇率没有额外成本，美元国债多赚的利息不是额外收益；对欧元目标，美元国债有汇率风险，无风险的做法是持有欧元无风险资产或美元国债加远期；资金缺口应靠多存钱或调整目标解决。只说“汇率可能变化”而不说明远期升水的来源，需要订正。"
      en:
        - "(a) OK: a forward rate of about 1.1592, a present value of about 309.1 thousand dollars and a funded ratio of about 97.0%. Discounting 300,000 euros converted at the spot rate with the dollar rate needs revision."
        - "(b) OK: pointing out that the forward premium equals the rate gap, so locking in has no extra cost and the extra dollar interest is no extra gain; that for a euro goal dollar Treasuries carry exchange-rate risk, and the riskless approach is euro riskless assets or dollar Treasuries plus a forward; and that the shortfall should be closed by saving more or adjusting the goal. Saying only that exchange rates may change, without explaining where the forward premium comes from, needs revision."
