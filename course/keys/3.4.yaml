# Answer key for lesson 3.4. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[3.4#duration]] (section), [[concept:modified-duration]], [[check:Q3]], [[fig:3-1]].
# expected: values are recomputed by course/verify/3.4.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.
# Check questions are answered on the page: `correct` is true / false, or the letter of one of `choices`.
# A wrong answer shows the `why` of the chosen option (or the `hint` of a true / false question), never the
# right answer; `answer` is the full explanation for reference. They have no expected and no rubric.

lesson: "3.4"

context:
  - zh-cn: |-
      学习者学过现值、年金、导数（[[0.1]] 及第 0 阶段）、银行与挤兑（[[2.3]]）、债券定价、零息债、即期利率和凸的价格–收益率关系（[[3.3]]）。讲义还没有讲期限结构理论（[[3.5]]）和违约风险（[[3.6]]）。金额保留两位小数，百分数用百分点表示。
    en: |-
      The learner has studied present value, annuities and derivatives ([[0.1]] and Stage 0), banks and runs ([[2.3]]), and bond pricing, zero-coupon bonds, spot rates and the convex price–yield relation ([[3.3]]). The lesson has not yet covered term structure theories ([[3.5]]) or default risk ([[3.6]]). Amounts to two decimals; percentages in percentage points.
  - concepts: [macaulay-duration, modified-duration, convexity]
    zh-cn: |-
      讲义：价格风险与再投资风险方向相反。$D = \sum_t t\,w_t$，$w_t$ 是现值权重；零息债久期等于期限；票面利率越高、收益率越高久期越短。$D^* = \frac{D}{1 + y}$，$\frac{\Delta P}{P} \approx -D^* \Delta y$（推导留给练习题）。$\frac{\Delta P}{P} \approx -D^* \Delta y + \frac{1}{2} C (\Delta y)^2$，$C = \frac{1}{P}\frac{d^2P}{dy^2} > 0$；凸性大对持有者有利，市场通常为此要求更低的收益率。[[fig:3-1]]：票面利率 5%、收益率 5% 的债券；剩余年数滑块 2–30（步长 1，默认 10），收益率变化滑块 −3 到 3 个百分点（步长 0.25，默认 1）；读数显示修正久期、凸性、实际变化、久期估计和加凸性的估计。
    en: |-
      The lesson: price risk and reinvestment risk move in opposite directions. $D = \sum_t t\,w_t$ with present-value weights $w_t$; a zero's duration equals its maturity; higher coupons and higher yields shorten duration. $D^* = \frac{D}{1 + y}$ and $\frac{\Delta P}{P} \approx -D^* \Delta y$ (the derivation is left to an exercise). $\frac{\Delta P}{P} \approx -D^* \Delta y + \frac{1}{2} C (\Delta y)^2$ with $C = \frac{1}{P}\frac{d^2P}{dy^2} > 0$; more convexity benefits the holder, and markets usually accept a lower yield for it. [[fig:3-1]]: a 5% coupon bond at a 5% yield; a years-to-maturity slider from 2 to 30 (in steps of 1, default 10) and a yield-change slider from −3 to 3 points (in steps of 0.25, default 1); the readout shows modified duration, convexity, the exact change, the duration estimate and the estimate with convexity.
  - concepts: [immunization]
    zh-cn: |-
      讲义：免疫的条件是资产与负债的现值相等、久期相等；可以用零息债或债券组合（组合久期为价值加权平均）；限制：需要定期调整、只对平行移动近似成立、负债凸性应低于资产。银行资产久期长、负债久期短，利率上升时股东权益受损。
    en: |-
      The lesson: immunization requires equal present values and equal durations of assets and liabilities; it can use a zero or a portfolio of bonds (portfolio duration is the value-weighted average); limits: it needs rebalancing, holds only approximately for parallel shifts, and liabilities should have less convexity than assets. Banks have long-duration assets and short-duration liabilities, so rising rates hurt their equity.

common_errors:
  - questions: [C1, Q3]
    zh-cn: |-
      以为短期债券没有利率风险。短期债券价格风险小，但再投资风险大。
    en: |-
      Thinking short-term bonds have no interest rate risk. Their price risk is small, but their reinvestment risk is large.
  - questions: [C2, Q2]
    zh-cn: |-
      把久期等同于期限。只有零息债的久期等于期限；附息债券的久期较短，而永续债券的久期是有限的。
    en: |-
      Equating duration with maturity. Only a zero's duration equals its maturity; coupon bonds have shorter durations, and a perpetuity's duration is finite.
  - questions: [C3, Q5]
    zh-cn: |-
      以为久期估计在收益率变化较大时仍然准确，或者弄错凸性修正的方向：对普通债券，久期总是高估价格的下跌、低估价格的上涨。
    en: |-
      Thinking the duration estimate stays accurate for large yield changes, or getting the direction of the convexity correction wrong: for ordinary bonds, duration always overstates price falls and understates price rises.
  - questions: [C4, Q3]
    zh-cn: |-
      以为免疫一次就够了。时间流逝和利率变化会改变久期，组合要定期调整。
    en: |-
      Thinking immunization is set once and for all. Time and rate changes alter durations, so the portfolio must be rebalanced.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: rate-risk
    concepts: [macaulay-duration]
    question:
      zh-cn: |-
        一位投资者 5 年后要用一笔钱。刚买入，利率就大幅下降并一直保持在低位。哪种做法的结果会好于原先的预期？
      en: |-
        An investor will need some money in 5 years. Just after he buys, rates fall sharply and stay low. Which approach ends up better than originally expected?
    choices:
      - zh-cn: 每年买 1 年期国债，到期再滚动
        en: Buying 1-year Treasury bills each year and rolling them over
        why:
          zh-cn: "滚动 1 年期国债的人，每年到期后要按当时的利率再投资。利率下降后，他能得到的利率变高还是变低？"
          en: "The investor rolling 1-year bills must reinvest each year at the rate of the time. After rates fall, does he earn more or less?"
      - zh-cn: 买 30 年期国债，5 年后卖出
        en: Buying a 30-year Treasury bond and selling it after 5 years
      - zh-cn: 两种做法都好于预期
        en: Both approaches
        why:
          zh-cn: "两种做法面对的风险方向相反，利率的同一种变化不会让两者都受益。"
          en: "The two approaches face risks in opposite directions, so one move in rates cannot help both."
      - zh-cn: 两种做法都差于预期
        en: Neither approach
        why:
          zh-cn: "两种做法面对的风险方向相反，利率的同一种变化不会让两者都受损。"
          en: "The two approaches face risks in opposite directions, so one move in rates cannot hurt both."
    correct: B
    answer:
      zh-cn: |-
        (B)。利率下降使 30 年期国债的价格大幅上涨，5 年后卖出得到的钱多于预期；滚动 1 年期国债的人以后只能按低利率再投资，结果差于预期（再投资风险）。利率上升时正好反过来。
      en: |-
        (B). Falling rates push the 30-year bond's price up sharply, so selling it after 5 years brings more than expected; the investor rolling 1-year bills must reinvest at low rates and ends up with less than expected (reinvestment risk). Rising rates reverse both results.

  - id: C2
    kind: check
    section: duration
    concepts: [macaulay-duration, modified-duration]
    question:
      zh-cn: |-
        收益率相同时，在所有 10 年后到期的国债中，10 年期零息债的价格对收益率的变化最敏感。
      en: |-
        At the same yield, among all Treasuries maturing in 10 years, the 10-year zero-coupon bond's price is the most sensitive to changes in yield.
    correct: true
    hint:
      zh-cn: "想一想：10 年后到期的国债中，哪一种的现金流平均收回得最晚？久期与价格的敏感性有什么关系？"
      en: "Think: among Treasuries maturing in 10 years, which one returns its cash latest on average? How is duration related to price sensitivity?"
    answer:
      zh-cn: |-
        对。零息债的全部现金流都在第 10 年，久期等于 10 年；附息债券有一部分现金较早收回，久期短于 10 年。修正久期越长，价格对收益率越敏感。
      en: |-
        True. All of the zero's cash flow comes in year 10, so its duration is 10 years; a coupon bond returns some cash earlier, so its duration is shorter than 10 years. The longer the modified duration, the more sensitive the price is to the yield.

  - id: C3
    kind: check
    section: convexity
    concepts: [convexity, modified-duration]
    widget: { id: duration-convexity, set: { n: 10, dy: 2 } }
    question:
      zh-cn: |-
        在 [[fig:3-1]] 中，把收益率的变化固定为上升 2 个百分点，再把债券的期限从 10 年拉长到 30 年。久期估计与实际价格变化之间的差距会：
      en: |-
        In [[fig:3-1]], fix the change in yield at a 2-point rise and lengthen the bond's maturity from 10 to 30 years. The gap between the duration estimate and the exact price change:
    choices:
      - zh-cn: 变大
        en: Grows
      - zh-cn: 变小
        en: Shrinks
        why:
          zh-cn: "期限变长时，价格曲线弯得更厉害还是更平缓？直线近似的误差会怎样？"
          en: "As maturity lengthens, does the price curve bend more or less? What happens to the error of a straight-line approximation?"
      - zh-cn: 不变，因为收益率的变化相同
        en: Stays the same, because the change in yield is the same
        why:
          zh-cn: "同样的收益率变化，对不同期限的债券影响不同；久期估计的误差取决于价格曲线的弯曲程度。"
          en: "The same change in yield affects bonds of different maturities differently; the error of the duration estimate depends on how much the price curve bends."
      - zh-cn: 消失，因为长期债券的价格曲线接近直线
        en: Disappears, because the price curve of a long bond is close to a straight line
        why:
          zh-cn: "在图中把期限拉长，看看实际变化的曲线是否变直了。"
          en: "Lengthen the maturity in the figure and see whether the exact-change curve becomes straight."
    correct: A
    answer:
      zh-cn: |-
        (A)。期限越长，凸性越大，价格曲线越弯，直线（久期）近似的误差越大。所以长期债券在利率大幅变化时，更需要加上凸性的修正。
      en: |-
        (A). The longer the maturity, the larger the convexity and the more the price curve bends, so the straight-line (duration) approximation errs more. Long bonds therefore need the convexity correction more when rates move a lot.

  - id: C4
    kind: check
    section: immunization
    concepts: [immunization, macaulay-duration]
    question:
      zh-cn: |-
        5 年后要支付一笔确定的钱。下列哪个组合（今天的价值都等于这笔负债的现值）最接近免疫？
      en: |-
        A fixed amount must be paid in 5 years. Which portfolio (each worth today the present value of the liability) comes closest to immunization?
    choices:
      - zh-cn: 全部买 1 年期国债，每年滚动
        en: All in 1-year Treasury bills, rolled over every year
        why:
          zh-cn: "滚动 1 年期国债的久期很短，主要承担再投资风险：利率下降时，5 年后得到的钱会少于负债。"
          en: "Rolling 1-year bills has a very short duration and bears mainly reinvestment risk: if rates fall, the money in 5 years falls short of the liability."
      - zh-cn: 全部买 30 年期国债
        en: All in 30-year Treasury bonds
        why:
          zh-cn: "30 年期国债的久期远长于 5 年，主要承担价格风险：利率上升时，5 年后卖出会亏损。"
          en: "A 30-year bond has a duration far longer than 5 years and bears mainly price risk: if rates rise, selling after 5 years means a loss."
      - zh-cn: Macaulay 久期为 5 年的债券组合
        en: A bond portfolio with a Macaulay duration of 5 years
      - zh-cn: 5 年后到期、票面利率很高的附息债券
        en: A coupon bond maturing in 5 years with a very high coupon rate
        why:
          zh-cn: "到期日相同不等于久期相同。票面利率很高的债券，较多的现金早早收回，它的久期是 5 年吗？"
          en: "The same maturity date does not mean the same duration. A bond with a very high coupon returns much of its cash early; is its duration 5 years?"
    correct: C
    answer:
      zh-cn: |-
        (C)。免疫要求资产的久期等于负债的久期（5 年），这样一次利率变化带来的价格变化和再投资收益的变化相互抵消。票面利率很高的 5 年期债券到期日虽然相同，但久期短于 5 年，主要承担再投资风险。
      en: |-
        (C). Immunization requires the assets' duration to equal the liability's (5 years), so that the price effect and the reinvestment effect of a rate change offset each other. A high-coupon 5-year bond has the same maturity date but a duration shorter than 5 years, so it carries mainly reinvestment risk.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: B
    star: true
    concepts: [modified-duration, macaulay-duration, derivative]
    question:
      zh-cn: |-
        由 $P = \sum_{t=1}^{T} \text{CF}_t (1 + y)^{-t}$，对 $y$ 求导，证明 $\frac{1}{P}\frac{dP}{dy} = -\frac{D}{1 + y}$，从而 $\frac{\Delta P}{P} \approx -D^* \Delta y$。为什么这个近似只在 $\Delta y$ 较小时准确？
      en: |-
        From $P = \sum_{t=1}^{T} \text{CF}_t (1 + y)^{-t}$, differentiate with respect to $y$ and show that $\frac{1}{P}\frac{dP}{dy} = -\frac{D}{1 + y}$, so that $\frac{\Delta P}{P} \approx -D^* \Delta y$. Why is this approximation accurate only for small $\Delta y$?
    answer:
      zh-cn: |-
        $\frac{dP}{dy} = \sum_t (-t)\,\text{CF}_t (1 + y)^{-t-1} = -\frac{1}{1 + y} \sum_t t \, \frac{\text{CF}_t}{(1 + y)^t}$。两边除以 $P$，右边的和除以 $P$ 正是 $\sum_t t\,w_t = D$，所以 $\frac{1}{P}\frac{dP}{dy} = -\frac{D}{1 + y} = -D^*$。用导数近似变化：$\Delta P \approx \frac{dP}{dy}\Delta y$。
        导数只描述曲线在一点的斜率；价格曲线是凸的，$\Delta y$ 越大，曲线偏离切线越远，需要二阶项（凸性）修正。
      en: |-
        $\frac{dP}{dy} = \sum_t (-t)\,\text{CF}_t (1 + y)^{-t-1} = -\frac{1}{1 + y} \sum_t t \, \frac{\text{CF}_t}{(1 + y)^t}$. Dividing by $P$, the sum over $P$ is exactly $\sum_t t\,w_t = D$, so $\frac{1}{P}\frac{dP}{dy} = -\frac{D}{1 + y} = -D^*$. Approximating the change by the derivative: $\Delta P \approx \frac{dP}{dy}\Delta y$.
        A derivative only gives the slope at one point; the price curve is convex, so the larger $\Delta y$, the further the curve moves away from the tangent line, and a second-order term (convexity) is needed.
    rubric:
      zh-cn:
        - "求导正确，识别出 $D$。"
        - "用凸性说明近似的局限。"
      en:
        - "Correct differentiation, identifying $D$."
        - "Explains the limit of the approximation by convexity."

  - id: Q2
    kind: exercise
    level: B
    concepts: [macaulay-duration, perpetuity]
    expected: { dp: "21" }
    question:
      zh-cn: |-
        永续债券的久期为 $D = \frac{1 + y}{y}$。收益率为 5% 时它是多少？永续债券永远不到期，为什么久期是有限的，而且比 10 年期零息债（久期 10）还长？
      en: |-
        A perpetuity has duration $D = \frac{1 + y}{y}$. What is it at a 5% yield? A perpetuity never matures, so why is its duration finite, and why is it longer than that of a 10-year zero (duration 10)?
    answer:
      zh-cn: |-
        $D = \frac{1.05}{0.05} = 21$ 年。
        久期按现值加权，远期现金流的现值迅速变小，很远的将来对平均时间的贡献越来越小，所以和是有限的。但永续债券有大量价值来自 10 年以后的现金流（约占价值的 61%），它们的权重把平均回收时间拉到 10 年以上；10 年期零息债的全部价值都在第 10 年，正好是 10 年。
      en: |-
        $D = \frac{1.05}{0.05} = 21$ years.
        Duration weights by present value, and the present value of distant cash flows shrinks quickly, so the far future contributes less and less and the sum is finite. Still, much of a perpetuity's value comes from cash flows after year 10 (about 61% of its value), and their weight pulls the average above 10 years; a 10-year zero has all its value in year 10, so its duration is exactly 10.
    rubric:
      zh-cn:
        - "21 年。"
        - "用现值权重解释有限，以及为什么超过 10 年。"
      en:
        - "21 years."
        - "Explains finiteness by present-value weights and why it exceeds 10."

  - id: Q3
    kind: exercise
    level: C
    star: true
    concepts: [immunization, macaulay-duration]
    expected: { roll: "9083.22", long: "11009.32", match: "10016.65" }
    question:
      zh-cn: |-
        5 年后要支付 10,000，今天有 7835.26，收益率曲线平坦在 5%。买入后收益率立即平行下降到 3% 并保持不变。比较三种做法在第 5 年能得到多少：(i) 每年滚动 1 年期零息债；(ii) 买 10 年期零息债，第 5 年卖出；(iii) 一半 2 年期、一半 8 年期零息债，到期的钱按当时的利率再投资，第 5 年卖出剩下的债券。哪种做法最接近 10,000？为什么？
      en: |-
        10,000 is due in 5 years, 7835.26 is available today, and the yield curve is flat at 5%. Right after buying, yields shift down in parallel to 3% and stay there. Compare how much each approach has in year 5: (i) roll 1-year zeros every year; (ii) buy a 10-year zero and sell it in year 5; (iii) half in a 2-year zero and half in an 8-year zero, reinvesting maturing money at the prevailing rate and selling the remaining bond in year 5. Which approach comes closest to 10,000? Why?
    answer:
      zh-cn: |-
        (i) $7835.26 \times 1.03^5 \approx 9083.22$，不够：再投资风险。
        (ii) 零息债面值 $7835.26 \times 1.05^{10}$，第 5 年还剩 5 年，价格 $\frac{7835.26 \times 1.05^{10}}{1.03^5} \approx 11009.32$，多出很多：价格风险带来收益（利率上升时则会大亏）。
        (iii) 2 年期部分到期后按 3% 再投资 3 年，8 年期部分在第 5 年还剩 3 年、按 3% 定价，合计约 10016.65，最接近 10,000。它的久期等于 5 年，价格上涨和再投资收益下降几乎抵消。
      en: |-
        (i) $7835.26 \times 1.03^5 \approx 9083.22$, not enough: reinvestment risk.
        (ii) The zero has face value $7835.26 \times 1.05^{10}$; in year 5 it has 5 years left and is worth $\frac{7835.26 \times 1.05^{10}}{1.03^5} \approx 11009.32$, far more: price risk working in its favor (a rate rise would have caused a large loss).
        (iii) The 2-year part matures and is reinvested at 3% for 3 years, and the 8-year part has 3 years left in year 5 and is priced at 3%, for a total of about 10016.65, closest to 10,000. Its duration equals 5 years, so the price gain and the loss of reinvestment income almost cancel.
    rubric:
      zh-cn:
        - "三个结果约 9083.22、11009.32、10016.65。"
        - "用久期匹配解释为什么 (iii) 最接近。"
      en:
        - "About 9083.22, 11009.32 and 10016.65."
        - "Explains with duration matching why (iii) is closest."

  - id: Q4
    kind: exercise
    level: B
    concepts: [modified-duration, bank-run]
    expected: { de: "-10.2" }
    question:
      zh-cn: |-
        一家银行的资产为 100，修正久期 6；负债（存款）为 90，修正久期 1；股东权益 10。利率平行上升 2 个百分点。(a) 用修正久期估计股东权益的变化。(b) 结合 [[2.3]] 的硅谷银行，说明为什么这样的久期缺口会让一家没有坏账的银行陷入危机。
      en: |-
        A bank has assets of 100 with modified duration 6, liabilities (deposits) of 90 with modified duration 1, and equity of 10. Rates rise in parallel by 2 points. (a) Use modified duration to estimate the change in equity. (b) With Silicon Valley Bank from [[2.3]] in mind, explain why such a duration gap can put a bank with no bad loans into crisis.
    answer:
      zh-cn: |-
        (a) 资产变化 $-6 \times 2\% \times 100 = -12$，负债变化 $-1 \times 2\% \times 90 = -1.8$，股东权益变化 $-12 - (-1.8) = -10.2$，几乎全部损失。
        (b) 银行的资产久期远长于负债，利率上升使资产的市场价值大幅下降，即使借款人都按时还款，按市场价格计算的股东权益也可能变为负数。一旦存款人意识到这一点、开始取款，银行就要按低价卖出债券，把账面上的损失变成实际损失，引发挤兑。
      en: |-
        (a) Assets change by $-6 \times 2\% \times 100 = -12$, liabilities by $-1 \times 2\% \times 90 = -1.8$, so equity changes by $-12 - (-1.8) = -10.2$: almost all of it is lost.
        (b) The bank's assets have a much longer duration than its liabilities, so rising rates cut the market value of its assets sharply; even if every borrower pays on time, equity at market prices can turn negative. Once depositors realize this and start withdrawing, the bank must sell bonds at low prices, turning paper losses into real ones and setting off a run.
    rubric:
      zh-cn:
        - "(a) 约 −10.2（写作 - 或 − 均可）。"
        - "(b) 说明久期缺口、市值损失与挤兑的联系。"
      en:
        - "(a) About −10.2 (written with - or −)."
        - "(b) Links the duration gap, market-value losses and the run."

  - id: Q5
    kind: exercise
    level: B
    concepts: [convexity, macaulay-duration]
    expected: { cb: "27.21", cbb: "41.72" }
    question:
      zh-cn: |-
        收益率曲线平坦在 5%。“子弹”组合只持有 5 年期零息债；“哑铃”组合一半 1 年期、一半 9 年期零息债。两者久期都是 5 年。零息债的凸性为 $\frac{T(T + 1)}{(1 + y)^2}$。(a) 两个组合的凸性各是多少？(b) 收益率平行上升或下降 2 个百分点时，哪个组合表现更好？如果这种优势是确定的，为什么市场上哑铃组合的收益率通常略低？
      en: |-
        The yield curve is flat at 5%. A "bullet" portfolio holds only a 5-year zero; a "barbell" holds half in a 1-year zero and half in a 9-year zero. Both have a duration of 5 years. A zero's convexity is $\frac{T(T + 1)}{(1 + y)^2}$. (a) What is each portfolio's convexity? (b) If yields shift up or down by 2 points, which portfolio does better? If this advantage were certain, why does the barbell usually yield slightly less in the market?
    answer:
      zh-cn: |-
        (a) 子弹：$\frac{5 \times 6}{1.05^2} \approx 27.21$；哑铃：$\frac{1}{2}\left(\frac{1 \times 2}{1.05^2} + \frac{9 \times 10}{1.05^2}\right) \approx 41.72$。
        (b) 哑铃更好：收益率上升 2 个百分点时，子弹下跌约 9.00%、哑铃约 8.74%；下降 2 个百分点时，子弹上涨约 10.09%、哑铃约 10.42%。较大的凸性在利率大幅变化时总是有利，所以投资者愿意为它付出代价，接受较低的收益率；如果利率几乎不变，哑铃就因收益率较低而落后。另外，它只在平行移动时成立；长短期利率变化不同时结果可能相反。
      en: |-
        (a) Bullet: $\frac{5 \times 6}{1.05^2} \approx 27.21$; barbell: $\frac{1}{2}\left(\frac{1 \times 2}{1.05^2} + \frac{9 \times 10}{1.05^2}\right) \approx 41.72$.
        (b) The barbell: for a 2-point rise, the bullet falls about 9.00% and the barbell about 8.74%; for a 2-point fall, the bullet rises about 10.09% and the barbell about 10.42%. More convexity always helps when rates move a lot, so investors pay for it by accepting a lower yield; if rates barely move, the barbell falls behind because of that lower yield. Also, this holds only for parallel shifts; if short and long rates move differently, the result can reverse.
    rubric:
      zh-cn:
        - "(a) 约 27.21 和 41.72。"
        - "(b) 哑铃在两个方向都更好，并说明凸性的价格和平行移动的限制。"
      en:
        - "(a) About 27.21 and 41.72."
        - "(b) The barbell does better both ways; explains the price of convexity and the parallel-shift limit."
