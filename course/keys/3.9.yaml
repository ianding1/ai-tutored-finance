# Answer key for lesson 3.9. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[1.5]] (lesson), [[3.9#gordon]] (section), [[concept:pvgo]], [[check:Q3]], [[fig:2-1]].
# expected: values are recomputed by course/verify/3.9.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.
# Check questions are answered on the page: `correct` is true / false, or the letter of one of `choices`.
# A wrong answer shows the `why` of the chosen option (or the `hint` of a true / false question), never the
# right answer; `answer` is the full explanation for reference. They have no expected and no rubric.

lesson: "3.9"

context:
  - zh-cn: |-
      学习者学过现值、等比数列和增长永续年金（[[0.1]]）、长期增长（[[2.2]]）、NPV 和资本成本（[[3.2]]）、债券定价（[[3.3]]）、财务报表（[[3.7]]）、ROE 和 ROIC（[[3.8]]）。讲义还没有讲怎样由风险确定股权成本（[[4.4]]）和自由现金流估值（[[3.10]]）。金额保留两位小数。
    en: |-
      The learner has studied present value, geometric series and growing perpetuities ([[0.1]]), long-run growth ([[2.2]]), NPV and the cost of capital ([[3.2]]), bond pricing ([[3.3]]), financial statements ([[3.7]]), and ROE and ROIC ([[3.8]]). The lesson has not yet covered how to set the cost of equity from risk ([[4.4]]) or free cash flow valuation ([[3.10]]). Amounts to two decimals.
  - concepts: [dividend-discount-model, cost-of-equity]
    zh-cn: |-
      讲义：$P_0 = \frac{D_1 + P_1}{1 + r}$，反复代入，在 $\frac{P_T}{(1 + r)^T} \to 0$ 时 $P_0 = \sum_{t=1}^{\infty} \frac{D_t}{(1 + r)^t}$；结果与持有期无关。股权成本是股东根据风险要求的预期收益率，通常高于借款利率。
    en: |-
      The lesson: $P_0 = \frac{D_1 + P_1}{1 + r}$; substituting repeatedly, when $\frac{P_T}{(1 + r)^T} \to 0$, $P_0 = \sum_{t=1}^{\infty} \frac{D_t}{(1 + r)^t}$; the result does not depend on the holding period. The cost of equity is the expected return shareholders require given risk, usually above the borrowing rate.
  - concepts: [gordon-growth-model]
    zh-cn: |-
      讲义：$D_t = D_1(1 + g)^{t-1}$，$g < r$ 时 $P_0 = \frac{D_1}{r - g}$（推导留给练习题）；$r = \frac{D_1}{P_0} + g$。$g$ 接近 $r$ 时价格对 $g$ 和 $r$ 非常敏感。[[fig:2-1]]：$D_1 = 2$；滑块：要求的收益率 $r$ 6% 到 12%（步长 0.5，默认 9），增长率 $g$ 0 到 8%（步长 0.25，默认 4）；读数显示股价，以及 $g$ 再提高 0.5 个百分点时的股价和变化百分比。
    en: |-
      The lesson: $D_t = D_1(1 + g)^{t-1}$; for $g < r$, $P_0 = \frac{D_1}{r - g}$ (the derivation is left to an exercise); $r = \frac{D_1}{P_0} + g$. When $g$ is close to $r$, the price is very sensitive to $g$ and $r$. [[fig:2-1]]: $D_1 = 2$; sliders: required return $r$ from 6% to 12% (in steps of 0.5, default 9) and growth $g$ from 0 to 8% (in steps of 0.25, default 4); the readout shows the price, and the price and percentage change with $g$ 0.5 points higher.
  - concepts: [payout-ratio, sustainable-growth-rate, pvgo]
    zh-cn: |-
      讲义：派息率 = 股息 ÷ 净利润，留存比率 $b$；不增加负债比例、不发新股、新权益赚取同样的 ROE 时，$g = b \times \text{ROE}$。$P_0 = \frac{E_1}{r} + \text{PVGO}$，$\frac{E_1}{r}$ 是全部派发、不增长时的价值。讲义没有说明 PVGO 何时为正，留给随堂题。
    en: |-
      The lesson: payout ratio = dividends ÷ net income, retention ratio $b$; with no rise in the debt ratio, no new shares, and the same ROE on new equity, $g = b \times \text{ROE}$. $P_0 = \frac{E_1}{r} + \text{PVGO}$, where $\frac{E_1}{r}$ is the value if all profit is paid out and there is no growth. The lesson does not say when PVGO is positive; that is left to a check question.
  - concepts: [dividend-discount-model, gordon-growth-model]
    zh-cn: |-
      讲义：多阶段模型 $P_0 = \sum_{t=1}^{T} \frac{D_t}{(1 + r)^t} + \frac{P_T}{(1 + r)^T}$，终值 $P_T = \frac{D_{T+1}}{r - g_L}$，$g_L$ 是可以永远维持的增长率。不派息或主要回购的公司：用股东得到的全部现金（股息加回购）估值整个股权，再除以现在的股数，或用自由现金流（[[3.10]]）。估值应看作区间。
    en: |-
      The lesson: multistage model $P_0 = \sum_{t=1}^{T} \frac{D_t}{(1 + r)^t} + \frac{P_T}{(1 + r)^T}$, terminal value $P_T = \frac{D_{T+1}}{r - g_L}$, where $g_L$ can last forever. Companies that pay no dividends or mainly buy back shares: value the whole equity with all cash to shareholders (dividends plus buybacks) and divide by today's shares, or use free cash flow ([[3.10]]). A valuation should be read as a range.

common_errors:
  - questions: [C1, C4]
    zh-cn: |-
      以为只有长期持有、领取股息的投资者才需要考虑股息；或者以为不派息的股票就不能用 DDM 的思路估值。
    en: |-
      Thinking dividends matter only to long-term holders who collect them; or thinking stocks that pay no dividends cannot be valued with the DDM idea.
  - questions: [C2, Q1, Q4]
    zh-cn: |-
      忽略价格对 $r - g$ 的敏感性；或者在 $g \ge r$ 时仍然套用 Gordon 公式。
    en: |-
      Ignoring how sensitive the price is to $r - g$; or applying the Gordon formula when $g \ge r$.
  - questions: [C3, Q3]
    zh-cn: |-
      以为留存更多利润、增长更快，股价就一定更高。只有新投资的回报高于股权成本时，增长才增加价值。
    en: |-
      Thinking that retaining more profit and growing faster always raises the price. Growth adds value only when new investment earns more than the cost of equity.
  - questions: [Q2]
    zh-cn: |-
      计算终值时用错股息（应为 $D_{T+1}$，而不是 $D_T$），或者忘记把终值从第 $T$ 年折现到今天。
    en: |-
      Using the wrong dividend for the terminal value ($D_{T+1}$, not $D_T$), or forgetting to discount the terminal value from year $T$ to today.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: intrinsic-value
    concepts: [dividend-discount-model, cost-of-equity]
    question:
      zh-cn: |-
        一家盈利的公司宣布：永远不派股息，也永远不以回购或任何其他方式把现金交给股东，公司也不会被收购或清算。按股利贴现模型，它的股票值多少？
      en: |-
        A profitable company announces that it will never pay dividends, never return cash to shareholders through buybacks or in any other way, and will never be acquired or liquidated. By the dividend discount model, what is its stock worth?
    choices:
      - zh-cn: "0"
        en: "0"
      - zh-cn: 每股账面价值
        en: Its book value per share
        why:
          zh-cn: "账面价值是过去投入的资本，但股东永远无法把它拿回来。"
          en: "Book value is capital put in the past, but shareholders can never get it back."
      - zh-cn: 未来所有利润的现值
        en: The present value of all its future profits
        why:
          zh-cn: "利润留在公司里，如果永远不以任何方式交给股东，股东从这些利润中得到什么？"
          en: "If profits stay in the company and are never passed to shareholders in any way, what do shareholders get from them?"
      - zh-cn: 无法确定，取决于下一个买家愿意付多少
        en: It cannot be determined; it depends on what the next buyer will pay
        why:
          zh-cn: "下一个买家面对同样的问题：他也永远得不到现金。按股利贴现模型，这一连串的价格最终由什么支撑？"
          en: "The next buyer faces the same problem: he never gets cash either. By the dividend discount model, what ultimately supports this chain of prices?"
    correct: A
    answer:
      zh-cn: |-
        (A)。股东永远得不到任何现金，股价只能来自下一个买家愿意付的价钱，而下一个买家面对同样的问题，层层推下去没有任何现金支撑。现实中不派息的公司有价值，是因为投资者预期它将来会派息、回购，或者被收购、清算。
      en: |-
        (A). Shareholders never receive any cash, so the price could only come from what the next buyer would pay, and that buyer faces the same problem; down the chain nothing is backed by cash. In reality, companies that pay no dividends have value because investors expect dividends, buybacks, an acquisition or a liquidation later.

  - id: C2
    kind: check
    section: gordon
    concepts: [gordon-growth-model]
    widget: { id: gordon-price, set: { r: 9, g: 4 } }
    question:
      zh-cn: |-
        在 [[fig:2-1]] 中，设要求的收益率为 9%。先把增长率从 1% 提高到 2%，再把增长率从 7% 提高到 8%。两次股价变化的百分比相比：
      en: |-
        In [[fig:2-1]], set the required return to 9%. First raise growth from 1% to 2%, then raise it from 7% to 8%. Comparing the two percentage changes in price:
    choices:
      - zh-cn: 两次相同，因为增长率都提高了 1 个百分点
        en: They are equal, because growth rose by 1 percentage point both times
        why:
          zh-cn: "股价是 $\\frac{D_1}{r - g}$。两次增长率都提高 1 个百分点，但分母变化的比例一样吗？"
          en: "The price is $\\frac{D_1}{r - g}$. Growth rises by 1 point both times, but does the denominator change by the same proportion?"
      - zh-cn: 第二次大得多
        en: The second is much larger
      - zh-cn: 第一次大得多
        en: The first is much larger
        why:
          zh-cn: "算一算两次分母 $r - g$ 各变化了百分之几。"
          en: "Work out by what percentage the denominator $r - g$ changes each time."
      - zh-cn: 两次都很小
        en: Both are small
        why:
          zh-cn: "在图中试一试：增长率接近 9% 时，股价的变化大吗？"
          en: "Try it in the figure: is the price change small when growth is close to 9%?"
    correct: B
    answer:
      zh-cn: |-
        (B)。股价是 $\frac{D_1}{r - g}$：从 1% 到 2%，分母从 8 个百分点变为 7 个，股价上涨约 14%；从 7% 到 8%，分母从 2 个百分点变为 1 个，股价翻倍。$g$ 越接近 $r$，价格对增长率的假设越敏感。
      en: |-
        (B). The price is $\frac{D_1}{r - g}$: from 1% to 2% the denominator goes from 8 to 7 percentage points and the price rises about 14%; from 7% to 8% it goes from 2 to 1, and the price doubles. The closer $g$ is to $r$, the more sensitive the price is to the growth assumption.

  - id: C3
    kind: check
    section: growth
    concepts: [sustainable-growth-rate, pvgo, payout-ratio, return-on-equity]
    question:
      zh-cn: |-
        公司把更多的利润留下来再投资，增长率因此提高，股价就一定上升。
      en: |-
        If a company retains more of its profit to reinvest and its growth rate rises as a result, its stock price must go up.
    correct: false
    hint:
      zh-cn: "想一想：留存的利润用于新投资，新投资的回报与股东自己能得到的回报（股权成本）相比，会怎样影响股价？"
      en: "Think: retained profit goes into new investment. How does the return on that investment, compared with what shareholders could earn themselves (the cost of equity), affect the price?"
    answer:
      zh-cn: |-
        错。只有新投资的回报（ROE）高于股权成本时，留存利润才提高股价。ROE 低于股权成本时，把钱留在公司里投资不如还给股东，公司增长了，股价反而下降（PVGO 为负）。
      en: |-
        False. Retaining profit raises the price only when new investment earns a return (ROE) above the cost of equity. When ROE is below the cost of equity, the money is better returned to shareholders; the company grows, but its price falls (PVGO is negative).

  - id: C4
    kind: check
    section: multistage
    concepts: [gordon-growth-model, dividend-discount-model]
    question:
      zh-cn: |-
        一家公司的股息过去几年每年增长 12%，股权成本为 9%。把 $g = 12\%$ 代入 Gordon 公式得到一个负的股价，这说明这只股票没有价值。
      en: |-
        A company's dividends have grown 12% a year in recent years, and its cost of equity is 9%. Plugging $g = 12\%$ into the Gordon formula gives a negative price, which shows that the stock has no value.
    correct: false
    hint:
      zh-cn: "想一想：Gordon 公式是在什么条件下推出来的？这里的增长率满足这个条件吗？一家公司能永远以 12% 增长吗？"
      en: "Think: under what condition is the Gordon formula derived? Does this growth rate meet it? Can a company grow at 12% forever?"
    answer:
      zh-cn: |-
        错。Gordon 公式只在 $g < r$ 时成立；$g \ge r$ 时股息现值之和发散，公式给出的负数没有意义。而且没有公司能永远以 12% 增长。应该用多阶段模型：先逐年估计高增长期的股息，再假设一个较低、能永远维持的增长率计算终值。
      en: |-
        False. The Gordon formula holds only when $g < r$; when $g \ge r$ the sum of present values diverges and the negative number is meaningless. Besides, no company can grow at 12% forever. A multistage model should be used: estimate the dividends of the high-growth years one by one, then compute a terminal value with a lower growth rate that can last forever.

  # ---------- Exercises (练习题) ----------
  - id: Q1
    kind: exercise
    level: B
    star: true
    concepts: [gordon-growth-model, geometric-series, growing-perpetuity]
    expected: { r: "7", r2: "6" }
    question:
      zh-cn: |-
        (a) 由 $P_0 = \sum_{t=1}^{\infty} \frac{D_1(1 + g)^{t-1}}{(1 + r)^t}$ 推出 $P_0 = \frac{D_1}{r - g}$，并说明为什么需要 $g < r$。证明这时一年后的股价 $P_1 = P_0(1 + g)$。
        (b) 一个股票市场的股息率为 2%，投资者预期股息每年增长 5%。按 Gordon 模型，预期收益率是多少？如果股价随后上涨一倍，而股息和增长预期都不变，此后的预期收益率变为多少？这对在估值很高时买入的投资者意味着什么？
      en: |-
        (a) From $P_0 = \sum_{t=1}^{\infty} \frac{D_1(1 + g)^{t-1}}{(1 + r)^t}$, derive $P_0 = \frac{D_1}{r - g}$ and explain why $g < r$ is needed. Show that the price a year later is $P_1 = P_0(1 + g)$.
        (b) A stock market has a dividend yield of 2%, and investors expect dividends to grow 5% a year. By the Gordon model, what is the expected return? If prices then double while dividends and growth expectations stay the same, what does the expected return become? What does this mean for investors who buy when valuations are high?
    answer:
      zh-cn: |-
        (a) 这是首项 $\frac{D_1}{1 + r}$、公比 $q = \frac{1 + g}{1 + r}$ 的等比数列。$|q| < 1$，即 $g < r$ 时收敛，和为 $\frac{D_1}{1 + r} \cdot \frac{1}{1 - q} = \frac{D_1}{1 + r} \cdot \frac{1 + r}{r - g} = \frac{D_1}{r - g}$；$g \ge r$ 时各项不趋于 0，和发散。一年后的股价 $P_1 = \frac{D_2}{r - g} = \frac{D_1(1 + g)}{r - g} = P_0(1 + g)$：股价和股息以同样的速度增长。
        (b) $r = 2\% + 5\% = 7\%$。股价翻倍后股息率降为 1%，预期收益率 $1\% + 5\% = 6\%$。已经持有的人从上涨中获益，但此后买入的人预期收益更低：估值上升把未来的收益提前实现了。估值很高时买入，长期预期收益较低。
      en: |-
        (a) This is a geometric series with first term $\frac{D_1}{1 + r}$ and ratio $q = \frac{1 + g}{1 + r}$. It converges when $|q| < 1$, that is, $g < r$, with sum $\frac{D_1}{1 + r} \cdot \frac{1}{1 - q} = \frac{D_1}{1 + r} \cdot \frac{1 + r}{r - g} = \frac{D_1}{r - g}$; when $g \ge r$ the terms do not go to 0 and the sum diverges. The price a year later is $P_1 = \frac{D_2}{r - g} = \frac{D_1(1 + g)}{r - g} = P_0(1 + g)$: the price grows at the same rate as dividends.
        (b) $r = 2\% + 5\% = 7\%$. After prices double the dividend yield is 1%, so the expected return is $1\% + 5\% = 6\%$. Existing holders gain from the rise, but those who buy afterwards expect less: the rise in valuation pulls future returns forward. Buying at high valuations means lower long-run expected returns.
    rubric:
      zh-cn:
        - "(a) 用等比数列求和推出公式，说明收敛条件，并证明 $P_1 = P_0(1 + g)$。"
        - "(b) 7% 和 6%，并说明高估值意味着较低的预期收益。"
      en:
        - "(a) Derives the formula by summing a geometric series, states the convergence condition, and shows $P_1 = P_0(1 + g)$."
        - "(b) 7% and 6%, explaining that high valuations mean lower expected returns."

  - id: Q2
    kind: exercise
    level: B
    concepts: [dividend-discount-model, gordon-growth-model]
    expected: { v: "33.08", share: "82.2" }
    question:
      zh-cn: |-
        一家公司刚刚派发每股股息 $D_0 = 1$。预计今后 5 年股息每年增长 15%，之后永远每年增长 4%。股权成本为 9%。
        (a) 用两阶段模型求股票的价值。终值的现值占总价值的百分之几？
        (b) 如果第二阶段的增长率是 5% 而不是 4%，价值会大幅改变吗？这说明了什么？（定性说明即可。）
      en: |-
        A company has just paid a dividend of $D_0 = 1$ per share. Dividends are expected to grow 15% a year for the next 5 years and 4% a year forever after. The cost of equity is 9%.
        (a) Use a two-stage model to find the stock's value. What percentage of the total value is the present value of the terminal value?
        (b) If second-stage growth were 5% instead of 4%, would the value change a lot? What does this show? (A qualitative answer is enough.)
    answer:
      zh-cn: |-
        (a) $D_1, \ldots, D_5$ 为 1.15、1.32、1.52、1.75、2.01，现值合计约 5.89。终值 $P_5 = \frac{D_5 \times 1.04}{0.09 - 0.04} \approx 41.84$，现值 $\frac{41.84}{1.09^5} \approx 27.19$。价值约 33.08，终值占约 82.2%。
        (b) 会：终值的分母 $r - g_L$ 从 5 个百分点变为 4 个百分点，终值增加约四分之一，而终值占了价值的八成以上，总价值会增加约 20%。高增长期的股息估计得再仔细，价值仍主要取决于对遥远未来的长期增长率和股权成本的假设。
      en: |-
        (a) $D_1, \ldots, D_5$ are 1.15, 1.32, 1.52, 1.75 and 2.01, with total present value about 5.89. The terminal value is $P_5 = \frac{D_5 \times 1.04}{0.09 - 0.04} \approx 41.84$, with present value $\frac{41.84}{1.09^5} \approx 27.19$. The value is about 33.08, and the terminal value is about 82.2% of it.
        (b) Yes: the terminal value's denominator $r - g_L$ goes from 5 to 4 percentage points, raising the terminal value by about a quarter, and since it is more than 80% of the value, the total rises by about 20%. However carefully the high-growth dividends are estimated, the value depends mostly on assumptions about long-run growth and the cost of equity far in the future.
    rubric:
      zh-cn:
        - "(a) 约 33.08，终值约占 82.2%。"
        - "(b) 价值明显增加，并说明终值的主导作用。"
      en:
        - "(a) About 33.08; terminal value about 82.2%."
        - "(b) The value rises noticeably; explains the dominance of the terminal value."

  - id: Q3
    kind: exercise
    level: B
    concepts: [pvgo, sustainable-growth-rate, cost-of-equity]
    expected: { pvgo: "20", share: "33.33", p: "33.33" }
    question:
      zh-cn: |-
        (a) 一家公司明年每股利润 4，股权成本 10%，股价 60。PVGO 是多少？占股价的百分之几？
        (b) 另一家公司现有业务的 ROE 为 15%，明年每股利润也是 4，股权成本 10%。它计划留存 50% 的利润投资于新项目，但新项目的回报只有 8%。管理层说：“我们的 ROE 有 15%，高于股权成本，所以应该多留存利润。”按新项目的回报求增长率和股价，并与全部派发、不增长时的股价比较。管理层错在哪里？
      en: |-
        (a) A company will earn 4 per share next year; its cost of equity is 10% and its price is 60. What is PVGO? What percentage of the price is it?
        (b) Another company earns an ROE of 15% on its existing business, will also earn 4 per share next year, and has a cost of equity of 10%. It plans to retain 50% of its profit for new projects, but the new projects earn only 8%. Management says: "Our ROE is 15%, above the cost of equity, so we should retain more profit." Using the return on the new projects, find the growth rate and the price, and compare with the price if all profit were paid out with no growth. What is wrong with management's argument?
    answer:
      zh-cn: |-
        (a) 不增长时的价值 $\frac{4}{0.10} = 40$，PVGO $= 60 - 40 = 20$，占股价约 33.33%：市场认为公司将来的投资会创造价值。
        (b) 增长来自新投资：$g = 0.5 \times 8\% = 4\%$，$D_1 = 2$，$P_0 = \frac{2}{0.10 - 0.04} \approx 33.33$，低于全部派发时的 $\frac{4}{0.10} = 40$。决定留存是否值得的是新投资的回报，而不是现有业务的平均 ROE：15% 是过去投资的成果，新项目只赚 8%，低于股东要求的 10%，留存利润降低了股价。
      en: |-
        (a) The no-growth value is $\frac{4}{0.10} = 40$, so PVGO $= 60 - 40 = 20$, about 33.33% of the price: the market expects the company's future investments to create value.
        (b) Growth comes from the new investment: $g = 0.5 \times 8\% = 4\%$, $D_1 = 2$, $P_0 = \frac{2}{0.10 - 0.04} \approx 33.33$, below the $\frac{4}{0.10} = 40$ with full payout. What decides whether retaining is worthwhile is the return on new investment, not the average ROE of the existing business: 15% is the result of past investments, while the new projects earn only 8%, below the 10% shareholders require, so retaining profit lowers the price.
    rubric:
      zh-cn:
        - "(a) 20，约 33.33%。"
        - "(b) 4%，约 33.33，低于 40；指出应看新投资的回报而不是平均 ROE。"
      en:
        - "(a) 20; about 33.33%."
        - "(b) 4%, about 33.33, below 40; points out that the return on new investment matters, not the average ROE."

  - id: Q4
    kind: exercise
    level: B
    concepts: [gordon-growth-model, cost-of-equity]
    expected: { g: "5" }
    question:
      zh-cn: |-
        一只股票的价格为 80，明年预期股息 3.2，股权成本 9%。
        (a) 按 Gordon 模型，市场隐含的长期股息增长率是多少？
        (b) 假设经济的长期名义增长率约为 4%。为什么一家公司的股息不能永远比经济增长得更快？这个隐含增长率合理吗？
      en: |-
        A stock is priced at 80, next year's expected dividend is 3.2, and the cost of equity is 9%.
        (a) By the Gordon model, what long-run dividend growth rate does the market imply?
        (b) Suppose the economy's long-run nominal growth rate is about 4%. Why can a company's dividends not grow faster than the economy forever? Is the implied growth rate reasonable?
    answer:
      zh-cn: |-
        (a) $g = r - \frac{D_1}{P_0} = 9\% - \frac{3.2}{80} = 9\% - 4\% = 5\%$。
        (b) 如果一家公司的利润和股息永远比经济增长得快，它在经济中所占的比例会不断上升，最终超过整个经济，这是不可能的（[[2.2]]：长期利润增长受经济增长的约束）。5% 高于 4%，作为永远的增长率偏高；但如果它代表的是今后若干年的平均增长，高增长期之后再降到 4% 左右，就可能合理。也可能是市场高估了这家公司，或者股权成本的估计偏高。
      en: |-
        (a) $g = r - \frac{D_1}{P_0} = 9\% - \frac{3.2}{80} = 9\% - 4\% = 5\%$.
        (b) If a company's profit and dividends grew faster than the economy forever, its share of the economy would keep rising until it exceeded the whole economy, which is impossible ([[2.2]]: long-run profit growth is bounded by economic growth). 5% is above 4%, high as a growth rate forever; it can be reasonable if it stands for average growth over the coming years, falling to about 4% after a period of high growth. It is also possible that the market overvalues the company, or that the estimate of the cost of equity is too high.
    rubric:
      zh-cn:
        - "(a) 5%。"
        - "(b) 说明长期增长受经济增长约束，并合理评价 5%。"
      en:
        - "(a) 5%."
        - "(b) Explains that long-run growth is bounded by the economy and judges 5% reasonably."
