# Answer key for lesson 1.3. Shown to learners only inside generated grading prompts.
# Text fields support: $inline math$, $$display math$$, **bold**, line breaks,
# and references: [[0.1]] (lesson), [[1.3#real-rate]] (section), [[concept:euler-equation]], [[check:Q4]].
# expected: values are recomputed by course/verify/1.3.py in CI and must appear verbatim in every answer text.
#
# context: lesson facts for the grader. A grading prompt includes an item when
#   - the item has neither `concepts` nor `questions` (always included), or
#   - one of its `concepts` is tested by a question being graded, or
#   - one of its `questions` is being graded.
# common_errors: each item lists the `questions` it is relevant to. Only those go into a prompt.

lesson: "1.3"

context:
  - zh-cn: |-
      学习者学过现值与复利（[[0.1]]）、一阶条件（[[0.2]]）、无差异曲线、边际替代率、替代效应与收入效应（[[1.2]]）。还没有学不确定性下的选择和风险厌恶（[[1.4]]），也没有学债券与 TIPS（[[3.3]]、[[3.6]]）。
    en: |-
      The learner has studied present value and compounding ([[0.1]]), first-order conditions ([[0.2]]), and indifference curves, the marginal rate of substitution and substitution and income effects ([[1.2]]). The learner has not yet studied choice under uncertainty and risk aversion ([[1.4]]), or bonds and TIPS ([[3.3]], [[3.6]]).
  - concepts: [intertemporal-budget-constraint, time-preference, euler-equation, consumption-smoothing]
    zh-cn: |-
      讲义给出跨期预算约束 $c_1 + \frac{c_2}{1+r} = y_1 + \frac{y_2}{1+r} = W$，预算线经过收入点、斜率 $-(1+r)$；效用 $U = u(c_1) + \beta u(c_2)$，$\beta = \frac{1}{1+\rho}$；Euler 方程 $u'(c_1) = \beta(1+r)u'(c_2)$，$\beta(1+r) = 1$ 时 $c_1 = c_2$。讲义例子：$u = \ln c$，$\beta = 0.95$，$y_1 = 80$，$y_2 = 22$，$r = 10\%$，$W = 100$，$c_1 = \frac{100}{1.95} \approx 51.28$，$c_2 \approx 53.59$，储蓄 28.72。讲义没有给出对数效用下 $c_1$ 的一般公式。
    en: |-
      The lesson gives the intertemporal budget constraint $c_1 + \frac{c_2}{1+r} = y_1 + \frac{y_2}{1+r} = W$, a budget line through the income point with slope $-(1+r)$; utility $U = u(c_1) + \beta u(c_2)$ with $\beta = \frac{1}{1+\rho}$; the Euler equation $u'(c_1) = \beta(1+r)u'(c_2)$, with $c_1 = c_2$ when $\beta(1+r) = 1$. Example in the lesson: $u = \ln c$, $\beta = 0.95$, $y_1 = 80$, $y_2 = 22$, $r = 10\%$, $W = 100$, $c_1 = \frac{100}{1.95} \approx 51.28$, $c_2 \approx 53.59$, saving 28.72. The lesson does not give a general formula for $c_1$ under log utility.
  - concepts: [substitution-effect, income-effect]
    questions: [C3, Q2, Q3]
    zh-cn: |-
      讲义说明：利率上升时替代效应使 $c_1$ 下降；收入效应对储蓄者使 $c_1$ 上升、对借款者使 $c_1$ 下降；借款者一定少借，储蓄者储蓄的方向不确定。[[fig:3-1]] 为 $U = \ln c_1 + 0.95\ln c_2$、$y_1 = 80$，滑块 $r$ 从 0 到 30（%，步长 1），$y_2$ 从 0 到 60（步长 2），默认 $r = 10$、$y_2 = 22$。
    en: |-
      The lesson explains that when the interest rate rises, the substitution effect lowers $c_1$; the income effect raises $c_1$ for a saver and lowers it for a borrower; a borrower always borrows less, while the direction for a saver is ambiguous. [[fig:3-1]] uses $U = \ln c_1 + 0.95\ln c_2$ and $y_1 = 80$; the slider $r$ goes from 0 to 30 (%, step 1) and $y_2$ from 0 to 60 (step 2), with defaults $r = 10$ and $y_2 = 22$.
  - concepts: [inflation, nominal-interest-rate, real-interest-rate, fisher-equation]
    zh-cn: |-
      讲义给出 Fisher 方程 $1 + r = \frac{1+i}{1+\pi}$，$r \approx i - \pi$（例：5% 与 3% 得 1.94%）；区分事前和事后实际利率（通胀高于预期时借款者受益）；名义现金流用名义利率折现，实际现金流用实际利率折现。讲义提醒这里的“名义”与 [[0.1]] 的名义年利率（APR）不同。讲义没有讨论利息税。
    en: |-
      The lesson gives the Fisher equation $1 + r = \frac{1+i}{1+\pi}$, $r \approx i - \pi$ (example: 5% and 3% give 1.94%); distinguishes ex ante and ex post real rates (borrowers gain when inflation is higher than expected); and states that nominal cash flows are discounted at nominal rates and real cash flows at real rates. The lesson notes that "nominal" here differs from the nominal annual rate (APR) of [[0.1]]. The lesson does not discuss taxes on interest.

common_errors:
  - questions: [Q2]
    zh-cn: |-
      以为利率上升一定使储蓄增加。对储蓄者，替代效应和收入效应方向相反；明天也有收入时，利率上升还会降低未来收入的现值。
    en: |-
      Thinking a higher interest rate must raise saving. For a saver the substitution and income effects conflict; when there is also income tomorrow, a higher rate also lowers the present value of that income.
  - questions: [Q3]
    zh-cn: |-
      以为借钱要付利息，所以不借款总是更好。对未来收入高的人，借款能平滑消费、提高效用；能借款时原来的选择仍然可行。
    en: |-
      Thinking that because borrowing costs interest, not borrowing is always better. For someone with high future income, borrowing smooths consumption and raises utility, and the old choice remains available.
  - questions: [C1, Q1]
    zh-cn: |-
      把跨期预算约束写成 $c_1 + c_2 = y_1 + y_2$，忽略利息；或把明天的收入按 $(1 + r)$ 相乘而不是相除。
    en: |-
      Writing the intertemporal budget constraint as $c_1 + c_2 = y_1 + y_2$, ignoring interest; or multiplying tomorrow's income by $(1 + r)$ instead of dividing.
  - questions: [Q1, Q5]
    zh-cn: |-
      把 Euler 方程决定的消费增长方向当作储蓄方向：$\beta(1+r) > 1$ 只说明 $c_2 > c_1$，是否储蓄还取决于收入在两期的分布。
    en: |-
      Reading the direction of consumption growth from the Euler equation as the direction of saving: $\beta(1+r) > 1$ only says $c_2 > c_1$; whether the consumer saves also depends on how income is spread over the two periods.
  - questions: [C4, Q4, Q6]
    zh-cn: |-
      用名义利率折现实际现金流（或反过来）；或在 Fisher 方程中把 $i$ 和 $\pi$ 用错位置。
    en: |-
      Discounting real cash flows at a nominal rate (or the reverse), or putting $i$ and $\pi$ in the wrong places in the Fisher equation.

questions:
  # ---------- Check questions (随堂题) ----------
  - id: C1
    kind: check
    section: two-period
    concepts: [intertemporal-budget-constraint]
    question:
      zh-cn: |-
        利率上升时，跨期预算线变陡。所以利率上升让每个消费者能选择的消费组合都变多了。
      en: |-
        When the interest rate rises, the intertemporal budget line gets steeper. So a higher interest rate gives every consumer more consumption bundles to choose from.
    correct: false
    hint:
      zh-cn: 预算线绕哪一点转动？收入点左边（储蓄）和右边（借款）的部分各向哪个方向移动？
      en: Around which point does the budget line turn? Which way do the parts to the left (saving) and to the right (borrowing) of the income point move?
    answer:
      zh-cn: |-
        错。不论利率多高，消费者总能不借不存、消费自己的收入，所以预算线总是经过收入点 $(y_1, y_2)$，利率上升时绕这一点变陡。收入点左边（储蓄）的部分向外移，储蓄者能选的组合变多；右边（借款）的部分向内移，借款者能选的组合变少。
      en: |-
        False. Whatever the rate, the consumer can neither borrow nor save and consume his income, so the budget line always passes through the income point $(y_1, y_2)$ and turns around it, getting steeper as the rate rises. The part to the left (saving) moves out, so savers have more choices; the part to the right (borrowing) moves in, so borrowers have fewer.

  - id: C2
    kind: check
    section: optimal-consumption
    concepts: [euler-equation, time-preference]
    question:
      zh-cn: |-
        一个消费者的 $\beta\,(1 + r) = 1$，$u$ 是凹函数。他的最优消费：
      en: |-
        A consumer has $\beta\,(1 + r) = 1$, and $u$ is concave. His optimal consumption:
    choices:
      - zh-cn: 两期相同，不论收入在两期怎样分布
        en: Is the same in both periods, however his income is spread over them
      - zh-cn: 与两期的收入成比例
        en: Is proportional to his income in each period
        why:
          zh-cn: Euler 方程在 $\beta\,(1 + r) = 1$ 时要求什么？它和收入的分布有关吗？
          en: What does the Euler equation require when $\beta\,(1 + r) = 1$? Does that depend on how income is spread?
      - zh-cn: 全部集中在今天，因为他更看重现在
        en: Is all today, because he cares more about the present
        why:
          zh-cn: 他确实更看重现在，但利率对此有补偿。$u$ 是凹函数时，把消费集中在一期好吗？
          en: He does care more about the present, but the interest rate compensates for it. With concave $u$, is it good to put all consumption in one period?
      - zh-cn: 取决于收入在两期的分布：收入多的那一期消费也多
        en: 'Depends on the spread of income: he consumes more in the period with more income'
        why:
          zh-cn: 收入的分布决定的是他储蓄还是借款。消费在两期之间的比例由什么决定？
          en: The spread of income decides whether he saves or borrows. What decides the ratio of consumption in the two periods?
    correct: A
    answer:
      zh-cn: |-
        (A)。Euler 方程 $u'(c_1) = \beta\,(1 + r)\,u'(c_2)$ 在 $\beta\,(1 + r) = 1$ 时变为 $u'(c_1) = u'(c_2)$，$u$ 是凹函数，所以 $c_1 = c_2$：消费完全平滑。收入的分布只决定他靠储蓄还是借款来实现这一点，以及消费的水平（由财富决定）。
      en: |-
        (A). The Euler equation $u'(c_1) = \beta\,(1 + r)\,u'(c_2)$ becomes $u'(c_1) = u'(c_2)$ when $\beta\,(1 + r) = 1$, and with concave $u$ this means $c_1 = c_2$: consumption is fully smoothed. The spread of income only decides whether he gets there by saving or by borrowing, and the level of consumption (set by his wealth).

  - id: C3
    kind: check
    section: interest-rate
    concepts: [substitution-effect, income-effect, intertemporal-budget-constraint]
    widget: { id: fisher, set: { r: 20 } }
    question:
      zh-cn: |-
        利率上升时，下面哪种说法正确？
      en: |-
        When the interest rate rises, which statement is correct?
    choices:
      - zh-cn: 借款者一定少借；储蓄者可能多储蓄，也可能少储蓄
        en: Borrowers certainly borrow less; savers may save more or less
      - zh-cn: 所有人都会多储蓄，因为储蓄的回报更高
        en: Everyone saves more, because saving pays more
        why:
          zh-cn: 对储蓄者，利率上升还使他变得更富有。变富时他想增加哪些时期的消费？
          en: For a saver, a higher rate also makes him richer. When richer, in which periods does he want to consume more?
      - zh-cn: 储蓄者一定多储蓄；借款者可能多借，也可能少借
        en: Savers certainly save more; borrowers may borrow more or less
        why:
          zh-cn: 对借款者，利率上升使他变富还是变穷？替代效应和收入效应的方向是否相同？
          en: Does a higher rate make a borrower richer or poorer? Do his substitution and income effects point the same way?
      - zh-cn: 所有人今天的消费都会增加
        en: Everyone's consumption today rises
        why:
          zh-cn: 利率上升时，今天消费的“价格” $1 + r$ 怎样变化？
          en: When the rate rises, what happens to the "price" of consumption today, $1 + r$?
    correct: A
    answer:
      zh-cn: |-
        (A)。替代效应对所有人都一样：今天的消费变贵，$c_1$ 下降。收入效应取决于身份：借款者要付更多利息，变得更穷，$c_1$ 也下降，两个效应同向，借款一定减少；储蓄者得到更多利息，变得更富有，想增加 $c_1$，两个效应反向，储蓄的变化取决于哪个更强。
      en: |-
        (A). The substitution effect is the same for everyone: consumption today becomes dearer and $c_1$ falls. The income effect depends on the position: a borrower pays more interest and is poorer, so $c_1$ also falls; both effects agree and borrowing must fall. A saver earns more interest and is richer, so he wants more $c_1$; the effects conflict, and saving changes according to which is stronger.

  - id: C4
    kind: check
    section: real-rate
    concepts: [fisher-equation, real-interest-rate, nominal-interest-rate, inflation]
    question:
      zh-cn: |-
        一年期贷款的名义利率是 6%，签约时双方预期通胀为 4%。一年后实际通胀是 7%。贷款者从意外的通胀中受益。
      en: |-
        A one-year loan has a nominal rate of 6%, and when it is signed both sides expect 4% inflation. Actual inflation turns out to be 7%. The lender benefits from the unexpected inflation.
    correct: false
    hint:
      zh-cn: 名义还款额是固定的。通胀高于预期时，贷款者收回的钱能买到的东西比预期的多还是少？
      en: The nominal repayment is fixed. When inflation is higher than expected, does the money the lender gets back buy more or less than expected?
    answer:
      zh-cn: |-
        错。名义还款额在签约时已经固定。事前的实际利率约为 $\frac{1.06}{1.04} - 1 \approx 1.92\%$，事后的实际利率为 $\frac{1.06}{1.07} - 1 \approx -0.93\%$：贷款者收回的钱的购买力比借出时还少。意外的通胀使购买力从贷款者转移到借款者，借款者受益。
      en: |-
        False. The nominal repayment was fixed at signing. The ex ante real rate was about $\frac{1.06}{1.04} - 1 \approx 1.92\%$, and the ex post real rate is $\frac{1.06}{1.07} - 1 \approx -0.93\%$: the money the lender gets back buys less than what he lent. Unexpected inflation moves purchasing power from the lender to the borrower, who benefits.

  # ---------- Exercises (reviewed by the AI, not scored) ----------
  - id: Q1
    kind: exercise
    level: A
    concepts: [euler-equation, intertemporal-budget-constraint]
    expected: { c1: "51.28", b: "31.28" }
    question:
      zh-cn: |-
        判断真假并说明理由：如果 $\beta\,(1 + r) > 1$，消费者明天的消费比今天多，所以他今天一定在储蓄。用 $u = \ln c$、$\beta = 0.95$、$r = 10\%$、$y_1 = 20$、$y_2 = 88$ 检验。
      en: |-
        Determine whether this statement is true or false, and explain: if $\beta\,(1 + r) > 1$, the consumer consumes more tomorrow than today, so he must be saving today. Check it with $u = \ln c$, $\beta = 0.95$, $r = 10\%$, $y_1 = 20$ and $y_2 = 88$.
    answer:
      zh-cn: |-
        假。Euler 方程只决定消费的增长方向（$c_2 > c_1$），是否储蓄还取决于收入在两期的分布。
        检验：$W = 20 + \frac{88}{1.1} = 100$，$c_1 = \frac{100}{1.95} \approx 51.28$，$c_2 = 1.045 \times 51.28 \approx 53.59 > c_1$，但今天的收入只有 20，他要借款约 31.28。收入集中在未来的人（如学生）即使消费随时间增长，今天也可能在借款。
      en: |-
        False. The Euler equation determines only the direction of consumption growth ($c_2 > c_1$); whether the consumer saves also depends on how income is spread over the two periods.
        Check: $W = 20 + \frac{88}{1.1} = 100$, $c_1 = \frac{100}{1.95} \approx 51.28$ and $c_2 = 1.045 \times 51.28 \approx 53.59 > c_1$, but today's income is only 20, so he borrows about 31.28. People whose income comes mostly in the future (such as students) may borrow today even though their consumption grows over time.
    rubric:
      zh-cn:
        - "结论为假。"
        - "算出 $c_1 \\approx 51.28$，借款约 31.28。"
        - "区分消费增长方向与储蓄方向。"
      en:
        - "States false."
        - "Finds $c_1 \\approx 51.28$ and borrowing of about 31.28."
        - "Separates the direction of consumption growth from the direction of saving."

  - id: Q2
    kind: exercise
    level: C
    star: true
    concepts: [euler-equation, substitution-effect, income-effect, intertemporal-budget-constraint]
    question:
      zh-cn: |-
        $u(c) = \ln c$，财富 $W = y_1 + \frac{y_2}{1 + r}$。
        (a) 证明 $c_1 = \frac{W}{1 + \beta}$，$c_2 = \frac{\beta\,(1 + r)\,W}{1 + \beta}$。
        (b) 说明：明天没有收入（$y_2 = 0$）时储蓄与利率无关，而 $y_2 > 0$ 时利率上升使储蓄增加。用替代效应和收入效应解释。
      en: |-
        $u(c) = \ln c$ and wealth is $W = y_1 + \frac{y_2}{1 + r}$.
        (a) Show that $c_1 = \frac{W}{1 + \beta}$ and $c_2 = \frac{\beta\,(1 + r)\,W}{1 + \beta}$.
        (b) Show that with no income tomorrow ($y_2 = 0$) saving does not depend on the interest rate, while with $y_2 > 0$ a higher rate raises saving. Explain using the substitution and income effects.
    answer:
      zh-cn: |-
        (a) Euler 方程 $\frac{1}{c_1} = \frac{\beta\,(1 + r)}{c_2}$ 给出 $c_2 = \beta\,(1 + r)\,c_1$。代入 $c_1 + \frac{c_2}{1 + r} = W$：$c_1\,(1 + \beta) = W$，所以 $c_1 = \frac{W}{1 + \beta}$，$c_2 = \frac{\beta\,(1 + r)\,W}{1 + \beta}$。
        (b) $y_2 = 0$ 时 $W = y_1$，$s = y_1 - \frac{y_1}{1 + \beta} = \frac{\beta\,y_1}{1 + \beta}$，不含 $r$：利率上升时，替代效应使今天少消费，收入效应（储蓄者变富）使今天多消费，对数效用下两者正好抵消。$y_2 > 0$ 时，$c_1 = \frac{1}{1 + \beta}\left(y_1 + \frac{y_2}{1 + r}\right)$，利率上升还使明天收入的现值下降、财富减少，$c_1$ 下降，储蓄增加。
      en: |-
        (a) The Euler equation $\frac{1}{c_1} = \frac{\beta\,(1 + r)}{c_2}$ gives $c_2 = \beta\,(1 + r)\,c_1$. Substituting into $c_1 + \frac{c_2}{1 + r} = W$: $c_1\,(1 + \beta) = W$, so $c_1 = \frac{W}{1 + \beta}$ and $c_2 = \frac{\beta\,(1 + r)\,W}{1 + \beta}$.
        (b) With $y_2 = 0$, $W = y_1$ and $s = y_1 - \frac{y_1}{1 + \beta} = \frac{\beta\,y_1}{1 + \beta}$, which does not contain $r$: when the rate rises, the substitution effect lowers consumption today and the income effect (the saver is richer) raises it, and with log utility they cancel exactly. With $y_2 > 0$, $c_1 = \frac{1}{1 + \beta}\left(y_1 + \frac{y_2}{1 + r}\right)$; a higher rate also lowers the present value of tomorrow's income and so wealth, so $c_1$ falls and saving rises.
    rubric:
      zh-cn:
        - "(a) 由 Euler 方程和预算约束推出。"
        - "(b) 两种情形都说明，并用两种效应解释。"
      en:
        - "(a) Derived from the Euler equation and the budget constraint."
        - "(b) Both cases shown and explained with the two effects."

  - id: Q3
    kind: exercise
    level: B
    concepts: [substitution-effect, income-effect, intertemporal-budget-constraint]
    expected: { b10: "31.54", b20: "27.69" }
    question:
      zh-cn: |-
        一个学生今天收入 $y_1 = 30$，毕业后收入 $y_2 = 99$，$u = \ln c$，$\beta = 0.95$。
        (a) 利率从 10% 升到 20% 时，他今天的借款从多少变为多少？
        (b) 如果他根本借不到钱，利率为 10% 时他两期各消费多少？与能按 10% 借款时相比，他的效用是更高还是更低？由此说明学生贷款为什么能提高学生的福利，即使他要付利息。
      en: |-
        A student has income $y_1 = 30$ today and $y_2 = 99$ after graduating, with $u = \ln c$ and $\beta = 0.95$.
        (a) When the interest rate rises from 10% to 20%, how does his borrowing today change?
        (b) If he cannot borrow at all, how much does he consume in each period at a 10% rate? Is his utility higher or lower than when he can borrow at 10%? Use this to explain why student loans can make students better off even though they pay interest.
    answer:
      zh-cn: |-
        (a) 10%：$W = 30 + \frac{99}{1.1} = 120$，$c_1 = \frac{120}{1.95} \approx 61.54$，借款约 31.54。20%：$W = 30 + \frac{99}{1.2} = 112.5$，$c_1 \approx 57.69$，借款约 27.69。
        (b) 借不到钱时只能 $c_1 = 30$，$c_2 = 99$，效用 $\ln 30 + 0.95 \ln 99 \approx 7.77$。能借款时 $c_1 \approx 61.54$，$c_2 = 1.045 \times 61.54 \approx 64.31$，效用 $\ln 61.54 + 0.95 \ln 64.31 \approx 8.08$，更高。借不到钱时，他今天消费很少、明天很多，$u$ 是凹的，这种大起大落的消费效用很低。借款让他把未来的收入挪到今天，平滑消费；只要利率不太高，付出的利息小于平滑消费带来的好处。原来的选择在能借款时仍然可行，所以能借款不会使他变差。
      en: |-
        (a) At 10%: $W = 30 + \frac{99}{1.1} = 120$, $c_1 = \frac{120}{1.95} \approx 61.54$, borrowing about 31.54. At 20%: $W = 30 + \frac{99}{1.2} = 112.5$, $c_1 \approx 57.69$, borrowing about 27.69.
        (b) Without borrowing he must consume $c_1 = 30$ and $c_2 = 99$, with utility $\ln 30 + 0.95 \ln 99 \approx 7.77$. With borrowing, $c_1 \approx 61.54$ and $c_2 = 1.045 \times 61.54 \approx 64.31$, with utility $\ln 61.54 + 0.95 \ln 64.31 \approx 8.08$, which is higher. Without borrowing he consumes little today and a lot tomorrow, and with concave $u$ such uneven consumption gives low utility. Borrowing moves future income to today and smooths consumption; as long as the rate is not too high, the interest paid is less than the gain from smoothing. The old choice is still available when he can borrow, so being able to borrow cannot make him worse off.
    rubric:
      zh-cn:
        - "(a) 借款约 31.54 和 27.69。"
        - "(b) 借不到钱时消费 30 和 99，效用更低；用消费平滑解释借款的好处。只说“借款要付利息，所以不借更好”：需要订正。"
      en:
        - "(a) Borrowing about 31.54 and 27.69."
        - "(b) Consumption of 30 and 99 without borrowing, with lower utility; explains the gain from borrowing through consumption smoothing. Saying only that borrowing costs interest so not borrowing is better: needs revision."

  - id: Q4
    kind: exercise
    level: B
    concepts: [real-interest-rate, fisher-equation, present-value]
    expected: { r: "2.94", pv: "7484", wrong: "6139" }
    question:
      zh-cn: |-
        一份合同承诺 10 年后支付一笔钱，其购买力相当于今天的 10,000 美元（金额随通胀增长）。名义利率为 5%，预期通胀每年 2%。
        (a) 用实际利率计算这份合同的现值。
        (b) 有人直接用 5% 折现 10,000 美元。他算出多少？错在哪里？
      en: |-
        A contract promises a payment in 10 years with the purchasing power of 10,000 dollars today (the amount grows with inflation). The nominal rate is 5% and expected inflation 2% a year.
        (a) Use the real rate to find the present value of the contract.
        (b) Someone discounts 10,000 dollars at 5% directly. What does he get? What is wrong?
    answer:
      zh-cn: |-
        (a) 实际利率 $\frac{1.05}{1.02} - 1 \approx 2.94$%，现值 $\frac{10{,}000}{1.0294^{10}} \approx 7484$ 美元。（先算名义金额 $10{,}000 \times 1.02^{10}$ 再用 5% 折现，结果相同。）
        (b) $\frac{10{,}000}{1.05^{10}} \approx 6139$ 美元。10,000 美元是用今天的购买力表示的实际金额，却用名义利率折现，相当于把通胀扣了两次，低估了现值。
      en: |-
        (a) The real rate is $\frac{1.05}{1.02} - 1 \approx 2.94$%, and the present value is $\frac{10{,}000}{1.0294^{10}} \approx 7484$ dollars. (Computing the nominal amount $10{,}000 \times 1.02^{10}$ and discounting at 5% gives the same result.)
        (b) $\frac{10{,}000}{1.05^{10}} \approx 6139$ dollars. The 10,000 dollars is a real amount in today's purchasing power, but it is discounted at a nominal rate, which takes out inflation twice and understates the present value.
    rubric:
      zh-cn:
        - "(a) 约 7484 美元。"
        - "(b) 约 6139 美元，说明名义与实际不一致。"
      en:
        - "(a) About 7484 dollars."
        - "(b) About 6139 dollars, explaining the nominal / real mismatch."

  - id: Q5
    kind: exercise
    level: C
    concepts: [euler-equation, consumption-smoothing, real-interest-rate]
    expected: { r: "4.17", s: "48.98" }
    question:
      zh-cn: |-
        (a) 一个人的 $\beta = 0.96$。实际利率为多少时，他的消费在两期之间完全平滑？
        (b) 有人说：“实际利率为负时，储蓄就是亏钱，所以理性的人不会储蓄。”用 $u = \ln c$、$\beta = 0.96$、$y_1 = 100$、$y_2 = 0$（例如明天退休、没有收入）、实际利率 −2% 评价这个说法。
      en: |-
        (a) A person has $\beta = 0.96$. At what real interest rate is his consumption perfectly smooth over the two periods?
        (b) Someone says: "When the real interest rate is negative, saving loses money, so a rational person does not save." Evaluate this with $u = \ln c$, $\beta = 0.96$, $y_1 = 100$, $y_2 = 0$ (for example, he retires tomorrow and has no income) and a real rate of −2%.
    answer:
      zh-cn: |-
        (a) 需要 $\beta\,(1 + r) = 1$，$r = \frac{1}{0.96} - 1 \approx 4.17$%。
        (b) 说法错误。不储蓄意味着明天消费为 0，对数效用下这是最差的选择。由 $c_1 = \frac{W}{1 + \beta}$，$W = 100$，$c_1 = \frac{100}{1.96} \approx 51.02$，储蓄约 48.98，明天消费 $48.98 \times 0.98 \approx 48.0$。储蓄的目的是平滑消费，即使回报为负，把一部分购买力带到收入很低的时期仍然值得。
      en: |-
        (a) This requires $\beta\,(1 + r) = 1$, so $r = \frac{1}{0.96} - 1 \approx 4.17$%.
        (b) The statement is wrong. Not saving means zero consumption tomorrow, the worst possible outcome with log utility. From $c_1 = \frac{W}{1 + \beta}$ with $W = 100$, $c_1 = \frac{100}{1.96} \approx 51.02$, so he saves about 48.98 and consumes $48.98 \times 0.98 \approx 48.0$ tomorrow. The purpose of saving is to smooth consumption; even with a negative return, carrying some purchasing power into a period with very low income is worthwhile.
    rubric:
      zh-cn:
        - "(a) 约 4.17%。"
        - "(b) 储蓄约 48.98，并用消费平滑解释为什么负实际利率下仍会储蓄。"
      en:
        - "(a) About 4.17%."
        - "(b) Saving of about 48.98, explained by consumption smoothing despite the negative real rate."

  - id: Q6
    kind: exercise
    level: B
    concepts: [real-interest-rate, nominal-interest-rate, fisher-equation, inflation]
    expected: { real3: "0", real5: "-1.9" }
    question:
      zh-cn: |-
        银行存款的名义利率为 4%，利息要缴 25% 的税（按名义利息计税；税率为本题假设）。通胀为 3% 和 5% 时，税后实际利率各是多少？为什么通胀越高，按名义利息征税对储蓄者的伤害越大？
      en: |-
        A bank deposit pays a nominal rate of 4%, and interest is taxed at 25% (on nominal interest; the tax rate is an assumption of this question). What is the after-tax real rate when inflation is 3% and when it is 5%? Why does taxing nominal interest hurt savers more when inflation is higher?
    answer:
      zh-cn: |-
        税后名义利率 $4\% \times (1 - 0.25) = 3\%$。通胀 3% 时 $\frac{1.03}{1.03} - 1 = 0$；通胀 5% 时 $\frac{1.03}{1.05} - 1 \approx -1.9$%（税前也只有约 −0.95%）。
        名义利息中有一部分只是补偿通胀，并不是真实收益，却也要交税。通胀越高，这部分“假收益”越多，税后实际利率下降得越多。
      en: |-
        The after-tax nominal rate is $4\% \times (1 - 0.25) = 3\%$. With 3% inflation, $\frac{1.03}{1.03} - 1 = 0$; with 5% inflation, $\frac{1.03}{1.05} - 1 \approx -1.9$% (before tax it is only about −0.95%).
        Part of nominal interest only makes up for inflation and is not a real gain, yet it is taxed too. The higher inflation is, the larger this "false gain", and the further the after-tax real rate falls.
    rubric:
      zh-cn:
        - "0 和约 −1.9%（写作 - 或 − 均可）。"
        - "说明对补偿通胀的部分征税。"
      en:
        - "0 and about −1.9% (written with - or −)."
        - "Explains that the part compensating for inflation is taxed."
