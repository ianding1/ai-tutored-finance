    本档案中的人物、雇主、银行、保险公司和基金都是虚构的，数字是为课程设计的。税务和账户规则按 2026 年的美国规定；市场利率是场景设定，不是真实行情。档案日期为 2026 年 1 月 2 日，金额单位为美元。
