  - id: interview
    title: { zh-cn: "初次面谈记录（节选）", en: "First meeting notes (excerpts)" }
    text:
      zh-cn: |-
        **顾问**：先说说你们最关心的事情吧。

        **Mark**：最重要的是 2030 年换房，Ella 那年秋天上小学，我们想搬到好一点的学区。钱应该没问题，Summit 那个基金过去三年涨了 40% 多。

        **Lisa**：可是那个基金 2022 年跌得很厉害，我那年好几个月都睡不好。首付的钱我希望是稳的。搬家最多只能晚半年，不然 Ella 就要在旧学区先上一年。

        **Mark**：我们年轻，能承担风险。我在表上写的是 9 分。2022 年我一股都没卖。

        **顾问**：家里每个月大概花多少？

        **Mark**：八千左右吧。

        **Lisa**：不止吧？托儿所一个月就两千多，还有房贷。

        **Mark**：哦，我说的是日常开销，房贷和托儿费没算在里面。

        **顾问**：NWCD 的股票你们怎么看？

        **Mark**：公司很好，我天天在里面工作，比外面的分析师都了解。RSU 我从来不卖，一卖就要交很多税。最近公司在冻结招聘，有传言说明年要裁员，不过我们组应该没事。

        **顾问**：退休有什么打算？

        **Mark**：我想 55 岁退休，像网上那些 FIRE 的人一样。

        **Lisa**：我挺喜欢教书的，至少要教到 60 岁。我们没商量过这个。

        **顾问**：孩子上大学呢？表上写的是负担一半。

        **Lisa**：我希望我们能全部负担，不想让孩子背学生贷款。

        **Mark**：那要存很多钱啊……我们再讨论吧。

        **Lisa**：还有，我爸妈的退休金不多，也许十年后要我们每个月帮一点，具体多少还不知道。

        **顾问**：保险方面呢？

        **Lisa**：我有一份终身寿险，是我妈妈的朋友 2015 年卖给我的，她说既是保险又是投资。我们交了十年保费了，现在退掉太亏了。

        **Mark**：我公司有寿险和伤残险，应该够了。

        **顾问**：有遗嘱吗？

        **Mark**：还没有，一直想做。

        **Lisa**：对了，我们的邻居说应该先把房贷还清，没有负债最安全。你觉得呢？
      en: |-
        **Adviser**: Let's start with what matters most to you.

        **Mark**: The most important thing is moving in 2030. Ella starts elementary school that fall, and we want to be in a better school district. The money should be fine; that Summit fund is up more than 40% over the past three years.

        **Lisa**: But that fund fell hard in 2022, and I couldn't sleep for months that year. I want the down-payment money to be safe. We can move at most six months late; otherwise Ella would have to spend a year in the old district.

        **Mark**: We're young, we can take risk. I put 9 on the form. I didn't sell a single share in 2022.

        **Adviser**: About how much do you spend a month?

        **Mark**: Around eight thousand.

        **Lisa**: Isn't it more? Childcare alone is over two thousand a month, and there's the mortgage.

        **Mark**: Oh, I meant everyday spending, without the mortgage and childcare.

        **Adviser**: What do you think about the NWCD stock?

        **Mark**: It's a great company. I work there every day, so I know it better than any outside analyst. I never sell my RSUs; selling means paying a lot of tax. The company has a hiring freeze right now, and there are rumors of layoffs next year, but my team should be fine.

        **Adviser**: What are your plans for retirement?

        **Mark**: I want to retire at 55, like the FIRE people online.

        **Lisa**: I like teaching. I want to teach until at least 60. We haven't talked about this.

        **Adviser**: And college for the children? The form says you'll pay half.

        **Lisa**: I'd like us to pay all of it. I don't want the kids to have student loans.

        **Mark**: That's a lot of saving... let's talk about it later.

        **Lisa**: Also, my parents don't have much retirement income. In ten years or so they might need some help from us each month; we don't know how much yet.

        **Adviser**: What about insurance?

        **Lisa**: I have a whole life policy. My mom's friend sold it to me in 2015; she said it's both insurance and an investment. We've paid premiums for ten years, so cancelling it now would be a big loss.

        **Mark**: My company gives me life and disability insurance. That should be enough.

        **Adviser**: Do you have wills?

        **Mark**: Not yet. We keep meaning to.

        **Lisa**: Oh, and our neighbor says we should pay off the mortgage first, because having no debt is safest. What do you think?

  - id: advice
    title: { zh-cn: "客户转来的材料", en: "Material the clients forwarded" }
    text:
      zh-cn: |-
        **1. SecureFuture 销售代理给 Lisa 的信（节选）**：“您的 403(b) 年金账户十年来表现稳健。建议您把账户转入我们新推出的指数年金：参与标普 500 上涨的 60%（每年上限 9%），市场下跌时本金零损失。另外，建议为两个孩子各买一份指数型万能寿险（IUL），作为免税的大学储蓄。”

        **2. 邻居的建议（Lisa 转述）**：“先把房贷还清，没有负债最安全。我们去年就还清了，感觉特别好。”

        **3. 一篇新闻（Mark 转发）**：“多位策略师警告，科技股估值处于 2000 年以来最高水平，建议投资者把一部分资金转为现金，等待回调。”

        **4. 一个智能投顾网站的问卷结果（Mark 填写）**：“年龄 38 岁，风险偏好：进取。建议配置：股票 90%，债券 10%。”

        **5. Mark 同事的话**：“NWCD 未来三年市值肯定翻倍，RSU 千万别卖。”
      en: |-
        **1. A letter from the SecureFuture sales agent to Lisa (excerpt)**: "Your 403(b) annuity account has performed steadily for ten years. We recommend moving it into our new indexed annuity: you receive 60% of the S&P 500's gains (capped at 9% a year), with zero loss of principal when markets fall. We also recommend an indexed universal life (IUL) policy for each child as tax-free college savings."

        **2. The neighbor's advice (as Lisa reports it)**: "Pay off the mortgage first. Having no debt is safest. We paid ours off last year and it feels great."

        **3. A news article (forwarded by Mark)**: "Several strategists warn that tech valuations are the highest since 2000 and advise investors to move some money to cash and wait for a pullback."

        **4. A robo-adviser questionnaire result (filled in by Mark)**: "Age 38, risk profile: aggressive. Suggested allocation: 90% stocks, 10% bonds."

        **5. What a coworker told Mark**: "NWCD's market value will definitely double in the next three years. Never sell your RSUs."
