      zh-cn: |-
        Mark 的 401(k) 菜单还有：总债券市场指数基金（0.03%）、国际股票指数基金（0.05%）、稳定价值基金（0.30%）、2050 和 2055 年目标日期指数基金（0.08%）。计划允许超级后门 Roth（税后存款并转为 Roth），Mark 从未使用。

        Lisa 的学区 403(b) 有两家供应商：她 2016 年由一位上门的销售代理开户的 SecureFuture 变额年金（年费用合计 1.60%；2026 年内转出要付 4% 的退保费，2027 年 3%，2028 年起为 0），以及另一家提供指数基金的供应商（标普 500 指数 0.04%、总债券指数 0.05%、目标日期指数基金 0.10%）。转到另一家供应商不需要交税。
      en: |-
        Mark's 401(k) menu also has: a total bond market index fund (0.03%), an international stock index fund (0.05%), a stable value fund (0.30%), and 2050 and 2055 target-date index funds (0.08%). The plan allows the mega backdoor Roth (after-tax contributions converted to Roth), which Mark has never used.

        Lisa's district 403(b) has two providers: the SecureFuture variable annuity, opened in 2016 through a sales agent who visited the school (total annual cost 1.60%; moving out costs a 4% surrender charge in 2026, 3% in 2027 and 0 from 2028), and another provider of index funds (S&P 500 index 0.04%, total bond index 0.05%, target-date index funds 0.10%). Moving to the other provider is not taxed.

